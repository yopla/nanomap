<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Micro-Marche & Zoom (RRLE)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: zoom-in; }
  canvas.zoomed { cursor: crosshair; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "rrle",
  "name": "Micro-Marche & Zoom (RRLE)",
  "family": "income",
  "icon": "🔬",
  "controls": "Maintenir clic/doigt (ou Espace + Flèches/ZQSD) pour zoomer 4× et verrouiller les mutants dorés",
  "description": "Marche aléatoire de circuits lumineux sur grille 155×155 avec zoom optique fluide 4×.",
  "goal": "Zoomer et échantillonner 8 particules mutantes dorées avant la fin du temps.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🔬 <b>Micro-Marche RRLE</b></span>
  <span id="stat">Mutants: 0/8 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "rrle";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Faithful 155x155 ErectBitmap offscreen buffer
const W = 155, H = 155;
const DIR = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const off = document.createElement("canvas");
off.width = W; off.height = H;
const octx = off.getContext("2d");
const baseCanvas = document.createElement("canvas");
baseCanvas.width = W; baseCanvas.height = H;
const bctx = baseCanvas.getContext("2d");

// Prebuild dark checkerboard base matching ErectBitmap
bctx.fillStyle = "#111b2e";
bctx.fillRect(0, 0, W, H);
bctx.fillStyle = "#080d17";
for (let i = 1; i < W; i += 2) {
  for (let j = 1; j < H; j += 2) {
    bctx.fillRect(i, j, 1, 1);
  }
}

// DynamicSprite smooth zoom state
let cam = { x: 0, y: 0, scale: 1, focusX: 0, focusY: 0, rate: 1, speed: 7 };
let points = [], mutants = [], bursts = [], keys = {};
let down = false, mx = 256, my = 256, frameCount = 0, simAccum = 0;
let timeLeft = 45, score = 0, captured = 0, targetCaptures = 8, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function zoomTo(fx, fy, r, s = 7) {
  cam.speed = s;
  cam.rate = Math.max(1, Math.min(8, r));
  cam.focusX = -fx * cam.rate + 256;
  cam.focusY = -fy * cam.rate + 256;
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPtr(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width))),
    y: Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = getPtr(e);
  mx = pt.x; my = pt.y;
  down = true;
  cv.classList.add("zoomed");
  zoomTo(mx, my, 4, 7);
});
cv.addEventListener("pointermove", (e) => {
  const pt = getPtr(e);
  mx = pt.x; my = pt.y;
  if (down && !over) zoomTo(mx, my, 4, 7);
});
window.addEventListener("pointerup", () => {
  down = false;
  cv.classList.remove("zoomed");
});

const PALETTE = ["#38d6ff", "#818cf8", "#2dd4bf", "#c084fc", "#f472b6", "#60a5fa", "#34d399"];

function addPoint() {
  const d = DIR[Math.floor(Math.random() * 4)];
  const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  points.push({ x: Math.floor(W / 2), y: Math.floor(H / 2), dir: d, color });
}

function spawnMutant() {
  const ang = Math.random() * Math.PI * 2;
  const dist = 16 + Math.random() * 48;
  const x = Math.max(12, Math.min(W - 13, Math.round(W / 2 + Math.cos(ang) * dist)));
  const y = Math.max(12, Math.min(H - 13, Math.round(H / 2 + Math.sin(ang) * dist)));
  mutants.push({ x, y, dir: DIR[Math.floor(Math.random() * 4)], lock: 0 });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; captured = 0; won = false; over = false;
  down = false; mx = 256; my = 256; frameCount = 0; simAccum = 0;
  cam = { x: 0, y: 0, scale: 1, focusX: 0, focusY: 0, rate: 1, speed: 7 };
  bursts = [];
  octx.drawImage(baseCanvas, 0, 0);
  points = [];
  for (let i = 0; i < 240; i++) addPoint();
  mutants = [];
  for (let i = 0; i < 4; i++) spawnMutant();
}

function stepErectBitmap() {
  frameCount++;
  // Fade toward checkerboard base (like bitmapData.merge(..., 50,50,50,50))
  octx.globalAlpha = 0.16;
  octx.drawImage(baseCanvas, 0, 0);
  octx.globalAlpha = 1;

  for (let i = points.length - 1; i >= 0; i--) {
    const p = points[i];
    octx.fillStyle = p.color;
    octx.fillRect(p.x, p.y, 1, 1);
    p.x += p.dir[0];
    p.y += p.dir[1];
    if (p.x < 0 || p.x >= W || p.y < 0 || p.y >= H) {
      points.splice(i, 1);
      continue;
    }
    if (frameCount % 2 === 0) {
      const pDir = Math.floor(Math.random() * 5);
      if (pDir < 4) p.dir = DIR[pDir];
    }
  }
  if (frameCount % 2 === 0 && points.length < 320) addPoint();

  // Move golden mutant walkers slightly slower so they are fun to track under 4x zoom
  if (frameCount % 2 === 0) {
    for (const m of mutants) {
      octx.fillStyle = "#fde047";
      octx.fillRect(m.x, m.y, 2, 2);
      m.x += m.dir[0];
      m.y += m.dir[1];
      if (m.x < 8) { m.x = 8; m.dir = DIR[0]; }
      if (m.x > W - 9) { m.x = W - 9; m.dir = DIR[2]; }
      if (m.y < 8) { m.y = 8; m.dir = DIR[1]; }
      if (m.y > H - 9) { m.y = H - 9; m.dir = DIR[3]; }
      if (Math.random() < 0.22) m.dir = DIR[Math.floor(Math.random() * 4)];
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Keyboard lens steering
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      mx = Math.max(0, Math.min(512, mx + kx * 210 * dt));
      my = Math.max(0, Math.min(512, my + ky * 210 * dt));
    }

    const zooming = down || !!keys.Space;
    if (zooming) zoomTo(mx, my, 4, 7);
    else { cam.speed = 7; cam.rate = 1; cam.focusX = 0; cam.focusY = 0; }

    // Faithful DynamicSprite focus interpolation
    const s = cam.speed;
    cam.scale = (cam.scale * s + cam.rate) / (s + 1);
    cam.x = (cam.x * s + cam.focusX) / (s + 1);
    cam.y = (cam.y * s + cam.focusY) / (s + 1);

    simAccum += dt;
    while (simAccum >= 1 / 30) {
      simAccum -= 1 / 30;
      stepErectBitmap();
    }

    // Check mutant sampling when zoomed in (scale > 2.2)
    const worldCenterX = ((256 - cam.x) / cam.scale) * (W / 512);
    const worldCenterY = ((256 - cam.y) / cam.scale) * (H / 512);
    for (let i = mutants.length - 1; i >= 0; i--) {
      const m = mutants[i];
      const dist = Math.hypot(m.x - worldCenterX, m.y - worldCenterY);
      if (cam.scale > 2.2 && dist < 11) {
        m.lock = Math.min(1, m.lock + dt * 3.0);
        if (m.lock >= 1) {
          captured++;
          score += 55;
          bursts.push({ x: m.x, y: m.y, r: 4, life: 1 });
          mutants.splice(i, 1);
          if (captured >= targetCaptures) {
            won = true; over = true;
            score += Math.round(timeLeft * 6);
          } else {
            spawnMutant();
          }
        }
      } else {
        m.lock = Math.max(0, m.lock - dt * 1.5);
      }
    }
  }

  // Render zoomed field
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  ctx.save();
  ctx.translate(cam.x, cam.y);
  ctx.scale(cam.scale, cam.scale);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, 512, 512);

  // Highlight golden mutant particles in world space
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.01);
  const toScreen = 512 / W;
  for (const m of mutants) {
    const sx = (m.x + 0.5) * toScreen;
    const sy = (m.y + 0.5) * toScreen;
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 1.6 / cam.scale;
    ctx.beginPath(); ctx.arc(sx, sy, (6 + pulse * 3) / Math.sqrt(cam.scale), 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
    if (m.lock > 0) {
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 3 / cam.scale;
      ctx.beginPath();
      ctx.arc(sx, sy, 11 / Math.sqrt(cam.scale), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * m.lock);
      ctx.stroke();
    }
  }

  // Bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.r += dt * 45; b.life -= dt * 2.2;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = b.life;
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2 / cam.scale;
    ctx.beginPath(); ctx.arc(b.x * toScreen, b.y * toScreen, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // Microscope reticle overlay when zoomed
  if (cam.scale > 1.3 && !over) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.75)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(256, 256, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(204, 256); ctx.lineTo(224, 256);
    ctx.moveTo(288, 256); ctx.lineTo(308, 256);
    ctx.moveTo(256, 204); ctx.lineTo(256, 224);
    ctx.moveTo(256, 288); ctx.lineTo(256, 308);
    ctx.stroke();
  }

  // Zoom indicator badge
  ctx.fillStyle = "rgba(10, 14, 24, 0.72)";
  ctx.fillRect(8, 480, 140, 24);
  ctx.fillStyle = cam.scale > 2.2 ? "#4ade80" : "#aef0ff";
  ctx.font = "12px monospace"; ctx.textAlign = "left";
  ctx.fillText(`Zoom: ${cam.scale.toFixed(1)}× ${cam.scale > 2.2 ? "[ACTIF]" : ""}`, 14, 496);

  document.getElementById("stat").textContent = `Mutants: ${captured}/${targetCaptures} • Score: ${score} • ${Math.ceil(timeLeft)}s`;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ÉCHANTILLONNAGE RÉUSSI !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
