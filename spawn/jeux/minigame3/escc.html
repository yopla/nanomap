<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Rebond Mural (Escc)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "escc",
  "name": "Rebond Mural (Escc)",
  "family": "sideClavSimple",
  "icon": "⚡",
  "controls": "Flèches / ZQSD (Gauche/Droite + Haut pour sauter et ricocher d'un mur à l'autre) ou clic/doigt",
  "description": "Chambre close à ricochets muraux purs : enchaînez les wall-kicks pour atteindre les cibles en hauteur.",
  "goal": "Capturer 10 cibles aériennes avant la fin du chrono tout en évitant les rayons laser.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 },
    { "key": "targetCount", "label": "Cibles", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>⚡ <b>Rebond Escc</b></span>
  <span id="stat">Cibles: 0/10 • ❤❤❤ • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "escc";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Chamber box inspired by escc.as (rx, ry, rw, rh)
const RX = 64, RY = 64, RW = 384, RH = 384;
const XR = 9, YR = 9;

let keys = {}, cx = 256, cy = 400, vx = 0, vy = 0, wallCd = 0;
let target = {}, lasers = [], trail = [], bursts = [];
let down = false, mx = 256, my = 256;
let timeLeft = 40, targetCount = 10, caught = 0, hp = 3, invuln = 0;
let score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

function isWall(ax, ay) {
  return ax < RX || ay < RY || ax > RX + RW || ay > RY + RH;
}

function spawnTarget() {
  // Spawn high/mid targets that reward wall-kicking
  const tx = RX + 44 + Math.random() * (RW - 88);
  const ty = RY + 44 + Math.random() * (RH - 170);
  target = { x: tx, y: ty, r: 14 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  targetCount = Math.max(5, Math.min(20, Number(custom.targetCount) || 10));
  cx = 256; cy = RY + RH - YR - 1; vx = 0; vy = 0; wallCd = 0;
  caught = 0; hp = 3; invuln = 0; score = 0; won = false; over = false;
  trail = []; bursts = [];
  lasers = [
    { y: RY + RH - 64, vy: -52, dir: -1 },
    { y: RY + 120, vy: 44, dir: 1 }
  ];
  spawnTarget();
}

function addBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * 120;
    bursts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35, color });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  animT += dt;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (wallCd > 0) wallCd = Math.max(0, wallCd - dt);

    const left = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ || (down && mx < cx - 22));
    const right = !!(keys.ArrowRight || keys.KeyD || (down && mx > cx + 22));
    const up = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space || (down && my < cy - 24));

    const onGround = isWall(cx, cy + YR) || isWall(cx, cy + YR + 2);
    const ms = 0.42 * step;
    if (left) vx -= ms;
    if (right) vx += ms;
    if (onGround && up) {
      vy = -8.6;
      addBurst(cx, cy + YR, "#38d6ff");
    }

    if (!onGround) vy += 0.38 * step;
    if (onGround) vx *= Math.pow(0.90, step);
    vx *= Math.pow(0.99, step);
    vy *= Math.pow(0.99, step);

    // Wall stop + signature escc.as wall-kick rebound (vx==0 against side wall + UP -> vy=-7.8, vx=±4.4)
    if (vx > 0 && isWall(cx + XR, cy)) vx = 0;
    if (vx < 0 && isWall(cx - XR, cy)) vx = 0;
    if (vy > 0 && isWall(cx, cy + YR)) vy = 0;
    if (vy < 0 && isWall(cx, cy - YR)) vy = 0;

    if (up && !onGround && wallCd <= 0) {
      if (isWall(cx + XR + 8, cy)) {
        vy = -8.0; vx = -5.0; wallCd = 0.16;
        addBurst(RX + RW, cy, "#38d6ff");
      } else if (isWall(cx - XR - 8, cy)) {
        vy = -8.0; vx = 5.0; wallCd = 0.16;
        addBurst(RX, cy, "#38d6ff");
      }
    }

    cx += vx * step;
    cy += vy * step;
    cx = Math.max(RX + XR, Math.min(RX + RW - XR, cx));
    cy = Math.max(RY + YR, Math.min(RY + RH - YR, cy));

    trail.push({ x: cx, y: cy, life: 0.25 });

    // Target capture
    if (Math.hypot(cx - target.x, cy - target.y) < XR + target.r) {
      caught++;
      score += 35 + Math.round((RY + RH - target.y) * 0.1);
      addBurst(target.x, target.y, "#fde047");
      if (caught >= targetCount) {
        won = true; over = true;
        score += Math.round(timeLeft * 6) + hp * 25;
      } else {
        spawnTarget();
      }
    }

    // Sweeping horizontal laser bars (with safe gap in the middle that oscillates)
    for (let idx = 0; idx < lasers.length; idx++) {
      const l = lasers[idx];
      l.y += l.vy * dt;
      if (l.y < RY + 36) { l.y = RY + 36; l.vy = Math.abs(l.vy); }
      if (l.y > RY + RH - 36) { l.y = RY + RH - 36; l.vy = -Math.abs(l.vy); }
      const gapX = RX + RW * 0.5 + Math.sin(animT * (1.3 + idx * 0.5) + idx * 2.1) * (RW * 0.34);
      const gapW = 86;
      if (invuln <= 0 && Math.abs(cy - l.y) < YR + 3 && Math.abs(cx - gapX) > gapW * 0.5) {
        hp--; invuln = 1.1;
        addBurst(cx, cy, "#f87171");
        if (hp <= 0) { over = true; won = false; }
      }
    }
  }

  for (let i = trail.length - 1; i >= 0; i--) { trail[i].life -= dt; if (trail[i].life <= 0) trail.splice(i, 1); }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) bursts.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Cibles: ${caught}/${targetCount} • ${"❤".repeat(Math.max(0, hp))} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0a0e18"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#0d1422"; ctx.fillRect(RX, RY, RW, RH);

  // Wall-kick highlight strips along left & right walls
  ctx.fillStyle = "rgba(56,214,255,0.12)";
  ctx.fillRect(RX, RY, 8, RH);
  ctx.fillRect(RX + RW - 8, RY, 8, RH);
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 3;
  ctx.strokeRect(RX, RY, RW, RH);

  // Lasers
  for (let idx = 0; idx < lasers.length; idx++) {
    const l = lasers[idx];
    const gapX = RX + RW * 0.5 + Math.sin(animT * (1.3 + idx * 0.5) + idx * 2.1) * (RW * 0.34);
    const gapW = 86;
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(RX + 2, l.y); ctx.lineTo(Math.max(RX + 2, gapX - gapW * 0.5), l.y);
    ctx.moveTo(Math.min(RX + RW - 2, gapX + gapW * 0.5), l.y); ctx.lineTo(RX + RW - 2, l.y);
    ctx.stroke();
  }

  // Target
  const pulse = target.r + Math.sin(animT * 7) * 2;
  ctx.fillStyle = "rgba(253,224,71,0.22)";
  ctx.beginPath(); ctx.arc(target.x, target.y, pulse + 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fde047";
  ctx.beginPath(); ctx.arc(target.x, target.y, target.r * 0.75, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

  // Trail
  for (const t of trail) {
    ctx.globalAlpha = t.life * 2;
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(t.x, t.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  if (invuln <= 0 || Math.floor(animT * 16) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(cx, cy, XR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Bursts
  for (const b of bursts) {
    ctx.globalAlpha = Math.max(0, b.life * 3);
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CHAMBRE MAÎTRISÉE !" : "ÉCHEC DU TEST", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
