<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Levier Pouss</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pouss",
  "name": "Levier Pouss",
  "family": "topOrthoClav",
  "icon": "⚖️",
  "controls": "Flèches / ZQSD (ou glisser au doigt/souris) pour pousser la poutre rotative par effet de levier",
  "description": "Physique de couple (produit extérieur) sur une poutre pivotante : poussez près des extrémités pour la faire tourner.",
  "goal": "Aligner la poutre 6 fois sur la cible verte avant la fin du temps.",
  "fields": [
    { "key": "targetCount", "label": "Alignements requis", "type": "number", "default": 6 }
  ]
}
</script>
<div class="bar">
  <span>⚖️ <b>Levier Pouss</b></span>
  <span id="stat">Alignés: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pouss";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const RX = 256, RY = 256, XRAD = 128, YRAD = 18, BALL_R = 11;
let cx = 256, cy = 380, vx = 0, vy = 0, ra = 0, rvel = 0;
let ix = 256, iy = 256, bx = 0, by = 0;
let targetAng = 1.2, holdTime = 0, aligned = 0, targetCount = 6;
let timeLeft = 45, score = 0, won = false, over = false, keys = {}, drag = null;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function getPt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } drag = getPt(e); });
cv.addEventListener("pointermove", (e) => { if (drag) drag = getPt(e); });
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function angleDiffModPi(a, b) {
  let d = (a - b) % Math.PI;
  if (d > Math.PI / 2) d -= Math.PI;
  if (d < -Math.PI / 2) d += Math.PI;
  return Math.abs(d);
}

function pickNewTarget() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  targetAng = (ra + dir * (0.75 + Math.random() * 0.7)) % Math.PI;
  if (targetAng < 0) targetAng += Math.PI;
  holdTime = 0;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Math.max(3, Number(custom.targetCount) || 6);
  cx = 256; cy = 385; vx = 0; vy = 0; ra = 0; rvel = 0;
  aligned = 0; timeLeft = 45; score = 0; won = false; over = false;
  pickNewTarget();
}

function stepFixed() {
  // Player thrust (faithful to pouss.as)
  if (keys.ArrowUp || keys.KeyW) vy -= 0.55;
  if (keys.ArrowDown || keys.KeyS) vy += 0.55;
  if (keys.ArrowLeft || keys.KeyA) vx -= 0.55;
  if (keys.ArrowRight || keys.KeyD) vx += 0.55;

  if (drag) {
    const dx = drag.x - cx, dy = drag.y - cy, d = Math.hypot(dx, dy);
    if (d > 8) { vx += (dx / d) * 0.55; vy += (dy / d) * 0.55; }
  }

  const mv = Math.hypot(vx, vy);
  if (mv >= BALL_R) { vx = (vx / mv) * BALL_R; vy = (vy / mv) * BALL_R; }

  vy += 0.08;
  vx *= 0.96;
  vy *= 0.96;

  cx += vx; cy += vy;
  if (cx < BALL_R + 6) { cx = BALL_R + 6; vx = Math.abs(vx) * 0.6; }
  if (cx > 506 - BALL_R) { cx = 506 - BALL_R; vx = -Math.abs(vx) * 0.6; }
  if (cy < BALL_R + 6) { cy = BALL_R + 6; vy = Math.abs(vy) * 0.6; }
  if (cy > 506 - BALL_R) { cy = 506 - BALL_R; vy = -Math.abs(vy) * 0.5; }

  // Closest point from ball to rotated rectangle (exact pouss.as math)
  const a = -ra;
  let jx = cx - RX, jy = cy - RY;
  const kx = jx * Math.cos(a) - Math.sin(a) * jy;
  const ky = jx * Math.sin(a) + Math.cos(a) * jy;
  const clx = Math.max(-XRAD, Math.min(XRAD, kx));
  const cly = Math.max(-YRAD, Math.min(YRAD, ky));

  jx = clx * Math.cos(ra) - Math.sin(ra) * cly;
  jy = clx * Math.sin(ra) + Math.cos(ra) * cly;
  ix = jx + RX; iy = jy + RY;

  let dx = cx - ix, dy = cy - iy;
  let mag = Math.hypot(dx, dy) || 0.000001;
  let bcol = false, ndot = 0;

  if (mag < BALL_R) {
    dx /= mag; dy /= mag;
    cx -= dx * (mag - BALL_R);
    cy -= dy * (mag - BALL_R);
    const vmag = Math.hypot(vx, vy) || 0.000001;
    ndot = dx * (vx / vmag) + dy * (vy / vmag);
    bcol = true;
  }

  // Torque via wedge product (exact pouss.as logic)
  const ax = ix - RX, ay = iy - RY;
  const denom = ax * ax + ay * ay || 1;
  const dot = (vx * ax + vy * ay) / denom;
  bx = vx - ax * dot;
  by = vy - ay * dot;
  const a2 = (ax * by - ay * bx) * (Math.PI / 180);

  if (bcol && ndot < 0) {
    let ka = Math.max(-0.045, Math.min(0.045, a2 / 14));
    rvel += ka * 0.55;
    ra += ka;
    vx += dx * 1.1;
    vy += dy * 1.1;
  }

  ra += rvel;
  rvel *= 0.92;

  if (angleDiffModPi(ra, targetAng) < 0.14) {
    holdTime += 1 / 60;
    if (holdTime >= 0.35) {
      aligned++;
      score += 50;
      if (aligned >= targetCount) {
        won = true; over = true; score += Math.round(timeLeft * 6);
      } else {
        pickNewTarget();
      }
    }
  } else {
    holdTime = Math.max(0, holdTime - 0.02);
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    acc += dt;
    const step = 1 / 60;
    while (acc >= step && !over) {
      stepFixed();
      acc -= step;
    }
  }

  document.getElementById("stat").textContent = `Alignés: ${aligned}/${targetCount} • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Outer sweep circle
  ctx.beginPath(); ctx.arc(RX, RY, XRAD + 10, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(45,91,123,0.3)"; ctx.lineWidth = 1.5; ctx.stroke();

  // Target angle ghost beam & green gates
  ctx.save();
  ctx.translate(RX, RY);
  ctx.rotate(targetAng);
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = holdTime > 0 ? "#4ade80" : "rgba(74,222,128,0.55)";
  ctx.lineWidth = 2;
  ctx.strokeRect(-XRAD, -YRAD, XRAD * 2, YRAD * 2);
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(74,222,128,0.22)";
  ctx.beginPath(); ctx.arc(XRAD + 10, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-XRAD - 10, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Hold progress arc around pivot
  if (holdTime > 0) {
    ctx.beginPath();
    ctx.arc(RX, RY, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, holdTime / 0.35));
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 4; ctx.stroke();
  }

  // Rotated beam
  ctx.save();
  ctx.translate(RX, RY);
  ctx.rotate(ra);
  ctx.fillStyle = "rgba(56,214,255,0.18)";
  ctx.fillRect(-XRAD, -YRAD, XRAD * 2, YRAD * 2);
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2.5;
  ctx.strokeRect(-XRAD, -YRAD, XRAD * 2, YRAD * 2);
  // End grip highlights
  ctx.fillStyle = "#fde047";
  ctx.fillRect(XRAD - 12, -YRAD + 3, 9, YRAD * 2 - 6);
  ctx.fillRect(-XRAD + 3, -YRAD + 3, 9, YRAD * 2 - 6);
  ctx.restore();

  // Pivot center
  ctx.beginPath(); ctx.arc(RX, RY, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#94a3b8"; ctx.fill();

  // Closest point & torque debug vectors (from pouss.as)
  ctx.beginPath(); ctx.arc(ix, iy, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#f87171"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(RX, RY); ctx.lineTo(RX + bx * 14, RY + by * 14);
  ctx.strokeStyle = "rgba(253,224,71,0.5)"; ctx.lineWidth = 1.5; ctx.stroke();

  // Player thruster orb
  ctx.beginPath(); ctx.arc(cx, cy, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.35)"; ctx.fill();
  ctx.strokeStyle = "#e6f4ff"; ctx.lineWidth = 2.5; ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "LEVIER CALIBRÉ !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
