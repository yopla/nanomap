<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Carte Spirale Infinie (MiniMap)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "minimap",
  "name": "Carte Spirale Infinie (MiniMap)",
  "family": "income",
  "icon": "🗺️",
  "controls": "Glisser-lancer avec inertie (souris/doigt) ou Flèches/ZQSD • Espace: filtre spectral • R: origine",
  "description": "Exploration d'une carte stellaire infinie indexée en spirale d'Ulam avec inertie de glisse.",
  "goal": "Centrer ou toucher les 6 anomalies spectrales indiquées par le radar avant la fin du temps.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🗺️ <b>Carte Spirale</b></span>
  <span id="stat">Anomalies: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "minimap";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const CELL = 4; // 4px per spiral cell (128x128 visible window)
const MASATSU = 0.95; // faithful inertial friction from miniMap.as
let camX = -256, camY = -256, vx = 0, vy = 0;
let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
let spaceVoidTotalCycle = 255, modR = 40, modV = 120, modB = 200;
let keys = {}, targets = [], bursts = [], timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

// Faithful Ulam spiral index from Util.getIdxByPos in miniMap.as
function getIdxByPos(x, y) {
  const ax = x > 0 ? x : -x;
  const ay = y > 0 ? y : -y;
  const n = ax > ay ? ax : ay;
  const base = 4 * n * (n + 1) + 1;
  if (y === n) return base - n + x;
  else if (x === -n) return base - 3 * n + y;
  else if (y === -n) return base - 5 * n - x;
  else return base - 7 * n - y;
}

function randomizeSpectrum() {
  spaceVoidTotalCycle = Math.floor(Math.random() * 64) + 222;
  const numSkins = 3;
  modR = Math.floor((Math.random() * spaceVoidTotalCycle / numSkins) * 1);
  modV = Math.floor((Math.random() * spaceVoidTotalCycle / numSkins) * 2);
  modB = Math.floor((Math.random() * spaceVoidTotalCycle / numSkins) * 3);
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (over && (e.code === "Space" || e.code === "Enter")) { sendResultAndExit(won, score); return; }
  if (!over && e.code === "Space") randomizeSpectrum();
  if (!over && e.code === "KeyR") { camX = -256; camY = -256; vx = 0; vy = 0; }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = pointerPos(e);
  dragging = true;
  lastX = downX = pt.x;
  lastY = downY = pt.y;
  vx = 0; vy = 0;
  cv.setPointerCapture(e.pointerId);
});

cv.addEventListener("pointermove", (e) => {
  if (!dragging || over) return;
  const pt = pointerPos(e);
  const dx = lastX - pt.x;
  const dy = lastY - pt.y;
  camX += dx;
  camY += dy;
  vx = dx;
  vy = dy;
  lastX = pt.x;
  lastY = pt.y;
});

cv.addEventListener("pointerup", (e) => {
  if (!dragging) return;
  dragging = false;
  const pt = pointerPos(e);
  // Tap/click on a visible anomaly directly scans it
  if (Math.hypot(pt.x - downX, pt.y - downY) < 10) {
    for (const t of targets) {
      if (t.done) continue;
      const sx = t.gx * CELL - camX;
      const sy = t.gy * CELL - camY;
      if (Math.hypot(pt.x - sx, pt.y - sy) < 26) {
        captureTarget(t);
        break;
      }
    }
  }
});

function captureTarget(t) {
  t.done = true;
  score += 60;
  bursts.push({ x: t.gx * CELL, y: t.gy * CELL, r: 10, life: 1 });
  if (targets.every(x => x.done)) {
    won = true; over = true;
    score += Math.round(timeLeft * 6);
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false;
  camX = -256; camY = -256; vx = 0; vy = 0;
  dragging = false; bursts = [];
  randomizeSpectrum();

  targets = [];
  for (let i = 0; i < 6; i++) {
    const ang = (Math.PI * 2 * i) / 6 + (Math.random() - 0.5) * 0.7;
    const dist = 90 + Math.floor(Math.random() * 190) + i * 28;
    const gx = Math.round(Math.cos(ang) * dist);
    const gy = Math.round(Math.sin(ang) * dist);
    targets.push({ gx, gy, id: getIdxByPos(gx, gy), done: false });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const stepScale = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      vx += kx * 2.2 * stepScale;
      vy += ky * 2.2 * stepScale;
    }

    if (!dragging) {
      camX += vx * stepScale;
      camY += vy * stepScale;
      const damp = Math.pow(MASATSU, stepScale);
      vx *= damp;
      vy *= damp;
      if (Math.hypot(vx, vy) < 0.15) { vx = 0; vy = 0; }
    }

    // Auto-lock any anomaly brought inside the central scanner reticle
    for (const t of targets) {
      if (t.done) continue;
      const sx = t.gx * CELL - camX;
      const sy = t.gy * CELL - camY;
      if (Math.hypot(sx - 256, sy - 256) < 28) {
        captureTarget(t);
      }
    }
  }

  // Render infinite Ulam-spiral starfield
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  const startGX = Math.floor(camX / CELL) - 1;
  const startGY = Math.floor(camY / CELL) - 1;
  const cols = Math.ceil(512 / CELL) + 2;
  const rows = Math.ceil(512 / CELL) + 2;

  for (let gx = startGX; gx < startGX + cols; gx++) {
    const sx = gx * CELL - camX;
    for (let gy = startGY; gy < startGY + rows; gy++) {
      const id = getIdxByPos(gx, gy);
      if (id === 1) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(sx - 1, gy * CELL - camY - 1, CELL + 2, CELL + 2);
        continue;
      }
      const m = id % spaceVoidTotalCycle;
      if (m === modR) {
        ctx.fillStyle = "#fb7185";
        ctx.fillRect(sx, gy * CELL - camY, CELL - 0.5, CELL - 0.5);
      } else if (m === modV) {
        ctx.fillStyle = "#4ade80";
        ctx.fillRect(sx, gy * CELL - camY, CELL - 0.5, CELL - 0.5);
      } else if (m === modB) {
        ctx.fillStyle = "#38d6ff";
        ctx.fillRect(sx, gy * CELL - camY, CELL - 0.5, CELL - 0.5);
      }
    }
  }

  // Origin (0,0) subtle ring
  const ox = -camX, oy = -camY;
  if (ox > -30 && ox < 542 && oy > -30 && oy < 542) {
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ox, oy, 10, 0, Math.PI * 2); ctx.stroke();
  }

  // Draw anomalies & find nearest remaining for radar guide
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.008);
  let nearest = null, bestDist = Infinity;
  for (const t of targets) {
    if (t.done) continue;
    const sx = t.gx * CELL - camX;
    const sy = t.gy * CELL - camY;
    const d = Math.hypot(sx - 256, sy - 256);
    if (d < bestDist) { bestDist = d; nearest = { t, sx, sy, d }; }

    if (sx > -40 && sx < 552 && sy > -40 && sy < 552) {
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, 12 + pulse * 6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(253, 224, 71, 0.25)";
      ctx.beginPath(); ctx.arc(sx, sy, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.font = "10px monospace"; ctx.textAlign = "center";
      ctx.fillText(`#${t.id}`, sx, sy - 20);
    }
  }

  // Capture bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.r += dt * 110; b.life -= dt * 2;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = b.life;
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Radar chevron toward nearest anomaly
  if (nearest && nearest.d > 38) {
    const ang = Math.atan2(nearest.sy - 256, nearest.sx - 256);
    const rx = 256 + Math.cos(ang) * 218;
    const ry = 256 + Math.sin(ang) * 218;
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(ang);
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -7); ctx.lineTo(-4, 0); ctx.lineTo(-7, 7); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Central scanner reticle
  ctx.strokeStyle = "rgba(56, 214, 255, 0.7)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(256, 256, 26, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(222, 256); ctx.lineTo(238, 256);
  ctx.moveTo(274, 256); ctx.lineTo(290, 256);
  ctx.moveTo(256, 222); ctx.lineTo(256, 238);
  ctx.moveTo(256, 274); ctx.lineTo(256, 290);
  ctx.stroke();

  // HUD coordinates
  const cxCell = Math.round((camX + 256) / CELL);
  const cyCell = Math.round((camY + 256) / CELL);
  ctx.fillStyle = "rgba(10, 14, 24, 0.72)";
  ctx.fillRect(8, 480, 238, 24);
  ctx.fillStyle = "#aef0ff"; ctx.font = "12px monospace"; ctx.textAlign = "left";
  ctx.fillText(`Pos (${cxCell},${cyCell}) • ID #${getIdxByPos(cxCell, cyCell)}`, 14, 496);

  const doneN = targets.filter(t => t.done).length;
  document.getElementById("stat").textContent = `Anomalies: ${doneN}/${targets.length} • Score: ${score} • ${Math.ceil(timeLeft)}s`;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CARTOGRAPHIE COMPLÈTE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
