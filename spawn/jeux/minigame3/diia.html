<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Bélier Cinétique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diia",
  "name": "Bélier Cinétique",
  "family": "topMouseHnS",
  "icon": "💥",
  "controls": "Viser à la souris / doigt ; maintenir clic ou Espace pour propulser et éjecter les noyaux hors de l'arène",
  "description": "Portage du prototype AS3 diia : propulsion directionnelle avec friction et transfert direct d'impulsion par contact.",
  "goal": "Éjecter 10 noyaux adverses hors du cercle plasma avant la fin du chrono.",
  "fields": [
    { "key": "targetKOs", "label": "Éjections requises", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>💥 <b>Bélier Cinétique</b></span>
  <span id="stat">Éjections: 0/10 • ❤️❤️❤️ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diia";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const RING_R = 205;
let mouse = { x: 256, y: 180 };
let mdown = false, keyHold = false;
let cx = 256, cy = 340, vx = 0, vy = 0, ang = -Math.PI / 2;
let cores = [], mines = [], sparks = [];
let targetKOs = 10, kos = 0, hp = 3, invuln = 0;
let timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  mdown = true;
});
window.addEventListener("pointerup", () => { mdown = false; });
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); keyHold = true; } });
window.addEventListener("keyup", (e) => { if (e.code === "Space") keyHold = false; });

function spawnCore() {
  const a = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 90;
  cores.push({ x: 256 + Math.cos(a) * dist, y: 256 + Math.sin(a) * dist, rx: 0, ry: 0, r: 17 });
}

function addSparks(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 140;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.2, color });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetKOs = Math.max(4, Number(custom.targetKOs) || 10);
  cx = 256; cy = 350; vx = 0; vy = 0; ang = -Math.PI / 2;
  cores = []; sparks = [];
  for (let i = 0; i < 4; i++) spawnCore();
  mines = [
    { ang: 0, rad: 120, spd: 0.75, x: 376, y: 256 },
    { ang: Math.PI, rad: 120, spd: 0.75, x: 136, y: 256 }
  ];
  kos = 0; hp = 3; invuln = 0;
  timeLeft = 45; score = 0; won = false; over = false;
  mdown = false; keyHold = false;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Faithful diia.as thrust + 0.8 friction + direct velocity ramming
    ang = Math.atan2(mouse.y - cy, mouse.x - cx);
    const fric = Math.pow(0.84, f);
    vx *= fric; vy *= fric;
    if (mdown || keyHold) {
      const ms = 4.6;
      vx = Math.cos(ang) * ms;
      vy = Math.sin(ang) * ms;
    }
    cx += vx * f;
    cy += vy * f;

    // Keep player inside outer ring bounce
    const pd = Math.hypot(cx - 256, cy - 256);
    if (pd > RING_R - 14) {
      const nx = (cx - 256) / pd, ny = (cy - 256) / pd;
      cx = 256 + nx * (RING_R - 14);
      cy = 256 + ny * (RING_R - 14);
      vx *= -0.5; vy *= -0.5;
    }

    // Update cores & ram momentum transfer
    for (let i = cores.length - 1; i >= 0; i--) {
      const w = cores[i];
      // Gentle pull toward center so they resist ring-out
      const toC = Math.atan2(256 - w.y, 256 - w.x);
      const cdist = Math.hypot(256 - w.x, 256 - w.y);
      if (cdist > 18) {
        w.rx += Math.cos(toC) * 0.11 * f;
        w.ry += Math.sin(toC) * 0.11 * f;
      }

      // Ram check against player (diia.as: if (d < 32) { rx = vx; ry = vy; })
      const d = Math.hypot(w.x - cx, w.y - cy);
      if (d < w.r + 17) {
        const nx = (w.x - cx) / (d || 1), ny = (w.y - cy) / (d || 1);
        w.rx = vx * 2.1 + nx * 2.4;
        w.ry = vy * 2.1 + ny * 2.4;
        w.x = cx + nx * (w.r + 17.5);
        w.y = cy + ny * (w.r + 17.5);
        addSparks((w.x + cx) / 2, (w.y + cy) / 2, "#38d6ff", 6);
      }

      // Core-to-core chain bumper
      for (let j = i - 1; j >= 0; j--) {
        const o = cores[j];
        const cd = Math.hypot(w.x - o.x, w.y - o.y);
        if (cd < w.r + o.r && cd > 0.01) {
          const nx = (w.x - o.x) / cd, ny = (w.y - o.y) / cd;
          const push = (w.r + o.r - cd) * 0.5;
          w.x += nx * push; w.y += ny * push;
          o.x -= nx * push; o.y -= ny * push;
          const trx = w.rx, try_ = w.ry;
          w.rx = o.rx * 0.9 + nx * 1.2; w.ry = o.ry * 0.9 + ny * 1.2;
          o.rx = trx * 0.9 - nx * 1.2; o.ry = try_ * 0.9 - ny * 1.2;
        }
      }

      w.x += w.rx * f;
      w.y += w.ry * f;
      w.rx *= fric;
      w.ry *= fric;

      // Ring-out check!
      if (Math.hypot(w.x - 256, w.y - 256) > RING_R + 6) {
        kos++;
        score += 45;
        addSparks(w.x, w.y, "#4ade80", 14);
        cores.splice(i, 1);
        if (kos >= targetKOs) {
          won = true; over = true;
          score += Math.round(timeLeft * 6) + hp * 35;
        } else {
          spawnCore();
        }
      }
    }

    // Orbiting red plasma mines
    for (const m of mines) {
      m.ang += m.spd * dt;
      m.x = 256 + Math.cos(m.ang) * m.rad;
      m.y = 256 + Math.sin(m.ang) * m.rad;
      if (invuln <= 0 && Math.hypot(cx - m.x, cy - m.y) < 25) {
        hp--;
        invuln = 1.2;
        addSparks(cx, cy, "#f87171", 16);
        vx *= -1.4; vy *= -1.4;
        if (hp <= 0) over = true;
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  const hearts = "❤️".repeat(Math.max(0, hp)) + "🖤".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Éjections: ${kos}/${targetKOs} • ${hearts} • ${Math.ceil(timeLeft)}s • ${score} pts`;

  // Render
  ctx.fillStyle = "#080c15";
  ctx.fillRect(0, 0, 512, 512);

  // Arena ring
  ctx.beginPath();
  ctx.arc(256, 256, RING_R, 0, Math.PI * 2);
  ctx.fillStyle = "#0d1422";
  ctx.fill();
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(256, 256, 48, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(56,214,255,0.15)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Mines
  for (const m of mines) {
    ctx.beginPath();
    ctx.arc(m.x, m.y, 11, 0, Math.PI * 2);
    ctx.fillStyle = "#f43f5e";
    ctx.fill();
    ctx.strokeStyle = "#fecdd3";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Cores
  for (const w of cores) {
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(253,224,71,0.24)";
    ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Sparks
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life * 2.5);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player bumper ship
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI * 2);
    ctx.fillStyle = (mdown || keyHold) ? "rgba(56,214,255,0.38)" : "rgba(56,214,255,0.18)";
    ctx.fill();
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * 18, cy + Math.sin(ang) * 18);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ARÈNE NETTOYÉE !" : (hp <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
