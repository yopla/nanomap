<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Exploration Tactique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diaddd",
  "name": "Exploration Tactique",
  "family": "topMouseHnS",
  "icon": "🧭",
  "controls": "Cliquer ou maintenir pour poser un jalon dans le monde et guider l'éclaireur (caméra fluide)",
  "description": "Portage du prototype AS3 diaddd : déplacement par clic-jalon en monde étendu avec suivi de caméra lissé.",
  "goal": "Récupérer les 8 balises dorées dans le secteur en évitant les patrouilleurs.",
  "fields": [
    { "key": "beaconCount", "label": "Balises à récolter", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🧭 <b>Exploration Tactique</b></span>
  <span id="stat">Balises: 0/8 • ❤️❤️❤️ • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diaddd";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const WORLD = 960;
let camx = 224, camy = 224;
let cx = 480, cy = 480, gx = 480, gy = 480;
let mouse = { x: 256, y: 256 }, mbutton = false;
let beacons = [], patrollers = [], pillars = [];
let beaconCount = 8, collected = 0, hp = 3, invuln = 0, boost = 0;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  mbutton = true;
  gx = Math.max(18, Math.min(WORLD - 18, camx + mouse.x));
  gy = Math.max(18, Math.min(WORLD - 18, camy + mouse.y));
});
window.addEventListener("pointerup", () => { mbutton = false; });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  beaconCount = Math.max(4, Number(custom.beaconCount) || 8);
  cx = WORLD / 2; cy = WORLD / 2;
  gx = cx; gy = cy;
  camx = cx - 256; camy = cy - 256;
  collected = 0; hp = 3; invuln = 0; boost = 0;
  timeLeft = 50; score = 0; won = false; over = false; mbutton = false;

  pillars = [
    { x: 260, y: 260, r: 34 }, { x: 700, y: 260, r: 34 },
    { x: 260, y: 700, r: 34 }, { x: 700, y: 700, r: 34 }
  ];

  beacons = [];
  for (let i = 0; i < beaconCount; i++) {
    const a = (i / beaconCount) * Math.PI * 2 + 0.3;
    const dist = 220 + (i % 2) * 165;
    beacons.push({
      x: Math.max(60, Math.min(WORLD - 60, WORLD / 2 + Math.cos(a) * dist)),
      y: Math.max(60, Math.min(WORLD - 60, WORLD / 2 + Math.sin(a) * dist)),
      done: false
    });
  }

  patrollers = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const rad = i % 2 === 0 ? 190 : 340;
    patrollers.push({
      cx: WORLD / 2, cy: WORLD / 2, rad, ang: a,
      omega: (i % 2 === 0 ? 0.85 : -0.62),
      x: WORLD / 2 + Math.cos(a) * rad,
      y: WORLD / 2 + Math.sin(a) * rad,
      r: 15
    });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (boost > 0) boost = Math.max(0, boost - dt);

    // Faithful diaddd.as world-space click waypoint + smooth camera follow
    if (mbutton) {
      gx = Math.max(18, Math.min(WORLD - 18, camx + mouse.x));
      gy = Math.max(18, Math.min(WORLD - 18, camy + mouse.y));
    }

    const dx = gx - cx, dy = gy - cy;
    const mag = Math.hypot(dx, dy);
    const ms = (boost > 0 ? 5.6 : 4.2) * f;
    if (mag > ms) {
      const ta = Math.atan2(dy, dx);
      cx += Math.cos(ta) * ms;
      cy += Math.sin(ta) * ms;
    } else if (mag > 0.5) {
      cx = gx; cy = gy;
    }

    // Resolve against pillars
    for (const p of pillars) {
      const pd = Math.hypot(cx - p.x, cy - p.y) || 1;
      const minD = p.r + 16;
      if (pd < minD) {
        cx = p.x + ((cx - p.x) / pd) * minD;
        cy = p.y + ((cy - p.y) / pd) * minD;
      }
    }
    cx = Math.max(18, Math.min(WORLD - 18, cx));
    cy = Math.max(18, Math.min(WORLD - 18, cy));

    // Smooth camera lerp: camx += ((cx - 256) - camx) * 0.1
    const camLerp = 1 - Math.pow(0.9, f);
    camx += ((cx - 256) - camx) * camLerp;
    camy += ((cy - 256) - camy) * camLerp;

    // Collect beacons
    for (const b of beacons) {
      if (!b.done && Math.hypot(cx - b.x, cy - b.y) < 28) {
        b.done = true;
        collected++;
        boost = 1.6;
        score += 50;
        if (collected >= beaconCount) {
          won = true; over = true;
          score += Math.round(timeLeft * 6) + hp * 40;
        }
      }
    }

    // Update patrollers
    for (const p of patrollers) {
      p.ang += p.omega * dt;
      p.x = p.cx + Math.cos(p.ang) * p.rad;
      p.y = p.cy + Math.sin(p.ang) * p.rad;
      if (invuln <= 0 && Math.hypot(cx - p.x, cy - p.y) < p.r + 14) {
        hp--;
        invuln = 1.2;
        if (hp <= 0) over = true;
      }
    }
  }

  const hearts = "❤️".repeat(Math.max(0, hp)) + "🖤".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Balises: ${collected}/${beaconCount} • ${hearts} • ${Math.ceil(timeLeft)}s • ${score} pts`;

  // Render
  ctx.fillStyle = "#080d17";
  ctx.fillRect(0, 0, 512, 512);

  // World bounds & grid
  ctx.save();
  ctx.translate(-camx, -camy);

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, WORLD, WORLD);

  ctx.strokeStyle = "rgba(56,214,255,0.08)";
  ctx.lineWidth = 1;
  for (let g = 0; g <= WORLD; g += 64) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, WORLD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(WORLD, g); ctx.stroke();
  }
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, WORLD, WORLD);

  // Pillars
  for (const p of pillars) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#1e293b";
    ctx.fill();
    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Beacons
  for (const b of beacons) {
    if (b.done) continue;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 13, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(253,224,71,0.25)";
    ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#fde047";
    ctx.fill();
  }

  // Patrollers
  for (const p of patrollers) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#f43f5e";
    ctx.fill();
    ctx.strokeStyle = "#fecdd3";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Waypoint marker (gx, gy) + path line
  if (Math.hypot(gx - cx, gy - cy) > 10) {
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(gx, gy);
    ctx.strokeStyle = "rgba(56,214,255,0.45)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2;
  ctx.strokeRect(gx - 5, gy - 5, 10, 10);

  // Player (cx, cy)
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI * 2);
    ctx.fillStyle = boost > 0 ? "rgba(74,222,128,0.28)" : "rgba(56,214,255,0.24)";
    ctx.fill();
    ctx.strokeStyle = boost > 0 ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  ctx.restore();

  // Minimap (top-right)
  const mm = 96, mx0 = 512 - mm - 12, my0 = 12, sc = mm / WORLD;
  ctx.fillStyle = "rgba(10,14,24,0.82)";
  ctx.fillRect(mx0, my0, mm, mm);
  ctx.strokeStyle = "#2d5b7b";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(mx0, my0, mm, mm);
  for (const b of beacons) if (!b.done) {
    ctx.fillStyle = "#fde047";
    ctx.fillRect(mx0 + b.x * sc - 2, my0 + b.y * sc - 2, 4, 4);
  }
  for (const p of patrollers) {
    ctx.fillStyle = "#f43f5e";
    ctx.fillRect(mx0 + p.x * sc - 1.5, my0 + p.y * sc - 1.5, 3, 3);
  }
  ctx.fillStyle = "#38d6ff";
  ctx.fillRect(mx0 + cx * sc - 2.5, my0 + cy * sc - 2.5, 5, 5);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEUR EXPLORÉ !" : (hp <= 0 ? "ÉCLAIREUR DÉTRUIT" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
