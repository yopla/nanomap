<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Escouade Swi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "swi",
  "name": "Escouade Swi",
  "family": "topMouseMut",
  "icon": "🎯",
  "controls": "Cliquer une unité (ou touches 1-3) pour la sélectionner, puis cliquer sa destination",
  "description": "Pilotage tactique d'unités par points de passage pointillés et cercle de portée radar de 128px.",
  "goal": "Scanner les 8 balises vertes grâce à la portée de vos unités en évitant les mines rouges.",
  "fields": [
    { "key": "targetCount", "label": "Balises à scanner", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🎯 <b>Escouade Swi</b></span>
  <span id="stat">Balises: 0/8 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "swi";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mx = 256, my = 256;
let units = [], curSel = null, beacons = [], mines = [];
let scanned = 0, targetCount = 8, lives = 3, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function isOver(u, px, py) {
  return !(px < u.cx - u.rad - 6 || py < u.cy - u.rad - 6 || px > u.cx + u.rad + 6 || py > u.cy + u.rad + 6);
}
function getMag2(ax, ay) { return ax * ax + ay * ay; }

function spawnBeacon() {
  for (let tries = 0; tries < 25; tries++) {
    const x = 48 + Math.random() * 416;
    const y = 48 + Math.random() * 416;
    if (units.every(u => Math.hypot(u.cx - x, u.cy - y) > 105) && beacons.every(b => Math.hypot(b.x - x, b.y - y) > 90)) {
      beacons.push({ x, y, prog: 0 });
      return;
    }
  }
  beacons.push({ x: 60 + Math.random() * 392, y: 60 + Math.random() * 392, prog: 0 });
}

function setM(e) {
  const r = cv.getBoundingClientRect();
  mx = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  my = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  const hit = units.find(u => isOver(u, mx, my));
  if (hit) {
    curSel = hit;
  } else if (curSel) {
    curSel.gx = Math.max(20, Math.min(492, mx));
    curSel.gy = Math.max(20, Math.min(492, my));
    curSel.state = 1;
    curSel = null;
  }
});
window.addEventListener("keydown", (e) => {
  if (over && (e.code === "Space" || e.code === "Enter")) { sendResultAndExit(won, score); return; }
  if (e.key === "1" && units[0]) curSel = units[0];
  if (e.key === "2" && units[1]) curSel = units[1];
  if (e.key === "3" && units[2]) curSel = units[2];
});

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Math.max(3, Number(custom.targetCount) || 8);
  scanned = 0; lives = 3; timeLeft = 45; score = 0; won = false; over = false;
  units = [
    { id: 1, cx: 140, cy: 256, rad: 16, ang: 0, range: 112, gx: 140, gy: 256, state: 0, col: "#38d6ff", inv: 0 },
    { id: 2, cx: 256, cy: 256, rad: 16, ang: 0, range: 112, gx: 256, gy: 256, state: 0, col: "#a78bfa", inv: 0 },
    { id: 3, cx: 372, cy: 256, rad: 16, ang: 0, range: 112, gx: 372, gy: 256, state: 0, col: "#34d399", inv: 0 }
  ];
  curSel = units[0];
  beacons = [];
  for (let i = 0; i < 3; i++) spawnBeacon();
  mines = [
    { x: 100, y: 100, vx: 68, vy: 52, r: 12 },
    { x: 412, y: 412, vx: -62, vy: -58, r: 12 },
    { x: 400, y: 110, vx: -54, vy: 66, r: 12 }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    for (const u of units) {
      if (u.inv > 0) u.inv = Math.max(0, u.inv - dt);
      if (u.state > 0) {
        u.ang = Math.atan2(u.gy - u.cy, u.gx - u.cx);
        const speed = 118;
        u.cx += Math.cos(u.ang) * speed * dt;
        u.cy += Math.sin(u.ang) * speed * dt;
        if (getMag2(u.cx - u.gx, u.cy - u.gy) < 36) u.state = 0;
      }
    }

    for (const m of mines) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < m.r + 8 || m.x > 504 - m.r) { m.vx *= -1; m.x = Math.max(m.r + 8, Math.min(504 - m.r, m.x)); }
      if (m.y < m.r + 8 || m.y > 504 - m.r) { m.vy *= -1; m.y = Math.max(m.r + 8, Math.min(504 - m.r, m.y)); }
      for (const u of units) {
        if (u.inv <= 0 && Math.hypot(u.cx - m.x, u.cy - m.y) < u.rad + m.r - 2) {
          u.inv = 1.6;
          u.state = 0;
          lives--;
          score = Math.max(0, score - 15);
          if (lives <= 0) { over = true; won = false; }
        }
      }
    }

    for (let i = beacons.length - 1; i >= 0; i--) {
      const b = beacons[i];
      let rate = 0;
      for (const u of units) {
        const d = Math.hypot(u.cx - b.x, u.cy - b.y);
        if (d <= u.range) rate += 0.55 + 0.7 * (1 - d / u.range);
      }
      if (rate > 0) {
        b.prog += rate * dt;
        if (b.prog >= 1) {
          beacons.splice(i, 1);
          scanned++;
          score += 40;
          if (scanned >= targetCount) {
            won = true; over = true; score += Math.round(timeLeft * 5) + lives * 20;
          } else {
            spawnBeacon();
          }
        }
      } else {
        b.prog = Math.max(0, b.prog - 0.15 * dt);
      }
    }
  }

  document.getElementById("stat").textContent = `Balises: ${scanned}/${targetCount} • ❤${lives} • ${Math.ceil(timeLeft)}s`;
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle tactical grid
  ctx.strokeStyle = "rgba(45,91,123,0.18)";
  ctx.lineWidth = 1;
  for (let g = 64; g < 512; g += 64) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  // Beacons & scan beams
  for (const b of beacons) {
    for (const u of units) {
      if (Math.hypot(u.cx - b.x, u.cy - b.y) <= u.range) {
        ctx.beginPath(); ctx.moveTo(u.cx, u.cy); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = "rgba(74,222,128,0.45)"; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(74,222,128,0.18)"; ctx.fill();
    ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2; ctx.stroke();
    if (b.prog > 0) {
      ctx.beginPath(); ctx.arc(b.x, b.y, 20, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, b.prog));
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  // Mines
  for (const m of mines) {
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(248,113,113,0.28)"; ctx.fill();
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.x - 6, m.y - 6); ctx.lineTo(m.x + 6, m.y + 6);
    ctx.moveTo(m.x + 6, m.y - 6); ctx.lineTo(m.x - 6, m.y + 6); ctx.stroke();
  }

  // Units & waypoint trails (faithful to swi.as)
  const hovered = units.find(u => isOver(u, mx, my)) || null;
  for (const u of units) {
    if (u.state > 0) {
      ctx.beginPath(); ctx.moveTo(u.cx, u.cy); ctx.lineTo(u.gx, u.gy);
      ctx.strokeStyle = "rgba(56,214,255,0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
      const d2 = getMag2(u.cx - u.gx, u.cy - u.gy);
      const num = Math.min(18, Math.floor(d2 / 2048));
      const t = d2 > 0 ? 2048 / d2 : 1;
      let w = 0;
      ctx.strokeStyle = u.col;
      for (let i = 0; i < num; i++) {
        w += t;
        const ax = u.cx + (u.gx - u.cx) * w;
        const ay = u.cy + (u.gy - u.cy) * w;
        ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(u.gx, u.gy, 5, 0, Math.PI * 2);
      ctx.fillStyle = u.col; ctx.fill();
    }

    if (hovered === u || curSel === u) {
      ctx.beginPath(); ctx.arc(u.cx, u.cy, u.range, 0, Math.PI * 2);
      ctx.strokeStyle = curSel === u ? "rgba(56,214,255,0.42)" : "rgba(230,244,255,0.22)";
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = curSel === u ? "#fde047" : "#e6f4ff";
      ctx.lineWidth = 2;
      ctx.strokeRect(u.cx - u.rad - 3, u.cy - u.rad - 3, (u.rad + 3) * 2, (u.rad + 3) * 2);
    }

    if (u.inv <= 0 || Math.floor(u.inv * 12) % 2 === 0) {
      ctx.beginPath(); ctx.arc(u.cx, u.cy, u.rad, 0, Math.PI * 2);
      ctx.fillStyle = u.col + "44"; ctx.fill();
      ctx.strokeStyle = u.col; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(u.cx, u.cy);
      ctx.lineTo(u.cx + Math.cos(u.ang) * 14, u.cy + Math.sin(u.ang) * 14); ctx.stroke();
      ctx.fillStyle = "#e6f4ff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(u.id), u.cx, u.cy + 4);
    }
  }

  // Crosshair cursor (swi.as)
  ctx.fillStyle = curSel ? "#fde047" : "#38d6ff";
  ctx.fillRect(mx - 8, my - 1, 16, 2);
  ctx.fillRect(mx - 1, my - 8, 2, 16);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "BALISES SCANNÉES !" : (lives <= 0 ? "ESCOUADE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
