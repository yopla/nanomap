<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Feu Follet &amp; Salves Plasma (Feu Follet Blast)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fb7185; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #05060e; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,113,133,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "feu_follet_blast",
  "name": "Feu Follet & Salves Plasma (Feu Follet Blast)",
  "family": "topMouseHnS",
  "icon": "✨",
  "controls": "Pointeur / ZQSD pour piloter le feu-follet à ressort • Maintenir Clic / Toucher / Espace pour déclencher des salves d'explosions multi-anneaux",
  "description": "Fusion de ParticleSample.as (3_89zG : feu-follet à suivi ressort et flammèches additives) et aGoH.as (Explosions anime à anneaux radiaux Back.easeInOut / Expo.easeOut).",
  "goal": "Pulvériser 22 cibles spectrales avec vos salves d'explosions en moins de 60 secondes sans perdre vos 3 cœurs.",
  "fields": [
    { "key": "targetKills", "label": "Cibles à détruire", "type": "number", "default": 22 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">✨ Feu Follet</span>
  <span id="stat">Cibles 0/22 • Vies 3 • 60s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : piloter le feu-follet (<b>89zG</b>) • <b>Clic / Maintenir / Espace</b> : salve d'explosions (<b>aGoH</b>)
</div>

<script>
const GAME_ID = "feu_follet_blast";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetKills = 22, durationSec = 60;
let ptr = { x: 256, y: 256, down: false };
let emitter = { x: 256, y: 256, vx: 0, vy: 0 };
let keys = {};

let wisps = [];   // 89zG particles
let bombs = [];   // aGoH explosion spheres
let enemies = []; // targets chasing emitter
let fireCd = 0, spawnCd = 0.4, invuln = 0;
let kills = 0, hp = 3, timeLeft = 60, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function fireExplosion(x, y) {
  const count = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count && bombs.length < 70; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
    const dist = 10 + Math.random() * 42;
    const maxR = 16 + Math.random() * 24;
    bombs.push({
      x: x + Math.cos(a) * dist,
      y: y + Math.sin(a) * dist,
      maxR,
      r: 1,
      age: 0,
      life: 0.45 + Math.random() * 0.35
    });
  }
}

function spawnEnemy() {
  if (enemies.length >= 8) return;
  const edge = Math.floor(Math.random() * 4);
  let x = 0, y = 0;
  if (edge === 0) { x = Math.random() * SIZE; y = -16; }
  else if (edge === 1) { x = SIZE + 16; y = Math.random() * SIZE; }
  else if (edge === 2) { x = Math.random() * SIZE; y = SIZE + 16; }
  else { x = -16; y = Math.random() * SIZE; }
  enemies.push({
    x, y,
    spd: 54 + (durationSec - timeLeft) * 0.8 + Math.random() * 28,
    r: 13,
    hp: 2,
    flash: 0
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetKills = Math.max(8, Number(custom.targetKills || 22));
  durationSec = Math.max(20, Number(custom.durationSec || 60));
  emitter = { x: 256, y: 256, vx: 0, vy: 0 };
  wisps = [];
  bombs = [];
  enemies = [];
  kills = 0; hp = 3; invuln = 0; fireCd = 0; spawnCd = 0.5;
  timeLeft = durationSec; score = 0; won = false; over = false;
  for (let i = 0; i < 3; i++) spawnEnemy();
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Cibles ${kills}/${targetKills} • Vies ${hp} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  if (fireCd <= 0) { fireExplosion(emitter.x, emitter.y); fireCd = 0.12; }
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (!over && fireCd <= 0) { fireExplosion(emitter.x, emitter.y); fireCd = 0.12; }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 270;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(10, Math.min(SIZE - 10, ptr.x));
  ptr.y = Math.max(10, Math.min(SIZE - 10, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = kills >= targetKills;
    updateStat(); return;
  }

  if (invuln > 0) invuln -= dt;
  if (fireCd > 0) fireCd -= dt;
  if ((ptr.down || keys.Space) && fireCd <= 0) {
    fireExplosion(emitter.x, emitter.y);
    fireCd = 0.14;
  }

  // 89zG spring physics on emitter
  const dx = ptr.x - emitter.x;
  const dy = ptr.y - emitter.y;
  const d = Math.hypot(dx, dy) * 0.2;
  const rad = Math.atan2(dy, dx);
  emitter.vx = (emitter.vx + Math.cos(rad) * d) * 0.72;
  emitter.vy = (emitter.vy + Math.sin(rad) * d) * 0.72;
  emitter.x += emitter.vx * dt * 45;
  emitter.y += emitter.vy * dt * 45;

  // Emit 89zG trail wisps
  for (let i = 0; i < 3 && wisps.length < 150; i++) {
    wisps.push({
      x: emitter.x + (Math.random() - 0.5) * 8,
      y: emitter.y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 28,
      vy: -35 - Math.random() * 80,
      r: 5 + Math.random() * 14,
      col: `rgb(${156 + ((Math.random() * 99) | 0)}, ${40 + ((Math.random() * 110) | 0)}, ${120 + ((Math.random() * 100) | 0)})`,
      life: 0.4 + Math.random() * 0.45,
      max: 0.85
    });
  }

  for (let i = wisps.length - 1; i >= 0; i--) {
    const w = wisps[i];
    w.vx += (Math.random() - 0.5) * 140 * dt;
    w.x += w.vx * dt;
    w.y += w.vy * dt;
    w.life -= dt;
    if (w.life <= 0) wisps.splice(i, 1);
  }

  // Update aGoH bombs
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.age += dt;
    const u = Math.min(1, b.age / b.life);
    b.r = b.maxR * Math.sin(u * Math.PI * 0.85);
    if (b.age >= b.life) bombs.splice(i, 1);
  }

  spawnCd -= dt;
  if (spawnCd <= 0) { spawnEnemy(); spawnCd = Math.max(0.6, 1.4 - (durationSec - timeLeft) * 0.012); }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    if (en.flash > 0) en.flash -= dt;
    const ex = emitter.x - en.x, ey = emitter.y - en.y;
    const dist = Math.hypot(ex, ey) || 1;
    en.x += (ex / dist) * en.spd * dt;
    en.y += (ey / dist) * en.spd * dt;

    let dead = false;
    for (const b of bombs) {
      if (Math.hypot(en.x - b.x, en.y - b.y) < en.r + b.r) {
        en.hp -= dt * 14;
        en.flash = 0.1;
        if (en.hp <= 0) {
          kills++;
          score += 110;
          enemies.splice(i, 1);
          dead = true;
          if (kills >= targetKills) {
            over = true; won = true;
            score += Math.round(timeLeft * 20);
            updateStat(); return;
          }
          break;
        }
      }
    }
    if (dead) continue;

    if (invuln <= 0 && dist < en.r + 12) {
      hp--;
      invuln = 1.1;
      enemies.splice(i, 1);
      if (hp <= 0) { over = true; won = false; updateStat(); return; }
    }
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#05060e";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Additive wisps & aGoH explosions
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const w of wisps) {
    const a = Math.max(0, w.life / w.max);
    ctx.globalAlpha = a * 0.65;
    const grd = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
    grd.addColorStop(0, w.col);
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
  }

  for (const b of bombs) {
    const a = Math.max(0, 1 - b.age / b.life);
    ctx.globalAlpha = a;
    ctx.shadowColor = "#ff5555";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#fff0fc";
    ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1, b.r), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Enemies
  for (const en of enemies) {
    ctx.fillStyle = en.flash > 0 ? "#fde047" : "rgba(239, 68, 68, 0.85)";
    ctx.strokeStyle = "#fda4af";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Emitter core
  ctx.fillStyle = invuln > 0 ? "#fca5a5" : "#fff";
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(emitter.x, emitter.y, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SPECTRES PULVÉRISÉS !" : (hp <= 0 ? "FEU FOLLET ÉTEINT" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Cibles ${kills}/${targetKills} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
