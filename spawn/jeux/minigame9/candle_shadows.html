<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Danse des Bougies &amp; Ombres Croisées (Candle Shadows)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fbbf24; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #030408; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,191,36,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "candle_shadows",
  "name": "Danse des Bougies & Ombres Croisées (Candle Shadows)",
  "family": "tactical",
  "icon": "🕯️",
  "controls": "Cliquer dans le vide pour poser une bougie (max 5) • Glisser sur une bougie pour la déplacer • Espace pose une bougie au curseur (ZQSD déplace)",
  "description": "Adapté de zX3D.as et m2mk.as (【AS100本ノック】11回目：ろうそく) : des bougies à flamme vacillante dont la cire fond lentement projettent entre elles de véritables cônes d'ombre tangents doux avec pénombre.",
  "goal": "Charger simultanément les 3 cristaux d'or (lumière) et les 2 cristaux d'obsidienne (cône d'ombre d'une bougie) jusqu'à 100 % en moins de 65 secondes.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🕯️ Bougies &amp; Ombres</span>
  <span id="stat">Or 0/3 • Ombre 0/2 • 65s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic</b> : poser bougie (max 5) • <b>Glisser</b> : déplacer une bougie (<b>zX3D/m2mk</b>) • Éclairez l'Or 🟡 et placez l'Obsidienne 🟣 dans l'ombre projetée
</div>

<script>
const GAME_ID = "candle_shadows";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let durationSec = 65;
let candles = [];
let goldCrystals = [];
let shadowCrystals = [];
let dragging = null;
let ptr = { x: 256, y: 256 };
let keys = {};
let timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function addCandle(x, y) {
  if (candles.length >= 5) candles.shift();
  candles.push({
    x, y,
    height: 20 + Math.random() * 14,
    radius: 10,
    maxPower: 250 + Math.random() * 35,
    power: 250,
    fading: false
  });
}

// Compute tangent shadow quad cast by `caster` from `source` (zX3D.as calcTangPoint)
function computeShadowPoly(source, caster) {
  const dx = caster.x - source.x;
  const dy = caster.y - source.y;
  const dis = Math.hypot(dx, dy);
  if (dis <= caster.radius + 2 || dis > source.power * 0.95) return null;

  const angle = Math.acos(Math.min(1, caster.radius / dis));
  const baseAng = Math.atan2(dy, dx);
  const t1x = caster.x + Math.cos(baseAng + angle) * caster.radius;
  const t1y = caster.y + Math.sin(baseAng + angle) * caster.radius;
  const t2x = caster.x + Math.cos(baseAng - angle) * caster.radius;
  const t2y = caster.y + Math.sin(baseAng - angle) * caster.radius;

  let castLen = 460;
  if (source.height > caster.height + 0.5) {
    castLen = Math.min(460, dis * (caster.height / (source.height - caster.height)));
  }
  const sc = 1 + castLen / dis;
  const c1x = source.x + (t1x - source.x) * sc;
  const c1y = source.y + (t1y - source.y) * sc;
  const c2x = source.x + (t2x - source.x) * sc;
  const c2y = source.y + (t2y - source.y) * sc;

  return [{ x: t1x, y: t1y }, { x: c1x, y: c1y }, { x: c2x, y: c2y }, { x: t2x, y: t2y }];
}

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-6) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  candles = [];
  addCandle(150, 260);
  addCandle(350, 260);

  goldCrystals = [
    { x: 110, y: 115, charge: 0 },
    { x: 400, y: 120, charge: 0 },
    { x: 256, y: 410, charge: 0 }
  ];
  shadowCrystals = [
    { x: 256, y: 170, charge: 0 },
    { x: 165, y: 365, charge: 0 }
  ];
  dragging = null;
  timeLeft = durationSec;
  score = 0; won = false; over = false;
  updateStat();
}

function updateStat() {
  const gDone = goldCrystals.filter(g => g.charge >= 1).length;
  const sDone = shadowCrystals.filter(s => s.charge >= 1).length;
  document.getElementById("stat").textContent =
    `Or ${gDone}/3 • Ombre ${sDone}/2 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(12, Math.min(SIZE - 12, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(12, Math.min(SIZE - 12, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  dragging = null;
  for (let i = candles.length - 1; i >= 0; i--) {
    if (Math.hypot(candles[i].x - p.x, candles[i].y - p.y) < 24) {
      dragging = candles[i];
      return;
    }
  }
  addCandle(p.x, p.y);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  if (dragging && !over) {
    dragging.x = p.x;
    dragging.y = p.y;
  }
});
cv.addEventListener("pointerup", () => { dragging = null; });
cv.addEventListener("pointercancel", () => { dragging = null; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); if (!over) addCandle(ptr.x, ptr.y); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 250;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(14, Math.min(SIZE - 14, ptr.x));
  ptr.y = Math.max(14, Math.min(SIZE - 14, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true;
    const gDone = goldCrystals.filter(g => g.charge >= 1).length;
    const sDone = shadowCrystals.filter(s => s.charge >= 1).length;
    won = (gDone === 3 && sDone === 2);
    updateStat(); return;
  }

  for (let i = candles.length - 1; i >= 0; i--) {
    const c = candles[i];
    if (!c.fading) {
      c.height -= 0.72 * dt;
      if (c.height <= 3) c.fading = true;
    } else {
      c.maxPower -= 280 * dt;
      if (c.maxPower <= 0) {
        if (dragging === c) dragging = null;
        candles.splice(i, 1);
        continue;
      }
    }
    c.power = c.maxPower * (0.95 + 0.09 * Math.random());
  }

  // Compute all tangent shadow cones
  const polys = [];
  for (let i = 0; i < candles.length; i++) {
    for (let j = 0; j < candles.length; j++) {
      if (i === j) continue;
      const poly = computeShadowPoly(candles[j], candles[i]);
      if (poly) polys.push({ poly, source: candles[j] });
    }
  }

  function isLitBy(pt, c) {
    if (Math.hypot(pt.x - c.x, pt.y - c.y) > c.power * 0.52) return false;
    for (const p of polys) {
      if (p.source === c && pointInPoly(pt.x, pt.y, p.poly)) return false;
    }
    return true;
  }

  for (const g of goldCrystals) {
    const lit = candles.some(c => isLitBy(g, c));
    if (lit) {
      g.charge = Math.min(1, g.charge + 0.16 * dt);
      score += 20 * dt;
    }
  }

  for (const s of shadowCrystals) {
    const inShadow = polys.some(p => pointInPoly(s.x, s.y, p.poly));
    const litUnblocked = candles.some(c => isLitBy(s, c));
    if (inShadow && !litUnblocked) {
      s.charge = Math.min(1, s.charge + 0.22 * dt);
      score += 30 * dt;
    }
  }

  const gDone = goldCrystals.filter(g => g.charge >= 1).length;
  const sDone = shadowCrystals.filter(s => s.charge >= 1).length;
  if (gDone === 3 && sDone === 2) {
    over = true; won = true;
    score += 500 + Math.round(timeLeft * 25);
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#030408";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Warm radial candle light
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const c of candles) {
    const r = c.power * 0.55;
    const grd = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, r);
    grd.addColorStop(0, "rgba(255, 218, 165, 0.95)");
    grd.addColorStop(0.28, "rgba(187, 170, 136, 0.45)");
    grd.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Tangent shadow cones (zX3D)
  for (let i = 0; i < candles.length; i++) {
    for (let j = 0; j < candles.length; j++) {
      if (i === j) continue;
      const poly = computeShadowPoly(candles[j], candles[i]);
      if (!poly) continue;
      ctx.fillStyle = "rgba(2, 4, 10, 0.86)";
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      ctx.lineTo(poly[1].x, poly[1].y);
      ctx.lineTo(poly[2].x, poly[2].y);
      ctx.lineTo(poly[3].x, poly[3].y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Gold & Obsidian crystals
  for (const g of goldCrystals) {
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(g.x, g.y, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(250, 204, 21, 0.45)";
    ctx.beginPath(); ctx.arc(g.x, g.y, 16 * g.charge, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef08a";
    ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.charge >= 1 ? "✓" : "☀", g.x, g.y);
  }

  for (const s of shadowCrystals) {
    ctx.strokeStyle = "#c084fc";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(168, 85, 247, 0.55)";
    ctx.beginPath(); ctx.arc(s.x, s.y, 16 * s.charge, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e9d5ff";
    ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(s.charge >= 1 ? "✓" : "🌑", s.x, s.y);
  }

  // Candle wax + flickering flame
  for (const c of candles) {
    ctx.fillStyle = "#f1f5f9";
    ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
    const fx = c.x + (Math.random() - 0.5) * 3;
    const fy = c.y + (Math.random() - 0.5) * 3;
    const fl = ctx.createRadialGradient(fx, fy, 1, fx, fy, 16);
    fl.addColorStop(0, "#ffffff");
    fl.addColorStop(0.4, "#fb923c");
    fl.addColorStop(1, "rgba(251,146,60,0)");
    ctx.fillStyle = fl;
    ctx.beginPath(); ctx.arc(fx, fy, 16, 0, Math.PI * 2); ctx.fill();

    // Wax height bar
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillRect(c.x - 10, c.y + 13, 20 * Math.max(0, c.height / 34), 3);
  }

  if (!over) {
    ctx.strokeStyle = "rgba(251, 191, 36, 0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 9, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "OMBRES ÉQUILIBRÉES !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${Math.round(score)}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
