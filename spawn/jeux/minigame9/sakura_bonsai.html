<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Verger Sakura &amp; Grammaires Botaniques (Sakura Bonsai)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #f9a8d4; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.sp-btn { background: #3b1c36; border-color: #f9a8d4; color: #fbcfe8; }
  canvas { background: #0a101d; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(249,168,212,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "sakura_bonsai",
  "name": "Verger Sakura & Grammaires Botaniques (Sakura Bonsai)",
  "family": "zooEcosys",
  "icon": "🌸",
  "controls": "Cliquer sur le sol pour créer une motte, cliquer sur une motte pour faire pousser l'arbre (ou tailler un arbre parasité) • Espace/1-4 change d'espèce • ZQSD déplace le curseur",
  "description": "Fusion de 9 scripts botaniques (lXk5, ePOA Sakura + rafales de pétales, grammaires CFDG eqky/tTkK/zIfd, arbre d'automne wX3y, graines 4t2u/j4h8 et lianes à bulles x3Bj) : cultivez un verger procédural vivant.",
  "goal": "Récolter 25 fleurs de pollen doré en moins de 65 secondes tout en taillant les arbres infectés avant que la corruption n'atteigne 100 %.",
  "fields": [
    { "key": "targetPollen", "label": "Pollen à récolter", "type": "number", "default": 25 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌸 Verger CFDG</span>
  <span id="stat">Pollen 0/25 • Corruption 0% • 65s</span>
  <div class="bar-btns">
    <button id="spBtn" class="sp-btn" onclick="cycleSpecies()" title="Changer d'espèce (Espace)">🌸 Sakura</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic</b> : créer motte / planter / tailler • <b>Survol</b> : récolter les pétales/pollen • <b>Espace</b> : espèce (Sakura, CFDG, Automne, Bulles)
</div>

<script>
const GAME_ID = "sakura_bonsai";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const SPECIES = [
  { id: "sakura", label: "🌸 Sakura", col: "#f9a8d4", trunk: "#92400e" },
  { id: "cfdg", label: "🌿 CFDG", col: "#4ade80", trunk: "#166534" },
  { id: "autumn", label: "🍁 Automne", col: "#fb923c", trunk: "#451a03" },
  { id: "bubble", label: "🫧 Bulles", col: "#7dd3fc", trunk: "#1e3a8a" }
];

let targetPollen = 25, durationSec = 65;
let spIdx = 0;
let grounds = []; // NyoGround mounds
let petals = [];  // ePOA / 4t2u / x3Bj drifting blossoms
let sunZones = [];
let ptr = { x: 256, y: 256 };
let keys = {};
let pollen = 0, corruption = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0, blightTimer = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function cycleSpecies(idx) {
  spIdx = typeof idx === "number" ? idx : (spIdx + 1) % SPECIES.length;
  document.getElementById("spBtn").textContent = SPECIES[spIdx].label;
}

function buildTreeSegments(species, x, y) {
  const segs = [];
  const leaves = [];
  if (species === "sakura" || species === "autumn") {
    // Recursive branching inspired by NyoTree (lXk5) and wX3y
    function branch(bx, by, ang, len, depth, maxD) {
      if (depth <= 0 || segs.length > 75) return;
      const nx = bx + Math.cos(ang) * len;
      const ny = by + Math.sin(ang) * len;
      segs.push({ x1: bx, y1: by, x2: nx, y2: ny, w: Math.max(1, depth * 0.9), order: maxD - depth });
      if (depth <= 3) {
        leaves.push({ x: nx, y: ny, r: 3 + Math.random() * 4, order: maxD - depth });
      }
      const spread = species === "autumn" ? 0.55 : 0.45;
      branch(nx, ny, ang - spread + (Math.random() - 0.5) * 0.25, len * 0.72, depth - 1, maxD);
      branch(nx, ny, ang + spread + (Math.random() - 0.5) * 0.25, len * 0.72, depth - 1, maxD);
      if (species === "autumn" && Math.random() < 0.65) {
        branch(nx, ny, ang + (Math.random() - 0.5) * 0.15, len * 0.76, depth - 1, maxD);
      }
    }
    branch(x, y - 6, -Math.PI / 2, 34, 5, 5);
  } else if (species === "cfdg") {
    // ContextFreeArt / 4t2u dot-chain grammar
    function ruleTree(cx, cy, ang, sc, step) {
      if (sc < 0.22 || segs.length > 75 || step > 28) return;
      const nx = cx + Math.cos(ang) * 11 * sc;
      const ny = cy + Math.sin(ang) * 11 * sc;
      segs.push({ x1: cx, y1: cy, x2: nx, y2: ny, w: sc * 5, order: Math.floor(step / 3) });
      leaves.push({ x: nx, y: ny, r: sc * 5.2, order: Math.floor(step / 3) });
      if (Math.random() < 0.22 && step > 3) {
        ruleTree(nx, ny, ang + 0.5, sc * 0.72, step + 1);
        ruleTree(nx, ny, ang - 0.45, sc * 0.72, step + 1);
      } else {
        ruleTree(nx, ny, ang + 0.06, sc * 0.94, step + 1);
      }
    }
    ruleTree(x, y - 6, -Math.PI / 2, 1.0, 0);
  } else {
    // x3Bj wavy stalk + bubbles
    let cx = x, cy = y - 6;
    for (let i = 0; i < 16; i++) {
      const nx = cx + (Math.random() - 0.5) * 14;
      const ny = cy - 8 - Math.random() * 4;
      segs.push({ x1: cx, y1: cy, x2: nx, y2: ny, w: 2.2, order: Math.floor(i / 3) });
      leaves.push({ x: nx + (Math.random() - 0.5) * 14, y: ny, r: 3 + Math.random() * 6, order: Math.floor(i / 3) });
      cx = nx; cy = ny;
    }
  }
  return { segs, leaves };
}

function createGround(x, y) {
  if (grounds.length >= 16) grounds.shift();
  grounds.push({
    x, y,
    tree: null,
    growth: 0,
    blighted: false,
    bloomTimer: 0.6
  });
}

function plantOnGround(g) {
  const sp = SPECIES[spIdx];
  const geom = buildTreeSegments(sp.id, g.x, g.y);
  g.tree = { sp, segs: geom.segs, leaves: geom.leaves };
  g.growth = 0;
  g.blighted = false;
  g.bloomTimer = 0.7;
  // ePOA burst of initial petals
  for (let i = 0; i < 6; i++) {
    petals.push({
      x: g.x + (Math.random() - 0.5) * 24,
      y: g.y - 45 - Math.random() * 40,
      vx: (Math.random() - 0.5) * 48,
      vy: -30 - Math.random() * 40,
      r: 5.5,
      col: sp.col,
      life: 6.5,
      golden: true
    });
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetPollen = Math.max(8, Number(custom.targetPollen || 25));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  grounds = [];
  petals = [];
  sunZones = [
    { x: 130, y: 270, r: 72 },
    { x: 375, y: 230, r: 72 },
    { x: 256, y: 400, r: 78 }
  ];
  pollen = 0;
  corruption = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  blightTimer = 3.5;

  // Starter mounds
  createGround(135, 300);
  createGround(375, 260);
  plantOnGround(grounds[0]);
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Pollen ${pollen}/${targetPollen} • Corruption ${Math.round(corruption)}% • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

function handleActionAt(x, y) {
  // Check grounds from top-most to bottom (lXk5 priority)
  for (let i = grounds.length - 1; i >= 0; i--) {
    const g = grounds[i];
    if (Math.abs(x - g.x) < 38 && y > g.y - 42 && y < g.y + 18) {
      if (!g.tree) {
        plantOnGround(g);
        // Bring to front
        grounds.splice(i, 1);
        grounds.push(g);
      } else {
        if (g.blighted) score += 80;
        g.tree = null;
        g.blighted = false;
      }
      return;
    }
  }
  // Otherwise create new NyoGround
  createGround(x, Math.max(120, Math.min(SIZE - 20, y + 8)));
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  handleActionAt(p.x, p.y);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); if (!over) cycleSpecies(); }
  else if (e.code === "Digit1") cycleSpecies(0);
  else if (e.code === "Digit2") cycleSpecies(1);
  else if (e.code === "Digit3") cycleSpecies(2);
  else if (e.code === "Digit4") cycleSpecies(3);
  else if (e.code === "Enter" || e.code === "KeyE") { if (!over) handleActionAt(ptr.x, ptr.y); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 240;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(16, Math.min(SIZE - 16, ptr.x));
  ptr.y = Math.max(16, Math.min(SIZE - 16, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = pollen >= targetPollen;
    updateStat(); return;
  }

  blightTimer -= dt;
  if (blightTimer <= 0) {
    blightTimer = 3.2;
    const healthy = grounds.filter(g => g.tree && !g.blighted);
    if (healthy.length > 0) {
      healthy[(Math.random() * healthy.length) | 0].blighted = true;
    }
  }

  let blightedCount = 0;
  for (const g of grounds) {
    if (!g.tree) continue;
    g.growth = Math.min(6, g.growth + dt * 3.4);
    if (g.blighted) {
      blightedCount++;
    } else if (g.growth >= 4) {
      const inSun = sunZones.some(z => Math.hypot(g.x - z.x, g.y - z.y) < z.r);
      g.bloomTimer -= dt * (inSun ? 1.8 : 1.0);
      if (g.bloomTimer <= 0 && petals.length < 75) {
        g.bloomTimer = 1.15;
        const lv = g.tree.leaves[(Math.random() * g.tree.leaves.length) | 0];
        if (lv) {
          petals.push({
            x: lv.x, y: lv.y,
            vx: (Math.random() - 0.5) * 35,
            vy: -15 + Math.random() * 25,
            r: 5.5,
            col: g.tree.sp.col,
            life: 7,
            golden: true
          });
        }
      }
    }
  }

  if (blightedCount > 0) {
    corruption = Math.min(100, corruption + blightedCount * 5.2 * dt);
  } else {
    corruption = Math.max(0, corruption - 4.0 * dt);
  }
  if (corruption >= 100) {
    over = true; won = false; updateStat(); return;
  }

  // Petals drift & collection near cursor
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.vy += 24 * dt;
    p.vx *= 0.99;
    p.x += (p.vx + Math.sin(p.life * 4) * 14) * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    const d = Math.hypot(p.x - ptr.x, p.y - ptr.y);
    if (d < 44) {
      // Gently pull toward cursor
      p.x += (ptr.x - p.x) * 8 * dt;
      p.y += (ptr.y - p.y) * 8 * dt;
    }
    if (d < 20) {
      pollen++;
      score += 100;
      petals.splice(i, 1);
      if (pollen >= targetPollen) {
        over = true; won = true;
        score += Math.round(timeLeft * 20);
        updateStat(); return;
      }
      continue;
    }
    if (p.life <= 0 || p.y > SIZE + 12) petals.splice(i, 1);
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#0a101d";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Sun fertile zones
  for (const z of sunZones) {
    const grd = ctx.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r);
    grd.addColorStop(0, "rgba(253, 224, 71, 0.16)");
    grd.addColorStop(1, "rgba(253, 224, 71, 0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(253, 224, 71, 0.22)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.75, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Grounds & trees
  for (const g of grounds) {
    // NyoGround curved mound
    ctx.fillStyle = g.blighted ? "rgba(185, 28, 28, 0.75)" : "rgba(120, 66, 26, 0.85)";
    ctx.beginPath();
    ctx.moveTo(g.x - 36, g.y);
    ctx.quadraticCurveTo(g.x, g.y - 26, g.x + 36, g.y);
    ctx.closePath();
    ctx.fill();

    if (g.tree) {
      const t = g.tree;
      ctx.strokeStyle = g.blighted ? "#ef4444" : t.sp.trunk;
      for (const s of t.segs) {
        if (s.order > g.growth) continue;
        ctx.lineWidth = s.w;
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      }
      ctx.fillStyle = g.blighted ? "rgba(239, 68, 68, 0.78)" : t.sp.col;
      for (const lv of t.leaves) {
        if (lv.order > g.growth) continue;
        ctx.beginPath(); ctx.arc(lv.x, lv.y, lv.r, 0, Math.PI * 2); ctx.fill();
      }
      if (g.blighted) {
        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("✂️ TAILLER", g.x, g.y + 13);
      }
    }
  }

  // Petals
  for (const p of petals) {
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  if (!over) {
    ctx.strokeStyle = SPECIES[spIdx].col;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 16, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "VERGER FLEURI !" : (corruption >= 100 ? "JARDIN CORROMPU" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Pollen ${pollen}/${targetPollen} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
