<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Canopée Fractale &amp; Forêt au Vent (Wind Canopy)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #86efac; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #050a12; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(134,239,172,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "wind_canopy",
  "name": "Canopée Fractale & Forêt au Vent (Wind Canopy)",
  "family": "topMouseMut",
  "icon": "🌬️",
  "controls": "Déplacer le curseur (ou ZQSD/Flèches) : X ouvre l'angle fractal et courbe la forêt, Y règle la hauteur • Clic/Espace replie brièvement la canopée pour esquiver les éclairs",
  "description": "Fusion de yvTY.as (forêt qui se courbe vers le curseur), xJhT.as (arbre fractal interactif 0-90°), 9KQy.as (sapin dans la brise), 3QhW.as (palmes élastiques) et mFSu.as (pluie d'herbe ascendante).",
  "goal": "Capturer 28 lucioles dorées dans vos branches en moins de 60 secondes tout en esquivant les éclairs rouges (3 PV).",
  "fields": [
    { "key": "targetFireflies", "label": "Lucioles à capturer", "type": "number", "default": 28 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌬️ Canopée Fractale</span>
  <span id="stat">Lucioles 0/28 • PV 3 • 60s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : ouvrir &amp; courber les branches fractales (<b>xJhT / yvTY</b>) • <b>Clic / Espace</b> : replier contre les éclairs rouges
</div>

<script>
const GAME_ID = "wind_canopy";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetFireflies = 28, durationSec = 60;
let ptr = { x: 256, y: 180, down: false };
let mx = 0, my = 0; // smoothed yvTY offsets
let keys = {};
let grass = [];     // mFSu ascending grass particles
let palms = [];     // 3QhW flexible ropes
let tips = [];      // active fractal branch tips for collision
let fireflies = [];
let bolts = [];
let tClock = 0, flyTimer = 0, boltTimer = 1.6, invuln = 0;
let caught = 0, hp = 3, timeLeft = 60, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnFirefly() {
  if (fireflies.length >= 7) return;
  const fromLeft = Math.random() < 0.5;
  fireflies.push({
    x: fromLeft ? -14 : SIZE + 14,
    y: 48 + Math.random() * 290,
    vx: (fromLeft ? 1 : -1) * (46 + Math.random() * 44),
    vy: (Math.random() - 0.5) * 28,
    r: 8,
    phase: Math.random() * 6.28
  });
}

function spawnBolt() {
  if (bolts.length >= 4) return;
  bolts.push({
    x: 45 + Math.random() * (SIZE - 90),
    y: -24,
    vy: 155 + Math.random() * 55,
    r: 13
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetFireflies = Math.max(8, Number(custom.targetFireflies || 28));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  grass = Array.from({ length: 80 }, () => ({
    x: Math.random() * SIZE,
    y: SIZE - Math.random() * 140,
    vx: (Math.random() - 0.5) * 22,
    vy: -25 - Math.random() * 45,
    col: ["#5fb404", "#0b610b", "#868a08", "#81f781"][(Math.random() * 4) | 0]
  }));

  palms = Array.from({ length: 6 }, (_, idx) => ({
    baseX: 60 + idx * 78,
    nodes: Array.from({ length: 12 }, () => ({ x: 60 + idx * 78, y: SIZE }))
  }));

  fireflies = [];
  bolts = [];
  for (let i = 0; i < 4; i++) spawnFirefly();
  caught = 0; hp = 3; invuln = 0;
  timeLeft = durationSec;
  score = 0; won = false; over = false;
  flyTimer = 0.4; boltTimer = 1.8;
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Lucioles ${caught}/${targetFireflies} • PV ${hp} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 270;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(8, Math.min(SIZE - 8, ptr.x));
  ptr.y = Math.max(8, Math.min(SIZE - 8, ptr.y));

  tClock += dt;
  if (invuln > 0) invuln -= dt;

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = caught >= targetFireflies;
    updateStat(); return;
  }

  const tx = ptr.x / SIZE - 0.5;
  const ty = ptr.y / SIZE - 0.5;
  mx += (tx - mx) * 0.22;
  my += (ty - my) * 0.22;

  // mFSu ascending grass
  for (const g of grass) {
    g.vx *= 1.005; g.vy *= 1.005;
    g.x += (g.vx + mx * 45) * dt;
    g.y += g.vy * dt;
    if (g.y < 300 || g.x < 0 || g.x > SIZE) {
      g.x = Math.random() * SIZE;
      g.y = SIZE;
      g.vx = (Math.random() - 0.5) * 20;
      g.vy = -25 - Math.random() * 45;
    }
  }

  // 3QhW palm ropes
  for (const pl of palms) {
    let px = pl.baseX + mx * 70 + Math.sin(tClock * 2.5 + pl.baseX) * 14;
    let py = SIZE - 95 - my * 40;
    for (let i = pl.nodes.length - 1; i >= 0; i--) {
      const n = pl.nodes[i];
      n.x += (px - n.x) * 0.35;
      n.y += (py - n.y) * 0.35 + (i * 0.85);
      px = n.x; py = n.y;
    }
  }

  // Compute active fractal branch tips (xJhT + 9KQy)
  tips = [];
  const tucked = ptr.down || keys.Space;
  const openRatio = tucked ? 0.08 : (ptr.x / SIZE);
  const theta = openRatio * (Math.PI * 0.48);
  const baseLen = tucked ? 65 : (145 - (ptr.y / SIZE) * 45);
  const sway = Math.sin(tClock * 2.2) * 0.06 + mx * 0.55;

  function traceTree(x, y, ang, len, depth) {
    const nx = x + Math.sin(ang) * len;
    const ny = y - Math.cos(ang) * len;
    if (depth <= 2) tips.push({ x: nx, y: ny });
    if (len > 14 && depth > 0) {
      traceTree(nx, ny, ang + theta + sway * 0.15, len * 0.66, depth - 1);
      traceTree(nx, ny, ang - theta + sway * 0.15, len * 0.66, depth - 1);
    }
  }
  const rootX = 256 + mx * 30;
  const trunkTopX = rootX + Math.sin(sway * 0.5) * baseLen;
  const trunkTopY = SIZE - Math.cos(sway * 0.5) * baseLen;
  traceTree(trunkTopX, trunkTopY, sway * 0.5, baseLen * 0.72, 5);

  flyTimer -= dt;
  if (flyTimer <= 0) { spawnFirefly(); flyTimer = 0.75; }
  boltTimer -= dt;
  if (boltTimer <= 0) { spawnBolt(); boltTimer = Math.max(0.9, 2.0 - (durationSec - timeLeft) * 0.015); }

  // Fireflies caught by branch tips
  for (let i = fireflies.length - 1; i >= 0; i--) {
    const f = fireflies[i];
    f.phase += dt * 5;
    f.x += f.vx * dt;
    f.y += (f.vy + Math.sin(f.phase) * 26) * dt;
    if (f.x < -30 || f.x > SIZE + 30) { fireflies.splice(i, 1); continue; }

    let got = false;
    for (const tp of tips) {
      if (Math.hypot(f.x - tp.x, f.y - tp.y) < 18) {
        caught++;
        score += 110;
        fireflies.splice(i, 1);
        got = true;
        if (caught >= targetFireflies) {
          over = true; won = true;
          score += Math.round(timeLeft * 20);
          updateStat(); return;
        }
        break;
      }
    }
    if (got) continue;
  }

  // Red lightning bolts hitting branch tips
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.y += b.vy * dt;
    if (b.y > SIZE + 20) { bolts.splice(i, 1); continue; }
    if (invuln <= 0) {
      for (const tp of tips) {
        if (Math.hypot(b.x - tp.x, b.y - tp.y) < 15) {
          hp--;
          invuln = 1.1;
          bolts.splice(i, 1);
          if (hp <= 0) { over = true; won = false; updateStat(); return; }
          break;
        }
      }
    }
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#050a12";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // mFSu grass rain
  for (const g of grass) {
    ctx.fillStyle = g.col;
    ctx.fillRect(g.x, g.y, 2, 7);
  }

  // 3QhW flexible background palms
  ctx.strokeStyle = "rgba(34, 197, 94, 0.35)";
  for (const pl of palms) {
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pl.baseX, SIZE);
    for (let i = pl.nodes.length - 1; i >= 0; i--) {
      ctx.lineTo(pl.nodes[i].x, pl.nodes[i].y);
    }
    ctx.stroke();
  }

  // yvTY side bending saplings
  function drawSapling(x, y, vx, vy, depth) {
    if (depth <= 0) return;
    const nx = x + vx, ny = y + vy;
    ctx.strokeStyle = "rgba(163, 230, 53, 0.45)";
    ctx.lineWidth = depth * 1.4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
    drawSapling(nx, ny, vx * 0.72 + mx * 16 + 8, vy * 0.72 + my * 10, depth - 1);
    drawSapling(nx, ny, vx * 0.72 + mx * 16 - 8, vy * 0.72 + my * 10, depth - 1);
  }
  drawSapling(70, SIZE, mx * 12, -26, 3);
  drawSapling(442, SIZE, mx * 12, -26, 3);

  // Main xJhT + 9KQy interactive fractal tree
  const tucked = ptr.down || keys.Space;
  const openRatio = tucked ? 0.08 : (ptr.x / SIZE);
  const theta = openRatio * (Math.PI * 0.48);
  const baseLen = tucked ? 65 : (145 - (ptr.y / SIZE) * 45);
  const sway = Math.sin(tClock * 2.2) * 0.06 + mx * 0.55;
  const rootX = 256 + mx * 30;
  const trunkTopX = rootX + Math.sin(sway * 0.5) * baseLen;
  const trunkTopY = SIZE - Math.cos(sway * 0.5) * baseLen;

  ctx.strokeStyle = invuln > 0 ? "#fda4af" : "#86efac";
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(rootX, SIZE); ctx.lineTo(trunkTopX, trunkTopY); ctx.stroke();

  function drawFractal(x, y, ang, len, depth) {
    const nx = x + Math.sin(ang) * len;
    const ny = y - Math.cos(ang) * len;
    ctx.strokeStyle = invuln > 0 ? "#fda4af" : (depth <= 2 ? "#bbf7d0" : "#4ade80");
    ctx.lineWidth = Math.max(1, depth * 0.75);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
    if (len > 14 && depth > 0) {
      drawFractal(nx, ny, ang + theta + sway * 0.15, len * 0.66, depth - 1);
      drawFractal(nx, ny, ang - theta + sway * 0.15, len * 0.66, depth - 1);
    }
  }
  drawFractal(trunkTopX, trunkTopY, sway * 0.5, baseLen * 0.72, 5);

  // Fireflies
  for (const f of fireflies) {
    const grd = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, 16);
    grd.addColorStop(0, "#fef9c3");
    grd.addColorStop(0.5, "rgba(250,204,21,0.55)");
    grd.addColorStop(1, "rgba(250,204,21,0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(f.x, f.y, 16, 0, Math.PI * 2); ctx.fill();
  }

  // Red lightning bolts
  for (const b of bolts) {
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x - 5, b.y - 14);
    ctx.lineTo(b.x + 5, b.y - 2);
    ctx.lineTo(b.x - 4, b.y + 4);
    ctx.lineTo(b.x + 4, b.y + 16);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CANOPÉE ILLUMINÉE !" : (hp <= 0 ? "CANOPÉE FOUDROYÉE" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Lucioles ${caught}/${targetFireflies} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
