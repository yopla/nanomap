<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pluie de Confettis 3D (Kamikire Confetti)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #67e8f9; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #081c3a; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(103,232,249,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "kamikire_confetti",
  "name": "Pluie de Confettis 3D (Kamikire Confetti)",
  "family": "core",
  "icon": "🎊",
  "controls": "Glisser / déplacer le souffleur (ou Flèches/ZQSD) pour souffler des courants d'air • Clic / Espace donne une bouffée vers le haut qui retourne les confettis",
  "description": "Adapté de tVmM.as (なんちゃって紙ふぶき Kamikire) : 240 carrés de papier bifaces (face colorée / dos gris) tournent en 3D autour d'axes unitaires (Ax,Ay,Az) en flottant dans un espace torique.",
  "goal": "Souffler et guider 24 confettis côté FACE COLORÉE dans le panier doré en bas en moins de 60 secondes.",
  "fields": [
    { "key": "targetCaught", "label": "Confettis à trier", "type": "number", "default": 24 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎊 Kamikire 3D</span>
  <span id="stat">Triés 0/24 • 60s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser / ZQSD</b> : courant d'air sur les confettis 3D (<b>tVmM</b>) • <b>Clic / Espace</b> : souffle ascendant • Attrapez les confettis côté brillant dans le panier doré
</div>

<script>
const GAME_ID = "kamikire_confetti";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetCaught = 24, durationSec = 60;
let pieces = [];
let basket = { x: 256, y: 474, w: 124, h: 24, vx: 80 };
let ptr = { x: 256, y: 256, px: 256, py: 256, down: false };
let keys = {};
let caught = 0, timeLeft = 60, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

// Faithful 3D tumbling Kamikire paper square from tVmM.as
function makePiece(i, total) {
  const t = Math.random() * Math.PI * 2;
  const r = Math.floor((1 + Math.cos(t)) * 127.99);
  const g = Math.floor((1 + Math.cos(t + Math.PI * 2 / 3)) * 127.99);
  const b = Math.floor((1 + Math.cos(t - Math.PI * 2 / 3)) * 127.99);
  const faceColor = `rgb(${r},${g},${b})`;
  const shade = Math.floor(120 + Math.random() * 60);
  const backColor = `rgb(${shade},${shade},${shade})`;

  let ax = 1, ay = Math.random(), az = Math.random() * 2 - 1;
  const l = Math.hypot(ax, ay, az);
  ax /= l; ay /= l; az /= l;
  const s = Math.hypot(ax, ay);
  let bx, by, bz, cx, cy, cz;
  if (s === 0) {
    bx = 1; by = 0; bz = 0; cx = 0; cy = 1; cz = 0;
  } else {
    bx = ay / s; by = -ax / s; bz = 0;
    cx = (ax * az) / (s * l); cy = (ay * az) / (s * l); cz = -(s * s) / (s * l);
  }
  return {
    x: 16 + (i / total) * (SIZE - 32),
    y: Math.random() * (SIZE - 80),
    vx: 0, vy: 0,
    ax, ay, az, bx, by, bz, cx, cy, cz,
    theta: Math.random() * Math.PI * 2,
    omega: (Math.random() * 2 - 1) * 5.2,
    fallTheta: (Math.random() - 0.5) * 0.6,
    fallSpeed: 65 + Math.random() * 48,
    faceColor, backColor,
    size: 11
  };
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetCaught = Math.max(8, Number(custom.targetCaught || 24));
  durationSec = Math.max(20, Number(custom.durationSec || 60));
  const N = 220;
  pieces = Array.from({ length: N }, (_, i) => makePiece(i, N));
  basket = { x: 256, y: 474, w: 124, h: 24, vx: 82 };
  caught = 0; timeLeft = durationSec; score = 0; won = false; over = false;
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Triés ${caught}/${targetCaught} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.px = ptr.x = p.x; ptr.py = ptr.y = p.y; ptr.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 280;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x));
  ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = caught >= targetCaught;
    updateStat(); return;
  }

  basket.x += basket.vx * dt;
  if (basket.x < basket.w / 2 + 12 || basket.x > SIZE - basket.w / 2 - 12) basket.vx *= -1;

  const windX = (ptr.x - ptr.px) * 18;
  const windY = (ptr.y - ptr.py) * 18;
  ptr.px = ptr.x; ptr.py = ptr.y;

  const puff = ptr.down || keys.Space;

  for (let i = 0; i < pieces.length; i++) {
    const k = pieces[i];
    k.theta = (k.theta + k.omega * dt) % (Math.PI * 2);
    if (k.theta < 0) k.theta += Math.PI * 2;
    k.fallTheta += (Math.random() * 2 - 1) * 0.25;
    if (k.fallTheta < -Math.PI / 2) k.fallTheta = -Math.PI - k.fallTheta;
    if (k.fallTheta > Math.PI / 2) k.fallTheta = Math.PI - k.fallTheta;

    // Air flow from cursor
    const dx = k.x - ptr.x, dy = k.y - ptr.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 85) {
      const f = (1 - dist / 85);
      k.vx += (windX * 0.25 + (puff ? dx * 3.5 : 0)) * f * dt * 14;
      k.vy += (windY * 0.25 + (puff ? -260 : 0)) * f * dt * 14;
      if (puff) k.theta += 0.2;
    }

    k.vx *= 0.94;
    k.vy *= 0.94;
    k.x += (k.fallSpeed * Math.sin(k.fallTheta) + k.vx) * dt;
    k.y += (k.fallSpeed * Math.cos(k.fallTheta) + k.vy) * dt;

    if (k.x > SIZE) k.x -= SIZE;
    if (k.x < 0) k.x += SIZE;

    // Basket catch check
    const cosT = Math.cos(k.theta);
    const showingFace = (k.az * k.az + (k.bz * k.bz + k.cz * k.cz) * cosT) >= 0;
    if (k.y >= basket.y - 8 && k.y <= basket.y + basket.h && Math.abs(k.x - basket.x) <= basket.w * 0.5) {
      if (showingFace) {
        caught++;
        score += 100;
        k.y = 8;
        k.x = 20 + Math.random() * (SIZE - 40);
        if (caught >= targetCaught) {
          over = true; won = true;
          score += Math.round(timeLeft * 20);
          updateStat(); return;
        }
      } else {
        // Grey back bounces off lightly
        k.vy = -120;
        k.theta += Math.PI;
      }
    }

    if (k.y > SIZE) k.y -= SIZE;
  }

  updateStat();
}

function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, SIZE);
  bg.addColorStop(0, "#0ea5e9");
  bg.addColorStop(0.55, "#1d4ed8");
  bg.addColorStop(1, "#0f172a");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Golden target basket
  ctx.fillStyle = "rgba(250, 204, 21, 0.25)";
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 3;
  ctx.fillRect(basket.x - basket.w / 2, basket.y, basket.w, basket.h);
  ctx.strokeRect(basket.x - basket.w / 2, basket.y, basket.w, basket.h);
  ctx.fillStyle = "#fef9c3";
  ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("PANIER FACE COULEUR", basket.x, basket.y + basket.h / 2);

  // 3D rotated Kamikire paper squares
  for (const k of pieces) {
    const _cos = Math.cos(k.theta), _sin = Math.sin(k.theta);
    const fx = k.ax * k.ax + (k.bx * k.bx + k.cx * k.cx) * _cos;
    const fy = k.ax * k.ay + (k.bx * k.by + k.cx * k.cy) * _cos + (k.bx * k.cy - k.cx * k.by) * _sin;
    const gx = k.ax * k.ay + (k.by * k.bx + k.cy * k.cx) * _cos + (k.by * k.cx - k.cy * k.bx) * _sin;
    const gy = k.ay * k.ay + (k.by * k.by + k.cy * k.cy) * _cos;
    const face = (k.az * k.az + (k.bz * k.bz + k.cz * k.cz) * _cos) >= 0;
    const h = k.size * 0.5;

    ctx.fillStyle = face ? k.faceColor : k.backColor;
    ctx.beginPath();
    ctx.moveTo(k.x + (fx + gx) * h, k.y + (fy + gy) * h);
    ctx.lineTo(k.x + (-fx + gx) * h, k.y + (-fy + gy) * h);
    ctx.lineTo(k.x + (-fx - gx) * h, k.y + (-fy - gy) * h);
    ctx.lineTo(k.x + (fx - gx) * h, k.y + (fy - gy) * h);
    ctx.closePath();
    ctx.fill();
  }

  if (!over) {
    ctx.strokeStyle = (ptr.down || keys.Space) ? "#fde047" : "#bae6fd";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, (ptr.down || keys.Space) ? 55 : 28, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CONFETTIS TRIÉS !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Triés ${caught}/${targetCaught} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
