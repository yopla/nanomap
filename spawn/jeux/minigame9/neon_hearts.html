<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pluie de Cœurs Néon (Neon Hearts)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #f472b6; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.mode-burst { background: #4a1942; border-color: #f472b6; color: #fbcfe8; }
  button.mode-pulse { background: #1e3a5f; border-color: #38d6ff; color: #bae6fd; }
  canvas { background: #050710; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(244,114,182,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "neon_hearts",
  "name": "Pluie de Cœurs Néon (Neon Hearts)",
  "family": "topMouseHnS",
  "icon": "❤️",
  "controls": "Maintenir Clic/Toucher (ou Espace) pour projeter une rafale de cœurs néon • Clic rapide pour un grand cœur Bézier chargé • ZQSD/Flèches déplace le curseur",
  "description": "Fusion de 4CD8.as, spjD.as, qkRJ.as et qX2N.as (NeonHearts) : des cœurs paramétriques de Bézier se tracent progressivement en mode additif avec halo néon et chutent en easeInBack rotatif.",
  "goal": "Charger 24 essences dorées dérivantes avec vos cœurs néon en moins de 60 secondes sans laisser 5 ombres rouges franchir le bas.",
  "fields": [
    { "key": "targetGoal", "label": "Essences à charger", "type": "number", "default": 24 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">❤️ Cœurs Néon</span>
  <span id="stat">Essences 0/24 • Vies 5 • 60s</span>
  <div class="bar-btns">
    <button id="modeBtn" class="mode-burst" onclick="toggleMode()" title="Basculer Rafale / Cœur Géant (B)">❤️ Rafale</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Maintenir / Glisser</b> : rafale de cœurs néon (<b>4CD8</b>) • <b>Clic rapide / B</b> : grand cœur Bézier (<b>qkRJ</b>) • Chargez les orbes dorés et brisez les ombres rouges
</div>

<script>
const GAME_ID = "neon_hearts";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetGoal = 24, durationSec = 60;
let hearts = [];
let orbs = [];
let shadows = [];
let sparks = [];
let ptr = { x: 256, y: 180, down: false };
let keys = {};
let mode = "burst"; // "burst" | "giant"
let spawnTimer = 0, orbTimer = 0, shadowTimer = 0, burstCooldown = 0;
let caught = 0, lives = 5, timeLeft = 60, score = 0, combo = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function toggleMode() {
  mode = mode === "burst" ? "giant" : "burst";
  const btn = document.getElementById("modeBtn");
  if (mode === "burst") {
    btn.textContent = "❤️ Rafale";
    btn.className = "mode-burst";
  } else {
    btn.textContent = "💖 Géant";
    btn.className = "mode-pulse";
  }
}

// Parametric heart Bezier curve inspired by HeartSegment in 4CD8.as / qkRJ.as
function heartPoint(t, scale) {
  const s = Math.sin(t);
  const x = 16 * s * s * s;
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return { x: (x / 16) * scale, y: (y / 16) * scale };
}

function easeInBack(u) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return c3 * u * u * u - c1 * u * u;
}

function spawnHeart(x, y, isGiant) {
  if (hearts.length > 90) hearts.shift();
  const baseScale = isGiant ? (42 + Math.random() * 18) : (16 + Math.random() * 22);
  const rCol = Math.floor(170 + Math.random() * 85);
  const gCol = Math.floor(80 + Math.random() * 140);
  const bCol = Math.floor(170 + Math.random() * 85);
  hearts.push({
    sx: x,
    sy: y,
    x, y,
    tx: x + (Math.random() - 0.5) * (isGiant ? 110 : 220),
    ty: y + (isGiant ? 170 : 220) + Math.random() * 180,
    scale0: baseScale,
    scale: baseScale,
    rot0: (Math.random() - 0.5) * 0.9,
    rot: 0,
    rotMul: 1.5 + Math.random() * 1.4,
    age: 0,
    life: isGiant ? 1.85 : (1.5 + Math.random() * 1.1),
    drawProgress: 0,
    drawSpeed: isGiant ? 2.4 : 3.2,
    lineW: isGiant ? 4.5 : (2 + Math.random() * 3.5),
    stroke: `rgb(${rCol},${gCol},${bCol})`,
    fill: `rgba(${Math.min(255, rCol + 30)},${Math.min(255, gCol + 20)},${Math.min(255, bCol + 25)},0.34)`,
    isGiant
  });
}

function spawnOrb() {
  if (orbs.length >= 7) return;
  orbs.push({
    x: 42 + Math.random() * (SIZE - 84),
    y: 70 + Math.random() * (SIZE - 200),
    vx: (Math.random() - 0.5) * 44,
    vy: (Math.random() - 0.5) * 32,
    r: 14,
    charge: 0,
    pulse: Math.random() * 6.28
  });
}

function spawnShadow() {
  if (shadows.length >= 6) return;
  const elapsed = durationSec - timeLeft;
  const spd = 42 + elapsed * 0.9 + Math.random() * 26;
  shadows.push({
    x: 34 + Math.random() * (SIZE - 68),
    y: -18,
    vx: (Math.random() - 0.5) * 28,
    vy: spd,
    r: 15,
    hp: 2,
    wob: Math.random() * 6.28
  });
}

function emitSparks(x, y, col, n) {
  for (let i = 0; i < n && sparks.length < 180; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 130;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45 + Math.random() * 0.35, max: 0.8, col });
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetGoal = Math.max(8, Number(custom.targetGoal || 24));
  durationSec = Math.max(20, Number(custom.durationSec || 60));
  hearts = [];
  orbs = [];
  shadows = [];
  sparks = [];
  caught = 0;
  lives = 5;
  combo = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  orbTimer = 0.2;
  shadowTimer = 1.2;
  for (let i = 0; i < 4; i++) spawnOrb();
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Essences ${caught}/${targetGoal} • Vies ${lives} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  spawnHeart(ptr.x, ptr.y, mode === "giant");
  burstCooldown = 0.05;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyB") toggleMode();
  if (e.code === "Space") {
    e.preventDefault();
    if (!over) spawnHeart(ptr.x, ptr.y, mode === "giant");
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 270;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(16, Math.min(SIZE - 16, ptr.x));
  ptr.y = Math.max(16, Math.min(SIZE - 16, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true;
    won = caught >= targetGoal;
    updateStat();
    return;
  }

  if (ptr.down || keys.Space) {
    burstCooldown -= dt;
    if (burstCooldown <= 0) {
      spawnHeart(ptr.x + (Math.random() - 0.5) * 14, ptr.y + (Math.random() - 0.5) * 14, mode === "giant");
      burstCooldown = mode === "giant" ? 0.24 : 0.055;
    }
  }

  orbTimer -= dt;
  if (orbTimer <= 0) { spawnOrb(); orbTimer = 1.1; }
  shadowTimer -= dt;
  if (shadowTimer <= 0) { spawnShadow(); shadowTimer = Math.max(0.85, 2.1 - (durationSec - timeLeft) * 0.018); }

  // Update hearts
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.age += dt;
    const u = Math.min(1, h.age / h.life);
    h.drawProgress = Math.min(1, h.drawProgress + h.drawSpeed * dt);
    const eb = Math.max(-0.2, easeInBack(u));
    h.x = h.sx + (h.tx - h.sx) * u;
    h.y = h.sy + (h.ty - h.sy) * eb;
    h.scale = h.scale0 * (1 - u * 0.78);
    h.rot = h.rot0 * (1 + u * h.rotMul);
    if (h.age >= h.life) hearts.splice(i, 1);
  }

  // Update orbs & heart collisions
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.pulse += dt * 4;
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    if (o.x < 28 || o.x > SIZE - 28) o.vx *= -1;
    if (o.y < 36 || o.y > SIZE - 90) o.vy *= -1;
    o.x = Math.max(28, Math.min(SIZE - 28, o.x));
    o.y = Math.max(36, Math.min(SIZE - 90, o.y));

    for (let j = 0; j < hearts.length; j++) {
      const h = hearts[j];
      const dx = o.x - h.x, dy = o.y - h.y;
      const rad = o.r + h.scale * 0.85;
      if (dx * dx + dy * dy < rad * rad) {
        o.charge += (h.isGiant ? 2.2 : 0.75) * dt * 10;
      }
    }
    if (o.charge >= 1) {
      caught++;
      combo++;
      score += 100 + Math.min(150, combo * 10);
      emitSparks(o.x, o.y, "#fde047", 14);
      orbs.splice(i, 1);
      if (caught >= targetGoal) {
        over = true;
        won = true;
        score += Math.round(timeLeft * 20);
        updateStat();
        return;
      }
    }
  }

  // Update shadows
  for (let i = shadows.length - 1; i >= 0; i--) {
    const s = shadows[i];
    s.wob += dt * 5;
    s.x += (s.vx + Math.sin(s.wob) * 28) * dt;
    s.y += s.vy * dt;
    if (s.x < 20 || s.x > SIZE - 20) s.vx *= -1;

    let hit = false;
    for (let j = hearts.length - 1; j >= 0; j--) {
      const h = hearts[j];
      const dx = s.x - h.x, dy = s.y - h.y;
      const rad = s.r + h.scale * 0.75;
      if (dx * dx + dy * dy < rad * rad) {
        s.hp -= (h.isGiant ? 2 : 0.55);
        hearts.splice(j, 1);
        emitSparks(s.x, s.y, "#fb7185", 6);
        if (s.hp <= 0) {
          score += 60;
          emitSparks(s.x, s.y, "#f43f5e", 14);
          shadows.splice(i, 1);
          hit = true;
          break;
        }
      }
    }
    if (hit) continue;

    if (s.y > SIZE + 16) {
      shadows.splice(i, 1);
      lives--;
      combo = 0;
      emitSparks(s.x, SIZE - 12, "#ef4444", 12);
      if (lives <= 0) {
        over = true;
        won = false;
        updateStat();
        return;
      }
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "rgba(5, 7, 16, 0.34)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Subtle floor warning line
  ctx.strokeStyle = "rgba(248, 113, 113, 0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, SIZE - 8); ctx.lineTo(SIZE, SIZE - 8); ctx.stroke();

  // Golden orbs
  for (const o of orbs) {
    const glowR = o.r + 6 + Math.sin(o.pulse) * 2;
    const grd = ctx.createRadialGradient(o.x, o.y, 2, o.x, o.y, glowR + 8);
    grd.addColorStop(0, "#fef08a");
    grd.addColorStop(0.5, "rgba(250,204,21,0.55)");
    grd.addColorStop(1, "rgba(250,204,21,0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(o.x, o.y, glowR + 8, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, o.charge));
    ctx.stroke();

    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(o.x, o.y, 5, 0, Math.PI * 2); ctx.fill();
  }

  // Red shadow threats
  for (const s of shadows) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
    ctx.strokeStyle = "#fda4af";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2 + s.wob * 0.4;
      const rad = k % 2 === 0 ? s.r : s.r * 0.55;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Additive Neon Hearts
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const h of hearts) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    const steps = 36;
    const maxStep = Math.max(2, Math.floor(steps * h.drawProgress));
    ctx.beginPath();
    for (let k = 0; k <= maxStep; k++) {
      const t = (k / steps) * Math.PI * 2;
      const pt = heartPoint(t, h.scale);
      if (k === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    if (h.drawProgress >= 0.99) {
      ctx.closePath();
      ctx.fillStyle = h.fill;
      ctx.fill();
    }
    ctx.shadowColor = h.stroke;
    ctx.shadowBlur = h.isGiant ? 16 : 9;
    ctx.strokeStyle = h.stroke;
    ctx.lineWidth = h.lineW;
    ctx.stroke();
    ctx.restore();
  }

  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Aim cursor
  if (!over) {
    ctx.strokeStyle = mode === "burst" ? "#f472b6" : "#38d6ff";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, mode === "burst" ? 11 : 18, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CONSTELLATION CHARGÉE !" : "OMBRES DÉBORDANTES", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Essences ${caught}/${targetGoal} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
