<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Ruban Musical &amp; Arpégiateur (DrawSound Ribbon)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #facc15; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #050811; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(250,204,21,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "drawsound_ribbon",
  "name": "Ruban Musical & Arpégiateur (DrawSound Ribbon)",
  "family": "core",
  "icon": "🎵",
  "controls": "Glisser pour tracer une courbe musicale (ou ZQSD + Espace) • Au relâchement, la bille parcourt le tracé en boucle aller-retour • Clic droit / Espace efface pour redessiner",
  "description": "Fusion de 5Ujz.as (DrawSound avec arpégiateur pentatonique japonais Ajap : X = hauteur, Y = durée) et 5N1L.as (Particle Light : étincelles HSV floutées en mode additif).",
  "goal": "Activer 24 carillons lumineux en guidant la bille musicale le long de vos tracés en moins de 65 secondes.",
  "fields": [
    { "key": "targetChimes", "label": "Carillons à activer", "type": "number", "default": 24 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎵 Ruban Musical</span>
  <span id="stat">Carillons 0/24 • 65s</span>
  <div class="bar-btns">
    <button onclick="clearRibbon()" title="Effacer le ruban (Espace)">🧹 Tracer</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser</b> : dessiner le ruban • Relâcher : la bille chante en pentatonique (<b>5Ujz</b>) avec étincelles HSV (<b>5N1L</b>) • <b>Espace / Clic droit</b> : nouveau tracé
</div>

<script>
const GAME_ID = "drawsound_ribbon";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Japanese Hirajoshi / Ajap pentatonic intervals (semitones)
const AJAP_SEMITONES = [0, 2, 3, 7, 8, 12, 14, 15, 19, 20, 24, 26, 27, 31];
let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function playAjapNote(normX, normY) {
  if (!audioCtx) return;
  try {
    const idx = Math.min(AJAP_SEMITONES.length - 1, Math.max(0, Math.floor(normX * AJAP_SEMITONES.length)));
    const freq = 220 * Math.pow(2, AJAP_SEMITONES[idx] / 12);
    const dur = [0.1, 0.14, 0.2, 0.28][Math.min(3, Math.max(0, Math.floor(normY * 4)))];
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  } catch (e) {}
}

let targetChimes = 24, durationSec = 65;
let pathPts = [];
let drawing = false;
let playing = false;
let playIdx = 0;
let playDir = 1; // ping-pong like linearray.reverse() in 5Ujz.as
let ball = { x: 256, y: 256 };
let sparks = [];
let chimes = [];
let hue = 0, noteCd = 0, chimeCd = 0;
let ptr = { x: 256, y: 256 };
let keys = {};
let hitCount = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnChime() {
  if (chimes.length >= 6) return;
  chimes.push({
    x: 44 + Math.random() * (SIZE - 88),
    y: 44 + Math.random() * (SIZE - 88),
    r: 16,
    pulse: Math.random() * 6.28
  });
}

function clearRibbon() {
  if (over) return;
  pathPts = [];
  playing = false;
  drawing = false;
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetChimes = Math.max(8, Number(custom.targetChimes || 24));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  pathPts = [];
  sparks = [];
  chimes = [];
  drawing = false;
  playing = false;
  playIdx = 0;
  playDir = 1;
  ball = { x: 256, y: 256 };
  hitCount = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  noteCd = 0;
  chimeCd = 0.2;
  for (let i = 0; i < 5; i++) spawnChime();
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Carillons ${hitCount}/${targetChimes} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("contextmenu", (e) => { e.preventDefault(); clearRibbon(); });
cv.addEventListener("pointerdown", (e) => {
  initAudio();
  if (over) { sendResultAndExit(won, score); return; }
  if (e.button === 2) { clearRibbon(); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  drawing = true;
  playing = false;
  pathPts = [{ x: p.x, y: p.y }];
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  if (drawing) {
    const last = pathPts[pathPts.length - 1];
    if (!last || Math.hypot(p.x - last.x, p.y - last.y) >= 6) {
      if (pathPts.length < 220) pathPts.push({ x: p.x, y: p.y });
    }
  }
});
cv.addEventListener("pointerup", () => {
  if (drawing) {
    drawing = false;
    if (pathPts.length >= 2) {
      playing = true;
      playIdx = 0;
      playDir = 1;
    }
  }
});
cv.addEventListener("pointercancel", () => { drawing = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); initAudio(); clearRibbon(); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function emitHsvSpark(x, y, h) {
  for (let i = 0; i < 4 && sparks.length < 180; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 25 + Math.random() * 70;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 12,
      r: 2 + Math.random() * 7,
      hue: (h + Math.random() * 25) % 360,
      life: 0.55 + Math.random() * 0.3,
      max: 0.85
    });
  }
}

function step(dt) {
  if (over) return;

  const spd = 240;
  let kx = 0, ky = 0;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
  if (keys.ArrowRight || keys.KeyD) kx += 1;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
  if (keys.ArrowDown || keys.KeyS) ky += 1;
  if (kx || ky) {
    ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x + kx * spd * dt));
    ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y + ky * spd * dt));
  }

  hue = (hue + dt * 90) % 360;
  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = hitCount >= targetChimes;
    updateStat(); return;
  }

  chimeCd -= dt;
  if (chimeCd <= 0) { spawnChime(); chimeCd = 0.7; }

  if (playing && pathPts.length >= 2) {
    const stepAdvance = dt * 62;
    playIdx += playDir * stepAdvance;
    if (playIdx >= pathPts.length - 1) {
      playIdx = pathPts.length - 1;
      playDir = -1;
    } else if (playIdx <= 0) {
      playIdx = 0;
      playDir = 1;
    }
    const pt = pathPts[Math.round(playIdx)];
    ball.x = pt.x;
    ball.y = pt.y;
    emitHsvSpark(ball.x, ball.y, hue);

    noteCd -= dt;
    if (noteCd <= 0) {
      playAjapNote(ball.x / SIZE, ball.y / SIZE);
      noteCd = 0.13;
    }
  } else {
    // Smooth cursor follower (5N1L style)
    ball.x += (ptr.x - ball.x) * Math.min(1, dt * 8);
    ball.y += (ptr.y - ball.y) * Math.min(1, dt * 8);
    emitHsvSpark(ball.x, ball.y, hue);
  }

  // Check chimes against ball (must be playing a drawn ribbon or passing directly with ball)
  for (let i = chimes.length - 1; i >= 0; i--) {
    const c = chimes[i];
    c.pulse += dt * 4.5;
    const hitDist = playing ? c.r + 16 : c.r + 10;
    if (Math.hypot(ball.x - c.x, ball.y - c.y) < hitDist) {
      hitCount++;
      score += playing ? 130 : 80;
      playAjapNote(c.x / SIZE, 0.25);
      emitHsvSpark(c.x, c.y, 48);
      chimes.splice(i, 1);
      if (hitCount >= targetChimes) {
        over = true; won = true;
        score += Math.round(timeLeft * 20);
        updateStat(); return;
      }
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vy += 35 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "rgba(5, 8, 17, 0.28)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Drawn musical path
  if (pathPts.length >= 2) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(pathPts[0].x, pathPts[0].y);
    for (let i = 1; i < pathPts.length; i++) ctx.lineTo(pathPts[i].x, pathPts[i].y);
    ctx.stroke();
  }

  // Chimes
  for (const c of chimes) {
    const r = c.r + Math.sin(c.pulse) * 2;
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(250, 204, 21, 0.2)";
    ctx.fill();
    ctx.fillStyle = "#fef08a";
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("♪", c.x, c.y);
  }

  // Additive HSV sparks (5N1L)
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life / s.max);
    ctx.fillStyle = `hsl(${s.hue}, 85%, 62%)`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Playback ball
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2); ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "MÉLODIE ACCOMPLIE !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Carillons ${hitCount}/${targetChimes} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
