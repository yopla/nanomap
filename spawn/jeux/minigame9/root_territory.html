<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Réseau de Racines Auto-Évitantes (Root Territory)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #4ade80; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.mode-seed { background: #133824; border-color: #4ade80; color: #bbf7d0; }
  button.mode-jet { background: #1e3a5f; border-color: #38d6ff; color: #bae6fd; }
  canvas { background: #04070d; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(74,222,128,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "root_territory",
  "name": "Réseau de Racines Auto-Évitantes (Root Territory)",
  "family": "tactical",
  "icon": "🌿",
  "controls": "Cliquer pour planter une graine ramifiée (gpIT/zN1K) • Glisser pour projeter des racines directionnelles (tW0L) • Espace ou bouton 🌱/💨 bascule le mode (ZQSD déplace)",
  "description": "Fusion de gpIT.as (Rampant Growth auto-évitant par lecture pixel), zN1K.as (ramifications en cascade), tW0L.as (jets de particules à 4 générations) et 5NRa.as (éclosion de bourgeons en fin de jauge hp).",
  "goal": "Faire éclore 10 nœuds nutritifs dorés avec vos racines en moins de 65 secondes sans déclencher 3 poches toxiques rouges.",
  "fields": [
    { "key": "targetNodes", "label": "Nœuds à éclore", "type": "number", "default": 10 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌿 Racines</span>
  <span id="stat">Nœuds 0/10 • Toxines 0/3 • 65s</span>
  <div class="bar-btns">
    <button id="toolBtn" class="mode-seed" onclick="toggleTool()" title="Basculer Graine / Jet (Espace)">🌱 Graine</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic</b> : graine auto-évitante (<b>gpIT/5NRa</b>) • <b>Glisser</b> : jet directionnel (<b>tW0L</b>) • <b>Espace</b> : changer d'outil • Reliez les 10 nœuds dorés
</div>

<script>
const GAME_ID = "root_territory";
const SIZE = 512;
const MAP = 128; // Offscreen collision bitmap inspired by gpIT.as getPixel
const SCALE = SIZE / MAP;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const trailCv = document.createElement("canvas");
trailCv.width = SIZE; trailCv.height = SIZE;
const trailCtx = trailCv.getContext("2d");

let occGrid = new Uint8Array(MAP * MAP); // 0 empty, 1 root, 2 toxin
let sprouts = [];   // gpIT + 5NRa auto-avoiding sprouts
let branches = [];  // zN1K + tW0L directional shoots
let nodes = [];     // Golden nutrient targets
let toxins = [];    // Red hazard pockets
let blooms = [];    // 5NRa blossom circles

let targetNodes = 10, durationSec = 65;
let mode = "seed"; // "seed" | "jet"
let ptr = { x: 256, y: 256, px: 256, py: 256, down: false, moveDist: 0 };
let keys = {};
let collected = 0, errors = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0, fadeTick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function toggleTool() {
  mode = mode === "seed" ? "jet" : "seed";
  const b = document.getElementById("toolBtn");
  if (mode === "seed") {
    b.textContent = "🌱 Graine";
    b.className = "mode-seed";
  } else {
    b.textContent = "💨 Jet";
    b.className = "mode-jet";
  }
}

function getCell(x, y) {
  const gx = Math.floor(((x % SIZE) + SIZE) % SIZE / SCALE);
  const gy = Math.floor(((y % SIZE) + SIZE) % SIZE / SCALE);
  return occGrid[gy * MAP + gx];
}
function markCell(x, y, val) {
  const gx = Math.floor(((x % SIZE) + SIZE) % SIZE / SCALE);
  const gy = Math.floor(((y % SIZE) + SIZE) % SIZE / SCALE);
  occGrid[gy * MAP + gx] = val;
}

function addSprout(x, y, ang, w = 2.4, hp = 68) {
  if (sprouts.length >= 90) return;
  sprouts.push({ x, y, ang, turn: 0, w, hp, grace: 6 });
}

function addJet(x, y, vx, vy, gen = 0) {
  if (branches.length >= 140) return;
  const maxGen = 4;
  const life = (maxGen - gen) * 7 + 6;
  const ang = Math.atan2(vy, vx) + (Math.random() - 0.5) * 1.3;
  const sp = 2.0 + Math.random() * 2.5;
  branches.push({
    x, y, px: x, py: y,
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    gen, life, maxGen
  });
}

function spawnTargets() {
  nodes = [];
  toxins = [];
  for (let i = 0; i < 6; i++) {
    toxins.push({
      x: 56 + Math.random() * (SIZE - 112),
      y: 56 + Math.random() * (SIZE - 112),
      r: 16 + Math.random() * 6,
      hitCd: 0
    });
  }
  for (let i = 0; i < 4; i++) spawnOneNode();
}

function spawnOneNode() {
  for (let tries = 0; tries < 25; tries++) {
    const x = 40 + Math.random() * (SIZE - 80);
    const y = 40 + Math.random() * (SIZE - 80);
    if (toxins.every(t => Math.hypot(t.x - x, t.y - y) > t.r + 36)) {
      nodes.push({ x, y, r: 15, progress: 0, pulse: Math.random() * 6.28 });
      return;
    }
  }
  nodes.push({ x: 60 + Math.random() * 392, y: 60 + Math.random() * 392, r: 15, progress: 0, pulse: 0 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetNodes = Math.max(4, Number(custom.targetNodes || 10));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  occGrid.fill(0);
  trailCtx.fillStyle = "#04070d";
  trailCtx.fillRect(0, 0, SIZE, SIZE);
  sprouts = [];
  branches = [];
  blooms = [];
  collected = 0;
  errors = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnTargets();
  addSprout(256, 256, Math.random() * Math.PI * 2, 2.4, 80);
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Nœuds ${collected}/${targetNodes} • Toxines ${errors}/3 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y; ptr.down = true;
  if (mode === "seed") {
    addSprout(p.x, p.y, Math.random() * Math.PI * 2, 2.5, 72);
    // zN1K burst
    for (let k = 0; k < 2; k++) addJet(p.x, p.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 1);
  }
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  const dx = p.x - ptr.x, dy = p.y - ptr.y;
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  if (ptr.down && mode === "jet") {
    ptr.moveDist += Math.hypot(dx, dy);
    if (ptr.moveDist > 10) {
      addJet(p.x, p.y, dx, dy, 0);
      ptr.moveDist = 0;
    }
  }
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (!over) toggleTool();
  } else if (e.code === "KeyE" || e.code === "Enter") {
    if (!over) addSprout(ptr.x, ptr.y, Math.random() * Math.PI * 2, 2.5, 72);
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function checkNodeAndToxin(x, y) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.hypot(x - n.x, y - n.y) < n.r + 6) {
      n.progress += 0.36;
      if (n.progress >= 1) {
        collected++;
        score += 150;
        blooms.push({ x: n.x, y: n.y, r: 4, maxR: 28, col: "#fde047", alpha: 1 });
        nodes.splice(i, 1);
        if (collected >= targetNodes) {
          over = true; won = true;
          score += Math.round(timeLeft * 25);
        } else {
          spawnOneNode();
        }
      }
      return "node";
    }
  }
  for (const t of toxins) {
    if (t.hitCd <= 0 && Math.hypot(x - t.x, y - t.y) < t.r) {
      t.hitCd = 1.4;
      errors++;
      blooms.push({ x: t.x, y: t.y, r: 6, maxR: 34, col: "#f87171", alpha: 1 });
      if (errors >= 3) { over = true; won = false; }
      return "toxin";
    }
  }
  return null;
}

function step(dt) {
  if (over) return;

  const spd = 240;
  let kx = 0, ky = 0;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
  if (keys.ArrowRight || keys.KeyD) kx += 1;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
  if (keys.ArrowDown || keys.KeyS) ky += 1;
  if (kx || ky) {
    ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x + kx * spd * dt));
    ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y + ky * spd * dt));
    if (mode === "jet") {
      ptr.moveDist += spd * dt;
      if (ptr.moveDist > 12) { addJet(ptr.x, ptr.y, kx * 8, ky * 8, 0); ptr.moveDist = 0; }
    }
  }

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = collected >= targetNodes;
    updateStat(); return;
  }

  for (const t of toxins) if (t.hitCd > 0) t.hitCd -= dt;
  for (const n of nodes) n.pulse += dt * 4;

  // Fade trail slightly & slowly clear old occupancy cells so map stays playable
  fadeTick += dt;
  if (fadeTick > 0.14) {
    fadeTick = 0;
    trailCtx.fillStyle = "rgba(4, 7, 13, 0.06)";
    trailCtx.fillRect(0, 0, SIZE, SIZE);
    for (let k = 0; k < 260; k++) {
      const idx = (Math.random() * MAP * MAP) | 0;
      if (occGrid[idx] === 1 && Math.random() < 0.35) occGrid[idx] = 0;
    }
  }

  const stepScale = dt * 32;

  // 1. Update gpIT + 5NRa sprouts
  for (let i = sprouts.length - 1; i >= 0; i--) {
    const s = sprouts[i];
    if (Math.random() < 0.08 && sprouts.length < 80 && s.hp > 18) {
      const ang = s.ang + (Math.random() < 0.5 ? 1 : -1) * (0.28 + Math.random() * 0.25);
      addSprout(s.x, s.y, ang, Math.max(1.2, s.w * 0.8), s.hp * 0.65);
    }
    s.turn += Math.random() < 0.5 ? 1 : -1;
    s.ang += (s.turn > 0 ? 0.04 : -0.04);
    const nx = s.x + Math.cos(s.ang) * s.w * stepScale;
    const ny = s.y + Math.sin(s.ang) * s.w * stepScale;

    let wx = nx, wy = ny;
    let wrapped = false;
    if (wx > SIZE) { wx = 0; wrapped = true; }
    else if (wx < 0) { wx = SIZE; wrapped = true; }
    if (wy > SIZE) { wy = 0; wrapped = true; }
    else if (wy < 0) { wy = SIZE; wrapped = true; }

    s.hp -= stepScale * 0.7;
    if (s.grace > 0) s.grace -= 1;

    // Self-avoidance check (gpIT)
    if (!wrapped && s.grace <= 0 && getCell(wx, wy) === 1 && Math.random() < 0.6) {
      blooms.push({ x: s.x, y: s.y, r: 2, maxR: 9, col: "#86efac", alpha: 0.9 });
      sprouts.splice(i, 1);
      continue;
    }

    if (!wrapped) {
      trailCtx.strokeStyle = "#84cc16";
      trailCtx.lineWidth = Math.max(1, s.w * 0.9);
      trailCtx.beginPath();
      trailCtx.moveTo(s.x, s.y);
      trailCtx.lineTo(wx, wy);
      trailCtx.stroke();
      markCell(wx, wy, 1);
    }
    s.x = wx; s.y = wy;
    s.w = Math.min(3.8, s.w + 0.008);

    const hitRes = checkNodeAndToxin(s.x, s.y);
    if (hitRes === "toxin" || s.hp <= 0) {
      if (s.hp <= 0) blooms.push({ x: s.x, y: s.y, r: 2, maxR: 11, col: "#4ade80", alpha: 0.95 });
      sprouts.splice(i, 1);
      if (over) break;
    }
  }

  // 2. Update tW0L + zN1K directional branches
  for (let i = branches.length - 1; i >= 0; i--) {
    const b = branches[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * stepScale;
    b.y += b.vy * stepScale;
    b.life -= stepScale;

    trailCtx.strokeStyle = "#38bdf8";
    trailCtx.lineWidth = Math.max(1, (b.maxGen - b.gen + 1) * 0.8);
    trailCtx.beginPath(); trailCtx.moveTo(b.px, b.py); trailCtx.lineTo(b.x, b.y); trailCtx.stroke();
    markCell(b.x, b.y, 1);

    const hitRes = checkNodeAndToxin(b.x, b.y);
    if (hitRes === "toxin" || b.x < 0 || b.x > SIZE || b.y < 0 || b.y > SIZE) {
      branches.splice(i, 1);
      if (over) break;
      continue;
    }

    if (b.life <= 0) {
      if (b.gen < b.maxGen) {
        for (let k = 0; k < 2; k++) addJet(b.x, b.y, b.vx, b.vy, b.gen + 1);
      } else {
        blooms.push({ x: b.x, y: b.y, r: 2, maxR: 10, col: "#7dd3fc", alpha: 0.9 });
      }
      branches.splice(i, 1);
    }
  }

  for (let i = blooms.length - 1; i >= 0; i--) {
    const bl = blooms[i];
    bl.r += (bl.maxR - bl.r) * 0.18;
    bl.alpha -= dt * 1.4;
    if (bl.alpha <= 0) blooms.splice(i, 1);
  }

  updateStat();
}

function draw() {
  ctx.drawImage(trailCv, 0, 0);

  // Toxins
  for (const t of toxins) {
    ctx.fillStyle = t.hitCd > 0 ? "rgba(248,113,113,0.45)" : "rgba(220,38,38,0.28)";
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fca5a5";
    ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("☣", t.x, t.y);
  }

  // Golden nodes
  for (const n of nodes) {
    const pr = n.r + Math.sin(n.pulse) * 2.5;
    ctx.fillStyle = "rgba(250, 204, 21, 0.22)";
    ctx.beginPath(); ctx.arc(n.x, n.y, pr + 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
    if (n.progress > 0) {
      ctx.fillStyle = "rgba(74, 222, 128, 0.65)";
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r * Math.min(1, n.progress), 0, Math.PI * 2); ctx.fill();
    }
  }

  // Sprout tips & blooms
  for (const s of sprouts) {
    ctx.fillStyle = "#bef264";
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  for (const bl of blooms) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, bl.alpha);
    ctx.strokeStyle = bl.col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if (!over) {
    ctx.strokeStyle = mode === "seed" ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 10, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RÉSEAU ÉCLOS !" : (errors >= 3 ? "TOXINES PERCÉES" : "TEMPS ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Nœuds ${collected}/${targetNodes} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
