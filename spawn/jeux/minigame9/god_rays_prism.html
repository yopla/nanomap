<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Rayons Divins &amp; Boule Disco (God Rays Prism)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fef08a; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #04050a; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(254,240,138,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "god_rays_prism",
  "name": "Rayons Divins & Boule Disco (God Rays Prism)",
  "family": "tactical",
  "icon": "☀️",
  "controls": "Déplacer la source de rayons volumétriques (Souris/Toucher ou ZQSD) • Clic / Espace bascule les modes de prisme (sQO0 / fDdO / nG0h PAR36 / RAYShine)",
  "description": "Fusion de shine_sQO0.as (VolumetricPointLight / god rays crépusculaires), fDdO.as (matrice tournante de faisceaux zoomés), nG0h.as (boule disco 3D de Fibonacci PAR36 avec pulse Web Audio) et RAYShine/ray (faisceaux radiaux sur glyphes).",
  "goal": "Aligner les rayons volumétriques sur 12 capteurs solaires périphériques et les charger à 100 % en moins de 65 secondes.",
  "fields": [
    { "key": "targetSensors", "label": "Capteurs à charger", "type": "number", "default": 12 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">☀️ Rayons Divins</span>
  <span id="stat">Capteurs 0/12 • Prisme sQO0 • 65s</span>
  <div class="bar-btns">
    <button id="prBtn" onclick="cyclePrism()" title="Changer de prisme (Espace)">☀️ Prisme</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : orienter les god-rays (<b>sQO0 / fDdO / nG0h / ray</b>) • <b>Clic / Espace</b> : changer de prisme • Pointez les faisceaux vers les capteurs
</div>

<script>
const GAME_ID = "god_rays_prism";
const SIZE = 512;
const LO = 128; // Low-res buffer for multi-pass radial zoom blur (sQO0 / fDdO / nG0h)
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const baseCv = document.createElement("canvas");
baseCv.width = LO; baseCv.height = LO;
const baseCtx = baseCv.getContext("2d");

const bufCv = document.createElement("canvas");
bufCv.width = LO; bufCv.height = LO;
const bufCtx = bufCv.getContext("2d");

const PRISMS = ["sQO0", "fDdO", "nG0h", "RAY"];
let prismIdx = 0;

let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function playChime(freq) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.06, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.24);
  } catch (e) {}
}

let targetSensors = 12, durationSec = 65;
let ptr = { x: 256, y: 256 };
let keys = {};
let sensors = [];
let fibPts = [];
let tClock = 0, charged = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function cyclePrism() {
  prismIdx = (prismIdx + 1) % PRISMS.length;
  updateStat();
}

function buildFibonacciSphere() {
  fibPts = [];
  const N = 64;
  for (let i = 1; i <= N; i++) {
    const phi = Math.acos(-1 + (2 * i - 1) / N);
    const theta = Math.sqrt(N * Math.PI) * phi;
    fibPts.push({
      x: -Math.sin(phi) * Math.sin(theta),
      y: Math.sin(phi) * Math.cos(theta),
      z: Math.cos(phi),
      hue: (360 * i / N + (i & 1) * 60) % 360
    });
  }
}

function spawnSensor() {
  const a = Math.random() * Math.PI * 2;
  const r = 175 + Math.random() * 50;
  sensors.push({
    x: 256 + Math.cos(a) * r,
    y: 256 + Math.sin(a) * r,
    r: 19,
    charge: 0,
    pulse: Math.random() * 6.28
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetSensors = Math.max(4, Number(custom.targetSensors || 12));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  prismIdx = 0;
  buildFibonacciSphere();
  sensors = [];
  for (let i = 0; i < 4; i++) spawnSensor();
  charged = 0; timeLeft = durationSec; score = 0; won = false; over = false;
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Capteurs ${charged}/${targetSensors} • Prisme ${PRISMS[prismIdx]} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  initAudio();
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  cyclePrism();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); initAudio(); if (!over) cyclePrism(); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 270;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(24, Math.min(SIZE - 24, ptr.x));
  ptr.y = Math.max(24, Math.min(SIZE - 24, ptr.y));

  tClock += dt;
  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = charged >= targetSensors;
    updateStat(); return;
  }

  // The volumetric rays pass from the light source through the center prism/occluder onto the perimeter!
  // So a sensor at angle `a` from center is hit strongest when `ptr` is opposite to `a` (ray passes through center toward sensor)
  // OR when rays from `ptr` sweep directly over the sensor!
  const cx = 256, cy = 256;
  const lightDir = Math.atan2(cy - ptr.y, cx - ptr.x); // beam axis through center

  for (let i = sensors.length - 1; i >= 0; i--) {
    const s = sensors[i];
    s.pulse += dt * 4;
    const sAng = Math.atan2(s.y - cy, s.x - cx);
    let diff = Math.abs(sAng - lightDir);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;

    // Also direct proximity in RAY mode or beam alignment
    const dDirect = Math.hypot(s.x - ptr.x, s.y - ptr.y);
    const hit = diff < 0.36 || dDirect < 46;
    if (hit) {
      s.charge += 0.95 * dt;
      score += 30 * dt;
      if (s.charge >= 1) {
        charged++;
        score += 150;
        playChime(440 + (charged % 6) * 80);
        sensors.splice(i, 1);
        if (charged >= targetSensors) {
          over = true; won = true;
          score += Math.round(timeLeft * 20);
          updateStat(); return;
        }
        spawnSensor();
      }
    }
  }

  updateStat();
}

function drawLowResGodRays() {
  baseCtx.fillStyle = "#000000";
  baseCtx.fillRect(0, 0, LO, LO);

  const sx = (ptr.x / SIZE) * LO;
  const sy = (ptr.y / SIZE) * LO;
  const mode = PRISMS[prismIdx];

  // Draw emission + central prism/occluder on baseCv
  const grd = baseCtx.createRadialGradient(sx, sy, 2, sx, sy, 68);
  grd.addColorStop(0, "rgba(255, 244, 180, 0.95)");
  grd.addColorStop(0.5, "rgba(251, 146, 60, 0.45)");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  baseCtx.fillStyle = grd;
  baseCtx.fillRect(0, 0, LO, LO);

  if (mode === "sQO0") {
    // Rotating cloud/silhouette occluder in center
    baseCtx.save();
    baseCtx.translate(LO / 2, LO / 2);
    baseCtx.rotate(tClock * 0.5);
    baseCtx.fillStyle = "#000000";
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2;
      baseCtx.fillRect(Math.cos(a) * 18 - 6, Math.sin(a) * 18 - 6, 12, 12);
    }
    baseCtx.restore();
  } else if (mode === "fDdO") {
    // fDdO 5x5 rotating colored square grid
    baseCtx.save();
    baseCtx.translate(LO / 2, LO / 2);
    baseCtx.rotate(tClock * 0.9);
    for (let x = -2; x <= 2; x++) {
      for (let y = -2; y <= 2; y++) {
        baseCtx.fillStyle = `rgb(${(x + 2) * 55}, ${(y + 2) * 55}, 180)`;
        baseCtx.fillRect(x * 11 - 3, y * 11 - 3, 6, 6);
      }
    }
    baseCtx.restore();
  } else if (mode === "nG0h") {
    // nG0h PAR36 3D Fibonacci disco sphere
    const rx = tClock * 1.1, ry = tClock * 0.7;
    for (const pt of fibPts) {
      const x1 = pt.x * Math.cos(ry) - pt.z * Math.sin(ry);
      const z1 = pt.x * Math.sin(ry) + pt.z * Math.cos(ry);
      const y2 = pt.y * Math.cos(rx) - z1 * Math.sin(rx);
      const z2 = pt.y * Math.sin(rx) + z1 * Math.cos(rx);
      if (z2 < -0.1) {
        baseCtx.fillStyle = `hsl(${pt.hue}, 95%, 65%)`;
        baseCtx.beginPath();
        baseCtx.arc(LO / 2 + x1 * 22, LO / 2 + y2 * 22, 2.2, 0, Math.PI * 2);
        baseCtx.fill();
      }
    }
  } else {
    // RAYShine glyph radial lines
    baseCtx.strokeStyle = "#38d6ff";
    baseCtx.lineWidth = 1.5;
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2 + tClock * 0.4;
      const gx = LO / 2 + Math.cos(a) * 20;
      const gy = LO / 2 + Math.sin(a) * 20;
      baseCtx.beginPath();
      baseCtx.moveTo(gx, gy);
      baseCtx.lineTo(gx + (gx - sx) * 0.9, gy + (gy - sy) * 0.9);
      baseCtx.stroke();
    }
  }

  // Multi-pass additive radial zoom blur (EffectContainer._applyEffect from sQO0 / fDdO / nG0h)
  for (let pass = 0; pass < 4; pass++) {
    const scale = 1.07 + pass * 0.05;
    bufCtx.fillStyle = "#000000";
    bufCtx.fillRect(0, 0, LO, LO);
    bufCtx.drawImage(baseCv, 0, 0);
    bufCtx.save();
    bufCtx.globalCompositeOperation = "lighter";
    bufCtx.globalAlpha = 0.65;
    bufCtx.translate(sx, sy);
    bufCtx.scale(scale, scale);
    bufCtx.translate(-sx, -sy);
    bufCtx.drawImage(baseCv, 0, 0);
    bufCtx.restore();
    baseCtx.drawImage(bufCv, 0, 0);
  }
}

function draw() {
  drawLowResGodRays();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(baseCv, 0, 0, SIZE, SIZE);

  // Beam guide line through center
  ctx.save();
  ctx.strokeStyle = "rgba(253, 224, 71, 0.24)";
  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ptr.x, ptr.y);
  const ang = Math.atan2(256 - ptr.y, 256 - ptr.x);
  ctx.lineTo(256 + Math.cos(ang) * 240, 256 + Math.sin(ang) * 240);
  ctx.stroke();
  ctx.restore();

  // Sensors
  for (const s of sensors) {
    const r = s.r + Math.sin(s.pulse) * 2;
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(74, 222, 128, 0.55)";
    ctx.beginPath(); ctx.arc(s.x, s.y, r * s.charge, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef9c3";
    ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(`${Math.round(s.charge * 100)}%`, s.x, s.y);
  }

  if (!over) {
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 8, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "FAISCEAUX ALIGNÉS !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Capteurs ${charged}/${targetSensors} • Score ${Math.round(score)}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
