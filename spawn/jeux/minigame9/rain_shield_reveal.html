<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Parapluie &amp; Pluie Révélatrice (Rain Shield Reveal)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #040710; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: none; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "rain_shield_reveal",
  "name": "Parapluie & Pluie Révélatrice (Rain Shield Reveal)",
  "family": "topMouseMut",
  "icon": "☔",
  "controls": "Déplacer le bouclier circulaire (Souris/Toucher ou ZQSD) pour faire éclabousser la pluie sur les glyphes invisibles et repousser la pluie acide rouge",
  "description": "Fusion de yTGI.as / Main.as (Stardust Rain : déflecteur circulaire générant des éclaboussures), 94UE.as (RainyDay : freinage et rebond sur forceMap invisible) et mfSI.as (LightWater : colonnes lumineuses en ADD).",
  "goal": "Révéler et charger 5 glyphes cachés sous l'averse en moins de 65 secondes tout en protégeant la flamme sacrée au sol (3 PV).",
  "fields": [
    { "key": "targetGlyphs", "label": "Glyphes à révéler", "type": "number", "default": 5 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">☔ Parapluie &amp; Pluie</span>
  <span id="stat">Glyphes 0/5 • Flamme 3 • 65s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Déplacer</b> : bouclier-parapluie (<b>yTGI</b>) • Faites éclabousser la pluie sur les glyphes cachés (<b>94UE</b>) et protégez la flamme au sol
</div>

<script>
const GAME_ID = "rain_shield_reveal";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetGlyphs = 5, durationSec = 65;
let shield = { x: 256, y: 260, r: 48 };
let flame = { x: 256, y: 472, vx: 65, r: 22 };
let drops = [];
let splashes = [];
let lightCols = []; // mfSI LightWater shafts
let glyphs = [];    // 94UE hidden forceMap glyphs
let keys = {};
let revealed = 0, hp = 3, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnDrop() {
  if (drops.length >= 160) return;
  const isAcid = Math.random() < 0.12;
  drops.push({
    x: 10 + Math.random() * (SIZE - 20),
    y: -10,
    vx: (Math.random() - 0.5) * 14,
    vy: 210 + Math.random() * 140,
    acid: isAcid,
    len: isAcid ? 12 : (8 + Math.random() * 8)
  });
}

function emitSplashes(x, y, col, n, upBias) {
  for (let i = 0; i < n && splashes.length < 180; i++) {
    const a = (upBias ? -Math.PI * 0.5 : 0) + (Math.random() - 0.5) * Math.PI * 1.4;
    const sp = 60 + Math.random() * 130;
    splashes.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      col,
      life: 0.45 + Math.random() * 0.35,
      max: 0.8
    });
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetGlyphs = Math.max(3, Number(custom.targetGlyphs || 5));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  shield = { x: 256, y: 260, r: 48 };
  flame = { x: 256, y: 472, vx: 65, r: 22 };
  drops = [];
  splashes = [];
  lightCols = Array.from({ length: 18 }, () => ({
    x: 30 + Math.random() * (SIZE - 60),
    y: -60 - Math.random() * 200,
    h: 90 + Math.random() * 70,
    vy: 190 + Math.random() * 90,
    col: ["#3399ff", "#66ccff", "#99ffff"][(Math.random() * 3) | 0]
  }));

  const spots = [
    { x: 105, y: 155, sym: "★" },
    { x: 405, y: 155, sym: "◈" },
    { x: 115, y: 345, sym: "✦" },
    { x: 395, y: 345, sym: "❖" },
    { x: 256, y: 235, sym: "❂" }
  ];
  glyphs = spots.slice(0, targetGlyphs).map(s => ({ ...s, r: 30, reveal: 0, done: false }));

  revealed = 0; hp = 3; timeLeft = durationSec; score = 0; won = false; over = false;
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Glyphes ${revealed}/${targetGlyphs} • Flamme ${hp} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(shield.r, Math.min(SIZE - shield.r, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(shield.r, Math.min(SIZE - 75, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  shield.x = p.x; shield.y = p.y;
});
cv.addEventListener("pointermove", (e) => {
  if (over) return;
  const p = getPos(e);
  shield.x = p.x; shield.y = p.y;
});

window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 290;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) shield.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) shield.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) shield.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) shield.y += spd * dt;
  shield.x = Math.max(shield.r, Math.min(SIZE - shield.r, shield.x));
  shield.y = Math.max(shield.r, Math.min(SIZE - 75, shield.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = revealed >= targetGlyphs;
    updateStat(); return;
  }

  // Patrol sacred flame at bottom
  flame.x += flame.vx * dt;
  if (flame.x < 50 || flame.x > SIZE - 50) flame.vx *= -1;

  // mfSI light columns
  for (const lc of lightCols) {
    lc.y += lc.vy * dt;
    if (lc.y > SIZE + 40) { lc.y = -lc.h - 20; lc.x = 24 + Math.random() * (SIZE - 48); }
  }

  for (let k = 0; k < 4; k++) spawnDrop();

  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.x += d.vx * dt;
    d.y += d.vy * dt;

    // Deflect & splash on umbrella shield (yTGI)
    const dx = d.x - shield.x, dy = d.y - shield.y;
    if (dx * dx + dy * dy < shield.r * shield.r) {
      if (!d.acid) {
        emitSplashes(d.x, d.y, "#38bdf8", 3, true);
      } else {
        emitSplashes(d.x, d.y, "#fb7185", 2, true);
        score += 10;
      }
      drops.splice(i, 1);
      continue;
    }

    // Check hidden forceMap glyphs (94UE: rain slows & splashes on glyphs!)
    if (!d.acid) {
      for (const g of glyphs) {
        if (Math.hypot(d.x - g.x, d.y - g.y) < g.r) {
          d.vx *= 0.85; d.vy *= 0.85;
          if (!g.done) {
            g.reveal = Math.min(1, g.reveal + 0.028);
            emitSplashes(d.x, d.y, "#fde047", 1, true);
            if (g.reveal >= 1) {
              g.done = true;
              revealed++;
              score += 220;
              emitSplashes(g.x, g.y, "#4ade80", 18, false);
              if (revealed >= targetGlyphs) {
                over = true; won = true;
                score += Math.round(timeLeft * 20);
                updateStat(); return;
              }
            }
          }
          break;
        }
      }
    } else if (Math.hypot(d.x - flame.x, d.y - flame.y) < flame.r + 6) {
      // Acid drop hits sacred flame
      hp--;
      emitSplashes(flame.x, flame.y, "#ef4444", 14, true);
      drops.splice(i, 1);
      if (hp <= 0) { over = true; won = false; updateStat(); return; }
      continue;
    }

    if (d.y > SIZE + 16) drops.splice(i, 1);
  }

  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.vy += 260 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    // Splashes also charge glyphs
    for (const g of glyphs) {
      if (!g.done && Math.hypot(s.x - g.x, s.y - g.y) < g.r + 8) {
        g.reveal = Math.min(1, g.reveal + 0.045);
        if (g.reveal >= 1) {
          g.done = true;
          revealed++;
          score += 220;
          if (revealed >= targetGlyphs) {
            over = true; won = true;
            score += Math.round(timeLeft * 20);
            updateStat(); return;
          }
        }
      }
    }
    if (s.life <= 0 || s.y > SIZE + 10) splashes.splice(i, 1);
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "rgba(4, 7, 16, 0.35)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // mfSI additive light rain columns
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const lc of lightCols) {
    const grd = ctx.createLinearGradient(lc.x, lc.y, lc.x, lc.y + lc.h);
    grd.addColorStop(0, "rgba(56,189,248,0)");
    grd.addColorStop(0.5, "rgba(56,189,248,0.16)");
    grd.addColorStop(1, "rgba(56,189,248,0)");
    ctx.fillStyle = grd;
    ctx.fillRect(lc.x - 10, lc.y, 20, lc.h);
  }
  ctx.restore();

  // Hidden forceMap glyphs (become visible as reveal rises)
  for (const g of glyphs) {
    const vis = Math.max(0.14, g.reveal);
    ctx.save();
    ctx.globalAlpha = vis;
    ctx.strokeStyle = g.done ? "#4ade80" : "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = g.done ? "rgba(74,222,128,0.22)" : "rgba(250,204,21,0.14)";
    ctx.fill();
    ctx.fillStyle = g.done ? "#bbf7d0" : "#fef08a";
    ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.sym, g.x, g.y);
    ctx.restore();
  }

  // Rain drops
  for (const d of drops) {
    ctx.strokeStyle = d.acid ? "#f87171" : "#38bdf8";
    ctx.lineWidth = d.acid ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.vx * 0.03, d.y - d.len); ctx.stroke();
  }

  // Splashes
  for (const s of splashes) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life / s.max);
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Umbrella circular deflector (yTGI)
  ctx.strokeStyle = "rgba(255, 255, 255, 0.72)";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(shield.x, shield.y, shield.r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "rgba(56, 214, 255, 0.12)";
  ctx.fill();

  // Sacred flame
  const fGrd = ctx.createRadialGradient(flame.x, flame.y, 2, flame.x, flame.y, flame.r + 12);
  fGrd.addColorStop(0, "#fef08a");
  fGrd.addColorStop(0.5, "rgba(251,146,60,0.8)");
  fGrd.addColorStop(1, "rgba(251,146,60,0)");
  ctx.fillStyle = fGrd;
  ctx.beginPath(); ctx.arc(flame.x, flame.y, flame.r + 12, 0, Math.PI * 2); ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "GLYPHES RÉVÉLÉS !" : (hp <= 0 ? "FLAMME ÉTEINTE" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Glyphes ${revealed}/${targetGlyphs} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
