<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Labyrinthe d'Ombres Dynamiques (ShadowCast Runner)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fde047; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #05070e; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: none; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(253,224,71,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "shadowcast_runner",
  "name": "Labyrinthe d'Ombres Dynamiques (ShadowCast Runner)",
  "family": "topMouseMut",
  "icon": "🔦",
  "controls": "Déplacer la torche (Souris/Toucher ou ZQSD/Flèches) • Maintenir Clic ou Espace réduit le faisceau pour rester furtif près des sentinelles • Régénérer obstacles avec R",
  "description": "Fusion de 1dNB.as (ShadowCast récursif 8-octants sur murs défilants), foPH.as (ombres douces polaires par distance-map) et lbR8.as (Box Shadows géométriques nets).",
  "goal": "Révéler et charger 15 reliques dorées (5 par manche sur les 3 moteurs d'ombre) en moins de 65 secondes sans déclencher 3 alertes de sentinelles.",
  "fields": [
    { "key": "perStage", "label": "Reliques par manche", "type": "number", "default": 5 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🔦 ShadowCast</span>
  <span id="stat">Manche 1/3 • Reliques 0/5 • Alertes 0/3 • 65s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : balayer avec la torche (<b>1dNB → foPH → lbR8</b>) • <b>Clic / Espace</b> : tamiser pour ne pas réveiller les sentinelles
</div>

<script>
const GAME_ID = "shadowcast_runner";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let perStage = 5, durationSec = 65;
let stageIdx = 0; // 0: 1dNB scrolling walls, 1: foPH soft polar shadows, 2: lbR8 rotated boxes
let boxes = [];
let relics = [];
let sentinels = [];
let ptr = { x: 256, y: 256, down: false };
let keys = {};
let stageCollected = 0, totalCollected = 0, alerts = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0, wallTimer = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function boxCorners(b) {
  const c = Math.cos(b.rot), s = Math.sin(b.rot);
  const hw = b.w / 2, hh = b.h / 2;
  const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  return pts.map(([lx, ly]) => ({ x: b.x + lx * c - ly * s, y: b.y + lx * s + ly * c }));
}

function segIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  const r_px = bx - ax, r_py = by - ay;
  const s_px = dx - cx, s_py = dy - cy;
  const denom = r_px * s_py - r_py * s_px;
  if (Math.abs(denom) < 1e-6) return false;
  const t = ((cx - ax) * s_py - (cy - ay) * s_px) / denom;
  const u = ((cx - ax) * r_py - (cy - ay) * r_px) / denom;
  return t > 0.01 && t < 0.99 && u >= 0 && u <= 1;
}

function hasLineOfSight(x1, y1, x2, y2) {
  for (const b of boxes) {
    const pts = boxCorners(b);
    for (let i = 0; i < 4; i++) {
      const p1 = pts[i], p2 = pts[(i + 1) % 4];
      if (segIntersect(x1, y1, x2, y2, p1.x, p1.y, p2.x, p2.y)) return false;
    }
  }
  return true;
}

function setupStage(idx) {
  stageIdx = idx;
  stageCollected = 0;
  boxes = [];
  if (idx === 0) {
    // 1dNB scrolling rectangular blocks
    for (let i = 0; i < 14; i++) {
      boxes.push({ x: 80 + Math.random() * 420, y: 35 + Math.random() * 442, w: 22 + Math.random() * 20, h: 22 + Math.random() * 20, rot: 0 });
    }
  } else if (idx === 1) {
    // foPH static rotated square obstacles
    for (let i = 0; i < 12; i++) {
      const sz = 36 + Math.random() * 24;
      boxes.push({ x: 65 + Math.random() * 382, y: 65 + Math.random() * 382, w: sz, h: sz, rot: Math.random() * Math.PI });
    }
  } else {
    // lbR8 dense sharp boxes
    for (let i = 0; i < 18; i++) {
      boxes.push({ x: 50 + Math.random() * 412, y: 50 + Math.random() * 412, w: 24 + Math.random() * 28, h: 24 + Math.random() * 28, rot: Math.random() * Math.PI });
    }
  }

  relics = Array.from({ length: perStage }, () => ({
    x: 42 + Math.random() * (SIZE - 84),
    y: 42 + Math.random() * (SIZE - 84),
    charge: 0,
    done: false
  }));

  sentinels = Array.from({ length: 3 }, (_, k) => ({
    x: 90 + k * 165,
    y: 90 + (k % 2) * 320,
    vx: (k % 2 === 0 ? 1 : -1) * 46,
    vy: (k % 2 === 0 ? -1 : 1) * 36,
    alert: 0
  }));
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  perStage = Math.max(3, Number(custom.perStage || 5));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  totalCollected = 0; alerts = 0;
  timeLeft = durationSec; score = 0; won = false; over = false;
  setupStage(0);
  updateStat();
}

function updateStat() {
  const names = ["1dNB", "foPH", "lbR8"];
  document.getElementById("stat").textContent =
    `Manche ${stageIdx + 1}/3 (${names[stageIdx]}) • Reliques ${stageCollected}/${perStage} • Alertes ${alerts}/3 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyR" && !over) setupStage(stageIdx);
  if (e.code === "Space") e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 270;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ptr.x -= spd * dt;
  if (keys.ArrowRight || keys.KeyD) ptr.x += spd * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ptr.y -= spd * dt;
  if (keys.ArrowDown || keys.KeyS) ptr.y += spd * dt;
  ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x));
  ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y));

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = false; updateStat(); return;
  }

  // Stage 0 (1dNB) scrolling walls
  if (stageIdx === 0) {
    for (let i = boxes.length - 1; i >= 0; i--) {
      boxes[i].x -= 62 * dt;
      if (boxes[i].x < -40) boxes.splice(i, 1);
    }
    wallTimer -= dt;
    if (wallTimer <= 0) {
      wallTimer = 0.45;
      boxes.push({ x: SIZE + 24, y: 25 + Math.random() * 462, w: 20 + Math.random() * 22, h: 20 + Math.random() * 22, rot: 0 });
    }
  }

  const dimmed = ptr.down || keys.Space;
  const lightRadius = dimmed ? 72 : 185;

  // Check relics illumination
  for (const rl of relics) {
    if (rl.done) continue;
    const d = Math.hypot(rl.x - ptr.x, rl.y - ptr.y);
    if (d < lightRadius && hasLineOfSight(ptr.x, ptr.y, rl.x, rl.y)) {
      rl.charge = Math.min(1, rl.charge + (dimmed ? 0.55 : 1.1) * dt);
      if (rl.charge >= 1) {
        rl.done = true;
        stageCollected++;
        totalCollected++;
        score += 120;
        if (stageCollected >= perStage) {
          if (stageIdx < 2) {
            setupStage(stageIdx + 1);
            score += 150;
          } else {
            over = true; won = true;
            score += Math.round(timeLeft * 25);
          }
          updateStat(); return;
        }
      }
    }
  }

  // Sentinels react if directly illuminated (hide behind box shadows or dim light!)
  for (const s of sentinels) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x < 30 || s.x > SIZE - 30) s.vx *= -1;
    if (s.y < 30 || s.y > SIZE - 30) s.vy *= -1;
    const d = Math.hypot(s.x - ptr.x, s.y - ptr.y);
    if (!dimmed && d < lightRadius * 0.9 && hasLineOfSight(ptr.x, ptr.y, s.x, s.y)) {
      s.alert += 0.95 * dt;
      if (s.alert >= 1) {
        s.alert = 0;
        alerts++;
        if (alerts >= 3) { over = true; won = false; updateStat(); return; }
      }
    } else {
      s.alert = Math.max(0, s.alert - 0.5 * dt);
    }
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#04060c";
  ctx.fillRect(0, 0, SIZE, SIZE);

  const dimmed = ptr.down || keys.Space;
  const lightRadius = dimmed ? 72 : 185;

  // Radial light gradient
  const grd = ctx.createRadialGradient(ptr.x, ptr.y, 4, ptr.x, ptr.y, lightRadius);
  grd.addColorStop(0, "rgba(254, 249, 195, 0.92)");
  grd.addColorStop(0.55, "rgba(186, 230, 253, 0.36)");
  grd.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(ptr.x, ptr.y, lightRadius, 0, Math.PI * 2); ctx.fill();

  // Relics (visible when in light)
  for (const rl of relics) {
    const lit = Math.hypot(rl.x - ptr.x, rl.y - ptr.y) < lightRadius && hasLineOfSight(ptr.x, ptr.y, rl.x, rl.y);
    ctx.save();
    ctx.globalAlpha = rl.done ? 0.5 : (lit ? 1 : 0.16);
    ctx.strokeStyle = rl.done ? "#4ade80" : "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(rl.x, rl.y, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = rl.done ? "rgba(74,222,128,0.5)" : "rgba(250,204,21,0.5)";
    ctx.beginPath(); ctx.arc(rl.x, rl.y, 13 * rl.charge, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Sentinels
  for (const s of sentinels) {
    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
    ctx.strokeStyle = "#fda4af";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (s.alert > 0.05) {
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 17, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * s.alert);
      ctx.stroke();
    }
  }

  // Cast geometric box shadows (lbR8 / foPH / 1dNB)
  ctx.fillStyle = stageIdx === 1 ? "rgba(2, 4, 10, 0.78)" : "rgba(2, 4, 10, 0.94)";
  for (const b of boxes) {
    const pts = boxCorners(b);
    for (let i = 0; i < 4; i++) {
      const p1 = pts[i], p2 = pts[(i + 1) % 4];
      const r1x = (p1.x - ptr.x) * 12, r1y = (p1.y - ptr.y) * 12;
      const r2x = (p2.x - ptr.x) * 12, r2y = (p2.y - ptr.y) * 12;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p1.x + r1x, p1.y + r1y);
      ctx.lineTo(p2.x + r2x, p2.y + r2y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Draw solid obstacle boxes
  ctx.fillStyle = "#334155";
  ctx.strokeStyle = "#64748b";
  ctx.lineWidth = 1.5;
  for (const b of boxes) {
    const pts = boxCorners(b);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  if (!over) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 5, 0, Math.PI * 2); ctx.fill();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "OMBRES MAÎTRISÉES !" : (alerts >= 3 ? "REPÉRÉ PAR LES SENTINELLES" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Reliques ${totalCollected}/${perStage * 3} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
