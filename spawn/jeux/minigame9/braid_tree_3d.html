<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sculpture 3D : Arbre &amp; Tresses Voxel (Braid Tree 3D)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #c084fc; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #070912; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: grab; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(192,132,252,0.18); }
  canvas:active { cursor: grabbing; }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "braid_tree_3d",
  "name": "Sculpture 3D : Arbre & Tresses Voxel (Braid Tree 3D)",
  "family": "core",
  "icon": "🌳",
  "controls": "Glisser (ou ZQSD/Flèches) pour faire pivoter l'arbre et les tresses en 3D • Clic double / Espace : propager une nouvelle pousse de branches/tresses",
  "description": "Fusion de ayGb.as / Tree.as (arbre fractal 3D en rotation Matrix3D) et diu3.as (tresses néon sur grille voxel 3D X×Y×Z en mode additif) : alignez vos cimes 3D en croissance avec les anneaux orbitaux.",
  "goal": "Aligner 18 anneaux orbitaux dorés avec les pointes de votre sculpture 3D en moins de 65 secondes sans heurter 3 sphères d'ombre.",
  "fields": [
    { "key": "targetRings", "label": "Anneaux à valider", "type": "number", "default": 18 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌳 Sculpture 3D</span>
  <span id="stat">Anneaux 0/18 • PV 3 • 65s</span>
  <div class="bar-btns">
    <button onclick="pulseGrowth()" title="Pousse 3D (Espace)">✨ Pousse</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser / ZQSD</b> : rotation 3D de la sculpture (<b>ayGb / diu3</b>) • <b>Espace</b> : nouvelle ramification 3D
</div>

<script>
const GAME_ID = "braid_tree_3d";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetRings = 18, durationSec = 65;
let rotY = 0, rotX = 0.22;
let velY = 0.35, velX = 0;
let ptr = { x: 256, y: 256, down: false };
let keys = {};

let treePts = [];    // 3D tree branches (ayGb)
let braidPts = [];   // 3D voxel braid (diu3)
let rings = [];      // golden 3D target rings
let hazards = [];    // red 3D shadow spheres
let pulseCd = 0, invuln = 0, ringTimer = 0;
let caught = 0, hp = 3, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function generate3DTree() {
  treePts = [];
  function branch(x, y, z, dx, dy, dz, len, depth) {
    if (depth <= 0 || treePts.length > 90) return;
    const nx = x + dx * len, ny = y + dy * len, nz = z + dz * len;
    treePts.push({ x1: x, y1: y, z1: z, x2: nx, y2: ny, z2: nz, depth, isTip: depth === 1 });
    for (let k = 0; k < 2; k++) {
      const yaw = (k === 0 ? 1 : -1) * (0.45 + Math.random() * 0.25);
      const pitch = (Math.random() - 0.5) * 0.55;
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const ndx = dx * cosY - dz * sinY + pitch * 0.3;
      const ndz = dx * sinY + dz * cosY + (k === 0 ? 0.22 : -0.22);
      const ndy = dy - 0.12;
      const nLen = Math.hypot(ndx, ndy, ndz) || 1;
      branch(nx, ny, nz, ndx / nLen, ndy / nLen, ndz / nLen, len * 0.74, depth - 1);
    }
  }
  branch(0, 110, 0, 0, -1, 0, 62, 5);
}

function generate3DBraid() {
  braidPts = [];
  let cx = 0, cy = 0, cz = 0;
  for (let s = 0; s < 3; s++) {
    let px = (s - 1) * 35, py = 70, pz = (s % 2 ? 25 : -25);
    for (let i = 0; i < 20; i++) {
      const a = i * 0.45 + s * 2.1;
      const nx = Math.cos(a) * 62;
      const ny = 70 - i * 8.5;
      const nz = Math.sin(a) * 62;
      braidPts.push({ x1: px, y1: py, z1: pz, x2: nx, y2: ny, z2: nz, hue: 260 + s * 35 });
      px = nx; py = ny; pz = nz;
    }
  }
}

function pulseGrowth() {
  if (pulseCd > 0 || over) return;
  pulseCd = 0.7;
  generate3DTree();
  // Quick burst of rotation
  velY += (Math.random() < 0.5 ? 1 : -1) * 1.1;
}

function project(x, y, z) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const y2 = y * cx - z1 * sx;
  const z2 = y * sx + z1 * cx;
  const fov = 390;
  const dist = Math.max(120, fov + z2);
  const scale = fov / dist;
  return { sx: 256 + x1 * scale, sy: 276 + y2 * scale, z: z2, scale };
}

function spawnRing() {
  if (rings.length >= 4) return;
  const a = Math.random() * Math.PI * 2;
  const rad = 55 + Math.random() * 68;
  rings.push({
    x: Math.cos(a) * rad,
    y: -90 + Math.random() * 140,
    z: Math.sin(a) * rad,
    r: 18,
    pulse: Math.random() * 6.28
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetRings = Math.max(6, Number(custom.targetRings || 18));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  rotY = 0; rotX = 0.18; velY = 0.4; velX = 0;
  generate3DTree();
  generate3DBraid();
  rings = [];
  for (let i = 0; i < 3; i++) spawnRing();
  hazards = Array.from({ length: 3 }, (_, i) => ({
    ang: (i / 3) * Math.PI * 2,
    rad: 95,
    y: -50 + i * 45,
    spd: (i % 2 === 0 ? 1 : -1) * 0.9
  }));
  caught = 0; hp = 3; pulseCd = 0; invuln = 0; ringTimer = 0.5;
  timeLeft = durationSec; score = 0; won = false; over = false;
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Anneaux ${caught}/${targetRings} • PV ${hp} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  cv.setPointerCapture(e.pointerId);
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  if (ptr.down) {
    const dx = p.x - ptr.x, dy = p.y - ptr.y;
    velY = dx * 0.08;
    velX = dy * 0.06;
    rotY += dx * 0.012;
    rotX = Math.max(-0.9, Math.min(0.9, rotX + dy * 0.01));
  }
  ptr.x = p.x; ptr.y = p.y;
});
cv.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("pointercancel", () => { ptr.down = false; });

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); pulseGrowth(); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) velY -= 4.2 * dt;
  if (keys.ArrowRight || keys.KeyD) velY += 4.2 * dt;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) velX -= 3.0 * dt;
  if (keys.ArrowDown || keys.KeyS) velX += 3.0 * dt;

  rotY += velY * dt;
  rotX = Math.max(-0.85, Math.min(0.85, rotX + velX * dt));
  velY *= 0.96;
  velX *= 0.93;
  if (Math.abs(velY) < 0.25 && !ptr.down) rotY += 0.25 * dt;

  if (pulseCd > 0) pulseCd -= dt;
  if (invuln > 0) invuln -= dt;

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = caught >= targetRings;
    updateStat(); return;
  }

  ringTimer -= dt;
  if (ringTimer <= 0) { spawnRing(); ringTimer = 0.85; }

  // Project tree tips for 2D/3D screen-space alignment
  const projectedTips = [];
  for (const b of treePts) {
    if (b.isTip) projectedTips.push(project(b.x2, b.y2, b.z2));
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    const rg = rings[i];
    rg.pulse += dt * 4;
    const pr = project(rg.x, rg.y, rg.z);
    for (const tp of projectedTips) {
      if (Math.hypot(tp.sx - pr.sx, tp.sy - pr.sy) < 18 && Math.abs(tp.z - pr.z) < 55) {
        caught++;
        score += 130;
        rings.splice(i, 1);
        if (caught >= targetRings) {
          over = true; won = true;
          score += Math.round(timeLeft * 20);
          updateStat(); return;
        }
        break;
      }
    }
  }

  for (const h of hazards) {
    h.ang += h.spd * dt;
    const hx = Math.cos(h.ang) * h.rad;
    const hz = Math.sin(h.ang) * h.rad;
    const ph = project(hx, h.y, hz);
    if (invuln <= 0) {
      for (const tp of projectedTips) {
        if (Math.hypot(tp.sx - ph.sx, tp.sy - ph.sy) < 14 && Math.abs(tp.z - ph.z) < 32) {
          hp--;
          invuln = 1.1;
          if (hp <= 0) { over = true; won = false; updateStat(); return; }
          break;
        }
      }
    }
  }

  updateStat();
}

function draw() {
  ctx.fillStyle = "#070912";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Additive 3D voxel braids (diu3)
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const br of braidPts) {
    const p1 = project(br.x1, br.y1, br.z1);
    const p2 = project(br.x2, br.y2, br.z2);
    ctx.strokeStyle = `hsla(${br.hue}, 90%, 65%, 0.45)`;
    ctx.lineWidth = Math.max(1, 2.5 * p1.scale);
    ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
  }
  ctx.restore();

  // 3D Tree (ayGb)
  const sortedBranches = treePts.map(b => {
    const p1 = project(b.x1, b.y1, b.z1);
    const p2 = project(b.x2, b.y2, b.z2);
    return { b, p1, p2, z: (p1.z + p2.z) * 0.5 };
  }).sort((a, b) => b.z - a.z);

  for (const item of sortedBranches) {
    const { b, p1, p2 } = item;
    ctx.strokeStyle = invuln > 0 ? "#fda4af" : (b.isTip ? "#e879f9" : "#a855f7");
    ctx.lineWidth = Math.max(1.2, b.depth * 1.1 * p1.scale);
    ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
    if (b.isTip) {
      ctx.fillStyle = "#f5d0fe";
      ctx.beginPath(); ctx.arc(p2.sx, p2.sy, 3.2 * p2.scale, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 3D Orbital Rings
  for (const rg of rings) {
    const pr = project(rg.x, rg.y, rg.z);
    const rr = (rg.r + Math.sin(rg.pulse) * 2.5) * pr.scale;
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(pr.sx, pr.sy, Math.max(5, rr), 0, Math.PI * 2); ctx.stroke();
  }

  // 3D Shadow Spheres
  for (const h of hazards) {
    const ph = project(Math.cos(h.ang) * h.rad, h.y, Math.sin(h.ang) * h.rad);
    const rr = Math.max(5, 13 * ph.scale);
    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ph.sx, ph.sy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SCULPTURE ALIGNÉE !" : (hp <= 0 ? "TRESSES BRISÉES" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Anneaux ${caught}/${targetRings} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
