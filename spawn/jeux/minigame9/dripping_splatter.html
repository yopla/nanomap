<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Éclaboussures 3D &amp; Aquarelle (Dripping Splatter)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38bdf8; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #eef4fa; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,189,248,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "dripping_splatter",
  "name": "Éclaboussures 3D & Aquarelle (Dripping Splatter)",
  "family": "core",
  "icon": "🎨",
  "controls": "Balayer / glisser vite (ou ZQSD + Espace) pour lancer des gouttes en cloche 3D (axe z) par-dessus les murets",
  "description": "Adapté de iqoO.as (dripping, breeding) : votre élan projette des gouttes en perspective 3D (vz -= 0.5) qui franchissent les obstacles et s'écrasent au sol en mode DARKEN puis se diffusent en aquarelle.",
  "goal": "Peindre les 5 toiles cibles à 100 % en moins de 65 secondes tout en évitant plus de 15 taches sur les zones interdites rouges.",
  "fields": [
    { "key": "targetCanvases", "label": "Toiles à peindre", "type": "number", "default": 5 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎨 Aquarelle 3D</span>
  <span id="stat">Toiles 0/5 • Taches 0/15 • 65s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Balayer</b> : lancer des gouttes 3D par-dessus les murets (<b>iqoO</b>) • Peignez les 5 cadres bleus sans tacher les zones rouges
</div>

<script>
const GAME_ID = "dripping_splatter";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const floorCv = document.createElement("canvas");
floorCv.width = SIZE; floorCv.height = SIZE;
const floorCtx = floorCv.getContext("2d");

let targetCanvases = 5, durationSec = 65;
let bobbles = [];
let zones = [];    // paint targets
let avoids = [];   // red no-paint zones
let walls = [];    // low walls (drops fly over if z > -5)
let ptr = { x: 256, y: 256, px: 256, py: 256 };
let keys = {};
let painted = 0, fouls = 0, timeLeft = 65, score = 0, won = false, over = false;
let lastTs = 0, bleachTick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnSplash(x, y, vx, vy) {
  for (let i = 0; i < 3 && bobbles.length < 180; i++) {
    const r = Math.random() * Math.PI * 2;
    const d = Math.random() * 28;
    bobbles.push({
      x: x - 256 + vx * 0.15,
      y: y - 256 + vy * 0.15,
      z: 0,
      vx: Math.cos(r) * d + vx * 0.55,
      vy: Math.sin(r) * d + vy * 0.55,
      vz: 45 + Math.random() * 95,
      col: `hsl(${Math.floor(Math.random() * 360)}, 85%, 52%)`,
      size: 5 + Math.random() * 8
    });
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetCanvases = Math.max(3, Number(custom.targetCanvases || 5));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  floorCtx.fillStyle = "#eef4fa";
  floorCtx.fillRect(0, 0, SIZE, SIZE);
  bobbles = [];
  painted = 0; fouls = 0;
  timeLeft = durationSec; score = 0; won = false; over = false;

  zones = [
    { x: 95, y: 95, r: 34, fill: 0, done: false },
    { x: 417, y: 95, r: 34, fill: 0, done: false },
    { x: 95, y: 417, r: 34, fill: 0, done: false },
    { x: 417, y: 417, r: 34, fill: 0, done: false },
    { x: 256, y: 256, r: 36, fill: 0, done: false }
  ].slice(0, targetCanvases);

  avoids = [
    { x: 256, y: 85, r: 26 },
    { x: 256, y: 427, r: 26 },
    { x: 85, y: 256, r: 26 },
    { x: 427, y: 256, r: 26 }
  ];

  walls = [
    { x: 165, y: 155, w: 182, h: 12 },
    { x: 165, y: 345, w: 182, h: 12 }
  ];
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent =
    `Toiles ${painted}/${targetCanvases} • Taches ${fouls}/15 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, ((e.clientX - r.left) / r.width) * SIZE)),
    y: Math.max(0, Math.min(SIZE, ((e.clientY - r.top) / r.height) * SIZE))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.px = ptr.x = p.x; ptr.py = ptr.y = p.y;
  spawnSplash(p.x, p.y, 0, -40);
});
cv.addEventListener("pointermove", (e) => {
  if (over) return;
  const p = getPos(e);
  const vx = (p.x - ptr.x) * 9;
  const vy = (p.y - ptr.y) * 9;
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  if (Math.hypot(vx, vy) > 14) spawnSplash(p.x, p.y, vx, vy);
});

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); if (!over) spawnSplash(ptr.x, ptr.y, 0, -60); }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function step(dt) {
  if (over) return;

  const spd = 250;
  let kx = 0, ky = 0;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
  if (keys.ArrowRight || keys.KeyD) kx += 1;
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
  if (keys.ArrowDown || keys.KeyS) ky += 1;
  if (kx || ky) {
    ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x + kx * spd * dt));
    ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y + ky * spd * dt));
    spawnSplash(ptr.x, ptr.y, kx * 140, ky * 140);
  }

  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft <= 0) {
    over = true; won = painted >= targetCanvases;
    updateStat(); return;
  }

  // Slow watercolor paper brightening (ColorMatrix 1.004 equivalent)
  bleachTick += dt;
  if (bleachTick > 0.1) {
    bleachTick = 0;
    floorCtx.fillStyle = "rgba(238, 244, 250, 0.03)";
    floorCtx.fillRect(0, 0, SIZE, SIZE);
  }

  // Sort back-to-front by z
  bobbles.sort((a, b) => a.z - b.z);
  const stepF = dt * 32;

  for (let i = bobbles.length - 1; i >= 0; i--) {
    const b = bobbles[i];
    b.vz -= 2.9 * stepF;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;

    const scale = Math.max(0.25, (b.z + 200) / 200);
    const sx = 256 + b.x * scale;
    const sy = 256 + b.y * scale;

    // Low walls block low-altitude drops
    if (b.z < 12) {
      for (const wl of walls) {
        if (sx >= wl.x && sx <= wl.x + wl.w && sy >= wl.y && sy <= wl.y + wl.h) {
          b.vy *= -0.6;
          b.y += (b.vy > 0 ? 6 : -6);
        }
      }
    }

    if (b.z <= -22) {
      // Splatter onto watercolor floor in darken mode
      floorCtx.save();
      floorCtx.globalCompositeOperation = "multiply";
      floorCtx.fillStyle = b.col;
      floorCtx.globalAlpha = 0.72;
      floorCtx.beginPath();
      floorCtx.arc(sx, sy, b.size * scale, 0, Math.PI * 2);
      floorCtx.fill();
      floorCtx.restore();

      // Check target canvases
      for (const z of zones) {
        if (!z.done && Math.hypot(sx - z.x, sy - z.y) < z.r + b.size) {
          z.fill = Math.min(1, z.fill + 0.11);
          score += 12;
          if (z.fill >= 1) {
            z.done = true;
            painted++;
            score += 200;
            if (painted >= targetCanvases) {
              over = true; won = true;
              score += Math.round(timeLeft * 20);
              updateStat(); return;
            }
          }
        }
      }

      // Check forbidden red zones
      for (const av of avoids) {
        if (Math.hypot(sx - av.x, sy - av.y) < av.r) {
          fouls++;
          if (fouls >= 15) {
            over = true; won = false; updateStat(); return;
          }
          break;
        }
      }

      bobbles.splice(i, 1);
    }
  }

  updateStat();
}

function draw() {
  ctx.drawImage(floorCv, 0, 0);

  // Walls
  for (const wl of walls) {
    ctx.fillStyle = "rgba(30, 41, 59, 0.85)";
    ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
  }

  // Target canvases
  for (const z of zones) {
    ctx.strokeStyle = z.done ? "#16a34a" : "#0284c7";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = z.done ? "rgba(34,197,94,0.22)" : "rgba(14,165,233,0.10)";
    ctx.fill();
    ctx.fillStyle = z.done ? "#15803d" : "#0f172a";
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(z.done ? "✓ 100%" : `${Math.round(z.fill * 100)}%`, z.x, z.y);
  }

  // Forbidden red zones
  for (const av of avoids) {
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 2.5;
    ctx.fillStyle = "rgba(239, 68, 68, 0.14)";
    ctx.beginPath(); ctx.arc(av.x, av.y, av.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#b91c1c";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("✕", av.x, av.y);
  }

  // Airborne 3D bobbles
  for (const b of bobbles) {
    const scale = Math.max(0.25, (b.z + 200) / 200);
    const sx = 256 + b.x * scale;
    const sy = 256 + b.y * scale;
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = b.col;
    ctx.beginPath(); ctx.arc(sx, sy, b.size * scale, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (!over) {
    ctx.strokeStyle = "#0284c7";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 10, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TOILES PEINTES !" : (fouls >= 15 ? "TROP DE TACHES" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Toiles ${painted}/${targetCanvases} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
