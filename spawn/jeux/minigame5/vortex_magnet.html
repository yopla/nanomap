<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Trou Magnétique (Vortex Magnet)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #a78bfa; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060713; border: 2px solid #a78bfa; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: none; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(167,139,250,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "vortex_magnet",
  "name": "Trou Magnétique (Vortex Magnet)",
  "family": "topMouseMut",
  "icon": "🌀",
  "controls": "Pointeur ou Flèches/ZQSD pour déplacer la singularité • Clic/taper ou Espace pour libérer une onde de choc magnétique (burst)",
  "description": "Fusion de la grille magnétique déformable (4Ueg), de l'essaim avec onde de choc (6GBb) et de l'aspiration Genie (gf3B) : attirez et avalez les noyaux stellaires tout en repoussant les mines d'antimatière avec votre onde de choc.",
  "goal": "Absorber 25 noyaux stellaires en 60 secondes sans perdre vos 3 points d'intégrité.",
  "fields": [
    { "key": "targetCores", "label": "Noyaux à absorber", "type": "number", "default": 25 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌀 Vortex Magnet</span>
  <span id="stat">★ 0/25 • ❤️ 3 • 60s</span>
  <div class="bar-btns">
    <button onclick="triggerBurst()" title="Onde de choc (Clic / Espace)">💥 Onde</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : piloter le vortex • <b>Clic / Espace</b> : onde de choc pour repousser les mines rouges
</div>

<script>
const GAME_ID = "vortex_magnet";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// 2D Deformable Mesh (4Ueg.as + 6GBb.as)
const MESH_N = 18;
const MESH_SPAN = SIZE / (MESH_N - 1);
let mesh = [];

let targetCores = 25, durationSec = 60;
let vortex = { x: 256, y: 256, tx: 256, ty: 256, r: 22 };
let stars = [];
let mines = [];
let bursts = [];
let keys = {};
let absorbed = 0, hp = 3, timeLeft = 60, score = 0, won = false, over = false;
let burstCd = 0, hitCd = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnStar() {
  let x, y;
  do {
    x = 32 + Math.random() * (SIZE - 64);
    y = 32 + Math.random() * (SIZE - 64);
  } while (Math.hypot(x - vortex.x, y - vortex.y) < 110);
  stars.push({
    x, y,
    vx: (Math.random() - 0.5) * 40,
    vy: (Math.random() - 0.5) * 40,
    r: 8,
    suck: 0, // Genie funnel progress (gf3B.as)
    gold: Math.random() < 0.28,
    rot: Math.random() * 6.28
  });
}

function spawnMine() {
  let x, y;
  do {
    x = 32 + Math.random() * (SIZE - 64);
    y = 32 + Math.random() * (SIZE - 64);
  } while (Math.hypot(x - vortex.x, y - vortex.y) < 140);
  const a = Math.random() * Math.PI * 2;
  mines.push({
    x, y,
    vx: Math.cos(a) * 58,
    vy: Math.sin(a) * 58,
    r: 12,
    phase: Math.random() * 6.28
  });
}

function triggerBurst() {
  if (over || burstCd > 0) return;
  burstCd = 0.7;
  bursts.push({ x: vortex.x, y: vortex.y, r: 10, maxR: 220, life: 1 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetCores = Math.max(10, Number(custom.targetCores || 25));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  mesh = [];
  for (let j = 0; j < MESH_N; j++) {
    for (let i = 0; i < MESH_N; i++) {
      const ax = i * MESH_SPAN, ay = j * MESH_SPAN;
      mesh.push({ x: ax, y: ay, vx: 0, vy: 0, ax, ay, ex: 0, ey: 0 });
    }
  }
  vortex = { x: 256, y: 256, tx: 256, ty: 256, r: 22 };
  stars = [];
  mines = [];
  bursts = [];
  for (let i = 0; i < 8; i++) spawnStar();
  for (let i = 0; i < 5; i++) spawnMine();
  absorbed = 0;
  hp = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  burstCd = 0;
  hitCd = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `★ ${absorbed}/${targetCores} • ❤️ ${hp} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (SIZE / r.width), y: (e.clientY - r.top) * (SIZE / r.height) };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  vortex.tx = p.x;
  vortex.ty = p.y;
  triggerBurst();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  vortex.tx = p.x;
  vortex.ty = p.y;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) triggerBurst();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (burstCd > 0) burstCd = Math.max(0, burstCd - dt);
    if (hitCd > 0) hitCd = Math.max(0, hitCd - dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      vortex.tx = Math.max(24, Math.min(SIZE - 24, vortex.tx + (kx / m) * 280 * dt));
      vortex.ty = Math.max(24, Math.min(SIZE - 24, vortex.ty + (ky / m) * 280 * dt));
    }

    vortex.x += (vortex.tx - vortex.x) * Math.min(1, dt * 12);
    vortex.y += (vortex.ty - vortex.y) * Math.min(1, dt * 12);

    // Update 4Ueg magnetic mesh + 6GBb burst ripple push
    for (const pt of mesh) {
      const dx = vortex.x - pt.ax;
      const dy = vortex.y - pt.ay;
      const far = Math.max(18, Math.hypot(dx, dy));
      const pull = Math.min(28, 1200 / (far + 22));
      const tx = pt.ax + (dx / far) * pull + pt.ex;
      const ty = pt.ay + (dy / far) * pull + pt.ey;
      pt.x += (tx - pt.x) * Math.min(1, dt * 10);
      pt.y += (ty - pt.y) * Math.min(1, dt * 10);
      pt.ex *= Math.pow(0.08, dt);
      pt.ey *= Math.pow(0.08, dt);
    }

    // Expanding bursts push mesh nodes and blast away mines (6GBb.as)
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.r += 340 * dt;
      b.life = Math.max(0, 1 - b.r / b.maxR);
      for (const pt of mesh) {
        const dx = pt.ax - b.x, dy = pt.ay - b.y;
        const d = Math.hypot(dx, dy);
        if (d > 1 && Math.abs(d - b.r) < 30) {
          pt.ex += (dx / d) * 14 * dt * 20;
          pt.ey += (dy / d) * 14 * dt * 20;
        }
      }
      for (const m of mines) {
        const dx = m.x - b.x, dy = m.y - b.y;
        const d = Math.hypot(dx, dy);
        if (d > 1 && d < b.r + 20 && d > b.r - 45) {
          m.vx += (dx / d) * 320 * dt;
          m.vy += (dy / d) * 320 * dt;
        }
      }
      if (b.r >= b.maxR) bursts.splice(i, 1);
    }

    // Update stars: pull into vortex + Genie funnel stretch (gf3B.as)
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.rot += dt * 2.5;
      const dx = vortex.x - s.x, dy = vortex.y - s.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 135 && dist > 1) {
        const pull = (1 - dist / 135) * 360 * dt;
        s.vx += (dx / dist) * pull;
        s.vy += (dy / dist) * pull;
        s.suck = Math.min(1, (135 - dist) / 115);
      } else {
        s.suck = Math.max(0, s.suck - dt * 3);
      }
      s.vx *= Math.pow(0.28, dt);
      s.vy *= Math.pow(0.28, dt);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 16) { s.x = 16; s.vx = Math.abs(s.vx); }
      if (s.x > SIZE - 16) { s.x = SIZE - 16; s.vx = -Math.abs(s.vx); }
      if (s.y < 16) { s.y = 16; s.vy = Math.abs(s.vy); }
      if (s.y > SIZE - 16) { s.y = SIZE - 16; s.vy = -Math.abs(s.vy); }

      if (dist < vortex.r + 4) {
        stars.splice(i, 1);
        absorbed++;
        score += s.gold ? 80 : 45;
        spawnStar();
        if (absorbed >= targetCores) {
          won = true;
          over = true;
          score += Math.round(timeLeft * 15) + hp * 80;
          break;
        }
      }
    }

    // Update mines (weakly pulled if very close, repelled by bursts)
    for (const m of mines) {
      m.phase += dt * 4.5;
      const dx = vortex.x - m.x, dy = vortex.y - m.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 95 && dist > 1) {
        m.vx += (dx / dist) * 115 * dt;
        m.vy += (dy / dist) * 115 * dt;
      }
      const spd = Math.hypot(m.vx, m.vy);
      if (spd > 190) { m.vx = (m.vx / spd) * 190; m.vy = (m.vy / spd) * 190; }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x < 16) { m.x = 16; m.vx = Math.abs(m.vx); }
      if (m.x > SIZE - 16) { m.x = SIZE - 16; m.vx = -Math.abs(m.vx); }
      if (m.y < 16) { m.y = 16; m.vy = Math.abs(m.vy); }
      if (m.y > SIZE - 16) { m.y = SIZE - 16; m.vy = -Math.abs(m.vy); }

      if (hitCd <= 0 && dist < vortex.r + m.r - 2) {
        hitCd = 0.9;
        hp--;
        bursts.push({ x: vortex.x, y: vortex.y, r: 10, maxR: 160, life: 1 });
        m.vx = -(dx / Math.max(1, dist)) * 180;
        m.vy = -(dy / Math.max(1, dist)) * 180;
        if (hp <= 0) {
          won = false;
          over = true;
          break;
        }
      }
    }

    if (timeLeft <= 0 && !over) {
      won = absorbed >= targetCores;
      over = true;
    }
    updateHud();
  }

  // Draw
  ctx.fillStyle = "#060713";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Deformed mesh grid (4Ueg.as)
  ctx.strokeStyle = "rgba(167, 139, 250, 0.24)";
  ctx.lineWidth = 1;
  for (let j = 0; j < MESH_N; j++) {
    ctx.beginPath();
    for (let i = 0; i < MESH_N; i++) {
      const pt = mesh[j * MESH_N + i];
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < MESH_N; i++) {
    ctx.beginPath();
    for (let j = 0; j < MESH_N; j++) {
      const pt = mesh[j * MESH_N + i];
      if (j === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }

  // Vortex attraction radius
  ctx.strokeStyle = "rgba(56, 214, 255, 0.22)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(vortex.x, vortex.y, 135, 0, Math.PI * 2);
  ctx.stroke();

  // Star-cores with Genie funnel stretch toward singularity (gf3B.as)
  for (const s of stars) {
    const ang = Math.atan2(vortex.y - s.y, vortex.x - s.x);
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.suck > 0.05) {
      ctx.rotate(ang);
      ctx.scale(1 + s.suck * 1.4, Math.max(0.45, 1 - s.suck * 0.45));
      ctx.rotate(-ang);
    }
    ctx.rotate(s.rot);
    ctx.fillStyle = s.gold ? "#fde047" : "#38d6ff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      const rad = k % 2 === 0 ? s.r * 1.25 : s.r * 0.55;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Antimatter mines
  for (const m of mines) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fecaca";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, m.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "#fca5a5";
    ctx.beginPath();
    ctx.arc(0, 0, m.r + 4 + Math.sin(m.phase) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Burst waves
  for (const b of bursts) {
    ctx.strokeStyle = `rgba(103, 232, 249, ${b.life})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Magnetic singularity core
  const vg = ctx.createRadialGradient(vortex.x, vortex.y, 2, vortex.x, vortex.y, vortex.r * 1.7);
  vg.addColorStop(0, "#020308");
  vg.addColorStop(0.55, hitCd > 0 ? "#ef4444" : "#7c3aed");
  vg.addColorStop(0.85, "#38d6ff");
  vg.addColorStop(1, "rgba(56, 214, 255, 0)");
  ctx.fillStyle = vg;
  ctx.beginPath();
  ctx.arc(vortex.x, vortex.y, vortex.r * 1.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#020308";
  ctx.strokeStyle = hitCd > 0 ? "#fca5a5" : "#c4b5fd";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(vortex.x, vortex.y, vortex.r * 0.65, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SINGULARITÉ STABILISÉE !" : "VORTEX EFFONDRÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${absorbed}/${targetCores} noyaux • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
