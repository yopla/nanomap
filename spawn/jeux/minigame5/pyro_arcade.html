<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pyromancien (Pyro Arcade)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fb923c; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #09080f; border: 2px solid #fb923c; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,146,60,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pyro_arcade",
  "name": "Pyromancien (Pyro Arcade)",
  "family": "topMouseHnS",
  "icon": "🔥",
  "controls": "Maintenir clic/toucher pour viser le lance-flammes • Clic droit, Espace ou bouton 💥 pour déclencher une explosion radiale",
  "description": "Fusion du lance-flammes (dUXf), souffle de feu périodique (FlameBreath), explosions (Main04), étincelles rebondissantes (FlashTest), braises (fireTest) et vapeur montante (sCuG/fgJ3) : défendez le réacteur contre 3 vagues de cibles.",
  "goal": "Détruire les 30 cibles (3 vagues) avant de perdre vos 3 boucliers.",
  "fields": [
    { "key": "targetKills", "label": "Cibles à détruire", "type": "number", "default": 30 },
    { "key": "shields", "label": "Boucliers", "type": "number", "default": 3 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🔥 Pyro Arcade</span>
  <span id="stat">🎯 0/30 • 🛡️ 3 • Vague 1/3</span>
  <div class="bar-btns">
    <button id="btnBoom" onclick="triggerExplosion(aim.x, aim.y)" title="Explosion (Espace / Clic droit)">💥</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Maintenir</b> : lance-flammes + souffle chargé • <b>Espace / Clic droit / 💥</b> : explosion radiale + étincelles
</div>

<script>
const GAME_ID = "pyro_arcade";
const SIZE = 512;
const CORE_X = 256, CORE_Y = 474;
const FLOOR_Y = 494;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetKills = 30, maxShields = 3;
let shields = 3, kills = 0, spawned = 0;
let wave = 1, breathCharge = 0, boomCd = 0;
let flames = [];
let sparks = [];
let steam = [];
let bursts = [];
let enemies = [];
let aim = { x: 256, y: 180, down: false };
let spawnTimer = 0, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnEnemy() {
  if (spawned >= targetKills) return;
  spawned++;
  wave = spawned <= 10 ? 1 : (spawned <= 20 ? 2 : 3);
  const kindRoll = Math.random();
  let kind = "ice";
  if (wave >= 2 && kindRoll > 0.6) kind = "armor";
  if (wave >= 3 && kindRoll > 0.8) kind = "comet";
  const x = 36 + Math.random() * (SIZE - 72);
  const targetX = CORE_X + (Math.random() - 0.5) * 80;
  const ang = Math.atan2(CORE_Y - (-18), targetX - x);
  const spd = kind === "comet" ? 118 : (kind === "armor" ? 48 : 66 + wave * 9);
  const hp = kind === "armor" ? 65 : (kind === "comet" ? 32 : 24 + wave * 6);
  enemies.push({
    x, y: -18,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    r: kind === "armor" ? 19 : (kind === "comet" ? 12 : 15),
    hp, maxHp: hp,
    kind,
    hitFlash: 0
  });
}

function addFlameParticle(x, y, vx, vy, r, life, isBig) {
  if (flames.length > 260) flames.shift();
  flames.push({ x, y, vx, vy, r, life, maxLife: life, isBig });
}

function addSparks(x, y, count) {
  for (let i = 0; i < count; i++) {
    if (sparks.length > 180) sparks.shift();
    const a = Math.random() * Math.PI * 2;
    const spd = 70 + Math.random() * 190;
    sparks.push({
      x, y, px: x, py: y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - 45,
      life: 0.7 + Math.random() * 0.5
    });
  }
}

function addSteam(x, y, count) {
  for (let i = 0; i < count; i++) {
    if (steam.length > 120) steam.shift();
    steam.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 28,
      vy: -32 - Math.random() * 44,
      r: 7 + Math.random() * 10,
      life: 0.8 + Math.random() * 0.5
    });
  }
}

function triggerExplosion(tx, ty) {
  if (over || boomCd > 0) return;
  boomCd = 1.6;
  const x = Math.max(24, Math.min(SIZE - 24, tx));
  const y = Math.max(24, Math.min(SIZE - 40, ty));
  bursts.push({ x, y, r: 8, maxR: 88, life: 1 });
  addSparks(x, y, 22);
  addSteam(x, y, 8);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    const d = Math.hypot(en.x - x, en.y - y);
    if (d < 88 + en.r) {
      en.hp -= 55 * (1 - d / 135);
      en.hitFlash = 1;
      if (en.hp <= 0) destroyEnemy(i);
    }
  }
}

function destroyEnemy(idx) {
  const en = enemies[idx];
  addSparks(en.x, en.y, 12);
  addSteam(en.x, en.y, 6);
  enemies.splice(idx, 1);
  kills++;
  score += en.kind === "armor" ? 65 : (en.kind === "comet" ? 50 : 35);
  if (kills >= targetKills) {
    won = true;
    over = true;
    score += shields * 100;
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetKills = Math.max(10, Number(custom.targetKills || 30));
  maxShields = Math.max(1, Number(custom.shields || 3));
  shields = maxShields;
  kills = 0;
  spawned = 0;
  wave = 1;
  breathCharge = 0;
  boomCd = 0;
  flames = [];
  sparks = [];
  steam = [];
  bursts = [];
  enemies = [];
  aim = { x: 256, y: 180, down: false };
  spawnTimer = 0.4;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  const cdText = boomCd > 0 ? `${boomCd.toFixed(1)}s` : "Prêt";
  document.getElementById("stat").textContent =
    `🎯 ${kills}/${targetKills} • 🛡️ ${shields} • Vague ${wave}/3 • 💥 ${cdText}`;
  document.getElementById("btnBoom").style.opacity = boomCd > 0 ? "0.55" : "1";
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (SIZE / r.width), y: (e.clientY - r.top) * (SIZE / r.height) };
}

cv.addEventListener("contextmenu", (e) => { e.preventDefault(); });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  aim.x = p.x;
  aim.y = p.y;
  if (e.button === 2) {
    triggerExplosion(p.x, p.y);
    return;
  }
  aim.down = true;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  aim.x = p.x;
  aim.y = p.y;
});
cv.addEventListener("pointerup", () => { aim.down = false; });
cv.addEventListener("pointercancel", () => { aim.down = false; });

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    triggerExplosion(aim.x, aim.y);
  }
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    if (boomCd > 0) boomCd = Math.max(0, boomCd - dt);
    spawnTimer -= dt;
    if (spawnTimer <= 0 && spawned < targetKills && enemies.length < 7) {
      spawnEnemy();
      spawnTimer = Math.max(0.55, 1.35 - wave * 0.22);
    }

    // Continuous flamethrower jet (dUXf Main.as + fireTest.as) & periodic big FlameBreath (oD47)
    const dirAng = Math.atan2(aim.y - CORE_Y, aim.x - CORE_X);
    if (aim.down) {
      breathCharge += dt * 42;
      for (let i = 0; i < 3; i++) {
        const spread = (Math.random() - 0.5) * 0.22;
        const spd = 255 + Math.random() * 110;
        addFlameParticle(
          CORE_X + Math.cos(dirAng) * 14,
          CORE_Y + Math.sin(dirAng) * 14,
          Math.cos(dirAng + spread) * spd,
          Math.sin(dirAng + spread) * spd,
          6 + Math.random() * 5,
          0.62,
          false
        );
      }
      if (breathCharge >= 40) {
        breathCharge = 0;
        for (let i = 0; i < 10; i++) {
          const spread = (Math.random() - 0.5) * 0.45;
          const spd = 300 + Math.random() * 120;
          addFlameParticle(
            CORE_X, CORE_Y,
            Math.cos(dirAng + spread) * spd,
            Math.sin(dirAng + spread) * spd,
            11 + Math.random() * 6,
            0.78,
            true
          );
        }
      }
    } else {
      // Idle warm ember emission (fireTest.as)
      if (Math.random() < 0.45) {
        addFlameParticle(
          CORE_X + (Math.random() - 0.5) * 12,
          CORE_Y - 6,
          (Math.random() - 0.5) * 28,
          -45 - Math.random() * 45,
          4 + Math.random() * 3,
          0.45,
          false
        );
      }
    }

    // Update flames & check hits on enemies
    for (let i = flames.length - 1; i >= 0; i--) {
      const f = flames[i];
      f.life -= dt;
      f.vx += (Math.random() - 0.5) * 90 * dt;
      f.vy -= 40 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.r += dt * (f.isBig ? 14 : 7);

      let consumed = false;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const en = enemies[j];
        if (Math.hypot(f.x - en.x, f.y - en.y) < f.r + en.r) {
          en.hp -= (f.isBig ? 11 : 4.2);
          en.hitFlash = 0.6;
          if (Math.random() < 0.25) addSparks(f.x, f.y, 1);
          if (Math.random() < 0.22) addSteam(en.x, en.y - 6, 1);
          if (en.hp <= 0) destroyEnemy(j);
          consumed = true;
          break;
        }
      }
      if (consumed || f.life <= 0) flames.splice(i, 1);
    }

    // Update bouncing sparks with gravity + floor (2_3CoZ FlashTest.as)
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.px = sp.x; sp.py = sp.y;
      sp.vy += 380 * dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      if (sp.y > FLOOR_Y) {
        sp.y = FLOOR_Y;
        sp.vy = -Math.abs(sp.vy) * 0.58;
        sp.vx *= 0.84;
      }
      sp.life -= dt;
      if (sp.life <= 0) sparks.splice(i, 1);
    }

    // Update rising steam (sCuG.as / fgJ3.as)
    for (let i = steam.length - 1; i >= 0; i--) {
      const st = steam[i];
      st.x += st.vx * dt;
      st.y += st.vy * dt;
      st.r += dt * 10;
      st.life -= dt;
      if (st.life <= 0) steam.splice(i, 1);
    }

    // Update explosion bursts (6_n2UT Main04.as)
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life -= dt * 2.5;
      b.r += (b.maxR - b.r) * Math.min(1, dt * 11);
      if (b.life <= 0) bursts.splice(i, 1);
    }

    // Update descending targets
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      en.x += en.vx * dt;
      en.y += en.vy * dt;
      if (en.hitFlash > 0) en.hitFlash = Math.max(0, en.hitFlash - dt * 4);
      if (Math.hypot(en.x - CORE_X, en.y - CORE_Y) < en.r + 22 || en.y > FLOOR_Y) {
        enemies.splice(i, 1);
        shields--;
        addSteam(CORE_X, CORE_Y - 12, 8);
        if (shields <= 0) {
          won = false;
          over = true;
          break;
        }
        // If that was the last spawned enemy and none remain
        if (spawned >= targetKills && enemies.length === 0) {
          won = shields > 0;
          over = true;
          break;
        }
      }
    }

    if (!over && spawned >= targetKills && enemies.length === 0) {
      won = true;
      over = true;
      score += shields * 100;
    }
    updateHud();
  }

  // Draw background
  ctx.fillStyle = "#09080f";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Floor line
  ctx.strokeStyle = "rgba(251, 146, 60, 0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(SIZE, FLOOR_Y); ctx.stroke();

  // Rising steam
  for (const st of steam) {
    ctx.fillStyle = `rgba(186, 210, 235, ${Math.max(0, st.life * 0.25)})`;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Additive flame particles
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const f of flames) {
    const t = Math.max(0, f.life / f.maxLife);
    const col = f.isBig
      ? `rgba(255, ${Math.round(140 + t * 100)}, 40, ${t * 0.72})`
      : `rgba(255, ${Math.round(90 + t * 145)}, ${Math.round(t * 70)}, ${t * 0.65})`;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const sp of sparks) {
    ctx.strokeStyle = `rgba(253, 224, 71, ${Math.max(0, sp.life)})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(sp.px, sp.py);
    ctx.lineTo(sp.x, sp.y);
    ctx.stroke();
  }
  for (const b of bursts) {
    ctx.strokeStyle = `rgba(251, 146, 60, ${Math.max(0, b.life)})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(253, 224, 71, ${Math.max(0, b.life * 0.32)})`;
    ctx.fill();
  }
  ctx.restore();

  // Enemies
  for (const en of enemies) {
    ctx.save();
    ctx.translate(en.x, en.y);
    const baseCol = en.hitFlash > 0 ? "#ffffff" : (en.kind === "armor" ? "#a78bfa" : (en.kind === "comet" ? "#fde047" : "#38d6ff"));
    ctx.fillStyle = baseCol;
    ctx.strokeStyle = "#e6f4ff";
    ctx.lineWidth = 1.5;
    if (en.kind === "armor") {
      ctx.fillRect(-en.r, -en.r, en.r * 2, en.r * 2);
      ctx.strokeRect(-en.r, -en.r, en.r * 2, en.r * 2);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, en.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    // HP bar
    const hpW = en.r * 2;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(-en.r, -en.r - 8, hpW, 4);
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(-en.r, -en.r - 8, hpW * Math.max(0, en.hp / en.maxHp), 4);
    ctx.restore();
  }

  // Pyro emitter nozzle
  const aimAng = Math.atan2(aim.y - CORE_Y, aim.x - CORE_X);
  ctx.save();
  ctx.translate(CORE_X, CORE_Y);
  ctx.rotate(aimAng);
  ctx.fillStyle = "#334155";
  ctx.strokeStyle = "#fb923c";
  ctx.lineWidth = 2;
  ctx.fillRect(0, -7, 22, 14);
  ctx.strokeRect(0, -7, 22, 14);
  ctx.restore();

  ctx.fillStyle = "#fb923c";
  ctx.beginPath();
  ctx.arc(CORE_X, CORE_Y, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Aim reticle
  if (!over) {
    ctx.strokeStyle = boomCd <= 0 ? "rgba(253, 224, 71, 0.7)" : "rgba(148, 163, 184, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(aim.x, aim.y, 12, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "VAGUES CALCINÉES !" : "RÉACTEUR ÉTEINT", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${kills}/${targetKills} cibles • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
