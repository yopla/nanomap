<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Bobine Tesla (Tesla Arcs)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fde047; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #050814; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(253,224,71,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tesla_arcs",
  "name": "Bobine Tesla (Tesla Arcs)",
  "family": "topMouseHnS",
  "icon": "⚡",
  "controls": "Cliquer/taper sur une cible pour lancer un éclair en chaîne • Maintenir pour canaliser un rayon plasma + ralenti (bullet-time) et charger les 4 pylônes",
  "description": "Combine éclairs ramifiés (nrlM), décharge Perlin + bullet-time au maintien (miZT) et plasma continu (werJ) : protégez la bobine centrale et surchargez les 4 pylônes périphériques.",
  "goal": "Détruire 28 drones avant que 3 drones n'atteignent la bobine centrale.",
  "fields": [
    { "key": "targetKills", "label": "Drones à détruire", "type": "number", "default": 28 },
    { "key": "maxBreaches", "label": "Brèches max", "type": "number", "default": 3 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">⚡ Tesla Arcs</span>
  <span id="stat">⚡ 0/28 • ❤️ 3 • 🔋 100%</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic rapide</b> : éclair ramifié en chaîne • <b>Maintenir</b> : arc plasma + bullet-time (ralenti) et charge des pylônes
</div>

<script>
const GAME_ID = "tesla_arcs";
const SIZE = 512;
const CX = 256, CY = 256;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetKills = 28, maxBreaches = 3;
let kills = 0, spawned = 0, breaches = 0;
let energy = 100;
let drones = [];
let pylons = [];
let bolts = [];
let plasmaSparks = [];
let aim = { x: 256, y: 120, down: false };
let spawnTimer = 0, beamTick = 0, score = 0, won = false, over = false;
let noisePhase = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

// Jagged lightning generator inspired by nrlM.as + miZT.as
function makeBoltPoints(x1, y1, x2, y2, jag) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  const segs = Math.max(6, Math.min(26, Math.floor(dist / 16)));
  const nx = dist > 0 ? -dy / dist : 0;
  const ny = dist > 0 ? dx / dist : 0;
  const pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const env = Math.sin(t * Math.PI);
    const offset = (Math.sin(i * 2.3 + noisePhase) * 0.5 + (Math.random() - 0.5)) * jag * env;
    pts.push({
      x: x1 + dx * t + nx * offset,
      y: y1 + dy * t + ny * offset
    });
  }
  pts.push({ x: x2, y: y2 });
  return pts;
}

function addBolt(x1, y1, x2, y2, color, width, jag, life) {
  bolts.push({
    pts: makeBoltPoints(x1, y1, x2, y2, jag),
    color, width, life, maxLife: life
  });
}

function addPlasmaSparks(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    if (plasmaSparks.length > 140) plasmaSparks.shift();
    const a = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 140;
    plasmaSparks.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 0.38 + Math.random() * 0.25, color });
  }
}

function spawnDrone() {
  if (spawned >= targetKills) return;
  spawned++;
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * SIZE; y = -16; }
  else if (edge === 1) { x = SIZE + 16; y = Math.random() * SIZE; }
  else if (edge === 2) { x = Math.random() * SIZE; y = SIZE + 16; }
  else { x = -16; y = Math.random() * SIZE; }

  const ang = Math.atan2(CY - y, CX - x);
  const fast = spawned > 10 && Math.random() < 0.35;
  const armored = spawned > 16 && Math.random() < 0.28;
  const spd = fast ? 92 : (armored ? 44 : 58 + spawned * 0.8);
  const hp = armored ? 3 : 1;
  drones.push({
    x, y,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    r: armored ? 16 : (fast ? 10 : 12),
    hp, maxHp: hp,
    fast, armored,
    phase: Math.random() * 6.28
  });
}

function destroyDrone(idx) {
  const d = drones[idx];
  addPlasmaSparks(d.x, d.y, 12, d.armored ? "#fde047" : "#38d6ff");
  drones.splice(idx, 1);
  kills++;
  score += d.armored ? 70 : (d.fast ? 50 : 35);
  if (kills >= targetKills) {
    won = true;
    over = true;
    score += (maxBreaches - breaches) * 120;
  }
}

function fireClickLightning(tx, ty) {
  if (over) return;
  addBolt(CX, CY, tx, ty, "#fde047", 3, 24, 0.22);
  addPlasmaSparks(tx, ty, 8, "#fde047");

  // Find closest drone to click or along line
  let primaryIdx = -1;
  let bestD = 54;
  for (let i = 0; i < drones.length; i++) {
    const d = Math.hypot(drones[i].x - tx, drones[i].y - ty);
    if (d < bestD) { bestD = d; primaryIdx = i; }
  }
  if (primaryIdx >= 0) {
    const first = drones[primaryIdx];
    addBolt(tx, ty, first.x, first.y, "#67e8f9", 2.4, 16, 0.22);
    // Chain lightning up to 2 nearby drones
    const targets = [first];
    for (const d of drones) {
      if (d !== first && Math.hypot(d.x - first.x, d.y - first.y) < 110 && targets.length < 3) {
        targets.push(d);
        addBolt(first.x, first.y, d.x, d.y, "#67e8f9", 2, 14, 0.2);
      }
    }
    for (const t of targets) {
      t.hp -= 1;
      addPlasmaSparks(t.x, t.y, 6, "#67e8f9");
    }
    for (let i = drones.length - 1; i >= 0; i--) {
      if (drones[i].hp <= 0) destroyDrone(i);
    }
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetKills = Math.max(8, Number(custom.targetKills || 28));
  maxBreaches = Math.max(1, Number(custom.maxBreaches || 3));
  kills = 0;
  spawned = 0;
  breaches = 0;
  energy = 100;
  drones = [];
  bolts = [];
  plasmaSparks = [];
  pylons = [
    { x: 90, y: 90, charge: 0 },
    { x: 422, y: 90, charge: 0 },
    { x: 422, y: 422, charge: 0 },
    { x: 90, y: 422, charge: 0 }
  ];
  aim = { x: 256, y: 120, down: false };
  spawnTimer = 0.5;
  beamTick = 0;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  const lives = Math.max(0, maxBreaches - breaches);
  const slowTag = (aim.down && energy > 2) ? " • SLOW" : "";
  document.getElementById("stat").textContent =
    `⚡ ${kills}/${targetKills} • ❤️ ${lives} • 🔋 ${Math.round(energy)}%${slowTag}`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (SIZE / r.width), y: (e.clientY - r.top) * (SIZE / r.height) };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  aim.x = p.x;
  aim.y = p.y;
  aim.down = true;
  fireClickLightning(p.x, p.y);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  aim.x = p.x;
  aim.y = p.y;
});
cv.addEventListener("pointerup", () => { aim.down = false; });
cv.addEventListener("pointercancel", () => { aim.down = false; });

// Distance from point P to segment AB
function distToSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const len2 = vx * vx + vy * vy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / len2));
  return Math.hypot(px - (ax + t * vx), py - (ay + t * vy));
}

let lastT = performance.now();
function loop(now) {
  const rawDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  const slowActive = !over && aim.down && energy > 1;
  const worldDt = slowActive ? rawDt * 0.38 : rawDt; // Bullet-time from miZT.as

  if (!over) {
    noisePhase += rawDt * (slowActive ? 6 : 22);
    if (slowActive) {
      energy = Math.max(0, energy - rawDt * 24);
      beamTick += rawDt;
      if (beamTick >= 0.065) {
        beamTick = 0;
        addBolt(CX, CY, aim.x, aim.y, "#38d6ff", 2.8, 18, 0.11);
        addPlasmaSparks(aim.x, aim.y, 2, "#67e8f9");
        // Continuous plasma damages drones along the beam
        for (let i = drones.length - 1; i >= 0; i--) {
          const d = drones[i];
          if (distToSeg(d.x, d.y, CX, CY, aim.x, aim.y) < d.r + 12) {
            d.hp -= 0.45;
            if (d.hp <= 0) destroyDrone(i);
          }
        }
        // Charge perimeter pylons when aimed at them -> discharges nova shock
        for (const py of pylons) {
          if (Math.hypot(aim.x - py.x, aim.y - py.y) < 34) {
            py.charge += 18;
            if (py.charge >= 100) {
              py.charge = 0;
              score += 80;
              addPlasmaSparks(py.x, py.y, 18, "#fde047");
              for (let i = drones.length - 1; i >= 0; i--) {
                const d = drones[i];
                if (Math.hypot(d.x - py.x, d.y - py.y) < 150) {
                  addBolt(py.x, py.y, d.x, d.y, "#fde047", 2.6, 16, 0.25);
                  d.hp -= 3;
                  if (d.hp <= 0) destroyDrone(i);
                }
              }
            }
          }
        }
      }
    } else {
      energy = Math.min(100, energy + rawDt * 28);
    }

    spawnTimer -= worldDt;
    if (spawnTimer <= 0 && spawned < targetKills && drones.length < 8) {
      spawnDrone();
      spawnTimer = Math.max(0.5, 1.35 - kills * 0.024);
    }

    for (let i = drones.length - 1; i >= 0; i--) {
      const d = drones[i];
      d.phase += worldDt * 6;
      const perpX = -d.vy * 0.18, perpY = d.vx * 0.18;
      const sway = d.fast ? Math.sin(d.phase) : 0;
      d.x += (d.vx + perpX * sway) * worldDt;
      d.y += (d.vy + perpY * sway) * worldDt;

      if (Math.hypot(d.x - CX, d.y - CY) < d.r + 22) {
        addPlasmaSparks(d.x, d.y, 14, "#f87171");
        drones.splice(i, 1);
        breaches++;
        if (breaches >= maxBreaches) {
          won = false;
          over = true;
          break;
        }
        if (spawned >= targetKills && drones.length === 0) {
          won = breaches < maxBreaches;
          over = true;
          score += (maxBreaches - breaches) * 120;
          break;
        }
      }
    }

    if (!over && spawned >= targetKills && drones.length === 0) {
      won = true;
      over = true;
      score += (maxBreaches - breaches) * 120;
    }
    updateHud();
  }

  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].life -= rawDt;
    if (bolts[i].life <= 0) bolts.splice(i, 1);
  }
  for (let i = plasmaSparks.length - 1; i >= 0; i--) {
    const sp = plasmaSparks[i];
    sp.x += sp.vx * rawDt;
    sp.y += sp.vy * rawDt;
    sp.vx *= 0.94;
    sp.vy *= 0.94;
    sp.life -= rawDt;
    if (sp.life <= 0) plasmaSparks.splice(i, 1);
  }

  // Draw with fading persistence trail
  ctx.fillStyle = slowActive ? "rgba(6, 14, 34, 0.34)" : "rgba(5, 8, 20, 0.42)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Arena rings
  ctx.strokeStyle = slowActive ? "rgba(56, 214, 255, 0.22)" : "rgba(56, 214, 255, 0.1)";
  ctx.lineWidth = 1;
  for (const r of [80, 160, 230]) {
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
  }

  // Perimeter pylons
  for (const py of pylons) {
    ctx.save();
    ctx.translate(py.x, py.y);
    ctx.fillStyle = "rgba(253, 224, 71, 0.12)";
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 14, -Math.PI / 2, -Math.PI / 2 + (py.charge / 100) * Math.PI * 2); ctx.stroke();
    ctx.fillStyle = py.charge > 0 ? "#fde047" : "#475569";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Drones
  for (const d of drones) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.fillStyle = d.armored ? "#a78bfa" : (d.fast ? "#fb923c" : "#f87171");
    ctx.strokeStyle = "#fee2e2";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, d.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (d.maxHp > 1) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(Math.ceil(d.hp)), 0, 0);
    }
    ctx.restore();
  }

  // Additive lightning + plasma sparks
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const b of bolts) {
    const a = Math.max(0, b.life / b.maxLife);
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = b.width * 2.2;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x, b.pts[0].y);
    for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(1, b.width * 0.7);
    ctx.stroke();
  }
  for (const sp of plasmaSparks) {
    ctx.globalAlpha = Math.max(0, sp.life * 2);
    ctx.fillStyle = sp.color;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // Central Tesla coil
  ctx.fillStyle = slowActive ? "#38d6ff" : "#fde047";
  ctx.beginPath();
  ctx.arc(CX, CY, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "BOBINE SÉCURISÉE !" : "SURCHARGE FATALE", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${kills}/${targetKills} drones • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
