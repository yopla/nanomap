<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Cellule Collante (Katamari Glue)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #4ade80; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #080d19; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(74,222,128,0.14); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "katamari_glue",
  "name": "Cellule Collante (Katamari Glue)",
  "family": "zooEcosys",
  "icon": "🟢",
  "controls": "Pointeur/glisser ou Flèches/ZQSD pour piloter la cellule • Clic ou Espace pour muter entre Cercle et Carré élastique",
  "description": "Fusion de KatamaruOrNot, d'agrégation DLA (fEJs/tte2) et d'enveloppe molle (rbLp) : déplacez votre cellule élastique pour coller des spores dérivantes en branches organiques tout en évitant les mines rouges.",
  "goal": "Agréger 60 spores avant la fin des 60 secondes.",
  "fields": [
    { "key": "targetCount", "label": "Spores à agréger", "type": "number", "default": 60 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🟢 Katamari Glue</span>
  <span id="stat">🧬 0/60 • Forme: Cercle • 60s</span>
  <div class="bar-btns">
    <button onclick="toggleMorph()" title="Basculer Cercle / Carré (Espace)">⬡ Forme</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : diriger la cellule • <b>Espace / Double-clic</b> : muter ○ / □ (changement d'enveloppe) • Évitez les mines rouges !
</div>

<script>
const GAME_ID = "katamari_glue";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetCount = 60, durationSec = 60;
let core = { x: 256, y: 256, vx: 0, vy: 0, r: 24 };
let shapeMode = 0; // 0: circle, 1: square (rbLp)
const RING_N = 64;
let ringPts = [];
let stuck = [];   // DLA cluster offsets { dx, dy, r, color, pulse }
let freeSpores = [];
let mines = [];
let shockwaves = [];
let keys = {};
let pointer = { active: false, x: 256, y: 256 };
let lastTapTime = 0;
let timeLeft = 60, score = 0, won = false, over = false, wobble = 0, hitCooldown = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function baseOutlinePoint(i, radius, mode) {
  const t = i / RING_N;
  if (mode === 0) {
    const a = t * Math.PI * 2;
    return { x: Math.cos(a) * radius, y: Math.sin(a) * radius };
  }
  // Square outline from rbLp.as
  const q = Math.floor(t * 4);
  const f = (t * 4) - q;
  const h = radius * 0.92;
  if (q === 0) return { x: h, y: -h + f * 2 * h };
  if (q === 1) return { x: h - f * 2 * h, y: h };
  if (q === 2) return { x: -h, y: h - f * 2 * h };
  return { x: -h + f * 2 * h, y: -h };
}

function toggleMorph() {
  if (over) return;
  shapeMode = 1 - shapeMode;
  wobble = Math.max(wobble, 14);
  shockwaves.push({ x: core.x, y: core.y, r: core.r, maxR: core.r + 36, life: 1, color: "#38d6ff" });
}

function spawnSpore(fromEdge) {
  let x, y;
  if (fromEdge) {
    if (Math.random() < 0.5) {
      x = Math.random() * SIZE;
      y = Math.random() < 0.5 ? 8 : SIZE - 8;
    } else {
      x = Math.random() < 0.5 ? 8 : SIZE - 8;
      y = Math.random() * SIZE;
    }
  } else {
    do {
      x = 24 + Math.random() * (SIZE - 48);
      y = 24 + Math.random() * (SIZE - 48);
    } while (Math.hypot(x - core.x, y - core.y) < 70);
  }
  const palette = ["#22d3ee", "#4ade80", "#67e8f9", "#a3e635"];
  freeSpores.push({
    x, y,
    vx: (Math.random() - 0.5) * 44,
    vy: (Math.random() - 0.5) * 44,
    r: 4.5 + Math.random() * 2.5,
    color: palette[Math.floor(Math.random() * palette.length)]
  });
}

function spawnMine() {
  let x, y;
  do {
    x = 30 + Math.random() * (SIZE - 60);
    y = 30 + Math.random() * (SIZE - 60);
  } while (Math.hypot(x - core.x, y - core.y) < 130);
  const a = Math.random() * Math.PI * 2;
  const spd = 48 + Math.random() * 34;
  mines.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 11, phase: Math.random() * 6.28 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetCount = Math.max(15, Number(custom.targetCount || 60));
  durationSec = Math.max(20, Number(custom.durationSec || 60));
  core = { x: 256, y: 256, vx: 0, vy: 0, r: 24 };
  shapeMode = 0;
  ringPts = [];
  for (let i = 0; i < RING_N; i++) {
    const p = baseOutlinePoint(i, core.r, shapeMode);
    ringPts.push({ x: p.x, y: p.y, vx: 0, vy: 0 });
  }
  stuck = [];
  freeSpores = [];
  mines = [];
  shockwaves = [];
  for (let i = 0; i < 42; i++) spawnSpore(false);
  for (let i = 0; i < 5; i++) spawnMine();
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  wobble = 0;
  hitCooldown = 0;
  updateHud();
}

function updateHud() {
  const formLabel = shapeMode === 0 ? "Cercle" : "Carré";
  document.getElementById("stat").textContent =
    `🧬 ${stuck.length}/${targetCount} • ${formLabel} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (SIZE / r.width), y: (e.clientY - r.top) * (SIZE / r.height) };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const now = performance.now();
  if (now - lastTapTime < 280) toggleMorph();
  lastTapTime = now;
  const p = getPos(e);
  pointer.active = true;
  pointer.x = p.x;
  pointer.y = p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (!pointer.active) return;
  const p = getPos(e);
  pointer.x = p.x;
  pointer.y = p.y;
});
cv.addEventListener("pointerup", () => { pointer.active = false; });
cv.addEventListener("pointercancel", () => { pointer.active = false; });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) toggleMorph();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function deformRingImpulse(ix, iy, strength) {
  for (let i = 0; i < RING_N; i++) {
    const pt = ringPts[i];
    const d = Math.hypot((core.x + pt.x) - ix, (core.y + pt.y) - iy);
    if (d < 52) {
      const push = (1 - d / 52) * strength;
      const a = Math.atan2((core.y + pt.y) - iy, (core.x + pt.x) - ix);
      pt.x += Math.cos(a) * push;
      pt.y += Math.sin(a) * push;
    }
  }
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (hitCooldown > 0) hitCooldown -= dt;
    if (wobble > 0) wobble = Math.max(0, wobble - dt * 24);

    // Steering from keyboard + pointer (Katamari inertia from bzcU.as)
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      core.vx += (ax / m) * 560 * dt;
      core.vy += (ay / m) * 560 * dt;
    } else if (pointer.active) {
      const dx = pointer.x - core.x;
      const dy = pointer.y - core.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 6) {
        const force = Math.min(1, dist / 90) * 640;
        core.vx += (dx / dist) * force * dt;
        core.vy += (dy / dist) * force * dt;
      }
    }

    core.vx *= Math.pow(0.06, dt);
    core.vy *= Math.pow(0.06, dt);
    core.x += core.vx * dt;
    core.y += core.vy * dt;

    const boundPad = 24;
    if (core.x < boundPad) { core.x = boundPad; core.vx = Math.abs(core.vx) * 0.65; deformRingImpulse(0, core.y, 12); }
    if (core.x > SIZE - boundPad) { core.x = SIZE - boundPad; core.vx = -Math.abs(core.vx) * 0.65; deformRingImpulse(SIZE, core.y, 12); }
    if (core.y < boundPad) { core.y = boundPad; core.vy = Math.abs(core.vy) * 0.65; deformRingImpulse(core.x, 0, 12); }
    if (core.y > SIZE - boundPad) { core.y = SIZE - boundPad; core.vy = -Math.abs(core.vy) * 0.65; deformRingImpulse(core.x, SIZE, 12); }

    // Update soft-body contour points (rbLp.as spring interpolation + speed squash)
    const speed = Math.hypot(core.vx, core.vy);
    const dynamicR = core.r + Math.min(12, stuck.length * 0.14);
    for (let i = 0; i < RING_N; i++) {
      const target = baseOutlinePoint(i, dynamicR, shapeMode);
      const wave = wobble > 0 ? Math.sin(i * 0.55 + now * 0.025) * wobble : 0;
      const a = Math.atan2(target.y, target.x);
      const tx = target.x + Math.cos(a) * wave - core.vx * 0.028;
      const ty = target.y + Math.sin(a) * wave - core.vy * 0.028;
      ringPts[i].x += (tx - ringPts[i].x) * Math.min(1, dt * 11);
      ringPts[i].y += (ty - ringPts[i].y) * Math.min(1, dt * 11);
    }

    // Update free spores with Brownian drift + DLA sticking (fEJs.as / tte2.as)
    for (let i = freeSpores.length - 1; i >= 0; i--) {
      const s = freeSpores[i];
      s.vx += (Math.random() - 0.5) * 180 * dt;
      s.vy += (Math.random() - 0.5) * 180 * dt;
      s.vx *= Math.pow(0.45, dt);
      s.vy *= Math.pow(0.45, dt);
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 0) s.x += SIZE; if (s.x > SIZE) s.x -= SIZE;
      if (s.y < 0) s.y += SIZE; if (s.y > SIZE) s.y -= SIZE;

      // Check contact against core or any already-stuck DLA spore
      let hit = false;
      const dxC = s.x - core.x, dyC = s.y - core.y;
      const coreReach = shapeMode === 0
        ? (dynamicR + s.r)
        : (dynamicR * 1.08 + s.r);
      if (Math.hypot(dxC, dyC) <= coreReach) {
        hit = true;
      } else {
        for (let j = 0; j < stuck.length; j++) {
          const st = stuck[j];
          const sx = core.x + st.dx, sy = core.y + st.dy;
          if (Math.hypot(s.x - sx, s.y - sy) <= st.r + s.r + 3.5) {
            hit = true;
            break;
          }
        }
      }

      if (hit) {
        const ang = Math.atan2(s.y - core.y, s.x - core.x);
        const rawDist = Math.hypot(s.x - core.x, s.y - core.y);
        const clampedDist = Math.min(rawDist, 108);
        stuck.push({
          dx: Math.cos(ang) * clampedDist,
          dy: Math.sin(ang) * clampedDist,
          r: s.r,
          color: s.color,
          pulse: 1
        });
        deformRingImpulse(s.x, s.y, 7);
        shockwaves.push({ x: s.x, y: s.y, r: 4, maxR: 22, life: 1, color: s.color });
        freeSpores.splice(i, 1);
        spawnSpore(true);
        score += 20;
        if (stuck.length >= targetCount) {
          won = true;
          over = true;
          score += Math.round(timeLeft * 15);
          break;
        }
      }
    }

    // Update mines
    for (const m of mines) {
      m.phase += dt * 4;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x < m.r + 6) { m.x = m.r + 6; m.vx = Math.abs(m.vx); }
      if (m.x > SIZE - m.r - 6) { m.x = SIZE - m.r - 6; m.vx = -Math.abs(m.vx); }
      if (m.y < m.r + 6) { m.y = m.r + 6; m.vy = Math.abs(m.vy); }
      if (m.y > SIZE - m.r - 6) { m.y = SIZE - m.r - 6; m.vy = -Math.abs(m.vy); }

      if (hitCooldown <= 0) {
        let mineHit = Math.hypot(m.x - core.x, m.y - core.y) < dynamicR + m.r - 2;
        if (!mineHit) {
          for (let j = 0; j < stuck.length; j++) {
            const st = stuck[j];
            if (Math.hypot(m.x - (core.x + st.dx), m.y - (core.y + st.dy)) < st.r + m.r) {
              mineHit = true;
              break;
            }
          }
        }
        if (mineHit) {
          hitCooldown = 0.85;
          wobble = 18;
          deformRingImpulse(m.x, m.y, 20);
          const knockAng = Math.atan2(core.y - m.y, core.x - m.x);
          core.vx += Math.cos(knockAng) * 260;
          core.vy += Math.sin(knockAng) * 260;
          const drop = Math.min(5, stuck.length);
          for (let d = 0; d < drop; d++) {
            const lost = stuck.pop();
            freeSpores.push({
              x: core.x + lost.dx,
              y: core.y + lost.dy,
              vx: (Math.random() - 0.5) * 140,
              vy: (Math.random() - 0.5) * 140,
              r: lost.r,
              color: lost.color
            });
          }
          shockwaves.push({ x: m.x, y: m.y, r: 8, maxR: 54, life: 1, color: "#f87171" });
          score = Math.max(0, score - 30);
        }
      }
    }

    if (timeLeft <= 0 && !over) {
      won = stuck.length >= targetCount;
      over = true;
    }
    updateHud();
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt * 2.8;
    sw.r += (sw.maxR - sw.r) * Math.min(1, dt * 10);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }

  // Draw
  ctx.fillStyle = "#080d19";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Subtle bio-grid
  ctx.strokeStyle = "rgba(56, 214, 255, 0.06)";
  ctx.lineWidth = 1;
  for (let g = 32; g < SIZE; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(SIZE, g); ctx.stroke();
  }

  // Pointer target indicator
  if (pointer.active && !over) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(core.x, core.y);
    ctx.lineTo(pointer.x, pointer.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, 10, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Free spores
  for (const s of freeSpores) {
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // DLA stuck branch connectors & nodes
  ctx.strokeStyle = "rgba(74, 222, 128, 0.32)";
  ctx.lineWidth = 2;
  for (const st of stuck) {
    if (st.pulse > 0) st.pulse = Math.max(0, st.pulse - dt * 3);
    const sx = core.x + st.dx, sy = core.y + st.dy;
    ctx.fillStyle = st.color;
    ctx.beginPath();
    ctx.arc(sx, sy, st.r + st.pulse * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Soft-body morphing cell (rbLp.as)
  ctx.save();
  ctx.translate(core.x, core.y);
  const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, core.r + 14);
  grad.addColorStop(0, hitCooldown > 0 ? "#fca5a5" : "#bbf7d0");
  grad.addColorStop(0.55, hitCooldown > 0 ? "#ef4444" : "#22c55e");
  grad.addColorStop(1, "rgba(16, 185, 129, 0.72)");
  ctx.fillStyle = grad;
  ctx.strokeStyle = hitCooldown > 0 ? "#f87171" : "#38d6ff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(ringPts[0].x, ringPts[0].y);
  for (let i = 1; i < RING_N; i++) ctx.lineTo(ringPts[i].x, ringPts[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Inner nucleus
  ctx.fillStyle = "#e6f4ff";
  ctx.beginPath();
  ctx.arc(core.vx * 0.015, core.vy * 0.015, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Mines
  for (const m of mines) {
    const pulse = 1 + Math.sin(m.phase) * 0.15;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = "rgba(239, 68, 68, 0.22)";
    ctx.beginPath();
    ctx.arc(0, 0, m.r * 1.6 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fecaca";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 + m.phase * 0.3;
      const rad = k % 2 === 0 ? m.r * 1.15 : m.r * 0.68;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Shockwaves
  for (const sw of shockwaves) {
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = Math.max(0, sw.life);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "COLONIE COMPLÈTE !" : "TEMPS ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${stuck.length}/${targetCount} spores • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
