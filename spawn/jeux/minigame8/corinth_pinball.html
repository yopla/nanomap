<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pachinko / Flipper Musical (Corinth Pinball)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "corinth_pinball",
  "name": "Pachinko / Flipper Musical (Corinth Pinball)",
  "family": "core",
  "icon": "🎱",
  "controls": "Tirer/glisser sur le plateau puis relâcher pour lancer la bille en slingshot • Flèches / Q-D pour incliner la table (nudge) ou Espace pour lancer",
  "description": "Adapté de 7X6w.as (Corinth Game / SiON pentatonique) : lancez votre bille depuis le canon haut-droit dans un plateau de bumpers circulaires ; chaque rebond émet une note pentatonique Web Audio, une onde d'impact et des points proportionnels à la vélocité.",
  "goal": "Atteindre 2500 points en moins de 10 billes et 70 secondes.",
  "fields": [
    { "key": "targetScore", "label": "Score objectif", "type": "number", "default": 2500 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 70 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎱 Flipper Corinth</span>
  <span id="stat">Score 0/2500 • Billes 10 • 70s</span>
  <div class="bar-btns">
    <button id="muteBtn" onclick="toggleMute()" title="Son Web Audio">🔊</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser et relâcher</b> : viser et tirer la bille • Chaque rebond joue une note pentatonique et marque selon l'impact
</div>

<script>
const GAME_ID = "corinth_pinball";
const SIZE = 512;
const LAUNCHER = { x: 432, y: 74 };
const PENTATONIC = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25, 698.46];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const BUMPERS = [
  { x: 158, y: 165, r: 30, flash: 0 },
  { x: 325, y: 165, r: 30, flash: 0 },
  { x: 158, y: 315, r: 30, flash: 0 },
  { x: 325, y: 315, r: 30, flash: 0 },
  { x: 84, y: 240, r: 16, flash: 0 },
  { x: 400, y: 240, r: 16, flash: 0 },
  { x: 84, y: 392, r: 16, flash: 0 },
  { x: 242, y: 242, r: 22, flash: 0 },
  { x: 242, y: 392, r: 18, flash: 0 },
  { x: 400, y: 392, r: 16, flash: 0 }
];
const POCKETS = [
  { x: 80, w: 80, pts: 250, col: "#4ade80" },
  { x: 216, w: 80, pts: 400, col: "#facc15" },
  { x: 352, w: 80, pts: 250, col: "#4ade80" }
];

let targetScore = 2500, durationSec = 70;
let ball = null, ballsLeft = 10;
let aiming = false, aimPt = { x: 432, y: 74 };
let ripples = [];
let keys = {};
let timeLeft = 70, score = 0, won = false, over = false;
let audioCtx = null, muted = false;

function initAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) {}
  } else if (audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
}
function playNote(idx, vel) {
  if (muted || !audioCtx) return;
  try {
    const freq = PENTATONIC[idx % PENTATONIC.length];
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(Math.min(0.22, 0.06 + vel * 0.015), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
}

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function launchBall(dx, dy) {
  if (over || ball || ballsLeft <= 0) return;
  initAudio();
  const len = Math.hypot(dx, dy) || 1;
  const spd = Math.min(13.5, Math.max(6.5, len * 0.09));
  ball = {
    x: LAUNCHER.x,
    y: LAUNCHER.y,
    vx: -(dx / len) * spd,
    vy: -(dy / len) * spd,
    r: 11
  };
  ballsLeft--;
  playNote(0, 5);
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetScore = Math.max(500, Number(custom.targetScore || 2500));
  durationSec = Math.max(20, Number(custom.durationSec || 70));
  ball = null;
  ballsLeft = 10;
  aiming = false;
  aimPt = { x: LAUNCHER.x + 40, y: LAUNCHER.y + 40 };
  ripples = [];
  for (const b of BUMPERS) b.flash = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Score ${score}/${targetScore} • Billes ${ballsLeft} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  initAudio();
  const p = getPos(e);
  aimPt = p;
  if (!ball) aiming = true;
});
cv.addEventListener("pointermove", (e) => {
  aimPt = getPos(e);
});
window.addEventListener("pointerup", () => {
  if (aiming && !ball && !over) {
    launchBall(aimPt.x - LAUNCHER.x, aimPt.y - LAUNCHER.y);
  }
  aiming = false;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat && !ball && !over) {
    launchBall(60 + Math.random() * 40, -10 + Math.random() * 50);
  }
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);

    if (ball) {
      // Gravity & keyboard nudge
      ball.vy += 0.22;
      if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ball.vx -= 0.08;
      if (keys.ArrowRight || keys.KeyD) ball.vx += 0.08;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Walls (7X6w cabinet)
      if (ball.x < 16 + ball.r) { ball.x = 16 + ball.r; ball.vx = Math.abs(ball.vx) * 0.85; }
      if (ball.x > SIZE - 16 - ball.r) { ball.x = SIZE - 16 - ball.r; ball.vx = -Math.abs(ball.vx) * 0.85; }
      if (ball.y < 16 + ball.r) { ball.y = 16 + ball.r; ball.vy = Math.abs(ball.vy) * 0.85; }

      // Bumper collisions (7X6w QuickContacts velocity score + impact circle + SiON note)
      for (let i = 0; i < BUMPERS.length; i++) {
        const bp = BUMPERS[i];
        if (bp.flash > 0) bp.flash = Math.max(0, bp.flash - 4 * dt);
        const dx = ball.x - bp.x, dy = ball.y - bp.y;
        const dist = Math.hypot(dx, dy);
        const minD = ball.r + bp.r;
        if (dist < minD && dist > 0.001) {
          const nx = dx / dist, ny = dy / dist;
          ball.x = bp.x + nx * minD;
          ball.y = bp.y + ny * minD;
          const vn = ball.vx * nx + ball.vy * ny;
          if (vn < 0) {
            ball.vx -= 1.92 * vn * nx;
            ball.vy -= 1.92 * vn * ny;
            // slight bumper kick
            ball.vx += nx * 1.1;
            ball.vy += ny * 1.1;
            const spd = Math.hypot(ball.vx, ball.vy);
            const pts = Math.round(25 + spd * 8);
            score += pts;
            bp.flash = 1;
            playNote(i, spd);
            ripples.push({ x: ball.x, y: ball.y, r: 8, life: 1, col: "#facc15" });
          }
        }
      }

      // Bottom pockets
      if (ball.y >= SIZE - 28) {
        for (const pk of POCKETS) {
          if (ball.x >= pk.x && ball.x <= pk.x + pk.w) {
            score += pk.pts;
            playNote(7, 10);
            ripples.push({ x: ball.x, y: SIZE - 28, r: 10, life: 1, col: pk.col });
            break;
          }
        }
        ball = null;
      }
    } else {
      for (const bp of BUMPERS) if (bp.flash > 0) bp.flash = Math.max(0, bp.flash - 4 * dt);
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 65 * dt;
      ripples[i].life -= 2.5 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (score >= targetScore) {
      won = true; over = true;
      score += ballsLeft * 100 + Math.round(timeLeft * 15);
    } else if ((!ball && ballsLeft <= 0) || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Cabinet border
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 4;
  ctx.strokeRect(14, 14, SIZE - 28, SIZE - 14);

  // Pockets
  for (const pk of POCKETS) {
    ctx.fillStyle = "rgba(74,222,128,0.16)";
    ctx.strokeStyle = pk.col;
    ctx.lineWidth = 2;
    ctx.fillRect(pk.x, SIZE - 34, pk.w, 26);
    ctx.strokeRect(pk.x, SIZE - 34, pk.w, 26);
    ctx.fillStyle = pk.col;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("+" + pk.pts, pk.x + pk.w / 2, SIZE - 17);
  }

  // Launcher hub
  ctx.fillStyle = "rgba(56,214,255,0.2)";
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(LAUNCHER.x, LAUNCHER.y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Slingshot aim line (7X6w)
  if (aiming && !ball && !over) {
    ctx.strokeStyle = "rgba(248, 113, 113, 0.85)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(aimPt.x, aimPt.y);
    ctx.lineTo(LAUNCHER.x, LAUNCHER.y);
    ctx.stroke();
  }

  // Bumpers
  for (const bp of BUMPERS) {
    ctx.fillStyle = bp.flash > 0 ? `rgba(250, 204, 21, ${0.35 + bp.flash * 0.55})` : "#162642";
    ctx.strokeStyle = bp.flash > 0 ? "#fef08a" : "#38d6ff";
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Ball
  if (ball) {
    ctx.fillStyle = "#f472b6";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "JACKPOT CORINTH !" : (ballsLeft <= 0 ? "PLUS DE BILLES !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score}/${targetScore}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
