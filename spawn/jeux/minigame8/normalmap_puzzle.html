<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Puzzle Normal-Map (Normal-Map Currents)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "normalmap_puzzle",
  "name": "Puzzle Normal-Map (Normal-Map Currents)",
  "family": "tactical",
  "icon": "🎨",
  "controls": "Glisser pour peindre des courants directionnels sur la normal-map • Espace ou bouton 🧹 pour réinitialiser la carte • ZQSD déplace le pinceau",
  "description": "Fusion de tXS7.as, 8kSm.as, eRhl.as et a3ds-drawer-canon : chaque coup de pinceau encode un vecteur 3D (RGB) dans la normal-map qui propulse et dévie les billes Blanches vers la zone Gauche et les billes Noires vers la zone Droite sur 3 plateaux.",
  "goal": "Trier toutes les billes blanches à gauche et noires à droite sur les 3 manches en moins de 70 secondes (max 4 erreurs de camp).",
  "fields": [
    { "key": "targetWaves", "label": "Manches", "type": "number", "default": 3 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 70 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎨 Normal-Map</span>
  <span id="stat">Manche 1/3 • Reste 0 • Erreurs 0/4 • 70s</span>
  <div class="bar-btns">
    <button onclick="clearNormalMap()" title="Effacer les traits (Espace)">🧹 Effacer</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser</b> : peindre un courant directionnel • <b>Billes Blanches ⚪ → Gauche</b> | <b>Billes Noires ⚫ → Droite</b> • <b>Espace</b> : nettoyer
</div>

<script>
const GAME_ID = "normalmap_puzzle";
const SIZE = 512;
const GOAL_W = 86;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Offscreen normal-map buffer (128x128 for fast getImageData/fillRect)
const N_RES = 128;
const N_SCALE = SIZE / N_RES;
const nCv = document.createElement("canvas");
nCv.width = N_RES;
nCv.height = N_RES;
const nCtx = nCv.getContext("2d", { willReadFrequently: true });
let nData = null;

let targetWaves = 3, durationSec = 70;
let wave = 1, balls = [], trails = [], errors = 0;
let ptr = { x: 256, y: 256, px: 256, py: 256, down: false };
let keys = {};
let timeLeft = 70, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function vecToColor(vx, vy, vz) {
  const len = Math.hypot(vx, vy, vz) || 1;
  const r = Math.round(127 + 127 * (vx / len));
  const g = Math.round(127 + 127 * (vy / len));
  const b = Math.round(127 + 127 * (vz / len));
  return `rgb(${r},${g},${b})`;
}

function clearNormalMap() {
  nCtx.fillStyle = vecToColor(0, 0, 1);
  nCtx.fillRect(0, 0, N_RES, N_RES);

  // Wave base flow fields (tXS7 -> 8kSm -> a3ds)
  if (wave === 1) {
    nCtx.fillStyle = vecToColor(0, -0.45, 0.9);
    nCtx.fillRect(0, 0, N_RES / 2, N_RES);
    nCtx.fillStyle = vecToColor(0, 0.45, 0.9);
    nCtx.fillRect(N_RES / 2, 0, N_RES / 2, N_RES);
  } else if (wave === 2) {
    nCtx.fillStyle = vecToColor(0, 0.45, 0.9);
    nCtx.fillRect(0, 0, N_RES / 2, N_RES / 2);
    nCtx.fillStyle = vecToColor(0.45, 0, 0.9);
    nCtx.fillRect(0, N_RES / 2, N_RES / 2, N_RES / 2);
    nCtx.fillStyle = vecToColor(0, -0.45, 0.9);
    nCtx.fillRect(N_RES / 2, N_RES / 2, N_RES / 2, N_RES / 2);
    nCtx.fillStyle = vecToColor(-0.45, 0, 0.9);
    nCtx.fillRect(N_RES / 2, 0, N_RES / 2, N_RES / 2);
  } else {
    nCtx.fillStyle = vecToColor(0, 0.35, 0.94);
    nCtx.fillRect(0, 0, N_RES, N_RES);
  }
  nData = nCtx.getImageData(0, 0, N_RES, N_RES).data;
}

function setupWave(w) {
  wave = w;
  balls = [];
  clearNormalMap();
  if (w === 1) {
    for (let i = 0; i < 6; i++) {
      balls.push({ type: 1, x: SIZE * 0.38, y: 60 + i * 74, vx: 0, vy: 0 });
      balls.push({ type: 0, x: SIZE * 0.62, y: 60 + i * 74, vx: 0, vy: 0 });
    }
  } else if (w === 2) {
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      balls.push({
        type: i % 2,
        x: 256 + Math.cos(ang) * 110,
        y: 256 + Math.sin(ang) * 140,
        vx: 0, vy: 0
      });
    }
  } else {
    for (let i = 0; i < 14; i++) {
      balls.push({
        type: i % 2,
        x: 150 + (i % 7) * 35,
        y: 55 + Math.floor(i / 7) * 55,
        vx: 0, vy: 0
      });
    }
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetWaves = Math.max(1, Number(custom.targetWaves || 3));
  durationSec = Math.max(25, Number(custom.durationSec || 70));
  errors = 0;
  trails = [];
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  ptr = { x: 256, y: 256, px: 256, py: 256, down: false };
  setupWave(1);
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Manche ${wave}/${targetWaves} • Reste ${balls.length} • Erreurs ${errors}/4 • ${Math.ceil(timeLeft)}s`;
}

function paintNormalStroke(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  if (dx * dx + dy * dy < 1) return;
  nCtx.strokeStyle = vecToColor(dx, dy, 12);
  nCtx.lineWidth = 7;
  nCtx.lineCap = "round";
  nCtx.beginPath();
  nCtx.moveTo(x0 / N_SCALE, y0 / N_SCALE);
  nCtx.lineTo(x1 / N_SCALE, y1 / N_SCALE);
  nCtx.stroke();
  nData = nCtx.getImageData(0, 0, N_RES, N_RES).data;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y;
  ptr.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  if (ptr.down && !over) paintNormalStroke(ptr.px, ptr.py, ptr.x, ptr.y);
});
window.addEventListener("pointerup", () => { ptr.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) clearNormalMap();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      ptr.px = ptr.x; ptr.py = ptr.y;
      ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x + kx * 260 * dt));
      ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y + ky * 260 * dt));
      paintNormalStroke(ptr.px, ptr.py, ptr.x, ptr.y);
    }

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      const nx = Math.max(0, Math.min(N_RES - 1, Math.floor(b.x / N_SCALE)));
      const ny = Math.max(0, Math.min(N_RES - 1, Math.floor(b.y / N_SCALE)));
      const pIdx = (ny * N_RES + nx) * 4;
      const fx = (nData[pIdx] / 127.0) - 1;
      const fy = (nData[pIdx + 1] / 127.0) - 1;
      const fz = Math.max(0, (nData[pIdx + 2] / 127.0) - 1);
      const ratio = 1 - fz;
      const VEL = 5.5;
      b.vx = b.vx * (1 - ratio) + fx * VEL * ratio;
      b.vy = b.vy * (1 - ratio) + fy * VEL * ratio;
      if (wave === 3) b.vy += 0.04; // a3ds gravity in final wave

      b.x += b.vx;
      b.y += b.vy;
      if (b.y < 8) b.y += SIZE - 16;
      if (b.y >= SIZE - 8) b.y -= SIZE - 16;

      if (Math.random() < 0.45) {
        trails.push({ x: b.x, y: b.y, life: 1, col: b.type === 0 ? "#f8fafc" : "#38bdf8" });
      }

      if (b.x < GOAL_W) {
        if (b.type === 0) { score += 150; }
        else { errors++; score = Math.max(0, score - 80); }
        balls.splice(i, 1);
      } else if (b.x > SIZE - GOAL_W) {
        if (b.type === 1) { score += 150; }
        else { errors++; score = Math.max(0, score - 80); }
        balls.splice(i, 1);
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].life -= 3.0 * dt;
      if (trails[i].life <= 0) trails.splice(i, 1);
    }

    if (errors >= 4 || timeLeft <= 0) {
      won = false; over = true;
    } else if (balls.length === 0) {
      if (wave < targetWaves) {
        score += 250;
        setupWave(wave + 1);
      } else {
        won = true; over = true;
        score += Math.round(timeLeft * 25);
      }
    }
    updateHud();
  }

  // Render normal map faintly underneath + goal zones
  ctx.drawImage(nCv, 0, 0, SIZE, SIZE);
  ctx.fillStyle = "rgba(6, 10, 22, 0.48)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Left White Goal & Right Black Goal
  ctx.fillStyle = "rgba(241, 245, 249, 0.9)";
  ctx.fillRect(0, 0, GOAL_W, SIZE);
  ctx.fillStyle = "#090d16";
  ctx.fillRect(SIZE - GOAL_W, 0, GOAL_W, SIZE);
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(GOAL_W, 0); ctx.lineTo(GOAL_W, SIZE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(SIZE - GOAL_W, 0); ctx.lineTo(SIZE - GOAL_W, SIZE); ctx.stroke();

  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#0f172a";
  ctx.fillText("BLANC", GOAL_W / 2, 26);
  ctx.fillText("⚪", GOAL_W / 2, 46);
  ctx.fillStyle = "#e2e8f0";
  ctx.fillText("NOIR", SIZE - GOAL_W / 2, 26);
  ctx.fillText("⚫", SIZE - GOAL_W / 2, 46);

  // Trails (a3ds)
  for (const t of trails) {
    ctx.fillStyle = t.col;
    ctx.globalAlpha = Math.max(0, t.life * 0.45);
    ctx.fillRect(t.x - 1.5, t.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // Balls
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 7.5, 0, Math.PI * 2);
    if (b.type === 0) {
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#38d6ff";
    } else {
      ctx.fillStyle = "#090d16";
      ctx.strokeStyle = "#facc15";
    }
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  }

  if (!over) {
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 13, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "AIGUILLAGE PARFAIT !" : (errors >= 4 ? "TROP D'ERREURS !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Manche ${wave}/${targetWaves} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
