<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Tapette à Moustique Sonore (Mosquito Swat)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: none; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "mosquito_swat",
  "name": "Tapette à Moustique Sonore (Mosquito Swat)",
  "family": "topMouseHnS",
  "icon": "🦟",
  "controls": "Pointeur / glisser ou Flèches / ZQSD pour viser avec la tapette • Clic ou Espace pour rabattre la tapette",
  "description": "Adapté de 1W3d.as (Tapette & bourdonnement synthétisé) : traquez des moustiques erratiques dont le bourdonnement Web Audio varie avec leur vitesse. Un coup centré les écrase ; un coup décalé les fait fuser à toute vitesse !",
  "goal": "Écraser 18 moustiques en moins de 60 secondes avant de subir 5 piqûres.",
  "fields": [
    { "key": "targetKills", "label": "Moustiques à écraser", "type": "number", "default": 18 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🦟 Tapette</span>
  <span id="stat">Écrasés 0/18 • Piqûres 0/5 • 60s</span>
  <div class="bar-btns">
    <button id="muteBtn" onclick="toggleMute()" title="Son Web Audio">🔊</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointer</b> : placer la tapette • <b>Clic / Espace</b> : frapper net (un coup raté de près effraie le moustique !)
</div>

<script>
const GAME_ID = "mosquito_swat";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetKills = 18, durationSec = 60;
let bugs = [], splats = [], ripples = [];
let net = { x: 256, y: 256, swing: 0, down: false };
let keys = {};
let kills = 0, stings = 0, timeLeft = 60, score = 0, won = false, over = false;
let spawnCd = 0;

// Web Audio buzz + swat synth (1W3d SampleData harmonic buzz)
let audioCtx = null, buzzOsc = null, buzzOsc2 = null, buzzGain = null, muted = false;
function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    buzzGain = audioCtx.createGain();
    buzzGain.gain.value = 0;
    buzzGain.connect(audioCtx.destination);
    buzzOsc = audioCtx.createOscillator();
    buzzOsc.type = "sawtooth";
    buzzOsc.frequency.value = 420;
    buzzOsc2 = audioCtx.createOscillator();
    buzzOsc2.type = "triangle";
    buzzOsc2.frequency.value = 840;
    const g1 = audioCtx.createGain(); g1.gain.value = 0.04;
    const g2 = audioCtx.createGain(); g2.gain.value = 0.025;
    buzzOsc.connect(g1); g1.connect(buzzGain);
    buzzOsc2.connect(g2); g2.connect(buzzGain);
    buzzOsc.start();
    buzzOsc2.start();
  } catch (e) {}
}
function playSlap(hit) {
  if (muted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = hit ? "square" : "sine";
    osc.frequency.setValueAtTime(hit ? 280 : 170, now);
    osc.frequency.exponentialRampToValueAtTime(hit ? 70 : 90, now + 0.09);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.11);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
  if (buzzGain && audioCtx) buzzGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
}

function sendResultAndExit(didWin, finalScore) {
  if (buzzGain && audioCtx) try { buzzGain.gain.value = 0; } catch (e) {}
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnBug() {
  const ang = Math.random() * Math.PI * 2;
  bugs.push({
    x: 45 + Math.random() * (SIZE - 90),
    y: 45 + Math.random() * (SIZE - 90),
    r: ang,
    v: 2.2 + Math.random() * 1.4,
    wing: 0,
    biteTimer: 3.5 + Math.random() * 2.5
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetKills = Math.max(5, Number(custom.targetKills || 18));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  bugs = [];
  for (let i = 0; i < 4; i++) spawnBug();
  splats = [];
  ripples = [];
  net = { x: 256, y: 256, swing: 0, down: false };
  kills = 0;
  stings = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnCd = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Écrasés ${kills}/${targetKills} • Piqûres ${stings}/5 • ${Math.ceil(timeLeft)}s`;
}

function swat() {
  if (over) return;
  initAudio();
  net.down = true;
  net.swing = 1;
  const hitX = net.x, hitY = net.y - 12;
  let anyHit = false;
  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    const d = Math.hypot(b.x - hitX, b.y - hitY);
    if (d < 22) {
      anyHit = true;
      kills++;
      score += Math.round(120 + b.v * 20);
      splats.push({ x: b.x, y: b.y, life: 1 });
      ripples.push({ x: b.x, y: b.y, r: 8, life: 1, col: "#4ade80" });
      bugs.splice(i, 1);
      spawnBug();
    } else if (d < 46) {
      // Near miss scares mosquito (1W3d ka.v = 36!)
      b.v = 11.5;
      b.r = Math.atan2(b.y - hitY, b.x - hitX);
      ripples.push({ x: b.x, y: b.y, r: 6, life: 1, col: "#facc15" });
    }
  }
  playSlap(anyHit);
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(18, Math.min(SIZE - 18, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(24, Math.min(SIZE - 18, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  net.x = p.x; net.y = p.y;
  swat();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  net.x = p.x; net.y = p.y;
});
window.addEventListener("pointerup", () => { net.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) swat();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") net.down = false;
  keys[e.code] = false;
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      net.x = Math.max(18, Math.min(SIZE - 18, net.x + kx * 310 * dt));
      net.y = Math.max(24, Math.min(SIZE - 18, net.y + ky * 310 * dt));
    }

    if (net.swing > 0 && !net.down) net.swing = Math.max(0, net.swing - 7 * dt);

    let maxSpeed = 0;
    for (let i = bugs.length - 1; i >= 0; i--) {
      const b = bugs[i];
      b.r += (Math.random() - 0.5) * 1.1;
      b.x += Math.cos(b.r) * b.v * 60 * dt;
      b.y += Math.sin(b.r) * b.v * 60 * dt;
      b.wing += dt * (25 + b.v * 8);
      if (b.x < 32 || b.x > SIZE - 32 || b.y < 32 || b.y > SIZE - 32) {
        b.r = Math.atan2(256 - b.y, 256 - b.x);
      }
      if (b.v > 2.6) b.v = Math.max(2.6, b.v - 8 * dt);
      if (b.v > maxSpeed) maxSpeed = b.v;

      b.biteTimer -= dt;
      if (b.biteTimer <= 0) {
        stings++;
        b.biteTimer = 5.5;
        ripples.push({ x: b.x, y: b.y, r: 8, life: 1, col: "#f87171" });
      }
    }

    // Update continuous mosquito pitch from speed (1W3d)
    if (audioCtx && buzzGain && !muted) {
      const freq = 520 + maxSpeed * 42 + Math.random() * 14;
      buzzOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.04);
      buzzOsc2.frequency.setTargetAtTime(freq * 2.02, audioCtx.currentTime, 0.04);
      buzzGain.gain.setTargetAtTime(bugs.length ? 0.28 : 0, audioCtx.currentTime, 0.05);
    }

    spawnCd -= dt;
    if (spawnCd <= 0 && bugs.length < 5) {
      spawnCd = 1.8;
      spawnBug();
    }

    for (let i = splats.length - 1; i >= 0; i--) {
      splats[i].life -= 0.45 * dt;
      if (splats[i].life <= 0) splats.splice(i, 1);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 65 * dt;
      ripples[i].life -= 2.4 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (kills >= targetKills) {
      won = true; over = true;
      score += Math.round(timeLeft * 30);
    } else if (stings >= 5 || timeLeft <= 0) {
      won = false; over = true;
    }
    if (over && buzzGain && audioCtx) buzzGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04);
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Splats
  for (const s of splats) {
    ctx.fillStyle = `rgba(74, 222, 128, ${s.life * 0.45})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, Math.PI * 2); ctx.fill();
  }

  // Mosquitoes (1W3d Ka)
  for (const b of bugs) {
    const warn = b.biteTimer < 1.2;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.r);
    // Wings
    const wAmp = 6 + Math.sin(b.wing) * 5;
    ctx.strokeStyle = warn ? "#fca5a5" : "#bae6fd";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.quadraticCurveTo(-6, wAmp, -2, 0);
    ctx.moveTo(2, 0); ctx.quadraticCurveTo(-6, -wAmp, -2, 0);
    ctx.stroke();
    // Body
    ctx.strokeStyle = warn ? "#f87171" : "#facc15";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(7, 0); ctx.stroke();
    ctx.restore();

    if (warn) {
      ctx.strokeStyle = "rgba(248,113,113,0.75)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI * 2); ctx.stroke();
    }
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Swatter Net (1W3d Net with 3D perspective squash)
  if (!over) {
    const scaleY = 1 - net.swing * 0.38;
    ctx.save();
    ctx.translate(net.x, net.y);
    ctx.scale(1 + net.swing * 0.1, scaleY);
    ctx.strokeStyle = net.swing > 0.2 ? "#facc15" : "#7dd3fc";
    ctx.lineWidth = 1.8;
    ctx.strokeRect(-18, -32, 36, 36);
    ctx.strokeStyle = "rgba(125,211,252,0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -12; i <= 12; i += 6) {
      ctx.moveTo(i, -32); ctx.lineTo(i, 4);
      ctx.moveTo(-18, i - 14); ctx.lineTo(18, i - 14);
    }
    ctx.stroke();
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, 38); ctx.stroke();
    ctx.restore();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "NUISIBLES ÉLIMINÉS !" : (stings >= 5 ? "TROP DE PIQÛRES !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Écrasés ${kills}/${targetKills} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
