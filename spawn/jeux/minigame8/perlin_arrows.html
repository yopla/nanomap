<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Surf sur Courants Perlin (Perlin Arrows)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "perlin_arrows",
  "name": "Surf sur Courants Perlin (Perlin Arrows)",
  "family": "topMouseMut",
  "icon": "🏹",
  "controls": "Glisser / pointer ou Flèches / ZQSD pour impulser l'essaim de flèches • Clic ou Espace pour muter le champ de Perlin (cooldown 1.2s)",
  "description": "Fusion de hiW1.as, 3KAX.as et kivX.as : des centaines de flèches s'alignent sur une carte de courants Perlin dynamique ; donnez des impulsions locales ou régénérez les courants pour guider la sonde de tête à travers les anneaux dorés.",
  "goal": "Traverser 16 anneaux d'énergie en moins de 60 secondes sans perdre vos 3 boucliers sur les anomalies rouges.",
  "fields": [
    { "key": "targetRings", "label": "Anneaux à traverser", "type": "number", "default": 16 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🏹 Courants Perlin</span>
  <span id="stat">Anneaux 0/16 • 🛡️ 3 • 60s</span>
  <div class="bar-btns">
    <button onclick="mutatePerlin()" title="Muter le champ Perlin (Espace)">🌊 Muter</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointer / Glisser</b> : pousser les flèches dans le courant • <b>Clic / Espace</b> : muter les courants Perlin 🌊
</div>

<script>
const GAME_ID = "perlin_arrows";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetRings = 16, durationSec = 60;
let seedPhase = 0, mutateCd = 0;
let arrows = [], rings = [], hazards = [], ripples = [];
let probe = { x: 256, y: 256, vx: 0, vy: 0, invuln: 0 };
let ptr = { x: 256, y: 256, px: 256, py: 256, active: false };
let keys = {};
let collected = 0, shields = 3, timeLeft = 60, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function fieldForce(x, y, t) {
  const s1 = seedPhase;
  const fx = Math.sin(x * 0.015 + s1) * Math.cos(y * 0.014 - t * 0.6) + 0.5 * Math.cos(y * 0.028 + s1 * 1.7);
  const fy = Math.cos(x * 0.014 + t * 0.5 + s1) * Math.sin(y * 0.016 - s1 * 0.9) + 0.5 * Math.sin(x * 0.026 - s1);
  return { fx, fy };
}

function mutatePerlin() {
  if (over || mutateCd > 0) return;
  seedPhase += 2.17 + Math.random() * 1.4;
  mutateCd = 1.2;
  ripples.push({ x: probe.x, y: probe.y, r: 10, life: 1, col: "#38d6ff" });
}

function spawnRing() {
  rings.push({
    x: 48 + Math.random() * (SIZE - 96),
    y: 48 + Math.random() * (SIZE - 96),
    r: 20, pulse: Math.random() * 6.28
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetRings = Math.max(4, Number(custom.targetRings || 16));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  seedPhase = Math.random() * 10;
  mutateCd = 0;
  arrows = [];
  for (let i = 0; i < 340; i++) {
    arrows.push({
      x: Math.random() * SIZE,
      y: Math.random() * SIZE,
      vx: 0, vy: 0, rot: 0, speed: 0
    });
  }
  probe = { x: 256, y: 256, vx: 0, vy: 0, invuln: 1.0 };
  rings = [];
  for (let i = 0; i < 3; i++) spawnRing();
  hazards = [];
  for (let i = 0; i < 5; i++) {
    const ang = (i / 5) * Math.PI * 2;
    hazards.push({
      x: 256 + Math.cos(ang) * 150,
      y: 256 + Math.sin(ang) * 150,
      vx: Math.cos(ang + 1.4) * 34,
      vy: Math.sin(ang + 1.4) * 34,
      r: 13
    });
  }
  ripples = [];
  ptr = { x: 256, y: 256, px: 256, py: 256, active: false };
  collected = 0;
  shields = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Anneaux ${collected}/${targetRings} • 🛡️ ${shields} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y;
  ptr.active = true;
  mutatePerlin();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  ptr.active = true;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) mutatePerlin();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now * 0.001;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (mutateCd > 0) mutateCd = Math.max(0, mutateCd - dt);
    if (probe.invuln > 0) probe.invuln = Math.max(0, probe.invuln - dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      probe.vx += kx * 420 * dt;
      probe.vy += ky * 420 * dt;
    }

    // Move probe using Perlin field + cursor steering (kivX)
    const pf = fieldForce(probe.x, probe.y, t);
    probe.vx += pf.fx * 110 * dt;
    probe.vy += pf.fy * 110 * dt;
    if (ptr.active) {
      const dx = ptr.x - probe.x, dy = ptr.y - probe.y;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        probe.vx += (dx / d) * Math.min(280, d * 2.2) * dt;
        probe.vy += (dy / d) * Math.min(280, d * 2.2) * dt;
      }
    }
    probe.vx *= 0.94;
    probe.vy *= 0.94;
    probe.x = (probe.x + probe.vx * dt + SIZE) % SIZE;
    probe.y = (probe.y + probe.vy * dt + SIZE) % SIZE;

    // Move 340 Perlin arrows (hiW1 / 3KAX)
    const sx = (ptr.x - ptr.px) * 1.4, sy = (ptr.y - ptr.py) * 1.4;
    for (const a of arrows) {
      const f = fieldForce(a.x, a.y, t);
      const dx = a.x - ptr.x, dy = a.y - ptr.y;
      const dist = dx * dx + dy * dy + 80;
      a.vx = a.vx * 0.91 + f.fx * 0.45 + (sx * 45) / dist;
      a.vy = a.vy * 0.91 + f.fy * 0.45 + (sy * 45) / dist;
      a.x = (a.x + a.vx + SIZE) % SIZE;
      a.y = (a.y + a.vy + SIZE) % SIZE;
      a.rot = Math.atan2(a.vy, a.vx);
      a.speed = Math.hypot(a.vx, a.vy);
    }
    ptr.px = ptr.x; ptr.py = ptr.y;

    // Check rings
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].pulse += dt * 4;
      if (Math.hypot(rings[i].x - probe.x, rings[i].y - probe.y) < rings[i].r + 10) {
        ripples.push({ x: rings[i].x, y: rings[i].y, r: 10, life: 1, col: "#facc15" });
        rings.splice(i, 1);
        collected++;
        score += 150;
        spawnRing();
      }
    }

    // Move hazards
    for (const h of hazards) {
      const f = fieldForce(h.x, h.y, t);
      h.vx = h.vx * 0.98 + f.fx * 18 * dt;
      h.vy = h.vy * 0.98 + f.fy * 18 * dt;
      h.x += h.vx * dt; h.y += h.vy * dt;
      if (h.x < 18 || h.x > SIZE - 18) h.vx *= -1;
      if (h.y < 18 || h.y > SIZE - 18) h.vy *= -1;
      if (probe.invuln <= 0 && Math.hypot(h.x - probe.x, h.y - probe.y) < h.r + 9) {
        shields--;
        probe.invuln = 1.5;
        ripples.push({ x: probe.x, y: probe.y, r: 8, life: 1, col: "#f87171" });
      }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 75 * dt;
      ripples[i].life -= 2.3 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (collected >= targetRings) {
      won = true; over = true;
      score += Math.round(timeLeft * 30);
    } else if (shields <= 0 || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Trailing fade (3KAX ColorTransform fade feel)
  ctx.fillStyle = "rgba(6, 9, 20, 0.34)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Draw 340 oriented arrows sorted roughly by brightness
  for (const a of arrows) {
    const al = Math.min(0.95, 0.25 + a.speed * 0.16);
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.fillStyle = `rgba(125, 211, 252, ${al})`;
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(-4, -3.2);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-4, 3.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Rings
  for (const rg of rings) {
    const r = rg.r + Math.sin(rg.pulse) * 2.5;
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(250,204,21,0.14)";
    ctx.fill();
  }

  // Hazards
  for (const h of hazards) {
    ctx.fillStyle = "rgba(248,113,113,0.22)";
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fca5a5";
    ctx.beginPath(); ctx.arc(h.x, h.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Player lead arrow / probe
  if (!over) {
    ctx.save();
    ctx.globalAlpha = probe.invuln > 0 && Math.floor(probe.invuln * 12) % 2 ? 0.35 : 1;
    ctx.translate(probe.x, probe.y);
    ctx.rotate(Math.atan2(probe.vy, probe.vx));
    ctx.fillStyle = "#38d6ff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-9, -8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-9, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "COURANTS MAÎTRISÉS !" : (shields <= 0 ? "BOUCLIERS BRISÉS !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Anneaux ${collected}/${targetRings} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
