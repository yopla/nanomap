<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Déflecteur Rutherford &amp; Lentilles (Rutherford Beam)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.mode-rep { background: #4a350a; border-color: #facc15; color: #fef08a; }
  button.mode-att { background: #0d3b4c; border-color: #22d3ee; color: #cffafe; }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "rutherford_beam",
  "name": "Déflecteur Rutherford & Lentilles (Rutherford Beam)",
  "family": "tactical",
  "icon": "⚛️",
  "controls": "Pointeur / glisser ou Flèches / ZQSD pour déplacer le noyau déflecteur • Clic droit, Espace ou bouton 🟡/🔵 pour basculer Répulsion (+k/r²) / Attraction (-k/r²)",
  "description": "Fusion de kcf3.as (expérience de Rutherford : faisceau de particules alpha défléchi en k/r² par un noyau d'or) et de zNeg.as (traînées gravitationnelles s'illuminant selon la force F) : déviez le faisceau vers les 4 détecteurs sans toucher les absorbeurs rouges.",
  "goal": "Charger les 4 détecteurs à 100 % en moins de 65 secondes sans laisser les absorbeurs rouges atteindre 100 %.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">⚛️ Rutherford</span>
  <span id="stat">Détecteurs 0/4 • Surchauffe 0% • 65s</span>
  <div class="bar-btns">
    <button id="polBtn" class="mode-rep" onclick="togglePolarity()" title="Basculer Répulsion / Attraction (Espace)">🟡 Répulsif</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Déplacer le noyau</b> pour courber le faisceau en 1/r² • <b>Espace / Clic droit</b> : basculer 🟡 Répulsion / 🔵 Attraction
</div>

<script>
const GAME_ID = "rutherford_beam";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const DETECTORS_DEF = [
  { x: 420, y: 74, r: 24 },
  { x: 454, y: 175, r: 24 },
  { x: 454, y: 345, r: 24 },
  { x: 420, y: 442, r: 24 }
];
const ABSORBERS = [
  { x: 446, y: 260, r: 26 },
  { x: 300, y: 90, r: 18 },
  { x: 300, y: 422, r: 18 }
];

let durationSec = 65;
let nucleus = { x: 230, y: 260, repulsive: true };
let beam = [], detectors = [], ripples = [];
let overheat = 0;
let keys = {};
let timeLeft = 65, score = 0, won = false, over = false;
let emitTick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function togglePolarity(force) {
  nucleus.repulsive = typeof force === "boolean" ? force : !nucleus.repulsive;
  const btn = document.getElementById("polBtn");
  if (nucleus.repulsive) {
    btn.textContent = "🟡 Répulsif";
    btn.className = "mode-rep";
  } else {
    btn.textContent = "🔵 Attractif";
    btn.className = "mode-att";
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  nucleus = { x: 230, y: 260, repulsive: true };
  togglePolarity(true);
  beam = [];
  detectors = DETECTORS_DEF.map(d => ({ ...d, charge: 0 }));
  ripples = [];
  overheat = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  emitTick = 0;
  updateHud();
}

function updateHud() {
  const done = detectors.filter(d => d.charge >= 100).length;
  document.getElementById("stat").textContent =
    `Détecteurs ${done}/4 • Surchauffe ${Math.round(overheat)}% • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(70, Math.min(SIZE - 30, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(30, Math.min(SIZE - 30, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  nucleus.x = p.x; nucleus.y = p.y;
  if (e.button === 2) togglePolarity();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  nucleus.x = p.x; nucleus.y = p.y;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) togglePolarity();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    overheat = Math.max(0, overheat - 4.5 * dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      nucleus.x = Math.max(70, Math.min(SIZE - 30, nucleus.x + kx * 270 * dt));
      nucleus.y = Math.max(30, Math.min(SIZE - 30, nucleus.y + ky * 270 * dt));
    }

    // Emit alpha beam from left cannon (kcf3)
    emitTick += dt;
    while (emitTick >= 0.022) {
      emitTick -= 0.022;
      if (beam.length < 220) {
        beam.push({
          x: 12,
          y: 250 + Math.random() * 20,
          vx: 4.3,
          vy: 0,
          forceGlow: 0,
          hist: []
        });
      }
    }

    const K = nucleus.repulsive ? 3800 : -3400;
    for (let i = beam.length - 1; i >= 0; i--) {
      const p = beam[i];
      const dx = p.x - nucleus.x;
      const dy = p.y - nucleus.y;
      const d2 = Math.max(220, dx * dx + dy * dy);
      const force = K / d2;
      const ang = Math.atan2(dy, dx);
      p.vx += Math.cos(ang) * force * dt * 60;
      p.vy += Math.sin(ang) * force * dt * 60;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 9) { p.vx *= 9 / sp; p.vy *= 9 / sp; }
      p.x += p.vx;
      p.y += p.vy;
      p.forceGlow = Math.min(1, Math.abs(force) * 0.45);
      p.hist.push({ x: p.x, y: p.y });
      if (p.hist.length > 9) p.hist.shift();

      let removed = false;
      for (const d of detectors) {
        if (Math.hypot(p.x - d.x, p.y - d.y) < d.r) {
          if (d.charge < 100) {
            d.charge = Math.min(100, d.charge + 2.4);
            score += 22;
          }
          if (Math.random() < 0.2) ripples.push({ x: d.x, y: d.y, r: 6, life: 1, col: "#4ade80" });
          removed = true;
          break;
        }
      }
      if (!removed) {
        for (const a of ABSORBERS) {
          if (Math.hypot(p.x - a.x, p.y - a.y) < a.r) {
            overheat = Math.min(100, overheat + 1.1);
            removed = true;
            break;
          }
        }
      }
      if (removed || p.x < 0 || p.x > SIZE || p.y < 0 || p.y > SIZE) {
        beam.splice(i, 1);
      }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 60 * dt;
      ripples[i].life -= 2.4 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (detectors.every(d => d.charge >= 100)) {
      won = true; over = true;
      score += Math.round(timeLeft * 30);
    } else if (overheat >= 100 || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Left beam emitter
  ctx.fillStyle = "#1e3a5f";
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.fillRect(0, 240, 20, 40);
  ctx.strokeRect(0, 240, 20, 40);

  // Illuminated gravitational trails (zNeg)
  for (const p of beam) {
    if (p.hist.length > 1) {
      const lum = Math.round(110 + p.forceGlow * 145);
      ctx.strokeStyle = nucleus.repulsive
        ? `rgba(255, ${lum}, 100, ${0.45 + p.forceGlow * 0.5})`
        : `rgba(100, ${lum}, 255, ${0.45 + p.forceGlow * 0.5})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(p.hist[0].x, p.hist[0].y);
      for (let k = 1; k < p.hist.length; k++) ctx.lineTo(p.hist[k].x, p.hist[k].y);
      ctx.stroke();
    }
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(p.x - 1, p.y - 1, 2.5, 2.5);
  }

  // Detectors
  for (const d of detectors) {
    const done = d.charge >= 100;
    ctx.fillStyle = done ? "rgba(74,222,128,0.28)" : "rgba(15,23,42,0.85)";
    ctx.strokeStyle = done ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${Math.round(d.charge)}%`, d.x, d.y + 4);
  }

  // Absorbers
  for (const a of ABSORBERS) {
    ctx.fillStyle = "rgba(248,113,113,0.22)";
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Gold/Lens Nucleus
  ctx.fillStyle = nucleus.repulsive ? "#facc15" : "#22d3ee";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(nucleus.x, nucleus.y, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = nucleus.repulsive ? "rgba(250,204,21,0.35)" : "rgba(34,211,238,0.35)";
  ctx.beginPath(); ctx.arc(nucleus.x, nucleus.y, 30, 0, Math.PI * 2); ctx.stroke();

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "DÉTECTEURS CHARGÉS !" : (overheat >= 100 ? "SURCHAUFFE !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Détecteurs ${detectors.filter(d => d.charge >= 100).length}/4 • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
