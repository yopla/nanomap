<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Rythme Circulaire (Mouse Beat)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "mouse_beat",
  "name": "Rythme Circulaire (Mouse Beat)",
  "family": "topMouseHnS",
  "icon": "🎵",
  "controls": "Cliquer / taper sur chaque marqueur au moment exact où sa jauge fait un tour complet (50%) • Espace frappe le marqueur le plus proche de la synchronisation",
  "description": "Adapté de beat.as (MouseBeat) : des marqueurs rythmiques apparaissent sur la mélodie (tempo croissant sur 5 paliers). Cliquez quand la jauge circulaire boucle son premier tour pour obtenir Cool (+1000) / Great (+500) / Good (+100) avec gerbes de billes.",
  "goal": "Atteindre 12 000 points avant 8 ratés ou la fin des 65 secondes.",
  "fields": [
    { "key": "targetScore", "label": "Score cible", "type": "number", "default": 12000 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎵 Mouse Beat</span>
  <span id="stat">Score 0/12000 • Ratés 0/8 • 65s</span>
  <div class="bar-btns">
    <button id="muteBtn" onclick="toggleMute()" title="Son Web Audio">🔊</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Cliquer le marqueur</b> quand l'anneau complète un tour (<b>Push → Cool!</b>) • <b>Espace</b> : frappe rythmique rapide
</div>

<script>
const GAME_ID = "mouse_beat";
const SIZE = 512;
const MELODY = [
  261.63, 261.63, 392.00, 392.00, 440.00, 440.00, 392.00,
  349.23, 349.23, 329.63, 329.63, 293.66, 293.66, 261.63,
  392.00, 392.00, 349.23, 349.23, 329.63, 329.63, 293.66
];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetScore = 12000, durationSec = 65;
let markers = [], balls = [], bubbles = [], texts = [];
let noteIdx = 0, spawnCd = 0, misses = 0;
let prevX = 256, prevY = 256;
let timeLeft = 65, score = 0, won = false, over = false;
let audioCtx = null, muted = false;

function initAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) {}
  } else if (audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
}
function playBell(freq, mult) {
  if (muted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq * (mult || 1), now);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.36);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
}

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnMarker() {
  let x = 256, y = 256;
  for (let t = 0; t < 20; t++) {
    x = 76 + Math.random() * (SIZE - 152);
    y = 76 + Math.random() * (SIZE - 152);
    if (Math.hypot(x - prevX, y - prevY) > 105) break;
  }
  prevX = x; prevY = y;
  const freq = MELODY[noteIdx % MELODY.length];
  noteIdx++;
  const level = Math.min(4, Math.floor(score / 2500));
  const speed = 0.8 + level * 0.16;
  markers.push({ x, y, progress: 0, speed, freq, r: 54 });
}

function hitMarker(idx) {
  const m = markers[idx];
  const diff = Math.abs(0.5 - m.progress);
  let pts = 50, label = "Bad", col = "#94a3b8", count = 1;
  if (diff <= 0.08) { pts = 1000; label = "Cool!"; col = "#4ade80"; count = 12; }
  else if (diff <= 0.16) { pts = 500; label = "Great!"; col = "#facc15"; count = 6; }
  else if (diff <= 0.28) { pts = 100; label = "Good"; col = "#38d6ff"; count = 3; }

  score += pts;
  playBell(m.freq, pts >= 500 ? 1 : 0.75);
  texts.push({ x: m.x, y: m.y, text: label, col, life: 1 });
  for (let i = 0; i < count; i++) {
    balls.push({
      x: m.x, y: m.y,
      vx: (Math.random() - 0.5) * 260,
      vy: -80 - Math.random() * 140,
      r: 4 + Math.random() * 5,
      col, life: 1
    });
  }
  markers.splice(idx, 1);
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetScore = Math.max(2000, Number(custom.targetScore || 12000));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  markers = [];
  balls = [];
  texts = [];
  bubbles = [];
  for (let i = 0; i < 8; i++) {
    bubbles.push({
      x: 32 + Math.random() * (SIZE - 64),
      y: Math.random() * SIZE,
      vy: 25 + Math.random() * 40,
      r: 6 + Math.random() * 10
    });
  }
  noteIdx = 0;
  spawnCd = 0.2;
  misses = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Score ${score}/${targetScore} • Ratés ${misses}/8 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (SIZE / r.width),
    y: (e.clientY - r.top) * (SIZE / r.height)
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  initAudio();
  const p = getPos(e);
  for (let i = markers.length - 1; i >= 0; i--) {
    if (Math.hypot(markers[i].x - p.x, markers[i].y - p.y) <= markers[i].r + 14) {
      hitMarker(i);
      return;
    }
  }
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && !over) {
    e.preventDefault();
    initAudio();
    if (markers.length) {
      let best = 0, bestD = 99;
      for (let i = 0; i < markers.length; i++) {
        const d = Math.abs(0.5 - markers[i].progress);
        if (d < bestD) { bestD = d; best = i; }
      }
      hitMarker(best);
    }
  }
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    const level = Math.min(4, Math.floor(score / 2500));
    spawnCd -= dt;
    if (spawnCd <= 0) {
      spawnCd = Math.max(0.45, 0.92 - level * 0.11);
      spawnMarker();
    }

    for (const b of bubbles) {
      b.y -= b.vy * dt;
      if (b.y < -20) { b.y = SIZE + 20; b.x = 32 + Math.random() * (SIZE - 64); }
    }

    for (let i = markers.length - 1; i >= 0; i--) {
      const m = markers[i];
      m.progress += m.speed * 0.55 * dt;
      if (m.progress >= 1.0) {
        misses++;
        texts.push({ x: m.x, y: m.y, text: "Miss", col: "#f87171", life: 1 });
        markers.splice(i, 1);
      }
    }

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      b.vy += 320 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= 1.2 * dt;
      if (b.life <= 0) balls.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      texts[i].y -= 28 * dt;
      texts[i].life -= 1.4 * dt;
      if (texts[i].life <= 0) texts.splice(i, 1);
    }

    if (score >= targetScore) {
      won = true; over = true;
      score += Math.round(timeLeft * 25);
    } else if (misses >= 8 || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Background rising bubbles (beat.as)
  for (const b of bubbles) {
    ctx.fillStyle = "rgba(255,165,0,0.16)";
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Markers
  for (const m of markers) {
    const scale = Math.min(1, m.progress * 4.5);
    const r = m.r * scale;
    ctx.strokeStyle = "#ffa500";
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.stroke();

    // Sync ring gauge (sweet spot at progress = 0.5!)
    const gaugeAngle = m.progress * Math.PI * 4 - Math.PI / 2;
    ctx.strokeStyle = m.progress >= 0.5 ? "#f87171" : "#facc15";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(m.x, m.y, Math.max(6, r - 11), -Math.PI / 2, gaugeAngle);
    ctx.stroke();

    const syncDiff = Math.abs(0.5 - m.progress);
    ctx.fillStyle = syncDiff < 0.12 ? "#4ade80" : "#fed7aa";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(syncDiff < 0.12 ? "NOW!" : "Push", m.x, m.y + 6);
  }

  // Particles & judgment text
  for (const b of balls) {
    ctx.fillStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const tx of texts) {
    ctx.fillStyle = tx.col;
    ctx.globalAlpha = Math.max(0, tx.life);
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(tx.text, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TEMPO MAÎTRISÉ !" : (misses >= 8 ? "TROP DE RATÉS !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score}/${targetScore} • Ratés ${misses}/8`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
