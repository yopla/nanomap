<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Fumée Thermique &amp; Curl-Noise 3D (Curl Smoke)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "curl_smoke",
  "name": "Fumée Thermique & Curl-Noise 3D (Curl Smoke)",
  "family": "core",
  "icon": "🌫️",
  "controls": "Déplacer / glisser le curseur pour souffler la fumée et activer le sillage d'aspiration retardé • Clic ou Espace pour régénérer le champ curl-noise • ZQSD déplace le curseur",
  "description": "Adapté de Smoke.as (Curl-noise 3D sans divergence) : panaches de fumée et braises ascendantes soumis à la double interaction du curseur — souffle radial répulsif immédiat et sillage d'aspiration retardé (vacuumPos).",
  "goal": "Guider 35 braises dorées dans les 2 cheminées vertes en moins de 65 secondes tout en évitant 12 surchauffes sur les capteurs rouges.",
  "fields": [
    { "key": "targetEmbers", "label": "Braises à capturer", "type": "number", "default": 35 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌫️ Curl Smoke</span>
  <span id="stat">Braises 0/35 • Alertes 0/12 • 65s</span>
  <div class="bar-btns">
    <button onclick="regenerateCurl()" title="Nouveau champ Curl-Noise (Espace)">🌀 Curl</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Déplacer / Glisser</b> : souffle répulsif + sillage aspirant retardé • <b>Clic / Espace</b> : nouveau champ curl-noise 🌀
</div>

<script>
const GAME_ID = "curl_smoke";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const CHIMNEYS = [
  { x: 112, y: 26, w: 92, h: 24 },
  { x: 308, y: 26, w: 92, h: 24 }
];
const SENSORS = [
  { x: 256, y: 120, r: 22 },
  { x: 140, y: 240, r: 20 },
  { x: 372, y: 240, r: 20 }
];

let targetEmbers = 35, durationSec = 65;
let curlPhase = 0;
let smokePts = [], embers = [], ripples = [];
let ptr = { x: 256, y: 340, px: 256, py: 340, down: false };
let vac = { x: 256, y: 340, speed: 0 };
let keys = {};
let captured = 0, alerts = 0, timeLeft = 65, score = 0, won = false, over = false;
let yOffset = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

// Analytic divergence-free 2D/3D curl velocity field
function curlVel(x, y, z, t) {
  const s = 0.017;
  const p = curlPhase;
  const vx = Math.cos((y + t * 28) * s + p) * 1.4 - Math.sin((z + x * 0.5) * s - p) * 0.9;
  const vy = Math.sin((x - t * 18) * s - p) * 1.1 + Math.cos((z - y * 0.4) * s + p) * 0.7;
  return { vx, vy };
}

function regenerateCurl() {
  if (over) return;
  curlPhase += 1.7 + Math.random() * 2.0;
  ripples.push({ x: ptr.x, y: ptr.y, r: 10, life: 1, col: "#38d6ff" });
}

function spawnEmber() {
  embers.push({
    x: 60 + Math.random() * (SIZE - 120),
    y: SIZE - 20,
    z: Math.random() * 200,
    toxic: Math.random() < 0.34,
    age: 0
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetEmbers = Math.max(8, Number(custom.targetEmbers || 35));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  curlPhase = Math.random() * 6.28;
  smokePts = [];
  for (let i = 0; i < 420; i++) {
    smokePts.push({
      x: Math.random() * SIZE,
      y: Math.random() * SIZE,
      z: Math.random() * 200,
      life: Math.random() * 80
    });
  }
  embers = [];
  for (let i = 0; i < 18; i++) spawnEmber();
  ripples = [];
  ptr = { x: 256, y: 340, px: 256, py: 340, down: false };
  vac = { x: 256, y: 340, speed: 0 };
  captured = 0;
  alerts = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  yOffset = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Braises ${captured}/${targetEmbers} • Alertes ${alerts}/12 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y;
  ptr.down = true;
  regenerateCurl();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.px = ptr.x; ptr.py = ptr.y;
  ptr.x = p.x; ptr.y = p.y;
});
window.addEventListener("pointerup", () => { ptr.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) regenerateCurl();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function applyCursorVacuum(p, dragSpeed) {
  // Repulsive burst near pointer (DRAG_FORCE)
  let dx = p.x - ptr.x, dy = p.y - ptr.y;
  let d = Math.max(6, Math.hypot(dx, dy));
  const dragRange = 64;
  if (d < dragRange) {
    const s = dragSpeed * 0.55 * (dragRange - d) / d;
    p.x += dx * s;
    p.y += dy * s;
  }
  // Delayed vacuum trail attraction (VACUUM_FORCE)
  dx = vac.x - p.x; dy = vac.y - p.y;
  d = Math.max(6, Math.hypot(dx, dy));
  const vacRange = 84;
  if (d < vacRange) {
    const s = vac.speed * 0.34 * (vacRange - d) / d;
    p.x += dx * s;
    p.y += dy * s;
  }
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    yOffset += dt;
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      ptr.px = ptr.x; ptr.py = ptr.y;
      ptr.x = Math.max(12, Math.min(SIZE - 12, ptr.x + kx * 280 * dt));
      ptr.y = Math.max(12, Math.min(SIZE - 12, ptr.y + ky * 280 * dt));
    }

    const moveDist = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py);
    const dragSpeed = Math.min(1, moveDist / 12 + (ptr.down ? 0.35 : 0.15));
    const lerp = Math.min(1, 5.0 * dt);
    vac.x = vac.x * (1 - lerp) + ptr.x * lerp;
    vac.y = vac.y * (1 - lerp) + ptr.y * lerp;
    vac.speed = dragSpeed * lerp + vac.speed * (1 - lerp);
    ptr.px = ptr.x; ptr.py = ptr.y;

    for (const p of smokePts) {
      p.life -= 1;
      if (p.life <= 0 || p.y < 0) {
        p.x = Math.random() * SIZE;
        p.y = SIZE - Math.random() * 20;
        p.z = Math.random() * 200;
        p.life = 60 + Math.random() * 50;
      } else {
        const c = curlVel(p.x, p.y, p.z, yOffset);
        p.x += c.vx * 1.4;
        p.y += c.vy * 0.9 - 1.65;
        applyCursorVacuum(p, dragSpeed);
        if (p.x < 0) p.x += SIZE;
        if (p.x >= SIZE) p.x -= SIZE;
      }
    }

    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      const c = curlVel(e.x, e.y, e.z, yOffset);
      e.x += c.vx * 1.3;
      e.y += c.vy * 0.8 - 1.55;
      applyCursorVacuum(e, dragSpeed);
      if (e.x < 8) e.x += SIZE - 16;
      if (e.x > SIZE - 8) e.x -= SIZE - 16;

      // Sensors
      let hitSensor = false;
      for (const s of SENSORS) {
        if (Math.hypot(e.x - s.x, e.y - s.y) < s.r + 4) {
          if (e.toxic) {
            alerts++;
            score = Math.max(0, score - 50);
            ripples.push({ x: s.x, y: s.y, r: 8, life: 1, col: "#f87171" });
            hitSensor = true;
            break;
          }
        }
      }
      if (hitSensor) { embers.splice(i, 1); spawnEmber(); continue; }

      // Chimneys
      let inChim = false;
      for (const ch of CHIMNEYS) {
        if (e.x >= ch.x && e.x <= ch.x + ch.w && e.y <= ch.y + ch.h) {
          if (!e.toxic) {
            captured++;
            score += 110;
            ripples.push({ x: e.x, y: ch.y + 12, r: 6, life: 1, col: "#4ade80" });
          } else {
            score = Math.max(0, score - 25);
          }
          inChim = true;
          break;
        }
      }
      if (inChim || e.y < 6) {
        embers.splice(i, 1);
        spawnEmber();
      }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 65 * dt;
      ripples[i].life -= 2.4 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (captured >= targetEmbers) {
      won = true; over = true;
      score += Math.round(timeLeft * 25);
    } else if (alerts >= 12 || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Subtle smoke curl field
  ctx.fillStyle = "rgba(226, 232, 240, 0.55)";
  for (const p of smokePts) {
    ctx.fillRect(p.x, p.y, 1.8, 1.8);
  }

  // Chimneys (green targets)
  for (const ch of CHIMNEYS) {
    ctx.fillStyle = "rgba(74,222,128,0.22)";
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2;
    ctx.fillRect(ch.x, ch.y, ch.w, ch.h);
    ctx.strokeRect(ch.x, ch.y, ch.w, ch.h);
    ctx.fillStyle = "#dcfce7";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CHEMINÉE", ch.x + ch.w / 2, ch.y + 16);
  }

  // Sensors (avoid toxic smoke hitting them)
  for (const s of SENSORS) {
    ctx.fillStyle = "rgba(248,113,113,0.18)";
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fecaca";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CAPTEUR", s.x, s.y + 3);
  }

  // Embers & toxic soot
  for (const e of embers) {
    ctx.fillStyle = e.toxic ? "#fb7185" : "#facc15";
    ctx.beginPath(); ctx.arc(e.x, e.y, e.toxic ? 4.5 : 5, 0, Math.PI * 2); ctx.fill();
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (!over) {
    ctx.strokeStyle = "rgba(56,214,255,0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(vac.x, vac.y, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#facc15";
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 11, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "PANACHE CANALISÉ !" : (alerts >= 12 ? "CAPTEURS SATURÉS !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Braises ${captured}/${targetEmbers} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
