<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Œil de la Tornade 3D (Tornado Funnel)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tornado_funnel",
  "name": "Œil de la Tornade 3D (Tornado Funnel)",
  "family": "topMouseMut",
  "icon": "🌪️",
  "controls": "Pointeur / glisser ou Flèches / ZQSD pour déplacer l'œil de la tornade • Maintenir Clic ou Espace pour intensifier l'aspiration ascendante",
  "description": "Fusion de gT2K.as (entonnoir 3D articulé sur 4 ancres sinueuses), wIj3.as (vortex ascendant 3D) et 5zP3.as (tourbillon spiralé) : déplacez l'entonnoir pour soulever les reliques dorées jusqu'au portail céleste sans aspirer les mines.",
  "goal": "Hisser 22 reliques dorées dans le portail céleste en moins de 60 secondes sans aspirer 3 mines rouges.",
  "fields": [
    { "key": "targetRelics", "label": "Reliques à hisser", "type": "number", "default": 22 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌪️ Tornade 3D</span>
  <span id="stat">Reliques 0/22 • Mines 0/3 • 60s</span>
  <div class="bar-btns">
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Déplacer</b> : guider l'entonnoir 3D • <b>Maintenir Clic / Espace</b> : aspiration ascendante pour hisser les reliques dans le portail vert
</div>

<script>
const GAME_ID = "tornado_funnel";
const SIZE = 512;
const PORTAL = { x: 256, y: 46, w: 170, h: 32 };
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetRelics = 22, durationSec = 60;
let eye = { x: 256, y: 380, tx: 256, ty: 380 };
let holding = false;
let wisps = [], objects = [], ripples = [];
let keys = {};
let collected = 0, minesHit = 0, timeLeft = 60, score = 0, won = false, over = false;
let spawnCd = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnObj(isMine) {
  objects.push({
    x: 42 + Math.random() * (SIZE - 84),
    y: 350 + Math.random() * 135,
    vx: (Math.random() - 0.5) * 20,
    vy: 0,
    ang: Math.random() * 6.28,
    mine: isMine,
    r: isMine ? 10 : 8.5
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetRelics = Math.max(5, Number(custom.targetRelics || 22));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  eye = { x: 256, y: 380, tx: 256, ty: 380 };
  holding = false;
  wisps = [];
  for (let i = 0; i < 160; i++) {
    wisps.push({
      y: Math.random() * SIZE,
      ang: Math.random() * 6.28,
      ox: 0, oy: 0,
      hasPrev: false
    });
  }
  objects = [];
  for (let i = 0; i < 7; i++) spawnObj(false);
  for (let i = 0; i < 3; i++) spawnObj(true);
  ripples = [];
  collected = 0;
  minesHit = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnCd = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Reliques ${collected}/${targetRelics} • Mines ${minesHit}/3 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(24, Math.min(SIZE - 24, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(90, Math.min(SIZE - 24, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  eye.tx = p.x; eye.ty = p.y;
  holding = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  eye.tx = p.x; eye.ty = p.y;
});
window.addEventListener("pointerup", () => { holding = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space") holding = true;
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") holding = false;
  keys[e.code] = false;
});

function funnelCenterX(y, t) {
  const norm = Math.max(0, Math.min(1, y / SIZE));
  const sway = Math.sin(t * 2.1 + norm * 3.2) * (24 * (1 - norm));
  return 256 + (eye.x - 256) * Math.pow(norm, 0.7) + sway;
}

function funnelRadius(y) {
  const norm = Math.max(0, Math.min(1, 1 - y / SIZE));
  return 18 + norm * norm * 115;
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now * 0.001;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      eye.tx = Math.max(24, Math.min(SIZE - 24, eye.tx + kx * 290 * dt));
      eye.ty = Math.max(90, Math.min(SIZE - 24, eye.ty + ky * 290 * dt));
    }

    eye.x += (eye.tx - eye.x) * Math.min(1, 10 * dt);
    eye.y += (eye.ty - eye.y) * Math.min(1, 10 * dt);

    // Tornado wisps (gT2K 3D funnel + wIj3 spiral climb)
    const spinRate = holding ? 9.5 : 5.2;
    for (const w of wisps) {
      w.y -= (holding ? 145 : 75) * dt;
      if (w.y < 30) {
        w.y = SIZE - 8;
        w.hasPrev = false;
      }
      w.ang += spinRate * dt;
      const cx = funnelCenterX(w.y, t);
      const rad = funnelRadius(w.y);
      const x3 = Math.sin(w.ang) * rad;
      const z3 = Math.cos(w.ang) * rad;
      const scale = 600 / (600 + z3);
      const px = cx + x3 * scale;
      const py = w.y * scale;
      if (!w.hasPrev) { w.ox = px; w.oy = py; w.hasPrev = true; }
      w.nx = px; w.ny = py;
    }

    // Relics & mines interaction
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      const cx = funnelCenterX(o.y, t);
      const rad = funnelRadius(o.y);
      const dx = o.x - cx;
      const dist = Math.abs(dx);
      if (dist < rad + 28) {
        if (holding) {
          // Suck into funnel & lift upward
          o.vx += (cx - o.x) * 4.5 * dt + Math.sin(o.ang) * 110 * dt;
          o.vy -= (o.mine ? 155 : 220) * dt;
          o.ang += 8 * dt;
        } else {
          // Gentle swirl + slight outward fling when released
          o.vx += (cx - o.x) * 1.2 * dt;
          o.vy += 95 * dt;
        }
      } else {
        o.vy += 120 * dt;
      }
      o.vx *= 0.94;
      o.vy *= 0.95;
      o.x += o.vx * dt;
      o.y += o.vy * dt;

      if (o.x < 16) { o.x = 16; o.vx = Math.abs(o.vx) * 0.7; }
      if (o.x > SIZE - 16) { o.x = SIZE - 16; o.vx = -Math.abs(o.vx) * 0.7; }
      if (o.y > SIZE - 18) { o.y = SIZE - 18; o.vy = -Math.abs(o.vy) * 0.3; }

      // Check top portal
      if (o.y <= PORTAL.y + PORTAL.h && o.x >= PORTAL.x - PORTAL.w / 2 && o.x <= PORTAL.x + PORTAL.w / 2) {
        if (!o.mine) {
          collected++;
          score += 130;
          ripples.push({ x: o.x, y: PORTAL.y + 16, r: 8, life: 1, col: "#4ade80" });
        } else {
          minesHit++;
          score = Math.max(0, score - 100);
          ripples.push({ x: o.x, y: PORTAL.y + 16, r: 10, life: 1, col: "#f87171" });
        }
        objects.splice(i, 1);
      } else if (o.y < 14) {
        o.y = 14; o.vy = Math.abs(o.vy) * 0.5;
      }
    }

    spawnCd -= dt;
    if (spawnCd <= 0) {
      spawnCd = 0.85;
      if (objects.filter(o => !o.mine).length < 7) spawnObj(false);
      if (objects.filter(o => o.mine).length < 3) spawnObj(true);
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 65 * dt;
      ripples[i].life -= 2.4 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (collected >= targetRelics) {
      won = true; over = true;
      score += Math.round(timeLeft * 25);
    } else if (minesHit >= 3 || timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "rgba(6, 9, 20, 0.36)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Portal
  ctx.fillStyle = "rgba(74,222,128,0.22)";
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.fillRect(PORTAL.x - PORTAL.w / 2, PORTAL.y, PORTAL.w, PORTAL.h);
  ctx.strokeRect(PORTAL.x - PORTAL.w / 2, PORTAL.y, PORTAL.w, PORTAL.h);
  ctx.fillStyle = "#dcfce7";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("PORTAIL CÉLESTE", PORTAL.x, PORTAL.y + 20);

  // Tornado streaks (gT2K)
  ctx.strokeStyle = holding ? "rgba(56, 214, 255, 0.72)" : "rgba(148, 163, 184, 0.5)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const w of wisps) {
    if (w.hasPrev && Math.hypot(w.nx - w.ox, w.ny - w.oy) < 90) {
      ctx.moveTo(w.ox, w.oy);
      ctx.lineTo(w.nx, w.ny);
    }
    w.ox = w.nx; w.oy = w.ny;
  }
  ctx.stroke();

  // Relics & Mines
  for (const o of objects) {
    if (o.mine) {
      ctx.fillStyle = "#ef4444";
      ctx.strokeStyle = "#fca5a5";
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = "#facc15";
      ctx.strokeStyle = "#fef9c3";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Eye target reticle (5zP3)
  if (!over) {
    ctx.strokeStyle = holding ? "#38d6ff" : "#94a3b8";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(eye.x, eye.y, holding ? 22 : 15, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RELIQUES HISSÉES !" : (minesHit >= 3 ? "TROP DE MINES !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Reliques ${collected}/${targetRelics} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
