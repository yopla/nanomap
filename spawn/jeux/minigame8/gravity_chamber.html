<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Chambre Gravitaire 360° (Gravity Chamber)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: grab; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "gravity_chamber",
  "name": "Chambre Gravitaire 360° (Gravity Chamber)",
  "family": "core",
  "icon": "🧭",
  "controls": "Pointeur / glisser, molette ou Flèches / Q-D pour orienter la boussole de gravité à 360° • Clic / Espace pour injecter une rafale de cubes",
  "description": "Fusion du solveur MPM multi-densités (GKFluidS0.as : fluide lourd, gaz ascendant) et de la boussole de gravité orientable (eNqz.as) : faites pivoter la gravité pour drainer le fluide ambre dans la valve basse tout en faisant remonter le gaz cyan vers l'évent opposé.",
  "goal": "Drainer 20 gouttes lourdes (Ambre) et évacuer 20 bulles de gaz (Cyan) en moins de 65 secondes.",
  "fields": [
    { "key": "targetPerType", "label": "Cible par phase", "type": "number", "default": 20 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🧭 Gravité 360°</span>
  <span id="stat">Ambre 0/20 • Gaz 0/20 • 65s</span>
  <div class="bar-btns">
    <button onclick="rotateGrav(Math.PI / 2)" title="Pivoter de 90°">↻ 90°</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointer / Molette / Q-D</b> : orienter la gravité 360° • Le fluide <b>Ambre</b> suit la gravité, le gaz <b>Cyan</b> monte à l'opposé
</div>

<script>
const GAME_ID = "gravity_chamber";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MPM_RES = 32;
const CELL = SIZE / MPM_RES;
const HEAVY_VALVE = { x: 422, y: 422, r: 34 };
const GAS_VENT = { x: 90, y: 90, r: 34 };
const BLOCKS = [
  { x: 140, y: 165, w: 120, h: 18 },
  { x: 252, y: 330, w: 120, h: 18 },
  { x: 185, y: 245, w: 18, h: 100 },
  { x: 310, y: 170, w: 18, h: 100 }
];

let targetPerType = 20, durationSec = 65;
let gravTheta = Math.PI * 0.5;
let particles = [], squares = [], ripples = [];
let heavyDone = 0, gasDone = 0;
let timeLeft = 65, score = 0, won = false, over = false;
let spawnCd = 0;
let ptr = { x: 256, y: 360, down: false };
let keys = {};
let gridM = new Float32Array(MPM_RES * MPM_RES);
let gridU = new Float32Array(MPM_RES * MPM_RES);
let gridV = new Float32Array(MPM_RES * MPM_RES);

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function rotateGrav(delta) {
  gravTheta += delta;
}

function spawnParticle(isGas) {
  particles.push({
    x: 226 + (Math.random() - 0.5) * 70,
    y: 226 + (Math.random() - 0.5) * 70,
    u: (Math.random() - 0.5) * 1.2,
    v: (Math.random() - 0.5) * 1.2,
    mass: isGas ? 0.9 : 2.5,
    gas: isGas
  });
}

function spawnSquare(x, y) {
  const th = Math.random() * Math.PI * 2;
  squares.push({
    x, y,
    vx: Math.cos(th) * 3.2,
    vy: Math.sin(th) * 3.2,
    ang: th,
    life: 10
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetPerType = Math.max(5, Number(custom.targetPerType || 20));
  durationSec = Math.max(20, Number(custom.durationSec || 65));
  gravTheta = Math.PI * 0.5;
  particles = [];
  squares = [];
  ripples = [];
  heavyDone = 0;
  gasDone = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnCd = 0;

  for (let i = 0; i < 48; i++) spawnParticle(i % 2 === 0);
  for (let i = 0; i < 10; i++) spawnSquare(256 + (Math.random() - 0.5) * 80, 256 + (Math.random() - 0.5) * 80);
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Ambre ${heavyDone}/${targetPerType} • Gaz ${gasDone}/${targetPerType} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  gravTheta = Math.atan2(p.y - 256, p.x - 256);
  for (let i = 0; i < 4; i++) spawnSquare(p.x, p.y);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  if (ptr.down || e.pointerType === "mouse") {
    const dx = p.x - 256, dy = p.y - 256;
    if (dx * dx + dy * dy > 144) gravTheta = Math.atan2(dy, dx);
  }
});
window.addEventListener("pointerup", () => { ptr.down = false; });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  gravTheta += Math.sign(e.deltaY) * 0.22;
}, { passive: false });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) {
    for (let i = 0; i < 4; i++) spawnSquare(256, 256);
  }
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function collideRect(obj, rx, ry, rw, rh, rad, bounce) {
  const cx = Math.max(rx, Math.min(rx + rw, obj.x));
  const cy = Math.max(ry, Math.min(ry + rh, obj.y));
  const dx = obj.x - cx, dy = obj.y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 < rad * rad && d2 > 0.0001) {
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    obj.x += nx * (rad - d);
    obj.y += ny * (rad - d);
    const vn = (obj.u ?? obj.vx) * nx + (obj.v ?? obj.vy) * ny;
    if (vn < 0) {
      if ("u" in obj) {
        obj.u -= (1 + bounce) * vn * nx;
        obj.v -= (1 + bounce) * vn * ny;
      } else {
        obj.vx -= (1 + bounce) * vn * nx;
        obj.vy -= (1 + bounce) * vn * ny;
      }
    }
  }
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) gravTheta -= 2.6 * dt;
    if (keys.ArrowRight || keys.KeyD) gravTheta += 2.6 * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) gravTheta = -Math.PI * 0.5;
    if (keys.ArrowDown || keys.KeyS) gravTheta = Math.PI * 0.5;

    const gx = Math.cos(gravTheta) * 0.24;
    const gy = Math.sin(gravTheta) * 0.24;

    // P2G MPM step (GKFluidS0)
    gridM.fill(0); gridU.fill(0); gridV.fill(0);
    for (const p of particles) {
      const ci = Math.max(0, Math.min(MPM_RES - 1, Math.floor(p.x / CELL)));
      const cj = Math.max(0, Math.min(MPM_RES - 1, Math.floor(p.y / CELL)));
      const idx = cj * MPM_RES + ci;
      gridM[idx] += p.mass;
      gridU[idx] += p.u * p.mass;
      gridV[idx] += p.v * p.mass;
    }
    for (let i = 0; i < gridM.length; i++) {
      if (gridM[i] > 0) { gridU[i] /= gridM[i]; gridV[i] /= gridM[i]; }
    }

    // Update particles with MPM density pressure gradient + gravity/buoyancy
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const ci = Math.max(1, Math.min(MPM_RES - 2, Math.floor(p.x / CELL)));
      const cj = Math.max(1, Math.min(MPM_RES - 2, Math.floor(p.y / CELL)));
      const idx = cj * MPM_RES + ci;

      const gradX = (gridM[idx + 1] - gridM[idx - 1]) * 0.11;
      const gradY = (gridM[idx + MPM_RES] - gridM[idx - MPM_RES]) * 0.11;
      const dir = p.gas ? -0.82 : 1.0; // gas floats opposite to gravity

      p.u = p.u * 0.85 + gridU[idx] * 0.15 + gx * dir - gradX;
      p.v = p.v * 0.85 + gridV[idx] * 0.15 + gy * dir - gradY;
      p.u *= 0.985; p.v *= 0.985;
      p.x += p.u; p.y += p.v;

      if (p.x < 10) { p.x = 10; p.u = Math.abs(p.u) * 0.6; }
      if (p.x > SIZE - 10) { p.x = SIZE - 10; p.u = -Math.abs(p.u) * 0.6; }
      if (p.y < 10) { p.y = 10; p.v = Math.abs(p.v) * 0.6; }
      if (p.y > SIZE - 10) { p.y = SIZE - 10; p.v = -Math.abs(p.v) * 0.6; }

      for (const b of BLOCKS) collideRect(p, b.x, b.y, b.w, b.h, 6, 0.5);

      if (!p.gas && Math.hypot(p.x - HEAVY_VALVE.x, p.y - HEAVY_VALVE.y) < HEAVY_VALVE.r) {
        if (heavyDone < targetPerType) heavyDone++;
        score += 90;
        ripples.push({ x: HEAVY_VALVE.x, y: HEAVY_VALVE.y, r: 8, life: 1, col: "#fb923c" });
        particles.splice(i, 1);
      } else if (p.gas && Math.hypot(p.x - GAS_VENT.x, p.y - GAS_VENT.y) < GAS_VENT.r) {
        if (gasDone < targetPerType) gasDone++;
        score += 90;
        ripples.push({ x: GAS_VENT.x, y: GAS_VENT.y, r: 8, life: 1, col: "#22d3ee" });
        particles.splice(i, 1);
      }
    }

    // Update bouncing Starling squares (eNqz)
    for (let i = squares.length - 1; i >= 0; i--) {
      const s = squares[i];
      s.vx += gx * 0.9 - 0.01 * s.vx;
      s.vy += gy * 0.9 - 0.01 * s.vy;
      s.x += s.vx; s.y += s.vy;
      s.ang += 0.05;
      s.life -= dt;
      if (s.x < 8) { s.x = 8; s.vx *= -0.88; s.vy += (Math.random() - 0.5) * 0.4; }
      if (s.x > SIZE - 8) { s.x = SIZE - 8; s.vx *= -0.88; s.vy += (Math.random() - 0.5) * 0.4; }
      if (s.y < 8) { s.y = 8; s.vy *= -0.88; s.vx += (Math.random() - 0.5) * 0.4; }
      if (s.y > SIZE - 8) { s.y = SIZE - 8; s.vy *= -0.88; s.vx += (Math.random() - 0.5) * 0.4; }
      for (const b of BLOCKS) collideRect(s, b.x, b.y, b.w, b.h, 5, 0.85);
      // Squares nudge nearby fluid
      for (const p of particles) {
        const dx = p.x - s.x, dy = p.y - s.y;
        if (dx * dx + dy * dy < 196) {
          p.u += s.vx * 0.15;
          p.v += s.vy * 0.15;
        }
      }
      if (s.life <= 0) squares.splice(i, 1);
    }

    spawnCd -= dt;
    if (spawnCd <= 0 && particles.length < 95) {
      spawnCd = 0.28;
      if (heavyDone < targetPerType) spawnParticle(false);
      if (gasDone < targetPerType) spawnParticle(true);
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].r += 55 * dt;
      ripples[i].life -= 2.2 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (heavyDone >= targetPerType && gasDone >= targetPerType) {
      won = true; over = true;
      score += Math.round(timeLeft * 25);
    } else if (timeLeft <= 0) {
      won = false; over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Valve (heavy amber) & Vent (gas cyan)
  ctx.fillStyle = "rgba(251,146,60,0.16)";
  ctx.strokeStyle = "#fb923c";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(HEAVY_VALVE.x, HEAVY_VALVE.y, HEAVY_VALVE.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fed7aa";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`AMBRE ${heavyDone}/${targetPerType}`, HEAVY_VALVE.x, HEAVY_VALVE.y + 4);

  ctx.fillStyle = "rgba(34,211,238,0.16)";
  ctx.strokeStyle = "#22d3ee";
  ctx.beginPath(); ctx.arc(GAS_VENT.x, GAS_VENT.y, GAS_VENT.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#cffafe";
  ctx.fillText(`GAZ ${gasDone}/${targetPerType}`, GAS_VENT.x, GAS_VENT.y + 4);

  // Chamber blocks
  for (const b of BLOCKS) {
    ctx.fillStyle = "#172b47";
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 1.5;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Fluid & gas
  for (const p of particles) {
    ctx.fillStyle = p.gas ? "rgba(34,211,238,0.85)" : "rgba(251,146,60,0.92)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.gas ? 4.5 : 5.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bouncing Starling squares
  for (const s of squares) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.restore();
  }

  for (const rp of ripples) {
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Center Gravity Compass (eNqz)
  ctx.save();
  ctx.translate(256, 256);
  ctx.fillStyle = "rgba(10,18,36,0.75)";
  ctx.strokeStyle = "#f43f5e";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(gravTheta) * 24, Math.sin(gravTheta) * 24);
  ctx.strokeStyle = "#fb923c";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-Math.cos(gravTheta) * 18, -Math.sin(gravTheta) * 18);
  ctx.strokeStyle = "#22d3ee";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CHAMBRE PURGÉE !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Ambre ${heavyDone}/${targetPerType} • Gaz ${gasDone}/${targetPerType} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
