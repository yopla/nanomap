<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Dômes Élastiques (Melon Domes)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #f472b6; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #f472b6; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(244,114,182,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "melon_domes",
  "name": "Dômes Élastiques (Melon Domes)",
  "family": "topMouseMut",
  "icon": "🍈",
  "controls": "Cliquer/glisser pour déployer un dôme élastique et l'étirer • Survoler / cliquer ou Espace pour émettre une onde harmonique (ZQSD déplace le curseur)",
  "description": "Adapté de melon.as (Dome, Disk et Oscillator harmoniques) : tracez des membranes élastiques en anneaux concentriques qui vibrent et capturent le pollen doré tout en repoussant les épines rouges.",
  "goal": "Capturer 24 pollens dorés par résonance en moins de 60 secondes sans laisser 3 épines percer vos dômes.",
  "fields": [
    { "key": "targetOrbs", "label": "Pollens à capturer", "type": "number", "default": 24 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🍈 Melon Domes</span>
  <span id="stat">Pollens 0/24 • Épines 0/3 • 60s</span>
  <div class="bar-btns">
    <button onclick="resonancePulse()" title="Onde de résonance globale (Espace)">〰️ Onde</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Cliquer-glisser</b> : créer un dôme élastique sur le pollen • <b>Espace / Clic</b> : onde harmonique qui capture l'or et chasse le rouge
</div>

<script>
const GAME_ID = "melon_domes";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetOrbs = 24, durationSec = 60;
let domes = [], orbs = [], thorns = [], waves = [];
let drag = null;
let ptr = { x: 256, y: 256 };
let keys = {};
let captured = 0, hits = 0, timeLeft = 60, score = 0, won = false, over = false;
let spawnOrbT = 0, spawnThornT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function addDome(x, y, r) {
  const rad = Math.max(38, Math.min(110, r));
  domes.push({
    x, y, r: rad,
    amp: 1.0, vAmp: 4.5, phase: 0,
    ox: 0, oy: 0, vx: 0, vy: 0,
    rings: 7, segs: 16
  });
  if (domes.length > 3) domes.shift();
  waves.push({ x, y, r: rad * 0.4, maxR: rad * 1.9, life: 1, col: "#f472b6" });
}

function resonancePulse() {
  if (over) return;
  if (domes.length === 0) addDome(ptr.x, ptr.y, 70);
  for (const d of domes) {
    d.vAmp += 7.5;
    d.amp = Math.max(d.amp, 0.7);
    waves.push({ x: d.x, y: d.y, r: d.r * 0.35, maxR: d.r * 2.25, life: 1, col: "#38d6ff" });
  }
}

function spawnOrb() {
  orbs.push({
    x: 42 + Math.random() * (SIZE - 84),
    y: 42 + Math.random() * (SIZE - 84),
    vx: (Math.random() - 0.5) * 42,
    vy: (Math.random() - 0.5) * 42,
    r: 8,
    pulse: Math.random() * 6
  });
}

function spawnThorn() {
  const side = Math.floor(Math.random() * 4);
  let x = 256, y = 256;
  if (side === 0) { x = Math.random() * SIZE; y = 14; }
  else if (side === 1) { x = SIZE - 14; y = Math.random() * SIZE; }
  else if (side === 2) { x = Math.random() * SIZE; y = SIZE - 14; }
  else { x = 14; y = Math.random() * SIZE; }
  const target = domes.length ? domes[Math.floor(Math.random() * domes.length)] : { x: 256, y: 256 };
  const ang = Math.atan2(target.y - y, target.x - x) + (Math.random() - 0.5) * 0.35;
  const sp = 58 + Math.random() * 36;
  thorns.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 9.5, rot: 0 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetOrbs = Math.max(5, Number(custom.targetOrbs || 24));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  domes = [];
  addDome(175, 256, 68);
  addDome(337, 256, 68);
  orbs = [];
  thorns = [];
  waves = [];
  for (let i = 0; i < 7; i++) spawnOrb();
  spawnThorn();
  drag = null;
  ptr = { x: 256, y: 256 };
  captured = 0;
  hits = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnOrbT = 0;
  spawnThornT = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `Pollens ${captured}/${targetOrbs} • Épines ${hits}/3 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  drag = { x: p.x, y: p.y, r: 12 };
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  const dx = p.x - ptr.x, dy = p.y - ptr.y;
  ptr.x = p.x; ptr.y = p.y;
  if (drag) {
    drag.r = Math.min(115, Math.hypot(p.x - drag.x, p.y - drag.y));
  } else {
    for (const d of domes) {
      if (Math.hypot(p.x - d.x, p.y - d.y) < d.r) {
        d.vx += dx * 2.4;
        d.vy += dy * 2.4;
        d.vAmp = Math.min(9, d.vAmp + Math.hypot(dx, dy) * 0.08);
      }
    }
  }
});
window.addEventListener("pointerup", () => {
  if (!drag) return;
  if (drag.r > 22) {
    addDome(drag.x, drag.y, drag.r);
  } else {
    addDome(drag.x, drag.y, 64);
    resonancePulse();
  }
  drag = null;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) {
    addDome(ptr.x, ptr.y, 72);
    resonancePulse();
  }
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      ptr.x = Math.max(24, Math.min(SIZE - 24, ptr.x + (kx / m) * 290 * dt));
      ptr.y = Math.max(24, Math.min(SIZE - 24, ptr.y + (ky / m) * 290 * dt));
      for (const d of domes) {
        if (Math.hypot(ptr.x - d.x, ptr.y - d.y) < d.r) {
          d.vx += (kx / m) * 140 * dt;
          d.vy += (ky / m) * 140 * dt;
          d.vAmp = Math.min(8, d.vAmp + 4 * dt);
        }
      }
    }

    spawnOrbT += dt;
    if (spawnOrbT >= 0.9 && orbs.length < 11) { spawnOrbT = 0; spawnOrb(); }
    spawnThornT += dt;
    if (spawnThornT >= 2.25 && thorns.length < 6) { spawnThornT = 0; spawnThorn(); }

    // Update domes harmonic oscillators (melon.as Dome/Oscillator)
    for (const d of domes) {
      d.phase += dt * 7.5;
      d.vAmp += (-d.amp * 14 - d.vAmp * 1.9) * dt;
      d.amp = Math.max(-1.4, Math.min(1.6, d.amp + d.vAmp * dt));
      d.vx += (-d.ox * 52 - d.vx * 4.5) * dt;
      d.vy += (-d.oy * 52 - d.vy * 4.5) * dt;
      d.ox = Math.max(-28, Math.min(28, d.ox + d.vx * dt));
      d.oy = Math.max(-28, Math.min(28, d.oy + d.vy * dt));
    }

    // Expanding harmonic waves interact with orbs and thorns
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.r += 230 * dt;
      w.life = Math.max(0, 1 - w.r / w.maxR);
      for (let j = orbs.length - 1; j >= 0; j--) {
        const o = orbs[j];
        if (Math.abs(Math.hypot(o.x - w.x, o.y - w.y) - w.r) < 18) {
          captured++;
          score += 65;
          waves.push({ x: o.x, y: o.y, r: 4, maxR: 36, life: 1, col: "#facc15" });
          orbs.splice(j, 1);
          spawnOrb();
          if (captured >= targetOrbs) {
            won = true;
            over = true;
            score += Math.round(timeLeft * 20);
          }
        }
      }
      for (let j = thorns.length - 1; j >= 0; j--) {
        const t = thorns[j];
        const dx = t.x - w.x, dy = t.y - w.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (Math.abs(dist - w.r) < 20) {
          t.vx += (dx / dist) * 210;
          t.vy += (dy / dist) * 210;
          t.repelled = true;
        }
      }
      if (w.life <= 0) waves.splice(i, 1);
    }

    // Update orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.pulse += dt * 4;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      if (o.x < 16 || o.x > SIZE - 16) o.vx *= -1;
      if (o.y < 16 || o.y > SIZE - 16) o.vy *= -1;
      // Active oscillating dome also captures overlapping orbs
      for (const d of domes) {
        const activity = Math.abs(d.amp) + Math.abs(d.vAmp) * 0.25 + Math.hypot(d.ox, d.oy) * 0.05;
        if (activity > 0.35 && Math.hypot(o.x - d.x, o.y - d.y) < d.r * 0.92) {
          captured++;
          score += 55;
          waves.push({ x: o.x, y: o.y, r: 4, maxR: 34, life: 1, col: "#facc15" });
          orbs.splice(i, 1);
          spawnOrb();
          if (captured >= targetOrbs) {
            won = true;
            over = true;
            score += Math.round(timeLeft * 20);
          }
          break;
        }
      }
    }

    // Update thorns
    for (let i = thorns.length - 1; i >= 0; i--) {
      const t = thorns[i];
      t.rot += dt * 3;
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.repelled && (t.x < -12 || t.x > SIZE + 12 || t.y < -12 || t.y > SIZE + 12)) {
        score += 20;
        thorns.splice(i, 1);
        continue;
      }
      if (t.x < 10) { t.x = 10; t.vx = Math.abs(t.vx); }
      if (t.x > SIZE - 10) { t.x = SIZE - 10; t.vx = -Math.abs(t.vx); }
      if (t.y < 10) { t.y = 10; t.vy = Math.abs(t.vy); }
      if (t.y > SIZE - 10) { t.y = SIZE - 10; t.vy = -Math.abs(t.vy); }

      for (let di = domes.length - 1; di >= 0; di--) {
        const d = domes[di];
        if (Math.hypot(t.x - d.x, t.y - d.y) < 22) {
          hits++;
          d.vAmp = -8;
          waves.push({ x: d.x, y: d.y, r: 8, maxR: 90, life: 1, col: "#ef4444" });
          thorns.splice(i, 1);
          if (hits >= 3) {
            won = false;
            over = true;
          }
          break;
        }
      }
    }

    if (timeLeft <= 0 && !over) {
      won = captured >= targetOrbs;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Subtle background warped grid
  ctx.strokeStyle = "rgba(56, 189, 248, 0.10)";
  ctx.lineWidth = 1;
  for (let g = 32; g < SIZE; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(SIZE, g); ctx.stroke();
  }

  // Render elastic melon domes (concentric warped rings + radials)
  for (const d of domes) {
    const wobble = Math.sin(d.phase) * d.amp * 0.22;
    for (let rIdx = d.rings; rIdx >= 1; rIdx--) {
      const frac = rIdx / d.rings;
      const rad = d.r * frac * (1 + wobble * Math.sin(frac * Math.PI));
      const cx = d.x + d.ox * (1 - frac * 0.55);
      const cy = d.y + d.oy * (1 - frac * 0.55);
      ctx.strokeStyle = rIdx === d.rings ? "#f472b6" : `rgba(56, 214, 255, ${0.22 + (1 - frac) * 0.55})`;
      ctx.fillStyle = `rgba(244, 114, 182, ${0.04 + (1 - frac) * 0.05})`;
      ctx.lineWidth = rIdx === d.rings ? 2 : 1.1;
      ctx.beginPath();
      for (let s = 0; s <= d.segs; s++) {
        const ang = (s / d.segs) * Math.PI * 2;
        const localR = rad * (1 + Math.sin(ang * 3 + d.phase) * d.amp * 0.06);
        const vx = cx + Math.cos(ang) * localR;
        const vy = cy + Math.sin(ang) * localR;
        if (s === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // Core pivot
    ctx.fillStyle = "#f472b6";
    ctx.beginPath(); ctx.arc(d.x + d.ox, d.y + d.oy, 5, 0, Math.PI * 2); ctx.fill();
  }

  // Drag preview circle (exact melon.as onDown/mouseMove feedback)
  if (drag) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(drag.x, drag.y, drag.r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Waves
  for (const w of waves) {
    ctx.strokeStyle = w.col;
    ctx.globalAlpha = Math.max(0, w.life);
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Golden orbs
  for (const o of orbs) {
    const r = o.r + Math.sin(o.pulse) * 1.3;
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(o.x - 2, o.y - 2, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  // Red thorns
  for (const t of thorns) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      const rad = k % 2 === 0 ? t.r + 3 : t.r - 3.5;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Cursor marker for keyboard/pointer clarity
  if (!over && !drag) {
    ctx.strokeStyle = "rgba(244, 114, 182, 0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 10, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RÉSONANCE PARFAITE !" : (hits >= 3 ? "DÔMES PERCÉS !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Pollens ${captured}/${targetOrbs} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
