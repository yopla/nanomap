<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Tentacule Danseur (IK Marionette)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fb7185; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #fb7185; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,113,133,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tentacle_dancer",
  "name": "Tentacule Danseur (IK Marionette)",
  "family": "topMouseHnS",
  "icon": "🐙",
  "controls": "Pointeur / glisser ou ZQSD pour guider le bras IK marionnette • Clic ou Espace pour fouetter et repousser les parasites rouges",
  "description": "Fusion du module 8A_tentacule_danseur (corp.as, tentacle.as, TailLine.as, glob.as, com.as), de rBnH.as et du poulpe sinusoïdal 192P.as : pilotez votre tentacule en cinématique inverse pour cueillir le plancton doré tout en balayant les parasites.",
  "goal": "Attraper 28 notes de plancton doré en moins de 65 secondes sans perdre vos 3 cœurs face aux parasites rouges.",
  "fields": [
    { "key": "targetNotes", "label": "Plancton à attraper", "type": "number", "default": 28 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🐙 Tentacle Dancer</span>
  <span id="stat">Notes 0/28 • ♥♥♥ • 65s</span>
  <div class="bar-btns">
    <button onclick="whipPulse()" title="Coup de fouet IK (Espace)">⚡ Fouet</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : piloter la marionnette IK sur les <b>notes or</b> • <b>Clic / Espace</b> : onde de fouet contre les <b>parasites rouges</b>
</div>

<script>
const GAME_ID = "tentacle_dancer";
const SIZE = 512;
const CORE = { x: 256, y: 268 };
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetNotes = 28, durationSec = 65;
let ikArm = [], dancers = [];
let notes = [], parasites = [], bursts = [];
let ptr = { x: 256, y: 120 };
let keys = {};
let caught = 0, lives = 3, timeLeft = 65, score = 0, won = false, over = false;
let animT = 0, whipTimer = 0, invuln = 0, spawnNoteT = 0, spawnParaT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function buildRig() {
  // Primary IK marionette arm (rBnH.as + TailLine.as) anchored at CORE
  ikArm = [];
  const segCount = 13;
  const segLen = 17;
  for (let i = 0; i <= segCount; i++) {
    ikArm.push({ x: CORE.x, y: CORE.y - i * segLen, len: segLen });
  }
  // 5 sinusoidal dancing companion tentacles (corp.as / 192P.as)
  dancers = [];
  for (let d = 0; d < 5; d++) {
    const baseAngle = -Math.PI + ((d + 0.5) / 5) * Math.PI * 2;
    dancers.push({
      baseAngle,
      phase: d * 1.3,
      nodes: 10,
      segLen: 10,
      pts: []
    });
  }
}

function solveIK(targetX, targetY) {
  const n = ikArm.length - 1;
  // Forward pass from tip toward target
  ikArm[n].x = targetX;
  ikArm[n].y = targetY;
  for (let i = n - 1; i >= 0; i--) {
    const dx = ikArm[i].x - ikArm[i + 1].x;
    const dy = ikArm[i].y - ikArm[i + 1].y;
    const ang = Math.atan2(dy, dx);
    ikArm[i].x = ikArm[i + 1].x + Math.cos(ang) * ikArm[i].len;
    ikArm[i].y = ikArm[i + 1].y + Math.sin(ang) * ikArm[i].len;
  }
  // Backward pass pinned to CORE
  ikArm[0].x = CORE.x;
  ikArm[0].y = CORE.y;
  for (let i = 0; i < n; i++) {
    const dx = ikArm[i + 1].x - ikArm[i].x;
    const dy = ikArm[i + 1].y - ikArm[i].y;
    const ang = Math.atan2(dy, dx);
    ikArm[i + 1].x = ikArm[i].x + Math.cos(ang) * ikArm[i].len;
    ikArm[i + 1].y = ikArm[i].y + Math.sin(ang) * ikArm[i].len;
  }
}

function whipPulse() {
  if (over || whipTimer > 0.15) return;
  whipTimer = 0.42;
  const tip = ikArm[ikArm.length - 1];
  bursts.push({ x: tip.x, y: tip.y, r: 10, maxR: 92, life: 1, col: "#38d6ff" });
  for (let i = parasites.length - 1; i >= 0; i--) {
    const p = parasites[i];
    if (Math.hypot(p.x - tip.x, p.y - tip.y) < 92) {
      score += 45;
      bursts.push({ x: p.x, y: p.y, r: 6, maxR: 42, life: 1, col: "#fb7185" });
      parasites.splice(i, 1);
    }
  }
}

function spawnNote() {
  const ang = Math.random() * Math.PI * 2;
  const dist = 75 + Math.random() * 145;
  notes.push({
    x: CORE.x + Math.cos(ang) * dist,
    y: CORE.y + Math.sin(ang) * dist,
    ang,
    dist,
    omega: (Math.random() < 0.5 ? 1 : -1) * (0.45 + Math.random() * 0.55),
    r: 8.5,
    pulse: Math.random() * 6
  });
}

function spawnParasite() {
  const ang = Math.random() * Math.PI * 2;
  const x = CORE.x + Math.cos(ang) * 260;
  const y = CORE.y + Math.sin(ang) * 260;
  const sp = 56 + Math.random() * 26;
  parasites.push({
    x, y,
    vx: -Math.cos(ang) * sp,
    vy: -Math.sin(ang) * sp,
    r: 10,
    wob: Math.random() * 6
  });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetNotes = Math.max(5, Number(custom.targetNotes || 28));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  buildRig();
  solveIK(256, 110);
  notes = [];
  parasites = [];
  bursts = [];
  for (let i = 0; i < 6; i++) spawnNote();
  spawnParasite();
  ptr = { x: 256, y: 110 };
  caught = 0;
  lives = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  animT = 0;
  whipTimer = 0;
  invuln = 0;
  spawnNoteT = 0;
  spawnParaT = 0;
  updateHud();
}

function updateHud() {
  const hearts = "♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives));
  document.getElementById("stat").textContent = `Notes ${caught}/${targetNotes} • ${hearts} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  whipPulse();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) whipPulse();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    animT += dt;
    whipTimer = Math.max(0, whipTimer - dt);
    invuln = Math.max(0, invuln - dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      ptr.x = Math.max(16, Math.min(SIZE - 16, ptr.x + (kx / m) * 310 * dt));
      ptr.y = Math.max(16, Math.min(SIZE - 16, ptr.y + (ky / m) * 310 * dt));
    }

    solveIK(ptr.x, ptr.y);

    // Sinusoidal dancing tentacles (corp.as + 192P.as)
    for (const d of dancers) {
      d.pts = [{ x: CORE.x, y: CORE.y }];
      let a = d.baseAngle + Math.sin(animT * 2.3 + d.phase) * 0.35;
      let cx = CORE.x, cy = CORE.y;
      for (let i = 1; i <= d.nodes; i++) {
        a += Math.sin(animT * 4.2 + d.phase - i * 0.45) * 0.24;
        cx += Math.cos(a) * d.segLen;
        cy += Math.sin(a) * d.segLen;
        d.pts.push({ x: cx, y: cy });
      }
    }

    spawnNoteT += dt;
    if (spawnNoteT >= 0.85 && notes.length < 9) { spawnNoteT = 0; spawnNote(); }
    spawnParaT += dt;
    if (spawnParaT >= 1.9 && parasites.length < 5) { spawnParaT = 0; spawnParasite(); }

    // Catch golden notes with IK arm nodes
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i];
      n.pulse += dt * 4.5;
      n.ang += n.omega * dt;
      n.x = CORE.x + Math.cos(n.ang) * n.dist;
      n.y = CORE.y + Math.sin(n.ang) * n.dist;
      for (let s = 4; s < ikArm.length; s++) {
        if (Math.hypot(n.x - ikArm[s].x, n.y - ikArm[s].y) < n.r + (s === ikArm.length - 1 ? 16 : 9)) {
          caught++;
          score += 75;
          bursts.push({ x: n.x, y: n.y, r: 5, maxR: 36, life: 1, col: "#facc15" });
          notes.splice(i, 1);
          spawnNote();
          if (caught >= targetNotes) {
            won = true;
            over = true;
            score += Math.round(timeLeft * 20);
          }
          break;
        }
      }
    }

    // Parasites approach CORE; IK tip sweeps or whipPulse knocks them out
    const tip = ikArm[ikArm.length - 1];
    for (let i = parasites.length - 1; i >= 0; i--) {
      const p = parasites[i];
      p.wob += dt * 6;
      const dx = CORE.x - p.x, dy = CORE.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      p.x += (dx / d) * 58 * dt + Math.cos(p.wob) * 18 * dt;
      p.y += (dy / d) * 58 * dt + Math.sin(p.wob) * 18 * dt;

      if (whipTimer > 0 && Math.hypot(p.x - tip.x, p.y - tip.y) < 34) {
        score += 45;
        bursts.push({ x: p.x, y: p.y, r: 6, maxR: 40, life: 1, col: "#fb7185" });
        parasites.splice(i, 1);
        continue;
      }

      if (d < 26) {
        if (invuln <= 0) {
          lives--;
          invuln = 1.3;
          bursts.push({ x: CORE.x, y: CORE.y, r: 12, maxR: 58, life: 1, col: "#ef4444" });
          if (lives <= 0) {
            won = false;
            over = true;
          }
        }
        parasites.splice(i, 1);
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 180 * dt;
      bursts[i].life -= 2.5 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = caught >= targetNotes;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Faint reach circle
  ctx.strokeStyle = "rgba(251, 113, 133, 0.14)";
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(CORE.x, CORE.y, 221, 0, Math.PI * 2); ctx.stroke();

  // Sinusoidal dancing companion tentacles
  for (const d of dancers) {
    for (let i = 0; i < d.pts.length - 1; i++) {
      const a = d.pts[i], b = d.pts[i + 1];
      ctx.strokeStyle = `rgba(167, 139, 250, ${0.7 - i * 0.045})`;
      ctx.lineWidth = Math.max(1.5, 9 - i * 0.75);
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  // Primary IK marionette arm
  for (let i = 0; i < ikArm.length - 1; i++) {
    const a = ikArm[i], b = ikArm[i + 1];
    ctx.strokeStyle = whipTimer > 0 ? "#38d6ff" : "#fb7185";
    ctx.lineWidth = Math.max(3, 14 - i * 0.8);
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const tip = ikArm[ikArm.length - 1];
  ctx.fillStyle = whipTimer > 0 ? "#67e8f9" : "#fda4af";
  ctx.beginPath(); ctx.arc(tip.x, tip.y, whipTimer > 0 ? 10 : 7, 0, Math.PI * 2); ctx.fill();

  // Creature Core
  if (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0) {
    ctx.fillStyle = "#be123c";
    ctx.strokeStyle = "#fda4af";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(CORE.x, CORE.y, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(CORE.x - 6, CORE.y - 4, 3.2, 0, Math.PI * 2);
    ctx.arc(CORE.x + 6, CORE.y - 4, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#090d16";
    ctx.beginPath();
    ctx.arc(CORE.x - 6, CORE.y - 4, 1.5, 0, Math.PI * 2);
    ctx.arc(CORE.x + 6, CORE.y - 4, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Notes
  for (const n of notes) {
    const r = n.r + Math.sin(n.pulse) * 1.4;
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(n.x - 2, n.y - 2, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  // Parasites
  for (const p of parasites) {
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Bursts
  for (const br of bursts) {
    ctx.strokeStyle = br.col;
    ctx.globalAlpha = Math.max(0, br.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(br.x, br.y, br.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "DANSE TRIOMPHANTE !" : (lives <= 0 ? "NOYAU SUBMERGÉ" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Notes ${caught}/${targetNotes} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
