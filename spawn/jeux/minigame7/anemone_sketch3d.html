<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Anémone 3D & Esquisse (Anemone 3D)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #38d6ff; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #38d6ff; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(56,214,255,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "anemone_sketch3d",
  "name": "Anémone 3D & Esquisse (Anemone 3D)",
  "family": "core",
  "icon": "🪸",
  "controls": "Pointeur / glisser ou ZQSD pour guider les tentacules IK 3D sur les nœuds lumineux • Clic ou Espace pour faire tourner l'anémone 3D et balayer l'esquisse",
  "description": "Fusion de l'anémone IK 3D (oqvNz.as SegmentList3D) et du dessin organique vibrant (pBrS.as) : orientez les tentacules 3D vers chaque nœud pour faire éclore 4 silhouettes marines animées en filaments vibrants.",
  "goal": "Compléter les 4 silhouettes organiques (Étoile, Spirale, Méduse, Corail) en moins de 65 secondes.",
  "fields": [
    { "key": "targetFigures", "label": "Silhouettes à tracer", "type": "number", "default": 4 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🪸 Anemone 3D</span>
  <span id="stat">Figure 1/4 • Nœuds 0/10 • 65s</span>
  <div class="bar-btns">
    <button onclick="spinBurst()" title="Rotation & balayage 3D (Espace)">🔄 Orbite</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : toucher les <b>nœuds dorés</b> avec les tentacules 3D • <b>Clic / Espace</b> : rotation 3D qui balaie les nœuds proches
</div>

<script>
const GAME_ID = "anemone_sketch3d";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetFigures = 4, durationSec = 65;
let limbs = [], nodes = [], bursts = [];
let figIdx = 0, yaw = 0, pitch = 0.35, spinBoost = 0;
let ptr = { x: 256, y: 256 };
let keys = {};
let timeLeft = 65, score = 0, won = false, over = false;
let animT = 0;

const FIGURE_NAMES = ["Étoile de mer", "Spirale", "Méduse", "Corail"];

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function buildFigureNodes(idx) {
  nodes = [];
  const kind = idx % 4;
  const count = 10;
  for (let i = 0; i < count; i++) {
    let x = 256, y = 256, z = 0;
    if (kind === 0) {
      // Starfish
      const a = (i / count) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 === 0 ? 175 : 85;
      x = 256 + Math.cos(a) * r;
      y = 256 + Math.sin(a) * r;
    } else if (kind === 1) {
      // Spiral
      const t = (i / (count - 1)) * Math.PI * 2.5;
      const r = 45 + i * 14.5;
      x = 256 + Math.cos(t) * r;
      y = 256 + Math.sin(t) * r;
    } else if (kind === 2) {
      // Jellyfish dome + tentacles
      if (i < 6) {
        const a = Math.PI + (i / 5) * Math.PI;
        x = 256 + Math.cos(a) * 145;
        y = 210 + Math.sin(a) * 115;
      } else {
        const col = i - 6;
        x = 166 + col * 60;
        y = 335 + (col % 2) * 45;
      }
    } else {
      // Coral crown
      const a = -Math.PI * 0.88 + (i / (count - 1)) * Math.PI * 0.76;
      const r = i % 2 === 0 ? 180 : 120;
      x = 256 + Math.cos(a) * r;
      y = 350 + Math.sin(a) * r * 1.15;
    }
    nodes.push({ x, y, lit: false, pulse: i * 0.6 });
  }
}

function build3DLimbs() {
  limbs = [];
  const limbCount = 5;
  const segCount = 8;
  const segLen = 22;
  for (let l = 0; l < limbCount; l++) {
    const baseA = (l / limbCount) * Math.PI * 2;
    const pts = [];
    for (let s = 0; s <= segCount; s++) {
      pts.push({
        x: Math.cos(baseA) * s * segLen * 0.5,
        y: Math.sin(baseA) * s * segLen * 0.5,
        z: (s - segCount * 0.5) * 8,
        len: segLen
      });
    }
    limbs.push({ pts, baseA, hue: 185 + l * 22 });
  }
}

function reach3D(limb, tx, ty, tz) {
  const pts = limb.pts;
  const n = pts.length - 1;
  pts[n].x = tx; pts[n].y = ty; pts[n].z = tz;
  for (let i = n - 1; i >= 0; i--) {
    const dx = pts[i].x - pts[i + 1].x;
    const dy = pts[i].y - pts[i + 1].y;
    const dz = pts[i].z - pts[i + 1].z;
    const d = Math.hypot(dx, dy, dz) || 1;
    pts[i].x = pts[i + 1].x + (dx / d) * pts[i].len;
    pts[i].y = pts[i + 1].y + (dy / d) * pts[i].len;
    pts[i].z = pts[i + 1].z + (dz / d) * pts[i].len;
  }
  pts[0].x = 0; pts[0].y = 0; pts[0].z = 0;
  for (let i = 0; i < n; i++) {
    const dx = pts[i + 1].x - pts[i].x;
    const dy = pts[i + 1].y - pts[i].y;
    const dz = pts[i + 1].z - pts[i].z;
    const d = Math.hypot(dx, dy, dz) || 1;
    pts[i + 1].x = pts[i].x + (dx / d) * pts[i].len;
    pts[i + 1].y = pts[i].y + (dy / d) * pts[i].len;
    pts[i + 1].z = pts[i].z + (dz / d) * pts[i].len;
  }
}

function project3D(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p.x * cy - p.z * sy;
  const z1 = p.x * sy + p.z * cy;
  const y2 = p.y * cp - z1 * sp;
  const z2 = p.y * sp + z1 * cp;
  const scale = 380 / (380 + z2);
  return { x: 256 + x1 * scale, y: 256 + y2 * scale, z: z2, scale };
}

function spinBurst() {
  if (over) return;
  spinBoost = 4.2;
  bursts.push({ x: 256, y: 256, r: 24, maxR: 210, life: 1, col: "#38d6ff" });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetFigures = Math.max(1, Number(custom.targetFigures || 4));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  figIdx = 0;
  yaw = 0;
  pitch = 0.35;
  spinBoost = 0;
  build3DLimbs();
  buildFigureNodes(0);
  bursts = [];
  ptr = { x: 256, y: 256 };
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  animT = 0;
  updateHud();
}

function updateHud() {
  const lit = nodes.filter(n => n.lit).length;
  const name = FIGURE_NAMES[figIdx % FIGURE_NAMES.length];
  document.getElementById("stat").textContent =
    `${name} (${Math.min(targetFigures, figIdx + 1)}/${targetFigures}) • ${lit}/${nodes.length} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  spinBurst();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) spinBurst();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    animT += dt;
    spinBoost = Math.max(0, spinBoost - dt * 4.5);
    yaw += (0.55 + spinBoost * 1.4) * dt;
    pitch = 0.35 + Math.sin(animT * 0.7) * 0.22;

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      ptr.x = Math.max(20, Math.min(SIZE - 20, ptr.x + (kx / m) * 300 * dt));
      ptr.y = Math.max(20, Math.min(SIZE - 20, ptr.y + (ky / m) * 300 * dt));
    }

    // Map pointer into 3D target space rotated cleanly back to world space
    const dx = ptr.x - 256, dy = ptr.y - 256;
    const cy = Math.cos(-yaw), sy = Math.sin(-yaw);
    const txBase = dx * cy;
    const tzBase = dx * sy;

    for (let l = 0; l < limbs.length; l++) {
      const lb = limbs[l];
      const offA = lb.baseA + animT * 1.4;
      const ox = l === 0 ? txBase : txBase * 0.55 + Math.cos(offA) * 85;
      const oy = l === 0 ? dy : dy * 0.55 + Math.sin(offA) * 85;
      const oz = l === 0 ? tzBase : tzBase * 0.55 + Math.sin(offA * 1.3) * 70;
      reach3D(lb, ox, oy, oz);
    }

    // Check projected IK tips against silhouette nodes
    const tipScreens = limbs.map(lb => project3D(lb.pts[lb.pts.length - 1]));
    for (const nd of nodes) {
      nd.pulse += dt * 4;
      if (nd.lit) continue;
      for (let t = 0; t < tipScreens.length; t++) {
        const ts = tipScreens[t];
        const hitR = t === 0 ? 30 : (spinBoost > 0.3 ? 34 : 22);
        if (Math.hypot(nd.x - ts.x, nd.y - ts.y) < hitR || Math.hypot(nd.x - ptr.x, nd.y - ptr.y) < 20) {
          nd.lit = true;
          score += 60;
          bursts.push({ x: nd.x, y: nd.y, r: 5, maxR: 38, life: 1, col: "#facc15" });
          break;
        }
      }
    }

    if (nodes.every(n => n.lit)) {
      score += 220;
      figIdx++;
      bursts.push({ x: 256, y: 256, r: 20, maxR: 250, life: 1, col: "#4ade80" });
      if (figIdx >= targetFigures) {
        won = true;
        over = true;
        score += Math.round(timeLeft * 20);
      } else {
        buildFigureNodes(figIdx);
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 190 * dt;
      bursts[i].life -= 2.3 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = figIdx >= targetFigures;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Constellation guide lines + vibrating organic curves on lit edges (pBrS.as)
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i], b = nodes[(i + 1) % nodes.length];
    if (figIdx % 4 === 1 && i === nodes.length - 1) continue;
    if (figIdx % 4 === 2 && i === 5) continue;
    const bothLit = a.lit && b.lit;
    ctx.strokeStyle = bothLit ? "rgba(74, 222, 128, 0.78)" : "rgba(56, 214, 255, 0.22)";
    ctx.lineWidth = bothLit ? 2.4 : 1.3;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    if (bothLit) {
      const mx = (a.x + b.x) * 0.5 + Math.sin(animT * 9 + i) * 10;
      const my = (a.y + b.y) * 0.5 + Math.cos(animT * 8 + i) * 10;
      ctx.quadraticCurveTo(mx, my, b.x, b.y);
    } else {
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  // Silhouette nodes
  for (const nd of nodes) {
    const r = (nd.lit ? 8 : 7) + Math.sin(nd.pulse) * 1.4;
    ctx.fillStyle = nd.lit ? "#4ade80" : "#facc15";
    ctx.beginPath(); ctx.arc(nd.x, nd.y, r, 0, Math.PI * 2); ctx.fill();
    if (!nd.lit) {
      ctx.strokeStyle = "rgba(250, 204, 21, 0.45)";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, r + 5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // 3D IK Anemone limbs (oqvNz.as)
  for (let l = 0; l < limbs.length; l++) {
    const lb = limbs[l];
    const proj = lb.pts.map(project3D);
    for (let i = 0; i < proj.length - 1; i++) {
      const a = proj[i], b = proj[i + 1];
      ctx.strokeStyle = l === 0 ? "#38d6ff" : `hsla(${lb.hue}, 88%, 64%, 0.78)`;
      ctx.lineWidth = Math.max(1.5, (9 - i * 0.75) * a.scale);
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    const tip = proj[proj.length - 1];
    ctx.fillStyle = l === 0 ? "#bae6fd" : "#a5f3fc";
    ctx.beginPath(); ctx.arc(tip.x, tip.y, (l === 0 ? 6.5 : 4.5) * tip.scale, 0, Math.PI * 2); ctx.fill();
  }

  // Center anemone base
  ctx.fillStyle = "#0ea5e9";
  ctx.strokeStyle = "#bae6fd";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(256, 256, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Bursts
  for (const b of bursts) {
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Pointer ring
  if (!over) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 12, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ESQUISSE ACCOMPLIE !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${Math.min(targetFigures, figIdx)}/${targetFigures} silhouettes • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
