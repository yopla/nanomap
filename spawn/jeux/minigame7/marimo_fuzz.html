<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Marimo Poilu (Marimo Fuzz)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #22c55e; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #22c55e; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(34,197,94,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "marimo_fuzz",
  "name": "Marimo Poilu (Marimo Fuzz)",
  "family": "topMouseMut",
  "icon": "🟢",
  "controls": "Pointeur / glisser ou ZQSD pour faire rouler et peigner la boule d'algue • Clic ou Espace pour hérisser ses poils (attire les nutriments et repousse les sangsues)",
  "description": "Adaptation de marimo (mHSL.as et c8xP.as) : une sphère d'algue tapissée de fibres directionnelles réactives au mouvement et d'une ombre portée dynamique. Faites-la rouler pour absorber les gouttes nutritives vertes.",
  "goal": "Absorber 30 gouttes nutritives vertes en moins de 60 secondes sans subir 3 morsures de sangsues rouges.",
  "fields": [
    { "key": "targetNutrients", "label": "Nutriments à absorber", "type": "number", "default": 30 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🟢 Marimo Fuzz</span>
  <span id="stat">Nutriments 0/30 • ♥♥♥ • 60s</span>
  <div class="bar-btns">
    <button onclick="puffFur()" title="Hérisser la fourrure (Espace)">💥 Hérisser</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : rouler le Marimo sur les <b>nutriments verts</b> • <b>Clic / Espace</b> : hérisser les fibres pour attirer le vert et chasser les <b>sangsues</b>
</div>

<script>
const GAME_ID = "marimo_fuzz";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetNutrients = 30, durationSec = 60;
let marimo = { x: 256, y: 256, vx: 0, vy: 0, r: 28 };
let furs = [], drops = [], leeches = [], bursts = [];
let ptr = { x: 256, y: 256, active: false };
let keys = {};
let collected = 0, lives = 3, timeLeft = 60, score = 0, won = false, over = false;
let puffT = 0, puffCd = 0, invuln = 0, spawnDropT = 0, spawnLeechT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function buildFurs() {
  furs = [];
  // Radial + concentric FurInfo fibers (mHSL.as / c8xP.as)
  const count = 135;
  for (let i = 0; i < count; i++) {
    const radFrac = Math.sqrt(Math.random());
    const ang = Math.random() * Math.PI * 2;
    const ox = Math.cos(ang) * radFrac;
    const oy = Math.sin(ang) * radFrac;
    const len = 10 + (1 - radFrac * 0.4) * 12 + Math.random() * 6;
    furs.push({
      ox, oy,
      ang,
      len,
      tx: ox * 10,
      ty: oy * 10,
      vx: 0, vy: 0,
      shade: Math.random()
    });
  }
}

function puffFur() {
  if (over || puffCd > 0) return;
  puffT = 0.65;
  puffCd = 0.85;
  for (const f of furs) {
    f.vx += Math.cos(f.ang) * 260;
    f.vy += Math.sin(f.ang) * 260;
  }
  for (const l of leeches) {
    const dx = l.x - marimo.x, dy = l.y - marimo.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 130) {
      l.vx += (dx / d) * 320;
      l.vy += (dy / d) * 320;
      l.stun = 0.9;
    }
  }
  bursts.push({ x: marimo.x, y: marimo.y, r: marimo.r, maxR: 135, life: 1, col: "#4ade80" });
}

function spawnDrop() {
  drops.push({
    x: 34 + Math.random() * (SIZE - 68),
    y: 34 + Math.random() * (SIZE - 68),
    r: 7.5,
    pulse: Math.random() * 6
  });
}

function spawnLeech() {
  const side = Math.floor(Math.random() * 4);
  let x = 256, y = 256;
  if (side === 0) { x = Math.random() * SIZE; y = 14; }
  else if (side === 1) { x = SIZE - 14; y = Math.random() * SIZE; }
  else if (side === 2) { x = Math.random() * SIZE; y = SIZE - 14; }
  else { x = 14; y = Math.random() * SIZE; }
  leeches.push({ x, y, vx: 0, vy: 0, r: 9.5, stun: 0, wob: Math.random() * 6 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetNutrients = Math.max(5, Number(custom.targetNutrients || 30));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  marimo = { x: 256, y: 256, vx: 0, vy: 0, r: 26 };
  buildFurs();
  drops = [];
  leeches = [];
  bursts = [];
  for (let i = 0; i < 8; i++) spawnDrop();
  spawnLeech();
  ptr = { x: 256, y: 256, active: false };
  collected = 0;
  lives = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  puffT = 0;
  puffCd = 0;
  invuln = 0;
  spawnDropT = 0;
  spawnLeechT = 0;
  updateHud();
}

function updateHud() {
  const hearts = "♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives));
  document.getElementById("stat").textContent =
    `Nutriments ${collected}/${targetNutrients} • ${hearts} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
  puffFur();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
});
window.addEventListener("pointerup", () => { ptr.active = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) puffFur();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    puffT = Math.max(0, puffT - dt);
    puffCd = Math.max(0, puffCd - dt);
    invuln = Math.max(0, invuln - dt);

    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      marimo.vx += (ax / m) * 760 * dt;
      marimo.vy += (ay / m) * 760 * dt;
    } else if (ptr.active) {
      const dx = ptr.x - marimo.x, dy = ptr.y - marimo.y;
      const d = Math.hypot(dx, dy);
      if (d > 6) {
        const pull = Math.min(1, d / 70);
        marimo.vx += (dx / d) * 780 * pull * dt;
        marimo.vy += (dy / d) * 780 * pull * dt;
      }
    }

    marimo.vx *= Math.pow(0.14, dt);
    marimo.vy *= Math.pow(0.14, dt);
    marimo.x += marimo.vx * dt;
    marimo.y += marimo.vy * dt;

    if (marimo.x < marimo.r + 14) { marimo.x = marimo.r + 14; marimo.vx = Math.abs(marimo.vx) * 0.6; }
    if (marimo.x > SIZE - marimo.r - 14) { marimo.x = SIZE - marimo.r - 14; marimo.vx = -Math.abs(marimo.vx) * 0.6; }
    if (marimo.y < marimo.r + 14) { marimo.y = marimo.r + 14; marimo.vy = Math.abs(marimo.vy) * 0.6; }
    if (marimo.y > SIZE - marimo.r - 14) { marimo.y = SIZE - marimo.r - 14; marimo.vy = -Math.abs(marimo.vy) * 0.6; }

    // Comb spring-loaded fur fibers opposite to motion (mHSL.as FurInfo)
    const puffScale = puffT > 0 ? 1.55 : 1;
    for (const f of furs) {
      const restX = Math.cos(f.ang) * f.len * puffScale - marimo.vx * 0.05;
      const restY = Math.sin(f.ang) * f.len * puffScale - marimo.vy * 0.05;
      f.vx += ((restX - f.tx) * 95 - f.vx * 7) * dt;
      f.vy += ((restY - f.ty) * 95 - f.vy * 7) * dt;
      f.tx += f.vx * dt;
      f.ty += f.vy * dt;
    }

    spawnDropT += dt;
    if (spawnDropT >= 0.75 && drops.length < 11) { spawnDropT = 0; spawnDrop(); }
    spawnLeechT += dt;
    if (spawnLeechT >= 2.2 && leeches.length < 5) { spawnLeechT = 0; spawnLeech(); }

    // Drops attracted when puffing or close to fur tips
    const magnetR = puffT > 0 ? 145 : 44;
    for (let i = drops.length - 1; i >= 0; i--) {
      const dr = drops[i];
      dr.pulse += dt * 4;
      const dx = marimo.x - dr.x, dy = marimo.y - dr.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < magnetR) {
        const pull = puffT > 0 ? 290 : 120;
        dr.x += (dx / d) * pull * dt;
        dr.y += (dy / d) * pull * dt;
      }
      if (d < marimo.r + dr.r + 10) {
        collected++;
        score += 65;
        marimo.r = Math.min(36, 24 + collected * 0.35);
        bursts.push({ x: dr.x, y: dr.y, r: 5, maxR: 34, life: 1, col: "#4ade80" });
        drops.splice(i, 1);
        spawnDrop();
        if (collected >= targetNutrients) {
          won = true;
          over = true;
          score += Math.round(timeLeft * 20);
        }
      }
    }

    // Leeches
    for (let i = leeches.length - 1; i >= 0; i--) {
      const l = leeches[i];
      l.wob += dt * 7;
      l.stun = Math.max(0, l.stun - dt);
      const dx = marimo.x - l.x, dy = marimo.y - l.y;
      const d = Math.hypot(dx, dy) || 1;
      if (l.stun <= 0) {
        l.vx += (dx / d) * 145 * dt;
        l.vy += (dy / d) * 145 * dt;
      }
      l.vx *= Math.pow(0.28, dt);
      l.vy *= Math.pow(0.28, dt);
      l.x += l.vx * dt;
      l.y += l.vy * dt;

      if (invuln <= 0 && l.stun <= 0 && d < marimo.r + l.r + 2) {
        lives--;
        invuln = 1.4;
        marimo.vx = -(dx / d) * 240;
        marimo.vy = -(dy / d) * 240;
        bursts.push({ x: marimo.x, y: marimo.y, r: 10, maxR: 62, life: 1, col: "#ef4444" });
        leeches.splice(i, 1);
        if (lives <= 0) {
          won = false;
          over = true;
        }
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 170 * dt;
      bursts[i].life -= 2.4 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = collected >= targetNutrients;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Pond water rings
  ctx.strokeStyle = "rgba(34, 197, 94, 0.08)";
  ctx.lineWidth = 1.4;
  for (let rr = 80; rr <= 220; rr += 70) {
    ctx.beginPath(); ctx.arc(256, 256, rr, 0, Math.PI * 2); ctx.stroke();
  }

  // Drops
  for (const dr of drops) {
    const r = dr.r + Math.sin(dr.pulse) * 1.3;
    ctx.fillStyle = "#4ade80";
    ctx.beginPath(); ctx.arc(dr.x, dr.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#dcfce7";
    ctx.beginPath(); ctx.arc(dr.x - 2, dr.y - 2, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // Dynamic shadow (mHSL.as drawMarimo shadow)
  ctx.fillStyle = "rgba(2, 6, 23, 0.55)";
  ctx.beginPath();
  ctx.ellipse(marimo.x + (marimo.x - 256) * 0.04, marimo.y + marimo.r + 12, marimo.r * 1.15, marimo.r * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();

  // Marimo body + Fur fibers
  if (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0) {
    ctx.fillStyle = "#064e3b";
    ctx.beginPath(); ctx.arc(marimo.x, marimo.y, marimo.r, 0, Math.PI * 2); ctx.fill();

    for (const f of furs) {
      const bx = marimo.x + f.ox * marimo.r * 0.92;
      const by = marimo.y + f.oy * marimo.r * 0.92;
      const ex = bx + f.tx;
      const ey = by + f.ty;
      const grad = ctx.createLinearGradient(bx, by, ex, ey);
      grad.addColorStop(0, "#047857");
      grad.addColorStop(1, f.shade > 0.5 ? "#4ade80" : "#86efac");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
  }

  // Red leeches
  for (const l of leeches) {
    ctx.fillStyle = l.stun > 0 ? "#fb7185" : "#ef4444";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(l.x, l.y, l.r + 2.5, l.r - 1.5, Math.atan2(l.vy, l.vx) + Math.sin(l.wob) * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // Bursts
  for (const b of bursts) {
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "MARIMO ÉPANOUI !" : (lives <= 0 ? "MARIMO DÉVORÉ !" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Nutriments ${collected}/${targetNutrients} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
