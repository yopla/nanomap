<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Fouet & Fibres IK (Whip Fibers)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fb923c; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.suction { background: #4c1d95; border-color: #c084fc; color: #f3e8ff; }
  canvas { background: #060914; border: 2px solid #fb923c; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,146,60,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "whip_fibers",
  "name": "Fouet & Fibres IK (Whip Fibers)",
  "family": "topMouseHnS",
  "icon": "〰️",
  "controls": "Pointeur / glisser ou ZQSD pour fouetter avec les fibres • Maintenir Clic, Espace ou bouton 🧲 Aspiration pour aspirer les éclats dorés",
  "description": "Fusion de ClackledHair (xEwN.as), des fibres IK (enw6.as), des cordes Catmull-Rom (q8jR.as), des poils (3gRC.as) et des courbes Bézier (pHkc.as) : donnez du fouet avec vos fibres pour briser les spores rouges puis activez l'aspiration.",
  "goal": "Briser 18 spores rouges au fouet et aspirer 18 éclats dorés en moins de 65 secondes sans perdre vos 3 cœurs.",
  "fields": [
    { "key": "targetSmashed", "label": "Spores à briser", "type": "number", "default": 18 },
    { "key": "targetShards", "label": "Éclats à aspirer", "type": "number", "default": 18 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">〰️ Whip Fibers</span>
  <span id="stat">Brisées 0/18 • Éclats 0/18 • ♥♥♥ • 65s</span>
  <div class="bar-btns">
    <button id="sucBtn" onclick="toggleSuction()" title="Basculer l'aspiration (Espace)">🧲 Aspiration</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : lancer vos <b>fibres</b> sur les spores rouges • <b>Clic maintenu / Espace / 🧲</b> : aspirer les <b>éclats or</b>
</div>

<script>
const GAME_ID = "whip_fibers";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetSmashed = 18, targetShards = 18, durationSec = 65;
let root = { x: 256, y: 256, vx: 0, vy: 0 };
let strands = [], enemies = [], shards = [], bursts = [];
let ptr = { x: 256, y: 256, down: false };
let suctionToggle = false;
let keys = {};
let smashed = 0, collected = 0, lives = 3, timeLeft = 65, score = 0, won = false, over = false;
let invuln = 0, spawnT = 0, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function toggleSuction(force) {
  suctionToggle = typeof force === "boolean" ? force : !suctionToggle;
  const btn = document.getElementById("sucBtn");
  btn.classList.toggle("suction", suctionToggle);
}

function buildStrands() {
  strands = [];
  const strandCount = 6;
  const segCount = 12;
  for (let s = 0; s < strandCount; s++) {
    const pts = [];
    for (let i = 0; i < segCount; i++) {
      pts.push({ x: 256, y: 256 + i * 11, px: 256, py: 256 + i * 11 });
    }
    strands.push({
      pts,
      segLen: 12.5 + (s % 2) * 1.5,
      phase: (s / strandCount) * Math.PI * 2,
      hue: 22 + s * 14
    });
  }
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x = 256, y = 256;
  if (side === 0) { x = Math.random() * SIZE; y = 14; }
  else if (side === 1) { x = SIZE - 14; y = Math.random() * SIZE; }
  else if (side === 2) { x = Math.random() * SIZE; y = SIZE - 14; }
  else { x = 14; y = Math.random() * SIZE; }
  const ang = Math.atan2(root.y - y, root.x - x);
  const sp = 55 + Math.random() * 35;
  enemies.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 10.5 });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetSmashed = Math.max(4, Number(custom.targetSmashed || 18));
  targetShards = Math.max(4, Number(custom.targetShards || 18));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  root = { x: 256, y: 256, vx: 0, vy: 0 };
  buildStrands();
  enemies = [];
  shards = [];
  bursts = [];
  for (let i = 0; i < 4; i++) spawnEnemy();
  ptr = { x: 256, y: 256, down: false };
  suctionToggle = false;
  toggleSuction(false);
  smashed = 0;
  collected = 0;
  lives = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  invuln = 0;
  spawnT = 0;
  animT = 0;
  updateHud();
}

function updateHud() {
  const hearts = "♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives));
  document.getElementById("stat").textContent =
    `Brisées ${smashed}/${targetSmashed} • Éclats ${collected}/${targetShards} • ${hearts} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  if (e.button === 2) toggleSuction();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
});
window.addEventListener("pointerup", () => { ptr.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) toggleSuction();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    animT += dt;
    invuln = Math.max(0, invuln - dt);

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      ptr.x = Math.max(18, Math.min(SIZE - 18, ptr.x + (kx / m) * 330 * dt));
      ptr.y = Math.max(18, Math.min(SIZE - 18, ptr.y + (ky / m) * 330 * dt));
    }

    // Root follows pointer with snappy spring (xEwN.as rootPos)
    const oldX = root.x, oldY = root.y;
    root.x += (ptr.x - root.x) * Math.min(1, 13 * dt);
    root.y += (ptr.y - root.y) * Math.min(1, 13 * dt);
    root.vx = (root.x - oldX) / Math.max(0.001, dt);
    root.vy = (root.y - oldY) / Math.max(0.001, dt);

    const suctionActive = ptr.down || suctionToggle;

    // Update IK + Catmull-Rom whip strands (xEwN / enw6 / q8jR / 3gRC)
    for (const st of strands) {
      const pts = st.pts;
      pts[0].px = pts[0].x; pts[0].py = pts[0].y;
      pts[0].x = root.x + Math.cos(animT * 3 + st.phase) * 5;
      pts[0].y = root.y + Math.sin(animT * 3 + st.phase) * 5;

      for (let i = 1; i < pts.length; i++) {
        const p = pts[i], prev = pts[i - 1];
        p.px = p.x; p.py = p.y;
        // If suction active, whip tips swirl tightly around attractor; otherwise trail whip physics
        if (suctionActive) {
          const ang = animT * 5 + st.phase + i * 0.35;
          p.x += (root.x + Math.cos(ang) * (14 + i * 3.5) - p.x) * 8 * dt;
          p.y += (root.y + Math.sin(ang) * (14 + i * 3.5) - p.y) * 8 * dt;
        } else {
          p.x += Math.cos(animT * 4 + st.phase + i * 0.4) * 36 * dt;
          p.y += Math.sin(animT * 4 + st.phase + i * 0.4) * 36 * dt;
        }
        const dx = p.x - prev.x, dy = p.y - prev.y;
        const d = Math.hypot(dx, dy) || 0.001;
        p.x = prev.x + (dx / d) * st.segLen;
        p.y = prev.y + (dy / d) * st.segLen;
      }
    }

    spawnT += dt;
    if (spawnT >= 1.25 && enemies.length < 7) { spawnT = 0; spawnEnemy(); }

    const rootSpeed = Math.hypot(root.vx, root.vy);

    // Enemy collision against whip strands vs root core
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dx = root.x - e.x, dy = root.y - e.y;
      const dCore = Math.hypot(dx, dy) || 1;
      e.vx += ((dx / dCore) * 75 - e.vx * 0.5) * dt;
      e.vy += ((dy / dCore) * 75 - e.vy * 0.5) * dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;

      // Check whip segment impact
      let hitWhip = false;
      for (const st of strands) {
        for (let k = 3; k < st.pts.length; k++) {
          const pt = st.pts[k];
          const segSpeed = Math.hypot(pt.x - pt.px, pt.y - pt.py) / Math.max(0.001, dt);
          if ((segSpeed > 95 || rootSpeed > 95 || !suctionActive) && Math.hypot(e.x - pt.x, e.y - pt.y) < e.r + 9) {
            if (segSpeed > 75 || rootSpeed > 75) {
              hitWhip = true;
              break;
            }
          }
        }
        if (hitWhip) break;
      }

      if (hitWhip) {
        smashed++;
        score += 70;
        bursts.push({ x: e.x, y: e.y, r: 6, maxR: 42, life: 1, col: "#fb923c" });
        // Drop 1-2 golden shards
        const dropN = shards.length < 22 ? 2 : 1;
        for (let s = 0; s < dropN; s++) {
          const ang = Math.random() * Math.PI * 2;
          shards.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang) * (50 + Math.random() * 60),
            vy: Math.sin(ang) * (50 + Math.random() * 60),
            r: 6.5
          });
        }
        enemies.splice(i, 1);
        continue;
      }

      if (invuln <= 0 && dCore < e.r + 13) {
        lives--;
        invuln = 1.3;
        bursts.push({ x: root.x, y: root.y, r: 10, maxR: 56, life: 1, col: "#ef4444" });
        enemies.splice(i, 1);
        if (lives <= 0) {
          won = false;
          over = true;
        }
      }
    }

    // Golden shards + xEwN suction vortex
    for (let i = shards.length - 1; i >= 0; i--) {
      const sh = shards[i];
      sh.vx *= Math.pow(0.25, dt);
      sh.vy *= Math.pow(0.25, dt);
      const dx = root.x - sh.x, dy = root.y - sh.y;
      const d = Math.hypot(dx, dy) || 1;
      if (suctionActive && d < 210) {
        const pull = 440 * (1 - d / 230) + 120;
        sh.vx += (dx / d) * pull * dt;
        sh.vy += (dy / d) * pull * dt;
      }
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      if (sh.x < 10) { sh.x = 10; sh.vx = Math.abs(sh.vx); }
      if (sh.x > SIZE - 10) { sh.x = SIZE - 10; sh.vx = -Math.abs(sh.vx); }
      if (sh.y < 10) { sh.y = 10; sh.vy = Math.abs(sh.vy); }
      if (sh.y > SIZE - 10) { sh.y = SIZE - 10; sh.vy = -Math.abs(sh.vy); }

      if (d < 20) {
        collected++;
        score += 65;
        bursts.push({ x: sh.x, y: sh.y, r: 4, maxR: 28, life: 1, col: "#facc15" });
        shards.splice(i, 1);
      }
    }

    if (smashed >= targetSmashed && collected >= targetShards) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 20);
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 160 * dt;
      bursts[i].life -= 2.5 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = smashed >= targetSmashed && collected >= targetShards;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  const suctionActive = ptr.down || suctionToggle;
  if (suctionActive && !over) {
    ctx.strokeStyle = "rgba(192, 132, 252, 0.35)";
    ctx.fillStyle = "rgba(192, 132, 252, 0.06)";
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(root.x, root.y, 190, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Whip strands rendered with smooth Catmull-Rom-style quadratic smoothing
  for (const st of strands) {
    const pts = st.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      ctx.strokeStyle = suctionActive
        ? `hsla(${270 + i * 4}, 90%, ${65 - i * 2}%, 0.88)`
        : `hsla(${st.hue + i * 3}, 95%, ${62 - i * 2}%, 0.9)`;
      ctx.lineWidth = Math.max(1.5, 6.2 - i * 0.42);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }

  // Golden shards
  for (const sh of shards) {
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(sh.x - 1.8, sh.y - 1.8, 2, 0, Math.PI * 2); ctx.fill();
  }

  // Hostile spores
  for (const e of enemies) {
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Root core (+ / - xEwN indicator)
  if (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0) {
    ctx.fillStyle = suctionActive ? "#7e22ce" : "#ea580c";
    ctx.strokeStyle = suctionActive ? "#e9d5ff" : "#fed7aa";
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(root.x, root.y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(root.x - 5, root.y); ctx.lineTo(root.x + 5, root.y);
    if (suctionActive) { ctx.moveTo(root.x, root.y - 5); ctx.lineTo(root.x, root.y + 5); }
    ctx.stroke();
  }

  // Bursts
  for (const b of bursts) {
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "FOUET MAÎTRISÉ !" : (lives <= 0 ? "NOYAU BRISÉ" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Brisées ${smashed}/${targetSmashed} • Éclats ${collected}/${targetShards} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
