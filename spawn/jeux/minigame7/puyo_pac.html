<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Puyo-Pac Soft-Body</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #67e8f9; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #67e8f9; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(103,232,249,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "puyo_pac",
  "name": "Puyo-Pac Soft-Body",
  "family": "topOrthoClav",
  "icon": "🫧",
  "controls": "Pointeur / glisser ou ZQSD / Flèches pour piloter le corps mou • Clic ou Espace pour effectuer un bond élastique",
  "description": "Adaptation de pac.as (SoftBody, panier mobile, nourriture aléatoire et fantômes patrouilleurs) : votre cellule gélatineuse se déforme à travers les couloirs pour récolter les spores et les déposer dans le panier vert.",
  "goal": "Livrer 18 spores dans le panier mobile vert en moins de 65 secondes sans perdre vos 3 vies face aux fantômes rouges.",
  "fields": [
    { "key": "targetDelivered", "label": "Spores à livrer", "type": "number", "default": 18 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🫧 Puyo-Pac</span>
  <span id="stat">Livrées 0/18 • Portées 0 • ♥♥♥ • 65s</span>
  <div class="bar-btns">
    <button onclick="triggerDash()" title="Bond élastique (Espace)">⚡ Bond</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Pointeur / ZQSD</b> : diriger le Puyo mou • Absorbez les <b>spores or</b> puis touchez le <b>panier vert</b> • <b>Clic / Espace</b> : bond élastique
</div>

<script>
const GAME_ID = "puyo_pac";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const WALLS = [
  { x: 108, y: 112, w: 92, h: 20 },
  { x: 312, y: 112, w: 92, h: 20 },
  { x: 108, y: 380, w: 92, h: 20 },
  { x: 312, y: 380, w: 92, h: 20 },
  { x: 244, y: 175, w: 24, h: 162 }
];

let targetDelivered = 18, durationSec = 65;
let blob = null;
let basket = { x: 256, y: 60, vx: 95, r: 30 };
let feeds = [], ghosts = [], bursts = [];
let ptr = { x: 256, y: 256, active: false };
let keys = {};
let delivered = 0, carried = 0, lives = 3, timeLeft = 65, score = 0, won = false, over = false;
let invuln = 0, dashCd = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function createBlob() {
  const count = 14;
  const nodes = [];
  const baseR = 22;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    nodes.push({
      ax: Math.cos(a), ay: Math.sin(a),
      r: baseR, vr: 0
    });
  }
  return { x: 256, y: 446, vx: 0, vy: 0, baseR, nodes };
}

function freePos(margin = 34) {
  for (let t = 0; t < 40; t++) {
    const x = margin + Math.random() * (SIZE - margin * 2);
    const y = margin + 45 + Math.random() * (SIZE - margin * 2 - 45);
    let hit = false;
    for (const w of WALLS) {
      if (x > w.x - 18 && x < w.x + w.w + 18 && y > w.y - 18 && y < w.y + w.h + 18) { hit = true; break; }
    }
    if (!hit) return { x, y };
  }
  return { x: 80, y: 256 };
}

function spawnFeed() {
  const p = freePos();
  feeds.push({ x: p.x, y: p.y, r: 7.5, pulse: Math.random() * 6 });
}

function spawnGhosts() {
  const spots = [
    { x: 75, y: 185, vx: 98, vy: 64 },
    { x: 435, y: 185, vx: -92, vy: 76 },
    { x: 75, y: 325, vx: 86, vy: -82 }
  ];
  ghosts = spots.map((s, idx) => ({
    x: s.x, y: s.y, vx: s.vx, vy: s.vy, r: 15, phase: idx * 2.1
  }));
}

function triggerDash() {
  if (over || dashCd > 0) return;
  dashCd = 0.85;
  let dx = 0, dy = 0;
  if (ptr.active) {
    dx = ptr.x - blob.x; dy = ptr.y - blob.y;
  } else {
    dx = blob.vx; dy = blob.vy;
  }
  const m = Math.hypot(dx, dy) || 1;
  blob.vx += (dx / m) * 280;
  blob.vy += (dy / m) * 280;
  for (const n of blob.nodes) n.vr += 135;
  bursts.push({ x: blob.x, y: blob.y, r: 12, life: 1, col: "#67e8f9" });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetDelivered = Math.max(4, Number(custom.targetDelivered || 18));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  blob = createBlob();
  basket = { x: 256, y: 54, vx: 95, r: 30 };
  feeds = [];
  for (let i = 0; i < 6; i++) spawnFeed();
  spawnGhosts();
  bursts = [];
  ptr = { x: 256, y: 446, active: false };
  delivered = 0;
  carried = 0;
  lives = 3;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  invuln = 0;
  dashCd = 0;
  updateHud();
}

function updateHud() {
  const hearts = "♥".repeat(Math.max(0, lives)) + "♡".repeat(Math.max(0, 3 - lives));
  document.getElementById("stat").textContent =
    `Livrées ${delivered}/${targetDelivered} • Portées ${carried} • ${hearts} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
  triggerDash();
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true;
});
window.addEventListener("pointerup", () => { ptr.active = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) triggerDash();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function resolveCircleWalls(ent, radius) {
  if (ent.x < radius + 10) { ent.x = radius + 10; ent.vx = Math.abs(ent.vx) * 0.65; return true; }
  if (ent.x > SIZE - radius - 10) { ent.x = SIZE - radius - 10; ent.vx = -Math.abs(ent.vx) * 0.65; return true; }
  if (ent.y < radius + 10) { ent.y = radius + 10; ent.vy = Math.abs(ent.vy) * 0.65; return true; }
  if (ent.y > SIZE - radius - 10) { ent.y = SIZE - radius - 10; ent.vy = -Math.abs(ent.vy) * 0.65; return true; }
  let hit = false;
  for (const w of WALLS) {
    const cx = Math.max(w.x, Math.min(w.x + w.w, ent.x));
    const cy = Math.max(w.y, Math.min(w.y + w.h, ent.y));
    const dx = ent.x - cx, dy = ent.y - cy;
    const d = Math.hypot(dx, dy);
    if (d < radius && d > 0.0001) {
      const nx = dx / d, ny = dy / d;
      ent.x += nx * (radius - d);
      ent.y += ny * (radius - d);
      const vn = ent.vx * nx + ent.vy * ny;
      if (vn < 0) {
        ent.vx -= 1.55 * vn * nx;
        ent.vy -= 1.55 * vn * ny;
      }
      hit = true;
    }
  }
  return hit;
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    invuln = Math.max(0, invuln - dt);
    dashCd = Math.max(0, dashCd - dt);

    // Steering (Pointer or Keyboard)
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      blob.vx += (ax / m) * 760 * dt;
      blob.vy += (ay / m) * 760 * dt;
    } else if (ptr.active) {
      const dx = ptr.x - blob.x, dy = ptr.y - blob.y;
      const d = Math.hypot(dx, dy);
      if (d > 6) {
        const pull = Math.min(1, d / 75);
        blob.vx += (dx / d) * 760 * pull * dt;
        blob.vy += (dy / d) * 760 * pull * dt;
      }
    }

    blob.vx *= Math.pow(0.16, dt);
    blob.vy *= Math.pow(0.16, dt);
    blob.x += blob.vx * dt;
    blob.y += blob.vy * dt;

    const hitWall = resolveCircleWalls(blob, blob.baseR);
    if (hitWall) {
      for (const n of blob.nodes) {
        const dot = n.ax * blob.vx + n.ay * blob.vy;
        n.vr += dot * 0.08;
      }
    }

    // Soft-body spring membrane wobble (pac.as SoftBody feel)
    const targetR = 20 + Math.min(10, carried * 1.6);
    blob.baseR += (targetR - blob.baseR) * 4 * dt;
    const speed = Math.hypot(blob.vx, blob.vy);
    for (let i = 0; i < blob.nodes.length; i++) {
      const n = blob.nodes[i];
      const stretch = speed > 5 ? ((n.ax * blob.vx + n.ay * blob.vy) / speed) * Math.min(7, speed * 0.022) : 0;
      const rest = blob.baseR + stretch;
      n.vr += ((rest - n.r) * 165 - n.vr * 8.5) * dt;
      n.r = Math.max(10, n.r + n.vr * dt);
    }

    // Moving basket at top
    basket.x += basket.vx * dt;
    if (basket.x < 56) { basket.x = 56; basket.vx = Math.abs(basket.vx); }
    if (basket.x > SIZE - 56) { basket.x = SIZE - 56; basket.vx = -Math.abs(basket.vx); }

    // Collect feeds
    for (let i = feeds.length - 1; i >= 0; i--) {
      const f = feeds[i];
      f.pulse += dt * 4;
      if (Math.hypot(f.x - blob.x, f.y - blob.y) < blob.baseR + f.r + 4) {
        carried++;
        score += 35;
        for (const n of blob.nodes) n.vr += 65;
        bursts.push({ x: f.x, y: f.y, r: 6, life: 1, col: "#facc15" });
        feeds.splice(i, 1);
        spawnFeed();
      }
    }

    // Deliver to basket
    if (carried > 0 && Math.hypot(basket.x - blob.x, basket.y - blob.y) < blob.baseR + basket.r) {
      delivered += carried;
      score += carried * 90;
      bursts.push({ x: basket.x, y: basket.y, r: 16, life: 1, col: "#4ade80" });
      carried = 0;
      for (const n of blob.nodes) n.vr -= 70;
      if (delivered >= targetDelivered) {
        won = true;
        over = true;
        score += Math.round(timeLeft * 20);
      }
    }

    // Ghosts patrol & gentle chase
    for (const g of ghosts) {
      g.phase += dt * 3;
      const dx = blob.x - g.x, dy = blob.y - g.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 175) {
        g.vx += (dx / d) * 120 * dt;
        g.vy += (dy / d) * 120 * dt;
      }
      const sp = Math.hypot(g.vx, g.vy);
      if (sp > 145) { g.vx = (g.vx / sp) * 145; g.vy = (g.vy / sp) * 145; }
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      resolveCircleWalls(g, g.r);

      if (invuln <= 0 && Math.hypot(g.x - blob.x, g.y - blob.y) < blob.baseR + g.r - 2) {
        lives--;
        invuln = 1.6;
        carried = Math.max(0, carried - 1);
        blob.vx = ((blob.x - g.x) / d) * 260;
        blob.vy = ((blob.y - g.y) / d) * 260;
        for (const n of blob.nodes) n.vr += 150;
        bursts.push({ x: blob.x, y: blob.y, r: 14, life: 1, col: "#f87171" });
        if (lives <= 0) {
          won = false;
          over = true;
        }
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 110 * dt;
      bursts[i].life -= 2.3 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = delivered >= targetDelivered;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Arena border
  ctx.strokeStyle = "#1e3a5f";
  ctx.lineWidth = 4;
  ctx.strokeRect(8, 8, SIZE - 16, SIZE - 16);

  // Walls
  for (const w of WALLS) {
    ctx.fillStyle = "#162640";
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.6;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Basket
  ctx.fillStyle = "rgba(74, 222, 128, 0.18)";
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(basket.x, basket.y, basket.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#86efac";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("PANIER", basket.x, basket.y + 4);

  // Feeds
  for (const f of feeds) {
    const r = f.r + Math.sin(f.pulse) * 1.4;
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef9c3";
    ctx.beginPath(); ctx.arc(f.x - 2, f.y - 2, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // SoftBody Blob
  if (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0) {
    const pts = blob.nodes.map(n => ({ x: blob.x + n.ax * n.r, y: blob.y + n.ay * n.r }));
    ctx.fillStyle = carried > 0 ? "rgba(56, 214, 255, 0.38)" : "rgba(103, 232, 249, 0.28)";
    ctx.strokeStyle = carried > 0 ? "#facc15" : "#67e8f9";
    ctx.lineWidth = 3;
    ctx.beginPath();
    const len = pts.length;
    const mid0x = (pts[len - 1].x + pts[0].x) * 0.5;
    const mid0y = (pts[len - 1].y + pts[0].y) * 0.5;
    ctx.moveTo(mid0x, mid0y);
    for (let i = 0; i < len; i++) {
      const p1 = pts[i];
      const p2 = pts[(i + 1) % len];
      ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) * 0.5, (p1.y + p2.y) * 0.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Eyes + carried counter
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(blob.x - 6, blob.y - 3, 3.2, 0, Math.PI * 2);
    ctx.arc(blob.x + 6, blob.y - 3, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0b1322";
    ctx.beginPath();
    ctx.arc(blob.x - 6, blob.y - 3, 1.5, 0, Math.PI * 2);
    ctx.arc(blob.x + 6, blob.y - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ghosts
  for (const g of ghosts) {
    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
    ctx.beginPath();
    ctx.arc(g.x, g.y - 2, g.r, Math.PI, 0);
    ctx.lineTo(g.x + g.r, g.y + g.r * 0.85);
    ctx.lineTo(g.x + g.r * 0.35, g.y + g.r * 0.45);
    ctx.lineTo(g.x, g.y + g.r * 0.85);
    ctx.lineTo(g.x - g.r * 0.35, g.y + g.r * 0.45);
    ctx.lineTo(g.x - g.r, g.y + g.r * 0.85);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(g.x - 4.5, g.y - 3, 3, 0, Math.PI * 2);
    ctx.arc(g.x + 4.5, g.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.arc(g.x - 4.5, g.y - 3, 1.4, 0, Math.PI * 2);
    ctx.arc(g.x + 4.5, g.y - 3, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bursts
  for (const b of bursts) {
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "MOISSON PUYO RÉUSSIE !" : (lives <= 0 ? "ÉCRASÉ PAR LES FANTÔMES" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Spores ${delivered}/${targetDelivered} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
