<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Rideau de Tentacules (Tentacle Curtain)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #a78bfa; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060914; border: 2px solid #a78bfa; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(167,139,250,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tentacle_curtain",
  "name": "Rideau de Tentacules (Tentacle Curtain)",
  "family": "core",
  "icon": "🎐",
  "controls": "Cliquer / glisser sur un maillon pour le détacher • Cliquer ou Espace sur une bille libre pour la faire rebondir vers les bassins verts (ZQSD déplace le curseur)",
  "description": "Adapté de cko0.as (rideau noren à joints de distance Box2D, rupture au clic et rebond sur les billes détachées) : libérez les perles suspendues au plafond et faites-les ricocher sur les étagères jusqu'aux bassins verts.",
  "goal": "Faire atterrir 22 perles détachées dans les bassins verts en moins de 65 secondes.",
  "fields": [
    { "key": "targetBeads", "label": "Perles à récupérer", "type": "number", "default": 22 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🎐 Tentacle Curtain</span>
  <span id="stat">Perles 0/22 • 65s</span>
  <div class="bar-btns">
    <button onclick="bouncePulse()" title="Impulsion de rebond (Espace)">⬆️ Rebond</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic / Glisser</b> : couper un maillon du rideau • <b>Clic / Espace</b> sur une bille libre : la faire bondir vers les <b>bassins verts</b>
</div>

<script>
const GAME_ID = "tentacle_curtain";
const SIZE = 512;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const SHELVES = [
  { x1: 68, y1: 270, x2: 196, y2: 315 },
  { x1: 316, y1: 315, x2: 444, y2: 270 },
  { x1: 185, y1: 392, x2: 327, y2: 392 }
];
const BASINS = [
  { x: 24, y: 454, w: 126, h: 42 },
  { x: 362, y: 454, w: 126, h: 42 }
];
const HAZARD = { x: 182, y: 468, w: 148, h: 28 };

let targetBeads = 22, durationSec = 65;
let chains = [], joints = [], bursts = [];
let ptr = { x: 256, y: 200, down: false };
let keys = {};
let collected = 0, timeLeft = 65, score = 0, won = false, over = false;
let swayT = 0, regenT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function buildCurtainColumn(colIdx, anchorX) {
  const segs = 7;
  const spacing = 26;
  let prev = null;
  for (let s = 0; s < segs; s++) {
    const node = {
      x: anchorX + Math.sin(colIdx + s * 0.4) * 4,
      y: 34 + s * spacing,
      vx: (Math.random() - 0.5) * 18,
      vy: 0,
      r: s === 0 ? 7 : 9.5,
      pinned: s === 0,
      detached: false,
      col: colIdx
    };
    chains.push(node);
    if (prev) {
      joints.push({ a: prev, b: node, len: spacing, alive: true });
    }
    prev = node;
  }
}

function buildAllCurtains() {
  chains = [];
  joints = [];
  const cols = 7;
  for (let c = 0; c < cols; c++) {
    buildCurtainColumn(c, 74 + c * 60);
  }
}

function bouncePulse() {
  if (over) return;
  let hit = false;
  for (const n of chains) {
    if (n.pinned) continue;
    const d = Math.hypot(n.x - ptr.x, n.y - ptr.y);
    if (d < 56) {
      // If still attached, sever the joint above it or bounce if detached
      for (const j of joints) {
        if (j.alive && j.b === n) {
          j.alive = false;
          hit = true;
          bursts.push({ x: n.x, y: n.y, r: 4, life: 1, col: "#facc15" });
        }
      }
      n.vy -= 250;
      n.vx += (n.x - ptr.x) * 3.8 + (n.x < 256 ? -55 : 55);
      hit = true;
    }
  }
  bursts.push({ x: ptr.x, y: ptr.y, r: 8, life: 0.9, col: hit ? "#38d6ff" : "#a78bfa" });
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetBeads = Math.max(5, Number(custom.targetBeads || 22));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  buildAllCurtains();
  bursts = [];
  ptr = { x: 256, y: 180, down: false };
  collected = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  swayT = 0;
  regenT = 0;
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent = `Perles ${collected}/${targetBeads} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

function cutOrBounceAt(px, py) {
  let severed = false;
  for (const j of joints) {
    if (!j.alive) continue;
    const mx = (j.a.x + j.b.x) * 0.5, my = (j.a.y + j.b.y) * 0.5;
    if (Math.hypot(px - mx, py - my) < 20 || Math.hypot(px - j.b.x, py - j.b.y) < 16) {
      j.alive = false;
      severed = true;
      bursts.push({ x: mx, y: my, r: 5, life: 1, col: "#facc15" });
    }
  }
  if (!severed) {
    // Bounce detached beads (exact cko0.as onMouseDown mechanic)
    for (const n of chains) {
      if (n.pinned) continue;
      const d = Math.hypot(n.x - px, n.y - py);
      if (d < 44) {
        n.vy = -290 - Math.random() * 60;
        n.vx += (n.x - px) * 5.2 + (n.x < 256 ? -40 : 40);
        bursts.push({ x: n.x, y: n.y, r: 5, life: 1, col: "#38d6ff" });
      }
    }
  }
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true;
  cutOrBounceAt(p.x, p.y);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  ptr.x = p.x; ptr.y = p.y;
  if (ptr.down && !over) {
    for (const j of joints) {
      if (!j.alive) continue;
      const mx = (j.a.x + j.b.x) * 0.5, my = (j.a.y + j.b.y) * 0.5;
      if (Math.hypot(p.x - mx, p.y - my) < 17) {
        j.alive = false;
        bursts.push({ x: mx, y: my, r: 4, life: 0.9, col: "#facc15" });
      }
    }
  }
});
window.addEventListener("pointerup", () => { ptr.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) bouncePulse();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    swayT += dt;

    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      ptr.x = Math.max(18, Math.min(SIZE - 18, ptr.x + (kx / m) * 290 * dt));
      ptr.y = Math.max(18, Math.min(SIZE - 18, ptr.y + (ky / m) * 290 * dt));
    }

    // Regenerate spare curtain columns if fewer than 18 non-pinned beads remain
    regenT += dt;
    if (regenT >= 2.0) {
      regenT = 0;
      const activeCount = chains.filter(n => !n.pinned).length;
      if (activeCount < 22) {
        const colIdx = Math.floor(Math.random() * 7);
        buildCurtainColumn(colIdx, 74 + colIdx * 60);
      }
    }

    // Physics update (gravity + rhythmic curtain sway)
    for (const n of chains) {
      if (n.pinned) continue;
      n.vy += 310 * dt;
      n.vx += Math.sin(swayT * 2.4 + n.col) * 32 * dt;
      n.vx *= Math.pow(0.84, dt);
      n.vy *= Math.pow(0.95, dt);
      n.x += n.vx * dt;
      n.y += n.vy * dt;

      if (n.x < n.r + 8) { n.x = n.r + 8; n.vx = Math.abs(n.vx) * 0.72; }
      if (n.x > SIZE - n.r - 8) { n.x = SIZE - n.r - 8; n.vx = -Math.abs(n.vx) * 0.72; }
      if (n.y < n.r + 8) { n.y = n.r + 8; n.vy = Math.abs(n.vy) * 0.65; }
    }

    // Distance-joint constraints (cko0.as b2DistanceJoint)
    for (let it = 0; it < 5; it++) {
      for (const j of joints) {
        if (!j.alive) continue;
        const a = j.a, b = j.b;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = (d - j.len) / d;
        if (a.pinned) {
          b.x -= dx * diff;
          b.y -= dy * diff;
          b.vx -= (dx * diff) * 1.4;
          b.vy -= (dy * diff) * 1.4;
        } else {
          a.x += dx * diff * 0.5;
          a.y += dy * diff * 0.5;
          b.x -= dx * diff * 0.5;
          b.y -= dy * diff * 0.5;
        }
      }
    }

    // Shelf collisions
    for (const n of chains) {
      if (n.pinned) continue;
      for (const s of SHELVES) {
        const vx = s.x2 - s.x1, vy = s.y2 - s.y1;
        const l2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((n.x - s.x1) * vx + (n.y - s.y1) * vy) / l2));
        const qx = s.x1 + t * vx, qy = s.y1 + t * vy;
        const dx = n.x - qx, dy = n.y - qy;
        const dist = Math.hypot(dx, dy);
        if (dist < n.r + 5 && dist > 0.001) {
          const nx = dx / dist, ny = dy / dist;
          n.x += nx * (n.r + 5 - dist);
          n.y += ny * (n.r + 5 - dist);
          const vn = n.vx * nx + n.vy * ny;
          if (vn < 0) {
            n.vx -= 1.65 * vn * nx;
            n.vy -= 1.65 * vn * ny;
          }
        }
      }
    }

    // Check basin / hazard scoring
    for (let i = chains.length - 1; i >= 0; i--) {
      const n = chains[i];
      if (n.pinned) continue;
      let remove = false;
      for (const b of BASINS) {
        if (n.x >= b.x && n.x <= b.x + b.w && n.y >= b.y && n.y <= b.y + b.h) {
          collected++;
          score += 100;
          bursts.push({ x: n.x, y: b.y, r: 8, life: 1, col: "#4ade80" });
          remove = true;
          if (collected >= targetBeads) {
            won = true;
            over = true;
            score += Math.round(timeLeft * 20);
          }
          break;
        }
      }
      if (!remove && n.x >= HAZARD.x && n.x <= HAZARD.x + HAZARD.w && n.y >= HAZARD.y) {
        bursts.push({ x: n.x, y: HAZARD.y, r: 8, life: 1, col: "#f87171" });
        remove = true;
      }
      if (!remove && n.y > SIZE + 16) remove = true;
      if (remove) {
        for (const j of joints) {
          if (j.a === n || j.b === n) j.alive = false;
        }
        chains.splice(i, 1);
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 95 * dt;
      bursts[i].life -= 2.4 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = collected >= targetBeads;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#060914";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Basins & Hazard vent
  for (const b of BASINS) {
    ctx.fillStyle = "rgba(74, 222, 128, 0.16)";
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#86efac";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("BASSIN VERT", b.x + b.w * 0.5, b.y + 25);
  }
  ctx.fillStyle = "rgba(239, 68, 68, 0.16)";
  ctx.strokeStyle = "#f87171";
  ctx.lineWidth = 1.6;
  ctx.fillRect(HAZARD.x, HAZARD.y, HAZARD.w, HAZARD.h);
  ctx.strokeRect(HAZARD.x, HAZARD.y, HAZARD.w, HAZARD.h);
  ctx.fillStyle = "#fca5a5";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("FAILLE PERDUE", HAZARD.x + HAZARD.w * 0.5, HAZARD.y + 18);

  // Shelves
  ctx.strokeStyle = "#38bdf8";
  ctx.lineCap = "round";
  ctx.lineWidth = 8;
  for (const s of SHELVES) {
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }

  // Joints
  ctx.strokeStyle = "rgba(167, 139, 250, 0.78)";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (const j of joints) {
    if (!j.alive) continue;
    ctx.moveTo(j.a.x, j.a.y);
    ctx.lineTo(j.b.x, j.b.y);
  }
  ctx.stroke();

  // Curtain beads
  for (const n of chains) {
    ctx.fillStyle = n.pinned ? "#38bdf8" : "#a78bfa";
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
    if (!n.pinned) {
      ctx.fillStyle = "#ede9fe";
      ctx.beginPath(); ctx.arc(n.x - 2.5, n.y - 2.5, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Bursts
  for (const br of bursts) {
    ctx.strokeStyle = br.col;
    ctx.globalAlpha = Math.max(0, br.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(br.x, br.y, br.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Pointer cursor
  if (!over) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.7)";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 12, 0, Math.PI * 2); ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RIDEAU MOISSONNÉ !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Perles ${collected}/${targetBeads} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
