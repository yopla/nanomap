<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Carrefour & Donjon (Crowd PF)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #fbbf24; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.active-tool { background: #155e75; border-color: #67e8f9; }
  canvas { background: #080c16; border: 2px solid #fbbf24; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(251,191,36,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "crowd_dungeon_pf",
  "name": "Carrefour & Donjon (Crowd PF)",
  "family": "tactical",
  "icon": "🧭",
  "controls": "Cliquer/glisser sur le sol pour poser ou retirer des Murs d'énergie (max 16) • V / 🧭 Vecteurs pour voir les champs de flux • C / 🧹 pour effacer",
  "description": "Fusion de la simulation de carrefour (2A_m29Y), de la foule sur champ potentiel (12_foule), du pathfinding par zones (6H7p) et du donjon procédural (tEAA) : canalisez les explorateurs Jaunes (Bas→Haut) et Cyans (Gauche→Droite) tout en bloquant les Sentinelles rouges.",
  "goal": "Escorter 40 explorateurs jusqu'à leurs sorties avant de subir 15 pertes ou la fin des 65 secondes.",
  "fields": [
    { "key": "targetSaved", "label": "Explorateurs à sauver", "type": "number", "default": 40 },
    { "key": "maxLost", "label": "Pertes tolérées", "type": "number", "default": 15 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🧭 Crowd PF</span>
  <span id="stat">🏃 0/40 • 💀 0/15 • 🧱 0/16 • 65s</span>
  <div class="bar-btns">
    <button id="vecBtn" onclick="toggleVectors()" title="Afficher les vecteurs de flux (V)">🧭 Vec</button>
    <button onclick="clearPlayerWalls()" title="Retirer vos murs (C)">🧹 Murs</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Cliquer / glisser</b> : poser/retirer des Murs (le passage reste toujours ouvert) • Protégez les flux Jaune & Cyan contre les 3 Sentinelles rouges
</div>

<script>
const GAME_ID = "crowd_dungeon_pf";
const SIZE = 512;
const GN = 16;
const CELL = SIZE / GN;
const MAX_WALLS = 16;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetSaved = 40, maxLost = 15, durationSec = 65;
// grid: 0=floor, 1=stone dungeon wall, 2=player energy wall
let grid = new Uint8Array(GN * GN);
let playerWallQueue = [];
let distY = new Int16Array(GN * GN); // Yellow goal: top (7..8, 0)
let distC = new Int16Array(GN * GN); // Cyan goal: right (15, 7..8)

let agents = [];
let sentinels = [];
let sparks = [];
let showVectors = false;
let rejectFlash = { x: -1, y: -1, life: 0 };
let pointer = { down: false, paintVal: 2, lastKey: "" };

let saved = 0, lost = 0, timeLeft = 65, score = 0, won = false, over = false;
let spawnYTimer = 0, spawnCTimer = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function toggleVectors() {
  showVectors = !showVectors;
  document.getElementById("vecBtn").classList.toggle("active-tool", showVectors);
}

function isProtectedTile(gx, gy) {
  // Spawns and exits for both crossing streams cannot be walled
  if ((gx === 7 || gx === 8) && (gy <= 1 || gy >= GN - 2)) return true;
  if ((gy === 7 || gy === 8) && (gx <= 1 || gx >= GN - 2)) return true;
  return false;
}

function computeBFS(goals) {
  const dist = new Int16Array(GN * GN).fill(9999);
  const q = [];
  for (const g of goals) {
    const idx = g.y * GN + g.x;
    if (grid[idx] === 0) {
      dist[idx] = 0;
      q.push(idx);
    }
  }
  let head = 0;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (head < q.length) {
    const cur = q[head++];
    const cx = cur % GN, cy = Math.floor(cur / GN);
    const cd = dist[cur] + 1;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= GN || ny < 0 || ny >= GN) continue;
      const nidx = ny * GN + nx;
      if (grid[nidx] === 0 && dist[nidx] > cd) {
        dist[nidx] = cd;
        q.push(nidx);
      }
    }
  }
  return dist;
}

function recomputeFields() {
  distY = computeBFS([{ x: 7, y: 0 }, { x: 8, y: 0 }]);
  distC = computeBFS([{ x: 15, y: 7 }, { x: 15, y: 8 }]);
}

function clearPlayerWalls() {
  for (let i = 0; i < GN * GN; i++) {
    if (grid[i] === 2) grid[i] = 0;
  }
  playerWallQueue = [];
  recomputeFields();
}

function buildDungeonMap() {
  grid.fill(0);
  // Dungeon corner rooms & pillars (tEAA.as style)
  for (let y = 0; y < GN; y++) {
    for (let x = 0; x < GN; x++) {
      // Border frame except stream portals
      if (x === 0 || x === GN - 1 || y === 0 || y === GN - 1) {
        if (!isProtectedTile(x, y)) grid[y * GN + x] = 1;
      }
    }
  }
  // Carved chamber pillars with open flanking corridors
  const pillars = [
    [3, 3], [4, 3], [3, 4],
    [11, 3], [12, 3], [12, 4],
    [3, 11], [3, 12], [4, 12],
    [12, 11], [11, 12], [12, 12],
    [5, 5], [10, 5], [5, 10], [10, 10]
  ];
  for (const [px, py] of pillars) {
    grid[py * GN + px] = 1;
  }
  recomputeFields();
}

function spawnExplorer(stream) {
  if (stream === 0) {
    // Yellow: Bottom -> Top
    const lane = Math.random() < 0.5 ? 7 : 8;
    agents.push({
      stream: 0,
      x: (lane + 0.25 + Math.random() * 0.5) * CELL,
      y: (GN - 0.6) * CELL,
      vx: 0, vy: -60,
      speed: 68 + Math.random() * 14
    });
  } else {
    // Cyan: Left -> Right
    const lane = Math.random() < 0.5 ? 7 : 8;
    agents.push({
      stream: 1,
      x: 0.6 * CELL,
      y: (lane + 0.25 + Math.random() * 0.5) * CELL,
      vx: 60, vy: 0,
      speed: 68 + Math.random() * 14
    });
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetSaved = Math.max(10, Number(custom.targetSaved || 40));
  maxLost = Math.max(5, Number(custom.maxLost || 15));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  playerWallQueue = [];
  buildDungeonMap();
  agents = [];
  for (let i = 0; i < 4; i++) {
    spawnExplorer(0);
    spawnExplorer(1);
  }
  sentinels = [
    { x: 4.5 * CELL, y: 7.5 * CELL, vx: 65, vy: 45, r: 10 },
    { x: 11.5 * CELL, y: 4.5 * CELL, vx: -55, vy: 62, r: 10 },
    { x: 10.5 * CELL, y: 11.5 * CELL, vx: 58, vy: -52, r: 10 }
  ];
  sparks = [];
  saved = 0;
  lost = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  spawnYTimer = 0;
  spawnCTimer = 0;
  rejectFlash = { x: -1, y: -1, life: 0 };
  updateHud();
}

function updateHud() {
  document.getElementById("stat").textContent =
    `🏃 ${saved}/${targetSaved} • 💀 ${lost}/${maxLost} • 🧱 ${playerWallQueue.length}/${MAX_WALLS} • ${Math.ceil(timeLeft)}s`;
}

function getTileFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (SIZE / r.width);
  const py = (e.clientY - r.top) * (SIZE / r.height);
  return {
    gx: Math.max(0, Math.min(GN - 1, Math.floor(px / CELL))),
    gy: Math.max(0, Math.min(GN - 1, Math.floor(py / CELL)))
  };
}

function trySetTile(gx, gy, val) {
  const idx = gy * GN + gx;
  if (grid[idx] === 1 || isProtectedTile(gx, gy)) return;
  if (grid[idx] === val) return;

  if (val === 0) {
    grid[idx] = 0;
    const qi = playerWallQueue.indexOf(idx);
    if (qi >= 0) playerWallQueue.splice(qi, 1);
    recomputeFields();
    return;
  }

  // Temporarily place wall and validate BFS reachability (prevent soft-lock)
  let popped = null;
  if (playerWallQueue.length >= MAX_WALLS) {
    popped = playerWallQueue.shift();
    grid[popped] = 0;
  }
  grid[idx] = 2;
  const dY = computeBFS([{ x: 7, y: 0 }, { x: 8, y: 0 }]);
  const dC = computeBFS([{ x: 15, y: 7 }, { x: 15, y: 8 }]);

  let ok = dY[15 * GN + 7] < 9000 && dY[15 * GN + 8] < 9000 &&
           dC[7 * GN + 0] < 9000 && dC[8 * GN + 0] < 9000;
  if (ok) {
    for (const a of agents) {
      const agx = Math.max(0, Math.min(GN - 1, Math.floor(a.x / CELL)));
      const agy = Math.max(0, Math.min(GN - 1, Math.floor(a.y / CELL)));
      const dMap = a.stream === 0 ? dY : dC;
      if ((agx === gx && agy === gy) || dMap[agy * GN + agx] >= 9000) {
        ok = false;
        break;
      }
    }
  }

  if (ok) {
    playerWallQueue.push(idx);
    distY = dY;
    distC = dC;
  } else {
    grid[idx] = 0;
    if (popped !== null) {
      grid[popped] = 2;
      playerWallQueue.unshift(popped);
    }
    rejectFlash = { x: gx, y: gy, life: 1 };
  }
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const { gx, gy } = getTileFromEvent(e);
  const idx = gy * GN + gx;
  pointer.down = true;
  pointer.paintVal = grid[idx] === 2 ? 0 : 2;
  pointer.lastKey = `${gx},${gy}`;
  trySetTile(gx, gy, pointer.paintVal);
});
cv.addEventListener("pointermove", (e) => {
  if (!pointer.down || over) return;
  const { gx, gy } = getTileFromEvent(e);
  const k = `${gx},${gy}`;
  if (k !== pointer.lastKey) {
    pointer.lastKey = k;
    trySetTile(gx, gy, pointer.paintVal);
  }
});
window.addEventListener("pointerup", () => { pointer.down = false; });
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyV" && !e.repeat) toggleVectors();
  if (e.code === "KeyC" && !e.repeat) clearPlayerWalls();
});

function isWallAt(x, y) {
  const gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
  if (gx < 0 || gx >= GN || gy < 0 || gy >= GN) return true;
  return grid[gy * GN + gx] !== 0;
}

function flowVectorFor(gx, gy, distMap) {
  let bestD = distMap[gy * GN + gx];
  let vx = 0, vy = 0;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dx, dy] of dirs) {
    const nx = gx + dx, ny = gy + dy;
    if (nx < 0 || nx >= GN || ny < 0 || ny >= GN) continue;
    const nd = distMap[ny * GN + nx];
    if (nd < bestD) {
      bestD = nd;
      vx = dx;
      vy = dy;
    }
  }
  return { vx, vy };
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (rejectFlash.life > 0) rejectFlash.life = Math.max(0, rejectFlash.life - 3.2 * dt);

    spawnYTimer += dt;
    spawnCTimer += dt;
    if (spawnYTimer >= 1.1 && agents.length < 36) { spawnYTimer = 0; spawnExplorer(0); }
    if (spawnCTimer >= 1.15 && agents.length < 36) { spawnCTimer = 0; spawnExplorer(1); }

    // Update Sentinels (dungeon patrols bouncing off walls & chasing nearby explorers)
    for (const s of sentinels) {
      let nearest = null, bestD = 125;
      for (const a of agents) {
        const d = Math.hypot(a.x - s.x, a.y - s.y);
        if (d < bestD) { bestD = d; nearest = a; }
      }
      if (nearest && bestD > 2) {
        s.vx += ((nearest.x - s.x) / bestD) * 95 * dt;
        s.vy += ((nearest.y - s.y) / bestD) * 95 * dt;
      }
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > 92) { s.vx = (s.vx / sp) * 92; s.vy = (s.vy / sp) * 92; }
      else if (sp < 45 && sp > 1e-4) { s.vx = (s.vx / sp) * 45; s.vy = (s.vy / sp) * 45; }

      const nx = s.x + s.vx * dt;
      if (!isWallAt(nx - s.r, s.y) && !isWallAt(nx + s.r, s.y)) s.x = nx;
      else s.vx = -s.vx;

      const ny = s.y + s.vy * dt;
      if (!isWallAt(s.x, ny - s.r) && !isWallAt(s.x, ny + s.r)) s.y = ny;
      else s.vy = -s.vy;
    }

    // Update crowd explorers (2A_m29Y + 12_foule + 6H7p flow field)
    for (let i = agents.length - 1; i >= 0; i--) {
      const a = agents[i];
      const gx = Math.max(0, Math.min(GN - 1, Math.floor(a.x / CELL)));
      const gy = Math.max(0, Math.min(GN - 1, Math.floor(a.y / CELL)));
      const dMap = a.stream === 0 ? distY : distC;
      const f = flowVectorFor(gx, gy, dMap);

      // Desired target: center of next flow tile
      const tx = (gx + f.vx + 0.5) * CELL;
      const ty = (gy + f.vy + 0.5) * CELL;
      const dx = tx - a.x, dy = ty - a.y;
      const d = Math.max(1e-4, Math.hypot(dx, dy));
      let steerX = (dx / d) * a.speed;
      let steerY = (dy / d) * a.speed;

      // Crowd separation (2A_m29Y)
      for (let j = 0; j < agents.length; j++) {
        if (i === j) continue;
        const o = agents[j];
        const ox = a.x - o.x, oy = a.y - o.y;
        const od = Math.hypot(ox, oy);
        if (od > 1e-4 && od < 15) {
          steerX += (ox / od) * (15 - od) * 10;
          steerY += (oy / od) * (15 - od) * 10;
        }
      }

      a.vx += (steerX - a.vx) * Math.min(1, dt * 8);
      a.vy += (steerY - a.vy) * Math.min(1, dt * 8);

      const nx = a.x + a.vx * dt;
      if (!isWallAt(nx - 5, a.y) && !isWallAt(nx + 5, a.y)) a.x = nx;
      else a.vx *= -0.3;

      const ny = a.y + a.vy * dt;
      if (!isWallAt(a.x, ny - 5) && !isWallAt(a.x, ny + 5)) a.y = ny;
      else a.vy *= -0.3;

      // Reached exit?
      if ((a.stream === 0 && a.y < CELL * 0.85) || (a.stream === 1 && a.x > SIZE - CELL * 0.85)) {
        saved++;
        score += 45;
        sparks.push({ x: a.x, y: a.y, r: 5, life: 0.9, col: a.stream === 0 ? "#facc15" : "#38d6ff" });
        agents.splice(i, 1);
        if (saved >= targetSaved) {
          won = true;
          over = true;
          score += Math.round(timeLeft * 20) + (maxLost - lost) * 25;
          break;
        }
        continue;
      }

      // Caught by sentinel?
      for (const s of sentinels) {
        if (Math.hypot(a.x - s.x, a.y - s.y) < s.r + 6) {
          lost++;
          sparks.push({ x: a.x, y: a.y, r: 6, life: 1, col: "#ef4444" });
          agents.splice(i, 1);
          if (lost >= maxLost) { won = false; over = true; }
          break;
        }
      }
      if (over) break;
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      sparks[i].r += 55 * dt;
      sparks[i].life -= 2.4 * dt;
      if (sparks[i].life <= 0) sparks.splice(i, 1);
    }

    if (timeLeft <= 0 && !over) {
      won = saved >= targetSaved;
      over = true;
    }
    updateHud();
  }

  // Render Dungeon Grid
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, SIZE, SIZE);

  for (let y = 0; y < GN; y++) {
    for (let x = 0; x < GN; x++) {
      const v = grid[y * GN + x];
      const px = x * CELL, py = y * CELL;
      if (v === 1) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
      } else if (v === 2) {
        ctx.fillStyle = "rgba(56, 214, 255, 0.25)";
        ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
        ctx.strokeStyle = "#38d6ff";
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
      } else {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
        ctx.lineWidth = 1;
        ctx.strokeRect(px, py, CELL, CELL);
      }
    }
  }

  // Portals
  ctx.fillStyle = "rgba(250, 204, 21, 0.22)";
  ctx.fillRect(7 * CELL, 0, CELL * 2, CELL);
  ctx.fillRect(7 * CELL, 15 * CELL, CELL * 2, CELL);
  ctx.fillStyle = "#facc15";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SORTIE ▲", 8 * CELL, 20);
  ctx.fillText("ENTRÉE ▲", 8 * CELL, SIZE - 12);

  ctx.fillStyle = "rgba(56, 214, 255, 0.22)";
  ctx.fillRect(0, 7 * CELL, CELL, CELL * 2);
  ctx.fillRect(15 * CELL, 7 * CELL, CELL, CELL * 2);
  ctx.fillStyle = "#38d6ff";
  ctx.fillText("▶", 16, 8 * CELL + 4);
  ctx.fillText("FIN ▶", SIZE - 16, 8 * CELL + 4);

  // Flow vector debug overlay (2A_m29Y)
  if (showVectors) {
    ctx.lineWidth = 1.3;
    for (let y = 1; y < GN - 1; y++) {
      for (let x = 1; x < GN - 1; x++) {
        if (grid[y * GN + x] !== 0) continue;
        const fy = flowVectorFor(x, y, distY);
        const fc = flowVectorFor(x, y, distC);
        const cx = (x + 0.5) * CELL, cy = (y + 0.5) * CELL;
        ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
        ctx.beginPath(); ctx.moveTo(cx - 3, cy - 3); ctx.lineTo(cx - 3 + fy.vx * 8, cy - 3 + fy.vy * 8); ctx.stroke();
        ctx.strokeStyle = "rgba(56, 214, 255, 0.5)";
        ctx.beginPath(); ctx.moveTo(cx + 3, cy + 3); ctx.lineTo(cx + 3 + fc.vx * 8, cy + 3 + fc.vy * 8); ctx.stroke();
      }
    }
  }

  // Rejected wall feedback
  if (rejectFlash.life > 0) {
    ctx.fillStyle = `rgba(239, 68, 68, ${rejectFlash.life * 0.65})`;
    ctx.fillRect(rejectFlash.x * CELL, rejectFlash.y * CELL, CELL, CELL);
  }

  // Explorers
  for (const a of agents) {
    ctx.fillStyle = a.stream === 0 ? "#fde047" : "#38d6ff";
    ctx.beginPath();
    ctx.arc(a.x, a.y, 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#080c16";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Dungeon Sentinels
  for (const s of sentinels) {
    ctx.fillStyle = "#dc2626";
    ctx.strokeStyle = "#fecaca";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x - 3, s.y - 2, 1.8, 0, Math.PI * 2); ctx.arc(s.x + 3, s.y - 2, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  for (const sp of sparks) {
    ctx.strokeStyle = sp.col;
    ctx.globalAlpha = Math.max(0, sp.life);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "FOULE ESCORTÉE !" : (lost >= maxLost ? "TROP DE PERTES" : "CHRONO ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Sauvés: ${saved}/${targetSaved} • Pertes: ${lost}/${maxLost} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }

  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
