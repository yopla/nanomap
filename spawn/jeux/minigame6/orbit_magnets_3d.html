<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Aimants & Orbites 3D (Orbit Magnets)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #c084fc; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #050612; border: 2px solid #c084fc; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: grab; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(192,132,252,0.18); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "orbit_magnets_3d",
  "name": "Aimants & Orbites 3D (Orbit Magnets)",
  "family": "core",
  "icon": "🪐",
  "controls": "Glisser la Planète 3D ou les Aimants pour dévier les flux de particules • Double-clic ou 🧲 +Aimant pour poser jusqu'à 5 aimants",
  "description": "Fusion du ballet gravitationnel Flint (ballet), des aimants orbitaux à halo dynamique (2_Aiv2), de la planète à satellites 3D (3_uCsw_3D / uCsw / iKZk) et des moucherons magnétiques (hT8b) : guidez le flux vers les 3 collecteurs orbitaux tout en évitant la faille sombre.",
  "goal": "Remplir les 3 collecteurs (15 particules chacun = 45 au total) avant la fin des 60 secondes.",
  "fields": [
    { "key": "perCollector", "label": "Particules par collecteur", "type": "number", "default": 15 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🪐 Orbit Magnets</span>
  <span id="stat">✨ 0/45 • 🧲 3/5 • 60s</span>
  <div class="bar-btns">
    <button onclick="addMagnetAtCenter()" title="Ajouter un aimant (Double-clic)">🧲 +Aimant</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Glisser</b> : déplacer la Planète 3D & les Aimants • <b>Double-clic</b> : ajouter un aimant (max 5) • Remplissez les 3 anneaux orbitaux
</div>

<script>
const GAME_ID = "orbit_magnets_3d";
const SIZE = 512;
const FOCAL = 240;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let perCollector = 15, durationSec = 60;
let planet = { x: 256, y: 256, r: 22, dragging: false };
let moons3D = [];
let magnets = [];
let particles = [];
let collectors = [];
let rift = { x: 256, y: 140, vx: 48, vy: 28, r: 22, phase: 0 };
let draggedObj = null;
let lastTapT = 0;
let emitTimer = 0, timeLeft = 60, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function spawnParticle() {
  if (particles.length >= 95) return;
  const ang = 0.45 + (Math.random() - 0.5) * 0.48;
  const spd = 120 + Math.random() * 65;
  particles.push({
    x: 42 + (Math.random() - 0.5) * 14,
    y: 48 + (Math.random() - 0.5) * 14,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    px: 42, py: 48,
    hue: 185 + Math.random() * 115,
    gnatPhase: Math.random() * 6.28
  });
}

function addMagnet(x, y) {
  if (magnets.length >= 5) return;
  magnets.push({ x, y, size: 6, connections: 0, orbit: 72 });
}

function addMagnetAtCenter() {
  if (over) return;
  addMagnet(180 + Math.random() * 150, 180 + Math.random() * 150);
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  perCollector = Math.max(5, Number(custom.perCollector || 15));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  planet = { x: 256, y: 256, r: 22 };
  // 3_uCsw_3D.as 3D orbiting satellites (x, y, z around planet)
  moons3D = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const rad = 42 + (i % 3) * 16;
    moons3D.push({
      x: Math.cos(a) * rad,
      y: (Math.random() - 0.5) * 34,
      z: Math.sin(a) * rad,
      vx: -Math.sin(a) * 65,
      vy: (Math.random() - 0.5) * 28,
      vz: Math.cos(a) * 65,
      col: i % 2 === 0 ? "#67e8f9" : "#fde047"
    });
  }

  magnets = [];
  addMagnet(145, 195);
  addMagnet(240, 365);
  addMagnet(355, 215);

  collectors = [
    { x: 428, y: 112, r: 29, count: 0, max: perCollector, angle: 0 },
    { x: 432, y: 388, r: 29, count: 0, max: perCollector, angle: 2.1 },
    { x: 112, y: 424, r: 29, count: 0, max: perCollector, angle: 4.2 }
  ];

  rift = { x: 285, y: 135, vx: 52, vy: 34, r: 22, phase: 0 };
  particles = [];
  for (let i = 0; i < 24; i++) spawnParticle();

  draggedObj = null;
  emitTimer = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  updateHud();
}

function updateHud() {
  const tot = collectors.reduce((s, c) => s + c.count, 0);
  const goal = perCollector * collectors.length;
  document.getElementById("stat").textContent =
    `✨ ${tot}/${goal} • 🧲 ${magnets.length}/5 • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(16, Math.min(SIZE - 16, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(16, Math.min(SIZE - 16, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  const now = performance.now();
  if (now - lastTapT < 310 && magnets.length < 5) {
    // Check not clicking directly on planet or existing magnet
    const hitExisting = Math.hypot(p.x - planet.x, p.y - planet.y) < 36 ||
      magnets.some((m) => Math.hypot(p.x - m.x, p.y - m.y) < 32);
    if (!hitExisting) {
      addMagnet(p.x, p.y);
      lastTapT = 0;
      return;
    }
  }
  lastTapT = now;

  if (Math.hypot(p.x - planet.x, p.y - planet.y) < planet.r + 18) {
    draggedObj = planet;
    return;
  }
  for (const m of magnets) {
    if (Math.hypot(p.x - m.x, p.y - m.y) < 32) {
      draggedObj = m;
      return;
    }
  }
});
cv.addEventListener("pointermove", (e) => {
  if (!draggedObj || over) return;
  const p = getPos(e);
  draggedObj.x += (p.x - draggedObj.x) * 0.45;
  draggedObj.y += (p.y - draggedObj.y) * 0.45;
});
window.addEventListener("pointerup", () => { draggedObj = null; });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    emitTimer += dt;
    if (emitTimer >= 0.085) {
      emitTimer = 0;
      spawnParticle();
    }

    // 3D orbiting moons around central planet (3_uCsw_3D.as)
    for (const m of moons3D) {
      const d2 = m.x * m.x + m.y * m.y + m.z * m.z;
      const d = Math.max(24, Math.sqrt(d2));
      const f = 320000 / (d2 + 1200);
      m.vx -= (m.x / d) * f * dt;
      m.vy -= (m.y / d) * f * dt;
      m.vz -= (m.z / d) * f * dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.z += m.vz * dt;
    }

    // Patrolling Dark Rift
    rift.phase += dt * 4;
    rift.x += rift.vx * dt;
    rift.y += rift.vy * dt;
    if (rift.x < 90 || rift.x > SIZE - 90) rift.vx = -rift.vx;
    if (rift.y < 90 || rift.y > SIZE - 90) rift.vy = -rift.vy;

    for (const c of collectors) c.angle += dt * 1.8;
    for (const m of magnets) m.connections = 0;

    // Update particles (2_Aiv2 magnetic pull + 3_uCsw gravity + hT8b gnat swirl)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.px = p.x;
      p.py = p.y;
      p.gnatPhase += dt * 9;

      // Central 3D Planet inverse-square + tangential swirl
      const pdx = planet.x - p.x, pdy = planet.y - p.y;
      const pd = Math.max(24, Math.hypot(pdx, pdy));
      if (pd < 240) {
        const gf = 29000 / (pd * pd + 650);
        p.vx += (pdx / pd) * gf * dt - (pdy / pd) * gf * 0.25 * dt;
        p.vy += (pdy / pd) * gf * dt + (pdx / pd) * gf * 0.25 * dt;
      }

      // Magnets (2_Aiv2.as)
      for (const m of magnets) {
        const mdx = m.x - p.x, mdy = m.y - p.y;
        const md = Math.max(14, Math.hypot(mdx, mdy));
        if (md < 185) {
          m.connections++;
          const pull = (1 - md / 185) * 320 * dt;
          p.vx += (mdx / md) * pull - (mdy / md) * pull * 0.35;
          p.vy += (mdy / md) * pull + (mdx / md) * pull * 0.35;
        }
      }

      // hT8b gnat jitter
      p.vx += Math.cos(p.gnatPhase) * 35 * dt;
      p.vy += Math.sin(p.gnatPhase) * 35 * dt;

      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 270) { p.vx = (p.vx / sp) * 270; p.vy = (p.vy / sp) * 270; }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (p.x < 6 || p.x > SIZE - 6 || p.y < 6 || p.y > SIZE - 6) {
        particles.splice(i, 1);
        continue;
      }

      // Dark Rift absorbs particles
      if (Math.hypot(p.x - rift.x, p.y - rift.y) < rift.r) {
        particles.splice(i, 1);
        continue;
      }

      // Collectors capture particles
      let captured = false;
      for (const c of collectors) {
        if (c.count < c.max && Math.hypot(p.x - c.x, p.y - c.y) < c.r) {
          c.count++;
          score += 35;
          particles.splice(i, 1);
          captured = true;
          break;
        }
      }
      if (captured) continue;
    }

    for (const m of magnets) {
      m.size += (Math.max(4, m.connections * 0.85) - m.size) * Math.min(1, dt * 6);
    }

    if (collectors.every((c) => c.count >= c.max)) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 25);
    } else if (timeLeft <= 0) {
      won = false;
      over = true;
    }
    updateHud();
  }

  // Render Space Canvas
  ctx.fillStyle = "rgba(5, 6, 18, 0.36)";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Emitter beacon top-left (ballet.as)
  const eg = ctx.createRadialGradient(42, 48, 2, 42, 48, 28);
  eg.addColorStop(0, "#67e8f9");
  eg.addColorStop(1, "rgba(56, 214, 255, 0)");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(42, 48, 28, 0, Math.PI * 2); ctx.fill();

  // Orbital Collectors
  for (const c of collectors) {
    const full = c.count >= c.max;
    const pct = c.count / c.max;
    ctx.fillStyle = full ? "rgba(74, 222, 128, 0.2)" : "rgba(56, 214, 255, 0.12)";
    ctx.strokeStyle = full ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 5, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#e6f4ff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${c.count}/${c.max}`, c.x, c.y + 4);
  }

  // Dark Rift hazard
  ctx.fillStyle = "#1c0512";
  ctx.strokeStyle = "#f43f5e";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(rift.x, rift.y, rift.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(244, 63, 94, 0.35)";
  ctx.beginPath(); ctx.arc(rift.x, rift.y, rift.r + 6 + Math.sin(rift.phase) * 3, 0, Math.PI * 2); ctx.stroke();

  // Magnets with dynamic 2_Aiv2 connection halos
  for (const m of magnets) {
    ctx.fillStyle = "rgba(217, 70, 239, 0.16)";
    ctx.beginPath(); ctx.arc(m.x, m.y, Math.min(54, m.size * 3.8), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c084fc";
    ctx.strokeStyle = "#f5d0fe";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(m.x, m.y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(192, 132, 252, 0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x, m.y, 70, 0, Math.PI * 2); ctx.stroke();
  }

  // Particles with ballet.as glowing trails
  for (const p of particles) {
    ctx.strokeStyle = `hsla(${p.hue}, 95%, 68%, 0.85)`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  // Depth-sorted 3D moons behind and in front of the 3D Planet (3_uCsw_3D.as)
  const sortedMoons = [...moons3D].sort((a, b) => b.z - a.z);
  for (const m of sortedMoons) {
    if (m.z <= 0) continue;
    const sc = FOCAL / Math.max(40, FOCAL + m.z);
    ctx.fillStyle = m.col;
    ctx.beginPath();
    ctx.arc(planet.x + m.x * sc, planet.y + m.y * sc, Math.max(1.5, 3.6 * sc), 0, Math.PI * 2);
    ctx.fill();
  }

  // Central 3D Planet
  const pg = ctx.createRadialGradient(planet.x - 6, planet.y - 6, 3, planet.x, planet.y, planet.r);
  pg.addColorStop(0, "#93c5fd");
  pg.addColorStop(0.55, "#2563eb");
  pg.addColorStop(1, "#1e1b4b");
  ctx.fillStyle = pg;
  ctx.strokeStyle = "#67e8f9";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  for (const m of sortedMoons) {
    if (m.z > 0) continue;
    const sc = FOCAL / Math.max(40, FOCAL + m.z);
    ctx.fillStyle = m.col;
    ctx.beginPath();
    ctx.arc(planet.x + m.x * sc, planet.y + m.y * sc, Math.max(1.5, 3.6 * sc), 0, Math.PI * 2);
    ctx.fill();
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "COLLECTEURS SATURÉS !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    const tot = collectors.reduce((s, c) => s + c.count, 0);
    ctx.fillText(`Particules: ${tot}/${perCollector * 3} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
