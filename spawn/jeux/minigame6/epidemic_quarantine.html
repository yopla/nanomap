<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Quarantaine SEIRD (Epidemic Lab)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #f43f5e; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.wall-mode { background: #881337; border-color: #fb7185; color: #ffe4e6; }
  canvas { background: #080b14; border: 2px solid #f43f5e; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(244,63,94,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "epidemic_quarantine",
  "name": "Quarantaine SEIRD (Epidemic Lab)",
  "family": "zooEcosys",
  "icon": "🦠",
  "controls": "Cliquer pour déclencher l'outil actif • Espace, Clic droit ou bouton 🚧 pour basculer entre 💉 Vaccin et 🚧 Quarantaine (3 anneaux max)",
  "description": "Fusion de la simulation épidémiologique SEIRD (sCYT/pjSB) et de la contagion par contact (h9yX) : suivez le graphe temps réel des états Sain (vert), Incubation (jaune), Infecté (rouge), Immunisé (bleu) et Décédé (gris). Contenez les foyers avec des anneaux et vaccinez la population.",
  "goal": "Éradiquer tous les cas jaunes et rouges tout en gardant au moins 65 survivants avant la fin des 60 secondes.",
  "fields": [
    { "key": "minSurvivors", "label": "Survivants minimum", "type": "number", "default": 65 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🦠 Epidemic Lab</span>
  <span id="stat">❤️ 95 • ☣️ 10 • 60s</span>
  <div class="bar-btns">
    <button id="modeBtn" onclick="toggleMode()" title="Basculer Vaccin / Quarantaine (Espace)">💉 Vaccin</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic</b> : 💉 Impulsion Vaccin (soigne & immunise) ou 🚧 Anneau de Quarantaine • <b>Espace / Clic droit</b> : changer d'outil
</div>

<script>
const GAME_ID = "epidemic_quarantine";
const SIZE = 512;
const TOTAL_AGENTS = 95;
const S = 0, E = 1, I = 2, R = 3, D = 4; // Healthy, Incubating, Infected, Immune, Dead
const STATE_COLORS = ["#4ade80", "#facc15", "#ef4444", "#38d6ff", "#64748b"];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let minSurvivors = 65, durationSec = 60;
let agents = [];
let rings = [];
let pulses = [];
let history = [];
let wallMode = false;
let vaxCd = 0, histTimer = 0;
let timeLeft = 60, score = 0, won = false, over = false, failReason = "";
let counts = [0, 0, 0, 0, 0];

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function toggleMode(force) {
  wallMode = typeof force === "boolean" ? force : !wallMode;
  const btn = document.getElementById("modeBtn");
  btn.textContent = wallMode ? "🚧 Anneau" : "💉 Vaccin";
  btn.classList.toggle("wall-mode", wallMode);
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  minSurvivors = Math.max(20, Number(custom.minSurvivors || 65));
  durationSec = Math.max(20, Number(custom.durationSec || 60));

  agents = [];
  for (let i = 0; i < TOTAL_AGENTS; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 46 + Math.random() * 28;
    let st = S;
    if (i < 5) st = I;
    else if (i < 10) st = E;
    agents.push({
      x: 24 + Math.random() * (SIZE - 48),
      y: 24 + Math.random() * (SIZE - 48),
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      state: st,
      timer: st === E ? 3.2 + Math.random() * 1.5 : (st === I ? 10.0 : 0),
      hp: 100
    });
  }
  rings = [];
  pulses = [];
  history = [];
  vaxCd = 0;
  histTimer = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  failReason = "";
  toggleMode(false);
  recount();
  updateHud();
}

function recount() {
  counts = [0, 0, 0, 0, 0];
  for (const a of agents) counts[a.state]++;
}

function updateHud() {
  const alive = TOTAL_AGENTS - counts[D];
  const active = counts[E] + counts[I];
  const cdTxt = !wallMode && vaxCd > 0 ? ` • CD ${vaxCd.toFixed(1)}s` : "";
  document.getElementById("stat").textContent =
    `❤️ ${alive}/${minSurvivors} • ☣️ ${active} • 🚧 ${rings.length}/3${cdTxt} • ${Math.ceil(timeLeft)}s`;
}

function getPos(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (ev.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (ev.clientY - r.top) * (SIZE / r.height)))
  };
}

function applyTool(px, py) {
  if (over) return;
  if (wallMode) {
    if (rings.length >= 3) rings.shift();
    rings.push({ x: px, y: py, r: 58, life: 10.0 });
  } else {
    if (vaxCd > 0) return;
    vaxCd = 1.15;
    pulses.push({ x: px, y: py, r: 8, maxR: 56, life: 1 });
    let cured = 0;
    for (const a of agents) {
      if (a.state !== D && Math.hypot(a.x - px, a.y - py) <= 56) {
        if (a.state === I || a.state === E) cured++;
        a.state = R;
        a.hp = 100;
      }
    }
    score += cured * 35 + 10;
  }
}

cv.addEventListener("contextmenu", (ev) => ev.preventDefault());
cv.addEventListener("pointerdown", (ev) => {
  if (over) { sendResultAndExit(won, score); return; }
  if (ev.button === 2) { toggleMode(); return; }
  const p = getPos(ev);
  applyTool(p.x, p.y);
});
window.addEventListener("keydown", (ev) => {
  if (ev.code === "Space" && !ev.repeat) {
    ev.preventDefault();
    toggleMode();
  }
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (vaxCd > 0) vaxCd = Math.max(0, vaxCd - dt);

    // Update quarantine rings
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }

    // Move agents & enforce quarantine rings
    for (const a of agents) {
      if (a.state === D) continue;
      const spdScale = a.state === I ? 0.85 : 1.0;
      const prevX = a.x, prevY = a.y;
      a.x += a.vx * spdScale * dt;
      a.y += a.vy * spdScale * dt;

      if (a.x < 12) { a.x = 12; a.vx = Math.abs(a.vx); }
      if (a.x > SIZE - 12) { a.x = SIZE - 12; a.vx = -Math.abs(a.vx); }
      if (a.y < 12) { a.y = 12; a.vy = Math.abs(a.vy); }
      if (a.y > SIZE - 12) { a.y = SIZE - 12; a.vy = -Math.abs(a.vy); }

      // Bounce against quarantine ring boundaries
      for (const rg of rings) {
        const dPrev = Math.hypot(prevX - rg.x, prevY - rg.y);
        const dx = a.x - rg.x, dy = a.y - rg.y;
        const dNow = Math.max(1e-4, Math.hypot(dx, dy));
        if ((dPrev < rg.r && dNow >= rg.r - 4) || (dPrev > rg.r && dNow <= rg.r + 4)) {
          const nx = dx / dNow, ny = dy / dNow;
          const dot = a.vx * nx + a.vy * ny;
          a.vx -= 2 * dot * nx;
          a.vy -= 2 * dot * ny;
          const targetR = dPrev < rg.r ? rg.r - 5 : rg.r + 5;
          a.x = rg.x + nx * targetR;
          a.y = rg.y + ny * targetR;
        }
      }

      // SEIRD state timer
      if (a.state === E) {
        a.timer -= dt;
        if (a.timer <= 0) {
          a.state = I;
          a.timer = 10.0;
        }
      } else if (a.state === I) {
        a.hp -= 10.0 * dt; // 100 -> 0 over 10s
        a.timer -= dt;
        if (a.hp <= 0) {
          a.state = D;
          a.hp = 0;
        } else if (a.timer <= 0) {
          a.state = R;
        }
      }
    }

    // Contagion contact check (h9yX.as 16px contact radius)
    for (let i = 0; i < agents.length; i++) {
      const a = agents[i];
      if (a.state !== I) continue;
      for (let j = 0; j < agents.length; j++) {
        if (i === j) continue;
        const b = agents[j];
        if (b.state !== S) continue;
        if (Math.hypot(a.x - b.x, a.y - b.y) < 16) {
          if (Math.random() < 4.5 * dt) {
            b.state = E;
            b.timer = 4.5;
          }
        }
      }
    }

    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i].r += 160 * dt;
      pulses[i].life -= 2.4 * dt;
      if (pulses[i].life <= 0) pulses.splice(i, 1);
    }

    recount();
    histTimer += dt;
    if (histTimer >= 0.25) {
      histTimer = 0;
      history.push([...counts]);
      if (history.length > 90) history.shift();
    }

    const alive = TOTAL_AGENTS - counts[D];
    const active = counts[E] + counts[I];
    if (alive < minSurvivors) {
      won = false;
      over = true;
      failReason = "TROP DE PERTES";
    } else if (active === 0) {
      won = true;
      over = true;
      score += alive * 15 + Math.round(timeLeft * 20);
    } else if (timeLeft <= 0) {
      won = false;
      over = true;
      failReason = "ÉPIDÉMIE NON ENRAYÉE";
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#080b14";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Quarantine rings
  for (const rg of rings) {
    ctx.fillStyle = "rgba(244, 63, 94, 0.08)";
    ctx.strokeStyle = `rgba(251, 113, 133, ${Math.min(1, rg.life / 2)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fda4af";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${Math.ceil(rg.life)}s`, rg.x, rg.y - rg.r - 5);
  }

  // Vaccine pulses
  for (const p of pulses) {
    ctx.fillStyle = `rgba(56, 214, 255, ${p.life * 0.18})`;
    ctx.strokeStyle = `rgba(56, 214, 255, ${p.life})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Agents
  for (const a of agents) {
    ctx.fillStyle = STATE_COLORS[a.state];
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.state === I ? 5.2 : 4.2, 0, Math.PI * 2);
    ctx.fill();
    if (a.state === I) {
      ctx.strokeStyle = "rgba(239, 68, 68, 0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(a.x, a.y, 14, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Bottom-left SEIRD live mini-graph (sCYT.as)
  const gx = 10, gy = SIZE - 68, gw = 128, gh = 56;
  ctx.fillStyle = "rgba(7, 11, 20, 0.78)";
  ctx.strokeStyle = "#2b597a";
  ctx.lineWidth = 1;
  ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeRect(gx, gy, gw, gh);
  if (history.length > 1) {
    const dx = gw / (history.length - 1);
    for (let st = 0; st < 5; st++) {
      ctx.strokeStyle = STATE_COLORS[st];
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const px = gx + i * dx;
        const py = gy + gh - (history[i][st] / TOTAL_AGENTS) * (gh - 6) - 3;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ÉPIDÉMIE ÉRADIQUÉE !" : failReason, 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Survivants: ${TOTAL_AGENTS - counts[D]}/${TOTAL_AGENTS} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
