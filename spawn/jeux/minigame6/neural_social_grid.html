<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Réseau Social & SOM (Neural Grid)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #818cf8; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.purge-active { background: #7f1d1d; border-color: #f87171; color: #fee2e2; }
  canvas { background: #070a16; border: 2px solid #818cf8; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(129,140,248,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "neural_social_grid",
  "name": "Réseau Social & SOM (Neural Grid)",
  "family": "core",
  "icon": "🧠",
  "controls": "Cliquer 2 nœuds (ou glisser d'un nœud à un autre) pour les Échanger • Double-clic, Espace ou ⚡ Purger pour neutraliser un nœud Traître rouge (3 charges/vague)",
  "description": "Fusion du modèle de ségrégation de Schelling (rtoK), du dilemme du prisonnier (UUPT), de la carte auto-organisatrice SOM auto-cicatrisante (1kTi) et des conflits N-Reines (wh2d) : regroupez Coopérateurs bleus et Symbiotes verts et séparez les Traîtres rouges des lignes/diagonales communes.",
  "goal": "Stabiliser les 3 vagues d'Harmonie (80% / 85% / 88%) avant la fin des 70 secondes.",
  "fields": [
    { "key": "targetWaves", "label": "Vagues à stabiliser", "type": "number", "default": 3 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 70 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🧠 Neural Grid</span>
  <span id="stat">Vague 1/3 • 0%/80% • ⚡3 • 70s</span>
  <div class="bar-btns">
    <button id="purgeBtn" onclick="onPurgeButton()" title="Purger un Traître rouge (Espace / Double-clic)">⚡ Purge (3)</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic / Glisser</b> : échanger 2 nœuds (regrouper Bleus & Verts) • <b>Double-clic / Espace</b> : ⚡ Purger un Traître rouge (casser ses rayons)
</div>

<script>
const GAME_ID = "neural_social_grid";
const SIZE = 512;
const GN = 6;
const MARGIN = 68;
const SPAN = (SIZE - MARGIN * 2) / (GN - 1);
const COOP = 0, SYMB = 1, DEFECT = 2, PURGED = -1;
const WAVE_THRESHOLDS = [0.80, 0.85, 0.88];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetWaves = 3, durationSec = 70;
let nodes = [];
let selectedIdx = -1;
let dragStartIdx = -1;
let purgeMode = false;
let purgesLeft = 3;
let waveIdx = 0;
let harmony = 0;
let conflictPairs = [];
let bursts = [];
let lastClickTime = 0, lastClickIdx = -1;
let timeLeft = 70, score = 0, won = false, over = false, advanceTimer = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function updatePurgeBtn() {
  const btn = document.getElementById("purgeBtn");
  btn.textContent = `⚡ Purge (${purgesLeft})`;
  btn.classList.toggle("purge-active", purgeMode);
}

function initWave(wIdx) {
  nodes = [];
  const total = GN * GN;
  const numRed = 4 + wIdx; // 4, 5, 6 traitors across waves
  const states = [];
  for (let i = 0; i < total; i++) {
    if (i < numRed) states.push(DEFECT);
    else if (i < numRed + Math.floor((total - numRed) / 2)) states.push(COOP);
    else states.push(SYMB);
  }
  // Fisher-Yates shuffle
  for (let i = states.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = states[i]; states[i] = states[j]; states[j] = tmp;
  }

  for (let gy = 0; gy < GN; gy++) {
    for (let gx = 0; gx < GN; gx++) {
      const idx = gy * GN + gx;
      const ax = MARGIN + gx * SPAN;
      const ay = MARGIN + gy * SPAN;
      nodes.push({
        gx, gy,
        ax, ay,
        wx: ax + (Math.random() - 0.5) * 16,
        wy: ay + (Math.random() - 0.5) * 16,
        state: states[idx],
        satisfied: false
      });
    }
  }
  selectedIdx = -1;
  dragStartIdx = -1;
  purgeMode = false;
  purgesLeft = 3;
  advanceTimer = 0;
  evaluateNetwork();
  updatePurgeBtn();
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetWaves = Math.max(1, Number(custom.targetWaves || 3));
  durationSec = Math.max(25, Number(custom.durationSec || 70));

  waveIdx = 0;
  bursts = [];
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  initWave(0);
  updateHud();
}

function evaluateNetwork() {
  // 1. Schelling satisfaction (rtoK.as) on Coop & Symb nodes
  let liveNonRed = 0, satCount = 0;
  const reds = [];
  for (const n of nodes) {
    if (n.state === PURGED) { n.satisfied = true; continue; }
    if (n.state === DEFECT) { n.satisfied = false; reds.push(n); continue; }
    liveNonRed++;
    let same = 0, validNbrs = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = n.gx + dx, ny = n.gy + dy;
        if (nx < 0 || nx >= GN || ny < 0 || ny >= GN) continue;
        const nb = nodes[ny * GN + nx];
        if (nb.state === PURGED) continue;
        validNbrs++;
        if (nb.state === n.state) same++;
      }
    }
    n.satisfied = validNbrs === 0 || (same / validNbrs) >= 0.5;
    if (n.satisfied) satCount++;
  }

  // 2. N-Queens conflict rays between Traitors (wh2d.as)
  conflictPairs = [];
  for (let i = 0; i < reds.length; i++) {
    for (let j = i + 1; j < reds.length; j++) {
      const a = reds[i], b = reds[j];
      if (a.gx === b.gx || a.gy === b.gy || Math.abs(a.gx - b.gx) === Math.abs(a.gy - b.gy)) {
        conflictPairs.push([a, b]);
      }
    }
  }

  const baseSat = liveNonRed > 0 ? satCount / liveNonRed : 1;
  harmony = Math.max(0, Math.min(1, baseSat - conflictPairs.length * 0.12));
}

function somRipple(centerIdx, strength = 18) {
  // 1kTi.as Kohonen neighborhood pull
  const c = nodes[centerIdx];
  for (const n of nodes) {
    if (n.state === PURGED) continue;
    const d = Math.abs(n.gx - c.gx) + Math.abs(n.gy - c.gy);
    if (d <= 2) {
      const inf = Math.exp(-d * 0.8);
      n.wx += (c.ax - n.wx) * 0.25 * inf + (Math.random() - 0.5) * strength * inf * 0.3;
      n.wy += (c.ay - n.wy) * 0.25 * inf + (Math.random() - 0.5) * strength * inf * 0.3;
    }
  }
}

function swapNodes(i1, i2) {
  if (i1 === i2 || i1 < 0 || i2 < 0) return;
  const a = nodes[i1], b = nodes[i2];
  const tmp = a.state;
  a.state = b.state;
  b.state = tmp;
  // Animate physical coordinates crossing via SOM adaptation
  const tx = a.wx, ty = a.wy;
  a.wx = b.wx; a.wy = b.wy;
  b.wx = tx; b.wy = ty;
  somRipple(i1, 14);
  somRipple(i2, 14);
  evaluateNetwork();
  score += 10;
}

function purgeNode(idx) {
  if (idx < 0 || purgesLeft <= 0 || over) return;
  const n = nodes[idx];
  if (n.state !== DEFECT) return;
  n.state = PURGED;
  purgesLeft--;
  purgeMode = false;
  selectedIdx = -1;
  score += 65;
  bursts.push({ x: n.wx, y: n.wy, r: 8, life: 1, col: "#38d6ff" });
  somRipple(idx, 24);
  evaluateNetwork();
  updatePurgeBtn();
}

function onPurgeButton() {
  if (over || purgesLeft <= 0) return;
  if (selectedIdx >= 0 && nodes[selectedIdx].state === DEFECT) {
    purgeNode(selectedIdx);
  } else {
    purgeMode = !purgeMode;
    updatePurgeBtn();
  }
}

function updateHud() {
  const req = Math.round(WAVE_THRESHOLDS[waveIdx % WAVE_THRESHOLDS.length] * 100);
  document.getElementById("stat").textContent =
    `Vague ${Math.min(targetWaves, waveIdx + 1)}/${targetWaves} • ${Math.round(harmony * 100)}%/${req}% • ⚔️${conflictPairs.length} • ${Math.ceil(timeLeft)}s`;
}

function nearestNodeIdx(px, py) {
  let best = -1, bestD = 32;
  for (let i = 0; i < nodes.length; i++) {
    const d = Math.hypot(nodes[i].wx - px, nodes[i].wy - py);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (SIZE / r.width),
    y: (e.clientY - r.top) * (SIZE / r.height)
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  const idx = nearestNodeIdx(p.x, p.y);
  if (idx < 0) { selectedIdx = -1; return; }

  const now = performance.now();
  if (purgeMode || (idx === lastClickIdx && now - lastClickTime < 340)) {
    if (nodes[idx].state === DEFECT && purgesLeft > 0) {
      purgeNode(idx);
      lastClickIdx = -1;
      return;
    }
  }
  lastClickTime = now;
  lastClickIdx = idx;
  dragStartIdx = idx;
});

cv.addEventListener("pointerup", (e) => {
  if (over || dragStartIdx < 0) return;
  const p = getPos(e);
  const idx = nearestNodeIdx(p.x, p.y);
  if (idx >= 0 && idx !== dragStartIdx) {
    swapNodes(dragStartIdx, idx);
    selectedIdx = -1;
  } else if (idx === dragStartIdx) {
    if (selectedIdx === -1) {
      selectedIdx = idx;
    } else if (selectedIdx === idx) {
      selectedIdx = -1;
    } else {
      swapNodes(selectedIdx, idx);
      selectedIdx = -1;
    }
  }
  dragStartIdx = -1;
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) {
    e.preventDefault();
    onPurgeButton();
  }
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);

    // 1kTi.as SOM elastic self-healing spring (pulls active neighbors slightly over purged holes)
    for (let gy = 0; gy < GN; gy++) {
      for (let gx = 0; gx < GN; gx++) {
        const n = nodes[gy * GN + gx];
        if (n.state === PURGED) {
          n.wx += (n.ax - n.wx) * Math.min(1, dt * 8);
          n.wy += (n.ay - n.wy) * Math.min(1, dt * 8);
          continue;
        }
        let tx = n.ax, ty = n.ay;
        // Lean slightly toward adjacent purged nodes to visually close gaps (1kTi.as)
        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (const [dx, dy] of dirs) {
          const nx = gx + dx, ny = gy + dy;
          if (nx >= 0 && nx < GN && ny >= 0 && ny < GN) {
            const nb = nodes[ny * GN + nx];
            if (nb.state === PURGED) {
              tx += dx * 8;
              ty += dy * 8;
            }
          }
        }
        n.wx += (tx - n.wx) * Math.min(1, dt * 8);
        n.wy += (ty - n.wy) * Math.min(1, dt * 8);
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].r += 110 * dt;
      bursts[i].life -= 2.5 * dt;
      if (bursts[i].life <= 0) bursts.splice(i, 1);
    }

    const req = WAVE_THRESHOLDS[waveIdx % WAVE_THRESHOLDS.length];
    if (harmony >= req) {
      advanceTimer += dt;
      if (advanceTimer >= 0.45) {
        score += 320 + purgesLeft * 40;
        waveIdx++;
        if (waveIdx >= targetWaves) {
          won = true;
          over = true;
          score += Math.round(timeLeft * 20);
        } else {
          bursts.push({ x: 256, y: 256, r: 16, life: 1, col: "#4ade80" });
          initWave(waveIdx);
        }
      }
    } else {
      advanceTimer = 0;
    }

    if (timeLeft <= 0 && !over) {
      won = waveIdx >= targetWaves;
      over = true;
    }
    updateHud();
  }

  // Render
  ctx.fillStyle = "#070a16";
  ctx.fillRect(0, 0, SIZE, SIZE);

  // SOM Elastic 2D Lattice lines (1kTi.as)
  ctx.strokeStyle = "rgba(129, 140, 248, 0.35)";
  ctx.lineWidth = 1.6;
  for (let gy = 0; gy < GN; gy++) {
    for (let gx = 0; gx < GN; gx++) {
      const n = nodes[gy * GN + gx];
      if (n.state === PURGED) continue;
      if (gx + 1 < GN && nodes[gy * GN + gx + 1].state !== PURGED) {
        const r = nodes[gy * GN + gx + 1];
        ctx.beginPath(); ctx.moveTo(n.wx, n.wy); ctx.lineTo(r.wx, r.wy); ctx.stroke();
      }
      if (gy + 1 < GN && nodes[(gy + 1) * GN + gx].state !== PURGED) {
        const b = nodes[(gy + 1) * GN + gx];
        ctx.beginPath(); ctx.moveTo(n.wx, n.wy); ctx.lineTo(b.wx, b.wy); ctx.stroke();
      }
    }
  }

  // N-Queens conflict rays (wh2d.as)
  const pulseA = 0.5 + 0.4 * Math.sin(now * 0.008);
  ctx.strokeStyle = `rgba(244, 63, 94, ${pulseA})`;
  ctx.lineWidth = 2.6;
  for (const [a, b] of conflictPairs) {
    ctx.beginPath(); ctx.moveTo(a.wx, a.wy); ctx.lineTo(b.wx, b.wy); ctx.stroke();
  }

  // Nodes
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.state === PURGED) {
      ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(n.ax, n.ay, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }

    const col = n.state === COOP ? "#38d6ff" : (n.state === SYMB ? "#4ade80" : "#ef4444");
    ctx.fillStyle = col;
    ctx.strokeStyle = i === selectedIdx ? "#fde047" : (n.satisfied ? "#ffffff" : "#334155");
    ctx.lineWidth = i === selectedIdx ? 3.5 : (n.satisfied ? 2.4 : 1.5);
    ctx.beginPath();
    ctx.arc(n.wx, n.wy, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Inner symbol
    ctx.fillStyle = "#070a16";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    const sym = n.state === DEFECT ? "✕" : (n.satisfied ? "✓" : "?");
    ctx.fillText(sym, n.wx, n.wy + 4);
  }

  for (const b of bursts) {
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RÉSEAU HARMONISÉ !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Vagues: ${Math.min(targetWaves, waveIdx)}/${targetWaves} • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
