<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Triade Élémentaire (Tri-Element Wars)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #f97316; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 4px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  button.sel { outline: 2px solid #fde047; background: #1e4670; }
  canvas { background: #070910; border: 2px solid #f97316; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(249,115,22,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tri_element_wars",
  "name": "Triade Élémentaire (Tri-Element Wars)",
  "family": "zooEcosys",
  "icon": "🔥",
  "controls": "Cliquer/glisser pour déployer l'élément actif • Touches R / G / B (ou 1 / 2 / 3, Espace ou boutons 🔥 / 🌿 / 💧) pour changer d'élément",
  "description": "Fusion d'AutomatonRGB (jSsZ) et de l'anneau oscillant cyclique (lX7B) : une grille cellulaire hybride couplée à un essaim de 150 particules en cycle Pierre-Feuille-Ciseaux (🔥 Feu > 🌿 Arbre > 💧 Eau > 🔥 Feu). Éteignez les brasiers ennemis à l'Eau pour propager votre Forêt verte.",
  "goal": "Atteindre au moins 60% de territoire 🌿 Arbre (Vert) avant la fin des 65 secondes.",
  "fields": [
    { "key": "targetPercent", "label": "Territoire Arbre cible (%)", "type": "number", "default": 60 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🔥 Tri-Element</span>
  <span id="stat">🌿 33%/60% • ⚡100 • 65s</span>
  <div class="bar-btns">
    <button id="b1" onclick="selectElem(1)" title="Feu (R / 1)">🔥</button>
    <button id="b2" class="sel" onclick="selectElem(2)" title="Arbre (G / 2)">🌿</button>
    <button id="b3" onclick="selectElem(3)" title="Eau (B / 3)">💧</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Cycle</b> : 🔥 Feu &gt; 🌿 Arbre &gt; 💧 Eau &gt; 🔥 Feu • <b>Glisser</b> : peindre cellules + essaim • <b>R / G / B / Espace</b> : élément
</div>

<script>
const GAME_ID = "tri_element_wars";
const SIZE = 512;
const GN = 32;
const CELL = SIZE / GN;
const FIRE = 1, TREE = 2, WATER = 3;
const ELEM_COLS = ["", "#ef4444", "#22c55e", "#38bdf8"];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let targetPercent = 60, durationSec = 65;
let cells = new Uint8Array(GN * GN);
let nextCells = new Uint8Array(GN * GN);
let swarm = [];
let brush = TREE;
let mana = 100;
let pointer = { down: false, x: 256, y: 256 };
let cellTimer = 0, aiTimer = 0;
let greenPct = 33, redPct = 33, bluePct = 33;
let timeLeft = 65, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function selectElem(el) {
  brush = el;
  for (let k = 1; k <= 3; k++) {
    document.getElementById("b" + k).classList.toggle("sel", k === brush);
  }
}

function beats(attacker, defender) {
  return (attacker === FIRE && defender === TREE) ||
         (attacker === TREE && defender === WATER) ||
         (attacker === WATER && defender === FIRE);
}

function spawnParticle(x, y, elem) {
  const a = Math.random() * Math.PI * 2;
  const spd = 65 + Math.random() * 45;
  swarm.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, elem });
  if (swarm.length > 175) swarm.shift();
}

function paintCluster(px, py, elem, radCells = 2, numSwarm = 2) {
  const gx = Math.floor(px / CELL), gy = Math.floor(py / CELL);
  for (let dy = -radCells; dy <= radCells; dy++) {
    for (let dx = -radCells; dx <= radCells; dx++) {
      const nx = gx + dx, ny = gy + dy;
      if (nx < 0 || nx >= GN || ny < 0 || ny >= GN) continue;
      if (dx * dx + dy * dy <= radCells * radCells + 0.5) {
        cells[ny * GN + nx] = elem;
      }
    }
  }
  for (let s = 0; s < numSwarm; s++) {
    spawnParticle(px + (Math.random() - 0.5) * 16, py + (Math.random() - 0.5) * 16, elem);
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetPercent = Math.max(35, Math.min(90, Number(custom.targetPercent || 60)));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  for (let y = 0; y < GN; y++) {
    for (let x = 0; x < GN; x++) {
      // Initial balanced 3-sector battlefield
      const dF = Math.hypot(x - 24, y - 8);
      const dT = Math.hypot(x - 8, y - 24);
      const dW = Math.hypot(x - 24, y - 24);
      let el = FIRE;
      if (dT <= dF && dT <= dW) el = TREE;
      else if (dW <= dF && dW <= dT) el = WATER;
      cells[y * GN + x] = el;
    }
  }

  swarm = [];
  for (let i = 0; i < 150; i++) {
    const x = 24 + Math.random() * (SIZE - 48);
    const y = 24 + Math.random() * (SIZE - 48);
    spawnParticle(x, y, (i % 3) + 1);
  }

  selectElem(TREE);
  mana = 100;
  cellTimer = 0;
  aiTimer = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  recount();
  updateHud();
}

function recount() {
  let c1 = 0, c2 = 0, c3 = 0;
  for (let i = 0; i < GN * GN; i++) {
    if (cells[i] === FIRE) c1++;
    else if (cells[i] === TREE) c2++;
    else if (cells[i] === WATER) c3++;
  }
  const tot = GN * GN;
  redPct = Math.round((c1 / tot) * 100);
  greenPct = Math.round((c2 / tot) * 100);
  bluePct = Math.round((c3 / tot) * 100);
}

function updateHud() {
  document.getElementById("stat").textContent =
    `🌿 ${greenPct}%/${targetPercent}% • 🔥${redPct}% 💧${bluePct}% • ⚡${Math.floor(mana)} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

function tryPaint(px, py) {
  if (over || mana < 8) return;
  mana -= 8;
  paintCluster(px, py, brush, 2, 2);
  score += 6;
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  pointer.down = true;
  pointer.x = p.x;
  pointer.y = p.y;
  tryPaint(p.x, p.y);
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  pointer.x = p.x;
  pointer.y = p.y;
  if (pointer.down && !over) tryPaint(p.x, p.y);
});
window.addEventListener("pointerup", () => { pointer.down = false; });
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyR" || e.code === "Digit1") selectElem(FIRE);
  if (e.code === "KeyG" || e.code === "Digit2") selectElem(TREE);
  if (e.code === "KeyB" || e.code === "Digit3") selectElem(WATER);
  if (e.code === "Space" && !e.repeat) {
    e.preventDefault();
    selectElem((brush % 3) + 1);
  }
});

function stepAutomatonRGB() {
  // jSsZ.as probabilistic RPS cellular spread
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let y = 0; y < GN; y++) {
    for (let x = 0; x < GN; x++) {
      const idx = y * GN + x;
      const cur = cells[idx];
      let next = cur;
      let predatorCount = 0;
      let predatorType = 0;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= GN || ny < 0 || ny >= GN) continue;
        const nb = cells[ny * GN + nx];
        if (beats(nb, cur)) {
          predatorCount++;
          predatorType = nb;
        }
      }
      if (predatorCount > 0 && Math.random() < 0.25 + predatorCount * 0.18) {
        next = predatorType;
      }
      nextCells[idx] = next;
    }
  }
  const tmp = cells; cells = nextCells; nextCells = tmp;
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    mana = Math.min(100, mana + 26 * dt);

    cellTimer += dt;
    if (cellTimer >= 0.16) {
      cellTimer = 0;
      stepAutomatonRGB();
    }

    // AI Rival drops Fire sparks against large Tree patches
    aiTimer += dt;
    if (aiTimer >= 2.3) {
      aiTimer = 0;
      let tx = 80 + Math.random() * (SIZE - 160);
      let ty = 80 + Math.random() * (SIZE - 160);
      for (let t = 0; t < 10; t++) {
        const rx = Math.floor(Math.random() * GN), ry = Math.floor(Math.random() * GN);
        if (cells[ry * GN + rx] === TREE) {
          tx = (rx + 0.5) * CELL;
          ty = (ry + 0.5) * CELL;
          break;
        }
      }
      paintCluster(tx, ty, FIRE, 1, 4);
    }

    // Cyclic particle swarm conversions (lX7B.as)
    for (let i = 0; i < swarm.length; i++) {
      const p = swarm[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < 8) { p.x = 8; p.vx = Math.abs(p.vx); }
      if (p.x > SIZE - 8) { p.x = SIZE - 8; p.vx = -Math.abs(p.vx); }
      if (p.y < 8) { p.y = 8; p.vy = Math.abs(p.vy); }
      if (p.y > SIZE - 8) { p.y = SIZE - 8; p.vy = -Math.abs(p.vy); }

      const gx = Math.max(0, Math.min(GN - 1, Math.floor(p.x / CELL)));
      const gy = Math.max(0, Math.min(GN - 1, Math.floor(p.y / CELL)));
      const cellEl = cells[gy * GN + gx];
      if (beats(p.elem, cellEl)) {
        cells[gy * GN + gx] = p.elem;
      } else if (beats(cellEl, p.elem) && Math.random() < 4.0 * dt) {
        p.elem = cellEl;
      }

      // Particle-particle RPS contact check (sample random peers for O(N) speed)
      for (let k = 0; k < 4; k++) {
        const o = swarm[Math.floor(Math.random() * swarm.length)];
        if (o === p) continue;
        if (Math.hypot(o.x - p.x, o.y - p.y) < 13) {
          if (beats(p.elem, o.elem)) o.elem = p.elem;
          else if (beats(o.elem, p.elem)) p.elem = o.elem;
        }
      }
    }

    recount();
    if (greenPct >= targetPercent) {
      won = true;
      over = true;
      score += 450 + Math.round(timeLeft * 20) + greenPct * 5;
    } else if (timeLeft <= 0) {
      won = greenPct >= targetPercent;
      over = true;
    }
    updateHud();
  }

  // Render Grid
  ctx.fillStyle = "#070910";
  ctx.fillRect(0, 0, SIZE, SIZE);

  for (let y = 0; y < GN; y++) {
    for (let x = 0; x < GN; x++) {
      const el = cells[y * GN + x];
      ctx.fillStyle = ELEM_COLS[el] + "66";
      ctx.fillRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
    }
  }

  // Render lX7B cyclic particles
  for (const p of swarm) {
    ctx.fillStyle = ELEM_COLS[p.elem];
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Top territory proportion bar (lX7B.as)
  const barW = SIZE - 24;
  ctx.fillStyle = "rgba(7, 11, 20, 0.8)";
  ctx.fillRect(10, 10, barW + 4, 14);
  const wR = (redPct / 100) * barW;
  const wG = (greenPct / 100) * barW;
  const wB = Math.max(0, barW - wR - wG);
  ctx.fillStyle = "#ef4444"; ctx.fillRect(12, 12, wR, 10);
  ctx.fillStyle = "#22c55e"; ctx.fillRect(12 + wR, 12, wG, 10);
  ctx.fillStyle = "#38bdf8"; ctx.fillRect(12 + wR + wG, 12, wB, 10);

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "FORÊT DOMINANTE !" : "CHRONO ÉCOULÉ", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`🌿 Arbre: ${greenPct}%/${targetPercent}% • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
