<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Écosystème & Gènes (FoodChain Evo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #4ade80; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #050d0c; border: 2px solid #4ade80; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: pointer; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(74,222,128,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "foodchain_evo",
  "name": "Écosystème & Gènes (FoodChain Evo)",
  "family": "zooEcosys",
  "icon": "🌿",
  "controls": "Cliquer sur l'île pour utiliser le Bio-Outil actif • Espace, 1/2/3 ou bouton 🌱 pour changer d'outil (Semer / Cloner / Réguler)",
  "description": "Fusion du plateau Peak (tSoU/slD8), de la chaîne trophique (aCAl/A5mH/kqS3c), des insectes à algorithme génétique (bFdf) et des liens énergétiques (kZvu) : maintenez l'équilibre entre Plantes (≥12), Herbivores GA (≥6) et Carnivores (≥2).",
  "goal": "Maintenir les 3 niveaux trophiques en équilibre pendant 35 secondes cumulées avant la fin des 65 secondes.",
  "fields": [
    { "key": "targetStableSec", "label": "Secondes d'équilibre", "type": "number", "default": 35 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🌿 FoodChain Evo</span>
  <span id="stat">⚖️ 0/35s • 🌱0 🪲0 🦖0 • ⚡100</span>
  <div class="bar-btns">
    <button id="toolBtn" onclick="cycleTool()" title="Changer d'outil (Espace / 1-3)">🌱 Semer</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Clic</b> : utiliser l'outil sur l'île • <b>Espace / 1-3</b> : 🌱 Semer / 🪲 Cloner (ADN) / ⚡ Réguler carnivores → graines
</div>

<script>
const GAME_ID = "foodchain_evo";
const SIZE = 512;
const CENTER = 256;
const PLATEAU_R = 232;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const TOOLS = [
  { label: "🌱 Semer", cost: 14 },
  { label: "🪲 Cloner", cost: 22 },
  { label: "⚡ Réguler", cost: 16 }
];

let targetStableSec = 35, durationSec = 65;
let toolIdx = 0;
let bioEnergy = 100;
let seeds = [];
let plants = [];
let herbs = [];
let carns = [];
let tethers = [];
let fxRings = [];
let history = [];
let histTimer = 0, autoPlantT = 0, migrateT = 0;
let stableSec = 0, timeLeft = 65, score = 0, won = false, over = false, balanced = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function setTool(idx) {
  toolIdx = ((idx % TOOLS.length) + TOOLS.length) % TOOLS.length;
  document.getElementById("toolBtn").textContent = TOOLS[toolIdx].label;
}
function cycleTool() { setTool(toolIdx + 1); }

function randInPlateau(maxR = PLATEAU_R - 18) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * maxR;
  return { x: CENTER + Math.cos(a) * r, y: CENTER + Math.sin(a) * r };
}

function makeHerb(x, y, spdGene, senseGene) {
  const a = Math.random() * Math.PI * 2;
  return {
    x, y,
    vx: Math.cos(a) * 40,
    vy: Math.sin(a) * 40,
    speed: Math.max(48, Math.min(130, spdGene || (66 + Math.random() * 28))),
    sense: Math.max(60, Math.min(180, senseGene || (95 + Math.random() * 45))),
    energy: 65,
    children: 0
  };
}

function makeCarn(x, y) {
  const a = Math.random() * Math.PI * 2;
  return {
    x, y,
    vx: Math.cos(a) * 55,
    vy: Math.sin(a) * 55,
    speed: 88,
    energy: 82
  };
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetStableSec = Math.max(10, Number(custom.targetStableSec || 35));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  seeds = [];
  plants = [];
  herbs = [];
  carns = [];
  tethers = [];
  fxRings = [];
  history = [];

  for (let i = 0; i < 24; i++) {
    const p = randInPlateau(PLATEAU_R - 25);
    plants.push({ x: p.x, y: p.y, r: 6 + Math.random() * 3 });
  }
  for (let i = 0; i < 10; i++) {
    const p = randInPlateau(PLATEAU_R - 30);
    herbs.push(makeHerb(p.x, p.y));
  }
  for (let i = 0; i < 3; i++) {
    const p = randInPlateau(PLATEAU_R - 35);
    carns.push(makeCarn(p.x, p.y));
  }

  bioEnergy = 100;
  stableSec = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  balanced = false;
  histTimer = 0;
  autoPlantT = 0;
  migrateT = 0;
  setTool(0);
  updateHud();
}

function updateHud() {
  const mark = balanced ? "✅" : "⚠️";
  document.getElementById("stat").textContent =
    `${mark} ${stableSec.toFixed(1)}/${targetStableSec}s • 🌱${plants.length} 🪲${herbs.length} 🦖${carns.length} • ⚡${Math.floor(bioEnergy)} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

function applyTool(px, py) {
  if (over) return;
  const tool = TOOLS[toolIdx];
  if (bioEnergy < tool.cost) return;
  bioEnergy -= tool.cost;

  if (toolIdx === 0) {
    // Semer: 4 nutrient plants / seeds
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 24;
      const nx = Math.max(32, Math.min(SIZE - 32, px + Math.cos(a) * r));
      const ny = Math.max(32, Math.min(SIZE - 32, py + Math.sin(a) * r));
      if (i < 2) plants.push({ x: nx, y: ny, r: 6.5 });
      else seeds.push({ x: nx, y: ny, timer: 1.4 });
    }
    fxRings.push({ x: px, y: py, r: 8, life: 1, col: "#4ade80" });
  } else if (toolIdx === 1) {
    // Cloner best GA herbivore bug (bFdf.as)
    let bestSpd = 82, bestSense = 125;
    if (herbs.length > 0) {
      let best = herbs[0];
      for (const h of herbs) if (h.energy > best.energy) best = h;
      bestSpd = best.speed + (Math.random() - 0.5) * 14;
      bestSense = best.sense + (Math.random() - 0.5) * 20;
    }
    herbs.push(makeHerb(px, py, bestSpd, bestSense));
    fxRings.push({ x: px, y: py, r: 8, life: 1, col: "#38d6ff" });
  } else {
    // Réguler: zap carnivores in 52px radius into fertile seeds (aCAl.as)
    let zapped = 0;
    for (let i = carns.length - 1; i >= 0; i--) {
      const c = carns[i];
      if (Math.hypot(c.x - px, c.y - py) <= 54) {
        seeds.push({ x: c.x - 5, y: c.y, timer: 1.2 });
        seeds.push({ x: c.x + 5, y: c.y, timer: 1.2 });
        carns.splice(i, 1);
        zapped++;
      }
    }
    fxRings.push({ x: px, y: py, r: 14, life: 1, col: zapped > 0 ? "#fbbf24" : "#f87171" });
  }
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  applyTool(p.x, p.y);
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); cycleTool(); }
  if (e.code === "Digit1") setTool(0);
  if (e.code === "Digit2") setTool(1);
  if (e.code === "Digit3") setTool(2);
});

function keepInPlateau(entity) {
  const dx = entity.x - CENTER, dy = entity.y - CENTER;
  const d = Math.hypot(dx, dy);
  if (d > PLATEAU_R - 8) {
    const nx = dx / Math.max(1e-4, d), ny = dy / Math.max(1e-4, d);
    entity.x = CENTER + nx * (PLATEAU_R - 8);
    entity.y = CENTER + ny * (PLATEAU_R - 8);
    const dot = entity.vx * nx + entity.vy * ny;
    if (dot > 0) {
      entity.vx -= 2 * dot * nx;
      entity.vy -= 2 * dot * ny;
    }
  }
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    bioEnergy = Math.min(100, bioEnergy + 18 * dt);
    tethers = [];

    // Fertile central plateau sprouts natural plants (tSoU.as)
    autoPlantT += dt;
    if (autoPlantT >= 0.85 && plants.length < 48) {
      autoPlantT = 0;
      const p = randInPlateau(PLATEAU_R * 0.72);
      plants.push({ x: p.x, y: p.y, r: 5 + Math.random() * 3 });
    }

    // Seeds sprout into plants
    for (let i = seeds.length - 1; i >= 0; i--) {
      seeds[i].timer -= dt;
      if (seeds[i].timer <= 0) {
        if (plants.length < 55) plants.push({ x: seeds[i].x, y: seeds[i].y, r: 6.5 });
        seeds.splice(i, 1);
      }
    }

    // Herbivore GA Bugs (bFdf.as + kZvu.as)
    for (let i = herbs.length - 1; i >= 0; i--) {
      const h = herbs[i];
      h.energy -= 6.5 * dt;
      if (h.energy <= 0 || h.children >= 3) {
        seeds.push({ x: h.x, y: h.y, timer: 1.8 });
        herbs.splice(i, 1);
        continue;
      }

      // Seek nearest plant within genetic sense radius, flee carnivores
      let tx = 0, ty = 0, bestP = null, bestPD = h.sense;
      for (const p of plants) {
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if (d < bestPD) { bestPD = d; bestP = p; }
      }
      if (bestP && bestPD > 1) {
        tx += ((bestP.x - h.x) / bestPD) * 140;
        ty += ((bestP.y - h.y) / bestPD) * 140;
      }
      for (const c of carns) {
        const dx = h.x - c.x, dy = h.y - c.y;
        const d = Math.hypot(dx, dy);
        if (d > 1 && d < h.sense * 0.9) {
          tx += (dx / d) * 210;
          ty += (dy / d) * 210;
        }
      }
      tx += (Math.random() - 0.5) * 90;
      ty += (Math.random() - 0.5) * 90;

      h.vx += tx * dt;
      h.vy += ty * dt;
      const sp = Math.hypot(h.vx, h.vy);
      if (sp > h.speed) { h.vx = (h.vx / sp) * h.speed; h.vy = (h.vy / sp) * h.speed; }
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      keepInPlateau(h);

      // Eat plant
      for (let pi = plants.length - 1; pi >= 0; pi--) {
        const p = plants[pi];
        if (Math.hypot(p.x - h.x, p.y - h.y) < 12) {
          plants.splice(pi, 1);
          h.energy = Math.min(115, h.energy + 34);
          break;
        }
      }

      // Mate / tether with nearby energetic bug (kZvu.as + bFdf.as)
      if (h.energy > 86 && herbs.length < 28) {
        for (let j = i - 1; j >= 0; j--) {
          const o = herbs[j];
          const d = Math.hypot(o.x - h.x, o.y - h.y);
          if (d < 28 && o.energy > 72) {
            tethers.push({ x1: h.x, y1: h.y, x2: o.x, y2: o.y });
            if (Math.random() < 0.14) {
              h.energy -= 35;
              o.energy -= 25;
              h.children++;
              o.children++;
              herbs.push(makeHerb(
                (h.x + o.x) * 0.5,
                (h.y + o.y) * 0.5,
                (h.speed + o.speed) * 0.5 + (Math.random() - 0.5) * 14,
                (h.sense + o.sense) * 0.5 + (Math.random() - 0.5) * 20
              ));
            }
            break;
          }
        }
      }
    }

    // Carnivores (aCAl.as: turn into 2 fertile seeds when starving)
    for (let i = carns.length - 1; i >= 0; i--) {
      const c = carns[i];
      c.energy -= 5.8 * dt;
      if (c.energy <= 0) {
        seeds.push({ x: c.x - 6, y: c.y, timer: 1.5 });
        seeds.push({ x: c.x + 6, y: c.y, timer: 1.5 });
        carns.splice(i, 1);
        continue;
      }

      let bestH = null, bestHD = 165;
      for (const h of herbs) {
        const d = Math.hypot(h.x - c.x, h.y - c.y);
        if (d < bestHD) { bestHD = d; bestH = h; }
      }
      if (bestH && bestHD > 1) {
        c.vx += ((bestH.x - c.x) / bestHD) * 165 * dt;
        c.vy += ((bestH.y - c.y) / bestHD) * 165 * dt;
      } else {
        c.vx += (Math.random() - 0.5) * 90 * dt;
        c.vy += (Math.random() - 0.5) * 90 * dt;
      }
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > c.speed) { c.vx = (c.vx / sp) * c.speed; c.vy = (c.vy / sp) * c.speed; }
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      keepInPlateau(c);

      for (let hi = herbs.length - 1; hi >= 0; hi--) {
        const h = herbs[hi];
        if (Math.hypot(h.x - c.x, h.y - c.y) < 13) {
          herbs.splice(hi, 1);
          c.energy = Math.min(130, c.energy + 44);
          if (c.energy >= 112 && carns.length < 10) {
            c.energy -= 45;
            carns.push(makeCarn(c.x, c.y));
          }
          break;
        }
      }
    }

    // Wild carnivore migration if herbivores flourish and carnivores went extinct
    if (carns.length < 2 && herbs.length >= 10) {
      migrateT += dt;
      if (migrateT >= 2.2) {
        migrateT = 0;
        const p = randInPlateau(PLATEAU_R - 25);
        carns.push(makeCarn(p.x, p.y));
      }
    } else {
      migrateT = 0;
    }

    for (let i = fxRings.length - 1; i >= 0; i--) {
      fxRings[i].r += 95 * dt;
      fxRings[i].life -= 2.4 * dt;
      if (fxRings[i].life <= 0) fxRings.splice(i, 1);
    }

    // Balance check: Plants >= 12, Herbivores >= 6, Carnivores >= 2
    balanced = plants.length >= 12 && herbs.length >= 6 && carns.length >= 2;
    if (balanced) {
      stableSec += dt;
      score += 24 * dt;
    }

    histTimer += dt;
    if (histTimer >= 0.25) {
      histTimer = 0;
      history.push([plants.length, herbs.length, carns.length]);
      if (history.length > 85) history.shift();
    }

    if (stableSec >= targetStableSec) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 20) + 250;
    } else if (timeLeft <= 0) {
      won = false;
      over = true;
    }
    updateHud();
  }

  // Render Peak Plateau (tSoU.as)
  ctx.fillStyle = "#050d0c";
  ctx.fillRect(0, 0, SIZE, SIZE);

  const grad = ctx.createRadialGradient(CENTER, CENTER, 20, CENTER, CENTER, PLATEAU_R);
  grad.addColorStop(0, "rgba(22, 101, 52, 0.36)");
  grad.addColorStop(0.7, "rgba(15, 58, 42, 0.22)");
  grad.addColorStop(1, "rgba(8, 22, 26, 0.12)");
  ctx.fillStyle = grad;
  ctx.strokeStyle = balanced ? "#4ade80" : "#1e4b3c";
  ctx.lineWidth = balanced ? 3 : 2;
  ctx.beginPath(); ctx.arc(CENTER, CENTER, PLATEAU_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Seeds
  ctx.fillStyle = "#fde047";
  for (const s of seeds) {
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.3, 0, Math.PI * 2); ctx.fill();
  }

  // Plants
  for (const p of plants) {
    ctx.fillStyle = "#22c55e";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#bbf7d0";
    ctx.beginPath(); ctx.arc(p.x - 1.5, p.y - 1.5, p.r * 0.35, 0, Math.PI * 2); ctx.fill();
  }

  // Energy tethers (kZvu.as)
  ctx.strokeStyle = "rgba(56, 214, 255, 0.6)";
  ctx.lineWidth = 1.5;
  for (const t of tethers) {
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }

  // Herbivore GA Bugs
  for (const h of herbs) {
    const a = Math.atan2(h.vy, h.vx);
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(a);
    ctx.fillStyle = "#38d6ff";
    ctx.strokeStyle = "#e0f2fe";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 6.5, 4.2, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Carnivores
  for (const c of carns) {
    const a = Math.atan2(c.vy, c.vx);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(a);
    ctx.fillStyle = "#f97316";
    ctx.strokeStyle = "#ffedd5";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-7, -6);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-7, 6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  for (const fx of fxRings) {
    ctx.strokeStyle = fx.col;
    ctx.globalAlpha = Math.max(0, fx.life);
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Bottom-left mini sparkline
  const gx = 10, gy = SIZE - 64, gw = 120, gh = 52;
  ctx.fillStyle = "rgba(5, 13, 12, 0.78)";
  ctx.strokeStyle = "#1e4b3c";
  ctx.lineWidth = 1;
  ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeRect(gx, gy, gw, gh);
  if (history.length > 1) {
    const dx = gw / (history.length - 1);
    const cols = ["#22c55e", "#38d6ff", "#f97316"];
    const caps = [55, 30, 12];
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = cols[k];
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const px = gx + i * dx;
        const py = gy + gh - Math.min(1, history[i][k] / caps[k]) * (gh - 6) - 3;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "BIOSPHÈRE HARMONISÉE !" : "ÉQUILIBRE INCOMPLET", 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Équilibre: ${stableSec.toFixed(1)}/${targetStableSec}s • Score ${Math.round(score)}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
