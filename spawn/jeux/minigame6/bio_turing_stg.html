<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Bio-Turing STG (Réaction-Diffusion)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #070b14; color: #e6f4ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; overflow: hidden; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #10192b; border: 1px solid #2b597a; padding: 7px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .bar-title { white-space: nowrap; font-weight: 700; color: #facc15; }
  #stat { font-variant-numeric: tabular-nums; font-weight: 600; color: #e2f1ff; text-align: center; flex: 1; }
  .bar-btns { display: flex; gap: 5px; }
  button { background: #1a3350; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 7px; padding: 5px 9px; cursor: pointer; font-weight: 700; font-size: 12px; transition: background 0.12s, transform 0.08s; }
  button:hover { background: #23466d; }
  button:active { transform: scale(0.95); }
  canvas { background: #060911; border: 2px solid #facc15; border-radius: 12px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 24px rgba(250,204,21,0.16); }
  .hint { width: min(512px, 96vw); font-size: 11.5px; color: #8fb4d4; text-align: center; line-height: 1.35; }
  .hint b { color: #bae6fd; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "bio_turing_stg",
  "name": "Bio-Turing STG (Réaction-Diffusion)",
  "family": "topMouseHnS",
  "icon": "🧫",
  "controls": "Pointeur / glisser ou ZQSD pour viser et tirer • Espace, Clic droit ou 💥 Nova pour une stérilisation radiale • M / 🧬 Souche pour changer de motif Turing",
  "description": "Fusion du shooter sur réaction-diffusion (ojot), du solveur Gray-Scott avec presets (hOwG), de l'automate étendu (wPAT) et des paramètres dynamiques (zWBF) : creusez la biomasse Turing au tir plasma pour détruire les 4 noyaux de spores avant que l'infection n'atteigne 68%.",
  "goal": "Détruire les 4 noyaux de spores avant que la contamination dépasse 68% ou la fin des 65 secondes.",
  "fields": [
    { "key": "targetCores", "label": "Noyaux à détruire", "type": "number", "default": 4 },
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 65 }
  ]
}
</script>

<div class="bar">
  <span class="bar-title">🧫 Bio-Turing STG</span>
  <span id="stat">🧬 0/4 • Bio 18% • 65s</span>
  <div class="bar-btns">
    <button id="strainBtn" onclick="cyclePreset()" title="Changer la souche Gray-Scott (M)">🧬 Corail</button>
    <button id="novaBtn" onclick="triggerNova()" title="Onde de stérilisation (Espace)">💥 Nova</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()" title="Recommencer">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>

<canvas id="cv" width="512" height="512"></canvas>
<div class="hint">
  <b>Maintenir clic / ZQSD</b> : tir plasma continu • <b>Espace / Clic droit</b> : Nova stérilisante • <b>M</b> : changer de souche Turing
</div>

<script>
const GAME_ID = "bio_turing_stg";
const SIZE = 512;
const GN = 64;
const CELL = SIZE / GN;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const rdCv = document.createElement("canvas");
rdCv.width = GN;
rdCv.height = GN;
const rdCtx = rdCv.getContext("2d");
const rdImg = rdCtx.createImageData(GN, GN);

// ojot.as triple-cosine contrast palette LUT (256 entries)
const PALETTE = new Uint8Array(256 * 3);
for (let i = 0; i < 256; i++) {
  let r = i / 255;
  r = 0.5 - 0.5 * Math.cos(Math.PI * r);
  r = 0.5 - 0.5 * Math.cos(Math.PI * r);
  r = 0.5 - 0.5 * Math.cos(Math.PI * r);
  PALETTE[i * 3 + 0] = Math.round(10 + r * 240);
  PALETTE[i * 3 + 1] = Math.round(14 + r * 204);
  PALETTE[i * 3 + 2] = Math.round(28 + r * 36);
}

// hOwG.as / zWBF.as Gray-Scott presets
const PRESETS = [
  { name: "Corail", f: 0.0545, k: 0.062 },
  { name: "Mitose", f: 0.0367, k: 0.0649 },
  { name: "Labyrinthe", f: 0.029, k: 0.057 }
];

let U = new Float32Array(GN * GN);
let V = new Float32Array(GN * GN);
let nextU = new Float32Array(GN * GN);
let nextV = new Float32Array(GN * GN);

let targetCores = 4, durationSec = 65;
let presetIdx = 0;
let turret = { x: 256, y: 472, aimX: 256, aimY: 160 };
let bullets = [];
let cores = [];
let blasts = [];
let keys = {};
let pointer = { down: false, x: 256, y: 180 };
let fireCd = 0, novaCd = 0, coverage = 0.15;
let destroyed = 0, timeLeft = 65, score = 0, won = false, over = false, failReason = "";

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "spawn_minigame_result",
      id: GAME_ID,
      won: !!didWin,
      score: Math.round(finalScore || 0),
      resource_deltas: {}
    }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function cyclePreset() {
  presetIdx = (presetIdx + 1) % PRESETS.length;
  document.getElementById("strainBtn").textContent = "🧬 " + PRESETS[presetIdx].name;
}

function seedDisk(cx, cy, rad, valV) {
  const gx = Math.floor(cx / CELL), gy = Math.floor(cy / CELL);
  const gr = Math.max(1, Math.ceil(rad / CELL));
  for (let dy = -gr; dy <= gr; dy++) {
    for (let dx = -gr; dx <= gr; dx++) {
      const nx = gx + dx, ny = gy + dy;
      if (nx < 1 || nx >= GN - 1 || ny < 1 || ny >= GN - 1) continue;
      if (dx * dx + dy * dy <= gr * gr) {
        const idx = ny * GN + nx;
        V[idx] = valV;
        U[idx] = valV === 0 ? 1 : 0.5;
      }
    }
  }
}

function triggerNova() {
  if (over || novaCd > 0) return;
  novaCd = 4.0;
  const bx = turret.aimX, by = turret.aimY;
  seedDisk(bx, by, 72, 0);
  blasts.push({ x: bx, y: by, r: 12, maxR: 88, life: 1, col: "#38d6ff" });
  for (const c of cores) {
    if (c.hp > 0 && Math.hypot(c.x - bx, c.y - by) < 84) {
      c.hp = Math.max(0, c.hp - 18);
      if (c.hp <= 0) { destroyed++; score += 180; }
    }
  }
}

function resetGame(cfg) {
  const custom = (cfg && cfg.custom) || cfg || {};
  targetCores = Math.max(2, Number(custom.targetCores || 4));
  durationSec = Math.max(20, Number(custom.durationSec || 65));

  U.fill(1);
  V.fill(0);
  presetIdx = 0;
  document.getElementById("strainBtn").textContent = "🧬 " + PRESETS[0].name;

  cores = [];
  const positions = [
    { x: 112, y: 120 },
    { x: 400, y: 120 },
    { x: 175, y: 245 },
    { x: 338, y: 245 },
    { x: 256, y: 110 },
    { x: 256, y: 290 }
  ];
  for (let i = 0; i < targetCores; i++) {
    const p = positions[i % positions.length];
    cores.push({ x: p.x, y: p.y, r: 18, hp: 55, maxHp: 55, phase: i * 1.4 });
    seedDisk(p.x, p.y, 26, 0.55);
  }
  // Seed a few initial Turing spots around upper zone
  for (let s = 0; s < 5; s++) {
    seedDisk(80 + Math.random() * 352, 65 + Math.random() * 195, 16, 0.5);
  }

  turret = { x: 256, y: 472, aimX: 256, aimY: 160 };
  bullets = [];
  blasts = [];
  destroyed = 0;
  timeLeft = durationSec;
  score = 0;
  won = false;
  over = false;
  failReason = "";
  fireCd = 0;
  novaCd = 0;
  coverage = 0.12;
  updateHud();
}

function updateHud() {
  const pct = Math.round(coverage * 100);
  const novaStr = novaCd > 0 ? `${novaCd.toFixed(1)}s` : "Prête";
  document.getElementById("novaBtn").textContent = novaCd > 0 ? `💥 ${Math.ceil(novaCd)}s` : "💥 Nova";
  document.getElementById("stat").textContent =
    `🧬 ${destroyed}/${targetCores} • Bio ${pct}%/68% • Nova ${novaStr} • ${Math.ceil(timeLeft)}s`;
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(SIZE, (e.clientX - r.left) * (SIZE / r.width))),
    y: Math.max(0, Math.min(SIZE, (e.clientY - r.top) * (SIZE / r.height)))
  };
}

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  turret.aimX = p.x;
  turret.aimY = p.y;
  pointer.x = p.x;
  pointer.y = p.y;
  if (e.button === 2) { triggerNova(); return; }
  pointer.down = true;
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  pointer.x = p.x;
  pointer.y = p.y;
  turret.aimX = p.x;
  turret.aimY = p.y;
});
window.addEventListener("pointerup", () => { pointer.down = false; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" && !e.repeat) triggerNova();
  if (e.code === "KeyM" && !e.repeat) cyclePreset();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function stepGrayScott() {
  const Du = 0.16, Dv = 0.08, dtSim = 1.0;
  const f = PRESETS[presetIdx].f;
  const k = PRESETS[presetIdx].k;

  for (let y = 0; y < GN; y++) {
    const ym = (y - 1 + GN) % GN;
    const yp = (y + 1) % GN;
    for (let x = 0; x < GN; x++) {
      const xm = (x - 1 + GN) % GN;
      const xp = (x + 1) % GN;
      const idx = y * GN + x;
      const u = U[idx], v = V[idx];

      // 9-point Laplacian kernel
      const lapU =
        U[ym * GN + xm] * 0.05 + U[ym * GN + x] * 0.2 + U[ym * GN + xp] * 0.05 +
        U[y * GN + xm] * 0.2 - u + U[y * GN + xp] * 0.2 +
        U[yp * GN + xm] * 0.05 + U[yp * GN + x] * 0.2 + U[yp * GN + xp] * 0.05;
      const lapV =
        V[ym * GN + xm] * 0.05 + V[ym * GN + x] * 0.2 + V[ym * GN + xp] * 0.05 +
        V[y * GN + xm] * 0.2 - v + V[y * GN + xp] * 0.2 +
        V[yp * GN + xm] * 0.05 + V[yp * GN + x] * 0.2 + V[yp * GN + xp] * 0.05;

      const uvv = u * v * v;
      const nu = u + (Du * lapU - uvv + f * (1 - u)) * dtSim;
      const nv = v + (Dv * lapV + uvv - (f + k) * v) * dtSim;
      nextU[idx] = nu < 0 ? 0 : (nu > 1 ? 1 : nu);
      nextV[idx] = nv < 0 ? 0 : (nv > 1 ? 1 : nv);
    }
  }
  const tu = U; U = nextU; nextU = tu;
  const tv = V; V = nextV; nextV = tv;
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (fireCd > 0) fireCd = Math.max(0, fireCd - dt);
    if (novaCd > 0) novaCd = Math.max(0, novaCd - dt);

    // Keyboard turret movement & aim fallback
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx) turret.x = Math.max(40, Math.min(SIZE - 40, turret.x + kx * 220 * dt));
    if (ky) turret.aimY = Math.max(30, Math.min(400, turret.aimY + ky * 220 * dt));

    // Auto-fire while pointer held or Space/Enter/F held
    if ((pointer.down || keys.KeyF) && fireCd <= 0) {
      fireCd = 0.085;
      const dx = turret.aimX - turret.x;
      const dy = turret.aimY - turret.y;
      const d = Math.max(1e-4, Math.hypot(dx, dy));
      bullets.push({
        x: turret.x + (dx / d) * 16,
        y: turret.y + (dy / d) * 16,
        vx: (dx / d) * 460,
        vy: (dy / d) * 460,
        tx: turret.aimX,
        ty: turret.aimY
      });
    }

    // Active Spore Cores continuously re-seed Gray-Scott biomass
    for (const c of cores) {
      if (c.hp <= 0) continue;
      c.phase += dt * 4;
      const gx = Math.floor(c.x / CELL), gy = Math.floor(c.y / CELL);
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const nx = gx + dx, ny = gy + dy;
          if (nx > 0 && nx < GN - 1 && ny > 0 && ny < GN - 1) {
            const idx = ny * GN + nx;
            V[idx] = Math.min(0.85, V[idx] + 0.06);
          }
        }
      }
    }

    // Run 4 PDE substeps per frame & measure coverage
    for (let s = 0; s < 4; s++) stepGrayScott();

    let activeCells = 0;
    for (let i = 0; i < GN * GN; i++) {
      if (V[i] > 0.2) activeCells++;
    }
    coverage = activeCells / (GN * GN);

    // Update plasma bullets (ojot.as)
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < 4 || b.x > SIZE - 4 || b.y < 4 || b.y > SIZE - 4) {
        bullets.splice(i, 1);
        continue;
      }

      let hit = false;
      // Hit Spore Core?
      for (const c of cores) {
        if (c.hp > 0 && Math.hypot(b.x - c.x, b.y - c.y) < c.r + 6) {
          seedDisk(b.x, b.y, 26, 0);
          const gx = Math.max(0, Math.min(GN - 1, Math.floor(c.x / CELL)));
          const gy = Math.max(0, Math.min(GN - 1, Math.floor(c.y / CELL)));
          const localBio = V[gy * GN + gx];
          const dmg = localBio > 0.35 ? 4 : 9;
          c.hp = Math.max(0, c.hp - dmg);
          score += 12;
          blasts.push({ x: b.x, y: b.y, r: 4, maxR: 26, life: 0.7, col: "#fde047" });
          if (c.hp <= 0) {
            destroyed++;
            score += 200;
            blasts.push({ x: c.x, y: c.y, r: 8, maxR: 68, life: 1, col: "#4ade80" });
            seedDisk(c.x, c.y, 44, 0);
          }
          hit = true;
          break;
        }
      }

      // Hit dense Turing biomass? (ojot.as)
      if (!hit) {
        const gx = Math.max(0, Math.min(GN - 1, Math.floor(b.x / CELL)));
        const gy = Math.max(0, Math.min(GN - 1, Math.floor(b.y / CELL)));
        if (V[gy * GN + gx] > 0.22) {
          seedDisk(b.x, b.y, 24, 0);
          score += 4;
          blasts.push({ x: b.x, y: b.y, r: 4, maxR: 24, life: 0.65, col: "#facc15" });
          hit = true;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    for (let i = blasts.length - 1; i >= 0; i--) {
      blasts[i].r += 130 * dt;
      blasts[i].life -= 2.4 * dt;
      if (blasts[i].life <= 0) blasts.splice(i, 1);
    }

    if (destroyed >= targetCores) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 20) + Math.round((0.68 - coverage) * 300);
    } else if (coverage >= 0.68) {
      won = false;
      over = true;
      failReason = "BIOMASSE HORS CONTRÔLE (68%)";
    } else if (timeLeft <= 0) {
      won = false;
      over = true;
      failReason = "CHRONO ÉCOULÉ";
    }
    updateHud();
  }

  // Render Gray-Scott ImageData via ojot LUT
  const px = rdImg.data;
  for (let i = 0; i < GN * GN; i++) {
    const idx = Math.max(0, Math.min(255, Math.floor(V[i] * 480)));
    px[i * 4 + 0] = PALETTE[idx * 3 + 0];
    px[i * 4 + 1] = PALETTE[idx * 3 + 1];
    px[i * 4 + 2] = PALETTE[idx * 3 + 2];
    px[i * 4 + 3] = 255;
  }
  rdCtx.putImageData(rdImg, 0, 0);

  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(rdCv, 0, 0, SIZE, SIZE);

  // Contamination warning bar at top
  const barW = 140;
  ctx.fillStyle = "rgba(7, 11, 20, 0.72)";
  ctx.fillRect(12, 12, barW + 8, 18);
  ctx.fillStyle = coverage > 0.52 ? "#ef4444" : "#facc15";
  ctx.fillRect(16, 16, Math.min(1, coverage / 0.68) * barW, 10);
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 1;
  ctx.strokeRect(16, 16, barW, 10);

  // Spore Cores
  for (const c of cores) {
    if (c.hp <= 0) continue;
    const pulse = Math.sin(c.phase) * 3;
    ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 10 + pulse, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#7f1d1d";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // HP ring
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 4, -Math.PI / 2, -Math.PI / 2 + (c.hp / c.maxHp) * Math.PI * 2);
    ctx.stroke();
  }

  // Blasts
  for (const bl of blasts) {
    ctx.strokeStyle = bl.col;
    ctx.globalAlpha = Math.max(0, bl.life);
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = "#38d6ff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Aim reticle & Turret
  const ang = Math.atan2(turret.aimY - turret.y, turret.aimX - turret.x);
  ctx.strokeStyle = "rgba(56, 214, 255, 0.3)";
  ctx.setLineDash([4, 6]);
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(turret.x, turret.y); ctx.lineTo(turret.aimX, turret.aimY); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  ctx.translate(turret.x, turret.y);
  ctx.rotate(ang);
  ctx.fillStyle = "#0ea5e9";
  ctx.strokeStyle = "#e0f2fe";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(-12, -12);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-12, 12);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6, 10, 20, 0.86)";
    ctx.fillRect(0, 176, SIZE, 160);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SOUCHE STÉRILISÉE !" : failReason, 256, 232);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`${destroyed}/${targetCores} noyaux détruits • Score ${score}`, 256, 266);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "13px sans-serif";
    ctx.fillText("Cliquez sur le canvas pour revenir au vaisseau", 256, 300);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>

<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
