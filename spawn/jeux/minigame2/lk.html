<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Verrouillage Arène</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "lk",
  "name": "Verrouillage Arène",
  "family": "topMouseHnS",
  "icon": "⚔️",
  "controls": "Cliquer/maintenir sur l'arène pour se déplacer ; cliquer sur un monolithe pour verrouiller et frapper au corps-à-corps",
  "description": "Combat d'arène isométrique à caméra fluide avec verrouillage de cible et cadence de frappe en mêlée.",
  "goal": "Briser 10 monolithes en verrouillant vos attaques tout en esquivant leurs ondes de choc rouges.",
  "fields": [
    { "key": "targetCount", "label": "Monolithes à briser", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>⚔️ <b>Verrouillage Arène</b></span>
  <span id="stat">Brisés: 0/10 • PV: 5 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "lk";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const ARENA = { cx: 320, cy: 190, rx: 320, ry: 170 };
let camx = 0, camy = 0;
let cx = 320, cy = 190, gx = 320, gy = 190, mode = 0;
let mx = 256, my = 256, mbutton = false;
let reload = 0, slashAnim = 0;
let target = null, floats = [];
let targetCount = 10, kills = 0, hp = 5, invuln = 0;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function updatePointer(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  updatePointer(e);
  mbutton = true;
});
cv.addEventListener("pointermove", updatePointer);
window.addEventListener("pointerup", () => { mbutton = false; });

function spawnTarget() {
  const ang = Math.random() * Math.PI * 2;
  const rad = 0.25 + Math.random() * 0.62;
  return {
    x: ARENA.cx + Math.cos(ang) * ARENA.rx * rad - 18,
    y: ARENA.cy + Math.sin(ang) * ARENA.ry * rad - 32,
    w: 36, h: 64, dmg: 0, maxHp: 24,
    pulseTimer: 2.2, pulsing: false, pulseR: 0
  };
}

function clampToArena(px, py) {
  const nx = (px - ARENA.cx) / (ARENA.rx - 22);
  const ny = (py - ARENA.cy) / (ARENA.ry - 22);
  const d = Math.hypot(nx, ny);
  if (d > 1) {
    return { x: ARENA.cx + (nx / d) * (ARENA.rx - 22), y: ARENA.cy + (ny / d) * (ARENA.ry - 22) };
  }
  return { x: px, y: py };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Number(custom.targetCount) || 10;
  cx = ARENA.cx; cy = ARENA.cy; gx = cx; gy = cy; mode = 0;
  camx = cx - 256; camy = cy - 256;
  reload = 0; slashAnim = 0; kills = 0; hp = 5; invuln = 0;
  timeLeft = 50; score = 0; won = false; over = false;
  floats = [];
  target = spawnTarget();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const wmx = mx + camx, wmy = my + camy;
  const overTarget = target && wmx >= target.x - 10 && wmx <= target.x + target.w + 10 && wmy >= target.y - 10 && wmy <= target.y + target.h + 10;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (reload > 0) reload = Math.max(0, reload - dt);
    if (slashAnim > 0) slashAnim = Math.max(0, slashAnim - dt);

    if (mbutton) {
      gx = wmx; gy = wmy;
      mode = overTarget ? 1 : 0;
    }

    const tcx = target.x + target.w * 0.5;
    const tcy = target.y + target.h * 0.5;

    if (mode === 1) { gx = tcx; gy = tcy; }

    // Faithful melee lock-on combat (dist < 64)
    const distT = Math.hypot(cx - tcx, cy - tcy);
    let ms = 270;
    if (mode === 1 && distT < 62) {
      ms = 0;
      if (reload <= 0) {
        reload = 0.28;
        slashAnim = 0.16;
        target.dmg += 8;
        floats.push({ x: tcx, y: target.y - 4, text: "-8", life: 0.55, color: "#fde047" });
        if (target.dmg >= target.maxHp) {
          kills++;
          score += 50;
          floats.push({ x: tcx, y: tcy, text: "BRISÉ !", life: 0.7, color: "#4ade80" });
          mode = 0; gx = cx; gy = cy;
          if (kills >= targetCount) {
            won = true; over = true;
            score += hp * 25 + Math.ceil(timeLeft) * 8;
          } else {
            target = spawnTarget();
          }
        }
      }
    }

    // Move hero
    const distG = Math.hypot(gx - cx, gy - cy);
    if (distG < 18) ms = 0;
    if (ms > 0) {
      const ta = Math.atan2(gy - cy, gx - cx);
      const next = clampToArena(cx + Math.cos(ta) * ms * dt, cy + Math.sin(ta) * ms * dt);
      cx = next.x; cy = next.y;
    }

    // Target shockwave telegraph & attack
    if (target && !over) {
      target.pulseTimer -= dt;
      if (!target.pulsing && target.pulseTimer <= 0) {
        target.pulsing = true;
        target.pulseR = 16;
      }
      if (target.pulsing) {
        target.pulseR += 125 * dt;
        if (target.pulseR >= 92) {
          if (invuln <= 0 && Math.hypot(cx - (target.x + target.w * 0.5), cy - (target.y + target.h * 0.5)) < 94) {
            hp--;
            invuln = 0.9;
            floats.push({ x: cx, y: cy - 42, text: "-1 PV", life: 0.65, color: "#f87171" });
            if (hp <= 0) over = true;
          }
          target.pulsing = false;
          target.pulseTimer = 2.0 + Math.random() * 0.8;
        }
      }
    }

    // Smooth camera follow (faithful camx += ((cx-256)-camx)*0.2)
    camx += ((cx - 256) - camx) * Math.min(1, dt * 10);
    camy += ((cy - 256) - camy) * Math.min(1, dt * 10);

    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 36 * dt;
      floats[i].life -= dt;
      if (floats[i].life <= 0) floats.splice(i, 1);
    }
  }

  document.getElementById("stat").textContent = `Brisés: ${kills}/${targetCount} • PV: ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Floating oval arena with drop shadow (faithful drawEllipse)
  ctx.beginPath();
  ctx.ellipse(ARENA.cx - camx, ARENA.cy - camy + 18, ARENA.rx, ARENA.ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#070b14"; ctx.fill();
  ctx.strokeStyle = "rgba(56,214,255,0.25)"; ctx.lineWidth = 2; ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(ARENA.cx - camx, ARENA.cy - camy, ARENA.rx, ARENA.ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#121c30"; ctx.fill();
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5; ctx.stroke();

  // Target shockwave telegraph
  if (target) {
    const tcx = target.x + target.w * 0.5 - camx;
    const tcy = target.y + target.h * 0.5 - camy;
    if (target.pulsing) {
      ctx.beginPath(); ctx.arc(tcx, tcy, 92, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(248,113,113,0.35)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(tcx, tcy, target.pulseR, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(248,113,113,0.18)"; ctx.fill();
      ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2.5; ctx.stroke();
    }

    // Target monolith (rx, ry, rw, rh)
    ctx.fillStyle = mode === 1 ? "rgba(248,113,113,0.38)" : "rgba(248,113,113,0.2)";
    ctx.strokeStyle = (overTarget || mode === 1) ? "#fde047" : "#f87171";
    ctx.lineWidth = (overTarget || mode === 1) ? 3 : 2;
    ctx.fillRect(target.x - camx, target.y - camy, target.w, target.h);
    ctx.strokeRect(target.x - camx, target.y - camy, target.w, target.h);

    // HP bar on monolith
    const rem = Math.max(0, target.maxHp - target.dmg) / target.maxHp;
    ctx.fillStyle = "#0a0e18"; ctx.fillRect(target.x - camx, target.y - camy - 10, target.w, 6);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(target.x - camx, target.y - camy - 10, target.w * rem, 6);
  }

  // Hero base shadow + facing line + upright capsule body (faithful lk.as)
  const hx = cx - camx, hy = cy - camy;
  const fa = Math.atan2(wmy - cy, wmx - cx);

  ctx.beginPath(); ctx.arc(hx, hy, 16, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.22)"; ctx.fill();
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(fa) * 20, hy + Math.sin(fa) * 20);
  ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(hx, hy - 18, 14, 28, 0, 0, Math.PI * 2);
  ctx.fillStyle = invuln > 0 && Math.floor(now / 80) % 2 === 0 ? "#f87171" : "#1c3552";
  ctx.fill();
  ctx.strokeStyle = mode === 1 ? "#fde047" : "#38d6ff";
  ctx.lineWidth = 2.5; ctx.stroke();

  // Melee slash arc
  if (slashAnim > 0 && target) {
    const sa = Math.atan2((target.y + target.h * 0.5) - cy, (target.x + target.w * 0.5) - cx);
    ctx.beginPath();
    ctx.arc(hx, hy - 10, 42, sa - 0.8, sa + 0.8);
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 5; ctx.stroke();
  }

  // Floating combat text
  ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
  for (const f of floats) {
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x - camx, f.y - camy);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ARÈNE CONQUISE !" : (hp <= 0 ? "VAINCU DANS L'ARÈNE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
