<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Automate RGB (Trigo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; gap: 6px; flex-wrap: wrap; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "trigo",
  "name": "Automate RGB (Trigo)",
  "family": "zooEcosys",
  "icon": "🔥",
  "controls": "Clic/glisser pour placer Feu (R/1), Arbre (G/2) ou Eau (B/3) • Espace pour alterner",
  "description": "Automate cellulaire Feu / Arbre / Eau : l'eau nourrit la forêt, le feu embrase les arbres et s'évapore au contact de l'eau.",
  "goal": "Faire pousser une forêt de 260 arbres simultanés avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "targetTrees", "label": "Objectif Arbres", "type": "number", "default": 260 }
  ]
}
</script>
<div class="bar">
  <span>🔥 <b>Automate Trigo</b></span>
  <span id="stat">🌲 0/260 • 45s</span>
  <div>
    <button id="btnElem" onclick="cycleElem()">💧 Eau [B]</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "trigo";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const SIZE = 31;
const BLANK = 0, FIRE = 1, TREE = 2, WATER = 3;
const CELL = 512 / SIZE;
const FILL = ["#161e2e", "#ff3b5c", "#34e07a", "#38b6ff"];
const ELEM_LABEL = ["", "🔥 Feu [R]", "🌲 Arbre [G]", "💧 Eau [B]"];

let cells = new Uint8Array(SIZE * SIZE);
let prev = new Uint8Array(SIZE * SIZE);
let placedType = WATER;
let down = false, cx = 15, cy = 15;
let targetTrees = 260, timeLeft = 45, score = 0, won = false, over = false;
let stepAcc = 0, sparkAcc = 0, treeCount = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function updateElemBtn() {
  const b = document.getElementById("btnElem");
  b.textContent = ELEM_LABEL[placedType];
  b.style.borderColor = FILL[placedType];
  b.style.color = FILL[placedType];
}
function cycleElem() {
  placedType = placedType === WATER ? TREE : (placedType === TREE ? FIRE : WATER);
  updateElemBtn();
}

window.addEventListener("keydown", (e) => {
  if (over) return;
  const k = e.key.toLowerCase();
  if (k === "r" || k === "1") { placedType = FIRE; updateElemBtn(); }
  else if (k === "g" || k === "2") { placedType = TREE; updateElemBtn(); }
  else if (k === "b" || k === "3") { placedType = WATER; updateElemBtn(); }
  else if (e.code === "Space") { e.preventDefault(); cycleElem(); }
});

function updatePos(e) {
  const r = cv.getBoundingClientRect();
  cx = Math.max(0, Math.min(SIZE - 1, Math.floor(((e.clientX - r.left) / r.width) * SIZE)));
  cy = Math.max(0, Math.min(SIZE - 1, Math.floor(((e.clientY - r.top) / r.height) * SIZE)));
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePos(e);
  cells[cy * SIZE + cx] = placedType;
});
cv.addEventListener("pointermove", (e) => {
  updatePos(e);
  if (down && !over) cells[cy * SIZE + cx] = placedType;
});
window.addEventListener("pointerup", () => { down = false; });

function checkAround(x, y, type, all = false) {
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      if (ox === 0 && oy === 0) continue;
      const nx = x + ox, ny = y + oy;
      if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) continue;
      if (all) {
        if (prev[ny * SIZE + nx] !== type) return false;
      } else {
        if (prev[ny * SIZE + nx] === type) return true;
      }
    }
  }
  return all;
}

function stepField() {
  prev.set(cells);
  treeCount = 0;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const i = y * SIZE + x;
      const c = prev[i];
      // Exact rules from trigo.as (AutomatonRGB)
      if (c === TREE && checkAround(x, y, FIRE)) cells[i] = FIRE;
      else if (c === FIRE) cells[i] = BLANK;
      else if (c === BLANK && checkAround(x, y, TREE) && checkAround(x, y, WATER)) cells[i] = TREE;
      else if (c === BLANK && checkAround(x, y, WATER)) cells[i] = WATER;
      else if (c === WATER && checkAround(x, y, FIRE)) cells[i] = BLANK;
      else if (c === WATER && checkAround(x, y, WATER, true)) cells[i] = TREE;
      if (cells[i] === TREE) treeCount++;
    }
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  targetTrees = Number(custom.targetTrees) || 260;
  score = 0; won = false; over = false; stepAcc = 0; sparkAcc = 0; treeCount = 0;
  placedType = WATER; updateElemBtn();
  cells.fill(BLANK);
  for (let i = 0; i < SIZE; i++) {
    const rx = (Math.random() * SIZE) | 0;
    const ry = (Math.random() * SIZE) | 0;
    cells[ry * SIZE + rx] = ((Math.random() * 2) | 0) + TREE;
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (down) cells[cy * SIZE + cx] = placedType;

    stepAcc += dt;
    if (stepAcc >= 0.28) {
      stepAcc -= 0.28;
      stepField();
    }

    // Periodic wildfire spark to keep gameplay dynamic
    sparkAcc += dt;
    if (sparkAcc >= 3.6) {
      sparkAcc = 0;
      const sx = (Math.random() * SIZE) | 0;
      const sy = (Math.random() * SIZE) | 0;
      cells[sy * SIZE + sx] = FIRE;
    }

    // Recompute live tree count for responsive win check
    let liveTrees = 0;
    for (let i = 0; i < SIZE * SIZE; i++) if (cells[i] === TREE) liveTrees++;
    treeCount = liveTrees;

    if (treeCount >= targetTrees) {
      won = true; over = true;
      score = Math.round(treeCount + timeLeft * 12);
    } else if (timeLeft <= 0) {
      won = false; over = true;
      score = treeCount;
    }
  }

  document.getElementById("stat").textContent = `🌲 ${treeCount}/${targetTrees} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0a0e18";
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      ctx.fillStyle = FILL[cells[y * SIZE + x]];
      ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    }
  }
  if (!over) {
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = FILL[placedType];
    ctx.globalAlpha = 0.6;
    ctx.fillRect(cx * CELL + 3, cy * CELL + 3, CELL - 6, CELL - 6);
    ctx.globalAlpha = 1;
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FORÊT ÉPANOUIE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} (${treeCount} arbres) — Cliquez pour revenir`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
