<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Grille Rebond</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "rndtile",
  "name": "Grille Rebond",
  "family": "topMouseMut",
  "icon": "🧱",
  "controls": "Déplacer la souris / doigt pour placer votre bloc-tuile et dévier les billes",
  "description": "Grille d'occupation 32×32 : chaque bille et votre curseur occupent des tuiles solides qui provoquent des rebonds en chaîne.",
  "goal": "Percuter les billes avec votre bloc pour les charger en or et en dévier 10 dans le portail vert.",
  "fields": [
    { "key": "targetCount", "label": "Billes à capturer", "type": "number", "default": 10 },
    { "key": "ballCount", "label": "Nombre de billes", "type": "number", "default": 22 }
  ]
}
</script>
<div class="bar">
  <span>🧱 <b>Grille Rebond</b></span>
  <span id="stat">Capturées: 0/10 • 42s • Score 0</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "rndtile";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 32, MH = 32, CW = 16, CH = 16, CW2 = 8, CH2 = 8;
const vecGrid = new Int32Array(MW * MH);
let balls = [], mx = 256, my = 256, prevMx = 256, prevMy = 256;
let portal = { x: 256, y: 256, r: 40 };
let targetCount = 10, captured = 0, timeLeft = 42, score = 0, won = false, over = false;
let sparks = [];

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mx = Math.max(16, Math.min(496, (e.clientX - r.left) * (512 / r.width)));
  my = Math.max(16, Math.min(496, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

function setWall(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  vecGrid[ay * MW + ax] = t;
}
function getTile(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return 1;
  return vecGrid[ay * MW + ax];
}
function isWall(ax, ay) {
  return getTile((ax / CW) | 0, (ay / CH) | 0);
}
function setBlock(ax, ay, t) {
  setWall(((ax - CW2) / CW) | 0, ((ay - CH2) / CH) | 0, t);
  setWall(((ax - CW2) / CW) | 0, ((ay + CH2) / CH) | 0, t);
  setWall(((ax + CW2) / CW) | 0, ((ay - CH2) / CH) | 0, t);
  setWall(((ax + CW2) / CW) | 0, ((ay + CH2) / CH) | 0, t);
}

function movePortal() {
  const spots = [
    { x: 256, y: 256 }, { x: 112, y: 112 }, { x: 400, y: 112 },
    { x: 112, y: 400 }, { x: 400, y: 400 }
  ];
  const next = spots[Math.floor(Math.random() * spots.length)];
  portal.x = next.x; portal.y = next.y;
}

function spawnBall(id) {
  let x, y, tries = 0;
  do {
    x = 40 + Math.random() * 432;
    y = 40 + Math.random() * 432;
    tries++;
  } while (tries < 20 && (Math.hypot(x - portal.x, y - portal.y) < 90 || Math.hypot(x - mx, y - my) < 70));
  const ang = Math.random() * Math.PI * 2;
  const spd = 1.6 + Math.random() * 1.6;
  return { cx: x, cy: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, id, charged: 0 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Number(custom.targetCount) || 10;
  const ballCount = Number(custom.ballCount) || 22;
  vecGrid.fill(0);
  captured = 0; timeLeft = 42; score = 0; won = false; over = false;
  sparks = [];
  portal = { x: 256, y: 256, r: 40 };
  prevMx = mx; prevMy = my;
  balls = [];
  for (let i = 0; i < ballCount; i++) {
    const b = spawnBall(i + 2);
    balls.push(b);
    setBlock(b.cx, b.cy, b.id);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    setBlock(prevMx, prevMy, 0);
    setBlock(mx, my, 1);
    const mvx = (mx - prevMx) * 0.15;
    const mvy = (my - prevMy) * 0.15;
    prevMx = mx; prevMy = my;

    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      setBlock(a.cx, a.cy, 0);

      if (a.cx > 494 && a.vx > 0) a.vx *= -1;
      if (a.cx < 18 && a.vx < 0) a.vx *= -1;
      if (a.cy > 494 && a.vy > 0) a.vy *= -1;
      if (a.cy < 18 && a.vy < 0) a.vy *= -1;

      const tR = a.vx > 0 ? isWall(a.cx + 16, a.cy) : 0;
      const tL = a.vx < 0 ? isWall(a.cx - 16, a.cy) : 0;
      const tD = a.vy > 0 ? isWall(a.cx, a.cy + 16) : 0;
      const tU = a.vy < 0 ? isWall(a.cx, a.cy - 16) : 0;

      if (tR > 0) { a.vx *= -1; if (tR === 1) { a.charged = 5; a.vx += mvx; } }
      if (tL > 0) { a.vx *= -1; if (tL === 1) { a.charged = 5; a.vx += mvx; } }
      if (tD > 0) { a.vy *= -1; if (tD === 1) { a.charged = 5; a.vy += mvy; } }
      if (tU > 0) { a.vy *= -1; if (tU === 1) { a.charged = 5; a.vy += mvy; } }

      // Direct proximity boost from player cursor block
      const dm = Math.hypot(a.cx - mx, a.cy - my);
      if (dm < 34) {
        const nx = (a.cx - mx) / (dm || 1), ny = (a.cy - my) / (dm || 1);
        a.vx = nx * 3.4 + mvx;
        a.vy = ny * 3.4 + mvy;
        a.charged = 5;
      }

      // Clamp speed
      const spd = Math.hypot(a.vx, a.vy);
      if (spd > 4.6) { a.vx = (a.vx / spd) * 4.6; a.vy = (a.vy / spd) * 4.6; }
      else if (spd < 1.2) { const ang = Math.atan2(a.vy, a.vx); a.vx = Math.cos(ang) * 1.4; a.vy = Math.sin(ang) * 1.4; }

      a.cx = Math.max(16, Math.min(496, a.cx + a.vx * step));
      a.cy = Math.max(16, Math.min(496, a.cy + a.vy * step));

      if (a.charged > 0) a.charged = Math.max(0, a.charged - dt);

      // Capture check
      if (a.charged > 0 && Math.hypot(a.cx - portal.x, a.cy - portal.y) < portal.r + 6) {
        captured++;
        score += 50;
        for (let k = 0; k < 10; k++) {
          const ang = Math.random() * Math.PI * 2;
          sparks.push({ x: a.cx, y: a.cy, vx: Math.cos(ang) * 120, vy: Math.sin(ang) * 120, life: 0.45 });
        }
        if (captured % 3 === 0 && captured < targetCount) movePortal();
        const nb = spawnBall(a.id);
        balls[i] = nb;
        setBlock(nb.cx, nb.cy, nb.id);
        if (captured >= targetCount) {
          won = true; over = true;
          score += Math.ceil(timeLeft) * 10;
        }
        continue;
      }

      setBlock(a.cx, a.cy, a.id);
    }

    // Re-stamp cursor block on top
    setBlock(mx, my, 1);

    for (let i = sparks.length - 1; i >= 0; i--) {
      sparks[i].x += sparks[i].vx * dt;
      sparks[i].y += sparks[i].vy * dt;
      sparks[i].life -= dt;
      if (sparks[i].life <= 0) sparks.splice(i, 1);
    }
  }

  document.getElementById("stat").textContent = `Capturées: ${captured}/${targetCount} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle 32x32 grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  for (let i = 1; i < MW; i++) {
    ctx.beginPath(); ctx.moveTo(i * CW, 0); ctx.lineTo(i * CW, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CH); ctx.lineTo(512, i * CH); ctx.stroke();
  }

  // Draw occupancy map (faithful drawMap)
  for (let r = 0; r < MH; r++) {
    const row = r * MW;
    for (let c = 0; c < MW; c++) {
      const t = vecGrid[row + c];
      if (t <= 0) continue;
      ctx.fillStyle = t === 1 ? "rgba(248,113,113,0.35)" : "rgba(56,214,255,0.22)";
      ctx.fillRect(c * CW + 1, r * CH + 1, CW - 2, CH - 2);
    }
  }

  // Draw capture portal
  const pulse = 1 + Math.sin(now * 0.006) * 0.08;
  ctx.beginPath();
  ctx.arc(portal.x, portal.y, portal.r * pulse, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.16)";
  ctx.fill();
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = "#86efac";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("PORTAIL", portal.x, portal.y + 4);

  // Draw balls
  for (const a of balls) {
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, 13, 0, Math.PI * 2);
    if (a.charged > 0) {
      ctx.fillStyle = "#fde047";
      ctx.strokeStyle = "#fff7ae";
    } else {
      ctx.fillStyle = "#1e3a5f";
      ctx.strokeStyle = "#38d6ff";
    }
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Sparks
  for (const s of sparks) {
    ctx.fillStyle = `rgba(74,222,128,${s.life * 2})`;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }

  // Draw player cursor bumper
  ctx.beginPath();
  ctx.arc(mx, my, 16, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(248,113,113,0.35)";
  ctx.fill();
  ctx.strokeStyle = "#f87171";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "GRILLE MAÎTRISÉE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
