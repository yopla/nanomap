<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Essaim Tuilé</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "folotil",
  "name": "Essaim Tuilé",
  "family": "topMouseMut",
  "icon": "💠",
  "controls": "Déplacer la souris / doigt pour guider l'essaim ; cliquer pour rallier immédiatement",
  "description": "Un essaim de 16 drones verrouillés par tuiles sur une grille 16×16 qui rebondissent entre eux.",
  "goal": "Capturer 20 balises dorées avec vos drones avant la fin du temps tout en évitant les mines rouges.",
  "fields": [
    { "key": "targetCount", "label": "Balises à capturer", "type": "number", "default": 20 }
  ]
}
</script>
<div class="bar">
  <span>💠 <b>Essaim Tuilé</b></span>
  <span id="stat">Balises: 0/20 • Drones: 16 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "folotil";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 16, MH = 16, CW = 32, CH = 32;
const COLORS = ["#38d6ff", "#4ade80", "#a78bfa", "#f472b6", "#facc15", "#2dd4bf", "#fb923c", "#60a5fa"];

let mouse = { x: 256, y: 256 };
let actors = [], gridAct = [], targets = [], mines = [], particles = [];
let targetGoal = 20, captured = 0, timeLeft = 40, score = 0, won = false, over = false;
let gt = 0, stepAccum = 0, rallyFlash = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  rallyFlash = 0.25;
  for (const a of actors) {
    if (!a.dead) a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx);
  }
});

function getAct(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return "WALL";
  return gridAct[ay * MW + ax];
}
function setAct(ax, ay, a) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  gridAct[ay * MW + ax] = a;
}

function spawnTarget() {
  for (let tries = 0; tries < 80; tries++) {
    const tx = 1 + Math.floor(Math.random() * (MW - 2));
    const ty = 1 + Math.floor(Math.random() * (MH - 2));
    if (targets.some(t => t.tx === tx && t.ty === ty)) continue;
    if (mines.some(m => m.tx === tx && m.ty === ty)) continue;
    if (getAct(tx, ty) != null) continue;
    targets.push({ tx, ty, pulse: Math.random() * Math.PI * 2 });
    return;
  }
}

function spawnMine() {
  for (let tries = 0; tries < 80; tries++) {
    const tx = 1 + Math.floor(Math.random() * (MW - 2));
    const ty = 1 + Math.floor(Math.random() * (MH - 2));
    if (Math.abs(tx - 7.5) < 3 && Math.abs(ty - 7.5) < 3) continue;
    if (targets.some(t => t.tx === tx && t.ty === ty)) continue;
    if (mines.some(m => Math.abs(m.tx - tx) <= 1 && Math.abs(m.ty - ty) <= 1)) continue;
    mines.push({ tx, ty, timer: 4 + Math.random() * 4, armed: false, warn: 1.5 });
    return;
  }
}

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 110;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, col });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetGoal = Math.max(5, Number(custom.targetCount) || 20);
  captured = 0; timeLeft = 40; score = 0; won = false; over = false;
  gt = 0; stepAccum = 0; rallyFlash = 0;
  gridAct = new Array(MW * MH).fill(null);
  actors = []; targets = []; mines = []; particles = [];

  for (let i = 0; i < 16; i++) {
    const gx = 6 + (i % 4), gy = 6 + Math.floor(i / 4);
    const a = {
      cx: gx * CW + CW * 0.5,
      cy: gy * CH + CH * 0.5,
      xrad: 13,
      ang: (i / 16) * Math.PI * 2,
      tx: gx,
      ty: gy,
      col: COLORS[i % COLORS.length],
      dead: false
    };
    actors.push(a);
    setAct(gx, gy, a);
  }
  for (let i = 0; i < 4; i++) spawnTarget();
  for (let i = 0; i < 3; i++) spawnMine();
}

function stepSim() {
  const ms = 4.2;
  for (let i = 0; i < actors.length; i++) {
    const a = actors[i];
    if (a.dead) continue;

    if (getAct(a.tx, a.ty) === a) setAct(a.tx, a.ty, null);

    if ((gt + i) % 20 === 0) {
      a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx);
    }

    let vx = Math.cos(a.ang) * ms;
    let vy = Math.sin(a.ang) * ms;
    const ax = Math.max(14, Math.min(498, a.cx + vx));
    const ay = Math.max(14, Math.min(498, a.cy + vy));
    const tx = Math.max(0, Math.min(MW - 1, Math.floor(ax / CW)));
    const ty = Math.max(0, Math.min(MH - 1, Math.floor(ay / CH)));

    if (getAct(tx, ty) === null) {
      a.cx = ax; a.cy = ay; a.tx = tx; a.ty = ty;
    } else if (getAct(tx, a.ty) === null) {
      a.cx = ax; a.tx = tx; vy = -vy;
    } else if (getAct(a.tx, ty) === null) {
      a.cy = ay; a.ty = ty; vx = -vx;
    } else {
      vx = -vx; vy = -vy;
    }

    a.ang = Math.atan2(vy, vx);
    setAct(a.tx, a.ty, a);

    for (let t = targets.length - 1; t >= 0; t--) {
      if (targets[t].tx === a.tx && targets[t].ty === a.ty) {
        burst(a.tx * CW + 16, a.ty * CH + 16, "#fde047", 12);
        targets.splice(t, 1);
        captured++;
        score += 35;
        if (captured < targetGoal) spawnTarget();
        break;
      }
    }

    for (let m = mines.length - 1; m >= 0; m--) {
      if (mines[m].armed && mines[m].tx === a.tx && mines[m].ty === a.ty) {
        a.dead = true;
        if (getAct(a.tx, a.ty) === a) setAct(a.tx, a.ty, null);
        burst(a.cx, a.cy, "#f87171", 16);
        mines.splice(m, 1);
        spawnMine();
        break;
      }
    }
  }
  gt++;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    rallyFlash = Math.max(0, rallyFlash - dt);
    if (timeLeft <= 0) over = true;

    for (const m of mines) {
      if (!m.armed) {
        m.warn -= dt;
        if (m.warn <= 0) m.armed = true;
      } else {
        m.timer -= dt;
        if (m.timer <= 0) {
          m.armed = false;
          m.warn = 1.5;
          m.timer = 4.5 + Math.random() * 4;
          for (let tries = 0; tries < 40; tries++) {
            const nx = 1 + Math.floor(Math.random() * (MW - 2));
            const ny = 1 + Math.floor(Math.random() * (MH - 2));
            if (getAct(nx, ny) === null && !targets.some(t => t.tx === nx && t.ty === ny)) {
              m.tx = nx; m.ty = ny; break;
            }
          }
        }
      }
    }

    stepAccum += dt;
    const fixedDt = 1 / 60;
    while (stepAccum >= fixedDt) {
      stepSim();
      stepAccum -= fixedDt;
    }

    const alive = actors.filter(a => !a.dead).length;
    if (captured >= targetGoal) {
      won = true; over = true;
      score += Math.round(timeLeft * 10 + alive * 15);
    } else if (alive === 0) {
      won = false; over = true;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  const aliveN = actors.filter(a => !a.dead).length;
  document.getElementById("stat").textContent = `Balises: ${captured}/${targetGoal} • Drones: ${aliveN} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Draw
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle 16x16 grid
  ctx.strokeStyle = "rgba(56,214,255,0.08)";
  ctx.lineWidth = 1;
  for (let i = 1; i < MW; i++) {
    ctx.beginPath(); ctx.moveTo(i * CW, 0); ctx.lineTo(i * CW, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CH); ctx.lineTo(512, i * CH); ctx.stroke();
  }

  // Occupied tiles (AS3 signature visual)
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      const a = gridAct[y * MW + x];
      if (a) {
        ctx.fillStyle = a.col + "33";
        ctx.fillRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
        ctx.strokeStyle = a.col + "88";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
      }
    }
  }

  // Targets
  for (const t of targets) {
    t.pulse += dt * 5;
    const s = 10 + Math.sin(t.pulse) * 2.5;
    const cx = t.tx * CW + 16, cy = t.ty * CH + 16;
    ctx.fillStyle = "rgba(250,204,21,0.22)";
    ctx.fillRect(t.tx * CW + 2, t.ty * CH + 2, CW - 4, CH - 4);
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2;
    ctx.strokeRect(t.tx * CW + 3, t.ty * CH + 3, CW - 6, CH - 6);
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = "#fde047";
    ctx.fill();
  }

  // Mines
  for (const m of mines) {
    const cx = m.tx * CW + 16, cy = m.ty * CH + 16;
    if (!m.armed) {
      ctx.strokeStyle = "rgba(248,113,113,0.7)";
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 2;
      ctx.strokeRect(m.tx * CW + 3, m.ty * CH + 3, CW - 6, CH - 6);
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = "rgba(239,68,68,0.28)";
      ctx.fillRect(m.tx * CW + 2, m.ty * CH + 2, CW - 4, CH - 4);
      ctx.strokeStyle = "#f87171";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 8); ctx.lineTo(cx + 8, cy + 8);
      ctx.moveTo(cx + 8, cy - 8); ctx.lineTo(cx - 8, cy + 8);
      ctx.stroke();
    }
  }

  // Actors
  for (const a of actors) {
    if (a.dead) continue;
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.xrad, 0, Math.PI * 2);
    ctx.fillStyle = a.col + "cc";
    ctx.fill();
    ctx.strokeStyle = "#e6f4ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(a.cx, a.cy);
    ctx.lineTo(a.cx + Math.cos(a.ang) * 11, a.cy + Math.sin(a.ang) * 11);
    ctx.strokeStyle = "#0a0e18";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.45);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Cursor
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 8 + rallyFlash * 36, 0, Math.PI * 2);
  ctx.strokeStyle = rallyFlash > 0 ? "#fde047" : "#38d6ff";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#e6f4ff"; ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ESSAIM SYNCHRONISÉ !" : (aliveN === 0 ? "ESSAIM DÉTRUIT" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
