<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Escalade Murale (Essc)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "essc",
  "name": "Escalade Murale (Essc)",
  "family": "sideClavSimple",
  "icon": "🧗",
  "controls": "Flèches / ZQSD pour courir, sauter et grimper aux murs (ou maintenir clic/doigt vers la direction)",
  "description": "Plateformer agile à accroche murale et sauts de paroi dans un puits vertical.",
  "goal": "Collecter les 6 cristaux dorés en escaladant les parois avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🧗 <b>Escalade Essc</b></span>
  <span id="stat">Cristaux: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "essc";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const MW = 16, MH = 16, CW = 32, CH = 32;

let keys = {}, grid = [], p = {}, gems = [], sparks = [];
let down = false, mx = 256, my = 256;
let timeLeft = 45, score = 0, won = false, over = false, tick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => {
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
});
window.addEventListener("pointerup", () => { down = false; });

function getTile(tx, ty) {
  const ix = Math.floor(tx), iy = Math.floor(ty);
  if (ix < 0 || ix >= MW || iy < 0 || iy >= MH) return 1;
  return grid[iy * MW + ix];
}
function isWall(ax, ay) {
  if (ax < 0 || ay < 0 || ax >= 512 || ay >= 512) return true;
  return getTile(ax / CW, ay / CH) > 0;
}

const LEVEL_MAP = [
  "1111111111111111",
  "1000001000000001",
  "1000001000111001",
  "1001000000000001",
  "1001001110000101",
  "1001000000100101",
  "1000000000100001",
  "1110001000100011",
  "1000001000000001",
  "1001001001110001",
  "1001000000000101",
  "1001110000000101",
  "1000000010000101",
  "1000000010000001",
  "1000000010000001",
  "1111111111111111"
];

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false; sparks = [];
  grid = new Array(MW * MH).fill(0);
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      grid[y * MW + x] = LEVEL_MAP[y][x] === "1" ? 1 : 0;
    }
  }
  p = { cx: 256, cy: 448, vx: 0, vy: 0, canJump: false, hangMode: 0, dir: 1 };
  gems = [
    { x: 2.5 * CW, y: 1.8 * CH, got: false },
    { x: 13.5 * CW, y: 1.5 * CH, got: false },
    { x: 7.5 * CW, y: 2.5 * CH, got: false },
    { x: 1.8 * CW, y: 5.5 * CH, got: false },
    { x: 13.5 * CW, y: 8.5 * CH, got: false },
    { x: 11.5 * CW, y: 13.5 * CH, got: false }
  ];
}

function addSparks(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
  }
}

function stepPhysics() {
  let keyLeft = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ);
  let keyRight = !!(keys.ArrowRight || keys.KeyD);
  let keyUp = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space);
  let keyDown = !!(keys.ArrowDown || keys.KeyS);

  if (down) {
    if (mx < p.cx - 18) keyLeft = true;
    if (mx > p.cx + 18) keyRight = true;
    if (my < p.cy - 18) keyUp = true;
    if (my > p.cy + 24) keyDown = true;
  }

  const ms = 0.52, ws = 4.0;
  if (keyLeft) { p.vx -= ms; if (p.vx < -ws) p.vx = -ws; p.dir = -1; }
  if (keyRight) { p.vx += ms; if (p.vx > ws) p.vx = ws; p.dir = 1; }

  if (keyUp && p.canJump && p.hangMode === 0) {
    p.vy = -7.6;
    p.canJump = false;
    addSparks(p.cx, p.cy + 8, "#38d6ff", 5);
  }
  if (p.canJump && !keyLeft && !keyRight) { p.vx *= 0.8; }

  // Authentic essc.as wall-cling detection
  if (p.hangMode === 0) {
    if (isWall(p.cx - 12, p.cy) && p.vy >= 0) { p.hangMode = 1; p.vy = 0; p.vx = 0; }
    else if (isWall(p.cx + 12, p.cy) && p.vy >= 0) { p.hangMode = 2; p.vy = 0; p.vx = 0; }
  }

  if (p.hangMode > 0) {
    if (p.hangMode === 1 && keyRight) {
      p.vx = ws; p.vy = keyUp ? -5.6 : -2.6; p.hangMode = 0;
      addSparks(p.cx - 8, p.cy, "#aef0ff", 6);
    } else if (p.hangMode === 1 && !isWall(p.cx - 12, p.cy)) {
      p.hangMode = 0; p.vy = -4.2; p.vx = -1.2;
    } else if (p.hangMode === 2 && keyLeft) {
      p.vx = -ws; p.vy = keyUp ? -5.6 : -2.6; p.hangMode = 0;
      addSparks(p.cx + 8, p.cy, "#aef0ff", 6);
    } else if (p.hangMode === 2 && !isWall(p.cx + 12, p.cy)) {
      p.hangMode = 0; p.vy = -4.2; p.vx = 1.2;
    }

    if (p.hangMode > 0) {
      if (keyUp) p.vy = -ws;
      else if (keyDown) p.vy = ws;
      else p.vy = 0;

      if (p.vy > 0 && isWall(p.cx, p.cy + 8 + p.vy)) { p.vy = 0; p.hangMode = 0; p.canJump = true; }
      else if (p.vy < 0 && isWall(p.cx, p.cy - 8 + p.vy)) { p.vy = 0; }

      p.cy += p.vy;
      if (p.hangMode === 1) {
        if (isWall(p.cx - 8, p.cy)) p.cx += 1;
        else if (!isWall(p.cx - 9, p.cy)) p.cx -= 1;
      } else if (p.hangMode === 2) {
        if (isWall(p.cx + 8, p.cy)) p.cx -= 1;
        else if (!isWall(p.cx + 9, p.cy)) p.cx += 1;
      }
      return;
    }
  }

  p.vy += 0.3;
  if (p.vy > 9) p.vy = 9;
  p.vx *= 0.96;

  if (p.vy > 1 || p.vy < -1) p.canJump = false;

  if (p.vx > 0 && isWall(p.cx + 8 + p.vx, p.cy)) { p.vx = 0; }
  else if (p.vx < 0 && isWall(p.cx - 8 + p.vx, p.cy)) { p.vx = 0; }

  if (p.vy > 0 && isWall(p.cx, p.cy + 8 + p.vy)) { p.vy = 0; p.canJump = true; }
  else if (p.vy < 0 && isWall(p.cx, p.cy - 8 + p.vy)) { p.vy = 0; }

  p.cx += p.vx;
  p.cy += p.vy;

  if (isWall(p.cx, p.cy + 8)) { p.cy = Math.floor(p.cy) - 1; }
  else if (p.vy >= 0 && p.vy < 1 && !isWall(p.cx, p.cy + 9)) { p.cy += 1; }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    acc += dt;
    while (acc >= 1 / 60) {
      stepPhysics();
      acc -= 1 / 60;
    }

    for (const g of gems) {
      if (!g.got && Math.hypot(p.cx - g.x, p.cy - g.y) < 18) {
        g.got = true;
        score += 50;
        addSparks(g.x, g.y, "#fde047", 14);
      }
    }
    if (gems.every(g => g.got)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.life -= dt * 2.5;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  const gotN = gems.filter(g => g.got).length;
  const modeTxt = p.hangMode > 0 ? " • Accroché" : "";
  document.getElementById("stat").textContent = `Cristaux: ${gotN}/${gems.length}${modeTxt} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle background grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 512; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Walls
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (grid[y * MW + x] > 0) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(x * CW, y * CH, CW, CH);
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
      }
    }
  }

  // Crystals
  for (const g of gems) {
    if (g.got) continue;
    const bob = Math.sin(tick * 5 + g.x) * 3;
    ctx.save();
    ctx.translate(g.x, g.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#fde047";
    ctx.shadowColor = "#facc15";
    ctx.shadowBlur = 10;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  // Sparks
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.cx, p.cy, 8, 0, Math.PI * 2);
  ctx.fillStyle = p.hangMode > 0 ? "#4ade80" : "#38d6ff";
  ctx.shadowColor = p.hangMode > 0 ? "#4ade80" : "#38d6ff";
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
  ctx.restore();

  // Cling indicator
  if (p.hangMode > 0) {
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2;
    const side = p.hangMode === 1 ? -10 : 10;
    ctx.beginPath();
    ctx.moveTo(p.cx + side, p.cy - 8);
    ctx.lineTo(p.cx + side, p.cy + 8);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SOMMET ATTEINT !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
