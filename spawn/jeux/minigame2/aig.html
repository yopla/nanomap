<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Aiguillage Rail (Aig)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "aig",
  "name": "Aiguillage Rail (Aig)",
  "family": "topOrthoClav",
  "icon": "🚂",
  "controls": "Gauche/Droite (reculer/avancer sur le rail) + Espace ou clic sur un aiguillage pour commuter",
  "description": "Pilotez une nacelle sur un réseau ferroviaire à aiguillages directionnels.",
  "goal": "Valider les 6 stations dorées en commutant les aiguillages et en évitant le drone rouge.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 }
  ]
}
</script>
<div class="bar">
  <span>🚂 <b>Aiguillage Aig</b></span>
  <span id="stat">Stations: 0/6 • ♥♥♥ • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "aig";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Rail graph: nodes (some are switchable junctions with 2 outgoing branches) + edges
const NODES = [
  { id: 0, x: 64,  y: 256, isSwitch: false }, // West hub
  { id: 1, x: 176, y: 256, isSwitch: true  }, // Switch A: forks NE (2) or SE (3)
  { id: 2, x: 288, y: 128, isSwitch: true  }, // Switch B: forks E (4) or SE (5)
  { id: 3, x: 288, y: 384, isSwitch: true  }, // Switch C: forks NE (5) or E (6)
  { id: 4, x: 440, y: 128, isSwitch: false }, // NE terminal
  { id: 5, x: 384, y: 256, isSwitch: true  }, // Switch D: forks NE (4) or SE (6) or W
  { id: 6, x: 440, y: 384, isSwitch: false }, // SE terminal
  { id: 7, x: 176, y: 96,  isSwitch: false }, // NW spur
  { id: 8, x: 176, y: 416, isSwitch: false }  // SW spur
];

// Directed track segments (forward = right arrow, backward = left arrow)
const EDGES = [
  [0, 1],
  [1, 2], [1, 3], [1, 7],
  [2, 4], [2, 5],
  [3, 5], [3, 6], [3, 8],
  [5, 4], [5, 6]
];

let switches = {};
let curEdge = 0, edgeT = 0.25; // position along current edge [0..1]
let cx = 0, cy = 0, ang = 0, dir = 0;
let stations = [];
let drone = { edge: 4, t: 0.5, dir: 1 };
let keys = {}, touchDrive = 0;
let hp = 3, invuln = 0, timeLeft = 50, score = 0, won = false, over = false, pulse = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function toggleNearestSwitch() {
  let bestId = -1, bestD = Infinity;
  for (const n of NODES) {
    if (!n.isSwitch) continue;
    const d = Math.hypot(n.x - cx, n.y - cy);
    if (d < bestD) { bestD = d; bestId = n.id; }
  }
  if (bestId >= 0) cycleSwitch(bestId);
}

function cycleSwitch(nodeId) {
  const sw = switches[nodeId];
  if (!sw) return;
  sw.idx = (sw.idx + 1) % sw.outEdges.length;
}

window.addEventListener("keydown", (e) => {
  if (!keys[e.code] && (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "KeyW" || e.code === "KeyZ" || e.code === "KeyS")) {
    if (!over) toggleNearestSwitch();
  }
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  // Click directly on any switch box to toggle it
  for (const n of NODES) {
    if (n.isSwitch && Math.hypot(p.x - n.x, p.y - n.y) < 26) {
      cycleSwitch(n.id);
      return;
    }
  }
  // Otherwise drive left/right depending on which side of the canvas is held
  touchDrive = p.x < 256 ? -1 : 1;
});
window.addEventListener("pointerup", () => { touchDrive = 0; });

function edgeAngle(ei) {
  const [a, b] = EDGES[ei];
  return Math.atan2(NODES[b].y - NODES[a].y, NODES[b].x - NODES[a].x);
}
function edgeLen(ei) {
  const [a, b] = EDGES[ei];
  return Math.hypot(NODES[b].x - NODES[a].x, NODES[b].y - NODES[a].y);
}
function posOnEdge(ei, t) {
  const [a, b] = EDGES[ei];
  return {
    x: NODES[a].x + (NODES[b].x - NODES[a].x) * t,
    y: NODES[a].y + (NODES[b].y - NODES[a].y) * t
  };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  hp = 3; invuln = 0; score = 0; won = false; over = false;
  switches = {};
  for (const n of NODES) {
    if (!n.isSwitch) continue;
    const outEdges = [];
    const inEdges = [];
    EDGES.forEach((e, idx) => {
      if (e[0] === n.id) outEdges.push(idx);
      if (e[1] === n.id) inEdges.push(idx);
    });
    switches[n.id] = { outEdges, inEdges, idx: 0 };
  }
  curEdge = 0; edgeT = 0.25; dir = 0;
  const p = posOnEdge(curEdge, edgeT);
  cx = p.x; cy = p.y; ang = edgeAngle(curEdge);

  stations = [
    { edge: 3, t: 0.85, done: false }, // NW spur
    { edge: 4, t: 0.85, done: false }, // NE terminal
    { edge: 5, t: 0.50, done: false }, // Mid upper
    { edge: 6, t: 0.50, done: false }, // Mid lower
    { edge: 7, t: 0.85, done: false }, // SE terminal
    { edge: 8, t: 0.85, done: false }  // SW spur
  ];
  drone = { edge: 1, t: 0.7, dir: 1 };
}

function advanceAlongGraph(state, speedDt) {
  const len = edgeLen(state.edge);
  state.t += speedDt / len;
  if (state.t >= 1) {
    const endNode = EDGES[state.edge][1];
    const sw = switches[endNode];
    if (sw && sw.outEdges.length > 0) {
      const nextE = sw.outEdges[sw.idx];
      state.edge = nextE;
      state.t = 0.02;
    } else {
      state.t = 1;
      return "hit_end";
    }
  } else if (state.t <= 0) {
    const startNode = EDGES[state.edge][0];
    // Find an incoming edge into startNode (prefer switch's first inEdge)
    const incoming = [];
    EDGES.forEach((e, idx) => { if (e[1] === startNode) incoming.push(idx); });
    if (incoming.length > 0) {
      state.edge = incoming[0];
      state.t = 0.98;
    } else {
      state.t = 0;
      return "hit_start";
    }
  }
  return "ok";
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pulse += dt * 4.5;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Drive along track (exact aig.as Left/Right along current angle)
    let move = 0;
    if (keys.ArrowRight || keys.KeyD || touchDrive > 0) { move = 1; dir = 0; }
    else if (keys.ArrowLeft || keys.KeyA || keys.KeyQ || touchDrive < 0) { move = -1; dir = 1; }

    if (move !== 0) {
      const st = { edge: curEdge, t: edgeT };
      advanceAlongGraph(st, move * 185 * dt);
      curEdge = st.edge; edgeT = st.t;
    }
    const pp = posOnEdge(curEdge, edgeT);
    cx = pp.x; cy = pp.y; ang = edgeAngle(curEdge);

    // Patrol drone on rails
    const res = advanceAlongGraph(drone, drone.dir * 115 * dt);
    if (res === "hit_end") drone.dir = -1;
    else if (res === "hit_start") drone.dir = 1;
    const dp = posOnEdge(drone.edge, drone.t);

    if (Math.hypot(dp.x - cx, dp.y - cy) < 18 && invuln <= 0) {
      hp--; invuln = 1.3;
      if (hp <= 0) { over = true; won = false; }
    }

    for (const s of stations) {
      if (s.done) continue;
      const sp = posOnEdge(s.edge, s.t);
      if (Math.hypot(sp.x - cx, sp.y - cy) < 16) {
        s.done = true;
        score += 55;
      }
    }
    if (stations.every(s => s.done)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6) + hp * 25;
    }
  }

  const doneN = stations.filter(s => s.done).length;
  const hearts = "♥".repeat(Math.max(0, hp)) + "♡".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Stations: ${doneN}/${stations.length} • ${hearts} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Subtle background grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)"; ctx.lineWidth = 1;
  for (let g = 32; g < 512; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  // Rails
  for (let i = 0; i < EDGES.length; i++) {
    const [a, b] = EDGES[i];
    const na = NODES[a], nb = NODES[b];
    const sw = switches[a];
    const isActiveBranch = !sw || sw.outEdges[sw.idx] === i;
    ctx.strokeStyle = isActiveBranch ? "#38d6ff" : "#253954";
    ctx.lineWidth = isActiveBranch ? 4 : 2.5;
    ctx.beginPath(); ctx.moveTo(na.x, na.y); ctx.lineTo(nb.x, nb.y); ctx.stroke();
  }

  // Switch boxes (exact aig.as xRect with directional needles!)
  for (const n of NODES) {
    if (!n.isSwitch) {
      ctx.fillStyle = "#1e293b"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      continue;
    }
    const sw = switches[n.id];
    ctx.fillStyle = "#121a2b";
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2;
    ctx.fillRect(n.x - 14, n.y - 14, 28, 28);
    ctx.strokeRect(n.x - 14, n.y - 14, 28, 28);

    // Draw branch needles inside the switch box
    for (let k = 0; k < sw.outEdges.length; k++) {
      const a = edgeAngle(sw.outEdges[k]);
      const active = (k === sw.idx);
      ctx.strokeStyle = active ? "#4ade80" : "#64748b";
      ctx.lineWidth = active ? 3 : 1.5;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + Math.cos(a) * (active ? 14 : 9), n.y + Math.sin(a) * (active ? 14 : 9));
      ctx.stroke();
    }
  }

  // Stations
  for (const s of stations) {
    const sp = posOnEdge(s.edge, s.t);
    ctx.fillStyle = s.done ? "#4ade80" : "#fde047";
    ctx.beginPath(); ctx.arc(sp.x, sp.y, s.done ? 6 : 8, 0, Math.PI * 2); ctx.fill();
    if (!s.done) {
      ctx.strokeStyle = "rgba(253,224,71,0.5)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 12 + Math.sin(pulse) * 2, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Patrol drone
  const dp = posOnEdge(drone.edge, drone.t);
  ctx.fillStyle = "#ef4444"; ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(dp.x, dp.y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Player rail-pod (exact aig.as circle + heading needle)
  const flash = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
  ctx.fillStyle = flash ? "#f87171" : "#38d6ff";
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  const head = dir === 0 ? ang : ang + Math.PI;
  ctx.lineTo(cx + Math.cos(head) * 12, cy + Math.sin(head) * 12);
  ctx.stroke();

  // Bottom hint
  ctx.fillStyle = "rgba(174,240,255,0.65)"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("← / → pour rouler • ESPACE ou clic sur un boîtier pour aiguiller", 256, 496);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "RÉSEAU COMPLÉTÉ !" : "COLLISION / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
