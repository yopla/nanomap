<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Terrasses Iso (IsoHau)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "isohau",
  "name": "Terrasses Iso (IsoHau)",
  "family": "topOrthoClav",
  "icon": "🪜",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour se déplacer)",
  "description": "Exploration en hauteur sur une architecture oblique à paliers et escaliers.",
  "goal": "Escalader les terrasses pour activer les 6 balises dorées avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🪜 <b>Terrasses IsoHau</b></span>
  <span id="stat">Balises: 0/6 • Niv:0 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "isohau";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const CW = 16, CH = 16, CHH = 16, MW = 16, MH = 16;
const CAMX = 128, CAMZ = -135, RENDW = 200;
let heightGrid = new Int16Array(MW * MH);
let vecBox = [], vecFloor = [];
let cx = 128, cy = 0, cz = 128;
let beacons = [];
let keys = {}, down = false, mx = 256, my = 256;
let timeLeft = 45, score = 0, won = false, over = false, pulse = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; const p = getPos(e); mx = p.x; my = p.y;
});
cv.addEventListener("pointermove", (e) => { const p = getPos(e); mx = p.x; my = p.y; });
window.addEventListener("pointerup", () => { down = false; });

function proj(ax, ay, az) {
  const x = ax - CAMX, z = az - CAMZ;
  return { sx: (x + z * 0.5) * 1.22 + RENDW - 45, sy: (z - ay) * 1.22 - 42 };
}

function setHeight(ax, az, aw, ad, h) {
  for (let z = az; z < az + ad; z++) {
    for (let x = ax; x < ax + aw; x++) {
      if (x >= 0 && x < MW && z >= 0 && z < MH) heightGrid[z * MW + x] = h;
    }
  }
}

function getHeightWorld(ax, az) {
  const gx = Math.floor(ax / CW), gz = Math.floor(az / CH);
  if (gx < 0 || gx >= MW || gz < 0 || gz >= MH) return 999;
  return heightGrid[gz * MW + gx];
}

function addBox(ax, az, aw, ad, h) {
  h = Math.max(0, Math.min(7, h));
  const b = { cx: ax * CW, cy: 0, cz: az * CH, cw: aw * CW, ch: h * CHH, cd: ad * CH, lvl: h };
  vecBox.push(b);
  vecFloor[h].push(b);
  setHeight(ax, az, aw, ad, b.ch);
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false;
  heightGrid.fill(0);
  vecBox = [];
  vecFloor = Array.from({ length: 8 }, () => []);

  // Original isoHau.as architecture + reachable upper terrace
  addBox(4, 7, 3, 7, 1);
  addBox(4, 4, 3, 3, 2);
  addBox(7, 4, 6, 3, 3);

  addBox(12, 12, 3, 3, 4);
  addBox(11, 12, 1, 2, 3);
  addBox(10, 12, 1, 2, 2);
  addBox(9, 12, 1, 2, 1);

  addBox(7, 7, 5, 5, 2);
  addBox(1, 15, 12, 1, 5);
  addBox(12, 14, 2, 1, 4);
  addBox(13, 15, 2, 1, 5);

  cx = 28; cz = 28; cy = getHeightWorld(cx, cz);

  beacons = [
    { x: 5.5 * CW, z: 11 * CH, done: false },
    { x: 5.5 * CW, z: 5.5 * CH, done: false },
    { x: 11.5 * CW, z: 5.5 * CH, done: false },
    { x: 9.5 * CW, z: 9.5 * CH, done: false },
    { x: 13.5 * CW, z: 13.5 * CH, done: false },
    { x: 3 * CW, z: 15.5 * CH, done: false }
  ];
  for (const b of beacons) b.y = getHeightWorld(b.x, b.z);
}

function drawFloorPoly(ax, ay, az, aw, ad, fill, stroke) {
  const p1 = proj(ax, ay, az), p2 = proj(ax + aw, ay, az);
  const p3 = proj(ax + aw, ay, az + ad), p4 = proj(ax, ay, az + ad);
  ctx.beginPath();
  ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy);
  ctx.lineTo(p3.sx, p3.sy); ctx.lineTo(p4.sx, p4.sy);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); }
}

function drawBoxWire(ax, ay, az, aw, ah, ad, color, lw) {
  const bx = ax + aw, by = ay + ah, bz = az + ad;
  const pts = [
    proj(ax, ay, az), proj(bx, ay, az), proj(bx, ay, bz), proj(ax, ay, bz),
    proj(ax, by, az), proj(bx, by, az), proj(bx, by, bz), proj(ax, by, bz)
  ];
  const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1.2;
  ctx.beginPath();
  for (const [u, v] of edges) {
    ctx.moveTo(pts[u].sx, pts[u].sy); ctx.lineTo(pts[v].sx, pts[v].sy);
  }
  ctx.stroke();
}

function drawPlayer() {
  const x = cx - 4, z = cz - 4;
  drawFloorPoly(x, cy + 16, z, 8, 8, "#38d6ff", "#ffffff");
  drawBoxWire(x, cy, z, 8, 16, 8, "#aef0ff", 1.8);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pulse += dt * 4;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    let dx = 0, dz = 0;
    const ms = 115 * dt;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) dz -= 1;
    if (keys.ArrowDown || keys.KeyS) dz += 1;

    if (down) {
      const pp = proj(cx, cy + 8, cz);
      const sx = mx - pp.sx, sy = my - pp.sy;
      if (Math.hypot(sx, sy) > 10) {
        // Invert oblique projection: sy ~ dz, sx ~ dx + 0.5*dz
        dz = sy;
        dx = sx - 0.5 * sy;
      }
    }

    const len = Math.hypot(dx, dz);
    if (len > 0.01) {
      const kx = Math.max(6, Math.min(MW * CW - 6, cx + (dx / len) * ms));
      const kz = Math.max(6, Math.min(MH * CH - 6, cz + (dz / len) * ms));
      const wy = getHeightWorld(cx, cz);
      let ky = getHeightWorld(kx, kz);

      // Authentic isoHau.as step-up (< 20) + drop-down + wall slide
      if (ky - wy < 20) {
        cx = kx; cy = ky; cz = kz;
      } else {
        ky = getHeightWorld(cx, kz);
        if (ky - wy < 20) { cy = ky; cz = kz; }
        else {
          ky = getHeightWorld(kx, cz);
          if (ky - wy < 20) { cx = kx; cy = ky; }
        }
      }
    }

    for (const b of beacons) {
      if (!b.done && Math.hypot(cx - b.x, cz - b.z) < 14 && Math.abs(cy - b.y) < 12) {
        b.done = true;
        score += 50;
      }
    }
    if (beacons.every(b => b.done)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6);
    }
  }

  const doneN = beacons.filter(b => b.done).length;
  document.getElementById("stat").textContent = `Balises: ${doneN}/${beacons.length} • Niv:${Math.round(cy / CHH)} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Base floor
  drawFloorPoly(0, 0, 0, MW * CW, MH * CH, "#131e36", "#2d5b7b");

  // Wireframe volumes
  for (const a of vecBox) {
    drawBoxWire(a.cx, a.cy, a.cz, a.cw, a.ch, a.cd, "rgba(56,214,255,0.28)", 1);
  }

  // Layered painter's render by height level (exact isoHau.as pattern)
  const playerLvl = Math.floor(cy / CHH);
  const lvlColors = ["#172542", "#1b3358", "#1e4270", "#225388", "#2766a3", "#2d7ec2", "#3498db", "#38d6ff"];
  for (let k = 0; k < vecFloor.length; k++) {
    for (const a of vecFloor[k]) {
      drawFloorPoly(a.cx, a.cy + a.ch, a.cz, a.cw, a.cd, lvlColors[k], "#38d6ff");
    }
    for (const b of beacons) {
      if (Math.floor(b.y / CHH) === k) {
        const bp = proj(b.x, b.y + 8 + Math.sin(pulse) * 3, b.z);
        ctx.fillStyle = b.done ? "#4ade80" : "#fde047";
        ctx.beginPath(); ctx.arc(bp.sx, bp.sy, b.done ? 5 : 7, 0, Math.PI * 2); ctx.fill();
        if (!b.done) {
          ctx.strokeStyle = "rgba(253,224,71,0.5)"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(bp.sx, bp.sy, 10 + Math.sin(pulse) * 2, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    if (k === playerLvl) drawPlayer();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "TERRASSES CONQUISES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
