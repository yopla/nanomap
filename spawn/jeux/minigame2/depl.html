<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Grappin Magnétique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "depl",
  "name": "Grappin Magnétique",
  "family": "topMouseMut",
  "icon": "🧲",
  "controls": "Déplacer la souris / doigt et maintenir appuyé pour lier et tracter les blocs proches",
  "description": "Arène zéro-gravité avec liens magnétiques multiples autour du curseur.",
  "goal": "Tracter toutes les caisses dorées dans la zone d'extraction verte au centre.",
  "fields": [
    { "key": "crateCount", "label": "Caisses dorées", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🧲 <b>Grappin Magnétique</b></span>
  <span id="stat">Caisses: 0/8 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "depl";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const EFFECT_RANGE = 76;
const ZONE = { x: 256, y: 256, r: 54 };

let mouse = { x: 256, y: 256 };
let pointerDown = false;
let wasDown = false;
let ball = { x: 256, y: 256, vx: 0, vy: 0, r: 12 };
let blocks = [];
let links = [];
let sparks = [];
let timeLeft = 40, score = 0, won = false, over = false, targetTotal = 8;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(12, Math.min(500, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(12, Math.min(500, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  pointerDown = true;
  if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
window.addEventListener("pointerup", () => { pointerDown = false; });
window.addEventListener("pointercancel", () => { pointerDown = false; });

function spawnBurst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + Math.random() * 0.3;
    const sp = 50 + Math.random() * 110;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetTotal = Math.max(3, Math.min(14, Number(custom.crateCount) || 8));
  timeLeft = 40; score = 0; won = false; over = false;
  pointerDown = false; wasDown = false;
  ball = { x: 256, y: 256, vx: 0, vy: 0, r: 12 };
  mouse = { x: 256, y: 256 };
  links = []; sparks = []; blocks = [];

  // Build grid of movable blocks around the perimeter (avoiding center zone)
  const slots = [];
  for (let gx = 1; gx <= 6; gx++) {
    for (let gy = 1; gy <= 6; gy++) {
      const px = 44 + (gx - 1) * 84;
      const py = 44 + (gy - 1) * 84;
      if (Math.hypot(px - ZONE.x, py - ZONE.y) > ZONE.r + 48) {
        slots.push({ x: px, y: py });
      }
    }
  }
  // Shuffle slots
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }
  const totalBlocks = Math.min(slots.length, targetTotal + 8);
  for (let i = 0; i < totalBlocks; i++) {
    blocks.push({
      x: slots[i].x,
      y: slots[i].y,
      vx: 0, vy: 0,
      ang: (Math.random() - 0.5) * 0.4,
      vang: 0,
      hr: 14,
      isTarget: i < targetTotal,
      done: false
    });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const stepScale = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    // Mouse joint spring on ball
    const fx = (mouse.x - ball.x) * 0.28;
    const fy = (mouse.y - ball.y) * 0.28;
    ball.vx = (ball.vx + fx * stepScale) * Math.pow(0.82, stepScale);
    ball.vy = (ball.vy + fy * stepScale) * Math.pow(0.82, stepScale);
    ball.x = Math.max(16, Math.min(496, ball.x + ball.vx * stepScale));
    ball.y = Math.max(16, Math.min(496, ball.y + ball.vy * stepScale));

    // Link creation / release (faithful to depl.as Update_Link)
    if (pointerDown && !wasDown) {
      links = [];
      for (const b of blocks) {
        if (b.done) continue;
        const d = Math.hypot(b.x - ball.x, b.y - ball.y);
        if (d <= EFFECT_RANGE) {
          links.push({ block: b, rest: Math.max(26, d) });
        }
      }
    } else if (!pointerDown && wasDown) {
      links = [];
    }
    wasDown = pointerDown;

    // Solve distance joints
    for (let iter = 0; iter < 3; iter++) {
      for (let i = links.length - 1; i >= 0; i--) {
        const lk = links[i];
        const b = lk.block;
        if (b.done) { links.splice(i, 1); continue; }
        const dx = b.x - ball.x, dy = b.y - ball.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = d - lk.rest;
        const nx = dx / d, ny = dy / d;
        const pull = diff * 0.35;
        b.x -= nx * pull;
        b.y -= ny * pull;
        b.vx -= nx * pull * 0.45;
        b.vy -= ny * pull * 0.45;
        b.vang += (nx * ball.vy - ny * ball.vx) * 0.0015;
      }
    }

    // Integrate blocks + damping (0.95 per frame)
    const damp = Math.pow(0.95, stepScale);
    for (const b of blocks) {
      if (b.done) continue;
      b.vx *= damp;
      b.vy *= damp;
      b.vang *= damp;
      b.x += b.vx * stepScale;
      b.y += b.vy * stepScale;
      b.ang += b.vang * stepScale;

      // Wall collisions
      const m = b.hr + 8;
      if (b.x < m) { b.x = m; b.vx = Math.abs(b.vx) * 0.7; }
      if (b.x > 512 - m) { b.x = 512 - m; b.vx = -Math.abs(b.vx) * 0.7; }
      if (b.y < m) { b.y = m; b.vy = Math.abs(b.vy) * 0.7; }
      if (b.y > 512 - m) { b.y = 512 - m; b.vy = -Math.abs(b.vy) * 0.7; }

      // Ball vs block collision
      const bdx = b.x - ball.x, bdy = b.y - ball.y;
      const bd = Math.hypot(bdx, bdy) || 0.001;
      const minB = b.hr + ball.r;
      if (bd < minB) {
        const nx = bdx / bd, ny = bdy / bd;
        const ov = minB - bd;
        b.x += nx * ov; b.y += ny * ov;
        b.vx += nx * ov * 0.4 + ball.vx * 0.35;
        b.vy += ny * ov * 0.4 + ball.vy * 0.35;
      }
    }

    // Block-block collisions
    for (let i = 0; i < blocks.length; i++) {
      const a = blocks[i];
      if (a.done) continue;
      for (let j = i + 1; j < blocks.length; j++) {
        const b = blocks[j];
        if (b.done) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const minD = a.hr + b.hr + 2;
        if (d < minD) {
          const nx = dx / d, ny = dy / d;
          const ov = (minD - d) * 0.5;
          a.x -= nx * ov; a.y -= ny * ov;
          b.x += nx * ov; b.y += ny * ov;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const imp = -vn * 0.75;
            a.vx -= nx * imp; a.vy -= ny * imp;
            b.vx += nx * imp; b.vy += ny * imp;
            a.vang += (Math.random() - 0.5) * 0.04;
            b.vang += (Math.random() - 0.5) * 0.04;
          }
        }
      }
    }

    // Check extraction zone
    for (const b of blocks) {
      if (b.done || !b.isTarget) continue;
      if (Math.hypot(b.x - ZONE.x, b.y - ZONE.y) < ZONE.r - 4) {
        b.done = true;
        score += 40;
        spawnBurst(b.x, b.y, "#4ade80");
      }
    }

    const doneN = blocks.filter(b => b.isTarget && b.done).length;
    if (doneN >= targetTotal) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 6);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }

  const doneN = blocks.filter(b => b.isTarget && b.done).length;
  document.getElementById("stat").textContent = `Caisses: ${doneN}/${targetTotal} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle arena border walls
  ctx.strokeStyle = "#1e3a5f";
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, 504, 504);

  // Extraction zone
  ctx.beginPath();
  ctx.arc(ZONE.x, ZONE.y, ZONE.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.14)";
  ctx.fill();
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.setLineDash([7, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(74,222,128,0.55)";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("EXTRACTION", ZONE.x, ZONE.y + 4);

  // Effect ring or active tether beams
  if (pointerDown) {
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 3;
    for (const lk of links) {
      if (lk.block.done) continue;
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      ctx.lineTo(lk.block.x, lk.block.y);
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, EFFECT_RANGE, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56,214,255,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Blocks
  for (const b of blocks) {
    if (b.done) continue;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    if (b.isTarget) {
      ctx.fillStyle = "rgba(250,204,21,0.25)";
      ctx.strokeStyle = "#fde047";
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.strokeStyle = "#64748b";
    }
    ctx.lineWidth = 2;
    ctx.fillRect(-b.hr, -b.hr, b.hr * 2, b.hr * 2);
    ctx.strokeRect(-b.hr, -b.hr, b.hr * 2, b.hr * 2);
    if (b.isTarget) {
      ctx.fillStyle = "#fde047";
      ctx.fillRect(-4, -4, 8, 8);
    }
    ctx.restore();
  }

  // Particles
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life / 0.45);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Mouse sphere
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = pointerDown ? "#38d6ff" : "rgba(56,214,255,0.35)";
  ctx.fill();
  ctx.strokeStyle = "#aef0ff";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CARGAISON EXTRAITE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
