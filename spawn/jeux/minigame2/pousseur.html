<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pousseur de Caisses (Pousseur)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pousseur",
  "name": "Pousseur de Caisses (Pousseur)",
  "family": "topOrthoClav",
  "icon": "📦",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour pousser les caisses)",
  "description": "Transfert d'élan et glissement physique de caisses de fret dans une soute.",
  "goal": "Pousser les 4 caisses cargo sur les 4 socles lumineux avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 }
  ]
}
</script>
<div class="bar">
  <span>📦 <b>Pousseur Cargo</b></span>
  <span id="stat">Caisses: 0/4 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pousseur";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, cx = 256, cy = 256, vx = 0, vy = 0;
let crates = [], pads = [];
let down = false, mx = 256, my = 256;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  cx = 256; cy = 256; vx = 0; vy = 0;
  score = 0; won = false; over = false;
  pads = [
    { x: 96,  y: 96 },
    { x: 416, y: 96 },
    { x: 96,  y: 416 },
    { x: 416, y: 416 }
  ];
  crates = [
    { cx: 185, cy: 185, vx: 0, vy: 0, docked: false },
    { cx: 327, cy: 185, vx: 0, vy: 0, docked: false },
    { cx: 185, cy: 327, vx: 0, vy: 0, docked: false },
    { cx: 327, cy: 327, vx: 0, vy: 0, docked: false }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const f = dt * 60;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Faithful pousseur.as momentum & damping
    const ms = 2.6 * f;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) vy -= ms;
    if (keys.ArrowDown || keys.KeyS) vy += ms;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) vx -= ms;
    if (keys.ArrowRight || keys.KeyD) vx += ms;
    if (down) {
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy);
      if (d > 6) { vx += (dx / d) * ms; vy += (dy / d) * ms; }
    }

    cx += vx * f; cy += vy * f;
    const pDamp = Math.pow(0.7, f);
    vx *= pDamp; vy *= pDamp;
    cx = Math.max(24, Math.min(488, cx));
    cy = Math.max(24, Math.min(488, cy));

    const kr = 16, cr = 20;
    for (const c of crates) {
      if (!(cx - kr > c.cx + cr) && !(cy - kr > c.cy + cr) && !(cx + kr < c.cx - cr) && !(cy + kr < c.cy - cr)) {
        // Momentum transfer from pousseur.as
        c.vx += vx * 1.15;
        c.vy += vy * 1.15;
        const dx = cx - c.cx, dy = cy - c.cy;
        if (Math.abs(dx) > Math.abs(dy)) cx = c.cx + Math.sign(dx || 1) * (kr + cr);
        else cy = c.cy + Math.sign(dy || 1) * (kr + cr);
        vx *= 0.2; vy *= 0.2;
      }
    }

    // Crate-to-crate momentum transfer
    for (let i = 0; i < crates.length; i++) {
      for (let j = i + 1; j < crates.length; j++) {
        const a = crates[i], b = crates[j];
        const dx = b.cx - a.cx, dy = b.cy - a.cy;
        const ox = cr * 2 - Math.abs(dx), oy = cr * 2 - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) {
            const s = Math.sign(dx || 1);
            a.cx -= s * ox * 0.5; b.cx += s * ox * 0.5;
            const avg = (a.vx + b.vx) * 0.6; a.vx = avg; b.vx = avg;
          } else {
            const s = Math.sign(dy || 1);
            a.cy -= s * oy * 0.5; b.cy += s * oy * 0.5;
            const avg = (a.vy + b.vy) * 0.6; a.vy = avg; b.vy = avg;
          }
        }
      }
    }

    const cDamp = Math.pow(0.68, f);
    for (const c of crates) {
      c.cx += c.vx * f; c.cy += c.vy * f;
      c.vx *= cDamp; c.vy *= cDamp;
      // Keep crates away from hard corners so they remain pushable
      if (c.cx < 44) { c.cx = 44; c.vx = Math.abs(c.vx) * 0.4; }
      if (c.cx > 468) { c.cx = 468; c.vx = -Math.abs(c.vx) * 0.4; }
      if (c.cy < 44) { c.cy = 44; c.vy = Math.abs(c.vy) * 0.4; }
      if (c.cy > 468) { c.cy = 468; c.vy = -Math.abs(c.vy) * 0.4; }
      c.docked = false;
    }

    let dockedCount = 0;
    for (const p of pads) {
      for (const c of crates) {
        if (!c.docked && Math.hypot(c.cx - p.x, c.cy - p.y) < 24) {
          c.docked = true; dockedCount++; break;
        }
      }
    }
    score = dockedCount * 100;
    if (dockedCount === pads.length) {
      won = true; over = true; score += Math.round(timeLeft * 12);
    }
  }

  const dockedN = crates.filter(c => c.docked).length;
  document.getElementById("stat").textContent = `Caisses: ${dockedN}/${pads.length} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Cargo bay floor grid & inner bumper line
  ctx.strokeStyle = "#18263d"; ctx.lineWidth = 1;
  for (let i = 32; i < 512; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }
  ctx.strokeStyle = "#2d5b7b66"; ctx.lineWidth = 2;
  ctx.strokeRect(24, 24, 464, 464);

  // Target docking pads
  for (const p of pads) {
    const active = crates.some(c => c.docked && Math.hypot(c.cx - p.x, c.cy - p.y) < 24);
    ctx.fillStyle = active ? "rgba(74,222,128,0.22)" : "rgba(253,224,71,0.12)";
    ctx.fillRect(p.x - 24, p.y - 24, 48, 48);
    ctx.strokeStyle = active ? "#4ade80" : "#fde047";
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - 24, p.y - 24, 48, 48);
  }

  // Crates
  for (const c of crates) {
    ctx.fillStyle = c.docked ? "#166534" : "#1e3a5f";
    ctx.fillRect(c.cx - 20, c.cy - 20, 40, 40);
    ctx.strokeStyle = c.docked ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(c.cx - 20, c.cy - 20, 40, 40);
    ctx.beginPath();
    ctx.moveTo(c.cx - 14, c.cy - 14); ctx.lineTo(c.cx + 14, c.cy + 14);
    ctx.moveTo(c.cx + 14, c.cy - 14); ctx.lineTo(c.cx - 14, c.cy + 14);
    ctx.strokeStyle = c.docked ? "#86efac88" : "#38d6ff66"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Player
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FRET ARRIMÉ !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
