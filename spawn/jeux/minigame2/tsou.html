<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Écosystème Peak (Tsou)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; gap: 6px; flex-wrap: wrap; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; image-rendering: pixelated; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
  button.active { background: #38d6ff; color: #0a0e18; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tsou",
  "name": "Écosystème Peak (Tsou)",
  "family": "zooEcosys",
  "icon": "🧬",
  "controls": "Touche 1 (Récolter Vert) / 2 (Chasser Jaune) ou Clic/Espace pour basculer",
  "description": "Simulation d'écosystème sur archipel : dirigez l'espèce rouge entre récolte végétale et chasse des rivaux jaunes.",
  "goal": "Faire survivre l'espèce rouge jusqu'à la fin du cycle (bonus si les rivaux jaunes s'éteignent).",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🧬 <b>Peak Tsou</b></span>
  <span id="stat">Mode: 🌿 Récolter • 45s</span>
  <div>
    <button id="btnMode" onclick="toggleMode()">🌿 Récolter</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "tsou";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const W = 128, H = 128, WH = W * H;
const EMPTY = -1, WATER = -2, PLANT = 0, RED = 1, YELLOW = 2, SOURCE = 255;
const DIRS = [[0,-1],[0,1],[-1,0],[1,0]];

const offCv = document.createElement("canvas");
offCv.width = W; offCv.height = H;
const offCtx = offCv.getContext("2d");
const imgData = offCtx.createImageData(W, H);

let waterVec = new Int8Array(WH);
let lifeVec = new Int8Array(WH);
let coords = new Int32Array(WH);
let heatPlant = new Int16Array(WH);
let heatYellow = new Int16Array(WH);

let counts = [0, 0, 0];
let redTarget = PLANT; // PLANT (0) = harvest, YELLOW (2) = hunt
let plantTimer = 110, redSpawnT = 3, redStarveT = 58, yelSpawnT = 3, yelStarveT = 62;
let timeLeft = 45, score = 0, won = false, over = false, yellowExtinctBonus = false;
let simAcc = 0, years = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function updateModeBtn() {
  const b = document.getElementById("btnMode");
  if (redTarget === PLANT) {
    b.textContent = "🌿 Récolter [1]";
    b.style.borderColor = "#4ade80";
    b.style.color = "#4ade80";
  } else {
    b.textContent = "⚔️ Chasser [2]";
    b.style.borderColor = "#fde047";
    b.style.color = "#fde047";
  }
}

function toggleMode() {
  if (over) return;
  redTarget = (redTarget === PLANT) ? YELLOW : PLANT;
  updateModeBtn();
}

window.addEventListener("keydown", (e) => {
  if (over) return;
  if (e.key === "1" || e.code === "ArrowLeft") { redTarget = PLANT; updateModeBtn(); }
  else if (e.key === "2" || e.code === "ArrowRight") { redTarget = YELLOW; updateModeBtn(); }
  else if (e.code === "Space") { e.preventDefault(); toggleMode(); }
});
cv.addEventListener("pointerdown", () => {
  if (over) { sendResultAndExit(won, score); return; }
  toggleMode();
});

// Toroidal smooth value noise for island/water terrain like Perlin in tsou.as
function generateTerrain() {
  const g1 = new Float32Array(64), g2 = new Float32Array(256);
  for (let i = 0; i < 64; i++) g1[i] = Math.random();
  for (let i = 0; i < 256; i++) g2[i] = Math.random();

  function sample(grid, sz, x, y) {
    const gx = x * sz / W, gy = y * sz / H;
    const x0 = Math.floor(gx) & (sz - 1), y0 = Math.floor(gy) & (sz - 1);
    const x1 = (x0 + 1) & (sz - 1), y1 = (y0 + 1) & (sz - 1);
    const tx = gx - Math.floor(gx), ty = gy - Math.floor(gy);
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = grid[y0 * sz + x0], b = grid[y0 * sz + x1];
    const c = grid[y1 * sz + x0], d = grid[y1 * sz + x1];
    return (a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy;
  }

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const n = sample(g1, 8, x, y) * 0.65 + sample(g2, 16, x, y) * 0.35;
      // Solarize band -> channels of water with connected landmass
      waterVec[y * W + x] = (Math.abs(n - 0.5) < 0.085) ? WATER : EMPTY;
    }
  }
}

function spawnCell(idx, id) {
  if (lifeVec[idx] !== EMPTY) return false;
  lifeVec[idx] = id;
  counts[id]++;
  if (id === PLANT) heatPlant[idx] = SOURCE;
  else if (id === YELLOW) heatYellow[idx] = SOURCE;
  return true;
}

function killCell(idx, id) {
  lifeVec[idx] = EMPTY;
  counts[id]--;
  if (id === PLANT) heatPlant[idx] = SOURCE - 1;
  else if (id === YELLOW) heatYellow[idx] = SOURCE - 1;
}

function updateHeat(heat) {
  let sample = heat[(H - 1) * W];
  // Horizontal sweep
  for (let y = 0; y < H; y++) {
    const row = y * W;
    const rev = (y & 1) === 1;
    if (!rev) {
      for (let x = 0; x < W; x++) {
        const prev = sample; sample = heat[row + x];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heat[row + x] = sample;
      }
    } else {
      for (let x = W - 1; x >= 0; x--) {
        const prev = sample; sample = heat[row + x];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heat[row + x] = sample;
      }
    }
  }
  // Vertical sweep
  for (let x = 0; x < W; x++) {
    const rev = (x & 1) === 1;
    if (!rev) {
      for (let y = 0; y < H; y++) {
        const k = y * W + x;
        const prev = sample; sample = heat[k];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heat[k] = sample;
      }
    } else {
      for (let y = H - 1; y >= 0; y--) {
        const k = y * W + x;
        const prev = sample; sample = heat[k];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heat[k] = sample;
      }
    }
  }
}

function stepSim() {
  if (counts[PLANT] > 0) updateHeat(heatPlant);
  if (counts[YELLOW] > 0) updateHeat(heatYellow);
  years++;

  for (let i = 0; i < WH; i++) {
    const idx = coords[i];
    const id = lifeVec[idx];
    if (id < 0) continue;
    const cx = idx & (W - 1), cy = idx >> 7;

    if (id === PLANT) {
      plantTimer--;
      if (plantTimer <= 0) {
        const d = DIRS[(Math.random() * 4) | 0];
        const nx = (cx + d[0]) & (W - 1), ny = (cy + d[1]) & (H - 1);
        if (lifeVec[ny * W + nx] === EMPTY) {
          spawnCell(ny * W + nx, PLANT);
          plantTimer = 95;
        }
      }
    } else {
      if (id === RED) {
        redStarveT--;
        if (redStarveT <= 0) { killCell(idx, RED); redStarveT = 58; continue; }
      } else {
        yelStarveT--;
        if (yelStarveT <= 0) { killCell(idx, YELLOW); yelStarveT = 62; continue; }
        if (Math.random() > 0.85) continue;
      }

      const targetId = (id === RED) ? redTarget : PLANT;
      const heat = (targetId === PLANT) ? heatPlant : heatYellow;
      let chosen = DIRS[(Math.random() * 4) | 0];

      if (counts[targetId] > 0) {
        let bestH = -999;
        let viable = [];
        for (let k = 0; k < 4; k++) {
          const d = DIRS[k];
          const nx = (cx + d[0]) & (W - 1), ny = (cy + d[1]) & (H - 1);
          const nh = heat[ny * W + nx];
          if (nh > bestH) { bestH = nh; viable = [d]; }
          else if (nh === bestH) viable.push(d);
        }
        chosen = viable[(Math.random() * viable.length) | 0];
      }

      const nx = (cx + chosen[0]) & (W - 1), ny = (cy + chosen[1]) & (H - 1);
      const nIdx = ny * W + nx;
      const nid = lifeVec[nIdx];
      if (nid === EMPTY) {
        spawnCell(nIdx, id);
        killCell(idx, id);
      } else if (nid === targetId || nid === PLANT) {
        killCell(nIdx, nid);
        spawnCell(nIdx, id);
        if (id === RED) {
          redSpawnT--;
          if (redSpawnT <= 0) redSpawnT = 3;
          else killCell(idx, RED);
        } else {
          yelSpawnT--;
          if (yelSpawnT <= 0) yelSpawnT = 3;
          else killCell(idx, YELLOW);
        }
      }
    }
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false; years = 0; simAcc = 0;
  yellowExtinctBonus = false;
  redTarget = PLANT;
  updateModeBtn();

  generateTerrain();
  lifeVec.set(waterVec);
  for (let i = 0; i < WH; i++) {
    heatPlant[i] = waterVec[i] === WATER ? WATER : 0;
    heatYellow[i] = waterVec[i] === WATER ? WATER : 0;
    coords[i] = i;
  }
  // Fisher-Yates shuffle coords
  for (let i = WH - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = coords[i]; coords[i] = coords[j]; coords[j] = t;
  }

  counts = [0, 0, 0];
  let tries = 0;
  while (counts[PLANT] < 650 && tries++ < 20000) {
    spawnCell((Math.random() * WH) | 0, PLANT);
  }
  tries = 0;
  while (counts[RED] < 18 && tries++ < 5000) {
    const x = (W / 4 + Math.random() * W / 2) | 0;
    const y = (H / 5 + Math.random() * H / 4) | 0;
    spawnCell(y * W + x, RED);
  }
  tries = 0;
  while (counts[YELLOW] < 18 && tries++ < 5000) {
    const x = (W / 4 + Math.random() * W / 2) | 0;
    const y = (H * 0.55 + Math.random() * H / 4) | 0;
    spawnCell(y * W + x, YELLOW);
  }
}

function renderMap() {
  const d = imgData.data;
  for (let i = 0; i < WH; i++) {
    const p = i << 2;
    const v = lifeVec[i];
    if (v === WATER) { d[p] = 14; d[p+1] = 36; d[p+2] = 74; d[p+3] = 255; }
    else if (v === EMPTY) { d[p] = 11; d[p+1] = 17; d[p+2] = 30; d[p+3] = 255; }
    else if (v === PLANT) { d[p] = 52; d[p+1] = 224; d[p+2] = 118; d[p+3] = 255; }
    else if (v === RED) { d[p] = 255; d[p+1] = 72; d[p+2] = 96; d[p+3] = 255; }
    else { d[p] = 253; d[p+1] = 224; d[p+2] = 71; d[p+3] = 255; }
  }
  offCtx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCv, 0, 0, 512, 512);

  // Population HUD bars at top of canvas
  ctx.fillStyle = "rgba(10,14,24,0.75)";
  ctx.fillRect(8, 8, 496, 26);
  const tot = Math.max(1, counts[PLANT] + counts[RED] + counts[YELLOW]);
  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#4ade80"; ctx.fillText(`🌿 ${counts[PLANT]}`, 18, 25);
  ctx.fillStyle = "#ff4860"; ctx.fillText(`🔴 Vous: ${counts[RED]}`, 125, 25);
  ctx.fillStyle = "#fde047"; ctx.fillText(`🟡 Rivaux: ${counts[YELLOW]}`, 260, 25);
  ctx.fillStyle = "#38d6ff"; ctx.textAlign = "right";
  ctx.fillText(redTarget === PLANT ? "Cible: 🌿" : "Cible: 🟡", 494, 25);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    simAcc += dt;
    while (simAcc >= 1 / 18) {
      simAcc -= 1 / 18;
      stepSim();
    }
    if (!yellowExtinctBonus && counts[YELLOW] === 0 && years > 5) {
      yellowExtinctBonus = true;
      score += 200;
    }
    if (counts[RED] <= 0) {
      over = true; won = false;
      score += years;
    } else if (timeLeft <= 0) {
      over = true; won = true;
      score += Math.round(years + counts[RED] * 2);
    }
  }

  document.getElementById("stat").textContent = `🔴 ${counts[RED]} • 🟡 ${counts[YELLOW]} • ${Math.ceil(timeLeft)}s`;
  renderMap();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ESPÈCE SURVIVANTE !" : "EXTINCTION !", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} (${years} cycles) — Cliquez pour revenir`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
