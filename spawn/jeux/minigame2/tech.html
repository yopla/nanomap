<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sonde Raycast (Tech)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "tech",
  "name": "Sonde Raycast (Tech)",
  "family": "sideClavSimple",
  "icon": "📡",
  "controls": "Flèches / ZQSD (déplacer & propulser sur les pentes) ou maintenir clic/doigt",
  "description": "Déplacement par capteurs laser sur segments inclinés et rampes inspiré de tech.as.",
  "goal": "Collecter les 8 nœuds de données tout en évitant les drones patrouilleurs.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 }
  ]
}
</script>
<div class="bar">
  <span>📡 <b>Sonde Tech</b></span>
  <span id="stat">Nœuds: 0/8 • ♥3 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "tech";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let lines = [], nodes = [], drones = [], rays = [];
let cx = 256, cy = 220, vx = 0, vy = 0, fakex = 256, fakey = 220;
let h = 24, air = 0;
let collected = 0, lives = 3, invuln = 0;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => { const pt = getPos(e); mx = pt.x; my = pt.y; });
window.addEventListener("pointerup", () => { down = false; });

function makeLine(ax, ay, bx, by) {
  const mx_ = ax + (bx - ax) * 0.5;
  const my_ = ay + (by - ay) * 0.5;
  const dx = ax - bx, dy = ay - by;
  const mag = Math.hypot(dx, dy) || 0.0001;
  return { ax, ay, bx, by, cx: mx_, cy: my_, nx: -(dy / mag), ny: dx / mag };
}

function lineLineInter(v0x, v0y, v1x, v1y, v2x, v2y, v3x, v3y) {
  const bot = (v3y - v2y) * (v1x - v0x) - (v3x - v2x) * (v1y - v0y);
  if (bot === 0) return 999;
  const ua = ((v3x - v2x) * (v0y - v2y) - (v3y - v2y) * (v0x - v2x)) / bot;
  const ub = ((v1x - v0x) * (v0y - v2y) - (v1y - v0y) * (v0x - v2x)) / bot;
  if (ua > 1 || ua < 0 || ub > 1 || ub < 0) return 999;
  return ua;
}

function calcClose(x1, y1, x2, y2) {
  let dist = 999;
  for (const a of lines) {
    const t = lineLineInter(x1, y1, x2, y2, a.ax, a.ay, a.bx, a.by);
    if (t < dist) dist = t;
  }
  if (dist >= 0 && dist <= 1) {
    return { hit: true, px: x1 + (x2 - x1) * dist, py: y1 + (y2 - y1) * dist };
  }
  return { hit: false, px: x2, py: y2 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  cx = 256; cy = 220; vx = 0; vy = 0; fakex = cx; fakey = cy; air = 0;
  collected = 0; lives = 3; invuln = 0;
  score = 0; won = false; over = false;

  // Sloped cavern geometry (inspired by tech.as XLine segments)
  lines = [
    makeLine(20, 20, 492, 20),
    makeLine(20, 492, 492, 492),
    makeLine(20, 20, 20, 492),
    makeLine(492, 20, 492, 492),
    // Bottom sloped ramps
    makeLine(20, 370, 185, 492),
    makeLine(327, 492, 492, 370),
    // Mid platforms & angled ledges
    makeLine(140, 325, 372, 325),
    makeLine(20, 225, 165, 195),
    makeLine(347, 195, 492, 225),
    // Upper central bridge
    makeLine(175, 115, 337, 115)
  ];

  nodes = [
    { x: 65, y: 340, taken: false },
    { x: 447, y: 340, taken: false },
    { x: 256, y: 452, taken: false },
    { x: 256, y: 288, taken: false },
    { x: 75, y: 165, taken: false },
    { x: 437, y: 165, taken: false },
    { x: 256, y: 78, taken: false },
    { x: 70, y: 65, taken: false }
  ];

  drones = [
    { x: 160, y: 260, minX: 90, maxX: 420, vx: 95, r: 12 },
    { x: 350, y: 150, minX: 110, maxX: 400, vx: -105, r: 12 }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    let bGround = false;
    if (vy < 0) air = 1;
    if (vy >= 0 && air <= 0) {
      const rG = calcClose(cx, cy - 12, cx, cy + 280);
      if (rG.hit && cy > rG.py - h - 14) bGround = true;
    }

    vy += 0.36 * f;

    const lt = keys.ArrowLeft || keys.KeyA || keys.KeyQ;
    const rt = keys.ArrowRight || keys.KeyD;
    const up = keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space;
    const dn = keys.ArrowDown || keys.KeyS;

    if (lt) vx -= 0.72 * f;
    if (rt) vx += 0.72 * f;
    if (up) vy -= 0.85 * f;
    if (dn) vy += 0.65 * f;

    if (down) {
      const dx = mx - cx, dy = my - cy;
      vx += Math.max(-0.75, Math.min(0.75, dx * 0.015)) * f;
      vy += Math.max(-0.9, Math.min(0.75, dy * 0.015)) * f;
    }

    // Direct motion ray check
    if (calcClose(cx, cy, cx + vx * f, cy + vy * f).hit) {
      vx *= 0.2;
      vy *= 0.2;
    }

    const damp = Math.pow(0.92, f);
    vx *= damp;
    vy *= damp;

    // 4-way raycast sensors (faithful to tech.as)
    rays = [];
    const rUp = calcClose(cx, cy, cx, cy - 220);
    rays.push({ x1: cx, y1: cy, x2: rUp.px, y2: rUp.py, hit: rUp.hit });
    if (rUp.hit && vy < 0 && cy < rUp.py + 16) { vy = 0; cy = rUp.py + 16; }

    const rDn = calcClose(cx, cy, cx, cy + 220);
    rays.push({ x1: cx, y1: cy, x2: rDn.px, y2: rDn.py, hit: rDn.hit });
    if (rDn.hit && vy > 0 && cy > rDn.py - h) { vy = 0; cy = rDn.py - h; air = 0; }

    const rLt = calcClose(cx, cy, cx - 72, cy);
    rays.push({ x1: cx, y1: cy, x2: rLt.px, y2: rLt.py, hit: rLt.hit });
    if (rLt.hit && vx < 0 && Math.abs(cx + vx * f - rLt.px) < 16) vx = 0;

    const rRt = calcClose(cx, cy, cx + 72, cy);
    rays.push({ x1: cx, y1: cy, x2: rRt.px, y2: rRt.py, hit: rRt.hit });
    if (rRt.hit && vx > 0 && Math.abs(cx + vx * f - rRt.px) < 16) vx = 0;

    cx = Math.max(34, Math.min(478, cx + vx * f));
    cy = Math.max(34, Math.min(478, cy + vy * f));

    // Slope snapping
    if (vy >= 0 && bGround) {
      const rS = calcClose(cx, cy, cx, cy + 220);
      if (rS.hit && Math.abs(cy - rS.py) < 52) {
        vx *= Math.pow(0.92, f);
        cy = rS.py - h;
        vy = 0;
      } else {
        air = 1;
      }
    }

    if (bGround) {
      fakex += (cx - fakex) * 0.5;
      fakey += (cy - fakey) * 0.35;
    } else {
      fakex = cx;
      fakey = cy;
    }

    // Collect data nodes
    for (const n of nodes) {
      if (!n.taken && Math.hypot(cx - n.x, cy - n.y) < 24) {
        n.taken = true;
        collected++;
        score += 65;
      }
    }

    // Drones
    for (const d of drones) {
      d.x += d.vx * dt;
      if (d.x < d.minX || d.x > d.maxX) {
        d.vx *= -1;
        d.x = Math.max(d.minX, Math.min(d.maxX, d.x));
      }
      if (invuln <= 0 && Math.hypot(cx - d.x, cy - d.y) < d.r + 14) {
        lives--;
        invuln = 1.2;
        score = Math.max(0, score - 25);
        vx = (cx < d.x ? -4 : 4);
        vy = -3;
        if (lives <= 0) { over = true; won = false; }
      }
    }

    if (collected >= nodes.length) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 8) + lives * 40;
    }
  }

  document.getElementById("stat").textContent = `Nœuds: ${collected}/${nodes.length} • ♥${lives} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // XLine segments & normals
  for (const a of lines) {
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(a.ax, a.ay); ctx.lineTo(a.bx, a.by); ctx.stroke();
    ctx.strokeStyle = "rgba(56,214,255,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.cx, a.cy); ctx.lineTo(a.cx + a.nx * 7, a.cy + a.ny * 7); ctx.stroke();
  }

  // 4-way raycast laser sensors
  for (const r of rays) {
    ctx.strokeStyle = r.hit ? "rgba(253,224,71,0.45)" : "rgba(56,214,255,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();
    if (r.hit) {
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(r.x2, r.y2, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Data nodes
  for (const n of nodes) {
    if (n.taken) continue;
    const p = 8 + Math.sin(now / 180 + n.x) * 2;
    ctx.fillStyle = "rgba(74,222,128,0.22)";
    ctx.beginPath(); ctx.arc(n.x, n.y, p + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.beginPath(); ctx.arc(n.x, n.y, p, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Drones
  for (const d of drones) {
    ctx.fillStyle = "rgba(248,113,113,0.22)";
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fecaca";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Player probe
  const blink = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
  if (!blink) {
    ctx.fillStyle = "#0ea5e9";
    ctx.beginPath(); ctx.arc(fakex, fakey, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(fakex, fakey, 4, 0, Math.PI * 2); ctx.fill();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TOUS LES NŒUDS CAPTURÉS !" : (lives <= 0 ? "SONDE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
