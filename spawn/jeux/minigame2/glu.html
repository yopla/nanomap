<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Cellule Gluante (Glu)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "glu",
  "name": "Cellule Gluante (Glu)",
  "family": "topOrthoClav",
  "icon": "🦠",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour diriger la cellule)",
  "description": "Pilotez une cellule à membrane élastique déformable dans une boîte de Pétri.",
  "goal": "Absorber les 12 spores dorées en évitant les toxines rouges.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🦠 <b>Cellule Glu</b></span>
  <span id="stat">Spores: 0/12 • ♥♥♥ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "glu";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let theX = 256, theY = 256, xMove = 0, yMove = 0;
let cellRadius = 32;
const membraneDetail = 20;
let membrane = [];
let spores = [], toxins = [], particles = [];
let hp = 3, invuln = 0, timeLeft = 45, score = 0, won = false, over = false, collected = 0;
const TOTAL_SPORES = 12;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; const p = getPos(e); mx = p.x; my = p.y;
});
cv.addEventListener("pointermove", (e) => { const p = getPos(e); mx = p.x; my = p.y; });
window.addEventListener("pointerup", () => { down = false; });

function spawnSpore() {
  for (let tries = 0; tries < 40; tries++) {
    const x = 36 + Math.random() * 440;
    const y = 36 + Math.random() * 440;
    if (Math.hypot(x - theX, y - theY) > 75) return { x, y, phase: Math.random() * 6.28 };
  }
  return { x: 60 + Math.random() * 392, y: 60 + Math.random() * 392, phase: 0 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  theX = 256; theY = 256; xMove = 0; yMove = 0;
  cellRadius = 30;
  hp = 3; invuln = 0; score = 0; collected = 0; won = false; over = false;
  membrane = [];
  for (let i = 0; i < membraneDetail; i++) {
    const ang = (i / membraneDetail) * Math.PI * 2;
    membrane.push({
      x: theX + cellRadius * Math.cos(ang),
      y: theY + cellRadius * Math.sin(ang),
      vx: 0, vy: 0
    });
  }
  spores = [];
  for (let i = 0; i < 4; i++) spores.push(spawnSpore());
  toxins = [];
  const corners = [[70, 70], [442, 70], [70, 442], [442, 442]];
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 75 + i * 14;
    toxins.push({ x: corners[i][0], y: corners[i][1], vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 14, rot: 0 });
  }
  particles = [];
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, color });
  }
}

let last = performance.now();
let accum = 0;
const STEP = 1 / 60;

function stepPhysics() {
  const theSpeed = 1.65;
  const wallBounce = 1.4;
  let left = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ);
  let right = !!(keys.ArrowRight || keys.KeyD);
  let up = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ);
  let downK = !!(keys.ArrowDown || keys.KeyS);

  if (left && !right) {
    if (up) { xMove -= theSpeed * 0.7; yMove -= theSpeed * 0.7; }
    else if (downK) { xMove -= theSpeed * 0.7; yMove += theSpeed * 0.7; }
    else xMove -= theSpeed;
  } else if (right && !left) {
    if (up) { xMove += theSpeed * 0.7; yMove -= theSpeed * 0.7; }
    else if (downK) { xMove += theSpeed * 0.7; yMove += theSpeed * 0.7; }
    else xMove += theSpeed;
  } else if (up && !downK) {
    yMove -= theSpeed;
  } else if (downK && !up) {
    yMove += theSpeed;
  }

  if (down) {
    const dx = mx - theX, dy = my - theY;
    const d = Math.hypot(dx, dy);
    if (d > 8) {
      const f = Math.min(1, d / 40) * theSpeed;
      xMove += (dx / d) * f;
      yMove += (dy / d) * f;
    }
  }

  xMove *= 0.84;
  yMove *= 0.84;
  theX += xMove;
  theY += yMove;

  if (theX < 10) { xMove = 0; theX = 10; }
  if (theX > 502) { xMove = 0; theX = 502; }
  if (theY < 10) { yMove = 0; theY = 10; }
  if (theY > 502) { yMove = 0; theY = 502; }

  if (theX < cellRadius * 0.75) xMove += wallBounce;
  if (theX > 512 - cellRadius * 0.75) xMove -= wallBounce;
  if (theY < cellRadius * 0.75) yMove += wallBounce;
  if (theY > 512 - cellRadius * 0.75) yMove -= wallBounce;

  // Authentic glu.as deformable spring membrane physics
  for (let i = 0; i < membrane.length; i++) {
    const m = membrane[i];
    const ang = (i / membraneDetail) * Math.PI * 2;
    const tempX = theX + cellRadius * Math.cos(ang);
    const tempY = theY + cellRadius * Math.sin(ang);

    const a = m.x - theX;
    const b = m.y - theY;
    const c = Math.max(12, Math.hypot(a, b));

    m.vx -= (m.x - tempX) / (c / 4.2);
    m.vy -= (m.y - tempY) / (c / 4.2);

    m.vx *= 0.86;
    m.vy *= 0.86;

    m.x -= ((m.x - tempX) / 3.2) - m.vx * 0.35;
    m.y -= ((m.y - tempY) / 3.2) - m.vy * 0.35;

    if (m.x < 5) { m.x = 5; m.vx = 0; }
    if (m.x > 507) { m.x = 507; m.vx = 0; }
    if (m.y < 5) { m.y = 5; m.vy = 0; }
    if (m.y > 507) { m.y = 507; m.vy = 0; }
  }
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    accum += dt;
    while (accum >= STEP) { stepPhysics(); accum -= STEP; }

    for (let i = spores.length - 1; i >= 0; i--) {
      const s = spores[i];
      s.phase += dt * 4;
      if (Math.hypot(s.x - theX, s.y - theY) < cellRadius + 6) {
        burst(s.x, s.y, "#fde047", 10);
        spores.splice(i, 1);
        collected++;
        score += 30;
        cellRadius = Math.min(44, 30 + collected * 1.1);
        // Ripple membrane outward on absorption
        for (const m of membrane) {
          const dx = m.x - theX, dy = m.y - theY, d = Math.max(1, Math.hypot(dx, dy));
          m.vx += (dx / d) * 3.5; m.vy += (dy / d) * 3.5;
        }
        if (collected >= TOTAL_SPORES) {
          won = true; over = true;
          score += Math.round(timeLeft * 6) + hp * 25;
        } else if (collected + spores.length < TOTAL_SPORES) {
          spores.push(spawnSpore());
        }
      }
    }

    for (const t of toxins) {
      t.x += t.vx * dt; t.y += t.vy * dt; t.rot += dt * 2.5;
      if (t.x < t.r + 6) { t.x = t.r + 6; t.vx = Math.abs(t.vx); }
      if (t.x > 506 - t.r) { t.x = 506 - t.r; t.vx = -Math.abs(t.vx); }
      if (t.y < t.r + 6) { t.y = t.r + 6; t.vy = Math.abs(t.vy); }
      if (t.y > 506 - t.r) { t.y = 506 - t.r; t.vy = -Math.abs(t.vy); }

      const dist = Math.hypot(t.x - theX, t.y - theY);
      if (dist < cellRadius * 0.72 + t.r && invuln <= 0) {
        hp--; invuln = 1.2;
        const dx = (theX - t.x) / Math.max(1, dist), dy = (theY - t.y) / Math.max(1, dist);
        xMove += dx * 10; yMove += dy * 10;
        burst(t.x, t.y, "#f87171", 14);
        if (hp <= 0) { over = true; won = false; }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  const hearts = "♥".repeat(Math.max(0, hp)) + "♡".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Spores: ${collected}/${TOTAL_SPORES} • ${hearts} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = "rgba(56,214,255,0.08)"; ctx.lineWidth = 1;
  for (let g = 32; g < 512; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  // Spores
  for (const s of spores) {
    const r = 7 + Math.sin(s.phase) * 2;
    ctx.fillStyle = "rgba(253,224,71,0.22)";
    ctx.beginPath(); ctx.arc(s.x, s.y, r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Toxins
  for (const t of toxins) {
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.rot);
    ctx.fillStyle = "#ef4444"; ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const rad = (k % 2 === 0) ? t.r + 3 : t.r - 5;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Deformable Cell Membrane
  const flash = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
  ctx.beginPath();
  for (let i = 0; i < membrane.length; i++) {
    const curr = membrane[i];
    const next = membrane[(i + 1) % membrane.length];
    const midX = (curr.x + next.x) * 0.5;
    const midY = (curr.y + next.y) * 0.5;
    if (i === 0) {
      const prev = membrane[membrane.length - 1];
      ctx.moveTo((prev.x + curr.x) * 0.5, (prev.y + curr.y) * 0.5);
    }
    ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
  }
  ctx.closePath();
  ctx.fillStyle = flash ? "rgba(248,113,113,0.32)" : "rgba(56,214,255,0.24)";
  ctx.fill();
  ctx.strokeStyle = flash ? "#f87171" : "#38d6ff";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Jittery nucleus (signature glu.as detail)
  const jx = (Math.random() - 0.5) * 4;
  const jy = (Math.random() - 0.5) * 4;
  ctx.fillStyle = flash ? "#fca5a5" : "#4ade80";
  ctx.beginPath(); ctx.arc(theX + xMove * 0.6 + jx, theY + yMove * 0.6 + jy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CELLULE NOURRIE !" : "CELLULE DÉTRUITE / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
