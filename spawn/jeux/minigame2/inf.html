<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Tore Infini</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "inf",
  "name": "Tore Infini",
  "family": "topMouseMut",
  "icon": "🌌",
  "controls": "Déplacer la souris / doigt loin du centre pour piloter dans le monde torique sans couture",
  "description": "Exploration d'un secteur 3×3 en boucle infinie avec mini-carte et balises directionnelles.",
  "goal": "Activer toutes les balises dorées puis rejoindre la zone verte d'extraction.",
  "fields": [
    { "key": "beaconCount", "label": "Balises à activer", "type": "number", "default": 6 }
  ]
}
</script>
<div class="bar">
  <span>🌌 <b>Tore Infini</b></span>
  <span id="stat">Balises: 0/6 • ♥3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "inf";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const SCR_W = 512, SCR_H = 512;
const WORLD_W = SCR_W * 3, WORLD_H = SCR_H * 3;
const ZONE = { x: WORLD_W - 220, y: WORLD_H - 220, w: 280, h: 280 };

let mouse = { x: 256, y: 256 };
let cx = 320, cy = 240, vx = 0, vy = 0, camx = 64, camy = 0;
let nodes = [], beacons = [], hazards = [];
let lives = 3, invuln = 0, timeLeft = 45, score = 0, won = false, over = false, beaconTotal = 6;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

// Faithful toroidal math from inf.as
function getScrx(wx) {
  if (camx > WORLD_W - SCR_W && wx < SCR_W) return (wx - camx) + WORLD_W;
  if (camx < SCR_W && wx > WORLD_W - SCR_W) return (wx - WORLD_W) - camx;
  return wx - camx;
}
function getScry(wy) {
  if (camy > WORLD_H - SCR_H && wy < SCR_H) return (wy - camy) + WORLD_H;
  if (camy < SCR_H && wy > WORLD_H - SCR_H) return (wy - WORLD_H) - camy;
  return wy - camy;
}
function wrapDelta(a, b, size) {
  let d = b - a;
  if (d > size * 0.5) d -= size;
  if (d < -size * 0.5) d += size;
  return d;
}
function torusDist(ax, ay, bx, by) {
  return Math.hypot(wrapDelta(ax, bx, WORLD_W), wrapDelta(ay, by, WORLD_H));
}
function getAng(ax, ay, bx, by) {
  return Math.atan2(wrapDelta(ay, by, WORLD_H), wrapDelta(ax, bx, WORLD_W));
}
function isOver(ax, ay, aw, ah, bx, by, bw, bh) {
  const wh = WORLD_W * 0.5, hh = WORLD_H * 0.5;
  if (ax - bx > wh) ax -= WORLD_W;
  if (bx - ax > wh) bx -= WORLD_W;
  if (ay - by > hh) ay -= WORLD_H;
  if (by - ay > hh) by -= WORLD_H;
  if (ax + aw < bx || ay + ah < by || bx + bw < ax || by + bh < ay) return false;
  return true;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  beaconTotal = Math.max(3, Math.min(12, Number(custom.beaconCount) || 6));
  cx = 400; cy = 400; vx = 0; vy = 0;
  camx = cx - SCR_W * 0.5; camy = cy - SCR_H * 0.5;
  mouse = { x: 256, y: 256 };
  lives = 3; invuln = 1.0; timeLeft = 45; score = 0; won = false; over = false;

  // Ambient directional relay nodes (from inf.as loop)
  nodes = [];
  let ax = 30, ay = 50;
  for (let i = 0; i < 48; i++) {
    ax += 264;
    if (ax > WORLD_W) { ax -= WORLD_W; ay += 185; if (ay > WORLD_H) ay = 50; }
    nodes.push({ x: ax, y: ay });
  }

  // Beacons
  beacons = [];
  for (let i = 0; i < beaconTotal; i++) {
    let bx, by;
    do {
      bx = 80 + Math.random() * (WORLD_W - 160);
      by = 80 + Math.random() * (WORLD_H - 160);
    } while (torusDist(bx, by, cx, cy) < 220);
    beacons.push({ x: bx, y: by, active: false });
  }

  // Drifting red anomalies
  hazards = [];
  for (let i = 0; i < 6; i++) {
    let hx, hy;
    do {
      hx = Math.random() * WORLD_W;
      hy = Math.random() * WORLD_H;
    } while (torusDist(hx, hy, cx, cy) < 280);
    const a = Math.random() * Math.PI * 2;
    hazards.push({ x: hx, y: hy, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, r: 16 });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const sc = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Edge / offset steering faithful to inf.as
    const edge = 170, ps = 7.5;
    if (mouse.x < edge) vx = -ps * (1 - mouse.x / edge * 0.45);
    else if (mouse.x > SCR_W - edge) vx = ps * (1 - (SCR_W - mouse.x) / edge * 0.45);
    else vx *= Math.pow(0.88, sc);

    if (mouse.y < edge) vy = -ps * (1 - mouse.y / edge * 0.45);
    else if (mouse.y > SCR_H - edge) vy = ps * (1 - (SCR_H - mouse.y) / edge * 0.45);
    else vy *= Math.pow(0.88, sc);

    cx += vx * sc;
    cy += vy * sc;
    if (cx > WORLD_W) { cx -= WORLD_W; camx -= WORLD_W; }
    if (cx < 0) { cx += WORLD_W; camx += WORLD_W; }
    if (cy > WORLD_H) { cy -= WORLD_H; camy -= WORLD_H; }
    if (cy < 0) { cy += WORLD_H; camy += WORLD_H; }

    camx += ((cx - SCR_W * 0.5) - camx) * 0.2 * sc;
    camy += ((cy - SCR_H * 0.5) - camy) * 0.2 * sc;

    // Beacons
    for (const b of beacons) {
      if (!b.active && torusDist(cx, cy, b.x, b.y) < 30) {
        b.active = true;
        score += 45;
      }
    }

    // Hazards
    for (const h of hazards) {
      h.x = (h.x + h.vx * sc + WORLD_W) % WORLD_W;
      h.y = (h.y + h.vy * sc + WORLD_H) % WORLD_H;
      if (invuln <= 0 && torusDist(cx, cy, h.x, h.y) < h.r + 14) {
        lives--;
        invuln = 1.1;
        if (lives <= 0) over = true;
      }
    }

    // Check extraction zone once all beacons active
    const allActive = beacons.every(b => b.active);
    if (allActive && isOver(cx, cy, 4, 4, ZONE.x, ZONE.y, ZONE.w, ZONE.h)) {
      won = true;
      over = true;
      score += 80 + Math.round(timeLeft * 5);
    }
  }

  const doneN = beacons.filter(b => b.active).length;
  const allActive = doneN >= beaconTotal;
  document.getElementById("stat").textContent = allActive
    ? `PORTAIL OUVERT ! • ♥${lives} • ${Math.ceil(timeLeft)}s`
    : `Balises: ${doneN}/${beaconTotal} • ♥${lives} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle scrolling grid
  ctx.strokeStyle = "rgba(56,214,255,0.07)";
  ctx.lineWidth = 1;
  const ox = -((camx % 64) + 64) % 64;
  const oy = -((camy % 64) + 64) % 64;
  for (let x = ox; x < 512; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke(); }
  for (let y = oy; y < 512; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke(); }

  // Wrapping extraction zone (from inf.as)
  const zsx = getScrx(ZONE.x), zsy = getScry(ZONE.y);
  const inZone = isOver(cx, cy, 4, 4, ZONE.x, ZONE.y, ZONE.w, ZONE.h);
  ctx.fillStyle = allActive
    ? (inZone ? "rgba(74,222,128,0.35)" : "rgba(74,222,128,0.16)")
    : "rgba(100,116,139,0.08)";
  ctx.strokeStyle = allActive ? "#4ade80" : "#334155";
  ctx.lineWidth = 2.5;
  ctx.fillRect(zsx, zsy, ZONE.w, ZONE.h);
  ctx.strokeRect(zsx, zsy, ZONE.w, ZONE.h);
  ctx.fillStyle = allActive ? "#4ade80" : "#64748b";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(allActive ? "PORTAIL D'EXTRACTION" : "ZONE VERROUILLÉE", zsx + ZONE.w * 0.5, zsy + ZONE.h * 0.5);

  // Ambient compass nodes (pointing toward player, faithful to inf.as)
  ctx.strokeStyle = "rgba(56,214,255,0.35)";
  ctx.lineWidth = 1.5;
  for (const n of nodes) {
    const sx = getScrx(n.x), sy = getScry(n.y);
    if (sx < -24 || sx > 536 || sy < -24 || sy > 536) continue;
    ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.stroke();
    const ang = getAng(n.x, n.y, cx, cy);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(ang) * 14, sy + Math.sin(ang) * 14); ctx.stroke();
  }

  // Beacons
  for (const b of beacons) {
    if (b.active) continue;
    const sx = getScrx(b.x), sy = getScry(b.y);
    if (sx < -30 || sx > 542 || sy < -30 || sy > 542) continue;
    ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(250,204,21,0.22)"; ctx.fill();
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#fde047"; ctx.fill();
  }

  // Hazards
  for (const h of hazards) {
    const sx = getScrx(h.x), sy = getScry(h.y);
    if (sx < -30 || sx > 542 || sy < -30 || sy > 542) continue;
    ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(248,113,113,0.28)"; ctx.fill();
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // Nearest objective compass arrow around player
  let targetX = ZONE.x + ZONE.w * 0.5, targetY = ZONE.y + ZONE.h * 0.5, targetCol = "#4ade80";
  if (!allActive) {
    let bestD = Infinity;
    for (const b of beacons) {
      if (b.active) continue;
      const d = torusDist(cx, cy, b.x, b.y);
      if (d < bestD) { bestD = d; targetX = b.x; targetY = b.y; targetCol = "#fde047"; }
    }
  }
  const px = cx - camx, py = cy - camy;
  const gAng = getAng(cx, cy, targetX, targetY);
  ctx.save();
  ctx.translate(px + Math.cos(gAng) * 32, py + Math.sin(gAng) * 32);
  ctx.rotate(gAng);
  ctx.fillStyle = targetCol;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -5); ctx.lineTo(-5, 5); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Player
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(56,214,255,0.28)"; ctx.fill();
    ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // Minimap (top-left, faithful to inf.as)
  const ms = 12;
  const mw = WORLD_W / ms, mh = WORLD_H / ms;
  ctx.fillStyle = "rgba(10,14,24,0.82)";
  ctx.fillRect(10, 10, mw, mh);
  ctx.strokeStyle = "#2d5b7b";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(10, 10, mw, mh);
  // Zone on minimap
  ctx.fillStyle = allActive ? "rgba(74,222,128,0.45)" : "rgba(100,116,139,0.25)";
  ctx.fillRect(10 + ZONE.x / ms, 10 + ZONE.y / ms, ZONE.w / ms, ZONE.h / ms);
  // Camera box
  const cmx = ((camx % WORLD_W) + WORLD_W) % WORLD_W;
  const cmy = ((camy % WORLD_H) + WORLD_H) % WORLD_H;
  ctx.strokeStyle = "rgba(56,214,255,0.5)";
  ctx.lineWidth = 1;
  ctx.strokeRect(10 + cmx / ms, 10 + cmy / ms, SCR_W / ms, SCR_H / ms);
  // Beacons on minimap
  for (const b of beacons) {
    if (b.active) continue;
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(10 + b.x / ms, 10 + b.y / ms, 3, 0, Math.PI * 2); ctx.fill();
  }
  // Hazards on minimap
  for (const h of hazards) {
    ctx.fillStyle = "#f87171";
    ctx.fillRect(10 + h.x / ms - 1.5, 10 + h.y / ms - 1.5, 3, 3);
  }
  // Player on minimap
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(10 + cx / ms, 10 + cy / ms, 3.5, 0, Math.PI * 2); ctx.fill();

  // Cursor dot
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(174,240,255,0.7)"; ctx.lineWidth = 1.5; ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEUR CARTOGRAPHIÉ !" : (lives <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
