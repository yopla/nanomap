<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Marche Insecte (MarcheBug)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "marchebug",
  "name": "Marche Insecte (MarcheBug)",
  "family": "clavDir",
  "icon": "🪲",
  "controls": "Flèches / ZQSD (Haut/Bas marcher, Gauche/Droite tourner) ou maintenir clic/doigt",
  "description": "Locomotion procédurale bipède pas-à-pas inspirée du prototype AS3 marcheBug.",
  "goal": "Collecter les 10 spores lumineuses en évitant les mines énergétiques.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🪲 <b>MarcheBug</b></span>
  <span id="stat">Spores: 0/10 • ♥3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "marchebug";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let cx = 256, cy = 256, ang = 0;
let x0 = 256, y0 = 256, x1 = 288, y1 = 256, x2 = 256, y2 = 256;
let wx = 256, wy = 256, u = 0, ts = 0;
let spores = [], mines = [], trail = [];
let collected = 0, totalSpores = 10, lives = 3, invuln = 0;
let timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => { const pt = getPos(e); mx = pt.x; my = pt.y; });
window.addEventListener("pointerup", () => { down = false; });

function normAng(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function spawnSporesAndMines() {
  spores = [];
  mines = [];
  for (let i = 0; i < totalSpores; i++) {
    let sx, sy, tries = 0;
    do {
      sx = 48 + Math.random() * 416;
      sy = 48 + Math.random() * 416;
      tries++;
    } while (tries < 40 && Math.hypot(sx - 256, sy - 256) < 75);
    spores.push({ x: sx, y: sy, taken: false, phase: Math.random() * Math.PI * 2 });
  }
  const mineCount = 5;
  for (let i = 0; i < mineCount; i++) {
    const a = (i / mineCount) * Math.PI * 2 + 0.4;
    const dist = 130 + (i % 2) * 55;
    mines.push({
      x: 256 + Math.cos(a) * dist,
      y: 256 + Math.sin(a) * dist,
      vx: Math.cos(a + 1.57) * (24 + (i % 3) * 10),
      vy: Math.sin(a + 1.57) * (24 + (i % 3) * 10),
      r: 12,
      phase: Math.random() * 6.28
    });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  cx = 256; cy = 256; ang = -Math.PI / 2;
  x0 = 256; y0 = 256;
  x1 = x0 + Math.cos(ang) * 32;
  y1 = y0 + Math.sin(ang) * 32;
  x2 = 256; y2 = 256;
  wx = 256; wy = 256;
  u = 0; ts = 0;
  collected = 0; lives = 3; invuln = 0;
  score = 0; won = false; over = false;
  trail = [];
  spawnSporesAndMines();
}

function clampBug() {
  const pad = 22;
  let dx = 0, dy = 0;
  if (cx < pad) dx = pad - cx;
  if (cx > 512 - pad) dx = 512 - pad - cx;
  if (cy < pad) dy = pad - cy;
  if (cy > 512 - pad) dy = 512 - pad - cy;
  if (dx !== 0 || dy !== 0) {
    cx += dx; cy += dy;
    x0 += dx; y0 += dy;
    x1 += dx; y1 += dy;
    x2 += dx; y2 += dy;
    wx += dx; wy += dy;
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    let ms = 0;
    const up = keys.ArrowUp || keys.KeyW || keys.KeyZ;
    const dn = keys.ArrowDown || keys.KeyS;
    const lt = keys.ArrowLeft || keys.KeyA || keys.KeyQ;
    const rt = keys.ArrowRight || keys.KeyD;

    if (up) ms = 0.11 * f;
    if (dn) ms = -0.11 * f;
    if (lt) ang -= 0.095 * f;
    if (rt) ang += 0.095 * f;

    if (down) {
      const targetAng = Math.atan2(my - cy, mx - cx);
      const diff = normAng(targetAng - ang);
      ang += Math.max(-0.12 * f, Math.min(0.12 * f, diff * 0.25 * f));
      if (Math.hypot(mx - cx, my - cy) > 16) ms = 0.11 * f;
    }

    u += ms;
    x1 = x0 + Math.cos(ang) * 32;
    y1 = y0 + Math.sin(ang) * 32;
    wx = x0 + (x1 - x0) * u;
    wy = y0 + (y1 - y0) * u;
    cx = wx + (x2 - wx) * 0.5;
    cy = wy + (y2 - wy) * 0.5;

    if (u >= 1.0) {
      u -= 1.0;
      x2 = x1; y2 = y1;
      const nx = Math.cos(ang) * 16;
      const ny = Math.sin(ang) * 16;
      x1 = cx + (ts === 1 ? -ny : ny);
      y1 = cy + (ts === 1 ? nx : -nx);
      x0 = x1; y0 = y1;
      x1 += Math.cos(ang) * 32;
      y1 += Math.sin(ang) * 32;
      ts = ts === 1 ? 0 : 1;
      trail.push({ x: x2, y: y2, a: 0.7 });
      if (trail.length > 28) trail.shift();
    }
    if (u < 0) {
      u += 1.0;
      x2 = x0; y2 = y0;
      const nx = Math.cos(ang) * 16;
      const ny = Math.sin(ang) * 16;
      x1 = cx + (ts === 1 ? -ny : ny);
      y1 = cy + (ts === 1 ? nx : -nx);
      x0 = x1; y0 = y1;
      x0 -= Math.cos(ang) * 16;
      y0 -= Math.sin(ang) * 16;
      ts = ts === 1 ? 0 : 1;
      trail.push({ x: x2, y: y2, a: 0.7 });
      if (trail.length > 28) trail.shift();
    }
    clampBug();

    for (const s of spores) {
      s.phase += dt * 4;
      if (!s.taken && Math.hypot(cx - s.x, cy - s.y) < 22) {
        s.taken = true;
        collected++;
        score += 50;
      }
    }

    for (const m of mines) {
      m.phase += dt * 5;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x < 24 || m.x > 488) { m.vx *= -1; m.x = Math.max(24, Math.min(488, m.x)); }
      if (m.y < 24 || m.y > 488) { m.vy *= -1; m.y = Math.max(24, Math.min(488, m.y)); }
      if (invuln <= 0 && Math.hypot(cx - m.x, cy - m.y) < m.r + 12) {
        lives--;
        invuln = 1.2;
        score = Math.max(0, score - 25);
        if (lives <= 0) { over = true; won = false; }
      }
    }

    for (const t of trail) t.a = Math.max(0, t.a - dt * 0.25);

    if (collected >= totalSpores) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 10) + lives * 40;
    }
  }

  document.getElementById("stat").textContent = `Spores: ${collected}/${totalSpores} • ♥${lives} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle grid
  ctx.strokeStyle = "rgba(56,214,255,0.07)";
  ctx.lineWidth = 1;
  for (let g = 32; g < 512; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  // Footstep trail
  for (const t of trail) {
    if (t.a <= 0) continue;
    ctx.fillStyle = `rgba(56,214,255,${(t.a * 0.45).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // Spores
  for (const s of spores) {
    if (s.taken) continue;
    const pulse = 7 + Math.sin(s.phase) * 2;
    ctx.fillStyle = "rgba(74,222,128,0.22)";
    ctx.beginPath(); ctx.arc(s.x, s.y, pulse + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.beginPath(); ctx.arc(s.x, s.y, pulse, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ecfdf5";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Mines
  for (const m of mines) {
    const r = m.r + Math.sin(m.phase) * 1.5;
    ctx.fillStyle = "rgba(248,113,113,0.2)";
    ctx.beginPath(); ctx.arc(m.x, m.y, r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    for (let k = 0; k < 6; k++) {
      const a = m.phase * 0.4 + (k * Math.PI) / 3;
      ctx.beginPath();
      ctx.moveTo(m.x + Math.cos(a) * (r - 2), m.y + Math.sin(a) * (r - 2));
      ctx.lineTo(m.x + Math.cos(a) * (r + 5), m.y + Math.sin(a) * (r + 5));
      ctx.stroke();
    }
  }

  // Procedural bug legs & joints (faithful to marcheBug.as)
  const blink = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
  if (!blink) {
    // Stride guide line
    ctx.strokeStyle = "rgba(56,214,255,0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();

    // Target foot marker (x1, y1)
    ctx.strokeStyle = "rgba(253,224,71,0.5)";
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2); ctx.stroke();

    // Legs from body to planted foot (x2,y2) and stepping foot (wx,wy)
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = "#fde047";
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(wx, wy); ctx.stroke();

    // Planted foot
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(x2, y2, 5, 0, Math.PI * 2); ctx.fill();

    // Stepping foot
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(wx, wy, 5, 0, Math.PI * 2); ctx.fill();

    // Body
    ctx.fillStyle = "#0ea5e9";
    ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Heading & antennae
    ctx.strokeStyle = "#e6f4ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * 14, cy + Math.sin(ang) * 14);
    ctx.stroke();
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang - 0.5) * 9, cy + Math.sin(ang - 0.5) * 9);
    ctx.lineTo(cx + Math.cos(ang - 0.35) * 19, cy + Math.sin(ang - 0.35) * 19);
    ctx.moveTo(cx + Math.cos(ang + 0.5) * 9, cy + Math.sin(ang + 0.5) * 9);
    ctx.lineTo(cx + Math.cos(ang + 0.35) * 19, cy + Math.sin(ang + 0.35) * 19);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TOUTES LES SPORES RÉCOLTÉES !" : (lives <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
