<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Foule PleinZ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pleinz",
  "name": "Foule PleinZ",
  "family": "topMouseMut",
  "icon": "🐝",
  "controls": "Déplacer la souris / doigt pour guider la foule à travers les murs vers la zone verte",
  "description": "Simulation de foule sur grille 32×32 : chaque unité occupe sa case et contourne obstacles et voisins.",
  "goal": "Évacuer au moins 40 unités sur 60 dans la zone verte en bas à droite sans les jeter dans les pièges rouges.",
  "fields": [
    { "key": "targetCount", "label": "Unités à évacuer", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>🐝 <b>Foule PleinZ</b></span>
  <span id="stat">Évacués: 0/40 • Vivants: 60 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pleinz";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 32, MH = 32, CW = 16, CH = 16;
const EXIT = { x: 456, y: 456, r: 40 };

let mouse = { x: 120, y: 120 };
let vecGrid = [], blobs = [], hazards = [], particles = [];
let targetGoal = 40, evacuated = 0, timeLeft = 45, score = 0, won = false, over = false;
let stepAccum = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
});

function setGrid(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  vecGrid[ax + ay * MW] = t;
}
function getGrid(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return -1;
  return vecGrid[ax + ay * MW];
}
function setTile(ax, ay, t) { setGrid(Math.floor(ax / CW), Math.floor(ay / CH), t); }
function getTile(ax, ay) { return getGrid(Math.floor(ax / CW), Math.floor(ay / CH)); }
function isTile(ax, ay) { return getTile(ax, ay) !== 0; }

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4, col });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetGoal = Math.max(10, Math.min(58, Number(custom.targetCount) || 40));
  evacuated = 0; timeLeft = 45; score = 0; won = false; over = false; stepAccum = 0;
  vecGrid = new Array(MW * MH).fill(0);
  blobs = []; particles = [];

  // Walls inspired by pleinZ.as (horizontal barrier + scattered pillars)
  for (let i = 2; i < 18; i++) setGrid(i, 11, -1);
  for (let i = 14; i < 30; i++) setGrid(i, 21, -1);
  for (let i = 0; i < 24; i++) {
    const wx = 2 + Math.floor(Math.random() * (MW - 4));
    const wy = 2 + Math.floor(Math.random() * (MH - 4));
    if (wx < 11 && wy < 11) continue;
    if (wx > 23 && wy > 23) continue;
    setGrid(wx, wy, -1);
  }

  // Moving red hazard orbs patrolling open lanes
  hazards = [
    { x: 350, y: 120, vx: 65, vy: 45, r: 16 },
    { x: 160, y: 265, vx: -55, vy: 50, r: 16 },
    { x: 260, y: 420, vx: 70, vy: -40, r: 16 }
  ];

  // 60 crowd blobs in top-left sector
  for (let i = 0; i < 60; i++) {
    const bx = 24 + (i % 10) * 15 + Math.random() * 4;
    const by = 24 + Math.floor(i / 10) * 15 + Math.random() * 4;
    const b = { cx: bx, cy: by, id: i + 1, ta: 0, state: "alive" };
    blobs.push(b);
    if (!isTile(b.cx, b.cy)) setTile(b.cx, b.cy, b.id);
  }
}

function stepCrowd() {
  for (let i = 0; i < blobs.length; i++) {
    const a = blobs[i];
    if (a.state !== "alive") continue;

    if (getTile(a.cx, a.cy) === a.id) setTile(a.cx, a.cy, 0);

    const dx = mouse.x - a.cx, dy = mouse.y - a.cy;
    const d = Math.hypot(dx, dy);
    let ms = 2.4;
    if (ms > d) ms = d;
    const ta = Math.atan2(dy, dx);
    a.ta = ta;
    let ax = Math.cos(ta) * ms;
    let ay = Math.sin(ta) * ms;

    if (getTile(a.cx, a.cy) >= 0) {
      if (isTile(a.cx + 6, a.cy) && ax > 0) ax = 0;
      if (isTile(a.cx - 6, a.cy) && ax < 0) ax = 0;
      if (isTile(a.cx, a.cy + 6) && ay > 0) ay = 0;
      if (isTile(a.cx, a.cy - 6) && ay < 0) ay = 0;
    }

    a.cx = Math.max(8, Math.min(504, a.cx + ax));
    a.cy = Math.max(8, Math.min(504, a.cy + ay));

    // Check extraction zone
    if (Math.hypot(a.cx - EXIT.x, a.cy - EXIT.y) < EXIT.r) {
      a.state = "saved";
      evacuated++;
      score += 15;
      burst(a.cx, a.cy, "#4ade80", 6);
      continue;
    }

    // Check hazards
    let hit = false;
    for (const h of hazards) {
      if (Math.hypot(a.cx - h.x, a.cy - h.y) < h.r + 6) {
        a.state = "dead";
        burst(a.cx, a.cy, "#f87171", 7);
        hit = true;
        break;
      }
    }
    if (hit) continue;

    if (!isTile(a.cx, a.cy)) setTile(a.cx, a.cy, a.id);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    for (const h of hazards) {
      h.x += h.vx * dt; h.y += h.vy * dt;
      if (h.x < 30 || h.x > 482) { h.vx *= -1; h.x = Math.max(30, Math.min(482, h.x)); }
      if (h.y < 30 || h.y > 482) { h.vy *= -1; h.y = Math.max(30, Math.min(482, h.y)); }
      if (Math.hypot(h.x - EXIT.x, h.y - EXIT.y) < EXIT.r + h.r + 12) {
        const a = Math.atan2(h.y - EXIT.y, h.x - EXIT.x);
        const sp = Math.hypot(h.vx, h.vy);
        h.vx = Math.cos(a) * sp; h.vy = Math.sin(a) * sp;
      }
    }

    stepAccum += dt;
    while (stepAccum >= 1 / 60) {
      stepCrowd();
      stepAccum -= 1 / 60;
    }

    const aliveN = blobs.filter(b => b.state === "alive").length;
    if (evacuated >= targetGoal) {
      won = true; over = true;
      score += Math.round(timeLeft * 10 + aliveN * 4);
    } else if (evacuated + aliveN < targetGoal) {
      won = false; over = true;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  const aliveN = blobs.filter(b => b.state === "alive").length;
  document.getElementById("stat").textContent = `Évacués: ${evacuated}/${targetGoal} • Restants: ${aliveN} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Draw
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Extraction zone
  ctx.beginPath(); ctx.arc(EXIT.x, EXIT.y, EXIT.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.2)"; ctx.fill();
  ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "#86efac"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("SORTIE", EXIT.x, EXIT.y + 4);

  // Grid tiles (walls & occupied tile outlines from AS3)
  for (let y = 0; y < MH; y++) {
    const yt = y * MW;
    for (let x = 0; x < MW; x++) {
      const t = vecGrid[yt + x];
      if (t < 0) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(x * CW, y * CH, CW, CH);
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CW + 0.5, y * CH + 0.5, CW - 1, CH - 1);
      } else if (t > 0) {
        ctx.strokeStyle = "rgba(56,214,255,0.18)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CW, y * CH, CW, CH);
      }
    }
  }

  // Blobs (circle + directional nose line from AS3)
  for (const a of blobs) {
    if (a.state !== "alive") continue;
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, 6.5, 0, Math.PI * 2);
    ctx.fillStyle = "#38d6ff";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(a.cx, a.cy);
    ctx.lineTo(a.cx + Math.cos(a.ta) * 7, a.cy + Math.sin(a.ta) * 7);
    ctx.strokeStyle = "#0a0e18";
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  // Hazards
  for (const h of hazards) {
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(239,68,68,0.2)"; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ef4444"; ctx.fill();
    ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.4);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Cursor beacon
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
  ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2; ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FOULE ÉVACUÉE !" : (timeLeft <= 0 ? "TEMPS ÉCOULÉ" : "PERTES TROP LOURDES"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
