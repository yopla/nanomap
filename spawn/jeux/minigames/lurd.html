<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Culbuto Daruma (Lurd)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0c101b; border: 2px solid #0088ff; border-top-style: dashed; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "lurd",
  "name": "Culbuto Daruma (Lurd)",
  "family": "core",
  "icon": "🎯",
  "controls": "Déplacer la souris/doigt pour propulser la sphère de frappe",
  "description": "Arène physique à contrepoids : Delta vert et Daruma rouge oscillent sur des paliers néon.",
  "goal": "Éjecter les deux culbutos par le haut ouvert du puits.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 35 }
  ]
}
</script>
<div class="bar">
  <span>🎯 <b>Culbuto Daruma</b></span>
  <span id="stat">Éjectés: 0/2 • 35s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "lurd";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let mouse = { x: 256, y: 200 }, striker = { x: 256, y: 200, vx: 0, vy: 0 }, dolls = [], ledges = [], timeLeft = 35, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 35;
  score = 0; won = false; over = false;
  striker = { x: 256, y: 180, vx: 0, vy: 0 };
  ledges = [
    { x: 0, y: 420, w: 120, h: 16 },
    { x: 392, y: 360, w: 120, h: 16 },
    { x: 180, y: 465, w: 152, h: 16 }
  ];
  dolls = [
    { name: "Delta", x: 165, y: 360, vx: 0, vy: 0, ang: 0, vang: 0, r: 28, col: "#00ff88", out: false },
    { name: "Daruma", x: 345, y: 360, vx: 0, vy: 0, ang: 0, vang: 0, r: 26, col: "#ff3344", out: false }
  ];
}

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    striker.vx = (striker.vx + (mouse.x - striker.x) * 24 * dt) * 0.86;
    striker.vy = (striker.vy + (mouse.y - striker.y) * 24 * dt) * 0.86;
    striker.x = Math.max(14, Math.min(498, striker.x + striker.vx * dt * 10));
    striker.y = Math.max(14, Math.min(498, striker.y + striker.vy * dt * 10));

    let outN = 0;
    for (const d of dolls) {
      if (d.out) { outN++; continue; }
      d.vy += 420 * dt;
      d.vang += -Math.sin(d.ang) * 14 * dt; // contrepoids auto-redressant
      d.vang *= 0.94; d.ang += d.vang * dt;
      const dist = Math.hypot(d.x - striker.x, d.y - striker.y);
      if (dist < d.r + 14) {
        const nx = (d.x - striker.x) / (dist || 1), ny = (d.y - striker.y) / (dist || 1);
        d.vx = nx * 290 + striker.vx * 6;
        d.vy = ny * 310 + striker.vy * 6 - 90;
        d.vang += nx * 8;
        score += 5;
      }
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vx *= 0.992;
      if (d.x < d.r) { d.x = d.r; d.vx *= -0.75; }
      if (d.x > 512 - d.r) { d.x = 512 - d.r; d.vx *= -0.75; }
      if (d.y > 512 - d.r) { d.y = 512 - d.r; d.vy *= -0.58; d.vx *= 0.92; }
      for (const l of ledges) {
        if (d.x + d.r > l.x && d.x - d.r < l.x + l.w && d.y + d.r > l.y && d.y - d.r < l.y + l.h && d.vy > 0) {
          d.y = l.y - d.r; d.vy *= -0.55;
        }
      }
      if (d.y < -15) { d.out = true; outN++; score += 100; }
    }
    if (outN >= 2) { won = true; over = true; score += Math.round(timeLeft * 5); }
  }

  const ejected = dolls.filter(d => d.out).length;
  document.getElementById("stat").textContent = `Éjectés: ${ejected}/2 • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0c101b"; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(512, 8); ctx.stroke(); ctx.setLineDash([]);

  for (const l of ledges) {
    ctx.fillStyle = "rgba(0,136,255,0.25)"; ctx.fillRect(l.x, l.y, l.w, l.h);
    ctx.strokeStyle = "#0088ff"; ctx.lineWidth = 2; ctx.strokeRect(l.x, l.y, l.w, l.h);
  }
  for (const d of dolls) {
    if (d.out) continue;
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.ang);
    ctx.strokeStyle = d.col; ctx.fillStyle = d.col + "33"; ctx.lineWidth = 3;
    if (d.name === "Delta") {
      ctx.beginPath(); ctx.moveTo(0, d.r); ctx.lineTo(-d.r, -d.r * 0.85); ctx.lineTo(d.r, -d.r * 0.85); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 8, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -18, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y); ctx.lineTo(striker.x, striker.y);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(striker.x, striker.y, 13, 0, Math.PI * 2);
  ctx.fillStyle = "#e2e8f0"; ctx.fill();
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CULBUTOS ÉJECTÉS !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
