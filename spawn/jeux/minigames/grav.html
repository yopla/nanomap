<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Orbite Planétoïde (Grav)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "grav",
  "name": "Orbite Planétoïde (Grav)",
  "family": "sideClavSimple",
  "icon": "🪐",
  "controls": "Gauche/Droite (Q/D) pour courir autour du planétoïde, Haut/Espace pour propulser en orbite (ou maintenir clic/doigt)",
  "description": "Gravité radiale 360° autour d'un planétoïde central : marchez sur sa circonférence et bondissez en orbite basse.",
  "goal": "Collecter les 8 balises orbitales sans vous faire toucher par les satellites rouges.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "beaconCount", "label": "Nombre de balises", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🪐 <b>Orbite Planétoïde</b></span>
  <span id="stat">Balises: 0/8 • 🛡️3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "grav";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const GX = 256, GY = 256, GRAD = 76;
let keys = {}, ptr = { down: false, x: 256, y: 256 };
let p = {}, beacons = [], hazards = [], stars = [];
let timeLeft = 45, shields = 3, score = 0, won = false, over = false, hurtTimer = 0, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) * (512 / r.width);
  ptr.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  ptr.down = true; setPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (ptr.down) setPtr(e); });
window.addEventListener("pointerup", () => { ptr.down = false; });

function isWall(wx, wy) {
  return Math.hypot(GX - wx, GY - wy) <= GRAD;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  const count = Math.max(4, Math.min(14, Number(custom.beaconCount) || 8));
  p = { x: GX, y: GY - GRAD - 14, vx: 0, vy: 0, vx2: 0, vy2: 0, r: 12, grounded: true, thrust: false };
  beacons = [];
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + 0.3;
    const alt = i % 2 === 0 ? GRAD + 26 : GRAD + 82 + (i % 3) * 20;
    beacons.push({ x: GX + Math.cos(a) * alt, y: GY + Math.sin(a) * alt, got: false });
  }
  hazards = [
    { a: 0.9, alt: GRAD + 56, spd: 1.15, r: 9 },
    { a: 4.0, alt: GRAD + 108, spd: -0.95, r: 10 },
    { a: 2.4, alt: GRAD + 150, spd: 0.75, r: 9 }
  ];
  stars = Array.from({ length: 50 }, () => ({ x: Math.random() * 512, y: Math.random() * 512, s: 1 + Math.random() * 1.5 }));
  shields = 3; score = 0; won = false; over = false; hurtTimer = 0; animT = 0;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  animT += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (hurtTimer > 0) hurtTimer = Math.max(0, hurtTimer - dt);

    const ang2 = Math.atan2(GY - p.y, GX - p.x);
    const kx = Math.cos(ang2), ky = Math.sin(ang2);

    let kLeft = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ);
    let kRight = !!(keys.ArrowRight || keys.KeyD);
    let kUp = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space);

    if (ptr.down) {
      const pAng = Math.atan2(p.y - GY, p.x - GX);
      const mAng = Math.atan2(ptr.y - GY, ptr.x - GX);
      let diff = mAng - pAng;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (diff < -0.15) kLeft = true;
      else if (diff > 0.15) kRight = true;
      if (Math.hypot(ptr.x - GX, ptr.y - GY) > GRAD + 48) kUp = true;
    }

    const dist = Math.hypot(p.x - GX, p.y - GY);
    p.grounded = dist <= GRAD + p.r + 4;
    p.thrust = kUp;

    const step = dt * 60;
    let ms = p.grounded ? 3.8 : 0.25;
    if (p.grounded) { p.vx = 0; p.vy = 0; }
    if (kLeft) { p.vx += ky * ms * (p.grounded ? 1 : step); p.vy += -kx * ms * (p.grounded ? 1 : step); }
    if (kRight) { p.vx += -ky * ms * (p.grounded ? 1 : step); p.vy += kx * ms * (p.grounded ? 1 : step); }

    if (kUp) {
      p.vx2 -= kx * 0.85 * step;
      p.vy2 -= ky * 0.85 * step;
    }

    // Radial gravity toward planet center
    p.vx2 += kx * 0.42 * step;
    p.vy2 += ky * 0.42 * step;

    if (isWall(p.x + kx * p.r + p.vx2 * step, p.y + ky * p.r + p.vy2 * step)) {
      const radialVel = p.vx2 * kx + p.vy2 * ky;
      if (radialVel > 0) { p.vx2 = 0; p.vy2 = 0; }
    }

    const damp = Math.pow(0.97, step);
    p.vx *= damp; p.vy *= damp;
    p.vx2 *= damp; p.vy2 *= damp;

    p.x += (p.vx + p.vx2) * step;
    p.y += (p.vy + p.vy2) * step;

    // Surface snap & soft outer boundary
    const newDist = Math.hypot(p.x - GX, p.y - GY);
    const outAng = Math.atan2(p.y - GY, p.x - GX);
    if (newDist < GRAD + p.r) {
      p.x = GX + Math.cos(outAng) * (GRAD + p.r);
      p.y = GY + Math.sin(outAng) * (GRAD + p.r);
    } else if (newDist > 238) {
      p.x = GX + Math.cos(outAng) * 238;
      p.y = GY + Math.sin(outAng) * 238;
      p.vx2 *= -0.4; p.vy2 *= -0.4;
    }

    // Beacons
    for (const b of beacons) {
      if (!b.got && Math.hypot(b.x - p.x, b.y - p.y) < p.r + 12) {
        b.got = true;
        score += 35;
      }
    }
    if (beacons.every(b => b.got)) {
      won = true; over = true;
      score += shields * 25 + Math.round(timeLeft * 5);
    }

    // Hazards
    for (const h of hazards) {
      h.a += h.spd * dt;
      const hx = GX + Math.cos(h.a) * h.alt;
      const hy = GY + Math.sin(h.a) * h.alt;
      if (hurtTimer <= 0 && Math.hypot(hx - p.x, hy - p.y) < p.r + h.r) {
        shields--;
        hurtTimer = 1.1;
        p.vx2 -= kx * 3; p.vy2 -= ky * 3;
        if (shields <= 0) { over = true; won = false; }
      }
    }
  }

  const gotN = beacons.filter(b => b.got).length;
  document.getElementById("stat").textContent = `Balises: ${gotN}/${beacons.length} • 🛡️${shields} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "rgba(174,240,255,0.35)";
  for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);

  // Orbit guide rings
  ctx.strokeStyle = "rgba(56,214,255,0.12)";
  ctx.lineWidth = 1;
  for (const r of [GRAD + 56, GRAD + 108, GRAD + 150]) {
    ctx.beginPath(); ctx.arc(GX, GY, r, 0, Math.PI * 2); ctx.stroke();
  }

  // Planetoid
  const grd = ctx.createRadialGradient(GX - 18, GY - 18, 10, GX, GY, GRAD);
  grd.addColorStop(0, "#1e3a5f");
  grd.addColorStop(1, "#0f172a");
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(GX, GY, GRAD, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(GX, GY, GRAD, 0, Math.PI * 2); ctx.stroke();

  // Gravity vector line from player to surface
  const ang = Math.atan2(GY - p.y, GX - p.x);
  ctx.strokeStyle = "rgba(56,214,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(ang) * 20, p.y + Math.sin(ang) * 20); ctx.stroke();

  // Beacons
  for (const b of beacons) {
    if (b.got) continue;
    const pulse = 7 + Math.sin(animT * 6 + b.x) * 2;
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(b.x, b.y, pulse, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, pulse + 4, 0, Math.PI * 2); ctx.stroke();
  }

  // Hazards
  for (const h of hazards) {
    const hx = GX + Math.cos(h.a) * h.alt;
    const hy = GY + Math.sin(h.a) * h.alt;
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(hx, hy, h.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Thrust flame
  if (p.thrust && !over) {
    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.arc(p.x + Math.cos(ang) * 14, p.y + Math.sin(ang) * 14, 5 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  if (hurtTimer <= 0 || Math.floor(hurtTimer * 16) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ORBITE SÉCURISÉE !" : "BOUCLIER HS / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
