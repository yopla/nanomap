<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Moisson Furtive (Pat AI)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pat",
  "name": "Moisson Furtive (Pat AI)",
  "family": "rogTil",
  "icon": "👁️",
  "controls": "Flèches / ZQSD ou glisser sur la grille",
  "description": "Infiltration face à un traqueur magenta, un vigile à rayon laser rouge et des pigeons jaunes.",
  "goal": "Récolter plus d'herbe verte que les pigeons sans vous faire attraper.",
  "fields": [
    { "key": "grassCount", "label": "Parcelles d'herbe", "type": "number", "default": 36 }
  ]
}
</script>
<div class="bar">
  <span>👁️ <b>Moisson Pat</b></span>
  <span id="stat">Vous: 0 • Pigeons: 0</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pat";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let keys = {}, p = { x: 256, y: 256 }, tracker = { x: 40, y: 40 }, sentry = { x: 460, y: 460, a: 0 }, pigeons = [], grass = [], walls = [];
let pScore = 0, pigScore = 0, score = 0, won = false, over = false, ptr = null;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  ptr = { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
});
cv.addEventListener("pointermove", (e) => {
  if (!ptr) return;
  const r = cv.getBoundingClientRect();
  ptr = { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
});
window.addEventListener("pointerup", () => { ptr = null; });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const gCount = Number(custom.grassCount) || 36;
  p = { x: 256, y: 256 }; tracker = { x: 42, y: 42 }; sentry = { x: 470, y: 470, a: 2.4 };
  pScore = 0; pigScore = 0; score = 0; won = false; over = false;
  walls = [];
  for (let i = 0; i < 10; i++) {
    const wx = 40 + Math.random() * 380, wy = 40 + Math.random() * 380;
    if (Math.hypot(wx - 256, wy - 256) > 70) walls.push({ x: wx, y: wy, w: 36 + Math.random() * 26, h: 24 + Math.random() * 26 });
  }
  grass = Array.from({ length: gCount }, () => ({ x: 24 + Math.random() * 464, y: 24 + Math.random() * 464 }));
  pigeons = Array.from({ length: 7 }, () => ({ x: 40 + Math.random() * 430, y: 40 + Math.random() * 430, a: Math.random() * Math.PI * 2 }));
}

function hitsWall(x, y, rad) {
  return walls.some(w => x + rad > w.x && x - rad < w.x + w.w && y + rad > w.y && y - rad < w.y + w.h);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (dx === 0 && dy === 0 && ptr) {
      const pd = Math.hypot(ptr.x - p.x, ptr.y - p.y);
      if (pd > 8) { dx = (ptr.x - p.x) / pd; dy = (ptr.y - p.y) / pd; }
    }
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const nx = Math.max(12, Math.min(500, p.x + (dx / len) * 185 * dt));
      const ny = Math.max(12, Math.min(500, p.y + (dy / len) * 185 * dt));
      if (!hitsWall(nx, p.y, 8)) p.x = nx;
      if (!hitsWall(p.x, ny, 8)) p.y = ny;
    }

    // Traqueur magenta (poursuit le joueur)
    const ta = Math.atan2(p.y - tracker.y, p.x - tracker.x);
    tracker.x += Math.cos(ta) * 78 * dt; tracker.y += Math.sin(ta) * 78 * dt;

    // Vigile rouge (raycast / poursuite)
    const sd = Math.hypot(p.x - sentry.x, p.y - sentry.y);
    if (sd < 190) {
      const sa = Math.atan2(p.y - sentry.y, p.x - sentry.x);
      sentry.x += Math.cos(sa) * 95 * dt; sentry.y += Math.sin(sa) * 95 * dt;
    } else {
      sentry.a += (Math.random() - 0.5) * 2 * dt;
      sentry.x = Math.max(16, Math.min(496, sentry.x + Math.cos(sentry.a) * 60 * dt));
      sentry.y = Math.max(16, Math.min(496, sentry.y + Math.sin(sentry.a) * 60 * dt));
    }

    for (const pg of pigeons) {
      let near = null, nd = 95;
      for (const g of grass) { const d = Math.hypot(g.x - pg.x, g.y - pg.y); if (d < nd) { nd = d; near = g; } }
      if (near) pg.a = Math.atan2(near.y - pg.y, near.x - pg.x);
      else pg.a += (Math.random() - 0.5) * 3 * dt;
      pg.x = Math.max(10, Math.min(502, pg.x + Math.cos(pg.a) * 62 * dt));
      pg.y = Math.max(10, Math.min(502, pg.y + Math.sin(pg.a) * 62 * dt));
    }

    for (let i = grass.length - 1; i >= 0; i--) {
      const g = grass[i];
      if (Math.hypot(p.x - g.x, p.y - g.y) < 16) { grass.splice(i, 1); pScore++; score += 15; continue; }
      if (pigeons.some(pg => Math.hypot(pg.x - g.x, pg.y - g.y) < 12)) { grass.splice(i, 1); pigScore++; }
    }
    if (Math.hypot(p.x - tracker.x, p.y - tracker.y) < 16 || Math.hypot(p.x - sentry.x, p.y - sentry.y) < 17) {
      over = true; won = false;
    } else if (grass.length === 0) {
      over = true; won = pScore >= pigScore; score += won ? 100 : 0;
    }
  }
  document.getElementById("stat").textContent = `Vous: ${pScore} • Pigeons: ${pigScore} • Reste: ${grass.length}`;
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#334155";
  for (const w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);
  ctx.fillStyle = "#4ade80";
  for (const g of grass) ctx.fillRect(g.x - 5, g.y - 5, 10, 10);
  ctx.fillStyle = "#eab308";
  for (const pg of pigeons) ctx.fillRect(pg.x - 5, pg.y - 5, 10, 10);
  ctx.strokeStyle = "rgba(248,113,113,0.4)"; ctx.beginPath(); ctx.moveTo(sentry.x, sentry.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(sentry.x, sentry.y, 10, 0, Math.PI * 2); ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(tracker.x, tracker.y, 8, 0, Math.PI * 2); ctx.fillStyle = "#e879f9"; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fillStyle = "#38d6ff"; ctx.fill();
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "MOISSON REMPORTÉE !" : "INTERCEPTÉ / BATTU", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
