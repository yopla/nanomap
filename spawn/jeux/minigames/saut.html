<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Lancer-Saut (Saut)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "saut",
  "name": "Lancer-Saut (Saut)",
  "family": "sideClavSimple",
  "icon": "📦",
  "controls": "Gauche/Droite (Q/D) pour bouger, Haut (W/Z) pour sauter sur un cube, Bas / Espace pour soulever puis lancer (ou clic/toucher)",
  "description": "Mécanique de portage et lancer : sautez sur des cubes bondissants, soulevez-les au-dessus de votre tête et projetez-les sur les cibles.",
  "goal": "Détruire les 6 cibles lumineuses en leur lançant les cubes bondissants.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "targetCount", "label": "Nombre de cibles", "type": "number", "default": 6 }
  ]
}
</script>
<div class="bar">
  <span>📦 <b>Lancer-Saut</b></span>
  <span id="stat">Cibles: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "saut";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const FLOOR_Y = 420;
let keys = {}, ptr = { down: false, x: 256, y: 256 };
let p = {}, cubes = [], targets = [], pops = [];
let timeLeft = 45, score = 0, won = false, over = false, animT = 0;
let actionLock = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
  if (e.code === "ArrowDown" || e.code === "KeyS" || e.code === "Space") actionLock = false;
});

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) * (512 / r.width);
  ptr.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  ptr.down = true; setPtr(e);
  if (ptr.y > 320) triggerGrabOrThrow();
});
cv.addEventListener("pointermove", (e) => { if (ptr.down) setPtr(e); });
window.addEventListener("pointerup", () => { ptr.down = false; });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  const tCount = Math.max(3, Math.min(8, Number(custom.targetCount) || 6));
  p = { x: 220, y: FLOOR_Y - 18, vx: 0, vy: 0, dir: 1, carry: null, wait: 0 };
  cubes = [
    { x: 140, y: FLOOR_Y - 18, vx: 1.4, vy: 0, thrown: 0 },
    { x: 360, y: FLOOR_Y - 18, vx: -1.4, vy: 0, thrown: 0 }
  ];
  const preset = [
    { x: 74, y: 250 }, { x: 438, y: 250 },
    { x: 110, y: 150 }, { x: 402, y: 150 },
    { x: 256, y: 120 }, { x: 256, y: 215 },
    { x: 170, y: 280 }, { x: 342, y: 280 }
  ];
  targets = preset.slice(0, tCount).map(t => ({ x: t.x, y: t.y, r: 18, hit: false }));
  pops = [];
  score = 0; won = false; over = false; animT = 0; actionLock = false;
}

function isStandingOn(c) {
  return Math.abs(p.x - c.x) < 28 && p.y + 18 <= c.y - 18 + 10 && p.y + 18 >= c.y - 18 - 10;
}

function triggerGrabOrThrow() {
  if (over || p.wait > 0) return;
  if (p.carry) {
    // Throw carried cube (saut.as: wx = dir ? 5 : -5, wy = -3, boosted for arcade targets)
    const c = p.carry;
    c.vx = p.dir * 8.2;
    c.vy = -7.6;
    c.thrown = 1.6;
    p.carry = null;
    p.wait = 6;
  } else {
    // Pick up cube being ridden (or right next to feet)
    for (const c of cubes) {
      if (isStandingOn(c) || (Math.abs(p.x - c.x) < 32 && Math.abs(p.y - c.y) < 30)) {
        p.carry = c;
        p.wait = 12;
        c.vx = 0; c.vy = 0; c.thrown = 0;
        break;
      }
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  animT += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    const step = dt * 60;
    const kLeft = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ || (ptr.down && ptr.x < p.x - 24));
    const kRight = !!(keys.ArrowRight || keys.KeyD || (ptr.down && ptr.x > p.x + 24));
    const kUp = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || (ptr.down && ptr.y < 230));
    const kAct = !!(keys.ArrowDown || keys.KeyS || keys.Space);

    if (kAct && !actionLock) {
      actionLock = true;
      triggerGrabOrThrow();
    }

    // Update cubes (saut.as hopping & riding)
    let riding = null;
    for (const c of cubes) {
      if (c === p.carry) continue;
      const wasOver = isStandingOn(c);
      if (c.thrown > 0) {
        c.thrown = Math.max(0, c.thrown - dt);
        c.vy += 0.32 * step;
      } else {
        c.vx *= Math.pow(0.985, step);
        if (Math.abs(c.vx) < 0.8) c.vx = c.vx >= 0 ? 1.2 : -1.2;
        c.vy += 0.42 * step;
        if (Math.random() < 0.03 * step && c.y >= FLOOR_Y - 22) c.vy = -5.5;
      }

      const prevY = c.y;
      c.x += c.vx * step;
      c.y += c.vy * step;

      if (c.x < 24) { c.x = 24; c.vx = Math.abs(c.vx); }
      if (c.x > 488) { c.x = 488; c.vx = -Math.abs(c.vx); }
      if (c.y > FLOOR_Y - 18) {
        c.y = FLOOR_Y - 18;
        c.vy = c.thrown > 0 ? -c.vy * 0.45 : 0;
      }

      if (wasOver && p.vy >= 0) {
        riding = c;
        p.x += c.vx * step;
        p.y += (c.y - prevY);
        p.vy = 0;
        p.y = c.y - 36;
      }

      // Check thrown cube hitting targets
      if (c.thrown > 0) {
        for (const t of targets) {
          if (!t.hit && Math.hypot(t.x - c.x, t.y - c.y) < t.r + 18) {
            t.hit = true;
            score += 50;
            c.vx *= -0.5;
            c.vy = -3;
            pops.push({ x: t.x, y: t.y, life: 0.4 });
          }
        }
      }
    }

    // Player movement
    p.vx = 0;
    if (p.wait <= 0) {
      if (kLeft) { p.vx = -3.8; p.dir = -1; }
      if (kRight) { p.vx = 3.8; p.dir = 1; }
      const grounded = (p.y >= FLOOR_Y - 18.5) || !!riding;
      if (kUp && grounded) p.vy = -8.6;
    } else {
      p.wait = Math.max(0, p.wait - step);
    }

    p.vy += 0.42 * step;
    p.x = Math.max(18, Math.min(494, p.x + p.vx * step));
    p.y += p.vy * step;

    if (p.y > FLOOR_Y - 18) { p.y = FLOOR_Y - 18; p.vy = 0; }

    // Land on top of cubes
    if (!p.carry && p.vy > 0) {
      for (const c of cubes) {
        if (Math.abs(p.x - c.x) < 26 && p.y + 18 >= c.y - 18 && p.y + 18 <= c.y - 4) {
          p.y = c.y - 36;
          p.vy = 0;
        }
      }
    }

    // Carried cube overhead animation (saut.as)
    if (p.carry) {
      const c = p.carry;
      if (p.wait > 0) {
        c.x += (p.x - c.x) * 0.25 * step;
        c.y += (p.y - 36 - c.y) * 0.25 * step;
      } else {
        c.x = p.x;
        c.y = p.y - 36;
      }
    }

    if (targets.every(t => t.hit)) {
      won = true; over = true;
      score += Math.round(timeLeft * 5);
    }
  }

  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].life -= dt;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }

  const hitN = targets.filter(t => t.hit).length;
  document.getElementById("stat").textContent = `Cibles: ${hitN}/${targets.length} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#1e293b"; ctx.fillRect(0, FLOOR_Y, 512, 512 - FLOOR_Y);
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(512, FLOOR_Y); ctx.stroke();

  // Targets
  for (const t of targets) {
    if (t.hit) continue;
    const bob = Math.sin(animT * 4 + t.x) * 4;
    ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y + bob, t.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(244,63,94,0.28)";
    ctx.beginPath(); ctx.arc(t.x, t.y + bob, t.r - 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(t.x, t.y + bob, 5, 0, Math.PI * 2); ctx.fill();
  }

  // Hit bursts
  for (const b of pops) {
    ctx.strokeStyle = `rgba(74,222,128,${b.life * 2.5})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, 18 + (0.4 - b.life) * 70, 0, Math.PI * 2); ctx.stroke();
  }

  // Cubes
  for (const c of cubes) {
    ctx.fillStyle = c.thrown > 0 ? "#f97316" : (c === p.carry ? "#fde047" : "#4ade80");
    ctx.fillRect(c.x - 18, c.y - 18, 36, 36);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.strokeRect(c.x - 18, c.y - 18, 36, 36);
    ctx.fillStyle = "#0a0e18";
    ctx.fillRect(c.x - 8, c.y - 5, 4, 4);
    ctx.fillRect(c.x + 4, c.y - 5, 4, 4);
  }

  // Player
  ctx.fillStyle = "#38d6ff";
  ctx.fillRect(p.x - 10, p.y - 18, 20, 36);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.strokeRect(p.x - 10, p.y - 18, 20, 36);
  // Facing eye visor
  ctx.fillStyle = "#fde047";
  ctx.fillRect(p.dir > 0 ? p.x + 1 : p.x - 7, p.y - 12, 6, 4);

  // Aim arc hint when carrying
  if (p.carry && !over) {
    ctx.fillStyle = "rgba(253,224,71,0.5)";
    for (let i = 1; i <= 5; i++) {
      const t = i * 3.2;
      const ax = p.carry.x + p.dir * 8.2 * t;
      const ay = p.carry.y - 7.6 * t + 0.16 * t * t;
      ctx.beginPath(); ctx.arc(ax, ay, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Controls footer
  ctx.fillStyle = "#94a3b8"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(p.carry ? "Appuyez sur Bas / Espace pour LANCER le cube !" : "Sautez sur un cube vert puis Bas / Espace pour le SOULEVER", 256, 470);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CIBLES PULVÉRISÉES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
