<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sphère Iso (Isoo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "isoo",
  "name": "Sphère Iso (Isoo)",
  "family": "topMouseHnS",
  "icon": "🔮",
  "controls": "Maintenir clic / toucher sur le plateau isométrique pour faire rouler la sphère 3D (Espace / clic droit = saut)",
  "description": "Sphère 3D filaire à rotation quaternionique roulant et rebondissant sur un plateau isométrique suspendu.",
  "goal": "Collecter les 8 cristaux flottants sans tomber dans le vide ni percuter les pylônes rouges.",
  "fields": [
    { "key": "crystalCount", "label": "Cristaux à collecter", "type": "number", "default": 8 },
    { "key": "durationSec", "label": "Durée (sec)", "type": "number", "default": 42 }
  ]
}
</script>
<div class="bar">
  <span>🔮 <b>Sphère Iso (Isoo)</b></span>
  <span id="stat">Cristaux: 0/8 • 🛡️3 • 42s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "isoo";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const PLAT = 360, SCALE = 0.64, OX = 256, OY = 148, RAD = 26;

// Port of xQuat from isoo.as for authentic 3D rolling sphere rotation
class xQuat {
  constructor() { this.x = 0; this.y = 0; this.z = 0; this.w = 1; }
  reset() { this.x = 0; this.y = 0; this.z = 0; this.w = 1; }
  copyQuat(a) { this.x = a.x; this.y = a.y; this.z = a.z; this.w = a.w; }
  normalise() {
    let mag = this.x * this.x + this.y * this.y + this.z * this.z + this.w * this.w;
    if (mag === 0) { this.reset(); return; }
    mag = 1 / Math.sqrt(mag);
    this.x *= mag; this.y *= mag; this.z *= mag; this.w *= mag;
  }
  mul(a) {
    const tx = this.w * a.x + this.x * a.w + this.y * a.z - this.z * a.y;
    const ty = this.w * a.y + this.y * a.w + this.z * a.x - this.x * a.z;
    const tz = this.w * a.z + this.z * a.w + this.x * a.y - this.y * a.x;
    const tw = this.w * a.w - this.x * a.x - this.y * a.y - this.z * a.z;
    this.x = tx; this.y = ty; this.z = tz; this.w = tw;
  }
  rotAxis(ang, xyz = 0) {
    ang *= 0.5;
    const s = Math.sin(ang), aw = Math.cos(ang);
    const ax = xyz === 0 ? s : 0, ay = xyz === 1 ? s : 0, az = xyz === 2 ? s : 0;
    const tx = this.w * ax + this.x * aw + this.y * az - this.z * ay;
    const ty = this.w * ay + this.y * aw + this.z * ax - this.x * az;
    const tz = this.w * az + this.z * aw + this.x * ay - this.y * ax;
    const tw = this.w * aw - this.x * ax - this.y * ay - this.z * az;
    this.x = tx; this.y = ty; this.z = tz; this.w = tw;
    this.normalise();
  }
  rotYaw(ang) { this.rotAxis(ang, 1); }
  getFrontVx() { return 2 * (this.x * this.z + this.y * this.w); }
  getFrontVy() { return 2 * (this.y * this.z - this.x * this.w); }
  getFrontVz() { return 1 - 2 * (this.x * this.x + this.y * this.y); }
  fromAxisAngle(ang, ax, ay, az) {
    const s = Math.sin(ang * 0.5);
    this.x = ax * s; this.y = ay * s; this.z = az * s; this.w = Math.cos(ang * 0.5);
    this.normalise();
  }
  ballRot(vx, vz, rad) {
    const mag = Math.hypot(vx, vz);
    if (mag <= 0.0001) return;
    const rot = mag / (-rad);
    const nx = vx / mag, nz = vz / mag;
    tempRotQ.fromAxisAngle(rot, -nz, 0, nx);
    tempRotQ.mul(this);
    this.copyQuat(tempRotQ);
  }
}
const tempRotQ = new xQuat();
const tempDrawQ = new xQuat();

let mouse = { x: 256, y: 256 }, mdown = false;
let cx = 180, cy = 60, cz = 180, vx = 0, vy = 0, vz = 0;
let ori = new xQuat();
let crystals = [], pillars = [];
let hp = 3, invuln = 0, timeLeft = 42, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  if (e.button === 2) { tryJump(); return; }
  mdown = true;
});
window.addEventListener("pointerup", () => { mdown = false; });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); tryJump(); } });

function tryJump() {
  if (!over && cy <= RAD + 3 && cx >= 0 && cx <= PLAT && cz >= 0 && cz <= PLAT) vy = 5.2;
}

function proj(ax, ay, az) {
  return { x: (ax - az) * SCALE + OX, y: (ax + az) * 0.5 * SCALE - ay * SCALE + OY };
}
function screenToFloor(mx, my) {
  const dx = (mx - OX) / SCALE, dy = (my - OY) / SCALE;
  return { x: dy + 0.5 * dx, z: dy - 0.5 * dx };
}
function drawLine3D(ax, ay, az, bx, by, bz) {
  const p1 = proj(ax, ay, az), p2 = proj(bx, by, bz);
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
}
function drawCirc3D(ax, ay, az, r) {
  const t = 0.39;
  for (let u = 0; u < Math.PI * 2; u += t) {
    drawLine3D(ax + Math.cos(u) * r, ay, az + Math.sin(u) * r, ax + Math.cos(u + t) * r, ay, az + Math.sin(u + t) * r);
  }
}
function drawBox3D(ax, ay, az, bx, by, bz) {
  drawLine3D(ax, ay, az, bx, ay, az); drawLine3D(ax, by, az, bx, by, az);
  drawLine3D(ax, ay, bz, bx, ay, bz); drawLine3D(ax, by, bz, bx, by, bz);
  drawLine3D(ax, ay, az, ax, by, az); drawLine3D(bx, ay, az, bx, by, az);
  drawLine3D(ax, ay, bz, ax, by, bz); drawLine3D(bx, ay, bz, bx, by, bz);
  drawLine3D(ax, ay, az, ax, ay, bz); drawLine3D(bx, ay, az, bx, ay, bz);
  drawLine3D(ax, by, az, ax, by, bz); drawLine3D(bx, by, az, bx, by, bz);
}
function drawBall3D(o, ax, ay, az, r) {
  const t = 0.628;
  for (let i = 0; i < 3; i++) {
    tempDrawQ.copyQuat(o);
    if (i === 2) tempDrawQ.rotYaw(Math.PI * 0.5);
    let kx2 = ax + tempDrawQ.getFrontVx() * r;
    let ky2 = ay + tempDrawQ.getFrontVy() * r;
    let kz2 = az + tempDrawQ.getFrontVz() * r;
    for (let u = 0; u < Math.PI * 2; u += t) {
      tempDrawQ.rotAxis(t, i % 2);
      const kx = ax + tempDrawQ.getFrontVx() * r;
      const ky = ay + tempDrawQ.getFrontVy() * r;
      const kz = az + tempDrawQ.getFrontVz() * r;
      drawLine3D(kx2, ky2, kz2, kx, ky, kz);
      kx2 = kx; ky2 = ky; kz2 = kz;
    }
  }
}

function respawnBall() {
  cx = PLAT * 0.5; cy = 85; cz = PLAT * 0.5;
  vx = 0; vy = 0; vz = 0;
  invuln = 1.2;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const cnt = Math.max(4, Number(custom.crystalCount) || 8);
  timeLeft = Math.max(15, Number(custom.durationSec) || 42);
  hp = 3; invuln = 0; score = 0; won = false; over = false; mdown = false;
  ori.reset();
  cx = PLAT * 0.5; cy = 75; cz = PLAT * 0.5; vx = 0; vy = 0; vz = 0;

  pillars = [
    { x: 105, z: 105, r: 18, h: 38 },
    { x: 255, z: 105, r: 18, h: 38 },
    { x: 180, z: 265, r: 18, h: 38 }
  ];

  crystals = [];
  for (let i = 0; i < cnt; i++) {
    let x, z, tries = 0;
    do {
      x = 42 + Math.random() * (PLAT - 84);
      z = 42 + Math.random() * (PLAT - 84);
      tries++;
    } while (tries < 40 && (Math.hypot(x - 180, z - 180) < 55 || pillars.some(p => Math.hypot(x - p.x, z - p.z) < 48) || crystals.some(c => Math.hypot(x - c.x, z - c.z) < 42)));
    crystals.push({ x, z, y: 22, got: false, ph: Math.random() * 6.28 });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;
  const wm = screenToFloor(mouse.x, mouse.y);

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (timeLeft <= 0) over = true;

    if (mdown) {
      const ang = Math.atan2(wm.z - cz, wm.x - cx);
      vx += Math.cos(ang) * 0.28 * f;
      vz += Math.sin(ang) * 0.28 * f;
    }

    const drag = Math.pow(0.975, f);
    vx *= drag; vz *= drag;
    vy -= 0.22 * f;

    const onPlat = cx >= 0 && cx <= PLAT && cz >= 0 && cz <= PLAT;
    if (onPlat && cy < RAD && vy < 0) {
      cy = RAD;
      vy = Math.abs(vy) < 0.7 ? 0 : -vy * 0.5;
    }

    cx += vx * f; cy += vy * f; cz += vz * f;
    ori.ballRot(vx * f, vz * f, RAD);

    // Fell off platform
    if (cy < -120) {
      hp--;
      if (hp <= 0) over = true;
      else respawnBall();
    }

    // Hazard pillars
    for (const p of pillars) {
      const d = Math.hypot(cx - p.x, cz - p.z);
      if (d < RAD + p.r && cy < p.h + RAD) {
        const nx = (cx - p.x) / (d || 1), nz = (cz - p.z) / (d || 1);
        vx = nx * 5.2; vz = nz * 5.2; vy = 2.5;
        if (invuln <= 0) {
          hp--; invuln = 1.0;
          if (hp <= 0) over = true;
        }
      }
    }

    // Collect crystals
    for (const c of crystals) {
      c.ph += dt * 3.5;
      if (!c.got && Math.hypot(cx - c.x, cz - c.z) < RAD + 16 && Math.abs(cy - c.y) < 42) {
        c.got = true;
        score += 45;
      }
    }
    if (crystals.every(c => c.got)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6 + hp * 25);
    }
  }

  const gotN = crystals.filter(c => c.got).length;
  document.getElementById("stat").textContent = `Cristaux: ${gotN}/${crystals.length} • 🛡️${hp} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Isometric platform grid & box
  ctx.strokeStyle = "rgba(56,214,255,0.14)"; ctx.lineWidth = 1;
  for (let i = 60; i < PLAT; i += 60) {
    drawLine3D(i, 0, 0, i, 0, PLAT);
    drawLine3D(0, 0, i, PLAT, 0, i);
  }
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2;
  drawBox3D(0, -10, 0, PLAT, 0, PLAT);

  // Isometric floor cursor (from isoo.as)
  if (wm.x >= -20 && wm.x <= PLAT + 20 && wm.z >= -20 && wm.z <= PLAT + 20) {
    ctx.strokeStyle = mdown ? "#4ade80" : "rgba(56,214,255,0.65)"; ctx.lineWidth = 1.8;
    drawLine3D(wm.x, 0, wm.z, wm.x, 12, wm.z);
    drawCirc3D(wm.x, 0, wm.z, 14);
  }

  // Pillars
  for (const p of pillars) {
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 1.8;
    drawBox3D(p.x - p.r * 0.7, 0, p.z - p.r * 0.7, p.x + p.r * 0.7, p.h, p.z + p.r * 0.7);
  }

  // Crystals
  for (const c of crystals) {
    if (c.got) continue;
    const hover = c.y + Math.sin(c.ph) * 6;
    ctx.strokeStyle = "rgba(253,224,71,0.35)"; ctx.lineWidth = 1;
    drawCirc3D(c.x, 0, c.z, 8);
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2;
    drawBox3D(c.x - 8, hover - 8, c.z - 8, c.x + 8, hover + 8, c.z + 8);
  }

  // Ball ground shadow & bounding box & 3D quaternion wireframe sphere (from isoo.as)
  if (cx >= 0 && cx <= PLAT && cz >= 0 && cz <= PLAT) {
    ctx.strokeStyle = "rgba(148,163,184,0.4)"; ctx.lineWidth = 1.5;
    drawCirc3D(cx, 0, cz, RAD * 0.6);
  }
  if (invuln <= 0 || Math.floor(invuln * 16) % 2 === 0) {
    ctx.strokeStyle = "rgba(56,214,255,0.22)"; ctx.lineWidth = 1;
    drawBox3D(cx - RAD, cy - RAD, cz - RAD, cx + RAD, cy + RAD, cz + RAD);
    ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 1.8;
    drawBall3D(ori, cx, cy, cz, RAD);
    const sp = proj(cx, cy, cz);
    ctx.beginPath(); ctx.arc(sp.x, sp.y, RAD * SCALE + 4, 0, Math.PI * 2);
    ctx.strokeStyle = "#e6f4ff"; ctx.lineWidth = 2; ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CRISTAUX COLLECTÉS !" : (hp <= 0 ? "SPHÈRE PERDUE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
