<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Vol Caverne (Vol)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "vol",
  "name": "Vol Caverne (Vol)",
  "family": "sideClavSimple",
  "icon": "🦇",
  "controls": "Flèches / ZQSD pour propulser dans les 4 directions sous gravité (ou maintenir clic/doigt vers la cible)",
  "description": "Exploration en vol libre d'une caverne souterraine cloisonnée avec caméra fluide, gravité douce et radar de cristaux.",
  "goal": "Collecter les 7 cristaux lumineux avant la fin du chrono sans briser la coque.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "crystalCount", "label": "Nombre de cristaux", "type": "number", "default": 7 }
  ]
}
</script>
<div class="bar">
  <span>🦇 <b>Vol Caverne</b></span>
  <span id="stat">Cristaux: 0/7 • Coque: 100% • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "vol";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const W = 960, H = 960;
let keys = {}, ptr = { down: false, x: 256, y: 256 };
let walls = [], crystals = [], sparks = [];
let p = {}, cam = { x: 0, y: 0 };
let timeLeft = 45, hull = 100, score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) * (512 / r.width);
  ptr.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  ptr.down = true; setPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (ptr.down) setPtr(e); });
window.addEventListener("pointerup", () => { ptr.down = false; });

function isObstacle(x, y) {
  if (x < 24 || y < 24 || x >= W - 24 || y >= H - 24) return true;
  for (const w of walls) {
    if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
  }
  return false;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  const count = Math.max(4, Math.min(10, Number(custom.crystalCount) || 7));
  walls = [
    // Cavern ledges & pillars inspired by vol.as
    { x: 24, y: 220, w: 230, h: 48 },
    { x: 380, y: 120, w: 72, h: 240 },
    { x: 580, y: 220, w: 240, h: 52 },
    { x: 180, y: 440, w: 270, h: 48 },
    { x: 580, y: 460, w: 68, h: 250 },
    { x: 24, y: 690, w: 290, h: 52 },
    { x: 430, y: 740, w: 300, h: 48 },
    { x: 760, y: 620, w: 176, h: 46 }
  ];
  const spots = [
    { x: 110, y: 340 }, { x: 515, y: 120 }, { x: 850, y: 120 },
    { x: 850, y: 390 }, { x: 320, y: 590 }, { x: 130, y: 840 },
    { x: 820, y: 830 }, { x: 500, y: 580 }, { x: 280, y: 120 }, { x: 690, y: 340 }
  ];
  crystals = spots.slice(0, count).map(s => ({ x: s.x, y: s.y, got: false }));
  p = { x: 110, y: 110, vx: 0, vy: 0, r: 10 };
  cam = { x: 0, y: 0 };
  sparks = [];
  hull = 100; score = 0; won = false; over = false; animT = 0;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  animT += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    const step = dt * 60;
    // Gentle gravity (vol.as: vy += 0.125)
    p.vy += 0.14 * step;

    let ax = 0, ay = 0;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ax -= 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;

    if (ptr.down) {
      const wx = ptr.x + cam.x, wy = ptr.y + cam.y;
      const dx = wx - p.x, dy = wy - p.y;
      const d = Math.hypot(dx, dy) || 1;
      ax += (dx / d) * 1.1;
      ay += (dy / d) * 1.1;
    }

    p.vx += ax * 0.55 * step;
    p.vy += ay * 0.55 * step;

    if (Math.hypot(ax, ay) > 0.2) {
      sparks.push({ x: p.x - ax * 10, y: p.y - ay * 10, vx: -ax * 40 + (Math.random() - 0.5) * 30, vy: -ay * 40 + (Math.random() - 0.5) * 30, life: 0.25 });
    }

    p.vx = Math.max(-7.5, Math.min(7.5, p.vx));
    p.vy = Math.max(-7.5, Math.min(7.5, p.vy));
    p.vx *= Math.pow(0.92, step);
    p.vy *= Math.pow(0.96, step);

    // Collision checks (vol.as style + impact damage on hard slam)
    const impact = (spd) => {
      if (Math.abs(spd) > 4.2) {
        hull = Math.max(0, hull - Math.round((Math.abs(spd) - 3.5) * 6));
        if (hull <= 0) { over = true; won = false; }
      }
    };

    const nx = p.x + p.vx * step;
    if (p.vx < 0 && isObstacle(nx - p.r, p.y)) { impact(p.vx); p.vx = -p.vx * 0.25; }
    else if (p.vx > 0 && isObstacle(nx + p.r, p.y)) { impact(p.vx); p.vx = -p.vx * 0.25; }
    else p.x = nx;

    const ny = p.y + p.vy * step;
    if (p.vy < 0 && isObstacle(p.x, ny - p.r)) { impact(p.vy); p.vy = -p.vy * 0.25; }
    else if (p.vy > 0 && isObstacle(p.x, ny + p.r)) { impact(p.vy); p.vy = 0; }
    else p.y = ny;

    // Floor step-up safety
    for (let i = 0; i < 6; i++) {
      if (!isObstacle(p.x, p.y + p.r - 1)) break;
      if (isObstacle(p.x, p.y - p.r - 1)) break;
      p.y -= 1;
    }

    // Crystals
    for (const c of crystals) {
      if (!c.got && Math.hypot(c.x - p.x, c.y - p.y) < p.r + 14) {
        c.got = true;
        score += 40;
      }
    }
    if (crystals.every(c => c.got)) {
      won = true; over = true;
      score += Math.round(hull) + Math.round(timeLeft * 5);
    }

    // Smooth camera (vol.as)
    const tx = Math.max(0, Math.min(W - 512, p.x - 256));
    const ty = Math.max(0, Math.min(H - 512, p.y - 256));
    cam.x += (tx - cam.x) * Math.min(1, dt * 8);
    cam.y += (ty - cam.y) * Math.min(1, dt * 8);
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  const gotN = crystals.filter(c => c.got).length;
  document.getElementById("stat").textContent = `Cristaux: ${gotN}/${crystals.length} • Coque: ${Math.round(hull)}% • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  // Outer cavern border
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 4;
  ctx.strokeRect(24, 24, W - 48, H - 48);

  // Subtle cavern grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)"; ctx.lineWidth = 1;
  for (let x = 24; x < W - 24; x += 48) { ctx.beginPath(); ctx.moveTo(x, 24); ctx.lineTo(x, H - 24); ctx.stroke(); }
  for (let y = 24; y < H - 24; y += 48) { ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(W - 24, y); ctx.stroke(); }

  // Cavern walls
  for (const w of walls) {
    ctx.fillStyle = "#1e293b"; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 2; ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Crystals
  for (const c of crystals) {
    if (c.got) continue;
    const pulse = 1 + Math.sin(animT * 5 + c.x) * 0.15;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = "#4ade80";
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, 0); ctx.lineTo(0, 12); ctx.lineTo(-9, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#bbf7d0"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  // Sparks
  for (const s of sparks) {
    ctx.fillStyle = `rgba(249,115,22,${Math.max(0, s.life * 4)})`;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }

  // Player drone
  ctx.fillStyle = "#38d6ff";
  ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.strokeRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);

  ctx.restore();

  // Corner mini-radar
  const rx = 404, ry = 12, rs = 96;
  ctx.fillStyle = "rgba(10,14,24,0.82)"; ctx.fillRect(rx, ry, rs, rs);
  ctx.strokeStyle = "#2d5b7b"; ctx.lineWidth = 1.5; ctx.strokeRect(rx, ry, rs, rs);
  ctx.fillStyle = "#475569";
  for (const w of walls) ctx.fillRect(rx + (w.x / W) * rs, ry + (w.y / H) * rs, (w.w / W) * rs, (w.h / H) * rs);
  ctx.fillStyle = "#4ade80";
  for (const c of crystals) if (!c.got) ctx.fillRect(rx + (c.x / W) * rs - 2, ry + (c.y / H) * rs - 2, 4, 4);
  ctx.fillStyle = "#38d6ff";
  ctx.fillRect(rx + (p.x / W) * rs - 2.5, ry + (p.y / H) * rs - 2.5, 5, 5);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CAVERNE EXPLORÉE !" : "COQUE BRISÉE / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
