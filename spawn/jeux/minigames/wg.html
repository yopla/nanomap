<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Escarmouche Labyrinthe (WG)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 12px; gap: 6px; flex-wrap: wrap; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: pointer; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "wg",
  "name": "Escarmouche Labyrinthe (WG)",
  "family": "tactical",
  "icon": "⚔️",
  "controls": "Clic sur unité cyan pour sélectionner, case adjacente pour bouger (-1 AP), ennemi rouge en ligne de vue pour tirer (-3 AP)",
  "description": "Escarmouche tactique d'escouade dans un labyrinthe 13x13 inspirée de wg.as.",
  "goal": "Neutraliser toutes les tourelles rouges adverses.",
  "fields": [
    { "key": "mazeSize", "label": "Taille grille", "type": "number", "default": 13 }
  ]
}
</script>
<div class="bar">
  <span>⚔️ <b>Escarmouche WG</b></span>
  <span id="stat">Tour 1</span>
  <div>
    <button onclick="endTurn()">⏭ Fin de Tour</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "wg";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const N = 13, CS = 512 / N;
let maze = [], allies = [], enemies = [], sel = 0, turn = 1, score = 0, won = false, over = false, lastShot = null;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function hasLOS(ax, ay, bx, by) {
  const steps = Math.max(Math.abs(bx - ax), Math.abs(by - ay)) * 4;
  let hits = 0;
  for (let i = 1; i < steps; i++) {
    const x = Math.round(ax + ((bx - ax) * i) / steps);
    const y = Math.round(ay + ((by - ay) * i) / steps);
    if (maze[y][x] === 1) hits++;
  }
  return hits < 2;
}

function resetGame() {
  turn = 1; score = 0; won = false; over = false; sel = 0; lastShot = null;
  maze = Array.from({ length: N }, (_, y) => Array.from({ length: N }, (_, x) => (x === 0 || y === 0 || x === N - 1 || y === N - 1) ? 1 : 0));
  for (let y = 2; y < N - 2; y += 2) for (let x = 2; x < N - 2; x += 2) {
    if (Math.random() < 0.72) maze[y][x] = 1;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    const [dx, dy] = dirs[Math.floor(Math.random() * 4)];
    if (Math.random() < 0.45) maze[y + dy][x + dx] = 1;
  }
  const free = [];
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) if (maze[y][x] === 0) free.push({ x, y });
  free.sort(() => Math.random() - 0.5);
  allies = free.slice(0, 4).map(p => ({ x: p.x, y: p.y, ap: 6 }));
  enemies = free.slice(4, 10).map(p => ({ x: p.x, y: p.y }));
  draw();
}

function endTurn() {
  if (over) return;
  for (const e of enemies) {
    if (allies.length === 0) break;
    let best = null, bd = 999;
    for (const a of allies) {
      const d = Math.hypot(a.x - e.x, a.y - e.y);
      if (d < bd && hasLOS(e.x, e.y, a.x, a.y)) { bd = d; best = a; }
    }
    if (best && Math.random() < 0.55) {
      lastShot = { ax: e.x, ay: e.y, bx: best.x, by: best.y, col: "#f87171" };
      allies = allies.filter(a => a !== best);
    }
  }
  turn++;
  for (const a of allies) a.ap = 6;
  sel = Math.min(sel, Math.max(0, allies.length - 1));
  if (allies.length === 0) { over = true; won = false; }
  draw();
}

window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); endTurn(); } });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  const gx = Math.floor(((e.clientX - r.left) * (512 / r.width)) / CS);
  const gy = Math.floor(((e.clientY - r.top) * (512 / r.height)) / CS);
  const ai = allies.findIndex(a => a.x === gx && a.y === gy);
  if (ai !== -1) { sel = ai; draw(); return; }
  const cur = allies[sel];
  if (!cur) return;
  const ei = enemies.findIndex(en => en.x === gx && en.y === gy);
  if (ei !== -1) {
    if (cur.ap >= 3 && hasLOS(cur.x, cur.y, gx, gy)) {
      cur.ap -= 3;
      lastShot = { ax: cur.x, ay: cur.y, bx: gx, by: gy, col: "#38d6ff" };
      enemies.splice(ei, 1);
      score += 40;
      if (enemies.length === 0) { over = true; won = true; score += 100; }
    }
    draw(); return;
  }
  if (maze[gy] && maze[gy][gx] === 0 && Math.abs(gx - cur.x) + Math.abs(gy - cur.y) === 1 && cur.ap >= 1) {
    cur.x = gx; cur.y = gy; cur.ap -= 1;
    draw();
  }
});

function draw() {
  const cur = allies[sel];
  document.getElementById("stat").textContent = `Tour ${turn} • Alliés:${allies.length} Ennemis:${enemies.length} • AP:${cur ? cur.ap : 0}`;
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = maze[y][x] === 1 ? "#1e293b" : "#0f172a";
    ctx.fillRect(x * CS + 1, y * CS + 1, CS - 2, CS - 2);
  }
  if (cur && !over) {
    for (const en of enemies) {
      const ok = hasLOS(cur.x, cur.y, en.x, en.y);
      ctx.strokeStyle = ok ? "rgba(74,222,128,0.45)" : "rgba(250,204,21,0.18)";
      ctx.setLineDash([4, 4]); ctx.beginPath();
      ctx.moveTo(cur.x * CS + CS/2, cur.y * CS + CS/2);
      ctx.lineTo(en.x * CS + CS/2, en.y * CS + CS/2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  if (lastShot) {
    ctx.strokeStyle = lastShot.col; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lastShot.ax * CS + CS/2, lastShot.ay * CS + CS/2);
    ctx.lineTo(lastShot.bx * CS + CS/2, lastShot.by * CS + CS/2); ctx.stroke(); ctx.lineWidth = 1;
  }
  for (let i = 0; i < allies.length; i++) {
    const a = allies[i];
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(a.x * CS + CS/2, a.y * CS + CS/2, CS*0.32, 0, Math.PI*2); ctx.fill();
    if (i === sel) { ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1; }
  }
  for (const en of enemies) {
    ctx.fillStyle = "#f87171";
    ctx.fillRect(en.x * CS + 7, en.y * CS + 7, CS - 14, CS - 14);
  }
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEUR SÉCURISÉ !" : "ESCOUADE PERDUE", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
}
resetGame();
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
