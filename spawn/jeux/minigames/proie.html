<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Biosphère Trophique (Proie)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #060911; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: pointer; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "proie",
  "name": "Biosphère Trophique (Proie)",
  "family": "zooEcosys",
  "icon": "🌿",
  "controls": "Clic gauche = pluie nutritive (plantes) • Clic droit / Espace = onde répulsive prédateurs",
  "description": "Chaîne alimentaire à 3 niveaux (Plantes vertes, Herbivores bleus, Carnivores rouges) + courbe en direct.",
  "goal": "Maintenir les 3 espèces vivantes simultanément pendant 25 secondes.",
  "fields": [
    { "key": "surviveSec", "label": "Durée d'équilibre (s)", "type": "number", "default": 25 }
  ]
}
</script>
<div class="bar">
  <span>🌿 <b>Biosphère Proie</b></span>
  <span id="stat">Equilibre: 0/25s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "proie";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const FIELD_H = 420;
let plants = [], herbs = [], carns = [], history = [], hold = 0, targetSec = 25, score = 0, won = false, over = false, pulse = null;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetSec = Number(custom.surviveSec) || 25;
  hold = 0; score = 0; won = false; over = false; history = []; pulse = null;
  plants = Array.from({ length: 65 }, () => ({ x: 16 + Math.random() * 480, y: 16 + Math.random() * (FIELD_H - 32) }));
  herbs = Array.from({ length: 22 }, () => ({ x: 24 + Math.random() * 464, y: 24 + Math.random() * (FIELD_H - 48), hp: 14 }));
  carns = Array.from({ length: 6 }, () => ({ x: 24 + Math.random() * 464, y: 24 + Math.random() * (FIELD_H - 48), hp: 16 }));
}

function repelAt(x, y) {
  pulse = { x, y, r: 10 };
  for (const c of carns) {
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < 140) { c.x = Math.max(10, Math.min(502, c.x + ((c.x - x) / (d || 1)) * 75)); c.y = Math.max(10, Math.min(FIELD_H - 10, c.y + ((c.y - y) / (d || 1)) * 75)); }
  }
}
cv.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  repelAt((e.clientX - r.left) * (512 / r.width), (e.clientY - r.top) * (512 / r.height));
});
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); repelAt(256, FIELD_H / 2); } });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (512 / r.width), y = Math.min(FIELD_H - 12, (e.clientY - r.top) * (512 / r.height));
  if (e.button === 2) { repelAt(x, y); return; }
  for (let i = 0; i < 8; i++) {
    plants.push({ x: Math.max(10, Math.min(502, x + (Math.random() - 0.5) * 60)), y: Math.max(10, Math.min(FIELD_H - 10, y + (Math.random() - 0.5) * 60)) });
  }
});

let last = performance.now(), histAcc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    if (Math.random() < dt * 2.5 && plants.length < 130) {
      plants.push({ x: 16 + Math.random() * 480, y: 16 + Math.random() * (FIELD_H - 32) });
    }
    for (let i = herbs.length - 1; i >= 0; i--) {
      const h = herbs[i]; h.hp -= dt;
      if (h.hp <= 0) { herbs.splice(i, 1); continue; }
      let best = -1, bd = 120;
      for (let pi = 0; pi < plants.length; pi++) { const d = Math.hypot(plants[pi].x - h.x, plants[pi].y - h.y); if (d < bd) { bd = d; best = pi; } }
      if (best !== -1) {
        const a = Math.atan2(plants[best].y - h.y, plants[best].x - h.x);
        h.x += Math.cos(a) * 68 * dt; h.y += Math.sin(a) * 68 * dt;
        if (bd < 10) {
          plants.splice(best, 1); h.hp += 6;
          if (h.hp > 18 && herbs.length < 44) { h.hp = 11; herbs.push({ x: h.x + 6, y: h.y + 6, hp: 11 }); }
        }
      }
    }
    for (let i = carns.length - 1; i >= 0; i--) {
      const c = carns[i]; c.hp -= dt * 0.85;
      if (c.hp <= 0) { carns.splice(i, 1); continue; }
      let best = -1, bd = 140;
      for (let hi = 0; hi < herbs.length; hi++) { const d = Math.hypot(herbs[hi].x - c.x, herbs[hi].y - c.y); if (d < bd) { bd = d; best = hi; } }
      if (best !== -1) {
        const a = Math.atan2(herbs[best].y - c.y, herbs[best].x - c.x);
        c.x += Math.cos(a) * 78 * dt; c.y += Math.sin(a) * 78 * dt;
        if (bd < 12) {
          herbs.splice(best, 1); c.hp += 7;
          if (c.hp > 20 && carns.length < 16) { c.hp = 12; carns.push({ x: c.x - 6, y: c.y + 6, hp: 12 }); }
        }
      }
    }
    if (plants.length > 0 && herbs.length > 0 && carns.length > 0) {
      hold += dt; score = Math.round(hold * 10);
      if (hold >= targetSec) { won = true; over = true; score = 260; }
    } else { over = true; won = false; }
    histAcc += dt;
    if (histAcc >= 0.25) {
      histAcc = 0;
      history.push({ p: plants.length, h: herbs.length, c: carns.length });
      if (history.length > 100) history.shift();
    }
  }
  document.getElementById("stat").textContent = `🌿${plants.length} 🔵${herbs.length} 🔴${carns.length} • ${Math.floor(hold)}/${targetSec}s`;
  ctx.fillStyle = "#060911"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#22c55e"; for (const pl of plants) { ctx.beginPath(); ctx.arc(pl.x, pl.y, 3.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#38bdf8"; for (const h of herbs) { ctx.beginPath(); ctx.arc(h.x, h.y, 5.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#f87171"; for (const c of carns) { ctx.beginPath(); ctx.arc(c.x, c.y, 6.8, 0, Math.PI * 2); ctx.fill(); }
  if (pulse) {
    pulse.r += 240 * dt;
    ctx.beginPath(); ctx.arc(pulse.x, pulse.y, pulse.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56,214,255,0.6)"; ctx.stroke();
    if (pulse.r > 140) pulse = null;
  }
  // Graphe démographique en bas (fidèle à proie.as)
  ctx.fillStyle = "#0e1525"; ctx.fillRect(0, FIELD_H, 512, 92);
  ctx.strokeStyle = "#2d5b7b"; ctx.beginPath(); ctx.moveTo(0, FIELD_H); ctx.lineTo(512, FIELD_H); ctx.stroke();
  for (let i = 1; i < history.length; i++) {
    const x1 = (i - 1) * 5.1, x2 = i * 5.1;
    const drawLine = (k, scale, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x1, 506 - Math.min(82, history[i - 1][k] * scale));
      ctx.lineTo(x2, 506 - Math.min(82, history[i][k] * scale)); ctx.stroke();
    };
    drawLine("p", 0.65, "#22c55e"); drawLine("h", 1.8, "#38bdf8"); drawLine("c", 4.5, "#f87171");
  }
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 150, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "BIOSPHÈRE STABILISÉE !" : "EXTINCTION D'UNE ESPÈCE", 256, 208);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 252);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
