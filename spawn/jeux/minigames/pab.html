<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Tranche-Éclair (PAB)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pab",
  "name": "Tranche-Éclair (PAB)",
  "family": "topMouseHnS",
  "icon": "⚡",
  "controls": "Viser avec la souris et cliquer / toucher pour foncer et trancher tous les ennemis sur la trajectoire",
  "description": "Hack'n'slash éclair (Touch & Kill) : enchaînez les combos en traversant les vagues tout en épargnant les otages verts et en évitant les boules de feu du boss.",
  "goal": "Vaincre le Boss final sans perdre vos 5 boucliers.",
  "fields": [
    { "key": "bossHp", "label": "PV du Boss", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>⚡ <b>Tranche-Éclair (PAB)</b></span>
  <span id="stat">🛡️5 • Combo x0 • Score 0</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pab";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const HIT_RANGE = 34;
const GB = 0, SN = 1, OG = 2, HU = 3, BS = 4, FR = 5, XX = -1;

// Escalating wave sequence inspired directly by pab.as (spawned from bottom to top)
const BASE_SEQ = [
  [XX, BS, XX],
  [XX, XX, XX],
  [HU, GB, HU],
  [HU, OG, HU],
  [XX, XX, XX],
  [HU, XX, HU],
  [OG, XX, OG],
  [XX, OG, XX],
  [XX, XX, XX],
  [GB, SN, GB],
  [SN, XX, SN],
  [XX, SN, XX],
  [XX, XX, GB],
  [XX, GB, XX],
  [GB, XX, XX],
  [GB, GB, GB],
  [GB, XX, GB],
  [GB, GB, GB]
];

let mouse = { x: 256, y: 256 };
let player = { x: 80, y: 360 };
let enemies = [], slashes = [], popups = [];
let seqIdx = 0, spawnTimer = 0, scrollY = 0;
let hp = 5, score = 0, globalCombo = 0, bossMaxHp = 10, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  doSlash(mouse.x, mouse.y);
});

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, alpha: 1 });
}

function spawnEnemy(type, x, y) {
  const e = {
    type, x, y, hp: 1, maxHp: 1, r: 16,
    timer: 0, fireList: [], alpha: 1, angle: -1
  };
  if (type === OG) { e.hp = 2; e.maxHp = 2; e.r = 24; }
  if (type === BS) {
    e.hp = bossMaxHp; e.maxHp = bossMaxHp; e.r = 34;
    const f = spawnEnemy(FR, x, y);
    f.orbitOwner = e;
    e.fireList.push(f);
  }
  if (type === FR) { e.hp = -1; e.r = 13; }
  enemies.push(e);
  return e;
}

function doSlash(dstX, dstY) {
  const srcX = player.x, srcY = player.y;
  const gapX = dstX - srcX, gapY = dstY - srcY;
  const moveDist = Math.hypot(gapX, gapY);
  if (moveDist < 4) return;

  const hits = [];
  for (const en of enemies) {
    if (en.hp === 0) continue;
    const ex = en.x - srcX, ey = en.y - srcY;
    const forward = (gapX * ex + gapY * ey) / moveDist;
    if (forward >= 0 && forward <= moveDist) {
      const side = (gapY * ex - gapX * ey) / moveDist;
      const range = HIT_RANGE + (en.r - 16) * 0.7;
      if (Math.abs(side) <= range) {
        hits.push({ dist: forward, en });
      }
    }
  }
  hits.sort((a, b) => a.dist - b.dist);

  let localCombo = 0;
  for (const h of hits) {
    const en = h.en;
    if (en.type === FR) {
      localCombo = 0; globalCombo = 0;
      hp = Math.max(0, hp - 1);
      score = Math.max(0, score - 10);
      addPopup(en.x, en.y - 16, "-1🛡️", "#f87171");
    } else if (en.type === HU) {
      en.hp = 0;
      localCombo = 0; globalCombo = 0;
      hp = Math.max(0, hp - 1);
      score = Math.max(0, score - 25);
      addPopup(en.x, en.y - 16, "OTAGE! -1🛡️", "#f87171");
    } else {
      en.hp = Math.max(0, en.hp - 1);
      localCombo++;
      globalCombo++;
      const pts = (globalCombo === localCombo ? localCombo : localCombo + 1) * 10;
      score += pts;
      addPopup(en.x, en.y - 16, `+${pts}`, "#38d6ff");

      if (en.type === OG && en.hp > 0) en.r = 18;
      if (en.type === BS) {
        en.r = 16 + Math.sqrt(Math.max(1, en.hp)) * 6;
        if (en.hp >= Math.floor(bossMaxHp * 0.65) && en.fireList.length < 4) {
          const f = spawnEnemy(FR, en.x, en.y);
          f.orbitOwner = en;
          en.fireList.push(f);
        }
        if (en.hp === 0) {
          for (const f of en.fireList) f.hp = 0;
          won = true; over = true;
          score += hp * 40 + 100;
        }
      }
    }
  }
  if (localCombo === 0) globalCombo = 0;

  slashes.push({ x1: srcX, y1: srcY, x2: dstX, y2: dstY, alpha: 1 });
  player.x = Math.max(18, Math.min(494, dstX));
  player.y = Math.max(18, Math.min(494, dstY));
  if (hp <= 0 && !won) over = true;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  bossMaxHp = Math.max(5, Number(custom.bossHp) || 10);
  enemies = []; slashes = []; popups = [];
  seqIdx = BASE_SEQ.length - 1;
  spawnTimer = 0.9;
  hp = 5; score = 0; globalCombo = 0; won = false; over = false;
  player = { x: 84, y: 360 };
  mouse = { x: 256, y: 256 };
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    scrollY = (scrollY + 42 * dt) % 32;
    spawnTimer += dt;
    if (spawnTimer >= 1.35) {
      spawnTimer -= 1.35;
      if (seqIdx >= 0) {
        const row = BASE_SEQ[seqIdx--];
        for (let i = 0; i < 3; i++) {
          if (row[i] !== XX) spawnEnemy(row[i], 512 * (i + 1) / 4, -28);
        }
      }
    }

    for (const en of enemies) {
      if (en.hp === 0) continue;
      if (en.type === GB || en.type === OG || en.type === HU) en.y += 52 * dt;
      else if (en.type === SN) en.y += 135 * dt;
      else if (en.type === BS) {
        if (en.y < 120) en.y += 52 * dt;
        en.timer += dt;
        const cycle = 2.0;
        if (en.timer > 2.2) {
          en.timer -= 2.2;
          if (en.hp < bossMaxHp * 0.75) {
            const shot = spawnEnemy(FR, en.x, en.y);
            shot.angle = Math.atan2(player.y - en.y, player.x - en.x);
          }
        }
        for (let i = 0; i < en.fireList.length; i++) {
          const f = en.fireList[i];
          if (f.hp === 0) continue;
          const rad = i < 2 ? 56 : 92;
          const dir = i < 2 ? 1 : -1;
          const th = (now * 0.0022 * dir) + (i % 2) * Math.PI;
          f.x = en.x + Math.cos(th) * rad;
          f.y = en.y + Math.sin(th) * rad;
        }
      } else if (en.type === FR) {
        if (en.alpha < 1) en.alpha = Math.min(1, en.alpha + dt);
        if (en.angle >= 0) {
          en.x += Math.cos(en.angle) * 78 * dt;
          en.y += Math.sin(en.angle) * 78 * dt;
        }
      }

      // Player contact push / fireball damage (from pab.as)
      const dx = player.x - en.x, dy = player.y - en.y;
      const dist = Math.hypot(dx, dy);
      if (dist < en.r + 12) {
        if (en.type === FR) {
          if (en.alpha >= 1) {
            hp = Math.max(0, hp - 1);
            en.alpha = 0.35;
            addPopup(player.x, player.y - 16, "-1🛡️", "#f87171");
            if (hp <= 0) over = true;
          }
        } else {
          const nx = dx / (dist || 1), ny = dy / (dist || 1);
          player.x = Math.max(16, Math.min(496, en.x + nx * (en.r + 14)));
          player.y = Math.max(16, Math.min(496, en.y + ny * (en.r + 14)));
        }
      }

      // Out of bounds
      if (en.y > 540 || en.x < -40 || en.x > 552 || en.y < -60) {
        if (en.type === HU) {
          score += 25;
          addPopup(Math.max(40, Math.min(472, en.x)), 490, "+25 SAUVÉ", "#4ade80");
        } else if (en.type !== FR && en.type !== BS) {
          hp = Math.max(0, hp - 1);
          addPopup(Math.max(40, Math.min(472, en.x)), 490, "FUITE -1🛡️", "#f87171");
          if (hp <= 0) over = true;
        }
        en.hp = 0;
      }
    }
    enemies = enemies.filter(e => e.hp !== 0);
  }

  for (const s of slashes) s.alpha -= dt * 3.2;
  slashes = slashes.filter(s => s.alpha > 0);
  for (const p of popups) { p.y -= 24 * dt; p.alpha -= dt * 1.1; }
  popups = popups.filter(p => p.alpha > 0);

  document.getElementById("stat").textContent = `🛡️${hp} • Combo x${globalCombo} • Score ${score}`;

  // Corridor background
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#111c30"; ctx.fillRect(76, 0, 360, 512);
  ctx.strokeStyle = "rgba(56,214,255,0.22)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(76, 0); ctx.lineTo(76, 512); ctx.moveTo(436, 0); ctx.lineTo(436, 512); ctx.stroke();
  ctx.strokeStyle = "rgba(56,214,255,0.08)"; ctx.lineWidth = 1;
  for (let y = scrollY; y < 512; y += 32) {
    ctx.beginPath(); ctx.moveTo(76, y); ctx.lineTo(436, y); ctx.stroke();
  }

  // Aim guideline (from pab.as)
  if (!over) {
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle = "rgba(248,113,113,0.45)"; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Enemies
  for (const en of enemies) {
    ctx.save();
    ctx.globalAlpha = en.alpha;
    ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
    if (en.type === GB) { ctx.fillStyle = "rgba(251,146,60,0.28)"; ctx.strokeStyle = "#fb923c"; }
    else if (en.type === SN) { ctx.fillStyle = "rgba(232,121,249,0.28)"; ctx.strokeStyle = "#e879f9"; }
    else if (en.type === OG) { ctx.fillStyle = "rgba(248,113,113,0.32)"; ctx.strokeStyle = "#f87171"; }
    else if (en.type === HU) { ctx.fillStyle = "rgba(74,222,128,0.28)"; ctx.strokeStyle = "#4ade80"; }
    else if (en.type === BS) { ctx.fillStyle = "rgba(239,68,68,0.36)"; ctx.strokeStyle = "#ef4444"; }
    else { ctx.fillStyle = "rgba(250,204,21,0.45)"; ctx.strokeStyle = "#f97316"; }
    ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();

    ctx.fillStyle = "#e6f4ff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    const lbl = en.type === GB ? "G" : en.type === SN ? "S" : en.type === OG ? `O${en.hp}` : en.type === HU ? "♥" : en.type === BS ? `BOSS ${en.hp}` : "🔥";
    ctx.fillText(lbl, en.x, en.y + 4);
    ctx.restore();
  }

  // Player
  ctx.beginPath(); ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.3)"; ctx.fill();
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5; ctx.stroke();

  // Additive SlashEffects (from pab.as)
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const s of slashes) {
    ctx.strokeStyle = `rgba(248,113,113,${s.alpha})`; ctx.lineWidth = 10 * s.alpha;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(253,224,71,${s.alpha})`; ctx.lineWidth = 5 * s.alpha;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${s.alpha})`; ctx.lineWidth = 2 * s.alpha;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  ctx.restore();

  // Score popups
  for (const p of popups) {
    ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "BOSS VAINCU !" : "BOUCLIER DÉTRUIT", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
