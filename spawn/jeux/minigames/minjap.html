<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Donjon Lanterne (MinJap)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "minjap",
  "name": "Donjon Lanterne (MinJap)",
  "family": "topOrthoClav",
  "icon": "🔦",
  "controls": "Flèches / ZQSD ou maintenir clic/doigt dans la direction souhaitée",
  "description": "Donjon procédural multi-salles avec champ de vision par lancer de rayons (FOV), brouillard de guerre persistant et minicarte tactique.",
  "goal": "Explorer le donjon à la lanterne et récupérer les 5 reliques lumineuses en esquivant les sentinelles d'ombre.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 55 },
    { "key": "relicCount", "label": "Reliques", "type": "number", "default": 5 }
  ]
}
</script>
<div class="bar">
  <span>🔦 <b>Donjon MinJap</b></span>
  <span id="stat">Reliques: 0/5 • ♥ 3 • 55s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "minjap";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 32, MH = 32;
const VIEW = 15, TS = 512 / VIEW;
const LIGHT_DIST = 7;

let keys = {};
let map = [];      // 0 = floor, 1 = wall
let tileVar = [];  // subtle visual variation 0..3
let fog = [];      // -1 unvisited, 0 visited, >0 visible intensity
let visible = [];  // boolean per cell
let px = 16, py = 16;
let camX = 9, camY = 9;
let relics = [];
let sentinels = [];
let ptr = null;
let moveCd = 0;
let sentCd = 0;
let timeLeft = 55;
let relicCount = 5;
let gotRelics = 0;
let hp = 3;
let invuln = 0;
let exploredCount = 0;
let score = 0;
let won = false;
let over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr = { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (ptr) setPtr(e); });
window.addEventListener("pointerup", () => { ptr = null; });

const idx = (x, y) => x * MH + y;

function makeRoom(rx, ry, rw, rh, depth) {
  if (rx < 1 || ry < 1 || rx + rw >= MW - 1 || ry + rh >= MH - 1) return;
  for (let x = rx; x < rx + rw; x++) {
    for (let y = ry; y < ry + rh; y++) {
      map[idx(x, y)] = 0;
    }
  }
  if (depth >= 4) return;
  const dirs = [0, 1, 2, 3];
  for (let i = 0; i < 4; i++) {
    if (Math.random() > 0.85) continue;
    const cw = Math.max(3, Math.floor(rw * (0.7 + Math.random() * 0.22)));
    const ch = Math.max(3, Math.floor(rh * (0.7 + Math.random() * 0.22)));
    const di = Math.floor(Math.random() * dirs.length);
    const dir = dirs.splice(di, 1)[0];
    const corLen = 1 + Math.floor(Math.random() * 3);
    let nx = rx, ny = ry;
    if (dir === 0) { // N
      nx = rx + Math.floor(Math.random() * Math.max(1, rw - cw + 1));
      ny = ry - ch - corLen;
      if (nx < 1 || ny < 1 || nx + cw >= MW - 1) continue;
      const cx = nx + Math.floor(Math.random() * cw);
      for (let j = 0; j < corLen; j++) if (ry - 1 - j > 0) map[idx(cx, ry - 1 - j)] = 0;
    } else if (dir === 1) { // W
      nx = rx - cw - corLen;
      ny = ry + Math.floor(Math.random() * Math.max(1, rh - ch + 1));
      if (nx < 1 || ny < 1 || ny + ch >= MH - 1) continue;
      const cy = ny + Math.floor(Math.random() * ch);
      for (let j = 0; j < corLen; j++) if (rx - 1 - j > 0) map[idx(rx - 1 - j, cy)] = 0;
    } else if (dir === 2) { // S
      nx = rx + Math.floor(Math.random() * Math.max(1, rw - cw + 1));
      ny = ry + rh + corLen;
      if (nx < 1 || ny + ch >= MH - 1 || nx + cw >= MW - 1) continue;
      const cx = nx + Math.floor(Math.random() * cw);
      for (let j = 0; j < corLen; j++) if (ry + rh + j < MH - 1) map[idx(cx, ry + rh + j)] = 0;
    } else { // E
      nx = rx + rw + corLen;
      ny = ry + Math.floor(Math.random() * Math.max(1, rh - ch + 1));
      if (nx + cw >= MW - 1 || ny < 1 || ny + ch >= MH - 1) continue;
      const cy = ny + Math.floor(Math.random() * ch);
      for (let j = 0; j < corLen; j++) if (rx + rw + j < MW - 1) map[idx(rx + rw + j, cy)] = 0;
    }
    makeRoom(nx, ny, cw, ch, depth + 1);
  }
}

function updateFOV() {
  visible.fill(false);
  visible[idx(px, py)] = true;
  // Raycast 360 degrees faithful to minJap.as drawFog()
  for (let deg = 0; deg < 360; deg += 2) {
    const rad = deg * Math.PI / 180;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);
    let nx = px + 0.5;
    let ny = py + 0.5;
    for (let step = 0; step < LIGHT_DIST; step++) {
      nx += dx;
      ny += dy;
      const gx = Math.floor(nx);
      const gy = Math.floor(ny);
      if (gx < 0 || gy < 0 || gx >= MW || gy >= MH) break;
      const id = idx(gx, gy);
      visible[id] = true;
      if (map[id] !== 0) break;
    }
  }
  for (let x = 0; x < MW; x++) {
    for (let y = 0; y < MH; y++) {
      const id = idx(x, y);
      if (visible[id]) {
        const dist = Math.abs(px - x) + Math.abs(py - y);
        if (fog[id] === -1) { exploredCount++; score += 1; }
        fog[id] = Math.max(1, LIGHT_DIST - dist);
      } else if (fog[id] > 0) {
        fog[id] = 0;
      }
    }
  }
}

function updateCamera() {
  // Smooth-scroll camera when near viewport edge (faithful to minJap.as charMove)
  if (px - camX < 4) camX = Math.max(0, px - 4);
  if (camX + VIEW - 1 - px < 4) camX = Math.min(MW - VIEW, px + 4 - (VIEW - 1));
  if (py - camY < 4) camY = Math.max(0, py - 4);
  if (camY + VIEW - 1 - py < 4) camY = Math.min(MH - VIEW, py + 4 - (VIEW - 1));
}

function collectFloorCells() {
  const cells = [];
  for (let x = 1; x < MW - 1; x++) {
    for (let y = 1; y < MH - 1; y++) {
      if (map[idx(x, y)] === 0) cells.push({ x, y });
    }
  }
  return cells;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 55;
  relicCount = Math.max(3, Math.round(Number(custom.relicCount) || 5));

  let floors = [];
  for (let attempt = 0; attempt < 10; attempt++) {
    map = new Array(MW * MH).fill(1);
    const rw = 6 + Math.floor(Math.random() * 4);
    const rh = 6 + Math.floor(Math.random() * 4);
    const rx = Math.floor(MW / 2 - rw / 2);
    const ry = Math.floor(MH / 2 - rh / 2);
    makeRoom(rx, ry, rw, rh, 1);
    floors = collectFloorCells();
    if (floors.length >= 120) {
      px = rx + Math.floor(rw / 2);
      py = ry + Math.floor(rh / 2);
      break;
    }
  }

  tileVar = Array.from({ length: MW * MH }, () => Math.floor(Math.random() * 4));
  fog = new Array(MW * MH).fill(-1);
  visible = new Array(MW * MH).fill(false);

  camX = Math.max(0, Math.min(MW - VIEW, px - 7));
  camY = Math.max(0, Math.min(MH - VIEW, py - 7));

  // Place relics spaced out from start
  relics = [];
  const shuffled = floors.slice().sort(() => Math.random() - 0.5);
  for (const c of shuffled) {
    if (relics.length >= relicCount) break;
    if (Math.hypot(c.x - px, c.y - py) < 6) continue;
    if (relics.some(r => Math.hypot(r.x - c.x, r.y - c.y) < 5)) continue;
    relics.push({ x: c.x, y: c.y, got: false });
  }
  while (relics.length < relicCount && shuffled.length > 0) {
    const c = shuffled.pop();
    if (c.x !== px || c.y !== py) relics.push({ x: c.x, y: c.y, got: false });
  }

  // Place 3 patrolling shadow sentinels
  sentinels = [];
  for (const c of shuffled) {
    if (sentinels.length >= 3) break;
    if (Math.hypot(c.x - px, c.y - py) < 8) continue;
    sentinels.push({ x: c.x, y: c.y, dx: 1, dy: 0 });
  }

  gotRelics = 0;
  hp = 3;
  invuln = 0;
  exploredCount = 0;
  score = 0;
  moveCd = 0;
  sentCd = 0;
  won = false;
  over = false;
  updateFOV();
}

function tryMove(dx, dy) {
  const nx = px + dx, ny = py + dy;
  if (nx >= 0 && ny >= 0 && nx < MW && ny < MH && map[idx(nx, ny)] === 0) {
    px = nx; py = ny;
    updateCamera();
    updateFOV();
    for (const r of relics) {
      if (!r.got && r.x === px && r.y === py) {
        r.got = true;
        gotRelics++;
        score += 50;
      }
    }
    if (gotRelics >= relics.length) {
      won = true;
      over = true;
      score += 120 + Math.round(timeLeft * 4);
    }
    return true;
  }
  return false;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    moveCd = Math.max(0, moveCd - dt);
    if (moveCd <= 0) {
      let dx = 0, dy = 0;
      if (keys.ArrowUp || keys.KeyW || keys.KeyZ) dy = -1;
      else if (keys.ArrowDown || keys.KeyS) dy = 1;
      else if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) dx = -1;
      else if (keys.ArrowRight || keys.KeyD) dx = 1;
      else if (ptr) {
        const psx = (px - camX + 0.5) * TS;
        const psy = (py - camY + 0.5) * TS;
        const pdx = ptr.x - psx, pdy = ptr.y - psy;
        if (Math.hypot(pdx, pdy) > 16) {
          if (Math.abs(pdx) > Math.abs(pdy)) dx = Math.sign(pdx);
          else dy = Math.sign(pdy);
        }
      }
      if ((dx !== 0 || dy !== 0) && tryMove(dx, dy)) {
        moveCd = 0.11;
      }
    }

    // Move sentinels periodically
    sentCd += dt;
    if (sentCd >= 0.42) {
      sentCd = 0;
      for (const s of sentinels) {
        const dist = Math.hypot(px - s.x, py - s.y);
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b]) => map[idx(s.x + a, s.y + b)] === 0);
        if (dirs.length > 0) {
          let pick;
          if (dist < 7 && Math.random() < 0.72) {
            dirs.sort((a, b) => Math.hypot(px - (s.x + a[0]), py - (s.y + a[1])) - Math.hypot(px - (s.x + b[0]), py - (s.y + b[1])));
            pick = dirs[0];
          } else {
            const forward = dirs.find(([a,b]) => a === s.dx && b === s.dy);
            pick = (forward && Math.random() < 0.65) ? forward : dirs[Math.floor(Math.random() * dirs.length)];
          }
          s.dx = pick[0]; s.dy = pick[1];
          s.x += s.dx; s.y += s.dy;
        }
      }
    }

    // Check sentinel contact
    if (invuln <= 0) {
      for (const s of sentinels) {
        if (s.x === px && s.y === py) {
          hp--;
          invuln = 1.3;
          if (hp <= 0) { over = true; won = false; }
          break;
        }
      }
    }
  }

  document.getElementById("stat").textContent = `Reliques: ${gotRelics}/${relics.length} • ♥ ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#060911";
  ctx.fillRect(0, 0, 512, 512);

  // Draw visible viewport tiles
  for (let vx = 0; vx < VIEW; vx++) {
    for (let vy = 0; vy < VIEW; vy++) {
      const gx = camX + vx, gy = camY + vy;
      if (gx >= MW || gy >= MH) continue;
      const id = idx(gx, gy);
      const f = fog[id];
      const sx = vx * TS, sy = vy * TS;
      if (f === -1) continue; // unvisited stays pitch black

      const isFloor = map[id] === 0;
      const tv = tileVar[id];
      if (isFloor) {
        ctx.fillStyle = tv % 2 === 0 ? "#17233a" : "#1a2842";
        ctx.fillRect(sx, sy, TS + 0.5, TS + 0.5);
        ctx.strokeStyle = "rgba(56, 214, 255, 0.08)";
        ctx.strokeRect(sx + 0.5, sy + 0.5, TS - 1, TS - 1);
      } else {
        ctx.fillStyle = tv % 2 === 0 ? "#2d3b54" : "#26334a";
        ctx.fillRect(sx, sy, TS + 0.5, TS + 0.5);
        ctx.fillStyle = "#3b4c6b";
        ctx.fillRect(sx + 2, sy + 2, TS - 4, 4);
      }

      // Fog shading overlay
      if (!visible[id]) {
        ctx.fillStyle = "rgba(6, 10, 20, 0.72)";
        ctx.fillRect(sx, sy, TS + 0.5, TS + 0.5);
      } else {
        const shade = Math.max(0, (LIGHT_DIST - f) / (LIGHT_DIST + 2)) * 0.65;
        if (shade > 0.02) {
          ctx.fillStyle = `rgba(6, 10, 20, ${shade.toFixed(2)})`;
          ctx.fillRect(sx, sy, TS + 0.5, TS + 0.5);
        }
      }
    }
  }

  // Draw relics (visible or faint glow if visited)
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.008);
  for (const r of relics) {
    if (r.got) continue;
    const id = idx(r.x, r.y);
    if (fog[id] === -1) continue;
    const vx = r.x - camX, vy = r.y - camY;
    if (vx < 0 || vy < 0 || vx >= VIEW || vy >= VIEW) continue;
    const cx = (vx + 0.5) * TS, cy = (vy + 0.5) * TS;
    ctx.globalAlpha = visible[id] ? 1 : 0.4;
    ctx.fillStyle = "rgba(253, 224, 71, 0.25)";
    ctx.beginPath(); ctx.arc(cx, cy, 10 + pulse * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.moveTo(cx, cy - 9); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx, cy + 9); ctx.lineTo(cx - 8, cy);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Draw sentinels (only when inside current FOV!)
  for (const s of sentinels) {
    if (!visible[idx(s.x, s.y)]) continue;
    const vx = s.x - camX, vy = s.y - camY;
    if (vx < 0 || vy < 0 || vx >= VIEW || vy >= VIEW) continue;
    const cx = (vx + 0.5) * TS, cy = (vy + 0.5) * TS;
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(cx - 4, cy - 3, 2.5, 2.5);
    ctx.fillRect(cx + 2, cy - 3, 2.5, 2.5);
  }

  // Draw explorer character + lantern glow
  const pcx = (px - camX + 0.5) * TS;
  const pcy = (py - camY + 0.5) * TS;
  const grad = ctx.createRadialGradient(pcx, pcy, 4, pcx, pcy, TS * 2.5);
  grad.addColorStop(0, "rgba(56, 214, 255, 0.22)");
  grad.addColorStop(1, "rgba(56, 214, 255, 0)");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(pcx, pcy, TS * 2.5, 0, Math.PI * 2); ctx.fill();

  if (invuln <= 0 || Math.floor(now / 70) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(pcx, pcy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(pcx + 5, pcy - 4, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Corner Minimap (faithful to minJap.as drawMinimap)
  const ms = 4, mx0 = 512 - MW * ms - 10, my0 = 10;
  ctx.fillStyle = "rgba(6, 10, 20, 0.88)";
  ctx.fillRect(mx0 - 2, my0 - 2, MW * ms + 4, MH * ms + 4);
  ctx.strokeStyle = "#2d5b7b";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(mx0 - 2, my0 - 2, MW * ms + 4, MH * ms + 4);
  for (let x = 0; x < MW; x++) {
    for (let y = 0; y < MH; y++) {
      const id = idx(x, y);
      if (fog[id] === -1) continue;
      if (map[id] === 0) {
        ctx.fillStyle = visible[id] ? "rgba(174, 240, 255, 0.7)" : "rgba(148, 163, 184, 0.35)";
        ctx.fillRect(mx0 + x * ms, my0 + y * ms, ms, ms);
      }
    }
  }
  for (const r of relics) {
    if (!r.got && fog[idx(r.x, r.y)] !== -1) {
      ctx.fillStyle = "#fde047";
      ctx.fillRect(mx0 + r.x * ms - 1, my0 + r.y * ms - 1, ms + 2, ms + 2);
    }
  }
  ctx.fillStyle = "#38d6ff";
  ctx.fillRect(mx0 + px * ms - 1, my0 + py * ms - 1, ms + 2, ms + 2);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "RELIQUES RÉCUPÉRÉES !" : "VAINCU / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
