<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Évolution Génétique (Bugg)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "bugg",
  "name": "Évolution Génétique (Bugg)",
  "family": "zooEcosys",
  "icon": "🪲",
  "controls": "Clic / Glisser (ou Flèches/ZQSD + Espace) pour semer des bactéries • B = bordures • E = zone Éden",
  "description": "Algorithme génétique à 6 vecteurs de mouvement : les bugs colorent leur génome, dévorent les bactéries et se reproduisent par mutation.",
  "goal": "Faire prospérer la colonie jusqu'à 22 bugs vivants avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "targetBugs", "label": "Objectif bugs", "type": "number", "default": 22 }
  ]
}
</script>
<div class="bar">
  <span>🪲 <b>Évolution Bugg</b></span>
  <span id="stat">Bugs: 10/22 • Gén: 1 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "bugg";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const FIELD_H = 420;
const GENE_LABELS = ["Av", "+60", "+120", "Arr", "-60", "-120"];
const GENE_COLORS = ["#ff4d6d", "#f59e0b", "#4ade80", "#38bdf8", "#2dd4bf", "#c084fc"];

let bugs = [], bacs = [], ripples = [];
let keys = {}, cursor = { x: 256, y: 210 }, pointerDown = false;
let timeLeft = 45, targetBugs = 22, generation = 1, genTimer = 0, reproductions = 0;
let nutrient = 100, sowCd = 0, eden = true, edenPos = { x: 140, y: 280 }, wrapWalls = true;
let score = 0, won = false, over = false, simAcc = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function geneToColor(gene) {
  let r = 0, g = 0, b = 0, tot = 0;
  for (let j = 0; j < 6; j++) {
    const v = gene[j];
    if (j === 0) r += 255 * v;
    else if (j === 1) { r += 160 * v; g += 150 * v; }
    else if (j === 2) g += 255 * v;
    else if (j === 3) b += 255 * v;
    else if (j === 4) { g += 150 * v; b += 180 * v; }
    else if (j === 5) { r += 170 * v; b += 190 * v; }
    tot += v;
  }
  if (tot <= 0) return "#38d6ff";
  r = Math.min(255, Math.round(r / tot) + 45);
  g = Math.min(255, Math.round(g / tot) + 45);
  b = Math.min(255, Math.round(b / tot) + 45);
  return `rgb(${r},${g},${b})`;
}

function makeBug(x, y, parentGene) {
  const gene = [];
  if (parentGene) {
    const mutIdx = Math.floor(Math.random() * 6);
    for (let j = 0; j < 6; j++) {
      let v = parentGene[j];
      if (j === mutIdx) v = Math.max(0, Math.min(10, v + Math.floor(Math.random() * 5) - 2));
      gene.push(v);
    }
    if (gene.every(v => v === 0)) gene[0] = 3;
  } else {
    for (let j = 0; j < 6; j++) gene.push(Math.floor(Math.random() * 11));
    if (gene[0] < 3) gene[0] = 3 + Math.floor(Math.random() * 5);
  }
  return {
    x, y,
    rot: Math.floor(Math.random() * 6) * 60,
    vel: 6.2,
    radius: 6,
    gene,
    color: geneToColor(gene),
    energy: 420,
    age: 0,
    eaten: 0
  };
}

function sowBacteria(x, y, count) {
  const clampedY = Math.max(10, Math.min(FIELD_H - 10, y));
  const clampedX = Math.max(10, Math.min(502, x));
  for (let i = 0; i < count; i++) {
    if (bacs.length >= 650) break;
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * 36;
    bacs.push({
      x: Math.max(6, Math.min(506, clampedX + Math.cos(ang) * rad)),
      y: Math.max(6, Math.min(FIELD_H - 6, clampedY + Math.sin(ang) * rad)),
      energy: 48
    });
  }
  ripples.push({ x: clampedX, y: clampedY, r: 8, a: 0.9 });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  targetBugs = Number(custom.targetBugs) || 22;
  bugs = []; bacs = []; ripples = [];
  generation = 1; genTimer = 0; reproductions = 0;
  nutrient = 100; sowCd = 0; eden = true; wrapWalls = true;
  edenPos = { x: 140 + Math.random() * 230, y: 120 + Math.random() * 180 };
  score = 0; won = false; over = false; simAcc = 0;

  for (let i = 0; i < 260; i++) {
    bacs.push({ x: 8 + Math.random() * 496, y: 8 + Math.random() * (FIELD_H - 16), energy: 48 });
  }
  for (let i = 0; i < 10; i++) {
    bugs.push(makeBug(60 + Math.random() * 392, 60 + Math.random() * (FIELD_H - 120), null));
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyB") wrapWalls = !wrapWalls;
  if (e.code === "KeyE") { eden = !eden; edenPos = { x: cursor.x, y: Math.min(FIELD_H - 20, cursor.y) }; }
  if (e.code === "Space") {
    e.preventDefault();
    if (over) { sendResultAndExit(won, score); return; }
    if (nutrient >= 14) { nutrient -= 14; sowBacteria(cursor.x, cursor.y, 12); }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = getPos(e);
  cursor.x = pt.x; cursor.y = Math.min(FIELD_H - 10, pt.y);
  if (e.button === 2) { eden = !eden; edenPos = { x: cursor.x, y: cursor.y }; return; }
  pointerDown = true;
  if (nutrient >= 12) { nutrient -= 12; sowBacteria(cursor.x, cursor.y, 12); sowCd = 0.14; }
});
cv.addEventListener("pointermove", (e) => {
  const pt = getPos(e);
  cursor.x = pt.x; cursor.y = Math.min(FIELD_H - 10, pt.y);
});
window.addEventListener("pointerup", () => { pointerDown = false; });
cv.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const pt = getPos(e);
  eden = !eden;
  edenPos = { x: pt.x, y: Math.min(FIELD_H - 12, pt.y) };
});

function stepSimulation() {
  // Natural bacteria regeneration + Eden patch (faithful to bugg.as)
  if (Math.random() < 0.55 && bacs.length < 650) {
    bacs.push({ x: 8 + Math.random() * 496, y: 8 + Math.random() * (FIELD_H - 16), energy: 48 });
  }
  if (eden && Math.random() < 0.7 && bacs.length < 650) {
    bacs.push({
      x: Math.max(8, Math.min(504, edenPos.x + (Math.random() - 0.5) * 68)),
      y: Math.max(8, Math.min(FIELD_H - 8, edenPos.y + (Math.random() - 0.5) * 68)),
      energy: 48
    });
  }

  const newborns = [];
  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    b.age++;
    let tot = 0;
    for (let j = 0; j < 6; j++) tot += b.gene[j];
    const rand = Math.random() * (tot || 1);
    let acc = 0, act = 0;
    for (let j = 0; j < 6; j++) {
      acc += b.gene[j];
      if (rand < acc) { act = j; break; }
    }
    const rad = b.rot * Math.PI / 180;
    if (act === 0) { b.x += Math.cos(rad) * b.vel; b.y += Math.sin(rad) * b.vel; }
    else if (act === 1) { b.rot += 60; }
    else if (act === 2) { b.rot += 120; }
    else if (act === 3) { b.x -= Math.cos(rad) * b.vel; b.y -= Math.sin(rad) * b.vel; }
    else if (act === 4) { b.rot -= 60; }
    else { b.rot -= 120; }

    if (wrapWalls) {
      if (b.x < 6) b.x = 506; else if (b.x > 506) b.x = 6;
      if (b.y < 6) b.y = FIELD_H - 6; else if (b.y > FIELD_H - 6) b.y = 6;
    } else {
      if (b.x < 6) { b.x = 6; b.rot += 180; } else if (b.x > 506) { b.x = 506; b.rot += 180; }
      if (b.y < 6) { b.y = 6; b.rot += 180; } else if (b.y > FIELD_H - 6) { b.y = FIELD_H - 6; b.rot += 180; }
    }

    for (let bi = bacs.length - 1; bi >= 0; bi--) {
      const bac = bacs[bi];
      const dx = bac.x - b.x, dy = bac.y - b.y;
      if (dx * dx + dy * dy < 100) {
        b.energy = Math.min(820, b.energy + bac.energy);
        b.eaten++;
        bacs.splice(bi, 1);
      }
    }

    b.energy -= 1.15;
    if (b.energy <= 0) { bugs.splice(i, 1); continue; }

    if (b.energy >= 540 && b.age >= 95 && bugs.length + newborns.length < 48) {
      const child = makeBug(b.x + (Math.random() - 0.5) * 8, b.y + (Math.random() - 0.5) * 8, b.gene);
      child.energy = Math.floor(b.energy / 2);
      b.energy = Math.floor(b.energy / 2);
      newborns.push(child);
      reproductions++;
    }
  }
  for (const nb of newborns) bugs.push(nb);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    nutrient = Math.min(100, nutrient + dt * 28);
    sowCd = Math.max(0, sowCd - dt);

    const kSpeed = 240;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) cursor.x = Math.max(12, cursor.x - kSpeed * dt);
    if (keys.ArrowRight || keys.KeyD) cursor.x = Math.min(500, cursor.x + kSpeed * dt);
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) cursor.y = Math.max(12, cursor.y - kSpeed * dt);
    if (keys.ArrowDown || keys.KeyS) cursor.y = Math.min(FIELD_H - 12, cursor.y + kSpeed * dt);

    if (pointerDown && sowCd <= 0 && nutrient >= 10) {
      nutrient -= 10;
      sowBacteria(cursor.x, cursor.y, 9);
      sowCd = 0.14;
    }

    genTimer += dt;
    if (genTimer >= 5) { genTimer -= 5; generation++; }

    simAcc += dt;
    while (simAcc >= 1 / 28) {
      simAcc -= 1 / 28;
      stepSimulation();
    }

    score = bugs.length * 10 + reproductions * 12;
    if (bugs.length >= targetBugs) {
      won = true; over = true;
      score += Math.round(timeLeft * 6);
    } else if (bugs.length === 0 || timeLeft <= 0) {
      won = false; over = true;
    }
  }

  document.getElementById("stat").textContent = `Bugs: ${bugs.length}/${targetBugs} • Gén: ${generation} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Arena border indicator
  if (!wrapWalls) {
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 508, FIELD_H - 4);
    ctx.lineWidth = 1;
  }

  // Eden zone highlight
  if (eden) {
    ctx.fillStyle = "rgba(74, 222, 128, 0.08)";
    ctx.strokeStyle = "rgba(74, 222, 128, 0.35)";
    ctx.beginPath(); ctx.arc(edenPos.x, edenPos.y, 38, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Bacteria
  ctx.fillStyle = "#fde047";
  for (const bac of bacs) {
    ctx.fillRect(bac.x - 1.5, bac.y - 1.5, 3, 3);
  }

  // Sow ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += 90 * dt; rp.a -= dt * 1.8;
    if (rp.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(253, 224, 71, ${rp.a})`;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
  }

  // Bugs
  for (const b of bugs) {
    const alpha = b.energy < 220 ? Math.max(0.25, b.energy / 220) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot * Math.PI / 180);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#0a0e18"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(b.radius + 2, 0); ctx.stroke();
    if (b.energy > 460) {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, b.radius + 2.5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // Cursor / sower reticle
  if (!over) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.7)";
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 14, 0, Math.PI * 2); ctx.stroke();
  }

  // Bottom Genetic Telemetry Panel
  ctx.fillStyle = "#101828"; ctx.fillRect(0, FIELD_H, 512, 92);
  ctx.strokeStyle = "#2d5b7b"; ctx.beginPath(); ctx.moveTo(0, FIELD_H); ctx.lineTo(512, FIELD_H); ctx.stroke();

  const avgGene = [0, 0, 0, 0, 0, 0];
  for (const b of bugs) for (let j = 0; j < 6; j++) avgGene[j] += b.gene[j];
  const maxG = Math.max(1, ...avgGene);
  ctx.font = "11px monospace"; ctx.textAlign = "center";
  for (let j = 0; j < 6; j++) {
    const bx = 24 + j * 56;
    const h = Math.round((avgGene[j] / maxG) * 44);
    ctx.fillStyle = GENE_COLORS[j];
    ctx.fillRect(bx, FIELD_H + 62 - h, 34, h);
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(GENE_LABELS[j], bx + 17, FIELD_H + 78);
  }

  // Nutrient & toggles HUD
  ctx.textAlign = "left"; ctx.fillStyle = "#e6f4ff"; ctx.font = "11px sans-serif";
  ctx.fillText(`Nutriments: ${Math.round(nutrient)}%`, 368, FIELD_H + 24);
  ctx.fillStyle = "#1e293b"; ctx.fillRect(368, FIELD_H + 30, 128, 10);
  ctx.fillStyle = "#fde047"; ctx.fillRect(368, FIELD_H + 30, 128 * (nutrient / 100), 10);
  ctx.fillStyle = "#94a3b8";
  ctx.fillText(`Murs [B]: ${wrapWalls ? "Tore" : "Fermé"}`, 368, FIELD_H + 58);
  ctx.fillText(`Éden [E]: ${eden ? "Actif" : "Off"} • Naiss: ${reproductions}`, 368, FIELD_H + 76);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.86)"; ctx.fillRect(0, 155, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "COLONIE ÉVOLUÉE !" : (bugs.length === 0 ? "EXTINCTION TOTALE" : "TEMPS ÉCOULÉ"), 256, 212);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} (${bugs.length} bugs, ${reproductions} mutations) — Cliquez pour quitter`, 256, 256);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
