<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Vague de Zombies (Zombies)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "zombies",
  "name": "Vague de Zombies (Zombies)",
  "family": "income",
  "icon": "🧟",
  "controls": "Flèches / ZQSD ou Souris pour guider le survivant • Clic / Espace = Flash EMP répulsif",
  "description": "Champ de distance BFS lumineux en temps réel : la lueur de votre balise contourne les murs tandis que les orbes zombies descendent le gradient pour vous traquer.",
  "goal": "Récupérer les 8 noyaux dorés dans le dédale sans perdre vos 3 vies.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "coreCount", "label": "Noyaux à récupérer", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🧟 <b>Vague Zombies</b></span>
  <span id="stat">Noyaux: 0/8 • ❤️3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "zombies";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const MW = 24, MH = 24, CW = 512 / MW, CH = 512 / MH;

let grid = new Uint8Array(MW * MH);
let cost = new Int16Array(MW * MH);
let fillMark = new Int32Array(MW * MH);
let curFill = 1;
const qx = new Int16Array(MW * MH);
const qy = new Int16Array(MW * MH);
const qd = new Int16Array(MW * MH);

let player = { x: 256, y: 256 }, orbs = [], cores = [];
let keys = {}, mouseTarget = null, empCd = 0, empWave = null;
let timeLeft = 45, targetCores = 8, collected = 0, hp = 3, invuln = 0;
let score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function getTile(x, y) {
  if (x < 0 || x >= MW || y < 0 || y >= MH) return 1;
  return grid[y * MW + x];
}
function setTile(x, y, v) {
  if (x >= 0 && x < MW && y >= 0 && y < MH) grid[y * MW + x] = v;
}

// Faithful BFS light/distance field from gc3N.as (fillTile)
function fillField(sx, sy) {
  sx = Math.max(0, Math.min(MW - 1, sx | 0));
  sy = Math.max(0, Math.min(MH - 1, sy | 0));
  curFill++;
  cost.fill(999);
  if (getTile(sx, sy) > 0) return;

  let head = 0, tail = 0;
  qx[tail] = sx; qy[tail] = sy; qd[tail] = 0; tail++;
  fillMark[sy * MW + sx] = curFill;

  while (head < tail) {
    const cx = qx[head], cy = qy[head], cd = qd[head]; head++;
    cost[cy * MW + cx] = cd;
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (let i = 0; i < 4; i++) {
      const nx = cx + dirs[i][0], ny = cy + dirs[i][1];
      if (nx < 0 || nx >= MW || ny < 0 || ny >= MH) continue;
      const idx = ny * MW + nx;
      if (grid[idx] > 0 || fillMark[idx] === curFill) continue;
      fillMark[idx] = curFill;
      qx[tail] = nx; qy[tail] = ny; qd[tail] = cd + 1; tail++;
    }
  }
}

// Faithful gradient descent from gc3N.as (findDir)
function findDir(gx, gy) {
  if (gx < 0 || gx >= MW || gy < 0 || gy >= MH) return null;
  let best = cost[gy * MW + gx];
  let bestAng = null;
  const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (let i = 0; i < 4; i++) {
    const nx = gx + dirs[i][0], ny = gy + dirs[i][1];
    if (getTile(nx, ny) > 0) continue;
    const d = cost[ny * MW + nx];
    if (d < best) {
      best = d;
      bestAng = Math.atan2(dirs[i][1], dirs[i][0]);
    }
  }
  return bestAng;
}

function randomFreeCell(minDistFromPlayer) {
  for (let tries = 0; tries < 200; tries++) {
    const gx = 1 + Math.floor(Math.random() * (MW - 2));
    const gy = 1 + Math.floor(Math.random() * (MH - 2));
    if (getTile(gx, gy) > 0) continue;
    const px = (gx + 0.5) * CW, py = (gy + 0.5) * CH;
    if (minDistFromPlayer && Math.hypot(px - player.x, py - player.y) < minDistFromPlayer) continue;
    if (cost[gy * MW + gx] >= 999) continue;
    return { x: px, y: py };
  }
  return { x: CW * 2.5, y: CH * 2.5 };
}

function triggerEmp() {
  if (over || empCd > 0) return;
  empCd = 3.2;
  empWave = { x: player.x, y: player.y, r: 10 };
  for (const o of orbs) {
    const d = Math.hypot(o.x - player.x, o.y - player.y);
    if (d < 120) {
      const sp = randomFreeCell(200);
      o.x = sp.x; o.y = sp.y;
    }
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  targetCores = Number(custom.coreCount) || 8;
  collected = 0; hp = 3; invuln = 0; empCd = 0; empWave = null;
  score = 0; won = false; over = false; mouseTarget = null;

  grid.fill(0);
  // Structured corridors inspired by gc3N.as
  for (let i = 0; i < 6; i++) {
    setTile(4, 3 + i, 1);
    setTile(4, 13 + i, 1);
    setTile(4 + i, 3, 1);
    setTile(8 + i, 7, 1);
    setTile(7 + i, 18, 1);
    setTile(13 + i, 15, 1);
    setTile(18, 6 + i, 1);
  }
  for (let i = 0; i < 55; i++) {
    const rx = Math.floor(Math.random() * MW), ry = Math.floor(Math.random() * MH);
    if (Math.abs(rx - 12) <= 2 && Math.abs(ry - 12) <= 2) continue;
    setTile(rx, ry, 1);
  }

  player = { x: 12.5 * CW, y: 12.5 * CH };
  fillField(12, 12);

  orbs = [];
  for (let i = 0; i < 11; i++) {
    const p = randomFreeCell(150);
    orbs.push({ x: p.x, y: p.y, spd: 58 + Math.random() * 26 });
  }
  cores = [];
  for (let i = 0; i < targetCores; i++) {
    cores.push(randomFreeCell(90));
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyW", "KeyA", "KeyS", "KeyD", "KeyZ", "KeyQ"].includes(e.code)) {
    mouseTarget = null;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (over) { sendResultAndExit(won, score); return; }
    triggerEmp();
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  mouseTarget = getPos(e);
  triggerEmp();
});
cv.addEventListener("pointermove", (e) => {
  if (!over) mouseTarget = getPos(e);
});

function canMoveTo(nx, ny, rad) {
  const pts = [[-rad, -rad], [rad, -rad], [-rad, rad], [rad, rad]];
  for (const [ox, oy] of pts) {
    if (getTile(Math.floor((nx + ox) / CW), Math.floor((ny + oy) / CH)) > 0) return false;
  }
  return true;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { won = false; over = true; }
    if (empCd > 0) empCd = Math.max(0, empCd - dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;

    if (dx === 0 && dy === 0 && mouseTarget) {
      const mdx = mouseTarget.x - player.x, mdy = mouseTarget.y - player.y;
      if (Math.hypot(mdx, mdy) > 6) { dx = mdx; dy = mdy; }
    }
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const spd = 155;
      const vx = (dx / len) * spd * dt;
      const vy = (dy / len) * spd * dt;
      if (canMoveTo(player.x + vx, player.y, 6.5)) player.x += vx;
      if (canMoveTo(player.x, player.y + vy, 6.5)) player.y += vy;
    }

    fillField(Math.floor(player.x / CW), Math.floor(player.y / CH));

    // Move zombie orbs along BFS gradient
    for (const o of orbs) {
      const gx = Math.floor(o.x / CW), gy = Math.floor(o.y / CH);
      const ang = findDir(gx, gy);
      if (ang !== null) {
        // Slight centering toward tile corridor so orbs glide smoothly around corners
        const cx = (gx + 0.5) * CW, cy = (gy + 0.5) * CH;
        let mx = Math.cos(ang) * o.spd * dt;
        let my = Math.sin(ang) * o.spd * dt;
        if (Math.abs(Math.cos(ang)) > 0.5) my += (cy - o.y) * 4 * dt;
        else mx += (cx - o.x) * 4 * dt;
        if (canMoveTo(o.x + mx, o.y, 5)) o.x += mx;
        if (canMoveTo(o.x, o.y + my, 5)) o.y += my;
      }
      if (invuln <= 0 && Math.hypot(o.x - player.x, o.y - player.y) < 15) {
        hp--;
        invuln = 1.4;
        const sp = randomFreeCell(190);
        o.x = sp.x; o.y = sp.y;
        if (hp <= 0) { won = false; over = true; }
      }
    }

    // Collect cores
    for (let i = cores.length - 1; i >= 0; i--) {
      if (Math.hypot(cores[i].x - player.x, cores[i].y - player.y) < 16) {
        cores.splice(i, 1);
        collected++;
        score = collected * 35 + hp * 20;
        if (collected >= targetCores) {
          won = true; over = true;
          score += Math.round(timeLeft * 5);
        }
      }
    }
  }

  document.getElementById("stat").textContent = `Noyaux: ${collected}/${targetCores} • ❤️${hp} • EMP:${empCd > 0 ? Math.ceil(empCd) + "s" : "OK"} • ${Math.ceil(timeLeft)}s`;

  // Render BFS light-gradient grid (faithful to gc3N.as)
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      const idx = y * MW + x;
      const ax = x * CW, ay = y * CH;
      if (grid[idx] > 0) {
        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(ax + 1, ay + 1, CW - 2, CH - 2);
        ctx.strokeStyle = "#f87171";
        ctx.strokeRect(ax + 1.5, ay + 1.5, CW - 3, CH - 3);
      } else {
        const d = cost[idx];
        const light = d >= 999 ? 0 : Math.max(0, 255 - d * 12);
        const r = Math.round(8 + light * 0.06);
        const g = Math.round(14 + light * 0.34);
        const b = Math.round(28 + light * 0.72);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(ax, ay, CW + 0.5, CH + 0.5);
      }
    }
  }

  // Golden cores
  for (const c of cores) {
    ctx.fillStyle = "rgba(253, 224, 71, 0.25)";
    ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(c.x, c.y, 5.5, 0, Math.PI * 2); ctx.fill();
  }

  // Zombie orbs
  for (const o of orbs) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(o.x, o.y, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#0a0e18"; ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = "#4ade80";
    ctx.beginPath(); ctx.arc(o.x, o.y, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.lineWidth = 1;

  // EMP ring
  if (empWave) {
    empWave.r += 320 * dt;
    ctx.strokeStyle = `rgba(56, 214, 255, ${Math.max(0, 1 - empWave.r / 130)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(empWave.x, empWave.y, empWave.r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    if (empWave.r > 130) empWave = null;
  }

  // Player beacon
  ctx.save();
  if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(player.x, player.y, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.86)"; ctx.fillRect(0, 175, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "DÉDALE PURGÉ !" : (hp <= 0 ? "SUBMERGÉ PAR LA HORDE" : "TEMPS ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 274);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
