<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sonde Caverne (Bon)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "bon",
  "name": "Sonde Caverne (Bon)",
  "family": "sideClavSimple",
  "icon": "🧭",
  "controls": "Flèches / ZQSD pour piloter, Souris ou Toucher pour orienter et guider la sonde",
  "description": "Exploration d'une caverne creusée avec sonde de répulsion directionnelle et glisse murale.",
  "goal": "Collecter les 6 balises dorées avant la fin du chrono sans toucher les mines.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🧭 <b>Sonde Bon</b></span>
  <span id="stat">Balises: 0/6 • Vies: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "bon";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const GRID = 128; // 4px per cell -> 512x512
const CELL = 4;
let wallGrid = new Uint8Array(GRID * GRID);
let caveCanvas = document.createElement("canvas");
caveCanvas.width = 512; caveCanvas.height = 512;
let caveCtx = caveCanvas.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let p = {}, beacons = [], mines = [];
let timeLeft = 45, score = 0, hp = 3, invuln = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => {
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
window.addEventListener("pointerup", () => { down = false; });

function carveRect(x, y, w, h) {
  const x0 = Math.max(2, Math.floor(x / CELL));
  const y0 = Math.max(2, Math.floor(y / CELL));
  const x1 = Math.min(GRID - 2, Math.ceil((x + w) / CELL));
  const y1 = Math.min(GRID - 2, Math.ceil((y + h) / CELL));
  for (let gy = y0; gy < y1; gy++) {
    for (let gx = x0; gx < x1; gx++) {
      wallGrid[gy * GRID + gx] = 0;
    }
  }
}

function carveCorridor(x1, y1, x2, y2, radius) {
  const steps = Math.max(12, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 8));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const cx = x1 + (x2 - x1) * t;
    const cy = y1 + (y2 - y1) * t;
    carveRect(cx - radius, cy - radius, radius * 2, radius * 2);
  }
}

function isWall(ax, ay) {
  if (ax < 6 || ay < 6 || ax >= 506 || ay >= 506) return true;
  const gx = Math.floor(ax / CELL);
  const gy = Math.floor(ay / CELL);
  return wallGrid[gy * GRID + gx] > 0;
}

function isStuck(ax, ay) {
  if (isWall(ax, ay)) return true;
  if (!isWall(ax + 8, ay)) return false;
  if (!isWall(ax - 8, ay)) return false;
  if (!isWall(ax, ay + 8)) return false;
  if (!isWall(ax, ay - 8)) return false;
  return true;
}

function buildCave() {
  wallGrid.fill(1);
  // Carve 95 random rooms (faithful to bon.as bitmap carving)
  for (let i = 0; i < 95; i++) {
    const rw = 20 + Math.random() * 64;
    const rh = 20 + Math.random() * 64;
    const rx = 16 + Math.random() * (480 - rw);
    const ry = 16 + Math.random() * (480 - rh);
    carveRect(rx, ry, rw, rh);
  }
  // Center spawn room
  carveRect(216, 216, 80, 80);

  // Place 6 beacons in distinct sectors and guarantee corridors from center
  beacons = [];
  const sectors = [
    { x: 75, y: 75 }, { x: 435, y: 75 },
    { x: 75, y: 256 }, { x: 435, y: 256 },
    { x: 85, y: 435 }, { x: 425, y: 435 }
  ];
  for (const s of sectors) {
    const bx = s.x + (Math.random() - 0.5) * 44;
    const by = s.y + (Math.random() - 0.5) * 44;
    carveRect(bx - 26, by - 26, 52, 52);
    carveCorridor(256, 256, bx, by, 18);
    beacons.push({ x: bx, y: by, done: false, phase: Math.random() * 6.28 });
  }
  // Cross-connect some sectors for fun loops
  carveCorridor(beacons[0].x, beacons[0].y, beacons[1].x, beacons[1].y, 14);
  carveCorridor(beacons[4].x, beacons[4].y, beacons[5].x, beacons[5].y, 14);

  // Place 4 mines away from spawn and beacons
  mines = [];
  for (let attempt = 0; attempt < 200 && mines.length < 4; attempt++) {
    const x = 48 + Math.random() * 416;
    const y = 48 + Math.random() * 416;
    if (isWall(x, y)) continue;
    if (Math.hypot(x - 256, y - 256) < 85) continue;
    if (beacons.some(b => Math.hypot(b.x - x, b.y - y) < 62)) continue;
    if (mines.some(m => Math.hypot(m.x - x, m.y - y) < 80)) continue;
    mines.push({ x, y, r: 9, phase: Math.random() * 6.28 });
  }

  // Pre-render cave bitmap
  caveCtx.fillStyle = "#0d1422";
  caveCtx.fillRect(0, 0, 512, 512);
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      if (wallGrid[gy * GRID + gx]) {
        const edge =
          (gx > 0 && !wallGrid[gy * GRID + gx - 1]) ||
          (gx < GRID - 1 && !wallGrid[gy * GRID + gx + 1]) ||
          (gy > 0 && !wallGrid[(gy - 1) * GRID + gx]) ||
          (gy < GRID - 1 && !wallGrid[(gy + 1) * GRID + gx]);
        caveCtx.fillStyle = edge ? "#2d5b7b" : "#18263d";
        caveCtx.fillRect(gx * CELL, gy * CELL, CELL, CELL);
      }
    }
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  p = { x: 256, y: 256, vx: 0, vy: 0, ang: Math.PI / 2, probeX: 256, probeY: 274 };
  score = 0; hp = 3; invuln = 0; won = false; over = false;
  buildCave();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Orient probe toward pointer when moving mouse or touching
    if (down) {
      p.ang = Math.atan2(my - p.y, mx - p.x);
    } else if (keys.KeyE) {
      p.ang += 0.08 * step;
    } else if (keys.KeyF) {
      p.ang -= 0.08 * step;
    }

    // Faithful bon.as inertia + directional pull
    const damp = Math.pow(0.9, step);
    p.vx *= damp;
    p.vy *= damp;
    p.vx += Math.cos(p.ang) * 0.22 * step;
    p.vy += Math.sin(p.ang) * 0.22 * step;

    const ms = 3.8;
    if (keys.ArrowRight || keys.KeyD) p.vx = ms;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) p.vx = -ms;
    if (keys.ArrowDown || keys.KeyS) p.vy = ms;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) p.vy = -ms;
    if (down) {
      const dx = mx - p.x, dy = my - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 10) {
        p.vx = (dx / dist) * ms;
        p.vy = (dy / dist) * ms;
      }
    }

    let dvx = p.vx * step, dvy = p.vy * step;
    if (isStuck(p.x + dvx, p.y + dvy)) {
      if (!isStuck(p.x + dvx, p.y)) { dvy = 0; p.vy = 0; }
      else if (!isStuck(p.x, p.y + dvy)) { dvx = 0; p.vx = 0; }
      else { dvx = 0; dvy = 0; p.vx = 0; p.vy = 0; }
    }
    p.x += dvx; p.y += dvy;

    // Faithful 16-step directional feeler raycast & surface cushion pushback
    let ax = p.x, ay = p.y, wx = 0, wy = 0, k = 0;
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang);
    for (let i = 0; i < 18; i++) {
      ax += ca; ay += sa;
      if (isWall(ax, ay)) {
        wx -= ca * step;
        wy -= sa * step;
        k++;
        if (k >= 4) break;
      }
    }
    p.probeX = ax; p.probeY = ay;
    if (isStuck(p.x + wx, p.y + wy)) {
      if (!isStuck(p.x + wx, p.y)) wy = 0;
      else if (!isStuck(p.x, p.y + wy)) wx = 0;
      else { wx = 0; wy = 0; }
    }
    p.x += wx; p.y += wy;

    // Beacons
    for (const b of beacons) {
      if (!b.done && Math.hypot(p.x - b.x, p.y - b.y) < 18) {
        b.done = true;
        score += 50;
      }
    }
    if (beacons.every(b => b.done)) {
      won = true; over = true;
      score += Math.round(timeLeft * 5);
    }

    // Mines
    if (invuln <= 0) {
      for (const m of mines) {
        if (Math.hypot(p.x - m.x, p.y - m.y) < m.r + 7) {
          hp--;
          invuln = 1.2;
          const a = Math.atan2(p.y - m.y, p.x - m.x);
          p.vx = Math.cos(a) * 5;
          p.vy = Math.sin(a) * 5;
          if (hp <= 0) { over = true; won = false; }
          break;
        }
      }
    }
  }

  const doneN = beacons.filter(b => b.done).length;
  document.getElementById("stat").textContent = `Balises: ${doneN}/${beacons.length} • Vies: ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.drawImage(caveCanvas, 0, 0);

  // Draw beacons
  for (const b of beacons) {
    if (b.done) continue;
    const pulse = 8 + Math.sin(now * 0.006 + b.phase) * 2.5;
    ctx.strokeStyle = "rgba(253,224,71,0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, pulse + 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI * 2); ctx.fill();
  }

  // Draw mines
  for (const m of mines) {
    const pulse = 1 + Math.sin(now * 0.009 + m.phase) * 0.2;
    ctx.fillStyle = "rgba(248,113,113,0.22)";
    ctx.beginPath(); ctx.arc(m.x, m.y, (m.r + 5) * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f87171";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Draw probe raycast line
  ctx.strokeStyle = "#aef0ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.probeX, p.probeY); ctx.stroke();

  // Draw player
  const blink = invuln > 0 && Math.floor(now / 80) % 2 === 0;
  ctx.fillStyle = blink ? "#f87171" : "#38d6ff";
  ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CAVERNE EXPLORÉE !" : (hp <= 0 ? "SONDE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
