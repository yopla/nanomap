<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Zone de Verrouillage (Hit)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "hit",
  "name": "Zone de Verrouillage (Hit)",
  "family": "topOrthoClav",
  "icon": "🎯",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour déplacer le capteur)",
  "description": "Détection de chevauchement AABB et confinement de zone pour décoder des signaux.",
  "goal": "Maintenir le verrouillage sur 8 cibles dans la zone active avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>🎯 <b>Verrouillage Hit</b></span>
  <span id="stat">Cibles: 0/8 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "hit";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const ZX = 56, ZY = 44, ZW = 400, ZH = 360, TARGETS = 8;
let keys = {}, cx = 256, cy = 224, gx = 320, gy = 260, gvx = 90, gvy = 70;
let lockAlpha = 0, lockedCount = 0, sigText = "";
let down = false, mx = 256, my = 224;
let timeLeft = 40, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

// Faithful hit.as predicates
function isInside(ax, ay, rx, ry, rw, rh) {
  return !(ax < rx || ay < ry || ax > rx + rw || ay > ry + rh);
}
function isOver(ax, ay, aw, ah, rx, ry, rw, rh) {
  return !((ax + aw < rx - rw) || (ay + ah < ry - rh) || (ax - aw > rx + rw) || (ay - ah > ry + rh));
}

function spawnTarget() {
  gx = ZX + 40 + Math.random() * (ZW - 80);
  gy = ZY + 40 + Math.random() * (ZH - 80);
  const spd = 85 + lockedCount * 22;
  const ang = Math.random() * Math.PI * 2;
  gvx = Math.cos(ang) * spd;
  gvy = Math.sin(ang) * spd;
  sigText = "";
  for (let i = 0; i < 24; i++) sigText += Math.floor(Math.random() * 10);
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  cx = 256; cy = 224; lockAlpha = 0; lockedCount = 0;
  score = 0; won = false; over = false;
  spawnTarget();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let inside = false, overlapping = false;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    const ms = 290 * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) cy -= ms;
    if (keys.ArrowDown || keys.KeyS) cy += ms;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) cx -= ms;
    if (keys.ArrowRight || keys.KeyD) cx += ms;
    if (down) {
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy);
      if (d > 4) { const step = Math.min(d, ms); cx += (dx / d) * step; cy += (dy / d) * step; }
    }
    cx = Math.max(18, Math.min(494, cx));
    cy = Math.max(18, Math.min(494, cy));

    gx += gvx * dt; gy += gvy * dt;
    if (gx < ZX + 20 || gx > ZX + ZW - 20) { gvx *= -1; gx = Math.max(ZX + 20, Math.min(ZX + ZW - 20, gx)); }
    if (gy < ZY + 20 || gy > ZY + ZH - 20) { gvy *= -1; gy = Math.max(ZY + 20, Math.min(ZY + ZH - 20, gy)); }

    inside = isInside(cx, cy, ZX, ZY, ZW, ZH);
    overlapping = inside && isOver(cx, cy, 18, 18, gx, gy, 18, 18);

    // Faithful hit.as alpha charge/decay
    if (overlapping) {
      lockAlpha = Math.min(1, lockAlpha + 1.35 * dt);
      if (lockAlpha >= 1) {
        lockedCount++;
        score += 100;
        lockAlpha = 0;
        if (lockedCount >= TARGETS) {
          won = true; over = true; score += Math.round(timeLeft * 12);
        } else {
          spawnTarget();
        }
      }
    } else {
      lockAlpha = Math.max(0, lockAlpha - 0.55 * dt);
    }
  }

  document.getElementById("stat").textContent = `Cibles: ${lockedCount}/${TARGETS} • Lock: ${Math.round(lockAlpha * 100)}% • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Active arena rectangle
  ctx.fillStyle = inside ? "rgba(56,214,255,0.06)" : "rgba(248,113,113,0.05)";
  ctx.fillRect(ZX, ZY, ZW, ZH);
  ctx.strokeStyle = inside ? "#38d6ff" : "#f87171";
  ctx.lineWidth = 2;
  ctx.strokeRect(ZX, ZY, ZW, ZH);

  // Target circle & lock-on AABB box
  ctx.fillStyle = overlapping ? "#4ade80" : "#fde047";
  ctx.beginPath(); ctx.arc(gx, gy, 16, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

  if (overlapping) {
    ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2.5;
    ctx.strokeRect(gx - 20, gy - 20, 40, 40);
  }

  // Player circle & inner confinement ring (hit.as drawCircle r=16 & r=14)
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.stroke();
  if (inside) {
    ctx.fillStyle = "rgba(56,214,255,0.28)";
    ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
  }

  // Telemetry readout bar (homage to hit.as deb.text & deb.alpha)
  ctx.fillStyle = "#121a2b";
  ctx.fillRect(ZX, 424, ZW, 54);
  ctx.strokeStyle = "#2d5b7b"; ctx.lineWidth = 1.5;
  ctx.strokeRect(ZX, 424, ZW, 54);
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(ZX + 8, 434, (ZW - 16) * lockAlpha, 12);
  ctx.strokeStyle = "#38d6ff66";
  ctx.strokeRect(ZX + 8, 434, ZW - 16, 12);

  ctx.fillStyle = `rgba(174, 240, 255, ${0.25 + lockAlpha * 0.75})`;
  ctx.font = "13px monospace"; ctx.textAlign = "center";
  ctx.fillText(`SIG: ${sigText}`, 256, 466);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SIGNAUX DÉCODÉS !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
