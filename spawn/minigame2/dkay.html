<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Escouade dKaY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: pointer; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "dkay",
  "name": "Escouade dKaY",
  "family": "income",
  "icon": "⚔️",
  "controls": "Cliquer un ennemi (ou touches 1-4) pour attaquer ; cliquer un allié (ou Espace) pour lever un bouclier",
  "description": "Combat tactique au tour par tour entre deux escouades : l'ennemi cible toujours votre unité avec le plus de PV.",
  "goal": "Éliminer toute l'escouade adverse avant que vos 3 unités ne tombent !",
  "fields": [
    { "key": "enemyCount", "label": "Ennemis dans l'escouade", "type": "number", "default": 3 }
  ]
}
</script>
<div class="bar">
  <span>⚔️ <b>Escouade dKaY</b></span>
  <span id="stat">Tour 1 • Votre tour</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "dkay";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let enemies = [], allies = [], floats = [];
let curTeam = 1; // 1 = player (bottom), 0 = enemy (top)
let ita = 0, itb = 0, turnNum = 1, waitTimer = 0;
let activeActor = null, lungeActor = null, lungeTimer = 0, statusMsg = "";
let score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function addFloat(x, y, text, col) {
  floats.push({ x, y, text, col, life: 0.9 });
}

function getNextAlive(teamArr, idxRef) {
  const n = teamArr.length;
  for (let k = 0; k < n; k++) {
    const a = teamArr[idxRef.v];
    idxRef.v = (idxRef.v + 1) % n;
    if (!a.dead) return a;
  }
  return null;
}

// Exact AS3 AI: attack living opponent with most HP
function getHighestHpTarget(teamArr) {
  let sel = null;
  for (const a of teamArr) {
    if (a.dead) continue;
    if (!sel || sel.hp < a.hp) sel = a;
  }
  return sel;
}

function layoutRow(arr, y) {
  const gap = 112;
  const startX = 256 - ((arr.length - 1) * gap) / 2;
  arr.forEach((a, i) => { a.x = startX + i * gap; a.baseY = y; a.y = y; });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const eCount = Math.max(2, Math.min(4, Number(custom.enemyCount) || 3));
  enemies = []; allies = []; floats = [];
  for (let i = 0; i < eCount; i++) {
    enemies.push({ id: i + 1, team: 0, hp: 11, maxHp: 11, shield: 0, dead: false, exposed: false, x: 0, y: 0, baseY: 130 });
  }
  for (let i = 0; i < 3; i++) {
    allies.push({ id: i + 1, team: 1, hp: 10, maxHp: 10, shield: 0, dead: false, x: 0, y: 0, baseY: 360 });
  }
  layoutRow(enemies, 130);
  layoutRow(allies, 360);

  ita = 0; itb = 0; curTeam = 1; turnNum = 1; waitTimer = 0;
  lungeActor = null; lungeTimer = 0; score = 0; won = false; over = false;
  const ref = { v: itb };
  activeActor = getNextAlive(allies, ref);
  itb = ref.v;
  // Mark one enemy as exposed for bonus tactical damage
  enemies[Math.floor(Math.random() * enemies.length)].exposed = true;
  statusMsg = `Unité #${activeActor.id} prête : cliquez un ennemi (Attaque) ou un allié (Bouclier)`;
}

function checkEnd() {
  if (enemies.every(e => e.dead)) {
    won = true; over = true;
    const remHp = allies.reduce((s, a) => s + Math.max(0, a.hp), 0);
    score += 120 + remHp * 12;
    return true;
  }
  if (allies.every(a => a.dead)) {
    won = false; over = true;
    return true;
  }
  return false;
}

function applyDamage(target, dmg) {
  let rem = dmg;
  if (target.shield > 0) {
    const blocked = Math.min(target.shield, rem);
    target.shield -= blocked;
    rem -= blocked;
    addFloat(target.x, target.y - 42, `🛡️-${blocked}`, "#38d6ff");
  }
  if (rem > 0) {
    target.hp = Math.max(0, target.hp - rem);
    addFloat(target.x, target.y - 26, `-${rem}`, target.team === 0 ? "#fde047" : "#f87171");
    if (target.hp <= 0) {
      target.dead = true;
      addFloat(target.x, target.y, "K.O.", "#ef4444");
    }
  }
}

function playerAttack(enemy) {
  if (over || curTeam !== 1 || !activeActor || enemy.dead || waitTimer > 0) return;
  const dmg = enemy.exposed ? 3 : 2;
  lungeActor = activeActor;
  lungeActor.y = lungeActor.baseY - 36;
  lungeTimer = 0.28;
  applyDamage(enemy, dmg);
  score += dmg * 15;
  if (enemy.exposed) {
    addFloat(enemy.x, enemy.y - 46, "CRIT !", "#fde047");
    enemy.exposed = false;
  }
  if (checkEnd()) return;
  curTeam = 0;
  waitTimer = 0.55;
  statusMsg = "Tour ennemi...";
}

function playerShield(ally) {
  if (over || curTeam !== 1 || !activeActor || ally.dead || waitTimer > 0) return;
  ally.shield = Math.min(4, ally.shield + 3);
  addFloat(ally.x, ally.y - 34, "+3 🛡️", "#38d6ff");
  lungeActor = activeActor;
  lungeActor.y = lungeActor.baseY - 14;
  lungeTimer = 0.22;
  curTeam = 0;
  waitTimer = 0.55;
  statusMsg = "Tour ennemi...";
}

function enemyStep() {
  const ref = { v: ita };
  const attacker = getNextAlive(enemies, ref);
  ita = ref.v;
  if (!attacker) { checkEnd(); return; }
  const target = getHighestHpTarget(allies);
  if (!target) { checkEnd(); return; }

  lungeActor = attacker;
  lungeActor.y = lungeActor.baseY + 36;
  lungeTimer = 0.28;
  applyDamage(target, 2);
  if (checkEnd()) return;

  // Next player turn
  turnNum++;
  curTeam = 1;
  const pref = { v: itb };
  activeActor = getNextAlive(allies, pref);
  itb = pref.v;
  // Rotate exposed enemy
  enemies.forEach(e => e.exposed = false);
  const livingE = enemies.filter(e => !e.dead);
  if (livingE.length) livingE[Math.floor(Math.random() * livingE.length)].exposed = true;
  statusMsg = `Unité #${activeActor.id} prête : cliquez un ennemi (Attaque) ou un allié (Bouclier)`;
}

function handlePointer(e) {
  if (over) { sendResultAndExit(won, score); return; }
  if (curTeam !== 1 || waitTimer > 0) return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (512 / r.width);
  const my = (e.clientY - r.top) * (512 / r.height);

  for (const en of enemies) {
    if (!en.dead && Math.hypot(mx - en.x, my - en.y) < 42) {
      playerAttack(en);
      return;
    }
  }
  for (const al of allies) {
    if (!al.dead && Math.hypot(mx - al.x, my - al.y) < 42) {
      playerShield(al);
      return;
    }
  }
}
cv.addEventListener("pointerdown", handlePointer);

window.addEventListener("keydown", (e) => {
  if (over) return;
  if (e.key >= "1" && e.key <= "4") {
    const idx = Number(e.key) - 1;
    if (enemies[idx] && !enemies[idx].dead) playerAttack(enemies[idx]);
  } else if (e.code === "Space") {
    e.preventDefault();
    const tgt = getHighestHpTarget(allies);
    if (tgt) playerShield(tgt);
  }
});

function drawUnit(u, isEnemy, isActive, isAiTarget) {
  ctx.save();
  ctx.globalAlpha = u.dead ? 0.22 : 1;

  if (isActive && !u.dead) {
    ctx.beginPath(); ctx.arc(u.x, u.y, 38, 0, Math.PI * 2);
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (isAiTarget && !u.dead && !over) {
    ctx.fillStyle = "#f87171"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("🎯 CIBLE IA", u.x, u.y + 54);
  }
  if (isEnemy && u.exposed && !u.dead) {
    ctx.fillStyle = "#fde047"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("⚡ EXPOSÉ (3 DMG)", u.x, u.y - 44);
  }

  ctx.beginPath(); ctx.arc(u.x, u.y, 28, 0, Math.PI * 2);
  ctx.fillStyle = isEnemy ? "rgba(239,68,68,0.28)" : "rgba(56,214,255,0.28)";
  ctx.fill();
  ctx.strokeStyle = isEnemy ? "#f87171" : "#38d6ff";
  ctx.lineWidth = 3;
  ctx.stroke();

  if (u.shield > 0 && !u.dead) {
    ctx.beginPath(); ctx.arc(u.x, u.y, 33, 0, Math.PI * 2);
    ctx.strokeStyle = "#60a5fa"; ctx.lineWidth = 2.5; ctx.stroke();
  }

  ctx.fillStyle = "#e6f4ff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(u.dead ? "✕" : `HP ${u.hp}`, u.x, u.y + 5);

  // HP bar
  const bw = 54, bx = u.x - bw / 2, by = u.y + 34;
  ctx.fillStyle = "#1e293b"; ctx.fillRect(bx, by, bw, 6);
  ctx.fillStyle = isEnemy ? "#f87171" : "#4ade80";
  ctx.fillRect(bx, by, bw * (u.hp / u.maxHp), 6);

  if (u.shield > 0 && !u.dead) {
    ctx.fillStyle = "#93c5fd"; ctx.font = "bold 11px sans-serif";
    ctx.fillText(`🛡️${u.shield}`, u.x, u.y - 33);
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (lungeTimer > 0) {
    lungeTimer -= dt;
    if (lungeTimer <= 0 && lungeActor) {
      lungeActor.y = lungeActor.baseY;
      lungeActor = null;
    }
  }
  if (!over && curTeam === 0 && waitTimer > 0) {
    waitTimer -= dt;
    if (waitTimer <= 0) enemyStep();
  }

  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].y -= 32 * dt;
    floats[i].life -= dt;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Tour ${turnNum} • ${curTeam === 1 ? "Votre tour" : "Ennemi"} • Score ${score}`;

  // Draw
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Arena divider
  ctx.strokeStyle = "rgba(56,214,255,0.2)";
  ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(24, 245); ctx.lineTo(488, 245); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = "rgba(248,113,113,0.7)"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("ESCOUADE ADVERSE (touches 1-4 ou clic pour attaquer)", 24, 42);
  ctx.fillStyle = "rgba(56,214,255,0.8)";
  ctx.fillText("VOTRE ESCOUADE (clic allié ou Espace pour +3 Bouclier)", 24, 476);

  const aiTarget = getHighestHpTarget(allies);
  for (const en of enemies) drawUnit(en, true, false, false);
  for (const al of allies) drawUnit(al, false, curTeam === 1 && al === activeActor, al === aiTarget);

  // Status banner
  ctx.fillStyle = "#121a2b";
  ctx.fillRect(20, 224, 472, 36);
  ctx.strokeStyle = "#2d5b7b";
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 224, 472, 36);
  ctx.fillStyle = "#aef0ff"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(statusMsg, 256, 246);

  // Floating combat text
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, f.life / 0.9);
    ctx.fillStyle = f.col; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ESCOUADE VICTORIEUSE !" : "ESCOUADE DÉFAITE", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
