<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Gluu Pulsant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "gluu",
  "name": "Gluu Pulsant",
  "family": "topMouseMut",
  "icon": "🫧",
  "controls": "Viser avec la souris / doigt pendant la contraction pour orienter l'impulsion suivante",
  "description": "Organisme gélatineux à propulsion rythmique : il s'oriente en se contractant puis jaillit en s'étirant.",
  "goal": "Absorber les 12 cellules nutritives vertes sans toucher les spores toxiques rouges !",
  "fields": [
    { "key": "cellCount", "label": "Cellules à absorber", "type": "number", "default": 12 }
  ]
}
</script>
<div class="bar">
  <span>🫧 <b>Gluu Pulsant</b></span>
  <span id="stat">Cellules: 0/12 • ❤️ 3 • 42s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "gluu";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 256, y: 256 };
let cx = 256, cy = 256, vx = 0, vy = 0, ang = 0, gt = 0, stepAccum = 0;
let hp = 3, invuln = 0, timeLeft = 42, score = 0, won = false, over = false;
let cellGoal = 12, collected = 0;
let cells = [], spores = [], particles = [], trail = [];

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
});

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, col });
  }
}

function spawnCell() {
  for (let tries = 0; tries < 60; tries++) {
    const x = 44 + Math.random() * 424, y = 44 + Math.random() * 424;
    if (Math.hypot(x - cx, y - cy) < 90) continue;
    if (spores.some(s => Math.hypot(x - s.x, y - s.y) < 50)) continue;
    cells.push({ x, y, r: 12, p: Math.random() * Math.PI * 2 });
    return;
  }
  cells.push({ x: 60 + Math.random() * 392, y: 60 + Math.random() * 392, r: 12, p: 0 });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  cellGoal = Math.max(4, Number(custom.cellCount) || 12);
  collected = 0; hp = 3; invuln = 0; timeLeft = 42; score = 0; won = false; over = false;
  cx = 256; cy = 256; vx = 0; vy = 0; ang = 0; gt = 0; stepAccum = 0;
  cells = []; spores = []; particles = []; trail = [];

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.3;
    const sp = 55 + Math.random() * 45;
    const va = Math.random() * Math.PI * 2;
    spores.push({
      x: 256 + Math.cos(a) * 180,
      y: 256 + Math.sin(a) * 180,
      vx: Math.cos(va) * sp,
      vy: Math.sin(va) * sp,
      r: 15,
      rot: Math.random() * Math.PI * 2
    });
  }
  for (let i = 0; i < 4; i++) spawnCell();
}

function stepBlob() {
  gt += 1;
  const u = Math.sin(gt * 0.1) * 0.5;
  if (u < 0) {
    ang = Math.atan2(mouse.y - cy, mouse.x - cx);
  }
  const ms = u > 0 ? 1.55 : 0.32;
  vx += Math.cos(ang) * ms;
  vy += Math.sin(ang) * ms;
  vx *= 0.82;
  vy *= 0.82;
  cx += vx;
  cy += vy;

  if (cx < 26) { cx = 26; vx = Math.abs(vx) * 0.7; }
  if (cx > 486) { cx = 486; vx = -Math.abs(vx) * 0.7; }
  if (cy < 26) { cy = 26; vy = Math.abs(vy) * 0.7; }
  if (cy > 486) { cy = 486; vy = -Math.abs(vy) * 0.7; }

  if (gt % 2 === 0) {
    trail.push({ x: cx, y: cy, a: 0.45, r: 16 });
    if (trail.length > 14) trail.shift();
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    invuln = Math.max(0, invuln - dt);
    if (timeLeft <= 0) over = true;

    stepAccum += dt;
    while (stepAccum >= 1 / 60) {
      stepBlob();
      stepAccum -= 1 / 60;
    }

    for (const s of spores) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt * 1.8;
      if (s.x < s.r + 6 || s.x > 506 - s.r) { s.vx *= -1; s.x = Math.max(s.r + 6, Math.min(506 - s.r, s.x)); }
      if (s.y < s.r + 6 || s.y > 506 - s.r) { s.vy *= -1; s.y = Math.max(s.r + 6, Math.min(506 - s.r, s.y)); }
      if (invuln <= 0 && Math.hypot(s.x - cx, s.y - cy) < s.r + 22) {
        hp--;
        invuln = 1.2;
        const pushA = Math.atan2(cy - s.y, cx - s.x);
        vx = Math.cos(pushA) * 9; vy = Math.sin(pushA) * 9;
        burst(cx, cy, "#f87171", 18);
        if (hp <= 0) { won = false; over = true; }
      }
    }

    for (let i = cells.length - 1; i >= 0; i--) {
      const c = cells[i];
      c.p += dt * 4;
      if (Math.hypot(c.x - cx, c.y - cy) < c.r + 24) {
        burst(c.x, c.y, "#4ade80", 14);
        cells.splice(i, 1);
        collected++;
        score += 40;
        if (collected >= cellGoal) {
          won = true; over = true;
          score += Math.round(timeLeft * 8 + hp * 40);
        } else if (collected + cells.length < cellGoal) {
          spawnCell();
        }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (const t of trail) t.a = Math.max(0, t.a - dt * 1.1);

  document.getElementById("stat").textContent = `Cellules: ${collected}/${cellGoal} • ❤️ ${hp} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle organic grid rings
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  for (let r = 80; r <= 240; r += 80) {
    ctx.beginPath(); ctx.arc(256, 256, r, 0, Math.PI * 2); ctx.stroke();
  }

  // Trail
  for (const t of trail) {
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * t.a * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(56,214,255,${t.a * 0.25})`;
    ctx.fill();
  }

  // Nutrient cells
  for (const c of cells) {
    const r = c.r + Math.sin(c.p) * 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(74,222,128,0.18)"; ctx.fill();
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#4ade80"; ctx.fill();
    ctx.beginPath(); ctx.arc(c.x - 3, c.y - 3, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#dcfce7"; ctx.fill();
  }

  // Toxic spores
  for (const s of spores) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const rad = k % 2 === 0 ? s.r + 4 : s.r - 4;
      if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Gluu blob (exact AS3 squash & stretch transform)
  const u = Math.sin(gt * 0.1) * 0.5;
  const sx = u + 1;
  const sy = 1 - u;

  // Aim line during contraction phase (u < 0)
  if (u < 0 && !over) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * 58, cy + Math.sin(ang) * 58);
    ctx.strokeStyle = "rgba(250,204,21,0.55)";
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (invuln <= 0 || Math.floor(invuln * 14) % 2 === 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.scale(sx, sy);

    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fillStyle = u > 0 ? "rgba(56,214,255,0.45)" : "rgba(167,139,250,0.42)";
    ctx.fill();
    ctx.strokeStyle = u > 0 ? "#38d6ff" : "#c4b5fd";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Directional nucleus / eye from AS3 skin
    ctx.beginPath();
    ctx.arc(13, 0, 7, 0, Math.PI * 2);
    ctx.fillStyle = u > 0 ? "#e6f4ff" : "#fde047";
    ctx.fill();
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.45);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Cursor
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 7, 0, Math.PI * 2);
  ctx.strokeStyle = u < 0 ? "#fde047" : "#38d6ff";
  ctx.lineWidth = 2; ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "GLUU RASSASIÉ !" : (hp <= 0 ? "GLUU DISSOCIÉ" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
