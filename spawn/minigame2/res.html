<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Escouade Triple (Res)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "res",
  "name": "Escouade Triple (Res)",
  "family": "sideClavSimple",
  "icon": "👥",
  "controls": "1/2/3 ou Tab (ou clic sur un drone) pour changer d'agent • Flèches/ZQSD pour bouger et sauter",
  "description": "Contrôlez tour à tour 3 agents dans une station multi-niveaux à plateformes.",
  "goal": "Positionnez simultanément les 3 agents sur leurs balises de couleur correspondante.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 55 }
  ]
}
</script>
<div class="bar">
  <span>👥 <b>Escouade Res</b></span>
  <span id="stat">Balises: 0/3 • Agent 1 • 55s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "res";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const MW = 16, MH = 16, CW = 32, CH = 32;

let keys = {}, jumpQueued = false, grid = [], actors = [], pads = [], curIdx = 0;
let down = false, mx = 256, my = 256, pointerJumpCd = 0;
let timeLeft = 55, score = 0, won = false, over = false, tick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function selectActor(idx) {
  if (idx < 0 || idx >= actors.length || idx === curIdx) return;
  actors[curIdx].vx = 0;
  curIdx = idx;
}

window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "KeyZ" || e.code === "Space")) {
    jumpQueued = true;
  }
  if (e.code === "Digit1" || e.code === "Numpad1") selectActor(0);
  if (e.code === "Digit2" || e.code === "Numpad2") selectActor(1);
  if (e.code === "Digit3" || e.code === "Numpad3") selectActor(2);
  if (e.code === "Tab") selectActor((curIdx + 1) % actors.length);
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
  // Click on an actor to switch directly to it
  for (let i = 0; i < actors.length; i++) {
    if (Math.hypot(pt.x - actors[i].cx, pt.y - actors[i].cy) < 26) {
      selectActor(i);
      return;
    }
  }
  // Click on bottom agent selector pills
  if (pt.y > 474) {
    if (pt.x > 130 && pt.x < 214) { selectActor(0); return; }
    if (pt.x >= 214 && pt.x < 298) { selectActor(1); return; }
    if (pt.x >= 298 && pt.x < 382) { selectActor(2); return; }
  }
  down = true;
  if (my < actors[curIdx].cy - 24) jumpQueued = true;
});
cv.addEventListener("pointermove", (e) => {
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
});
window.addEventListener("pointerup", () => { down = false; });

function getTile(tx, ty) {
  const ix = Math.floor(tx), iy = Math.floor(ty);
  if (ix < 0 || ix >= MW || iy < 0 || iy >= MH) return 1;
  return grid[iy * MW + ix];
}
function isWall(ax, ay) {
  if (ax < 0 || ay < 0 || ax >= 512 || ay >= 512) return true;
  return getTile(ax / CW, ay / CH) > 0;
}

const LEVEL_MAP = [
  "1111111111111111",
  "1000000000000001",
  "1000000000000001",
  "1000001111000001",
  "1111000000001111",
  "1000000000000001",
  "1000011001100001",
  "1000000000000001",
  "1001100000011001",
  "1000000110000001",
  "1000000000000001",
  "1110000000000111",
  "1000011001100001",
  "1000000000000001",
  "1111111111111111",
  "1111111111111111"
];

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 55;
  score = 0; won = false; over = false; curIdx = 0; jumpQueued = false;
  grid = new Array(MW * MH).fill(0);
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      grid[y * MW + x] = LEVEL_MAP[y][x] === "1" ? 1 : 0;
    }
  }
  actors = [
    { cx: 144, cy: 420, vx: 0, vy: 0, color: "#38d6ff", label: "1" },
    { cx: 256, cy: 420, vx: 0, vy: 0, color: "#f472b6", label: "2" },
    { cx: 368, cy: 420, vx: 0, vy: 0, color: "#4ade80", label: "3" }
  ];
  pads = [
    { x: 1.5 * CW, y: 3.5 * CH, w: 48, h: 12, color: "#38d6ff", label: "1", active: false },
    { x: 7.25 * CW, y: 2.5 * CH, w: 48, h: 12, color: "#f472b6", label: "2", active: false },
    { x: 13.0 * CW, y: 3.5 * CH, w: 48, h: 12, color: "#4ade80", label: "3", active: false }
  ];
}

function stepPhysics() {
  const cur = actors[curIdx];
  let left = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ);
  let right = !!(keys.ArrowRight || keys.KeyD);

  if (down) {
    if (mx < cur.cx - 14) left = true;
    if (mx > cur.cx + 14) right = true;
    if (my < cur.cy - 26 && pointerJumpCd <= 0) {
      jumpQueued = true;
      pointerJumpCd = 16;
    }
  }
  if (pointerJumpCd > 0) pointerJumpCd--;

  if (left) cur.vx -= 0.34;
  if (right) cur.vx += 0.34;
  if (cur.vx > 4.2) cur.vx = 4.2;
  if (cur.vx < -4.2) cur.vx = -4.2;
  if (!left && !right) cur.vx *= 0.86;

  // Authentic res.as multi-jump / crisp vertical impulse on press
  if (jumpQueued) {
    cur.vy = -5.6;
    jumpQueued = false;
  }

  for (const a of actors) {
    a.vy += 0.22;
    if (a.vy > 8) a.vy = 8;
    a.vx *= 0.96;

    if (a.vx > 0 && isWall(a.cx + 9 + a.vx, a.cy)) a.vx = 0;
    else if (a.vx < 0 && isWall(a.cx - 9 + a.vx, a.cy)) a.vx = 0;

    if (a.vy > 0 && isWall(a.cx, a.cy + 9 + a.vy)) a.vy = 0;
    else if (a.vy < 0 && isWall(a.cx, a.cy - 9 + a.vy)) a.vy = 0;

    a.cx += a.vx;
    a.cy += a.vy;

    if (isWall(a.cx, a.cy + 9)) { a.cy = Math.floor(a.cy) - 1; }
    else if (a.vy >= 0 && a.vy < 1 && !isWall(a.cx, a.cy + 10)) { a.cy += 1; }
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    acc += dt;
    while (acc >= 1 / 60) {
      stepPhysics();
      acc -= 1 / 60;
    }

    let aligned = 0;
    for (let i = 0; i < 3; i++) {
      const a = actors[i], pd = pads[i];
      const onPad = Math.abs(a.cx - (pd.x + pd.w / 2)) < 26 && Math.abs(a.cy - (pd.y + 4)) < 22;
      pd.active = onPad;
      if (onPad) aligned++;
    }
    score = aligned * 80;
    if (aligned === 3) {
      won = true; over = true;
      score = 240 + Math.round(timeLeft * 6);
    }
  }

  const activeN = pads.filter(pd => pd.active).length;
  document.getElementById("stat").textContent = `Balises: ${activeN}/3 • Agent ${curIdx + 1} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Walls
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (grid[y * MW + x] > 0) {
        ctx.fillStyle = y >= 14 ? "#111929" : "#1e293b";
        ctx.fillRect(x * CW, y * CH, CW, CH);
        if (y < 14) {
          ctx.strokeStyle = "#334155";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
        }
      }
    }
  }

  // Color-coded pads
  for (const pd of pads) {
    ctx.save();
    ctx.fillStyle = pd.active ? pd.color : "rgba(255,255,255,0.08)";
    ctx.strokeStyle = pd.color;
    ctx.lineWidth = 2;
    if (pd.active) { ctx.shadowColor = pd.color; ctx.shadowBlur = 14; }
    ctx.fillRect(pd.x, pd.y, pd.w, pd.h);
    ctx.strokeRect(pd.x, pd.y, pd.w, pd.h);
    ctx.fillStyle = pd.active ? "#0a0e18" : pd.color;
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(pd.label, pd.x + pd.w / 2, pd.y + 10);
    ctx.restore();
  }

  // Actors
  for (let i = 0; i < actors.length; i++) {
    const a = actors[i];
    const isCur = i === curIdx;
    ctx.save();
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, 9, 0, Math.PI * 2);
    ctx.fillStyle = a.color;
    if (isCur) { ctx.shadowColor = a.color; ctx.shadowBlur = 14; }
    ctx.fill();
    ctx.lineWidth = isCur ? 2.5 : 1.5;
    ctx.strokeStyle = isCur ? "#ffffff" : "#0a0e18";
    ctx.stroke();

    ctx.fillStyle = "#0a0e18";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(a.label, a.cx, a.cy + 0.5);

    // Overhead active marker (faithful to res.as cy - 24 indicator)
    if (isCur) {
      const bob = Math.sin(tick * 7) * 3;
      ctx.beginPath();
      ctx.arc(a.cx, a.cy - 22 + bob, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#fde047";
      ctx.fill();
    }
    ctx.restore();
  }

  // Bottom HUD selector pills (touch & mouse friendly)
  for (let i = 0; i < 3; i++) {
    const bx = 136 + i * 84, by = 478;
    const isCur = i === curIdx;
    ctx.fillStyle = isCur ? "#1c3552" : "#0d1422";
    ctx.strokeStyle = isCur ? actors[i].color : "#2d5b7b";
    ctx.lineWidth = isCur ? 2 : 1;
    ctx.fillRect(bx, by, 72, 24);
    ctx.strokeRect(bx, by, 72, 24);
    ctx.fillStyle = actors[i].color;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`Agent ${i + 1}`, bx + 36, by + 12);
  }
  ctx.textBaseline = "alphabetic";

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ESCOUADE SYNCHRONISÉE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
