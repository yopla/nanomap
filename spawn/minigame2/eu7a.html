<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sonde Gravité (Eu7a)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "eu7a",
  "name": "Sonde Gravité (Eu7a)",
  "family": "income",
  "icon": "🛰️",
  "controls": "Souris/Doigt pour attirer + Clic/Tap pour impulsion (effet de couple) • Flèches/Espace au clavier",
  "description": "Sonde rigide à 4 jambes soumise à la gravité et au couple de rotation par impulsions.",
  "goal": "Collectez les 8 orbes dorés en évitant les mines rouges avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🛰️ <b>Sonde Eu7a</b></span>
  <span id="stat">Orbes: 0/8 • Bouclier: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "eu7a";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const FLOOR_Y = 446;
const STRUTS = [
  { x: 54, y: 28 },
  { x: -54, y: 28 },
  { x: 28, y: -28 },
  { x: -28, y: -28 }
];

let keys = {}, body = {}, orbs = [], mines = [], pulses = [];
let mouseX = 256, mouseY = 256, hasPointer = false;
let timeLeft = 45, score = 0, shields = 3, invuln = 0, won = false, over = false, tick = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function addImp(ax, ay, ix, iy) {
  body.vx += ix;
  body.vy += iy;
  const ta = ((ax - body.cx) * iy) - ((ay - body.cy) * ix);
  body.vang += ta * 0.00012;
}
function addImp2(ax, ay, ix, iy) {
  body.cx += ix;
  body.cy += iy;
  const ta = ((ax - body.cx) * iy) - ((ay - body.cy) * ix);
  body.ang += ta * 0.00012;
}

function triggerPulse(px, py) {
  addImp(px, py, 0, -5.2);
  pulses.push({ x: px, y: py, r: 6, life: 1 });
}

window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "KeyZ")) {
    if (!over) triggerPulse(body.cx, body.cy + 16);
  }
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = toCanvas(e);
  mouseX = pt.x; mouseY = pt.y; hasPointer = true;
  triggerPulse(pt.x, pt.y);
});
cv.addEventListener("pointermove", (e) => {
  const pt = toCanvas(e);
  mouseX = pt.x; mouseY = pt.y; hasPointer = true;
});

function spawnOrb(existing) {
  for (let tries = 0; tries < 40; tries++) {
    const x = 48 + Math.random() * 416;
    const y = 56 + Math.random() * 340;
    if (Math.hypot(x - 256, y - 260) < 70) continue;
    if (existing.every(o => Math.hypot(x - o.x, y - o.y) > 64)) {
      return { x, y, got: false };
    }
  }
  return { x: 60 + Math.random() * 390, y: 70 + Math.random() * 320, got: false };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; shields = 3; invuln = 0; won = false; over = false; pulses = [];
  body = { cx: 256, cy: 250, ang: 0, vx: 0, vy: 0, vang: 0 };
  orbs = [];
  for (let i = 0; i < 8; i++) orbs.push(spawnOrb(orbs));
  mines = [
    { x: 130, y: 150, vx: 0.9, vy: 0.45, r: 13 },
    { x: 382, y: 210, vx: -0.85, vy: -0.5, r: 13 },
    { x: 256, y: 95, vx: 0.7, vy: 0.6, r: 13 }
  ];
}

function getWorldStruts() {
  const nx = Math.cos(body.ang), ny = Math.sin(body.ang);
  return STRUTS.map(s => ({
    x: body.cx + nx * s.x - ny * s.y,
    y: body.cy + ny * s.x + nx * s.y
  }));
}

function stepPhysics() {
  const pts = getWorldStruts();
  for (const pt of pts) {
    if (pt.y > FLOOR_Y) {
      addImp(pt.x, pt.y, 0, (FLOOR_Y - pt.y) * 0.42);
      addImp2(pt.x, pt.y, 0, FLOOR_Y - pt.y);
    }
    if (pt.y < 14) {
      addImp(pt.x, pt.y, 0, (14 - pt.y) * 0.4);
      addImp2(pt.x, pt.y, 0, 14 - pt.y);
    }
    if (pt.x > 502) {
      addImp(pt.x, pt.y, -1.1, 0);
      addImp2(pt.x, pt.y, 502 - pt.x, 0);
    }
    if (pt.x < 10) {
      addImp(pt.x, pt.y, 1.1, 0);
      addImp2(pt.x, pt.y, 10 - pt.x, 0);
    }
  }

  body.vy += 0.2;
  body.vx *= 0.99;
  body.vy *= 0.99;
  body.vang *= 0.985;
  body.cx += body.vx;
  body.cy += body.vy;
  body.ang += body.vang;

  // Faithful Eu7a mouse horizontal pull + keyboard support
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) body.vx -= 0.24;
  else if (keys.ArrowRight || keys.KeyD) body.vx += 0.24;
  else if (hasPointer) {
    if (mouseX > body.cx + 28) body.vx += 0.2;
    else if (mouseX < body.cx - 28) body.vx -= 0.2;
  }

  for (const m of mines) {
    m.x += m.vx; m.y += m.vy;
    if (m.x < 28 || m.x > 484) m.vx *= -1;
    if (m.y < 28 || m.y > FLOOR_Y - 28) m.vy *= -1;
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln -= dt;

    acc += dt;
    while (acc >= 1 / 60) {
      stepPhysics();
      acc -= 1 / 60;
    }

    const pts = getWorldStruts();
    // Collect orbs with core or strut tips
    for (const o of orbs) {
      if (o.got) continue;
      let hit = Math.hypot(body.cx - o.x, body.cy - o.y) < 24;
      if (!hit) {
        for (const pt of pts) {
          if (Math.hypot(pt.x - o.x, pt.y - o.y) < 18) { hit = true; break; }
        }
      }
      if (hit) {
        o.got = true;
        score += 40;
        pulses.push({ x: o.x, y: o.y, r: 4, life: 1, color: "#fde047" });
      }
    }

    // Mine collisions with core
    if (invuln <= 0) {
      for (const m of mines) {
        if (Math.hypot(body.cx - m.x, body.cy - m.y) < m.r + 14) {
          shields--;
          invuln = 1.2;
          const a = Math.atan2(body.cy - m.y, body.cx - m.x);
          body.vx += Math.cos(a) * 5;
          body.vy += Math.sin(a) * 5;
          pulses.push({ x: m.x, y: m.y, r: 6, life: 1, color: "#f87171" });
          if (shields <= 0) { over = true; won = false; }
          break;
        }
      }
    }

    if (orbs.every(o => o.got)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6) + shields * 20;
    }
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].r += dt * 95;
    pulses[i].life -= dt * 2.4;
    if (pulses[i].life <= 0) pulses.splice(i, 1);
  }

  const gotN = orbs.filter(o => o.got).length;
  document.getElementById("stat").textContent = `Orbes: ${gotN}/${orbs.length} • Bouclier: ${shields} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Floor
  ctx.fillStyle = "#162236";
  ctx.fillRect(0, FLOOR_Y, 512, 512 - FLOOR_Y);
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(512, FLOOR_Y); ctx.stroke();

  // Impulse shockwaves
  for (const pl of pulses) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pl.life);
    ctx.strokeStyle = pl.color || "#38d6ff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Orbs
  for (const o of orbs) {
    if (o.got) continue;
    const pulse = 10 + Math.sin(tick * 6 + o.x) * 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(o.x, o.y, pulse, 0, Math.PI * 2);
    ctx.fillStyle = "#fde047";
    ctx.shadowColor = "#facc15"; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();
  }

  // Mines
  for (const m of mines) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(tick * 2);
    ctx.fillStyle = "#ef4444";
    ctx.shadowColor = "#f87171"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, m.r - 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * -m.r, Math.sin(a) * -m.r);
      ctx.lineTo(Math.cos(a) * m.r, Math.sin(a) * m.r); ctx.stroke();
    }
    ctx.restore();
  }

  // 4-strut rigid probe (faithful to Eu7a.as)
  const pts = getWorldStruts();
  ctx.save();
  if (invuln > 0 && Math.floor(tick * 16) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.strokeStyle = "#7dd3fc";
  ctx.lineWidth = 3;
  for (const pt of pts) {
    ctx.beginPath(); ctx.moveTo(body.cx, body.cy); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#aef0ff"; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(body.cx, body.cy, 11, 0, Math.PI * 2);
  ctx.fillStyle = "#38d6ff";
  ctx.shadowColor = "#38d6ff"; ctx.shadowBlur = 12;
  ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "COLLECTE TERMINÉE !" : (shields <= 0 ? "SONDE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
