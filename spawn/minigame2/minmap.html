<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Cartographe Secteur (MinMap)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "minmap",
  "name": "Cartographe Secteur (MinMap)",
  "family": "topOrthoClav",
  "icon": "🗺️",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour naviguer entre salles)",
  "description": "Exploration d'un complexe de 7 salles reliées avec transition dynamique et minicarte.",
  "goal": "Activer les 7 balises de secteur (une par salle) avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 }
  ]
}
</script>
<div class="bar">
  <span>🗺️ <b>Secteurs MinMap</b></span>
  <span id="stat">Balises: 0/7 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "minmap";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Exact 7 room layout from minMap.as (scale: 1 map unit = 16 world px)
const ROOM_DEFS = [
  { cx: 0,  cy: 0,  cw: 16, ch: 16 },
  { cx: 0,  cy: 16, cw: 32, ch: 16 },
  { cx: 32, cy: 16, cw: 16, ch: 16 },
  { cx: 48, cy: 16, cw: 32, ch: 16 },
  { cx: 32, cy: 32, cw: 16, ch: 16 },
  { cx: 48, cy: 32, cw: 16, ch: 32 },
  { cx: 0,  cy: 32, cw: 32, ch: 32 }
];

let keys = {}, rooms = [], curRoom = null;
let wx = 128, wy = 128; // global world coords in [0..1280, 0..1024]
let down = false, mx = 256, my = 256;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

function getZone(ax, ay) {
  for (const r of rooms) {
    if (ax >= r.cx && ay >= r.cy && ax <= r.cx + r.cw && ay <= r.cy + r.ch) return r;
  }
  return null;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  score = 0; won = false; over = false;
  rooms = ROOM_DEFS.map((d, idx) => ({
    ...d, id: idx, visited: idx === 0,
    bx: (d.cx + d.cw * (0.3 + Math.random() * 0.4)) * 16,
    by: (d.cy + d.ch * (0.3 + Math.random() * 0.4)) * 16,
    done: false
  }));
  wx = 128; wy = 128;
  curRoom = rooms[0];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    let dx = 0, dy = 0, ms = 310 * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) dy -= ms;
    if (keys.ArrowDown || keys.KeyS) dy += ms;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) dx -= ms;
    if (keys.ArrowRight || keys.KeyD) dx += ms;
    if (down) {
      const px = mx - 256, py = my - 256, d = Math.hypot(px, py);
      if (d > 10) { dx = (px / d) * ms; dy = (py / d) * ms; }
    }
    if (dx !== 0 && dy !== 0 && !down) { dx *= 0.707; dy *= 0.707; }

    // Try axis-separated moves so player slides cleanly along outer room boundaries
    const nx = wx + dx;
    if (getZone((nx - 10) / 16, wy / 16) && getZone((nx + 10) / 16, wy / 16)) wx = nx;
    const ny = wy + dy;
    if (getZone(wx / 16, (ny - 10) / 16) && getZone(wx / 16, (ny + 10) / 16)) wy = ny;

    const z = getZone(wx / 16, wy / 16);
    if (z) { curRoom = z; z.visited = true; }

    for (const r of rooms) {
      if (!r.done && Math.hypot(wx - r.bx, wy - r.by) < 28) {
        r.done = true; score += 80;
      }
    }
    if (rooms.every(r => r.done)) {
      won = true; over = true; score += Math.round(timeLeft * 10);
    }
  }

  const doneN = rooms.filter(r => r.done).length;
  document.getElementById("stat").textContent = `Balises: ${doneN}/${rooms.length} • Salle #${(curRoom ? curRoom.id + 1 : 1)} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0a0f1c"; ctx.fillRect(0, 0, 512, 512);

  // Camera centered on player (faithful to minMap.as camx = cx - 235)
  const camx = wx - 256, camy = wy - 256;

  for (const r of rooms) {
    const rx = r.cx * 16 - camx, ry = r.cy * 16 - camy, rw = r.cw * 16, rh = r.ch * 16;
    const isCur = r === curRoom;
    ctx.fillStyle = isCur ? "#121f36" : "#0e1728";
    ctx.fillRect(rx, ry, rw, rh);

    // Subtle floor grid
    ctx.strokeStyle = isCur ? "#1e3a5f55" : "#16243d44";
    ctx.lineWidth = 1;
    for (let x = 0; x <= rw; x += 64) { ctx.beginPath(); ctx.moveTo(rx + x, ry); ctx.lineTo(rx + x, ry + rh); ctx.stroke(); }
    for (let y = 0; y <= rh; y += 64) { ctx.beginPath(); ctx.moveTo(rx, ry + y); ctx.lineTo(rx + rw, ry + y); ctx.stroke(); }

    ctx.strokeStyle = isCur ? "#38d6ff" : "#2d5b7b";
    ctx.lineWidth = isCur ? 3 : 1.5;
    ctx.strokeRect(rx, ry, rw, rh);

    // Sector beacon
    const bx = r.bx - camx, by = r.by - camy;
    ctx.fillStyle = r.done ? "#4ade80" : "#fde047";
    ctx.beginPath(); ctx.arc(bx, by, r.done ? 10 : 12 + Math.sin(now / 150) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Player at screen center
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(256, 256, 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

  // Live Minimap HUD (top-left, faithful to minMap.as)
  const ms = 1.7, mx0 = 14, my0 = 14;
  ctx.fillStyle = "rgba(10,14,24,0.88)";
  ctx.fillRect(mx0 - 6, my0 - 6, 80 * ms + 12, 64 * ms + 12);
  ctx.strokeStyle = "#38d6ff88"; ctx.lineWidth = 1.5;
  ctx.strokeRect(mx0 - 6, my0 - 6, 80 * ms + 12, 64 * ms + 12);

  for (const r of rooms) {
    const isCur = r === curRoom;
    ctx.fillStyle = isCur ? "rgba(56,214,255,0.3)" : (r.done ? "rgba(74,222,128,0.18)" : "rgba(30,58,95,0.45)");
    ctx.fillRect(mx0 + r.cx * ms, my0 + r.cy * ms, r.cw * ms, r.ch * ms);
    ctx.strokeStyle = isCur ? "#38d6ff" : "#475569";
    ctx.lineWidth = isCur ? 2 : 1;
    ctx.strokeRect(mx0 + r.cx * ms, my0 + r.cy * ms, r.cw * ms, r.ch * ms);

    if (!r.done) {
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(mx0 + (r.bx / 16) * ms, my0 + (r.by / 16) * ms, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(mx0 + (wx / 16) * ms, my0 + (wy / 16) * ms, 3.5, 0, Math.PI * 2); ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEURS CARTOGRAPHIÉS !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
