<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Labyrinthe Glissant (Coli)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "coli",
  "name": "Labyrinthe Glissant (Coli)",
  "family": "topOrthoClav",
  "icon": "🧩",
  "controls": "Flèches / ZQSD (ou maintenir clic/doigt pour guider la sonde)",
  "description": "Navigation fluide avec glissement automatique sur les coins dans une grille 12×12.",
  "goal": "Collecter les 10 cristaux d'énergie avant la fin du chrono en évitant les sentinelles.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>🧩 <b>Labyrinthe Coli</b></span>
  <span id="stat">Cristaux: 0/10 • ❤️3 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "coli";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 12, MH = 12, CW = 40, CH = 40, OX = 16, OY = 16;
let keys = {}, grid = [], gems = [], drones = [];
let cx = 0, cy = 0, hp = 3, invuln = 0;
let down = false, mx = 256, my = 256;
let timeLeft = 40, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width) - OX;
  my = (e.clientY - r.top) * (512 / r.height) - OY;
}

function isWallTile(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return true;
  return grid[ax + ay * MW] > 0;
}
function setWall(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  grid[ax + ay * MW] = t;
}
function isWall(ax, ay) {
  return isWallTile(Math.floor(ax / CW), Math.floor(ay / CH));
}

function getReachableTiles(sx, sy) {
  const vis = new Set([sx + "," + sy]);
  const q = [[sx, sy]], res = [];
  while (q.length) {
    const [x, y] = q.shift();
    res.push([x, y]);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = nx + "," + ny;
      if (!isWallTile(nx, ny) && !vis.has(k)) { vis.add(k); q.push([nx, ny]); }
    }
  }
  return res;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  score = 0; won = false; over = false; hp = 3; invuln = 0;

  let reachable = [];
  for (let attempt = 0; attempt < 20; attempt++) {
    grid = new Array(MW * MH).fill(0);
    for (let i = 0; i < MW; i++) {
      setWall(i, 0, 1); setWall(0, i, 1);
      setWall(i, MH - 1, 1); setWall(MW - 1, i, 1);
    }
    setWall(3, 3, 1); setWall(5, 3, 1); setWall(3, 5, 1);
    for (let i = 0; i < 16; i++) {
      const rx = 1 + Math.floor(Math.random() * (MW - 2));
      const ry = 1 + Math.floor(Math.random() * (MH - 2));
      if (rx === 4 && ry === 4) continue;
      setWall(rx, ry, 1);
    }
    setWall(4, 4, 0);
    reachable = getReachableTiles(4, 4);
    if (reachable.length >= 24) break;
  }

  cx = 4 * CW + CW / 2;
  cy = 4 * CH + CH / 2;

  const pool = reachable.filter(([x, y]) => !(x === 4 && y === 4));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  gems = pool.slice(0, 10).map(([x, y]) => ({ x: x * CW + CW / 2, y: y * CH + CH / 2, got: false }));

  drones = [];
  const farTiles = pool.slice(10).filter(([x, y]) => Math.hypot(x - 4, y - 4) >= 3);
  for (let i = 0; i < 2 && i < farTiles.length; i++) {
    const [x, y] = farTiles[i];
    const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
    const d = dirs[i % dirs.length];
    drones.push({ x: x * CW + CW / 2, y: y * CH + CH / 2, vx: d[0] * 105, vy: d[1] * 105 });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Faithful coli.as corner-sliding collision (scaled to dt)
    const step = 210 * dt;
    let vx = 0, vy = 0;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) vy -= step;
    if (keys.ArrowDown || keys.KeyS) vy += step;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) vx -= step;
    if (keys.ArrowRight || keys.KeyD) vx += step;
    if (down) {
      const dx = mx - cx, dy = my - cy;
      if (Math.abs(dx) > 8) vx = Math.sign(dx) * step;
      if (Math.abs(dy) > 8) vy = Math.sign(dy) * step;
    }

    const r = 17;
    let wh = 0;
    if (vx > 0 && isWall(cx + r + vx, cy - r)) wh |= 1;
    if (vx > 0 && isWall(cx + r + vx, cy + r)) wh |= 2;
    if (vx < 0 && isWall(cx - r + vx, cy - r)) wh |= 1;
    if (vx < 0 && isWall(cx - r + vx, cy + r)) wh |= 2;

    if (vy > 0 && isWall(cx + r, cy + r + vy)) wh |= 8;
    if (vy > 0 && isWall(cx - r, cy + r + vy)) wh |= 4;
    if (vy < 0 && isWall(cx + r, cy - r + vy)) wh |= 8;
    if (vy < 0 && isWall(cx - r, cy - r + vy)) wh |= 4;

    if (wh === 1 && vy === 0) vy = step;
    if (wh === 2 && vy === 0) vy = -step;
    if (wh === 4 && vx === 0) vx = step;
    if (wh === 8 && vx === 0) vx = -step;

    if (vx > 0 && (isWall(cx + r + vx, cy - r) || isWall(cx + r + vx, cy + r))) vx = 0;
    if (vx < 0 && (isWall(cx - r + vx, cy - r) || isWall(cx - r + vx, cy + r))) vx = 0;
    if (vy > 0 && (isWall(cx + r, cy + r + vy) || isWall(cx - r, cy + r + vy))) vy = 0;
    if (vy < 0 && (isWall(cx + r, cy - r + vy) || isWall(cx - r, cy - r + vy))) vy = 0;

    cx += vx; cy += vy;

    for (const g of gems) {
      if (!g.got && Math.hypot(cx - g.x, cy - g.y) < 22) {
        g.got = true; score += 50;
      }
    }

    for (const d of drones) {
      const nx = d.x + d.vx * dt, ny = d.y + d.vy * dt;
      if (isWall(nx + Math.sign(d.vx) * 12, d.y) || isWall(d.x, ny + Math.sign(d.vy) * 12)) {
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => !isWall(d.x + dx * 22, d.y + dy * 22));
        if (dirs.length) {
          const pick = dirs[Math.floor(Math.random() * dirs.length)];
          d.vx = pick[0] * 110; d.vy = pick[1] * 110;
        } else { d.vx *= -1; d.vy *= -1; }
      } else { d.x = nx; d.y = ny; }

      if (invuln <= 0 && Math.hypot(cx - d.x, cy - d.y) < 25) {
        hp--; invuln = 1.2;
        if (hp <= 0) { over = true; won = false; }
      }
    }

    if (gems.every(g => g.got)) {
      won = true; over = true; score += Math.round(timeLeft * 10) + hp * 50;
    }
  }

  const gotN = gems.filter(g => g.got).length;
  document.getElementById("stat").textContent = `Cristaux: ${gotN}/${gems.length} • ❤️${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.save(); ctx.translate(OX, OY);

  ctx.strokeStyle = "#1a2942"; ctx.lineWidth = 1;
  for (let i = 0; i <= MW; i++) {
    ctx.beginPath(); ctx.moveTo(i * CW, 0); ctx.lineTo(i * CW, MH * CH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CH); ctx.lineTo(MW * CW, i * CH); ctx.stroke();
  }

  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (grid[x + y * MW] > 0) {
        ctx.fillStyle = "#1e3a5f";
        ctx.fillRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
        ctx.strokeStyle = "#38d6ff44";
        ctx.strokeRect(x * CW + 2, y * CH + 2, CW - 4, CH - 4);
      }
    }
  }

  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  for (const g of gems) {
    if (g.got) continue;
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(g.x, g.y, 7 + pulse * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff7c2"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  for (const d of drones) {
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath(); ctx.arc(d.x, d.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fda4af"; ctx.lineWidth = 2; ctx.stroke();
  }

  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "LABYRINTHE COMPLÉTÉ !" : "SONDE DÉTRUITE / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
