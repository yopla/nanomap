<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Essaim Grille</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "zvis",
  "name": "Essaim Grille",
  "family": "topMouseMut",
  "icon": "🐝",
  "controls": "Déplacer la souris / doigt pour guider votre essaim de drones sur la grille",
  "description": "Un essaim de 24 drones suit votre balise tout en évitant les collisions cellule par cellule sur une grille 16×16.",
  "goal": "Collectez 15 cristaux verts avec l'essaim sans perdre vos drones dans les zones rouges !",
  "fields": [
    { "key": "targetGems", "label": "Cristaux à récolter", "type": "number", "default": 15 },
    { "key": "droneCount", "label": "Drones de l'essaim", "type": "number", "default": 24 }
  ]
}
</script>
<div class="bar">
  <span>🐝 <b>Essaim Grille</b></span>
  <span id="stat">Cristaux: 0/15 • Drones: 24 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "zvis";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 16, MH = 16, CW = 32, CH = 32;
const colGrid = new Int32Array(MW * MH);
let actors = [], gems = [], hazards = [];
let mx = 256, my = 256;
let targetGems = 15, collected = 0, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mx = Math.max(12, Math.min(500, (e.clientX - r.left) * (512 / r.width)));
  my = Math.max(12, Math.min(500, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

function setBlock(wx, wy, id) {
  const tx = Math.floor(wx / CW), ty = Math.floor(wy / CH);
  if (tx < 0 || tx >= MW || ty < 0 || ty >= MH) return;
  colGrid[tx + ty * MW] = id;
}
function getBlock(wx, wy) {
  const tx = Math.floor(wx / CW), ty = Math.floor(wy / CH);
  if (tx < 0 || tx >= MW || ty < 0 || ty >= MH) return -1;
  return colGrid[tx + ty * MW];
}

function spawnGem() {
  let x, y, tries = 0;
  do {
    x = 40 + Math.random() * 432;
    y = 40 + Math.random() * 432;
    tries++;
  } while (tries < 25 && hazards.some(h => Math.hypot(x - h.x, y - h.y) < h.r + 50));
  return { x, y };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetGems = Number(custom.targetGems) || 15;
  const droneCount = Number(custom.droneCount) || 24;
  colGrid.fill(0);
  collected = 0; timeLeft = 45; score = 0; won = false; over = false;
  mx = 256; my = 256;

  actors = [];
  let k = 0;
  for (let i = 0; i < droneCount; i++) {
    k++; if (k > 6) k = 1;
    const cx = 80 + k * 36;
    const cy = 80 + Math.floor(i / 6) * 36;
    const a = { cx, cy, id: i + 1, alive: true };
    actors.push(a);
    setBlock(cx, cy, a.id);
  }

  hazards = [
    { x: 110, y: 400, vx: 65, vy: -45, r: 28 },
    { x: 400, y: 110, vx: -55, vy: 60, r: 28 },
    { x: 420, y: 410, vx: -48, vy: -52, r: 26 }
  ];

  gems = [spawnGem(), spawnGem(), spawnGem()];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const step = dt * 95;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    // Move patrolling hazards
    for (const h of hazards) {
      h.x += h.vx * dt; h.y += h.vy * dt;
      if (h.x < h.r + 8 || h.x > 504 - h.r) { h.vx *= -1; h.x = Math.max(h.r + 8, Math.min(504 - h.r, h.x)); }
      if (h.y < h.r + 8 || h.y > 504 - h.r) { h.vy *= -1; h.y = Math.max(h.r + 8, Math.min(504 - h.r, h.y)); }
    }

    // Faithful xActor grid-collision follow loop
    for (const a of actors) {
      if (!a.alive) continue;
      let vx = 0, vy = 0;
      if (a.cx < mx - 16) vx = step;
      else if (a.cx > mx + 16) vx = -step;
      if (a.cy < my - 16) vy = step;
      else if (a.cy > my + 16) vy = -step;

      const dx = Math.max(8, Math.min(504, a.cx + vx));
      const dy = Math.max(8, Math.min(504, a.cy + vy));
      const occ = getBlock(dx, dy);
      if (occ === 0 || occ === a.id) {
        setBlock(a.cx, a.cy, 0);
        a.cx = dx; a.cy = dy;
        setBlock(a.cx, a.cy, a.id);
      }

      // Check hazard collision
      if (hazards.some(h => Math.hypot(a.cx - h.x, a.cy - h.y) < h.r + 4)) {
        a.alive = false;
        setBlock(a.cx, a.cy, 0);
        continue;
      }

      // Check gem collection
      for (let g = 0; g < gems.length; g++) {
        if (Math.hypot(a.cx - gems[g].x, a.cy - gems[g].y) < 18) {
          collected++;
          score += 25;
          gems[g] = spawnGem();
          if (collected >= targetGems) {
            won = true; over = true;
            const aliveN = actors.filter(x => x.alive).length;
            score += aliveN * 10 + Math.ceil(timeLeft) * 8;
          }
          break;
        }
      }
    }

    const aliveN = actors.filter(x => x.alive).length;
    if (aliveN < 4 && !won) over = true;
  }

  const aliveN = actors.filter(x => x.alive).length;
  document.getElementById("stat").textContent = `Cristaux: ${collected}/${targetGems} • Drones: ${aliveN} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Draw 16x16 collision grid cells
  ctx.strokeStyle = "rgba(56,214,255,0.07)";
  ctx.lineWidth = 1;
  for (let i = 1; i < MW; i++) {
    ctx.beginPath(); ctx.moveTo(i * CW, 0); ctx.lineTo(i * CW, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CH); ctx.lineTo(512, i * CH); ctx.stroke();
  }
  for (let r = 0; r < MH; r++) {
    for (let c = 0; c < MW; c++) {
      if (colGrid[c + r * MW] > 0) {
        ctx.fillStyle = "rgba(56,214,255,0.12)";
        ctx.fillRect(c * CW + 2, r * CH + 2, CW - 4, CH - 4);
      }
    }
  }

  // Hazards
  for (const h of hazards) {
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(248,113,113,0.22)"; ctx.fill();
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // Gems
  for (const g of gems) {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(now * 0.003);
    ctx.fillStyle = "#4ade80";
    ctx.strokeStyle = "#bbf7d0";
    ctx.lineWidth = 2;
    ctx.fillRect(-8, -8, 16, 16);
    ctx.strokeRect(-8, -8, 16, 16);
    ctx.restore();
  }

  // Drones (xActor)
  for (const a of actors) {
    if (!a.alive) continue;
    ctx.beginPath(); ctx.arc(a.cx, a.cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#38d6ff"; ctx.fill();
    ctx.strokeStyle = "#e6f4ff"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Mouse beacon
  ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2);
  ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#fde047"; ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ESSAIM VICTORIEUX !" : (aliveN < 4 ? "ESSAIM DÉCIMÉ" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
