<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Bataille Spatiale (BraveWar)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "bravewar",
  "name": "Bataille Spatiale (BraveWar)",
  "family": "tactical",
  "icon": "⚔️",
  "controls": "Touches 1/2/3 ou boutons Escadron + clic pour donner un cap, C/Libre pour chasse libre",
  "description": "Combat tactique de flottes 18v18 avec escadrons, flocking et promotions vétérans (braveWar.as).",
  "goal": "Anéantir les 18 vaisseaux ennemis en coordonnant vos 3 escadrons.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 90 }
  ]
}
</script>
<div class="bar">
  <span>⚔️ <b>BraveWar</b></span>
  <span id="stat">Alliés: 18 • Ennemis: 18 • 90s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "bravewar";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const SQUAD_COLORS = { 1: "#4ade80", 2: "#fb923c", 3: "#38d6ff" };
const HUD_BTNS = [
  { id: 1, label: "Esc 1", x: 14, y: 468, w: 66, h: 32, col: "#4ade80" },
  { id: 2, label: "Esc 2", x: 88, y: 468, w: 66, h: 32, col: "#fb923c" },
  { id: 3, label: "Esc 3", x: 162, y: 468, w: 66, h: 32, col: "#38d6ff" },
  { id: 0, label: "Libre", x: 238, y: 468, w: 66, h: 32, col: "#e2e8f0" }
];

let ships = [], lasers = [], stars = [], marks = [];
let controlSquad = 0, selectedShip = null;
let tickCount = 0, timeLeft = 90, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (over) return;
  if (e.key === "1") controlSquad = 1;
  else if (e.key === "2") controlSquad = 2;
  else if (e.key === "3") controlSquad = 3;
  else if (e.key === "c" || e.key === "C" || e.code === "Space") {
    e.preventDefault();
    clearOrders();
  }
});

function clearOrders() {
  controlSquad = 0;
  for (const s of ships) {
    if (s.flag === 1) s.controlled = false;
  }
  for (const m of marks) { m.active = false; }
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (512 / r.width);
  const y = (e.clientY - r.top) * (512 / r.height);

  // Check HUD squad buttons
  for (const b of HUD_BTNS) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.id === 0) clearOrders();
      else controlSquad = (controlSquad === b.id ? 0 : b.id);
      return;
    }
  }

  // If a squad is active, assign tactical waypoint
  if (controlSquad > 0) {
    for (const s of ships) {
      if (s.flag === 1 && !s.unpowered && s.squad === controlSquad) {
        s.tx = x; s.ty = y; s.controlled = true;
      }
    }
    marks[controlSquad - 1] = { x, y, active: true, rot: 0 };
    controlSquad = 0;
    return;
  }

  // Otherwise inspect nearest ship or quick-command all squads if clicking empty space
  let best = null, bestD = 18;
  for (const s of ships) {
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bestD) { bestD = d; best = s; }
  }
  if (best) {
    selectedShip = best;
  } else {
    // Quick rally all allies toward click
    for (let q = 1; q <= 3; q++) {
      const ox = (q - 2) * 32;
      marks[q - 1] = { x: Math.max(20, Math.min(492, x + ox)), y: Math.max(20, Math.min(450, y)), active: true, rot: 0 };
    }
    for (const s of ships) {
      if (s.flag === 1 && !s.unpowered) {
        s.tx = marks[s.squad - 1].x;
        s.ty = marks[s.squad - 1].y;
        s.controlled = true;
      }
    }
  }
});

function makeShip(flag, idx, squad, x, y, angle) {
  const dp = 7 + Math.floor(Math.random() * 4);
  const ap = 5 + Math.floor(Math.random() * 4);
  const ep = 2 + Math.floor(Math.random() * 3);
  const fullhp = (dp + 10) * 5 - ep * 2;
  const maxSpeed = 1.45 + ep * 0.22;
  return {
    flag, id: idx, squad,
    x, y,
    vx: Math.cos(angle) * 0.8,
    vy: Math.sin(angle) * 0.8,
    fx: 0, fy: 0,
    angle,
    dp, ap, ep,
    hp: fullhp, fullhp,
    atk: ap * 0.85,
    maxSpeed,
    vet: 0,
    unpowered: false,
    controlled: false,
    tx: x, ty: y,
    target: null
  };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 90;
  ships = [];
  lasers = [];
  marks = [
    { x: -50, y: -50, active: false, rot: 0 },
    { x: -50, y: -50, active: false, rot: 0 },
    { x: -50, y: -50, active: false, rot: 0 }
  ];
  controlSquad = 0;
  selectedShip = null;
  tickCount = 0;
  score = 0; won = false; over = false;

  if (stars.length === 0) {
    for (let i = 0; i < 120; i++) {
      stars.push({ x: Math.random() * 512, y: Math.random() * 512, a: 0.2 + Math.random() * 0.6 });
    }
  }

  // Enemy fleet (flag 0, top-left) - 18 ships
  for (let i = 0; i < 18; i++) {
    const col = Math.floor(i / 3), row = i % 3;
    const x = 44 + col * 36 + (Math.random() * 8 - 4);
    const y = 44 + row * 28 + (Math.random() * 8 - 4);
    ships.push(makeShip(0, i, 0, x, y, Math.PI / 2 + (Math.random() - 0.5) * 0.3));
  }
  // Player fleet (flag 1, bottom-right) - 18 ships in 3 squads of 6
  for (let i = 0; i < 18; i++) {
    const squad = Math.floor(i / 6) + 1;
    const col = Math.floor(i / 3), row = i % 3;
    const x = 468 - col * 36 + (Math.random() * 8 - 4);
    const y = 412 - row * 28 + (Math.random() * 8 - 4);
    ships.push(makeShip(1, 18 + i, squad, x, y, -Math.PI / 2 + (Math.random() - 0.5) * 0.3));
  }
}

function addSeek(s, tx, ty, weight) {
  const dx = tx - s.x, dy = ty - s.y;
  const d = Math.hypot(dx, dy) || 0.001;
  const desX = (dx / d) * s.maxSpeed;
  const desY = (dy / d) * s.maxSpeed;
  s.fx += (desX - s.vx) * weight;
  s.fy += (desY - s.vy) * weight;
}

function inSight(a, b, range) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy);
  if (dist > range) return false;
  const dot = dx * Math.cos(a.angle) + dy * Math.sin(a.angle);
  return dot >= 0;
}

function stepCombat() {
  lasers = [];
  for (const s of ships) {
    if (s.unpowered) continue;
    let best = null, bestD = 1e9;
    for (const e of ships) {
      if (e.flag === s.flag || e.unpowered) continue;
      const d = (s.x - e.x) ** 2 + (s.y - e.y) ** 2;
      if (d < bestD) { bestD = d; best = e; }
    }
    s.target = best;
    if (best && inSight(s, best, 64)) {
      lasers.push({
        x1: s.x + Math.cos(s.angle) * 8,
        y1: s.y + Math.sin(s.angle) * 8,
        x2: best.x + (Math.random() * 5 - 2.5),
        y2: best.y + (Math.random() * 5 - 2.5),
        col: s.flag === 0 ? "#60a5fa" : "#fde047"
      });
      if (s.flag === 1) score += 0.2;
      best.hp -= s.atk;
      if (best.hp <= 0) {
        best.hp = 0;
        best.unpowered = true;
        if (best.flag === 0) score += 60;
        if (s.vet === 0) {
          s.vet = 1;
          s.atk += 2.2;
          if (s.flag === 1) score += 35;
        }
      }
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  let allies = 0, enemies = 0;
  let hp0 = 0, full0 = 1, hp1 = 0, full1 = 1;
  let sqAlive = { 1: 0, 2: 0, 3: 0 };

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);

    for (const s of ships) {
      if (s.unpowered) continue;
      s.fx = 0; s.fy = 0;

      if (s.controlled) {
        addSeek(s, s.tx, s.ty, 0.08);
        if (Math.hypot(s.tx - s.x, s.ty - s.y) < 22) s.controlled = false;
      } else if (s.target && !s.target.unpowered) {
        const dist = Math.hypot(s.target.x - s.x, s.target.y - s.y);
        const ahead = Math.min(20, dist / s.maxSpeed);
        addSeek(s, s.target.x + s.target.vx * ahead, s.target.y + s.target.vy * ahead, 0.065);
      }

      // Flocking with allies
      let avgX = 0, avgY = 0, avgVx = 0, avgVy = 0, cnt = 0;
      for (const o of ships) {
        if (o === s || o.unpowered || o.flag !== s.flag) continue;
        const dx = o.x - s.x, dy = o.y - s.y;
        const d = Math.hypot(dx, dy);
        if (d < 44) {
          avgX += o.x; avgY += o.y;
          avgVx += o.vx; avgVy += o.vy;
          cnt++;
          if (d < 16 && d > 0.01) {
            s.fx -= (dx / d) * 0.16;
            s.fy -= (dy / d) * 0.16;
          }
        }
      }
      if (cnt > 0) {
        addSeek(s, avgX / cnt, avgY / cnt, 0.018);
        s.fx += (avgVx / cnt - s.vx) * 0.02;
        s.fy += (avgVy / cnt - s.vy) * 0.02;
      }

      const fMag = Math.hypot(s.fx, s.fy);
      if (fMag > 0.22) { s.fx = (s.fx / fMag) * 0.22; s.fy = (s.fy / fMag) * 0.22; }
      s.vx += s.fx * f;
      s.vy += s.fy * f;
      const vMag = Math.hypot(s.vx, s.vy);
      if (vMag > s.maxSpeed) { s.vx = (s.vx / vMag) * s.maxSpeed; s.vy = (s.vy / vMag) * s.maxSpeed; }
      s.x += s.vx * f;
      s.y += s.vy * f;

      if (s.x < 12) { s.x = 12; s.vx *= -0.7; }
      if (s.x > 500) { s.x = 500; s.vx *= -0.7; }
      if (s.y < 12) { s.y = 12; s.vy *= -0.7; }
      if (s.y > 454) { s.y = 454; s.vy *= -0.7; }

      if (vMag > 0.05) s.angle = Math.atan2(s.vy, s.vx);
    }

    for (const m of marks) m.rot += dt * 2.2;

    tickCount++;
    if (tickCount % 5 === 0) stepCombat();
  }

  for (const s of ships) {
    if (s.flag === 0) {
      hp0 += s.hp; full0 += s.fullhp;
      if (!s.unpowered) enemies++;
    } else {
      hp1 += s.hp; full1 += s.fullhp;
      if (!s.unpowered) { allies++; sqAlive[s.squad]++; }
    }
  }

  if (!over) {
    if (enemies === 0) {
      won = true; over = true;
      score = Math.round(score + allies * 120 + timeLeft * 4);
    } else if (allies === 0 || timeLeft <= 0) {
      won = allies > enemies;
      over = true;
      score = Math.round(score + (won ? allies * 60 : 0));
    }
  }

  document.getElementById("stat").textContent = `Alliés: ${allies} • Ennemis: ${enemies} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  for (const st of stars) {
    ctx.fillStyle = `rgba(186,230,253,${st.a})`;
    ctx.fillRect(st.x, st.y, 1.5, 1.5);
  }

  // Waypoint lines & rotating marks
  for (const s of ships) {
    if (s.flag === 1 && !s.unpowered && s.controlled) {
      ctx.strokeStyle = "rgba(148,163,184,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.tx, s.ty); ctx.stroke();
    }
  }
  for (let i = 0; i < 3; i++) {
    const m = marks[i];
    if (!m.active) continue;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.strokeStyle = SQUAD_COLORS[i + 1];
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.moveTo(0, -14); ctx.lineTo(0, 14); ctx.stroke();
    ctx.restore();
  }

  // Ships (dead first, alive on top)
  for (const pass of [true, false]) {
    for (const s of ships) {
      if (s.unpowered !== pass) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.globalAlpha = s.unpowered ? 0.28 : 1;

      if (!s.unpowered && s.flag === 1 && controlSquad === s.squad) {
        ctx.strokeStyle = SQUAD_COLORS[s.squad];
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
      }
      if (selectedShip === s) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
      }

      ctx.fillStyle = s.flag === 0 ? "#3b82f6" : (SQUAD_COLORS[s.squad] || "#f87171");
      ctx.strokeStyle = s.flag === 0 ? "#bfdbfe" : "#ffffff";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-7, 4.5);
      ctx.lineTo(-7, -4.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Veteran chevron
      if (s.vet > 0) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-3, 3); ctx.lineTo(-3, -3); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Lasers
  ctx.lineWidth = 1.2;
  for (const l of lasers) {
    ctx.strokeStyle = l.col;
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
  }

  // Fleet HP vertical bars (bottom-right, faithful to braveWar.as)
  const h0 = (hp0 / full0) * 68;
  const h1 = (hp1 / full1) * 68;
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(466, 390, 12, 68);
  ctx.fillRect(484, 390, 12, 68);
  ctx.fillStyle = "#3b82f6";
  ctx.fillRect(466, 458 - h0, 12, h0);
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(484, 458 - h1, 12, h1);
  ctx.fillStyle = "#93c5fd"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(String(enemies), 472, 385);
  ctx.fillStyle = "#86efac";
  ctx.fillText(String(allies), 490, 385);

  // Selected ship info
  if (selectedShip) {
    ctx.fillStyle = "rgba(18,26,43,0.82)";
    ctx.fillRect(10, 10, 185, 50);
    ctx.strokeStyle = "#2d5b7b";
    ctx.strokeRect(10, 10, 185, 50);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`${selectedShip.flag ? "Allié Esc." + selectedShip.squad : "Ennemi"} ${selectedShip.vet ? "★Vétéran" : ""}`, 18, 26);
    ctx.fillText(`PV: ${Math.ceil(selectedShip.hp)}/${selectedShip.fullhp}  ATQ: ${selectedShip.atk.toFixed(1)}`, 18, 44);
  }

  // Bottom HUD squad control bar
  ctx.fillStyle = "rgba(10,14,24,0.9)";
  ctx.fillRect(0, 460, 512, 52);
  ctx.strokeStyle = "#2d5b7b";
  ctx.beginPath(); ctx.moveTo(0, 460); ctx.lineTo(512, 460); ctx.stroke();

  for (const b of HUD_BTNS) {
    const dead = b.id > 0 && sqAlive[b.id] === 0;
    const active = b.id > 0 && controlSquad === b.id;
    ctx.globalAlpha = dead ? 0.35 : 1;
    ctx.fillStyle = active ? b.col : "#162238";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = b.col;
    ctx.lineWidth = active ? 2 : 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = active ? "#0a0e18" : b.col;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(b.id > 0 ? `${b.label} (${sqAlive[b.id]})` : b.label, b.x + b.w / 2, b.y + 20);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(controlSquad ? `Cliquez un cap pour Esc.${controlSquad}` : "Cliquez un Esc. puis une cible", 500, 488);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "VICTOIRE DE LA FLOTTE !" : "FLOTTE DÉCIMÉE", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${Math.round(score)} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
