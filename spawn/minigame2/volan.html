<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Volant Articulé (Volan)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "volan",
  "name": "Volant Articulé (Volan)",
  "family": "clavDir",
  "icon": "🚚",
  "controls": "Flèches / ZQSD (Haut/Bas accélérer, Gauche/Droite braquer) ou maintenir clic/doigt",
  "description": "Conduite d'un véhicule articulé avec remorque et angle de braquage contraint (volan.as).",
  "goal": "Valider les 8 balises dans l'ordre en évitant les pylônes.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 }
  ]
}
</script>
<div class="bar">
  <span>🚚 <b>Volan Articulé</b></span>
  <span id="stat">Balises: 0/8 • ♥3 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "volan";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let cx = 256, cy = 256, ca = 0, cp = 0, ka = 0, vx = 0, vy = 0;
let wx = 224, wy = 256, wr = 34;
let checkpoints = [], pillars = [], trail = [];
let nextIdx = 0, lives = 3, invuln = 0;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => { const pt = getPos(e); mx = pt.x; my = pt.y; });
window.addEventListener("pointerup", () => { down = false; });

function angDiff(a, b) {
  a -= b;
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  cx = 110; cy = 420; vx = 0; vy = 0;
  wx = 76; wy = 420;
  ca = 0; cp = 0; ka = 0;
  nextIdx = 0; lives = 3; invuln = 0;
  score = 0; won = false; over = false;
  trail = [];

  checkpoints = [
    { x: 400, y: 420 },
    { x: 430, y: 260 },
    { x: 260, y: 270 },
    { x: 90, y: 270 },
    { x: 90, y: 100 },
    { x: 256, y: 80 },
    { x: 425, y: 105 },
    { x: 256, y: 185 }
  ];
  pillars = [
    { x: 256, y: 365, r: 22 },
    { x: 345, y: 205, r: 18 },
    { x: 170, y: 185, r: 20 },
    { x: 345, y: 340, r: 16 },
    { x: 170, y: 340, r: 16 }
  ];
}

function hitPillar(px, py, rad) {
  for (const p of pillars) {
    const dx = px - p.x, dy = py - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < p.r + rad) return { p, dx, dy, dist: dist || 0.001 };
  }
  return null;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Core volan.as articulated steering kinematics
    cp = ca;
    ca = Math.atan2(cy - wy, cx - wx);
    ka += angDiff(ca, cp);

    const d = angDiff(ka, ca);
    const t = 1.4;
    if (d > t) ka += (t - d);
    if (d < -t) ka += (-t - d);

    const up = keys.ArrowUp || keys.KeyW || keys.KeyZ;
    const dn = keys.ArrowDown || keys.KeyS;
    const lt = keys.ArrowLeft || keys.KeyA || keys.KeyQ;
    const rt = keys.ArrowRight || keys.KeyD;

    const ms = 0.14 * f;
    if (up) { vx += Math.cos(ka) * ms; vy += Math.sin(ka) * ms; }
    if (dn) { vx -= Math.cos(ka) * ms; vy -= Math.sin(ka) * ms; }
    if (lt) ka -= 0.085 * f;
    if (rt) ka += 0.085 * f;

    if (down) {
      const targetAng = Math.atan2(my - cy, mx - cx);
      const diff = angDiff(targetAng, ka);
      ka += Math.max(-0.11 * f, Math.min(0.11 * f, diff * 0.28 * f));
      const dist = Math.hypot(mx - cx, my - cy);
      if (dist > 20) {
        vx += Math.cos(ka) * ms;
        vy += Math.sin(ka) * ms;
      }
    }

    // Re-clamp steering wheel angle
    const d2 = angDiff(ka, ca);
    if (d2 > t) ka += (t - d2);
    if (d2 < -t) ka += (-t - d2);

    const damp = Math.pow(0.975, f);
    vx *= damp; vy *= damp;

    cx += vx * f; cy += vy * f;
    wx += vx * 0.5 * f; wy += vy * 0.5 * f;

    // Arena walls
    const pad = 18;
    if (cx < pad) { cx = pad; vx *= -0.5; }
    if (cx > 512 - pad) { cx = 512 - pad; vx *= -0.5; }
    if (cy < pad) { cy = pad; vy *= -0.5; }
    if (cy > 512 - pad) { cy = 512 - pad; vy *= -0.5; }

    // Trailer distance constraint (faithful to volan.as)
    let dx = wx - cx, dy = wy - cy;
    let mag = Math.hypot(dx, dy) || 0.001;
    dx /= mag; dy /= mag;
    const corr = wr - mag;
    wx += dx * corr * 0.5;
    wy += dy * corr * 0.5;
    wx = Math.max(16, Math.min(496, wx));
    wy = Math.max(16, Math.min(496, wy));

    // Pillar collisions
    const hit = hitPillar(cx, cy, 14) || hitPillar(wx, wy, 13);
    if (hit) {
      const nx = hit.dx / hit.dist, ny = hit.dy / hit.dist;
      cx += nx * 4; cy += ny * 4;
      vx = nx * 2.4; vy = ny * 2.4;
      if (invuln <= 0) {
        lives--;
        invuln = 1.1;
        score = Math.max(0, score - 20);
        if (lives <= 0) { over = true; won = false; }
      }
    }

    // Tire trail
    if (Math.hypot(vx, vy) > 0.4) {
      trail.push({ x: wx, y: wy, a: 0.6 });
      if (trail.length > 45) trail.shift();
    }
    for (const tr of trail) tr.a = Math.max(0, tr.a - dt * 0.35);

    // Checkpoints
    const target = checkpoints[nextIdx];
    if (target && Math.hypot(cx - target.x, cy - target.y) < 30) {
      nextIdx++;
      score += 75;
      if (nextIdx >= checkpoints.length) {
        won = true;
        over = true;
        score += Math.round(timeLeft * 8) + lives * 35;
      }
    }
  }

  document.getElementById("stat").textContent = `Balises: ${nextIdx}/${checkpoints.length} • ♥${lives} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle circuit grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  for (let g = 32; g < 512; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  // Guide path between checkpoints
  ctx.strokeStyle = "rgba(56,214,255,0.14)";
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Trail
  for (const tr of trail) {
    if (tr.a <= 0) continue;
    ctx.fillStyle = `rgba(56,214,255,${(tr.a * 0.35).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Pillars
  for (const p of pillars) {
    ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "rgba(248,113,113,0.25)";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }

  // Checkpoints
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    const done = i < nextIdx;
    const active = i === nextIdx;
    ctx.beginPath();
    ctx.arc(c.x, c.y, active ? 22 + Math.sin(now / 140) * 3 : 16, 0, Math.PI * 2);
    ctx.fillStyle = done ? "rgba(74,222,128,0.18)" : (active ? "rgba(253,224,71,0.24)" : "rgba(56,214,255,0.08)");
    ctx.fill();
    ctx.strokeStyle = done ? "#4ade80" : (active ? "#fde047" : "#334155");
    ctx.lineWidth = active ? 2.5 : 1.5;
    ctx.stroke();
    ctx.fillStyle = done ? "#4ade80" : (active ? "#fde047" : "#94a3b8");
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(i + 1), c.x, c.y + 4);
  }

  // Articulated vehicle (tractor + hitch + trailer)
  const blink = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
  if (!blink) {
    // Hitch bar
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(cx, cy); ctx.stroke();

    // Trailer (wx, wy)
    ctx.fillStyle = "#1d4ed8";
    ctx.beginPath(); ctx.arc(wx, wy, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#93c5fd";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Tractor (cx, cy)
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Chassis axis (ca)
    ctx.strokeStyle = "rgba(15,23,42,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ca) * 12, cy + Math.sin(ca) * 12);
    ctx.stroke();

    // Steered front wheel / heading (ka)
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ka) * 22, cy + Math.sin(ka) * 22);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "PARCOURS VALIDÉ !" : (lives <= 0 ? "VÉHICULE HORS SERVICE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
