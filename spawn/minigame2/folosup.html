<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Essaim Poursuivant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "folosup",
  "name": "Essaim Poursuivant",
  "family": "topMouseMut",
  "icon": "🤖",
  "controls": "Déplacer la souris / doigt pour esquiver l'essaim qui recalcule sa cible par vagues",
  "description": "Essaim de drones-blocs avec collisions glissantes et verrouillage décalé.",
  "goal": "Survivre 30 secondes face à l'essaim tout en récoltant des bonus !",
  "fields": [
    { "key": "duration", "label": "Durée à tenir (s)", "type": "number", "default": 30 },
    { "key": "botCount", "label": "Drones", "type": "number", "default": 14 }
  ]
}
</script>
<div class="bar">
  <span>🤖 <b>Essaim Poursuivant</b></span>
  <span id="stat">♥3 • 30s • Score 0</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "folosup";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 256, y: 256 };
let bots = [];
let bonus = null;
let gt = 0, tickAcc = 0;
let lives = 3, invuln = 1.0, timeLeft = 30, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(12, Math.min(500, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(12, Math.min(500, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

function isInside2(ax, ay, ar, b) {
  if (ax < b.cx - (b.xrad + ar)) return false;
  if (ax > b.cx + (b.xrad + ar)) return false;
  if (ay < b.cy - (b.xrad + ar)) return false;
  if (ay > b.cy + (b.xrad + ar)) return false;
  return true;
}

function spawnBonus() {
  bonus = {
    x: 48 + Math.random() * 416,
    y: 48 + Math.random() * 416
  };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Math.max(10, Number(custom.duration) || 30);
  const cnt = Math.max(6, Math.min(20, Number(custom.botCount) || 14));
  lives = 3; invuln = 1.0; score = 0; won = false; over = false;
  gt = 0; tickAcc = 0;
  mouse = { x: 256, y: 256 };

  bots = [];
  for (let i = 0; i < cnt; i++) {
    const t = (i / cnt) * Math.PI * 2;
    const cx = 256 + Math.cos(t) * 185;
    const cy = 256 + Math.sin(t) * 185;
    bots.push({
      cx, cy,
      xrad: 15,
      ang: Math.atan2(256 - cy, 256 - cx),
      flash: 0
    });
  }
  spawnBonus();
}

// One 30Hz-equivalent step faithful to foloSup.as
function stepSwarm() {
  const num = bots.length;
  for (let i = 0; i < num; i++) {
    const a = bots[i];
    if ((gt + i) % 40 === 0) {
      a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx);
      a.flash = 1;
    }
    let vx = Math.cos(a.ang) * 3.8;
    let vy = Math.sin(a.ang) * 3.8;

    for (let k = 0; k < num; k++) {
      if (i === k) continue;
      const b = bots[k];
      if (isInside2(a.cx + vx, a.cy + vy, a.xrad, b)) {
        if (isInside2(a.cx + vx, a.cy, a.xrad * 0.8, b)) vx = 0;
        if (isInside2(a.cx, a.cy + vy, a.xrad * 0.8, b)) vy = 0;
      }
    }

    a.cx += vx;
    a.cy += vy;

    // Bounce back softly if leaving arena
    if (a.cx < a.xrad) { a.cx = a.xrad; a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx); }
    if (a.cx > 512 - a.xrad) { a.cx = 512 - a.xrad; a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx); }
    if (a.cy < a.xrad) { a.cy = a.xrad; a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx); }
    if (a.cy > 512 - a.xrad) { a.cy = 512 - a.xrad; a.ang = Math.atan2(mouse.y - a.cy, mouse.x - a.cx); }
  }
  gt++;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    score += dt * 4;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    tickAcc += dt;
    while (tickAcc >= 1 / 45) {
      stepSwarm();
      tickAcc -= 1 / 45;
    }

    // Bonus orb pickup
    if (bonus && Math.hypot(mouse.x - bonus.x, mouse.y - bonus.y) < 22) {
      score += 35;
      spawnBonus();
    }

    // Collision with bots
    if (invuln <= 0) {
      for (const a of bots) {
        if (Math.hypot(mouse.x - a.cx, mouse.y - a.cy) < a.xrad + 7) {
          lives--;
          invuln = 1.1;
          // Push bots away slightly
          for (const b of bots) {
            const dx = b.cx - mouse.x, dy = b.cy - mouse.y;
            const d = Math.hypot(dx, dy) || 1;
            if (d < 90) {
              b.cx = Math.max(b.xrad, Math.min(512 - b.xrad, b.cx + (dx / d) * 32));
              b.cy = Math.max(b.xrad, Math.min(512 - b.xrad, b.cy + (dy / d) * 32));
            }
          }
          if (lives <= 0) over = true;
          break;
        }
      }
    }

    if (!over && timeLeft <= 0) {
      won = true;
      over = true;
      score += lives * 40;
    }
  }

  for (const a of bots) {
    if (a.flash > 0) a.flash = Math.max(0, a.flash - dt * 3);
  }

  document.getElementById("stat").textContent = `♥${lives} • ${Math.ceil(timeLeft)}s • Score ${Math.round(score)}`;

  // Draw
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Bonus
  if (bonus) {
    const p = 1 + Math.sin(now * 0.008) * 0.15;
    ctx.beginPath();
    ctx.arc(bonus.x, bonus.y, 11 * p, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(250,204,21,0.25)";
    ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Bots (square + inscribed circle, faithful to foloSup.as)
  for (const a of bots) {
    const strokeCol = a.flash > 0.1 ? "#fde047" : "#f87171";
    ctx.fillStyle = a.flash > 0.1 ? "rgba(250,204,21,0.22)" : "rgba(248,113,113,0.16)";
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2;
    ctx.fillRect(a.cx - a.xrad, a.cy - a.xrad, a.xrad * 2, a.xrad * 2);
    ctx.strokeRect(a.cx - a.xrad, a.cy - a.xrad, a.xrad * 2, a.xrad * 2);
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.xrad - 2, 0, Math.PI * 2);
    ctx.stroke();
    // Heading tick
    ctx.beginPath();
    ctx.moveTo(a.cx, a.cy);
    ctx.lineTo(a.cx + Math.cos(a.ang) * (a.xrad - 2), a.cy + Math.sin(a.ang) * (a.xrad - 2));
    ctx.stroke();
  }

  // Player cursor orb
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = "#38d6ff";
    ctx.fill();
    ctx.strokeStyle = "#aef0ff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ESSAIM ESQUIVÉ !" : "CAPTURÉ PAR L'ESSAIM", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${Math.round(score)} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
