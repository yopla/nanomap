<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Grimpeur de Corniches (Coin)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "coin",
  "name": "Grimpeur de Corniches (Coin)",
  "family": "sideClavSimple",
  "icon": "🪙",
  "controls": "Flèches / ZQSD (Gauche/Droite courir & se hisser, Haut sauter) ou maintenir clic/doigt",
  "description": "Plateformer sur grille 16×16 avec accrochage et rétablissement sur corniches (coin.as).",
  "goal": "Ramasser les 10 pièces d'or en grimpant de corniche en corniche.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 60 }
  ]
}
</script>
<div class="bar">
  <span>🪙 <b>Grimpeur Coin</b></span>
  <span id="stat">Pièces: 0/10 • 60s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "coin";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 16, MH = 16, CW = 32, CH = 32;
let grid = new Uint8Array(MW * MH);
let keys = {}, down = false, mx = 256, my = 256;
let p = {}, coins = [];
let collected = 0, timeLeft = 60, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => { const pt = getPos(e); mx = pt.x; my = pt.y; });
window.addEventListener("pointerup", () => { down = false; });

function setTile(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  grid[ay * MW + ax] = t;
}
function getTile(ax, ay) {
  const ix = Math.floor(ax), iy = Math.floor(ay);
  if (ix < 0 || ix >= MW || iy < 0 || iy >= MH) return 0;
  return grid[iy * MW + ix];
}
function isWall(ax, ay) {
  if (ax < 0 || ay < 0 || ax >= 512 || ay >= 512) return true;
  return getTile(ax / CW, ay / CH) > 0;
}

function buildLevel() {
  grid.fill(0);
  // Outer borders
  for (let i = 0; i < 16; i++) {
    setTile(i, 15, 1);
    setTile(0, i, 1);
    setTile(15, i, 1);
    setTile(i, 0, 1);
  }
  // Platforms & climbable ledges designed for coin.as ledge-grabbing
  const tiles = [
    // Row 12
    [2,12],[3,12],[4,12],[11,12],[12,12],[13,12],
    // Row 10
    [6,10],[7,10],[8,10],[9,10],
    // Vertical wall-climb pillar on left
    [4,8],[4,7],
    // Row 8
    [1,8],[2,8],[11,8],[12,8],[13,8],[14,8],
    // Row 6
    [6,6],[7,6],[8,6],[9,6],
    // Row 4
    [2,4],[3,4],[4,4],[11,4],[12,4],[13,4],
    // Top crown ledge
    [7,2],[8,2]
  ];
  for (const [x, y] of tiles) setTile(x, y, 1);

  const coinCoords = [
    [3, 11], [12, 11], [7, 9], [2, 7], [13, 7],
    [7, 5], [3, 3], [12, 3], [7, 1], [14, 14]
  ];
  coins = coinCoords.map(([tx, ty]) => ({
    x: tx * CW + 16,
    y: ty * CH + 16,
    taken: false
  }));
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 60;
  buildLevel();
  p = {
    cx: 256, cy: 460, vx: 0, vy: 0,
    canJump: false, hangMode: 0, gx: 0, gy: 0, dir: 0
  };
  collected = 0;
  score = 0; won = false; over = false;
}

function stepPhysics() {
  const keyJump = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space || (down && my < p.cy - 26));
  const keyLeft = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ || (down && mx < p.cx - 18));
  const keyRight = !!(keys.ArrowRight || keys.KeyD || (down && mx > p.cx + 18));

  const ms = 0.55, ws = 4.2;

  if (keyLeft) { p.vx -= ms; if (p.vx < -ws) p.vx = -ws; p.dir = 16; }
  if (keyRight) { p.vx += ms; if (p.vx > ws) p.vx = ws; p.dir = 0; }

  // Ledge-grab & mantle state machine (faithful to coin.as xAct)
  if (p.hangMode < 0) p.hangMode += 1;
  if (p.hangMode === 0 && isWall(p.cx + 9, p.cy - 8) && !isWall(p.cx + 9, p.cy - 18) && p.vy >= 0 && p.dir === 0) {
    p.hangMode = 1; p.gx = p.cx + 10; p.gy = p.cy - 18; p.vx = 0; p.vy = 0;
  }
  if (p.hangMode === 1 && keyRight) p.hangMode = 2;
  if (p.hangMode === 1 && keyLeft) { p.hangMode = -8; p.vy = -1; }
  if (p.hangMode === 2) {
    p.cx += 1.4;
    if (p.cx > p.gx) { p.cx = p.gx; p.hangMode = 0; p.vx = 0; }
    p.cy += (p.gy - p.cy) * 0.25;
  }

  if (p.hangMode === 0 && isWall(p.cx - 9, p.cy - 8) && !isWall(p.cx - 9, p.cy - 18) && p.vy >= 0 && p.dir !== 0) {
    p.hangMode = 3; p.gx = p.cx - 10; p.gy = p.cy - 18; p.vx = 0; p.vy = 0;
  }
  if (p.hangMode === 3 && keyLeft) p.hangMode = 4;
  if (p.hangMode === 3 && keyRight) { p.hangMode = -8; p.vy = -1; }
  if (p.hangMode === 4) {
    p.cx -= 1.4;
    if (p.cx < p.gx) { p.cx = p.gx; p.hangMode = 0; p.vx = 0; }
    p.cy += (p.gy - p.cy) * 0.25;
  }

  if ((p.hangMode === 1 || p.hangMode === 3) && keyJump) {
    p.hangMode = -8;
    p.vy = -6.2;
  }
  if (p.hangMode > 0) return;

  if (keyJump && p.canJump) { p.vy = -7.6; p.canJump = false; }
  if (!keyJump && p.vy < 0) p.vy += 0.32;
  if (p.canJump && !keyLeft && !keyRight) p.vx *= 0.8;

  p.vy += 0.32;
  p.vx *= 0.98;
  if (p.vy > 1 || p.vy < -1) p.canJump = false;

  if (p.vx > 0 && isWall(p.cx + 8, p.cy)) p.vx = 0;
  else if (p.vx < 0 && isWall(p.cx - 8, p.cy)) p.vx = 0;

  if (p.vy > 0 && isWall(p.cx, p.cy + 8 + p.vy)) { p.vy = 0; p.canJump = true; }
  else if (p.vy < 0 && isWall(p.cx, p.cy - 8)) p.vy = 0;

  p.cx += p.vx;
  p.cy += p.vy;

  if (isWall(p.cx, p.cy + 8)) { p.cy = Math.floor(p.cy) - 1; }
  else if (p.vy >= 0 && p.vy < 1 && !isWall(p.cx, p.cy + 9)) { p.cy += 1; }
}

let last = performance.now(), accum = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Fixed 60Hz substeps for exact coin.as tile-physics feel
    accum += dt;
    while (accum >= 1 / 60) {
      stepPhysics();
      accum -= 1 / 60;
    }

    for (const c of coins) {
      if (!c.taken && Math.hypot(p.cx - c.x, p.cy - c.y) < 18) {
        c.taken = true;
        collected++;
        score += 50;
      }
    }
    if (collected >= coins.length) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 8);
    }
  }

  const hangTxt = (p.hangMode === 1 || p.hangMode === 3) ? " • ACCROCHÉ" : "";
  document.getElementById("stat").textContent = `Pièces: ${collected}/${coins.length}${hangTxt} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Tile grid
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (grid[y * MW + x] <= 0) continue;
      const ax = x * CW, ay = y * CH;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(ax, ay, CW, CH);
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      ctx.strokeRect(ax + 0.5, ay + 0.5, CW - 1, CH - 1);
      // Neon top ledge highlight if air above
      if (y > 0 && grid[(y - 1) * MW + x] === 0) {
        ctx.fillStyle = "#38d6ff";
        ctx.fillRect(ax, ay, CW, 3);
      }
    }
  }

  // Coins
  for (const c of coins) {
    if (c.taken) continue;
    const bob = Math.sin(now / 200 + c.x) * 2.5;
    ctx.fillStyle = "rgba(253,224,71,0.2)";
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fef9c3";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Player & grabbing hand (faithful to coin.as)
  const handX = p.dir === 0 ? p.cx + 8 : p.cx - 8;
  const handY = p.cy - 8;
  ctx.fillStyle = p.hangMode > 0 ? "#4ade80" : "#fde047";
  ctx.beginPath(); ctx.arc(handX, handY, 4.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(p.cx, p.cy, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TOUTES LES PIÈCES RÉCOLTÉES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
