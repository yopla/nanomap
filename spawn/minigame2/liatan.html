<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Ombres Liatan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "liatan",
  "name": "Ombres Liatan",
  "family": "topMouseMut",
  "icon": "🔦",
  "controls": "Déplacer la lampe (souris / doigt) pour contourner les piliers ; cliquer pour un flash solaire",
  "description": "Projection d'ombres dynamiques 2D autour de 16 piliers : chassez les spectres qui se cachent dans l'ombre.",
  "goal": "Illuminer et dissiper les 12 spectres d'ombre avant la fin du temps imparti !",
  "fields": [
    { "key": "wispCount", "label": "Spectres à dissiper", "type": "number", "default": 12 }
  ]
}
</script>
<div class="bar">
  <span>🔦 <b>Ombres Liatan</b></span>
  <span id="stat">Spectres: 0/12 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "liatan";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 256, y: 256 };
let pillars = [], wisps = [], particles = [];
let wispGoal = 12, purged = 0, timeLeft = 40, score = 0, won = false, over = false;
let flashTimer = 0, flashCd = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  if (flashCd <= 0) { flashTimer = 0.65; flashCd = 3.0; }
});

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 110;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, col });
  }
}

function isOccludedByPillar(px, py) {
  const vx = px - mouse.x, vy = py - mouse.y;
  const distSq = vx * vx + vy * vy;
  const dist = Math.sqrt(distSq) || 1;
  for (const p of pillars) {
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const proj = (dx * vx + dy * vy) / dist;
    if (proj <= 0 || proj >= dist) continue;
    const perpX = dx - (vx / dist) * proj;
    const perpY = dy - (vy / dist) * proj;
    if (perpX * perpX + perpY * perpY < (p.r + 3) * (p.r + 3)) return true;
  }
  return false;
}

function spawnWisp() {
  for (let tries = 0; tries < 60; tries++) {
    const x = 44 + Math.random() * 424, y = 44 + Math.random() * 424;
    if (Math.hypot(x - mouse.x, y - mouse.y) < 110) continue;
    if (pillars.some(p => Math.hypot(x - p.x, y - p.y) < 28)) continue;
    const a = Math.random() * Math.PI * 2;
    wisps.push({ x, y, vx: Math.cos(a) * 55, vy: Math.sin(a) * 55, burn: 0, phase: Math.random() * 6 });
    return;
  }
  wisps.push({ x: 80, y: 80, vx: 45, vy: 35, burn: 0, phase: 0 });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  wispGoal = Math.max(4, Number(custom.wispCount) || 12);
  purged = 0; timeLeft = 40; score = 0; won = false; over = false;
  flashTimer = 0; flashCd = 0;
  pillars = []; wisps = []; particles = [];

  for (let i = 0; i < 16; i++) {
    let placed = false;
    for (let tries = 0; tries < 60; tries++) {
      const x = 48 + Math.random() * 416, y = 48 + Math.random() * 416;
      if (pillars.every(p => Math.hypot(x - p.x, y - p.y) > 58)) {
        pillars.push({ x, y, r: 10 });
        placed = true;
        break;
      }
    }
    if (!placed) pillars.push({ x: 64 + (i % 4) * 128, y: 64 + Math.floor(i / 4) * 128, r: 10 });
  }
  for (let i = 0; i < 4; i++) spawnWisp();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const lightRadius = flashTimer > 0 ? 270 : 185;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    flashTimer = Math.max(0, flashTimer - dt);
    flashCd = Math.max(0, flashCd - dt);
    if (timeLeft <= 0) over = true;

    for (let i = wisps.length - 1; i >= 0; i--) {
      const w = wisps[i];
      w.phase += dt * 5;
      const dLight = Math.hypot(w.x - mouse.x, w.y - mouse.y);
      const hidden = isOccludedByPillar(w.x, w.y);
      const inLight = !hidden && dLight < lightRadius;

      if (inLight) {
        // Try to flee away from light into shadows
        const fleeA = Math.atan2(w.y - mouse.y, w.x - mouse.x);
        w.vx += Math.cos(fleeA) * 140 * dt;
        w.vy += Math.sin(fleeA) * 140 * dt;
        const rate = (flashTimer > 0 ? 2.4 : 1.35) * (1 - (dLight / lightRadius) * 0.45);
        w.burn += rate * dt;
      } else {
        w.burn = Math.max(0, w.burn - 0.35 * dt);
        w.vx += Math.cos(w.phase * 0.7) * 35 * dt;
        w.vy += Math.sin(w.phase * 0.9) * 35 * dt;
      }

      const sp = Math.hypot(w.vx, w.vy);
      if (sp > 95) { w.vx = (w.vx / sp) * 95; w.vy = (w.vy / sp) * 95; }
      w.x += w.vx * dt; w.y += w.vy * dt;
      if (w.x < 18 || w.x > 494) { w.vx *= -1; w.x = Math.max(18, Math.min(494, w.x)); }
      if (w.y < 18 || w.y > 494) { w.vy *= -1; w.y = Math.max(18, Math.min(494, w.y)); }

      for (const p of pillars) {
        const dp = Math.hypot(w.x - p.x, w.y - p.y);
        if (dp < p.r + 13) {
          const nx = (w.x - p.x) / (dp || 1), ny = (w.y - p.y) / (dp || 1);
          w.x = p.x + nx * (p.r + 13); w.y = p.y + ny * (p.r + 13);
          w.vx += nx * 60; w.vy += ny * 60;
        }
      }

      if (w.burn >= 1) {
        burst(w.x, w.y, "#fde047", 16);
        wisps.splice(i, 1);
        purged++;
        score += 45;
        if (purged >= wispGoal) {
          won = true; over = true;
          score += Math.round(timeLeft * 10);
        } else if (purged + wisps.length < wispGoal) {
          spawnWisp();
        }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  const flashTxt = flashCd <= 0 ? "⚡Flash prêt" : `⚡${Math.ceil(flashCd)}s`;
  document.getElementById("stat").textContent = `Spectres: ${purged}/${wispGoal} • ${flashTxt} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Background
  ctx.fillStyle = "#080c16";
  ctx.fillRect(0, 0, 512, 512);

  // Radial light cone
  const grad = ctx.createRadialGradient(mouse.x, mouse.y, 8, mouse.x, mouse.y, lightRadius);
  grad.addColorStop(0, flashTimer > 0 ? "rgba(253,224,71,0.48)" : "rgba(56,214,255,0.34)");
  grad.addColorStop(0.55, flashTimer > 0 ? "rgba(250,204,21,0.16)" : "rgba(56,214,255,0.11)");
  grad.addColorStop(1, "rgba(13,20,34,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Wisps (drawn BEFORE shadows so shadows visibly shield/darken them!)
  for (const w of wisps) {
    const hidden = isOccludedByPillar(w.x, w.y);
    ctx.beginPath();
    ctx.arc(w.x, w.y, 11 + Math.sin(w.phase) * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = hidden ? "rgba(167,139,250,0.45)" : (w.burn > 0.05 ? "#fde047" : "#c084fc");
    ctx.fill();
    ctx.strokeStyle = hidden ? "#6b21a8" : "#f5f3ff";
    ctx.lineWidth = 2;
    ctx.stroke();

    if (w.burn > 0.02) {
      ctx.beginPath();
      ctx.arc(w.x, w.y, 16, -Math.PI / 2, -Math.PI / 2 + w.burn * Math.PI * 2);
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Dynamic 2D shadow cones (exact AS3 tangent projection extended to arena edge)
  for (const p of pillars) {
    const ta = Math.atan2(p.y - mouse.y, p.x - mouse.x);
    const nx = Math.cos(ta), ny = Math.sin(ta);
    const r = p.r + 1;
    const x0 = p.x + ny * r, y0 = p.y - nx * r;
    const x1 = p.x - ny * r, y1 = p.y + nx * r;
    const d = Math.hypot(p.x - mouse.x, p.y - mouse.y) || 1;
    const ext = 740;
    const bx0 = x0 + ((x0 - mouse.x) / d) * ext;
    const by0 = y0 + ((y0 - mouse.y) / d) * ext;
    const bx1 = x1 + ((x1 - mouse.x) / d) * ext;
    const by1 = y1 + ((y1 - mouse.y) / d) * ext;

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(bx1, by1);
    ctx.lineTo(bx0, by0);
    ctx.closePath();
    ctx.fillStyle = "rgba(4,7,14,0.88)";
    ctx.fill();
  }

  // Lit pillars on top (exact AS3 second pass)
  for (const p of pillars) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "#e6f4ff";
    ctx.fill();
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 0.45);
    ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Crosshair lantern cursor (from AS3)
  ctx.strokeStyle = flashTimer > 0 ? "#fde047" : "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mouse.x - 10, mouse.y); ctx.lineTo(mouse.x + 10, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 10); ctx.lineTo(mouse.x, mouse.y + 10);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "OMBRES DISSIPÉES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
