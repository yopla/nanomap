<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Archipel Symbiose (Specc)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; gap: 6px; flex-wrap: wrap; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; image-rendering: pixelated; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "specc",
  "name": "Archipel Symbiose (Specc)",
  "family": "zooEcosys",
  "icon": "🌱",
  "controls": "Clic/glisser pour semer la flore (1) ou creuser un canal d'eau (2) / Espace pour basculer",
  "description": "Gardez en équilibre un archipel proie-prédateur où les brouteurs rouges poursuivent la flore verte par gradient thermique.",
  "goal": "Maintenir les deux espèces vivantes jusqu'à la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🌱 <b>Symbiose Specc</b></span>
  <span id="stat">🌿 0 • 🔴 0 • 45s</span>
  <div>
    <button id="btnTool" onclick="toggleTool()">🌱 Semer [1]</button>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "specc";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const W = 128, H = 128, WH = W * H;
const EMPTY = -1, WATER = -2, PLANT = 0, GRAZER = 1, SOURCE = 255;
const DIRS = [[0,-1],[0,1],[-1,0],[1,0]];

const offCv = document.createElement("canvas");
offCv.width = W; offCv.height = H;
const offCtx = offCv.getContext("2d");
const imgData = offCtx.createImageData(W, H);

let waterVec = new Int8Array(WH);
let lifeVec = new Int8Array(WH);
let coords = new Int32Array(WH);
let heatPlant = new Int16Array(WH);

let counts = [0, 0];
let plantTimer = 65, grazerSpawnT = 7, grazerStarveT = 42;
let tool = 0; // 0 = seed plants, 1 = carve water barrier
let energy = 100;
let down = false, mx = 64, my = 64;
let timeLeft = 45, score = 0, won = false, over = false, simAcc = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function updateToolBtn() {
  const b = document.getElementById("btnTool");
  if (tool === 0) {
    b.textContent = "🌱 Semer [1]";
    b.style.borderColor = "#4ade80";
    b.style.color = "#4ade80";
  } else {
    b.textContent = "💧 Digue [2]";
    b.style.borderColor = "#38d6ff";
    b.style.color = "#38d6ff";
  }
}
function toggleTool() { tool = 1 - tool; updateToolBtn(); }

window.addEventListener("keydown", (e) => {
  if (over) return;
  if (e.key === "1") { tool = 0; updateToolBtn(); }
  else if (e.key === "2") { tool = 1; updateToolBtn(); }
  else if (e.code === "Space") { e.preventDefault(); toggleTool(); }
});

function updatePointer(e) {
  const r = cv.getBoundingClientRect();
  mx = Math.max(0, Math.min(W - 1, Math.floor(((e.clientX - r.left) / r.width) * W)));
  my = Math.max(0, Math.min(H - 1, Math.floor(((e.clientY - r.top) / r.height) * H)));
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePointer(e); applyBrush();
});
cv.addEventListener("pointermove", (e) => { updatePointer(e); if (down && !over) applyBrush(); });
window.addEventListener("pointerup", () => { down = false; });

function applyBrush() {
  if (energy < 4) return;
  const rad = tool === 0 ? 4 : 3;
  let used = 0;
  for (let dy = -rad; dy <= rad; dy++) {
    for (let dx = -rad; dx <= rad; dx++) {
      if (dx * dx + dy * dy > rad * rad) continue;
      const x = (mx + dx) & (W - 1), y = (my + dy) & (H - 1);
      const idx = y * W + x;
      if (tool === 0) {
        if (lifeVec[idx] === EMPTY && Math.random() < 0.55) {
          spawnCell(idx, PLANT);
          used++;
        }
      } else {
        if (lifeVec[idx] === EMPTY) {
          lifeVec[idx] = WATER;
          waterVec[idx] = WATER;
          heatPlant[idx] = WATER;
          used++;
        }
      }
    }
  }
  if (used > 0) energy = Math.max(0, energy - 3.5);
}

function generateTerrain() {
  const g1 = new Float32Array(64), g2 = new Float32Array(256);
  for (let i = 0; i < 64; i++) g1[i] = Math.random();
  for (let i = 0; i < 256; i++) g2[i] = Math.random();
  function sample(grid, sz, x, y) {
    const gx = x * sz / W, gy = y * sz / H;
    const x0 = Math.floor(gx) & (sz - 1), y0 = Math.floor(gy) & (sz - 1);
    const x1 = (x0 + 1) & (sz - 1), y1 = (y0 + 1) & (sz - 1);
    const tx = gx - Math.floor(gx), ty = gy - Math.floor(gy);
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    return (grid[y0 * sz + x0] * (1 - sx) + grid[y0 * sz + x1] * sx) * (1 - sy) +
           (grid[y1 * sz + x0] * (1 - sx) + grid[y1 * sz + x1] * sx) * sy;
  }
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const n = sample(g1, 8, x, y) * 0.65 + sample(g2, 16, x, y) * 0.35;
      waterVec[y * W + x] = (Math.abs(n - 0.5) < 0.08) ? WATER : EMPTY;
    }
  }
}

function spawnCell(idx, id) {
  if (lifeVec[idx] !== EMPTY) return false;
  lifeVec[idx] = id;
  counts[id]++;
  if (id === PLANT) heatPlant[idx] = SOURCE;
  return true;
}

function killCell(idx, id) {
  lifeVec[idx] = EMPTY;
  counts[id]--;
  if (id === PLANT) heatPlant[idx] = SOURCE - 1;
}

function updateHeat() {
  let sample = heatPlant[(H - 1) * W];
  for (let y = 0; y < H; y++) {
    const row = y * W;
    if ((y & 1) === 0) {
      for (let x = 0; x < W; x++) {
        const prev = sample; sample = heatPlant[row + x];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heatPlant[row + x] = sample;
      }
    } else {
      for (let x = W - 1; x >= 0; x--) {
        const prev = sample; sample = heatPlant[row + x];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heatPlant[row + x] = sample;
      }
    }
  }
  for (let x = 0; x < W; x++) {
    if ((x & 1) === 0) {
      for (let y = 0; y < H; y++) {
        const k = y * W + x;
        const prev = sample; sample = heatPlant[k];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heatPlant[k] = sample;
      }
    } else {
      for (let y = H - 1; y >= 0; y--) {
        const k = y * W + x;
        const prev = sample; sample = heatPlant[k];
        if (sample === SOURCE || sample === WATER) continue;
        sample = prev > sample ? prev - 1 : sample - 4;
        if (sample < 0) sample = 0;
        heatPlant[k] = sample;
      }
    }
  }
}

function stepSim() {
  if (counts[PLANT] > 0) updateHeat();
  for (let i = 0; i < WH; i++) {
    const idx = coords[i];
    const id = lifeVec[idx];
    if (id < 0) continue;
    const cx = idx & (W - 1), cy = idx >> 7;
    if (id === PLANT) {
      plantTimer--;
      if (plantTimer <= 0) {
        const d = DIRS[(Math.random() * 4) | 0];
        const nx = (cx + d[0]) & (W - 1), ny = (cy + d[1]) & (H - 1);
        if (lifeVec[ny * W + nx] === EMPTY) {
          spawnCell(ny * W + nx, PLANT);
          plantTimer = 65;
        }
      }
    } else {
      grazerStarveT--;
      if (grazerStarveT <= 0) {
        killCell(idx, GRAZER);
        grazerStarveT = 42;
        continue;
      }
      let bestH = -999, viable = [];
      for (let k = 0; k < 4; k++) {
        const d = DIRS[k];
        const nx = (cx + d[0]) & (W - 1), ny = (cy + d[1]) & (H - 1);
        const nh = heatPlant[ny * W + nx];
        if (nh > bestH) { bestH = nh; viable = [d]; }
        else if (nh === bestH) viable.push(d);
      }
      const chosen = viable[(Math.random() * viable.length) | 0];
      const nx = (cx + chosen[0]) & (W - 1), ny = (cy + chosen[1]) & (H - 1);
      const nIdx = ny * W + nx;
      const nid = lifeVec[nIdx];
      if (nid === EMPTY) {
        spawnCell(nIdx, GRAZER);
        killCell(idx, GRAZER);
      } else if (nid === PLANT) {
        killCell(nIdx, PLANT);
        spawnCell(nIdx, GRAZER);
        grazerSpawnT--;
        if (grazerSpawnT <= 0) grazerSpawnT = 7;
        else killCell(idx, GRAZER);
      }
    }
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false; simAcc = 0; energy = 100;
  tool = 0; updateToolBtn();
  generateTerrain();
  lifeVec.set(waterVec);
  for (let i = 0; i < WH; i++) {
    heatPlant[i] = waterVec[i] === WATER ? WATER : 0;
    coords[i] = i;
  }
  for (let i = WH - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = coords[i]; coords[i] = coords[j]; coords[j] = t;
  }
  counts = [0, 0];
  let tries = 0;
  while (counts[PLANT] < 700 && tries++ < 20000) spawnCell((Math.random() * WH) | 0, PLANT);
  tries = 0;
  while (counts[GRAZER] < 22 && tries++ < 5000) spawnCell((Math.random() * WH) | 0, GRAZER);
}

function renderMap() {
  const d = imgData.data;
  for (let i = 0; i < WH; i++) {
    const p = i << 2;
    const v = lifeVec[i];
    if (v === WATER) { d[p] = 16; d[p+1] = 44; d[p+2] = 88; d[p+3] = 255; }
    else if (v === EMPTY) {
      const h = Math.max(0, heatPlant[i]) >> 4;
      d[p] = 10; d[p+1] = 16 + h; d[p+2] = 28; d[p+3] = 255;
    }
    else if (v === PLANT) { d[p] = 74; d[p+1] = 222; d[p+2] = 128; d[p+3] = 255; }
    else { d[p] = 255; d[p+1] = 75; d[p+2] = 95; d[p+3] = 255; }
  }
  offCtx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCv, 0, 0, 512, 512);

  // Brush cursor
  if (!over) {
    ctx.strokeStyle = tool === 0 ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc((mx + 0.5) * 4, (my + 0.5) * 4, (tool === 0 ? 4 : 3) * 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Bio-energy bar
  ctx.fillStyle = "rgba(10,14,24,0.75)";
  ctx.fillRect(8, 8, 496, 22);
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(100, 14, 200, 10);
  ctx.fillStyle = tool === 0 ? "#4ade80" : "#38d6ff";
  ctx.fillRect(100, 14, energy * 2, 10);
  ctx.fillStyle = "#e6f4ff"; ctx.font = "bold 11px system-ui, sans-serif"; ctx.textAlign = "left";
  ctx.fillText("BIO-ÉNERGIE", 16, 23);
  ctx.textAlign = "right";
  ctx.fillText(`Score: ${Math.round(score)}`, 494, 23);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    energy = Math.min(100, energy + 24 * dt);
    if (down) applyBrush();
    simAcc += dt;
    while (simAcc >= 1 / 20) {
      simAcc -= 1 / 20;
      stepSim();
    }
    if (counts[PLANT] > 0 && counts[GRAZER] > 0) {
      const balance = Math.min(counts[PLANT], counts[GRAZER] * 12);
      score += (5 + Math.min(25, balance * 0.04)) * dt;
    } else {
      over = true; won = false;
    }
    if (timeLeft <= 0 && !over) {
      over = true; won = true;
      score += 150;
    }
  }

  document.getElementById("stat").textContent = `🌿 ${counts[PLANT]} • 🔴 ${counts[GRAZER]} • ${Math.ceil(timeLeft)}s`;
  renderMap();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ÉQUILIBRE MAINTENU !" : (counts[PLANT] === 0 ? "FLORE ÉTEINTE !" : "BROUTEURS ÉTEINTS !"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${Math.round(score)} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
