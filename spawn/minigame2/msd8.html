<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Lignes Stellaires</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: pointer; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "msd8",
  "name": "Lignes Stellaires",
  "family": "income",
  "icon": "✨",
  "controls": "Glisser les sommets de la Frame active (bouton A/B ou Espace pour basculer)",
  "description": "Deux frames clés de 8 sommets reliés par interpolation stellaire continue.",
  "goal": "Faites passer les impulsions stellaires sur les 6 balises vertes sans traverser les anomalies rouges !",
  "fields": [
    { "key": "beaconCount", "label": "Balises à charger", "type": "number", "default": 6 },
    { "key": "hazardCount", "label": "Anomalies rouges", "type": "number", "default": 3 }
  ]
}
</script>
<div class="bar">
  <span>✨ <b>Lignes Stellaires</b></span>
  <span id="stat">Balises: 0/6 • 45s • Score 0</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "msd8";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const BTN = { x: 18, y: 454, w: 126, h: 40 };
let frame0 = [], frame1 = [], activeFrame = 0;
let beacons = [], hazards = [];
let mx = 256, my = 256, mdown = false, curSel = null;
let gt = 0, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}

function toggleFrame() {
  activeFrame = activeFrame === 0 ? 1 : 0;
  curSel = null;
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Tab") {
    e.preventDefault();
    if (!over) toggleFrame();
  }
});

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e);
  mx = p.x; my = p.y; mdown = true;
  if (mx >= BTN.x && mx <= BTN.x + BTN.w && my >= BTN.y && my <= BTN.y + BTN.h) {
    toggleFrame();
    return;
  }
  const activeVerts = activeFrame === 0 ? frame0 : frame1;
  const otherVerts = activeFrame === 0 ? frame1 : frame0;
  curSel = activeVerts.find(v => Math.hypot(v.cx - mx, v.cy - my) < 18) || null;
  if (!curSel) {
    const otherHit = otherVerts.find(v => Math.hypot(v.cx - mx, v.cy - my) < 16);
    if (otherHit) { toggleFrame(); curSel = otherHit; }
  }
});
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e);
  mx = p.x; my = p.y;
  if (mdown && curSel) {
    curSel.cx = Math.max(18, Math.min(494, mx));
    curSel.cy = Math.max(18, Math.min(440, my));
  }
});
window.addEventListener("pointerup", () => { mdown = false; curSel = null; });

function segDistPoint(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const beaconCount = Number(custom.beaconCount) || 6;
  const hazardCount = Number(custom.hazardCount) || 3;
  activeFrame = 0; curSel = null; gt = 0; timeLeft = 45; score = 0; won = false; over = false;

  frame0 = []; frame1 = [];
  for (let i = 0; i < 8; i++) {
    frame0.push({ cx: 64 + Math.random() * 140, cy: 64 + (i * 44) });
    frame1.push({ cx: 300 + Math.random() * 140, cy: 64 + (i * 44) });
  }

  hazards = [];
  for (let i = 0; i < hazardCount; i++) {
    hazards.push({
      x: 150 + Math.random() * 212,
      y: 90 + (i / Math.max(1, hazardCount - 1)) * 270 + (Math.random() * 40 - 20),
      r: 26
    });
  }

  beacons = [];
  for (let i = 0; i < beaconCount; i++) {
    let x, y, tries = 0;
    do {
      x = 80 + Math.random() * 352;
      y = 60 + Math.random() * 350;
      tries++;
    } while (tries < 30 && (
      hazards.some(h => Math.hypot(x - h.x, y - h.y) < h.r + 48) ||
      beacons.some(b => Math.hypot(x - b.x, y - b.y) < 62)
    ));
    beacons.push({ x, y, r: 20, charge: 0, done: false });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    gt += dt * 40;
  }

  const t = (gt % 25) * 0.04;

  // Determine which lines are blocked by hazards & update beacon charges
  const lineBlocked = new Array(8).fill(false);
  for (let i = 0; i < 8; i++) {
    const a = frame0[i], b = frame1[i];
    for (const h of hazards) {
      if (segDistPoint(a.cx, a.cy, b.cx, b.cy, h.x, h.y) < h.r + 4) {
        lineBlocked[i] = true;
        break;
      }
    }
    if (!over && !lineBlocked[i]) {
      const px = a.cx + (b.cx - a.cx) * t;
      const py = a.cy + (b.cy - a.cy) * t;
      for (const bc of beacons) {
        if (bc.done) continue;
        if (Math.hypot(px - bc.x, py - bc.y) < bc.r + 12) {
          bc.charge = Math.min(1, bc.charge + dt * 1.45);
          if (bc.charge >= 1) {
            bc.done = true;
            score += 45;
          }
        }
      }
    }
  }

  const doneCount = beacons.filter(b => b.done).length;
  if (!over && doneCount === beacons.length) {
    won = true; over = true;
    score += Math.ceil(timeLeft) * 10;
  }

  document.getElementById("stat").textContent = `Balises: ${doneCount}/${beacons.length} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Hazards
  for (const h of hazards) {
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(248,113,113,0.2)"; ctx.fill();
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#fca5a5"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("✕", h.x, h.y + 4);
  }

  // Beacons
  for (const bc of beacons) {
    ctx.beginPath(); ctx.arc(bc.x, bc.y, bc.r, 0, Math.PI * 2);
    ctx.fillStyle = bc.done ? "rgba(74,222,128,0.28)" : "rgba(56,214,255,0.1)";
    ctx.fill();
    ctx.strokeStyle = bc.done ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = 2; ctx.stroke();

    if (bc.charge > 0) {
      ctx.beginPath();
      ctx.arc(bc.x, bc.y, bc.r - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * bc.charge);
      ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 4; ctx.stroke();
    }
  }

  // Trajectory lines & interpolated stellar pulses
  for (let i = 0; i < 8; i++) {
    const a = frame0[i], b = frame1[i];
    ctx.beginPath(); ctx.moveTo(a.cx, a.cy); ctx.lineTo(b.cx, b.cy);
    ctx.strokeStyle = lineBlocked[i] ? "rgba(248,113,113,0.45)" : "rgba(174,240,255,0.35)";
    ctx.lineWidth = 2; ctx.stroke();

    const px = a.cx + (b.cx - a.cx) * t;
    const py = a.cy + (b.cy - a.cy) * t;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fillStyle = lineBlocked[i] ? "#f87171" : "#fde047";
    ctx.fill();
  }

  // Draw Frame 0 (cyan) and Frame 1 (magenta) vertices
  const drawVerts = (verts, color, isActive) => {
    for (let i = 0; i < verts.length; i++) {
      const v = verts[i];
      const overV = Math.hypot(v.cx - mx, v.cy - my) < 15;
      ctx.beginPath(); ctx.arc(v.cx, v.cy, isActive ? 9 : 6, 0, Math.PI * 2);
      ctx.fillStyle = (curSel === v || (isActive && overV)) ? color : (isActive ? "rgba(13,20,34,0.9)" : "rgba(13,20,34,0.6)");
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = isActive ? 2.5 : 1.5;
      ctx.stroke();
    }
  };
  if (activeFrame === 0) {
    drawVerts(frame1, "#e879f9", false);
    drawVerts(frame0, "#38d6ff", true);
  } else {
    drawVerts(frame0, "#38d6ff", false);
    drawVerts(frame1, "#e879f9", true);
  }

  // Faithful on-canvas frame switch button (getBtn)
  const overBtn = mx >= BTN.x && mx <= BTN.x + BTN.w && my >= BTN.y && my <= BTN.y + BTN.h;
  ctx.fillStyle = overBtn ? "#1c3552" : "#121a2b";
  ctx.strokeStyle = activeFrame === 0 ? "#38d6ff" : "#e879f9";
  ctx.lineWidth = 2;
  ctx.fillRect(BTN.x, BTN.y, BTN.w, BTN.h);
  ctx.strokeRect(BTN.x, BTN.y, BTN.w, BTN.h);
  ctx.fillStyle = "#e6f4ff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(activeFrame === 0 ? "FRAME A (Cyan)" : "FRAME B (Rose)", BTN.x + BTN.w / 2, BTN.y + 25);

  ctx.fillStyle = "rgba(174,240,255,0.6)"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("Glissez les sommets • Espace / bouton pour basculer A↔B", 156, 478);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "RÉSEAU ALIGNÉ !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
