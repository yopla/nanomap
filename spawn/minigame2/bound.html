<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Rebond Stomp (Bound)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "bound",
  "name": "Rebond Stomp (Bound)",
  "family": "sideClavSimple",
  "icon": "⚡",
  "controls": "Flèches Gauche/Droite + Haut/Espace pour sauter (ou toucher/cliquer pour guider et sauter)",
  "description": "Duel de rebonds : sautez pour écraser les sphères rebondissantes par le dessus en évitant les chocs latéraux.",
  "goal": "Écraser 10 sphères rebondissantes avant la fin du chrono sans perdre vos 3 vies.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>⚡ <b>Rebond Bound</b></span>
  <span id="stat">K.O.: 0/10 • Vies: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "bound";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const FLOOR_Y = 430;
const TARGET_KILLS = 10;
let keys = {}, down = false, mx = 256, my = 256;
let p = {}, foes = [], sparks = [];
let timeLeft = 45, score = 0, kills = 0, hp = 3, combo = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true;
  const pt = getPos(e); mx = pt.x; my = pt.y;
  if (my < FLOOR_Y - 40 && p.y >= FLOOR_Y - 12) p.vy = -10.5;
});
cv.addEventListener("pointermove", (e) => { const pt = getPos(e); mx = pt.x; my = pt.y; });
window.addEventListener("pointerup", () => { down = false; });

function spawnFoe(side) {
  const x = side < 0 ? 50 + Math.random() * 70 : 390 + Math.random() * 70;
  const bounce = 7.5 + Math.random() * 3.5;
  const vx = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.4);
  foes.push({ x, y: FLOOR_Y - 40, vx, vy: -bounce * 0.6, bounce, r: 18, hp: 1 });
}

function addSparks(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 4;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  p = { x: 140, y: FLOOR_Y, vx: 0, vy: 0, r: 18, dmgTime: 0 };
  foes = []; sparks = [];
  kills = 0; score = 0; hp = 3; combo = 0; won = false; over = false;
  spawnFoe(1);
  spawnFoe(1);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (p.dmgTime > 0) p.dmgTime = Math.max(0, p.dmgTime - dt);

    // Faithful bound.as player inertia & jump
    p.vx *= Math.pow(0.92, step);
    p.vy += 0.34 * step;
    const ms = 0.55 * step;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) p.vx -= ms;
    if (keys.ArrowRight || keys.KeyD) p.vx += ms;
    if (down) {
      if (mx < p.x - 16) p.vx -= ms * 1.1;
      else if (mx > p.x + 16) p.vx += ms * 1.1;
      if (my < p.y - 35 && p.y >= FLOOR_Y - 12) p.vy = -10.5;
    }
    if ((keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space) && p.y >= FLOOR_Y - 12) {
      p.vy = -10.5;
    }

    p.x += p.vx * step;
    p.y += p.vy * step;
    if (p.x < p.r + 4) { p.x = p.r + 4; p.vx = Math.abs(p.vx) * 0.5; }
    if (p.x > 508 - p.r) { p.x = 508 - p.r; p.vx = -Math.abs(p.vx) * 0.5; }
    if (p.y >= FLOOR_Y && p.vy > 0) { p.y = FLOOR_Y; p.vy = 0; combo = 0; }

    // Update bouncing enemies
    for (let i = foes.length - 1; i >= 0; i--) {
      const f = foes[i];
      f.vy += 0.28 * step;
      if (f.y >= FLOOR_Y && f.vy > 0) { f.y = FLOOR_Y; f.vy = -f.bounce; }
      f.x += f.vx * step;
      f.y += f.vy * step;
      if (f.x < f.r + 8) { f.x = f.r + 8; f.vx = Math.abs(f.vx); }
      if (f.x > 504 - f.r) { f.x = 504 - f.r; f.vx = -Math.abs(f.vx); }

      // Faithful stomp vs damage check from bound.as
      const dx = Math.abs(p.x - f.x);
      if (dx < p.r + f.r - 4 && p.vy > 0 && p.y < f.y && p.y >= f.y - (p.r + f.r)) {
        // Stomp!
        p.vy = -8.5;
        combo++;
        kills++;
        score += 40 + combo * 15;
        addSparks(f.x, f.y, "#fde047");
        foes.splice(i, 1);
      } else if (dx < p.r + f.r - 6 && Math.abs(p.y - f.y) < p.r + f.r - 10) {
        if (p.dmgTime <= 0) {
          p.dmgTime = 1.0;
          hp--;
          combo = 0;
          p.vx = (p.x < f.x ? -6 : 6);
          p.vy = -5;
          addSparks(p.x, p.y, "#f87171");
          if (hp <= 0) { over = true; won = false; }
        }
      }
    }

    if (kills >= TARGET_KILLS) {
      won = true; over = true;
      score += Math.round(timeLeft * 5);
    } else {
      const desired = kills >= 5 ? 3 : 2;
      while (foes.length < desired && kills + foes.length < TARGET_KILLS) {
        spawnFoe(p.x < 256 ? 1 : -1);
      }
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * step; s.y += s.vy * step; s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  document.getElementById("stat").textContent = `K.O.: ${kills}/${TARGET_KILLS} • Vies: ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Arena floor
  ctx.fillStyle = "#1c3552";
  ctx.fillRect(0, FLOOR_Y + p.r, 512, 512 - (FLOOR_Y + p.r));
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y + p.r); ctx.lineTo(512, FLOOR_Y + p.r); ctx.stroke();

  // Draw tether lines when player is above a foe (signature bound.as visual!)
  for (const f of foes) {
    if (p.y < f.y - 6) {
      ctx.strokeStyle = Math.abs(p.x - f.x) < 42 ? "rgba(74,222,128,0.75)" : "rgba(56,214,255,0.25)";
      ctx.lineWidth = Math.abs(p.x - f.x) < 42 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
  }

  // Draw foes
  for (const f of foes) {
    ctx.fillStyle = "#f97316";
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2.5; ctx.stroke();
    // Stomp target cap on top
    ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 3, -Math.PI * 0.8, -Math.PI * 0.2); ctx.stroke();
  }

  // Draw player
  const hitFlash = p.dmgTime > 0 && Math.floor(now / 70) % 2 === 0;
  ctx.fillStyle = hitFlash ? "#ef4444" : "#38d6ff";
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke();

  // Sparks
  for (const s of sparks) {
    ctx.fillStyle = s.color;
    ctx.globalAlpha = Math.max(0, s.life * 2);
    ctx.fillRect(s.x - 3, s.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  if (combo > 1 && !over) {
    ctx.fillStyle = "#fde047"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`COMBO x${combo} !`, p.x, p.y - 28);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ARÈNE NETTOYÉE !" : (hp <= 0 ? "K.O. !" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
