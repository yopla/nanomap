<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Labyrinthe Diagonal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diag",
  "name": "Labyrinthe Diagonal",
  "family": "topMouseMut",
  "icon": "⚡",
  "controls": "Déplacer la souris / doigt pour guider la sphère le long des segments diagonaux",
  "description": "Navigation fluide et glissement sur des barrières laser inclinées aléatoires.",
  "goal": "Absorber tous les noyaux lumineux avant la fin du temps imparti !",
  "fields": [
    { "key": "orbCount", "label": "Noyaux à absorber", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>⚡ <b>Labyrinthe Diagonal</b></span>
  <span id="stat">Noyaux: 0/8 • 35s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diag";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 256, y: 256 };
let ball = { cx: 256, cy: 256, vx: 0, vy: 0, rad: 14 };
let lines = [];
let orbs = [];
let timeLeft = 35, score = 0, won = false, over = false, orbTotal = 8;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

function getClosePoint(px, py, a) {
  const ax = px - a.x0, ay = py - a.y0;
  const bx = a.x1 - a.x0, by = a.y1 - a.y0;
  let t = (ax * bx + ay * by) / (bx * bx + by * by || 1);
  if (t < 0) t = 0;
  if (t > 1) t = 1;
  return { x: a.x0 + bx * t, y: a.y0 + by * t };
}

// Faithful port of diag.as lineTest
function lineTest(m) {
  for (const a of lines) {
    const pt = getClosePoint(m.cx, m.cy, a);
    const d = Math.hypot(m.cx - pt.x, m.cy - pt.y);
    if (d > m.rad) continue;
    a.glow = 1;
    const ta = Math.atan2(pt.y - m.cy, pt.x - m.cx);
    m.cx += Math.cos(ta) * (d - m.rad);
    m.cy += Math.sin(ta) * (d - m.rad);
    const nx = Math.cos(ta), ny = Math.sin(ta);
    const dot = m.vy * ny + m.vx * nx;
    if (dot > 0.35) {
      m.vx -= nx * dot;
      m.vy -= ny * dot;
    }
  }
}

function addRect(ax, ay, aw, ah) {
  lines.push({ x0: ax, y0: ay, x1: ax + aw, y1: ay, border: true, glow: 0 });
  lines.push({ x0: ax, y0: ay + ah, x1: ax + aw, y1: ay + ah, border: true, glow: 0 });
  lines.push({ x0: ax, y0: ay, x1: ax, y1: ay + ah, border: true, glow: 0 });
  lines.push({ x0: ax + aw, y0: ay, x1: ax + aw, y1: ay + ah, border: true, glow: 0 });
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  orbTotal = Math.max(4, Math.min(16, Number(custom.orbCount) || 8));
  timeLeft = 35; score = 0; won = false; over = false;
  ball = { cx: 256, cy: 256, vx: 0, vy: 0, rad: 14 };
  mouse = { x: 256, y: 256 };
  lines = [];

  // Generate diagonal segments (avoiding spawn center)
  let attempts = 0;
  while (lines.length < 28 && attempts < 300) {
    attempts++;
    const x0 = 42 + Math.random() * 428;
    const y0 = 42 + Math.random() * 428;
    const ang = Math.random() * Math.PI * 2;
    const len = 55 + Math.random() * 65;
    const x1 = Math.max(24, Math.min(488, x0 + Math.cos(ang) * len));
    const y1 = Math.max(24, Math.min(488, y0 + Math.sin(ang) * len));
    const seg = { x0, y0, x1, y1, border: false, glow: 0 };
    const cp = getClosePoint(256, 256, seg);
    if (Math.hypot(256 - cp.x, 256 - cp.y) < 48) continue;
    lines.push(seg);
  }
  addRect(10, 10, 492, 492);

  // Place energy orbs clear of segments
  orbs = [];
  let tries = 0;
  while (orbs.length < orbTotal && tries < 600) {
    tries++;
    const ox = 36 + Math.random() * 440;
    const oy = 36 + Math.random() * 440;
    if (Math.hypot(ox - 256, oy - 256) < 60) continue;
    let ok = true;
    for (const seg of lines) {
      const cp = getClosePoint(ox, oy, seg);
      if (Math.hypot(ox - cp.x, oy - cp.y) < 22) { ok = false; break; }
    }
    if (!ok) continue;
    if (orbs.some(o => Math.hypot(o.x - ox, o.y - oy) < 42)) continue;
    orbs.push({ x: ox, y: oy, taken: false });
  }
  orbTotal = orbs.length;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const sc = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    const ta = Math.atan2(mouse.y - ball.cy, mouse.x - ball.cx);
    const d = Math.hypot(mouse.x - ball.cx, mouse.y - ball.cy);
    let ms = 0.34;
    if (d < 26) {
      ms = 0;
      ball.vx *= Math.pow(0.88, sc);
      ball.vy *= Math.pow(0.88, sc);
    }
    ball.vx += Math.cos(ta) * ms * sc;
    ball.vy += Math.sin(ta) * ms * sc;
    ball.vx *= Math.pow(0.985, sc);
    ball.vy *= Math.pow(0.985, sc);

    // Clamp max velocity to prevent tunneling
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 9) { ball.vx = (ball.vx / sp) * 9; ball.vy = (ball.vy / sp) * 9; }

    lineTest(ball);
    ball.cx += ball.vx * sc;
    ball.cy += ball.vy * sc;
    lineTest(ball);

    for (const o of orbs) {
      if (!o.taken && Math.hypot(ball.cx - o.x, ball.cy - o.y) < ball.rad + 12) {
        o.taken = true;
        score += 35;
      }
    }
    if (orbs.every(o => o.taken)) {
      won = true;
      over = true;
      score += Math.round(timeLeft * 6);
    }
  }

  for (const l of lines) {
    if (l.glow > 0) l.glow = Math.max(0, l.glow - dt * 2.5);
  }

  const doneN = orbs.filter(o => o.taken).length;
  document.getElementById("stat").textContent = `Noyaux: ${doneN}/${orbTotal} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  // Draw
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Segments
  for (const w of lines) {
    ctx.beginPath();
    ctx.moveTo(w.x0, w.y0);
    ctx.lineTo(w.x1, w.y1);
    if (w.border) {
      ctx.strokeStyle = "#2d5b7b";
      ctx.lineWidth = 3;
    } else {
      ctx.strokeStyle = w.glow > 0.05 ? `rgba(56,214,255,${0.55 + w.glow * 0.45})` : "#475569";
      ctx.lineWidth = 2.5 + w.glow * 2;
    }
    ctx.stroke();
  }

  // Orbs
  const pulse = 1 + Math.sin(now * 0.008) * 0.14;
  for (const o of orbs) {
    if (o.taken) continue;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 11 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(250,204,21,0.22)";
    ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(o.x, o.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fde047";
    ctx.fill();
  }

  // Pull vector hint
  ctx.beginPath();
  ctx.moveTo(ball.cx, ball.cy);
  ctx.lineTo(mouse.x, mouse.y);
  ctx.strokeStyle = "rgba(56,214,255,0.2)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.cx, ball.cy, ball.rad, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.28)";
  ctx.fill();
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Cursor
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#aef0ff";
  ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "NOYAUX ABSORBÉS !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
