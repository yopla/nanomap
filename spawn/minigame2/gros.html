<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Absorption Cellulaire (Gros)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "gros",
  "name": "Absorption Cellulaire (Gros)",
  "family": "topOrthoClav",
  "icon": "🟢",
  "controls": "Flèches / ZQSD + Maj (turbo) ou souris/doigt pour diriger (maintenir pour turbo)",
  "description": "Absorbez les cellules plus petites que vous pour grossir dans une arène torique.",
  "goal": "Atteignez la taille 40 sans toucher de cellule plus grosse avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 50 },
    { "key": "targetSize", "label": "Taille cible", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>🟢 <b>Absorption Gros</b></span>
  <span id="stat">Taille: 10/40 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "gros";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, user = {}, enemies = [], pops = [];
let ptrActive = false, down = false, mx = 256, my = 256;
let timeLeft = 50, targetSize = 40, score = 0, eaten = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  ptrActive = false;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; ptrActive = true;
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
});
cv.addEventListener("pointermove", (e) => {
  const pt = toCanvas(e); mx = pt.x; my = pt.y;
  if (down) ptrActive = true;
});
window.addEventListener("pointerup", () => { down = false; });

function makeEnemy(fromEdge) {
  const s = 5 + Math.floor(Math.random() * 32);
  let vx = (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 1.9);
  const y = 30 + Math.random() * 452;
  let x;
  if (fromEdge) {
    x = vx > 0 ? -s - Math.random() * 60 : 512 + s + Math.random() * 60;
  } else {
    x = Math.random() < 0.5 ? Math.random() * 150 : 362 + Math.random() * 150;
  }
  return { x, y, vx, vy: 0, size: s };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 50;
  targetSize = Number(custom.targetSize) || 40;
  score = 0; eaten = 0; won = false; over = false; pops = []; ptrActive = false;
  user = { x: 256, y: 256, vx: 0, vy: 0, size: 10, newSize: 10 };
  enemies = [];
  for (let i = 0; i < 20; i++) {
    const e = makeEnemy(false);
    // Guarantee some edible starter cells
    if (i < 6) e.size = 5 + Math.floor(Math.random() * 5);
    enemies.push(e);
  }
}

function stepPhysics() {
  const boost = !!(keys.ShiftLeft || keys.ShiftRight || down);
  const spd = boost ? 3.2 : 2.1;

  const up = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ);
  const dn = !!(keys.ArrowDown || keys.KeyS);
  const lt = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ);
  const rt = !!(keys.ArrowRight || keys.KeyD);

  if (up) user.vy = -spd;
  if (dn) user.vy = spd;
  if (lt) user.vx = -spd;
  if (rt) user.vx = spd;

  if (!up && !dn && !lt && !rt && ptrActive) {
    const dx = mx - user.x, dy = my - user.y;
    const d = Math.hypot(dx, dy);
    if (d > 8) {
      user.vx = (dx / d) * spd;
      user.vy = (dy / d) * spd;
    } else {
      user.vx *= 0.85; user.vy *= 0.85;
    }
  } else if (!up && !dn && !lt && !rt) {
    if (user.vx > 0) user.vx = Math.max(0, user.vx - 0.06);
    else if (user.vx < 0) user.vx = Math.min(0, user.vx + 0.06);
    if (user.vy > 0) user.vy = Math.max(0, user.vy - 0.06);
    else if (user.vy < 0) user.vy = Math.min(0, user.vy + 0.06);
  }

  user.x += user.vx;
  user.y += user.vy;

  // Toroidal wrap-around (faithful to gros.as Buffer.applyConstraints)
  const us = user.size;
  if (user.x < -us) user.x = 512 + us;
  if (user.x > 512 + us) user.x = -us;
  if (user.y < -us) user.y = 512 + us;
  if (user.y > 512 + us) user.y = -us;

  // Smooth growth animation
  if (user.size < user.newSize) {
    user.size = Math.min(user.newSize, user.size + 0.25);
  }

  // Update enemies & collisions
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx;
    e.y += e.vy;
    if (e.x < -e.size - 10) { e.x = 512 + e.size; e.y = 30 + Math.random() * 452; }
    if (e.x > 512 + e.size + 10) { e.x = -e.size; e.y = 30 + Math.random() * 452; }

    const dist = Math.hypot(e.x - user.x, e.y - user.y);
    if (dist < user.size + e.size - 2) {
      if (user.size >= e.size) {
        pops.push({ x: e.x, y: e.y, r: e.size, life: 1 });
        enemies.splice(i, 1);
        enemies.push(makeEnemy(true));
        user.newSize += 2;
        eaten++;
        score += 20;
      } else {
        over = true; won = false;
        return;
      }
    }
  }

  if (user.newSize >= targetSize) {
    won = true; over = true;
    score += Math.round(timeLeft * 6);
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    acc += dt;
    while (acc >= 1 / 60 && !over) {
      stepPhysics();
      acc -= 1 / 60;
    }
  }

  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].r += dt * 45;
    pops[i].life -= dt * 3;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Taille: ${Math.floor(user.size)}/${targetSize} • Absorbés: ${eaten} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle ambient grid
  ctx.strokeStyle = "rgba(56,214,255,0.05)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Absorption rings
  for (const pp of pops) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pp.life);
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Enemies (faithful gros.as: display numeric size on larger/dangerous cells)
  for (const e of enemies) {
    const danger = e.size > user.size;
    ctx.save();
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fillStyle = danger ? "rgba(239,68,68,0.22)" : "rgba(56,214,255,0.2)";
    ctx.fill();
    ctx.strokeStyle = danger ? "#f87171" : "#38d6ff";
    ctx.lineWidth = 2;
    ctx.stroke();

    if (danger) {
      ctx.fillStyle = "#fecaca";
      ctx.font = `bold ${Math.max(10, Math.min(18, Math.floor(e.size * 0.75)))}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(e.size), e.x, e.y + 0.5);
    }
    ctx.restore();
  }

  // Player
  ctx.save();
  ctx.beginPath(); ctx.arc(user.x, user.y, user.size, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.32)";
  ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 14;
  ctx.fill();
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = "#e6f4ff";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(Math.floor(user.size)), user.x, user.y + 0.5);
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "TAILLE CIBLE ATTEINTE !" : (timeLeft <= 0 ? "TEMPS ÉCOULÉ" : "ABSORBÉ !"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
