<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Approche Tactique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "appr",
  "name": "Approche Tactique",
  "family": "topMouseHnS",
  "icon": "🎯",
  "controls": "Cliquer / toucher pour déplacer le mécha ; à l'arrêt dans le cercle d'aggro, il s'approche et tire auto",
  "description": "Système d'approche tactique à 3 états : ordre de déplacement, veille, puis approche automatique et tir laser à portée.",
  "goal": "Détruisez les 8 noyaux ennemis en esquivant leurs tirs entre deux phases d'approche automatique !",
  "fields": [
    { "key": "targetCount", "label": "Noyaux à détruire", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🎯 <b>Approche Tactique</b></span>
  <span id="stat">Noyaux: 0/8 • PV: 5 • 50s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "appr";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const AGGRO_R = 190, STOP_R = 76, FIRE_R = 102;
let tow = null, cores = [], bullets = [];
let targetCount = 8, destroyed = 0, hp = 5, invuln = 0;
let timeLeft = 50, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  tow.tx = Math.max(16, Math.min(496, (e.clientX - r.left) * (512 / r.width)));
  tow.ty = Math.max(16, Math.min(496, (e.clientY - r.top) * (512 / r.height)));
  tow.mode = 1;
  tow.lock = null;
});

function spawnCore() {
  let x, y, tries = 0;
  do {
    x = 64 + Math.random() * 384;
    y = 64 + Math.random() * 384;
    tries++;
  } while (tries < 25 && (Math.hypot(x - tow.cx, y - tow.cy) < 130 || cores.some(c => Math.hypot(x - c.x, y - c.y) < 110)));
  return { x, y, hp: 100, fireCd: 1.2 + Math.random() * 1.4 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Number(custom.targetCount) || 8;
  destroyed = 0; hp = 5; invuln = 0; timeLeft = 50; score = 0; won = false; over = false;
  tow = { cx: 256, cy: 256, tx: 256, ty: 256, mode: 0, lock: null };
  bullets = [];
  cores = [];
  for (let i = 0; i < Math.min(3, targetCount); i++) cores.push(spawnCore());
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Find nearest core
    let nearest = null, nearDist = Infinity;
    for (const c of cores) {
      const d = Math.hypot(tow.cx - c.x, tow.cy - c.y);
      if (d < nearDist) { nearDist = d; nearest = c; }
    }

    // Faithful 3-mode approach state machine (mode 0 idle -> mode 2 auto-approach)
    if (tow.mode === 0 && nearest) {
      if (nearDist < AGGRO_R && nearDist > STOP_R) {
        tow.mode = 2;
        tow.tx = nearest.x;
        tow.ty = nearest.y;
        tow.lock = nearest;
      }
    }
    if (tow.mode === 2 && tow.lock) {
      if (!cores.includes(tow.lock)) { tow.mode = 0; tow.lock = null; }
      else { tow.tx = tow.lock.x; tow.ty = tow.lock.y; }
    }

    // Movement
    const dx = tow.tx - tow.cx, dy = tow.ty - tow.cy;
    const dist = Math.hypot(dx, dy) || 0.0001;
    if (tow.mode === 1 && dist < 20) tow.mode = 0;
    if (tow.mode === 2 && dist < STOP_R) tow.mode = 0;

    if (tow.mode > 0) {
      const ms = 220 * dt;
      tow.cx = Math.max(16, Math.min(496, tow.cx + (dx / dist) * ms));
      tow.cy = Math.max(16, Math.min(496, tow.cy + (dy / dist) * ms));
    }

    // Laser fire on cores within FIRE_R
    for (let i = cores.length - 1; i >= 0; i--) {
      const c = cores[i];
      const d = Math.hypot(tow.cx - c.x, tow.cy - c.y);
      if (d < FIRE_R) {
        c.hp -= 55 * dt;
        if (c.hp <= 0) {
          cores.splice(i, 1);
          destroyed++;
          score += 50;
          if (destroyed >= targetCount) {
            won = true; over = true;
            score += hp * 30 + Math.ceil(timeLeft) * 8;
          } else if (destroyed + cores.length < targetCount) {
            cores.push(spawnCore());
          }
          continue;
        }
      }

      // Enemy shots
      c.fireCd -= dt;
      if (c.fireCd <= 0) {
        c.fireCd = 2.0 + Math.random() * 0.9;
        const ang = Math.atan2(tow.cy - c.y, tow.cx - c.x);
        bullets.push({ x: c.x, y: c.y, vx: Math.cos(ang) * 155, vy: Math.sin(ang) * 155 });
      }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -10 || b.x > 522 || b.y < -10 || b.y > 522) { bullets.splice(i, 1); continue; }
      if (invuln <= 0 && Math.hypot(b.x - tow.cx, b.y - tow.cy) < 18) {
        bullets.splice(i, 1);
        hp--;
        invuln = 0.8;
        if (hp <= 0) over = true;
      }
    }
  }

  document.getElementById("stat").textContent = `Noyaux: ${destroyed}/${targetCount} • PV: ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Draw cores & their aggro/engagement rings
  for (const c of cores) {
    ctx.beginPath(); ctx.arc(c.x, c.y, AGGRO_R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56,214,255,0.12)"; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath(); ctx.arc(c.x, c.y, STOP_R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(74,222,128,0.22)"; ctx.lineWidth = 1.5; ctx.stroke();

    // Laser beam if within FIRE_R
    if (Math.hypot(tow.cx - c.x, tow.cy - c.y) < FIRE_R) {
      ctx.beginPath(); ctx.moveTo(tow.cx, tow.cy); ctx.lineTo(c.x, c.y);
      ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.strokeStyle = "#e6f4ff"; ctx.lineWidth = 1.2; ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#f87171"; ctx.fill();
    ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 2; ctx.stroke();

    // HP bar
    ctx.fillStyle = "#1e293b"; ctx.fillRect(c.x - 18, c.y - 24, 36, 5);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(c.x - 18, c.y - 24, 36 * (c.hp / 100), 5);
  }

  // Movement order line
  if (tow.mode > 0) {
    ctx.beginPath(); ctx.moveTo(tow.cx, tow.cy); ctx.lineTo(tow.tx, tow.ty);
    ctx.strokeStyle = tow.mode === 1 ? "rgba(253,224,71,0.55)" : "rgba(74,222,128,0.55)";
    ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(tow.tx, tow.ty, 5, 0, Math.PI * 2);
    ctx.strokeStyle = tow.mode === 1 ? "#fde047" : "#4ade80"; ctx.stroke();
  }

  // Enemy bullets
  for (const b of bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#fb923c"; ctx.fill();
  }

  // Player mech (xTower)
  ctx.beginPath(); ctx.arc(tow.cx, tow.cy, 14, 0, Math.PI * 2);
  ctx.fillStyle = invuln > 0 && Math.floor(now / 80) % 2 === 0 ? "#f87171" : "rgba(56,214,255,0.28)";
  ctx.fill();
  ctx.strokeStyle = tow.mode === 2 ? "#4ade80" : "#38d6ff";
  ctx.lineWidth = 2.5; ctx.stroke();

  const modeLbl = tow.mode === 0 ? "VEILLE" : (tow.mode === 1 ? "ORDRE" : "APPROCHE");
  ctx.fillStyle = "rgba(174,240,255,0.85)"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(modeLbl, tow.cx, tow.cy + 28);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEUR SÉCURISÉ !" : (hp <= 0 ? "MÉCHA DÉTRUIT" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
