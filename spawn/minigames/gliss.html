<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Pare-Chocs Gliss</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "gliss",
  "name": "Pare-Chocs Gliss",
  "family": "topMouseMut",
  "icon": "🧊",
  "controls": "Déplacer la souris / doigt pour glisser autour du bloc central et pousser les sphères",
  "description": "Physique de glissement doux sur coins arrondis autour d'un pilier central.",
  "goal": "Pousser les 5 sphères dans les 4 poches d'angle vertes !",
  "fields": [
    { "key": "orbCount", "label": "Sphères à rentrer", "type": "number", "default": 5 }
  ]
}
</script>
<div class="bar">
  <span>🧊 <b>Pare-Chocs Gliss</b></span>
  <span id="stat">Sphères: 0/5 • 38s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "gliss";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const PILLAR = { x: 256, y: 256, hr: 60 };
const POCKETS = [{ x: 34, y: 34 }, { x: 478, y: 34 }, { x: 34, y: 478 }, { x: 478, y: 478 }];
let mouse = { x: 120, y: 256 }, box = { x: 120, y: 256, hr: 26 }, orbs = [], timeLeft = 38, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
function setM(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * (512 / r.width); mouse.y = (e.clientY - r.top) * (512 / r.height); }
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });

function resolveAgainstPillar(ent, hr) {
  const dx = ent.x - PILLAR.x, dy = ent.y - PILLAR.y;
  const lim = PILLAR.hr + hr;
  if (Math.abs(dx) < lim && Math.abs(dy) < lim) {
    const cx = Math.max(-PILLAR.hr + 14, Math.min(PILLAR.hr - 14, dx));
    const cy = Math.max(-PILLAR.hr + 14, Math.min(PILLAR.hr - 14, dy));
    const ox = dx - cx, oy = dy - cy, d = Math.hypot(ox, oy) || 1;
    const minD = hr + 14;
    if (d < minD) {
      ent.x = PILLAR.x + cx + (ox / d) * minD;
      ent.y = PILLAR.y + cy + (oy / d) * minD;
      return true;
    }
  }
  return false;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const cnt = Number(custom.orbCount) || 5;
  timeLeft = 38; score = 0; won = false; over = false; box = { x: 120, y: 256, hr: 26 };
  orbs = Array.from({ length: cnt }, (_, i) => {
    const ang = (i / cnt) * Math.PI * 2 + 0.4;
    return { x: 256 + Math.cos(ang) * 145, y: 256 + Math.sin(ang) * 145, vx: 0, vy: 0, inPocket: false };
  });
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    const vx = Math.max(-9, Math.min(9, mouse.x - box.x));
    const vy = Math.max(-9, Math.min(9, mouse.y - box.y));
    box.x = Math.max(box.hr, Math.min(512 - box.hr, box.x + vx));
    box.y = Math.max(box.hr, Math.min(512 - box.hr, box.y + vy));
    resolveAgainstPillar(box, box.hr);

    for (const o of orbs) {
      if (o.inPocket) continue;
      const d = Math.hypot(o.x - box.x, o.y - box.y);
      if (d < box.hr + 15) {
        const nx = (o.x - box.x) / (d || 1), ny = (o.y - box.y) / (d || 1);
        o.vx += nx * 240 * dt + vx * 22;
        o.vy += ny * 240 * dt + vy * 22;
      }
      o.vx *= 0.96; o.vy *= 0.96;
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.x < 14 || o.x > 498) { o.vx *= -0.8; o.x = Math.max(14, Math.min(498, o.x)); }
      if (o.y < 14 || o.y > 498) { o.vy *= -0.8; o.y = Math.max(14, Math.min(498, o.y)); }
      if (resolveAgainstPillar(o, 14)) { o.vx *= -0.6; o.vy *= -0.6; }
      if (POCKETS.some(pk => Math.hypot(o.x - pk.x, o.y - pk.y) < 30)) { o.inPocket = true; score += 45; }
    }
    if (orbs.every(o => o.inPocket)) { won = true; over = true; score += Math.round(timeLeft * 5); }
  }
  const doneN = orbs.filter(o => o.inPocket).length;
  document.getElementById("stat").textContent = `Sphères: ${doneN}/${orbs.length} • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  for (const pk of POCKETS) {
    ctx.beginPath(); ctx.arc(pk.x, pk.y, 26, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(74,222,128,0.22)"; ctx.fill(); ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.fillStyle = "#1e293b"; ctx.fillRect(PILLAR.x - PILLAR.hr, PILLAR.y - PILLAR.hr, PILLAR.hr * 2, PILLAR.hr * 2);
  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2; ctx.strokeRect(PILLAR.x - PILLAR.hr, PILLAR.y - PILLAR.hr, PILLAR.hr * 2, PILLAR.hr * 2);
  for (const o of orbs) if (!o.inPocket) { ctx.beginPath(); ctx.arc(o.x, o.y, 13, 0, Math.PI * 2); ctx.fillStyle = "#fde047"; ctx.fill(); }
  ctx.strokeStyle = "#38d6ff"; ctx.fillStyle = "rgba(56,214,255,0.22)"; ctx.lineWidth = 2.5;
  ctx.fillRect(box.x - box.hr, box.y - box.hr, box.hr * 2, box.hr * 2);
  ctx.strokeRect(box.x - box.hr, box.y - box.hr, box.hr * 2, box.hr * 2);
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SPHÈRES RANGÉES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
