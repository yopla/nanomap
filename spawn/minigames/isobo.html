<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Automate Isométrique (IsoBo)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "isobo",
  "name": "Automate Isométrique (IsoBo)",
  "family": "clavDir",
  "icon": "🦿",
  "controls": "Flèches / ZQSD (pilotage tank isométrique) ou maintenir clic/doigt vers la destination",
  "description": "Pilotez un automate humanoïde articulé en fil de fer 3D isométrique sur un plateau orbital gardé par des cubes sentinelles.",
  "goal": "Collecter les 7 pylônes de données dorés avant la fin du chrono sans perdre vos 3 points de blindage.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "crystalCount", "label": "Pylônes", "type": "number", "default": 7 }
  ]
}
</script>
<div class="bar">
  <span>🦿 <b>Automate IsoBo</b></span>
  <span id="stat">Pylônes: 0/7 • Blindage: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "isobo";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Faithful xQuat class from isoBo.as
class XQuat {
  constructor() { this.x = 0; this.y = 0; this.z = 0; this.w = 1; }
  reset() { this.x = 0; this.y = 0; this.z = 0; this.w = 1; }
  copyQuat(a) { this.x = a.x; this.y = a.y; this.z = a.z; this.w = a.w; }
  setValue(ax, ay, az, aw) { this.x = ax; this.y = ay; this.z = az; this.w = aw; }
  normalise() {
    let mag = this.x * this.x + this.y * this.y + this.z * this.z + this.w * this.w;
    if (mag === 1) return;
    if (mag === 0) { this.reset(); return; }
    mag = 1 / Math.sqrt(mag);
    this.x *= mag; this.y *= mag; this.z *= mag; this.w *= mag;
  }
  mul(a) {
    const tx = this.w * a.x + this.x * a.w + this.y * a.z - this.z * a.y;
    const ty = this.w * a.y + this.y * a.w + this.z * a.x - this.x * a.z;
    const tz = this.w * a.z + this.z * a.w + this.x * a.y - this.y * a.x;
    const tw = this.w * a.w - this.x * a.x - this.y * a.y - this.z * a.z;
    this.x = tx; this.y = ty; this.z = tz; this.w = tw;
  }
  rotAxis(ang, xyz = 0) {
    ang *= 0.5;
    const s = Math.sin(ang), c = Math.cos(ang);
    const ax = xyz === 0 ? s : 0, ay = xyz === 1 ? s : 0, az = xyz === 2 ? s : 0, aw = c;
    const tx = this.w * ax + this.x * aw + this.y * az - this.z * ay;
    const ty = this.w * ay + this.y * aw + this.z * ax - this.x * az;
    const tz = this.w * az + this.z * aw + this.x * ay - this.y * ax;
    const tw = this.w * aw - this.x * ax - this.y * ay - this.z * az;
    this.x = tx; this.y = ty; this.z = tz; this.w = tw;
    this.normalise();
  }
  rotAxisX(a) { this.rotAxis(a, 0); }
  rotAxisY(a) { this.rotAxis(a, 1); }
  rotRoll(a) { this.rotAxis(a, 2); }
  setVec(v) {
    const { x, y, z, w } = this;
    const xx = x * x, xy = x * y, xz = x * z, xw = x * w;
    const yy = y * y, yz = y * z, yw = y * w, zz = z * z, zw = z * w;
    v[3] = v[7] = v[11] = v[12] = v[13] = v[14] = 0; v[15] = 1;
    v[0] = 1 - 2 * (yy + zz); v[4] = 2 * (xy - zw); v[8] = 2 * (xz + yw);
    v[1] = 2 * (xy + zw);     v[5] = 1 - 2 * (xx + zz); v[9] = 2 * (yz - xw);
    v[2] = 2 * (xz - yw);     v[6] = 2 * (yz + xw); v[10] = 1 - 2 * (xx + yy);
  }
  getSideVx() { return 1 - 2 * (this.y * this.y + this.z * this.z); }
  getSideVy() { return 2 * (this.x * this.y + this.z * this.w); }
  getSideVz() { return 2 * (this.x * this.z - this.y * this.w); }
  getFrontVx() { return 2 * (this.x * this.z + this.y * this.w); }
  getFrontVy() { return 2 * (this.y * this.z - this.x * this.w); }
  getFrontVz() { return 1 - 2 * (this.x * this.x + this.y * this.y); }
}

// Original 5 articulated humanoid walk keyframes from isoBo.as
const vec0 = [ 14,43, 0,83,0, 0,0,0,1, 8,18, 0,130,-7, 0,0,0,1, 8,15, -24,111,-1, 0,0,0,1, 15,13, 0,83,0, -1,0,0,0, 8,32, -11,68,0, -1,0,0,0, 8,32, -11,33,0, -1,0,0,0, 8,32, -30,110,0, -1,0,0,0, 8,32, 12,33,0, -1,0,0,0, 8,32, 12,68,0, -1,0,0,0, 8,32, 30,110,0, -1,0,0,0, 8,15, 24,111,-1, 0,0,0,1 ];
const vec1 = [ 14,43, 0,82,-1, 0,0,0,1, 8,18, 0,129,-7, 0,0,0,1, 8,15, -24,109,-6, 0,0,0,1, 15,13, 0,81,0, -1,0,0,0, 8,32, -11,67,0, -0.990268,0,0,-0.139173, 8,32, -11,33,9, -0.993476,-0.00414196,-0.0086934,-0.113637, 8,32, -30,109,-6, -0.996195,0,0,0.087156, 8,32, 12,33,-7, -0.994522,0,0,0.104529, 8,32, 12,67,0, -0.992546,0,0,0.12187, 8,32, 30,109,4, -0.994522,0,0,-0.104528, 8,15, 24,109,3, -0.104528,0,0,0.994522 ];
const vec2 = [ 14,43, 0,83,0, 0,0,0,1, 8,18, 0,130,-7, 0,0,0,1, 8,15, -24,111,-11, 0,0,0,1, 15,13, 0,83,0, -1,0,0,0, 8,32, -11,68,0, -0.939693,0,0,-0.34202, 8,32, -11,33,23, -0.959418,-0.00650916,-0.0231739,-0.280959, 8,32, -30,110,-14, -0.976296,0,0,0.21644, 8,32, 12,33,-19, -0.965926,0,0,0.258819, 8,32, 12,68,0, -0.953717,0,0,0.300706, 8,32, 30,110,13, -0.965926,0,0,-0.258819, 8,15, 24,110,12, -0.258819,0,0,0.965926 ];
const vec3 = [ 14,43, 0,82,0, 0,0,0,1, 8,18, 0,129,-7, 0,0,0,1, 8,15, -24,109,5, -0.156434,0,0,0.987688, 15,13, 0,81,0, -1,0,0,0, 8,32, -11,67,0, -0.983255,0,0,0.182236, 8,32, -11,33,-11, -0.994522,0,0,0.104529, 8,32, -30,109,9, -0.991445,0,0,-0.130526, 8,32, 12,33,11, -0.978148,0,0,-0.207912, 8,32, 12,67,0, -0.987688,0,0,-0.156435, 8,32, 30,109,-6, -0.987688,0,0,0.156435, 8,15, 24,109,-2, 0.0784591,0,0,0.996917 ];
const vec4 = [ 14,43, 0,81,-1, 0,0,0,1, 8,18, 0,128,-7, 0,0,0,1, 8,15, -24,108,10, -0.258819,0,0,0.965926, 15,13, 0,80,0, -1,0,0,0, 8,32, -11,66,0, -0.953717,0,0,0.300706, 8,32, -11,33,-18, -0.984808,0,0,0.173648, 8,32, -30,108,15, -0.976296,0,0,-0.21644, 8,32, 12,33,19, -0.939693,0,0,-0.34202, 8,32, 12,66,0, -0.965926,0,0,-0.258819, 8,32, 30,108,-10, -0.965926,0,0,0.258819, 8,15, 24,108,-2, 0.130526,0,0,0.991445 ];
const vecFrame = [vec0, vec1, vec2, vec1, vec0, vec3, vec4, vec3];

const ARENA = 340, ISO_S = 0.68, OX = 256, OY = 165;
const tempq = new XQuat(), tq0 = new XQuat(), tq1 = new XQuat(), tempmat = new Float32Array(16);

let keys = {}, down = false, ptrWx = 170, ptrWz = 170;
let cx = 170, cy = 0, cz = 170, cyaw = 0, curFrame = 0;
let crystals = [], sentinels = [];
let goal = 7, collected = 0, hp = 3, invuln = 0, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function screenToIso(sx, sy) {
  // Inverse of sx = (ax - az)*S + OX, sy = (ax + az)*0.5*S + OY
  const u = (sx - OX) / ISO_S;
  const v = (sy - OY) / (ISO_S * 0.5);
  return { x: (u + v) * 0.5, z: (v - u) * 0.5 };
}
function updPtr(e) {
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (512 / r.width);
  const sy = (e.clientY - r.top) * (512 / r.height);
  const p = screenToIso(sx, sy);
  ptrWx = Math.max(16, Math.min(ARENA - 16, p.x));
  ptrWz = Math.max(16, Math.min(ARENA - 16, p.z));
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updPtr(e); });
window.addEventListener("pointerup", () => { down = false; });

function drawLine3D(ax, ay, az, bx, by, bz) {
  const sx1 = (ax - az) * ISO_S + OX;
  const sy1 = (ax * 0.5 + az * 0.5 - ay) * ISO_S + OY;
  const sx2 = (bx - bz) * ISO_S + OX;
  const sy2 = (bx * 0.5 + bz * 0.5 - by) * ISO_S + OY;
  ctx.moveTo(sx1, sy1);
  ctx.lineTo(sx2, sy2);
}

function drawBox3D(ax, ay, az, bx, by, bz) {
  drawLine3D(ax, ay, az, bx, ay, az); drawLine3D(ax, by, az, bx, by, az);
  drawLine3D(ax, ay, bz, bx, ay, bz); drawLine3D(ax, by, bz, bx, by, bz);
  drawLine3D(ax, ay, az, ax, by, az); drawLine3D(bx, ay, az, bx, by, az);
  drawLine3D(ax, ay, bz, ax, by, bz); drawLine3D(bx, ay, bz, bx, by, bz);
  drawLine3D(ax, ay, az, ax, ay, bz); drawLine3D(bx, ay, az, bx, ay, bz);
  drawLine3D(ax, by, az, ax, by, bz); drawLine3D(bx, by, az, bx, by, bz);
}

function drawSlab(o, ax, ay, az, r, h) {
  tempq.copyQuat(o);
  const kx = ax + tempq.getFrontVx(), ky = ay + tempq.getFrontVy(), kz = az + tempq.getFrontVz();
  const kx2 = ax + tempq.getFrontVx() * h, ky2 = ay + tempq.getFrontVy() * h, kz2 = az + tempq.getFrontVz() * h;
  for (let i = 0; i < 4; i++) {
    const tx = kx + tempq.getSideVx() * r, ty = ky + tempq.getSideVy() * r, tz = kz + tempq.getSideVz() * r;
    const bx = kx2 + tempq.getSideVx() * r, by = ky2 + tempq.getSideVy() * r, bz = kz2 + tempq.getSideVz() * r;
    drawLine3D(tx, ty, tz, bx, by, bz);
    tempq.rotRoll(1.57);
    const tx2 = kx + tempq.getSideVx() * r, ty2 = ky + tempq.getSideVy() * r, tz2 = kz + tempq.getSideVz() * r;
    const bx2 = kx2 + tempq.getSideVx() * r, by2 = ky2 + tempq.getSideVy() * r, bz2 = kz2 + tempq.getSideVz() * r;
    drawLine3D(tx, ty, tz, tx2, ty2, tz2);
    drawLine3D(bx, by, bz, bx2, by2, bz2);
  }
}

function drawVec(vec, yaw, ax, ay, az, sc) {
  tq0.reset(); tq0.rotAxisY(yaw);
  tq0.setVec(tempmat);
  tempmat[12] = ax; tempmat[13] = ay; tempmat[14] = az;
  for (let i = 0; i < vec.length; i += 9) {
    tq1.setValue(vec[i + 5], vec[i + 6], vec[i + 7], vec[i + 8]);
    tq1.rotAxisX(-1.57);
    tq0.reset(); tq0.rotAxisY(yaw); tq0.mul(tq1);
    const lx = vec[i + 2] * sc, ly = vec[i + 3] * sc, lz = vec[i + 4] * sc;
    const rx = lx * tempmat[0] + ly * tempmat[4] + lz * tempmat[8] + tempmat[12];
    const ry = lx * tempmat[1] + ly * tempmat[5] + lz * tempmat[9] + tempmat[13];
    const rz = lx * tempmat[2] + ly * tempmat[6] + lz * tempmat[10] + tempmat[14];
    drawSlab(tq0, rx, ry, rz, vec[i] * sc, vec[i + 1] * sc);
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  goal = Math.max(4, Math.min(12, Number(custom.crystalCount) || 7));
  collected = 0; hp = 3; invuln = 0; score = 0; won = false; over = false;
  cx = 170; cy = 0; cz = 170; cyaw = 0; curFrame = 0;

  crystals = [];
  for (let i = 0; i < goal; i++) {
    let x, z, ok = false, tries = 0;
    while (!ok && tries < 80) {
      tries++;
      x = 34 + Math.random() * (ARENA - 68);
      z = 34 + Math.random() * (ARENA - 68);
      ok = Math.hypot(x - 170, z - 170) > 60 && crystals.every(c => Math.hypot(c.x - x, c.z - z) > 48);
    }
    crystals.push({ x, z, done: false });
  }

  sentinels = [
    { x: 60, z: 90, vx: 85, vz: 0 },
    { x: 260, z: 250, vx: -85, vz: 0 },
    { x: 250, z: 60, vx: 0, vz: 90 }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    const ta = 3.4 * dt, ms = -115 * dt;
    let moving = false;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) cyaw -= ta;
    if (keys.ArrowRight || keys.KeyD) cyaw += ta;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) {
      cx += Math.cos(cyaw) * ms; cz += Math.sin(cyaw) * ms; moving = true;
    }
    if (keys.ArrowDown || keys.KeyS) {
      cx -= Math.cos(cyaw) * ms; cz -= Math.sin(cyaw) * ms; moving = true;
    }

    if (down) {
      const dx = ptrWx - cx, dz = ptrWz - cz, d = Math.hypot(dx, dz);
      if (d > 10) {
        // Because forward is -cos(cyaw), -sin(cyaw) in isoBo.as
        const desiredYaw = Math.atan2(-dz, -dx);
        let diff = desiredYaw - cyaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        cyaw += Math.max(-ta * 2, Math.min(ta * 2, diff));
        cx += Math.cos(cyaw) * ms; cz += Math.sin(cyaw) * ms;
        moving = true;
      }
    }

    cx = Math.max(20, Math.min(ARENA - 20, cx));
    cz = Math.max(20, Math.min(ARENA - 20, cz));
    if (moving) {
      curFrame = (curFrame + 10 * dt) % vecFrame.length;
    }

    // Collect crystals
    for (const c of crystals) {
      if (!c.done && Math.hypot(cx - c.x, cz - c.z) < 28) {
        c.done = true; collected++; score += 60;
        if (collected >= goal) {
          won = true; over = true;
          score += Math.round(timeLeft * 5) + hp * 30;
        }
      }
    }

    // Update sentinels
    for (const s of sentinels) {
      s.x += s.vx * dt; s.z += s.vz * dt;
      if (s.x < 24 || s.x > ARENA - 24) s.vx = -s.vx;
      if (s.z < 24 || s.z > ARENA - 24) s.vz = -s.vz;
      if (invuln <= 0 && Math.hypot(cx - s.x, cz - s.z) < 26) {
        hp--; invuln = 1.25;
        if (hp <= 0) { won = false; over = true; }
      }
    }
  }

  document.getElementById("stat").textContent = `Pylônes: ${collected}/${goal} • Blindage: ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Isometric floor grid
  ctx.strokeStyle = "rgba(56, 214, 255, 0.16)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let g = 0; g <= ARENA; g += 34) {
    drawLine3D(g, 0, 0, g, 0, ARENA);
    drawLine3D(0, 0, g, ARENA, 0, g);
  }
  ctx.stroke();

  // Floor border
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  drawBox3D(0, 0, 0, ARENA, 2, ARENA);
  ctx.stroke();

  // Crystals (3D wireframe pylons)
  const bob = Math.sin(now * 0.006) * 6;
  ctx.strokeStyle = "#fde047";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (const c of crystals) {
    if (c.done) continue;
    drawBox3D(c.x - 10, 6 + bob, c.z - 10, c.x + 10, 44 + bob, c.z + 10);
  }
  ctx.stroke();

  // Sentinels (3D wireframe red cubes)
  ctx.strokeStyle = "#f87171";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const s of sentinels) {
    drawBox3D(s.x - 14, 2, s.z - 14, s.x + 14, 34, s.z + 14);
  }
  ctx.stroke();

  // Player shadow box & articulated 3D wireframe humanoid from isoBo.as
  const blink = invuln > 0 && Math.floor(now / 80) % 2 === 0;
  if (!blink) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    drawBox3D(cx - 14, 0, cz - 14, cx + 14, 1, cz + 14);
    ctx.stroke();

    ctx.strokeStyle = "#aef0ff";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    drawVec(vecFrame[Math.floor(curFrame)], -cyaw + 1.57, cx, cy - 8, cz, 0.72);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "PYLÔNES ACTIVÉS !" : (hp <= 0 ? "AUTOMATE HORS SERVICE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>

  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
