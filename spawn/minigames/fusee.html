<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Fusée Propulsée (Fusée)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "fusee",
  "name": "Fusée Propulsée (Fusée)",
  "family": "income",
  "icon": "🚀",
  "controls": "Souris pour orienter + Maintenir Clic pour booster (ou Flèches/ZQSD + Espace)",
  "description": "Pilotage inertiel d'une fusée à ailerons rotatifs et anneaux de fumée : dérapez dans les virages serrés et accélérez pour rafler les étoiles d'énergie.",
  "goal": "Collecter 10 étoiles d'énergie sans détruire votre coque (3 PV).",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 },
    { "key": "targetStars", "label": "Étoiles à collecter", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>🚀 <b>Fusée Propulsée</b></span>
  <span id="stat">Étoiles: 0/10 • ❤️3 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "fusee";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let rocket = {}, smokes = [], stars = [], mines = [], bgStars = [];
let keys = {}, mx = 256, my = 140, mouseDown = false, useKeyboard = false;
let timeLeft = 40, targetStars = 10, collected = 0, hp = 3, invuln = 0;
let score = 0, won = false, over = false, tickCount = 0, simAcc = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function normAngle256(dir) {
  let d = dir % 256;
  if (d > 128) d -= 256;
  if (d < -128) d += 256;
  return d;
}
function getBearing256(d1, d2) {
  let a = normAngle256(d1), b = normAngle256(d2);
  if (b - 128 > a) a += 256;
  if (b + 128 < a) a -= 256;
  return a - b;
}
function vecX256(dir, spd) { return Math.cos(Math.PI / 128 * (dir + 192)) * spd; }
function vecY256(dir, spd) { return Math.sin(Math.PI / 128 * (dir + 192)) * spd; }

function spawnStar() {
  for (let tries = 0; tries < 30; tries++) {
    const x = 44 + Math.random() * 424;
    const y = 44 + Math.random() * 424;
    if (Math.hypot(x - rocket.x, y - rocket.y) > 95) return { x, y, phase: Math.random() * 6.28 };
  }
  return { x: 256, y: 256, phase: 0 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  targetStars = Number(custom.targetStars) || 10;
  rocket = { x: 256, y: 256, vx: 0, vy: 0, sx: 1, sy: 1, angle: 0, prevAngle: 0, frame: 0 };
  smokes = []; stars = []; mines = [];
  collected = 0; hp = 3; invuln = 0; score = 0; won = false; over = false; tickCount = 0; simAcc = 0;
  mx = 256; my = 120;

  bgStars = Array.from({ length: 48 }, () => ({ x: Math.random() * 512, y: Math.random() * 512, r: 0.7 + Math.random() * 1.4 }));
  for (let i = 0; i < 3; i++) stars.push(spawnStar());
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2;
    const dist = 155 + Math.random() * 65;
    mines.push({
      x: 256 + Math.cos(ang) * dist,
      y: 256 + Math.sin(ang) * dist,
      vx: (Math.random() - 0.5) * 1.6,
      vy: (Math.random() - 0.5) * 1.6,
      r: 13
    });
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyW", "KeyA", "KeyS", "KeyD", "KeyZ", "KeyQ"].includes(e.code)) {
    useKeyboard = true;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (over) { sendResultAndExit(won, score); return; }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  useKeyboard = false;
  const pt = getPos(e); mx = pt.x; my = pt.y;
  mouseDown = true;
});
cv.addEventListener("pointermove", (e) => {
  useKeyboard = false;
  const pt = getPos(e); mx = pt.x; my = pt.y;
});
window.addEventListener("pointerup", () => { mouseDown = false; });

function stepFixed() {
  const boosting = mouseDown || !!keys.Space;

  if (useKeyboard) {
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    if (kx !== 0 || ky !== 0) {
      mx = rocket.x + kx * 120;
      my = rocket.y + ky * 120;
    }
  }

  // Faithful Ebifly / x6tr.as momentum, bearing-drag, squash-stretch, and smoke ring logic
  const dist = Math.hypot(mx - rocket.x, my - rocket.y);
  if (tickCount % 3 === 0) {
    rocket.frame = (rocket.frame + 1) % 8;
    rocket.prevAngle = rocket.angle;
    let bearing = 0;
    if (dist > 18) {
      rocket.angle = (Math.atan2(my - rocket.y, mx - rocket.x) * 128 / Math.PI) + 64;
      bearing = getBearing256(rocket.prevAngle, rocket.angle);
    }
    const speed = boosting ? 2.45 : 1.25;
    rocket.vx += vecX256(rocket.angle, speed);
    rocket.vy += vecY256(rocket.angle, speed);

    const brake = boosting ? (1.05 + Math.abs(bearing) / 80) : (1.12 + Math.abs(bearing) / 260);
    rocket.vx /= brake;
    rocket.vy /= brake;

    if (tickCount % 6 === 0 && boosting) {
      smokes.push({
        x: rocket.x - 4 + Math.random() * 8,
        y: rocket.y - 4 + Math.random() * 8,
        angle: rocket.angle - 8 + Math.random() * 16,
        speed: (-10 - 2 + Math.random() * 4) / 3,
        ax: (rocket.vx / 2) / 3,
        ay: (rocket.vy / 2) / 3,
        frame: 0,
        cnt: 0
      });
    }

    const vMag = Math.hypot(rocket.vx, rocket.vy);
    rocket.sx = (rocket.sx * 3 + (1.1 - vMag * 0.015) + 1) / 5;
    rocket.sy = (rocket.sy * 3 + (0.8 + vMag * 0.032) + 1) / 5;
  } else if (dist > 18) {
    rocket.angle = (Math.atan2(my - rocket.y, mx - rocket.x) * 128 / Math.PI) + 64;
  }

  rocket.x += rocket.vx / 2.6;
  rocket.y += rocket.vy / 2.6;
  if (rocket.x < 16) { rocket.x = 16; rocket.vx *= -0.6; }
  if (rocket.x > 496) { rocket.x = 496; rocket.vx *= -0.6; }
  if (rocket.y < 16) { rocket.y = 16; rocket.vy *= -0.6; }
  if (rocket.y > 496) { rocket.y = 496; rocket.vy *= -0.6; }

  // Update smoke rings
  for (let i = smokes.length - 1; i >= 0; i--) {
    const s = smokes[i];
    s.x += vecX256(s.angle, s.speed) + s.ax;
    s.y += vecY256(s.angle, s.speed) + s.ay;
    s.cnt++;
    if (s.cnt % 3 === 0) {
      s.frame++;
      if (s.frame >= 7) smokes.splice(i, 1);
    }
  }

  // Update drifting mines
  for (const m of mines) {
    m.x += m.vx; m.y += m.vy;
    if (m.x < 18 || m.x > 494) m.vx *= -1;
    if (m.y < 18 || m.y > 494) m.vy *= -1;
    if (invuln <= 0 && Math.hypot(m.x - rocket.x, m.y - rocket.y) < m.r + 11) {
      hp--;
      invuln = 65;
      const push = Math.atan2(rocket.y - m.y, rocket.x - m.x);
      rocket.vx = Math.cos(push) * 12;
      rocket.vy = Math.sin(push) * 12;
      if (hp <= 0) { won = false; over = true; }
    }
  }
  if (invuln > 0) invuln--;

  // Collect stars
  for (let i = stars.length - 1; i >= 0; i--) {
    const st = stars[i];
    st.phase += 0.08;
    if (Math.hypot(st.x - rocket.x, st.y - rocket.y) < 22) {
      collected++;
      stars.splice(i, 1);
      if (collected + stars.length < targetStars) stars.push(spawnStar());
      if (collected >= targetStars) {
        won = true; over = true;
        score = collected * 25 + hp * 30 + Math.round(timeLeft * 5);
      }
    }
  }
  tickCount++;
}

function drawPoly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}

function drawRocket() {
  const f = rocket.frame;
  ctx.save();
  ctx.translate(rocket.x, rocket.y);
  ctx.rotate((rocket.angle * 360 / 256) * Math.PI / 180);
  ctx.scale((f < 5 ? rocket.sx : -rocket.sx) * 1.18, rocket.sy * 1.18);
  if (invuln > 0 && Math.floor(invuln / 5) % 2 === 0) ctx.globalAlpha = 0.4;

  // Back fins (from x6tr.as)
  if (f === 0) {
    drawPoly([-6.3, -2, -13.2, 11.8, -4, 3.8], "#f83038");
    drawPoly([6.3, -2, 13.2, 11.8, 4, 3.8], "#f83038");
  } else if (f === 1 || f === 7) {
    drawPoly([-8.5, -2, -15, 11, -5.7, 3.5], "#f83038");
    drawPoly([4.8, -2, 10.7, 12, 2.6, 4], "#e02030");
  } else if (f === 3 || f === 5) {
    drawPoly([1.8, -2, 4.7, 13.2, 0, 4.5], "#e02030");
  } else if (f === 4) {
    drawPoly([0, 2, -1.1, 4.4, 0, 13.2, 1.1, 4.4], "#e02030");
  }

  // Main body
  drawPoly([0, -12, 5, -8.4, 6, 1.9, 4.2, 5.2, 1.4, 6.5, -1.4, 6.5, -4.2, 5.2, -6, 1.9, -5, -8.4], "#f8ff80");

  // Front fins (from x6tr.as)
  if (f === 0) {
    drawPoly([0, 1.5, -1.5, 4.4, 0, 13.2, 1.5, 4.4], "#ff4840");
  } else if (f === 1 || f === 7) {
    drawPoly([1.8, -1.4, -0.3, 4.5, 4.7, 13.2], "#ff4840");
  } else if (f === 2 || f === 6) {
    drawPoly([-9.3, -2.1, -16.2, 10.6, -6.5, 3.1], "#ff4840");
    drawPoly([3.1, -1.4, 8.4, 12.9, 1.1, 4.5], "#ff4840");
  } else if (f === 3 || f === 5) {
    drawPoly([-8.5, -2, -15.7, 10.9, -5.7, 3.5], "#ff4840");
    drawPoly([4.8, -1.7, 10.7, 12, 2.6, 4], "#ff4840");
  } else if (f === 4) {
    drawPoly([-6.3, -2, -13.8, 11.8, -4, 3.8], "#ff4840");
    drawPoly([6.3, -2, 13.8, 11.8, 4, 3.8], "#ff4840");
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { won = false; over = true; }
    simAcc += dt;
    while (simAcc >= 1 / 60 && !over) {
      simAcc -= 1 / 60;
      stepFixed();
    }
    if (!won) score = collected * 25 + hp * 10;
  }

  document.getElementById("stat").textContent = `Étoiles: ${collected}/${targetStars} • ❤️${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Starfield
  ctx.fillStyle = "rgba(174, 240, 255, 0.25)";
  for (const bs of bgStars) ctx.fillRect(bs.x, bs.y, bs.r, bs.r);

  // Smoke rings (faithful to Smoke class in x6tr.as)
  for (const s of smokes) {
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.frame === 0) { ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill(); }
    else if (s.frame === 1) { ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill(); }
    else {
      const radii = [0, 0, 4, 6, 7.8, 9, 10];
      const widths = [0, 0, 4.2, 2.5, 1.5, 0.8, 0.4];
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0.15, 0.85 - s.frame * 0.12)})`;
      ctx.lineWidth = widths[s.frame] || 0.5;
      ctx.beginPath(); ctx.arc(0, 0, radii[s.frame] || 9, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // Target stars
  for (const st of stars) {
    const pulse = 9 + Math.sin(st.phase) * 2.5;
    ctx.fillStyle = "rgba(56, 214, 255, 0.2)";
    ctx.beginPath(); ctx.arc(st.x, st.y, pulse + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(st.x, st.y, pulse * 0.65, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(st.x, st.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Mines
  for (const m of mines) {
    ctx.fillStyle = "rgba(248, 113, 113, 0.18)";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fca5a5"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.x - m.r - 3, m.y); ctx.lineTo(m.x + m.r + 3, m.y);
    ctx.moveTo(m.x, m.y - m.r - 3); ctx.lineTo(m.x, m.y + m.r + 3); ctx.stroke();
    ctx.lineWidth = 1;
  }

  // Rocket
  drawRocket();

  // Steering guide line
  if (!over && !useKeyboard) {
    ctx.strokeStyle = "rgba(56, 214, 255, 0.22)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(rocket.x, rocket.y); ctx.lineTo(mx, my); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.86)"; ctx.fillRect(0, 175, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "COLLECTE RÉUSSIE !" : (hp <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 274);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
