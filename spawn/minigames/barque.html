<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Barges Dérivantes (Barque)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "barque",
  "name": "Barges Dérivantes (Barque)",
  "family": "clavDir",
  "icon": "🛶",
  "controls": "Flèches / ZQSD (rotation + avance/recul) ou maintenir clic/doigt pour diriger",
  "description": "Embarquez sur des plateformes carrées rebondissantes qui vous entraînent sur le bassin ionisé : sautez d'une barge à l'autre pour récupérer les balises avant d'épuiser votre bouclier.",
  "goal": "Collecter les 8 balises flottantes avant la fin du chrono sans vider votre énergie hors des barges.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "beaconCount", "label": "Balises", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>🛶 <b>Barges Barque</b></span>
  <span id="stat">Balises: 0/8 • Énergie: 100% • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "barque";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let px = 256, py = 256, pa = 0, energy = 100, onBarge = true;
let barges = [], beacons = [], particles = [];
let beaconGoal = 8, collected = 0, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function updPtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updPtr(e); });
window.addEventListener("pointerup", () => { down = false; });

function isInsideRect(kx, ky, rx, ry, rad) {
  return kx >= rx - rad && kx <= rx + rad && ky >= ry - rad && ky <= ry + rad;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  beaconGoal = Math.max(4, Math.min(14, Number(custom.beaconCount) || 8));
  collected = 0; score = 0; won = false; over = false;
  energy = 100; onBarge = true; particles = [];

  // 3 drifting square barges (faithful to aMove in barque.as)
  barges = [
    { cx: 256, cy: 256, ox: 256, oy: 256, vx: 82, vy: 118, rad: 42, col: "#38d6ff" },
    { cx: 130, cy: 140, ox: 130, oy: 140, vx: -105, vy: 76, rad: 38, col: "#2dd4bf" },
    { cx: 380, cy: 360, ox: 380, oy: 360, vx: 94, vy: -96, rad: 38, col: "#60a5fa" }
  ];
  px = barges[0].cx; py = barges[0].cy; pa = -Math.PI / 2;

  beacons = [];
  for (let i = 0; i < beaconGoal; i++) {
    const angle = (i / beaconGoal) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 110 + Math.random() * 105;
    beacons.push({
      x: Math.max(54, Math.min(458, 256 + Math.cos(angle) * dist)),
      y: Math.max(54, Math.min(458, 256 + Math.sin(angle) * dist)),
      done: false
    });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Tank/rotational controls from barque.as
    const turnSpeed = 3.4;
    const moveSpeed = 195;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) pa -= turnSpeed * dt;
    if (keys.ArrowRight || keys.KeyD) pa += turnSpeed * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) {
      px += Math.cos(pa) * moveSpeed * dt;
      py += Math.sin(pa) * moveSpeed * dt;
    }
    if (keys.ArrowDown || keys.KeyS) {
      px -= Math.cos(pa) * moveSpeed * dt;
      py -= Math.sin(pa) * moveSpeed * dt;
    }

    // Pointer steering support
    if (down) {
      const dx = mx - px, dy = my - py, d = Math.hypot(dx, dy);
      if (d > 8) {
        const targetA = Math.atan2(dy, dx);
        let diff = targetA - pa;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        pa += Math.max(-turnSpeed * 1.8 * dt, Math.min(turnSpeed * 1.8 * dt, diff));
        px += Math.cos(pa) * Math.min(moveSpeed, d * 4) * dt;
        py += Math.sin(pa) * Math.min(moveSpeed, d * 4) * dt;
      }
    }

    // Update barges & carry player (exact isInside / isInsideOld logic from barque.as)
    let riding = false;
    for (const b of barges) {
      b.ox = b.cx; b.oy = b.cy;
      b.cx += b.vx * dt; b.cy += b.vy * dt;
      if (b.cx >= 512 - b.rad - 12 && b.vx > 0) b.vx = -b.vx;
      if (b.cx <= b.rad + 12 && b.vx < 0) b.vx = -b.vx;
      if (b.cy >= 512 - b.rad - 12 && b.vy > 0) b.vy = -b.vy;
      if (b.cy <= b.rad + 12 && b.vy < 0) b.vy = -b.vy;

      const insideNow = isInsideRect(px, py, b.cx, b.cy, b.rad);
      const insideOld = isInsideRect(px, py, b.ox, b.oy, b.rad);
      if (!insideNow && insideOld) {
        px += b.cx - b.ox;
        py += b.cy - b.oy;
        riding = true;
      } else if (insideNow) {
        px += b.vx * dt;
        py += b.vy * dt;
        riding = true;
      }
    }
    onBarge = riding;

    px = Math.max(16, Math.min(496, px));
    py = Math.max(16, Math.min(496, py));

    if (onBarge) {
      energy = Math.min(100, energy + 48 * dt);
    } else {
      energy = Math.max(0, energy - 34 * dt);
      if (Math.random() < 0.4) {
        particles.push({ x: px, y: py, vx: (Math.random() - 0.5) * 50, vy: (Math.random() - 0.5) * 50, life: 0.35, col: "#f87171" });
      }
      if (energy <= 0) { over = true; won = false; }
    }

    // Collect beacons
    for (const bc of beacons) {
      if (!bc.done && Math.hypot(px - bc.x, py - bc.y) < 26) {
        bc.done = true;
        collected++;
        score += 55;
        energy = Math.min(100, energy + 20);
        for (let i = 0; i < 12; i++) {
          const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
          particles.push({ x: bc.x, y: bc.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, col: "#fde047" });
        }
        if (collected >= beaconGoal) {
          won = true; over = true;
          score += Math.round(timeLeft * 5 + energy * 0.5);
        }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Balises: ${collected}/${beaconGoal} • Énergie: ${Math.round(energy)}% • ${Math.ceil(timeLeft)}s`;

  // Render ionized water grid
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = "rgba(56, 214, 255, 0.08)";
  ctx.lineWidth = 1;
  const shift = (now * 0.02) % 32;
  for (let i = -32; i <= 544; i += 32) {
    ctx.beginPath(); ctx.moveTo(i + shift, 0); ctx.lineTo(i + shift, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Barges
  for (const b of barges) {
    ctx.fillStyle = "rgba(28, 53, 82, 0.85)";
    ctx.fillRect(b.cx - b.rad, b.cy - b.rad, b.rad * 2, b.rad * 2);
    ctx.strokeStyle = b.col;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(b.cx - b.rad, b.cy - b.rad, b.rad * 2, b.rad * 2);
    ctx.strokeStyle = "rgba(174, 240, 255, 0.25)";
    ctx.lineWidth = 1;
    ctx.strokeRect(b.cx - b.rad + 8, b.cy - b.rad + 8, b.rad * 2 - 16, b.rad * 2 - 16);
  }

  // Beacons
  const pulse = 0.7 + 0.3 * Math.sin(now * 0.008);
  for (const bc of beacons) {
    if (bc.done) continue;
    ctx.strokeStyle = `rgba(253, 224, 71, ${0.35 * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bc.x, bc.y, 14 + pulse * 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(bc.x, bc.y, 8, 0, Math.PI * 2); ctx.fill();
  }

  // Particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 0.45);
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player (faithful circle + heading line from barque.as)
  ctx.fillStyle = onBarge ? "#38d6ff" : "#f87171";
  ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(pa) * 16, py + Math.sin(pa) * 16); ctx.stroke();

  // Energy bar at bottom
  ctx.fillStyle = "#121a2b";
  ctx.fillRect(16, 492, 480, 10);
  ctx.fillStyle = energy > 35 ? "#4ade80" : "#f87171";
  ctx.fillRect(16, 492, 480 * (energy / 100), 10);
  ctx.strokeStyle = "#2d5b7b"; ctx.lineWidth = 1;
  ctx.strokeRect(16, 492, 480, 10);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "BALISES RÉCUPÉRÉES !" : (energy <= 0 ? "BOUCLIER ÉPUISÉ" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
