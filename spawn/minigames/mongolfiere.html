<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Enveloppe Montgolfière (Mongolfière)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "mongolfiere",
  "name": "Enveloppe Montgolfière (Mongolfière)",
  "family": "income",
  "icon": "🎈",
  "controls": "Souris / Flèches/ZQSD pour piloter le noyau • Maintenir Clic / Espace pour activer le brûleur (gonfle l'enveloppe)",
  "description": "Montgolfière à enveloppe molle reliée par ressorts au noyau central : balancez votre membrane souple pour capturer les courants dorés et esquiver les éclairs.",
  "goal": "Capturer 10 cellules thermiques dorées avec votre enveloppe avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 42 },
    { "key": "targetCells", "label": "Cellules à capturer", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>🎈 <b>Montgolfière</b></span>
  <span id="stat">Cellules: 0/10 • ❤️3 • 42s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "mongolfiere";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let core = { x: 256, y: 256 }, targetPos = { x: 256, y: 256 }, parts = [];
let cells = [], storms = [], keys = {}, burner = false;
let timeLeft = 42, targetCells = 10, collected = 0, hp = 3, invuln = 0;
let score = 0, won = false, over = false, simAcc = 0, windPhase = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function spawnCell() {
  return {
    x: 40 + Math.random() * 432,
    y: 460 + Math.random() * 40,
    vy: -(0.6 + Math.random() * 0.7),
    vx: (Math.random() - 0.5) * 0.6,
    phase: Math.random() * 6.28
  };
}

function spawnStorm(i) {
  return {
    x: (i % 2 === 0 ? -20 : 532),
    y: 55 + Math.random() * 380,
    vx: (i % 2 === 0 ? 1 : -1) * (1.2 + Math.random() * 1.1),
    vy: (Math.random() - 0.5) * 0.4,
    r: 13
  };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 42;
  targetCells = Number(custom.targetCells) || 10;
  core = { x: 256, y: 240 };
  targetPos = { x: 256, y: 240 };
  collected = 0; hp = 3; invuln = 0; score = 0; won = false; over = false; simAcc = 0;

  // Soft-body spring ring (faithful to jAIP.as xPart ring)
  parts = [];
  const N = 8;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    parts.push({
      cx: core.x + Math.cos(a) * 52,
      cy: core.y + Math.sin(a) * 52,
      vx: 0,
      vy: 0
    });
  }

  cells = [];
  for (let i = 0; i < 4; i++) {
    const c = spawnCell();
    c.y = 80 + Math.random() * 340;
    cells.push(c);
  }
  storms = [];
  for (let i = 0; i < 4; i++) {
    const s = spawnStorm(i);
    s.x = 60 + Math.random() * 392;
    if (Math.hypot(s.x - core.x, s.y - core.y) < 110) s.y = 60;
    storms.push(s);
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (over) { sendResultAndExit(won, score); return; }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  targetPos = getPos(e);
  burner = true;
});
cv.addEventListener("pointermove", (e) => {
  if (!over) targetPos = getPos(e);
});
window.addEventListener("pointerup", () => { burner = false; });

function stepPhysics() {
  windPhase += 0.03;
  const firing = burner || !!keys.Space;

  // Keyboard movement shifts targetPos directly
  const ks = 4.6;
  if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) targetPos.x = Math.max(36, targetPos.x - ks);
  if (keys.ArrowRight || keys.KeyD) targetPos.x = Math.min(476, targetPos.x + ks);
  if (keys.ArrowUp || keys.KeyW || keys.KeyZ) targetPos.y = Math.max(36, targetPos.y - ks);
  if (keys.ArrowDown || keys.KeyS) targetPos.y = Math.min(476, targetPos.y + ks);

  // Smooth core tracking + gentle buoyancy
  core.x += (targetPos.x - core.x) * 0.14;
  core.y += (targetPos.y - core.y) * 0.14 + (firing ? -0.9 : 0.25);
  core.x = Math.max(34, Math.min(478, core.x));
  core.y = Math.max(34, Math.min(478, core.y));

  // Neighbor spring ring forces (faithful to jAIP.as)
  const num = parts.length;
  const ringT = 0.26;
  const restChord = firing ? 44 : 36;
  for (let i = 0; i < num; i++) {
    const a = parts[i];
    const b = parts[(i + 1) % num];
    const dx = b.cx - a.cx, dy = b.cy - a.cy;
    const d = Math.hypot(dx, dy) || 1;
    const ang = Math.atan2(dy, dx);
    const f = d > restChord ? ringT : -ringT * 0.5;
    a.vx += Math.cos(ang) * f;
    a.vy += Math.sin(ang) * f;
    b.vx -= Math.cos(ang) * f;
    b.vy -= Math.sin(ang) * f;
  }

  // Radial tether + gravity + damping + wall bounce (faithful to jAIP.as)
  const minR = firing ? 54 : 44;
  const maxR = firing ? 64 : 52;
  const tetherT = 0.55;
  for (let i = 0; i < num; i++) {
    const a = parts[i];
    a.vy += firing ? -0.14 : 0.12;
    a.vx += Math.sin(windPhase + i * 0.7) * 0.04;

    const ang = Math.atan2(core.y - a.cy, core.x - a.cx);
    const d = Math.hypot(core.x - a.cx, core.y - a.cy);
    if (d > maxR) {
      a.vx += Math.cos(ang) * tetherT;
      a.vy += Math.sin(ang) * tetherT;
    } else if (d < minR) {
      a.vx -= Math.cos(ang) * tetherT;
      a.vy -= Math.sin(ang) * tetherT;
    }

    a.vx *= 0.94;
    a.vy *= 0.94;
    if (a.cx + a.vx < 6 || a.cx + a.vx > 506) a.vx *= -0.5;
    if (a.cy + a.vy < 6 || a.cy + a.vy > 506) a.vy *= -0.5;
    a.cx = Math.max(6, Math.min(506, a.cx + a.vx));
    a.cy = Math.max(6, Math.min(506, a.cy + a.vy));
  }

  // Update rising golden thermal cells
  for (let i = cells.length - 1; i >= 0; i--) {
    const c = cells[i];
    c.phase += 0.07;
    c.x += c.vx + Math.sin(c.phase) * 0.45;
    c.y += c.vy;
    if (c.y < -16) { cells[i] = spawnCell(); continue; }
    if (c.x < 16 || c.x > 496) c.vx *= -1;

    // Check capture by core or any envelope node
    let hit = Math.hypot(c.x - core.x, c.y - core.y) < 34;
    if (!hit) {
      for (const p of parts) {
        if (Math.hypot(c.x - p.cx, c.y - p.cy) < 20) { hit = true; break; }
      }
    }
    if (hit) {
      collected++;
      cells[i] = spawnCell();
      score = collected * 30 + hp * 20;
      if (collected >= targetCells) {
        won = true; over = true;
        score += Math.round(timeLeft * 5);
      }
    }
  }

  // Update storm hazards
  if (invuln > 0) invuln--;
  for (let i = 0; i < storms.length; i++) {
    const s = storms[i];
    s.x += s.vx;
    s.y += s.vy + Math.sin(windPhase * 1.3 + i) * 0.35;
    if (s.x < -30 || s.x > 542) storms[i] = spawnStorm(i);
    if (s.y < 30 || s.y > 475) s.vy *= -1;

    if (invuln <= 0) {
      let struck = Math.hypot(s.x - core.x, s.y - core.y) < s.r + 22;
      if (!struck) {
        for (const p of parts) {
          if (Math.hypot(s.x - p.cx, s.y - p.cy) < s.r + 7) { struck = true; break; }
        }
      }
      if (struck) {
        hp--;
        invuln = 70;
        // Deflate impulse on nodes
        for (const p of parts) {
          const a = Math.atan2(p.cy - s.y, p.cx - s.x);
          p.vx += Math.cos(a) * 6;
          p.vy += Math.sin(a) * 6;
        }
        if (hp <= 0) { won = false; over = true; }
      }
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { won = false; over = true; }
    simAcc += dt;
    while (simAcc >= 1 / 60 && !over) {
      simAcc -= 1 / 60;
      stepPhysics();
    }
  }

  document.getElementById("stat").textContent = `Cellules: ${collected}/${targetCells} • ❤️${hp} • ${Math.ceil(timeLeft)}s`;

  // Sky gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, "#0a1020");
  grad.addColorStop(1, "#12213a");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Subtle wind streaks
  ctx.strokeStyle = "rgba(56, 214, 255, 0.08)";
  for (let i = 0; i < 6; i++) {
    const wy = 60 + i * 78;
    const wx = ((now * 0.05 + i * 110) % 580) - 60;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 55, wy); ctx.stroke();
  }

  // Golden thermal cells
  for (const c of cells) {
    ctx.fillStyle = "rgba(253, 224, 71, 0.2)";
    ctx.beginPath(); ctx.arc(c.x, c.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(c.x, c.y, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.lineWidth = 1;

  // Storm hazards
  for (const s of storms) {
    ctx.fillStyle = "rgba(192, 132, 252, 0.22)";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a855f7";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#f0abfc"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x - 4, s.y - 7); ctx.lineTo(s.x + 3, s.y); ctx.lineTo(s.x - 2, s.y); ctx.lineTo(s.x + 4, s.y + 7);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // Soft-body balloon envelope (faithful to jAIP.as translucent red polygon + spokes + nodes)
  ctx.save();
  if (invuln > 0 && Math.floor(invuln / 5) % 2 === 0) ctx.globalAlpha = 0.45;

  // Filled translucent red envelope
  ctx.fillStyle = "rgba(243, 53, 36, 0.46)";
  ctx.strokeStyle = "#fb7185";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(parts[0].cx, parts[0].cy);
  for (let i = 1; i < parts.length; i++) ctx.lineTo(parts[i].cx, parts[i].cy);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Spokes from nodes to core
  ctx.strokeStyle = "rgba(255, 220, 220, 0.45)";
  ctx.lineWidth = 1.2;
  for (const p of parts) {
    ctx.beginPath(); ctx.moveTo(p.cx, p.cy); ctx.lineTo(core.x, core.y); ctx.stroke();
    ctx.fillStyle = "#fda4af";
    ctx.beginPath(); ctx.arc(p.cx, p.cy, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Burner flame when active
  if ((burner || keys.Space) && !over) {
    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.arc(core.x, core.y + 12, 8 + Math.random() * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Core ring (faithful to drawCircle(cx, cy, 32) in jAIP.as, scaled cleanly)
  ctx.strokeStyle = "#38d6ff";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(core.x, core.y, 18, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#0d1422";
  ctx.beginPath(); ctx.arc(core.x, core.y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fde047";
  ctx.stroke();
  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.86)"; ctx.fillRect(0, 175, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ASCENSION RÉUSSIE !" : (hp <= 0 ? "ENVELOPPE DÉCHIRÉE" : "TEMPS ÉCOULÉ"), 256, 232);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 274);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
