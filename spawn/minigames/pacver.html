<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Propulseur Vers (PacVer)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pacver",
  "name": "Propulseur Vers (PacVer)",
  "family": "topOrthoClav",
  "icon": "🍎",
  "controls": "Flèches / ZQSD ou maintenir clic/doigt pour propulser la sonde (bords toriques)",
  "description": "Pilotage à propulseurs et particules sur arène torique : cueillez les pommes rouges avant qu'elles ne mûrissent et n'éclosent en vers traqueurs !",
  "goal": "Récolter 20 pommes avant la fin du chrono sans vous faire dévorer par les vers éclos.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "appleGoal", "label": "Pommes", "type": "number", "default": 20 }
  ]
}
</script>
<div class="bar">
  <span>🍎 <b>PacVer</b></span>
  <span id="stat">Pommes: 0/20 • Vers: 0 • ♥ 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pacver";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {};
let player = {};
let apples = [];
let worms = [];
let particles = [];
let sparks = [];
let ptr = null;
let spawnAccum = 0;
let timeLeft = 45;
let appleGoal = 20;
let eaten = 0;
let hp = 3;
let invuln = 0;
let score = 0;
let won = false;
let over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr = { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (ptr) setPtr(e); });
window.addEventListener("pointerup", () => { ptr = null; });

function sprayParticles(x, y, count, angle, thrust, jitter, color) {
  for (let i = 0; i < count; i++) {
    const a = angle - jitter + Math.random() * jitter * 2;
    const d = thrust * Math.random();
    particles.push({
      x, y,
      vx: Math.cos(a) * d,
      vy: Math.sin(a) * d,
      r: 2 + Math.random() * 6,
      alpha: 0.35 + Math.random() * 0.55,
      scale: 1,
      color: color || "#38d6ff"
    });
  }
}

function spraySparks(x, y, count) {
  for (let i = 0; i < count; i++) {
    const vx = -220 + Math.random() * 440;
    const vy = -220 + Math.random() * 440;
    sparks.push({
      x, y, vx, vy,
      rot: Math.atan2(vy, vx),
      len: 10 + Math.random() * 18,
      scale: 1,
      fric: 0.82 + Math.random() * 0.1
    });
  }
}

function addApple() {
  for (let tries = 0; tries < 15; tries++) {
    const x = 32 + Math.random() * 448;
    const y = 32 + Math.random() * 448;
    if (Math.hypot(x - player.x, y - player.y) > 55) {
      apples.push({ x, y, scale: 0.14 });
      return;
    }
  }
  apples.push({ x: 32 + Math.random() * 448, y: 32 + Math.random() * 448, scale: 0.14 });
}

function addWorm(x, y) {
  worms.push({
    x, y,
    vx: 0, vy: 0,
    rot: Math.random() * Math.PI * 2,
    t: Math.random() * 10
  });
}

function rotateTowards(angle, target, amount) {
  let dif = (target - angle) % (Math.PI * 2);
  if (dif > Math.PI) dif -= Math.PI * 2;
  else if (dif < -Math.PI) dif += Math.PI * 2;
  if (Math.abs(dif) < amount) return target;
  return angle + Math.sign(dif) * amount;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  appleGoal = Math.max(8, Math.round(Number(custom.appleGoal) || 20));
  player = { x: 256, y: 256, vx: 0, vy: 0, r: 10 };
  apples = [];
  worms = [];
  particles = [];
  sparks = [];
  spawnAccum = 0;
  eaten = 0;
  hp = 3;
  invuln = 0;
  score = 0;
  won = false;
  over = false;
  for (let i = 0; i < 3; i++) addApple();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Player thruster physics (faithful to pacVer.as)
    const thrust = 1100 * dt;
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (ax === 0 && ay === 0 && ptr) {
      const dx = ptr.x - player.x, dy = ptr.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 10) { ax = dx / d; ay = dy / d; }
    }
    player.vx += ax * thrust;
    player.vy += ay * thrust;
    const pFric = Math.pow(0.015, dt);
    player.vx *= pFric;
    player.vy *= pFric;
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Toroidal wrap-around
    if (player.x < -player.r) player.x = 512 + player.r;
    else if (player.x > 512 + player.r) player.x = -player.r;
    if (player.y < -player.r) player.y = 512 + player.r;
    else if (player.y > 512 + player.r) player.y = -player.r;

    const spd = Math.hypot(player.vx, player.vy);
    if (spd > 45) {
      sprayParticles(player.x, player.y, 2, Math.atan2(player.vy, player.vx) + Math.PI, spd * 0.45, 0.35, "#38d6ff");
    }

    // Spawn apples
    spawnAccum += dt;
    if (spawnAccum >= 0.85 && apples.length < 7) {
      spawnAccum = 0;
      addApple();
    }

    // Update apples (grow -> hatch into Worm!)
    for (let i = apples.length - 1; i >= 0; i--) {
      const a = apples[i];
      a.scale += 0.16 * dt;
      const r = 11 * a.scale;
      if (Math.hypot(player.x - a.x, player.y - a.y) <= player.r + Math.max(6, r)) {
        // Harvested!
        eaten++;
        const ripeBonus = a.scale > 0.7 ? 15 : 0;
        score += 20 + ripeBonus;
        spraySparks(a.x, a.y, 12);
        apples.splice(i, 1);
        continue;
      }
      if (a.scale >= 1.0) {
        // Hatches into a chasing Worm!
        sprayParticles(a.x, a.y, 18, 0, 140, Math.PI, "#a855f7");
        addWorm(a.x, a.y);
        apples.splice(i, 1);
      }
    }

    // Update chasing worms (faithful to Chaser + Worm in pacVer.as)
    const wFric = Math.pow(0.06, dt);
    for (const w of worms) {
      w.t += dt * 15;
      const targetAng = Math.atan2(player.y - w.y, player.x - w.x);
      w.rot = rotateTowards(w.rot, targetAng, 2.3 * dt);
      w.vx += Math.cos(w.rot) * 280 * dt;
      w.vy += Math.sin(w.rot) * 280 * dt;
      w.vx *= wFric;
      w.vy *= wFric;
      w.x += w.vx * dt;
      w.y += w.vy * dt;

      if (invuln <= 0 && Math.hypot(w.x - player.x, w.y - player.y) < player.r + 8) {
        hp--;
        invuln = 1.25;
        spraySparks(player.x, player.y, 16);
        // Knock worm back
        const kb = Math.atan2(w.y - player.y, w.x - player.x);
        w.vx = Math.cos(kb) * 220;
        w.vy = Math.sin(kb) * 220;
        if (hp <= 0) { over = true; won = false; }
      }
    }

    // Particles & sparks
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.25, dt); pt.vy *= Math.pow(0.25, dt);
      pt.scale -= 1.6 * dt;
      if (pt.scale <= 0) particles.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= Math.pow(0.05, dt); s.vy *= Math.pow(0.05, dt);
      s.scale *= Math.pow(0.02, dt);
      if (s.scale <= 0.04) sparks.splice(i, 1);
    }

    if (eaten >= appleGoal) {
      won = true;
      over = true;
      score += 100 + Math.round(timeLeft * 4) + hp * 25;
    }
  }

  document.getElementById("stat").textContent = `Pommes: ${eaten}/${appleGoal} • Vers: ${worms.length} • ♥ ${hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Particles
  for (const pt of particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.alpha * pt.scale);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(0.5, pt.r * pt.scale), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Sparks
  for (const s of sparks) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = "#fb923c";
    ctx.fillRect(0, -1.5, s.len * s.scale, 3 * s.scale);
    ctx.restore();
  }

  // Apples with warning ring as they approach hatching
  for (const a of apples) {
    const r = Math.max(3, 12 * a.scale);
    if (a.scale > 0.65) {
      ctx.strokeStyle = `rgba(248, 113, 113, ${(a.scale - 0.65) * 2.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a.x, a.y, r + 4 + Math.sin(now * 0.02) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = a.scale > 0.8 ? "#ff4d6d" : "#ef4444";
    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(a.x - 1, a.y - r - 3, 2, 4);
  }

  // Worms (6 tapered segments wiggling, faithful to Worm in pacVer.as)
  for (const w of worms) {
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(w.rot);
    const stretch = 1 + Math.sin(w.t) * 0.2;
    ctx.scale(stretch, 1);
    let currRadius = 6.5, currX = 6;
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = i === 0 ? "#c084fc" : "rgba(168, 85, 247, 0.72)";
      ctx.beginPath();
      ctx.arc(currX, Math.sin(w.t + i * 0.7) * 1.5, Math.max(1.5, currRadius), 0, Math.PI * 2);
      ctx.fill();
      currX -= currRadius * 0.95;
      currRadius -= 0.85;
    }
    ctx.restore();
  }

  // Player
  if (invuln <= 0 || Math.floor(now / 70) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "MOISSON RÉUSSIE !" : "DÉVORÉ / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
