<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Glisseur Astéroïdes (Glide)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "glide",
  "name": "Glisseur Astéroïdes (Glide)",
  "family": "clavDir",
  "icon": "🛰️",
  "controls": "Flèches / ZQSD (glisse inertielle) + Espace pour tirer (ou maintenir clic/doigt pour viser et tirer)",
  "description": "Pilotage à faible friction dans une arène rebondissante : chaque astéroïde détruit se scinde perpendiculairement en deux fragments plus petits.",
  "goal": "Pulvériser tous les astéroïdes et leurs fragments avant la fin du chrono sans perdre vos 3 points de coque.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "asteroidCount", "label": "Astéroïdes initiaux", "type": "number", "default": 3 }
  ]
}
</script>
<div class="bar">
  <span>🛰️ <b>Glisseur Glide</b></span>
  <span id="stat">Cibles: 3 • Coque: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "glide";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, down = false, mx = 256, my = 256;
let player = {}, asteroids = [], bullets = [], particles = [];
let timeLeft = 45, score = 0, won = false, over = false, reloadT = 0, invuln = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function updPtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (down) updPtr(e); });
window.addEventListener("pointerup", () => { down = false; });

function spawnBurst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, col });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  const count = Math.max(2, Math.min(6, Number(custom.asteroidCount) || 3));
  score = 0; won = false; over = false; reloadT = 0; invuln = 1.0;
  bullets = []; particles = [];

  player = { cx: 256, cy: 256, vx: 0, vy: 0, ang: -Math.PI / 2, rad: 10, hp: 3 };
  asteroids = [];
  for (let i = 0; i < count; i++) {
    const sideA = (i / count) * Math.PI * 2 + 0.4;
    const x = 256 + Math.cos(sideA) * 185;
    const y = 256 + Math.sin(sideA) * 185;
    const dir = Math.random() * Math.PI * 2;
    const spd = 75 + Math.random() * 35;
    asteroids.push({ cx: x, cy: y, vx: Math.cos(dir) * spd, vy: Math.sin(dir) * spd, ang: dir, rad: 32, hp: 20 });
  }
}

function fireBullet() {
  bullets.push({
    cx: player.cx + Math.cos(player.ang) * 12,
    cy: player.cy + Math.sin(player.ang) * 12,
    vx: Math.cos(player.ang) * 380,
    vy: Math.sin(player.ang) * 380,
    rad: 4,
    life: 1.05
  });
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (reloadT > 0) reloadT = Math.max(0, reloadT - dt);

    // Faithful glide.as inertial thrust + low friction (0.99 per frame)
    const ts = 3.8, ms = 320;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) player.ang -= ts * dt;
    if (keys.ArrowRight || keys.KeyD) player.ang += ts * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) {
      player.vx += Math.cos(player.ang) * ms * dt;
      player.vy += Math.sin(player.ang) * ms * dt;
    }
    if (keys.ArrowDown || keys.KeyS) {
      player.vx -= Math.cos(player.ang) * ms * 0.8 * dt;
      player.vy -= Math.sin(player.ang) * ms * 0.8 * dt;
    }

    if (down) {
      const dx = mx - player.cx, dy = my - player.cy, d = Math.hypot(dx, dy);
      if (d > 6) {
        const targetA = Math.atan2(dy, dx);
        let diff = targetA - player.ang;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.ang += Math.max(-ts * 2 * dt, Math.min(ts * 2 * dt, diff));
        if (d > 48) {
          player.vx += Math.cos(player.ang) * ms * 0.85 * dt;
          player.vy += Math.sin(player.ang) * ms * 0.85 * dt;
        }
      }
    }

    const drag = Math.pow(0.99, dt * 60);
    player.vx *= drag; player.vy *= drag;
    player.cx += player.vx * dt; player.cy += player.vy * dt;

    // Bounce off arena walls (glide.as)
    if (player.vx > 0 && player.cx > 500) player.vx *= -1;
    if (player.vx < 0 && player.cx < 12) player.vx *= -1;
    if (player.vy > 0 && player.cy > 500) player.vy *= -1;
    if (player.vy < 0 && player.cy < 12) player.vy *= -1;
    player.cx = Math.max(12, Math.min(500, player.cx));
    player.cy = Math.max(12, Math.min(500, player.cy));

    if ((keys.Space || down) && reloadT <= 0) {
      fireBullet();
      reloadT = 0.2;
    }

    // Sub-stepped bullets (faithful to k=0..3 loop in glide.as)
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.life -= dt;
      let hit = false;
      for (let k = 0; k < 4; k++) {
        b.cx += (b.vx * dt) * 0.25;
        b.cy += (b.vy * dt) * 0.25;
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(a.cx - b.cx, a.cy - b.cy) < a.rad + b.rad) {
            a.hp -= 20;
            hit = true;
            if (a.hp <= 0) {
              score += a.rad >= 30 ? 20 : (a.rad >= 14 ? 30 : 40);
              spawnBurst(a.cx, a.cy, a.rad >= 30 ? "#fb923c" : "#fde047", 10);
              // Faithful perpendicular split from glide.as
              if (a.rad > 8) {
                const nr = a.rad * 0.5;
                const boost = 1.15;
                asteroids.push({ cx: a.cx, cy: a.cy, vx: -a.vy * boost, vy: a.vx * boost, ang: a.ang, rad: nr, hp: 20 });
                asteroids.push({ cx: a.cx, cy: a.cy, vx: a.vy * boost, vy: -a.vx * boost, ang: a.ang, rad: nr, hp: 20 });
              }
              asteroids.splice(j, 1);
            }
            break;
          }
        }
        if (hit) break;
      }
      if (hit || b.life <= 0 || b.cx < 0 || b.cx > 512 || b.cy < 0 || b.cy > 512) {
        bullets.splice(i, 1);
      }
    }

    // Update asteroids
    for (const a of asteroids) {
      a.ang += ((a.vx + a.vy) * 0.012) * dt * 6;
      a.cx += a.vx * dt; a.cy += a.vy * dt;
      if (a.vx > 0 && a.cx > 512 - a.rad) a.vx *= -1;
      if (a.vx < 0 && a.cx < a.rad) a.vx *= -1;
      if (a.vy > 0 && a.cy > 512 - a.rad) a.vy *= -1;
      if (a.vy < 0 && a.cy < a.rad) a.vy *= -1;

      if (invuln <= 0 && Math.hypot(a.cx - player.cx, a.cy - player.cy) < a.rad + player.rad) {
        player.hp--;
        invuln = 1.2;
        const ka = Math.atan2(player.cy - a.cy, player.cx - a.cx);
        player.vx = Math.cos(ka) * 180;
        player.vy = Math.sin(ka) * 180;
        spawnBurst(player.cx, player.cy, "#f87171", 14);
        if (player.hp <= 0) { won = false; over = true; }
      }
    }

    if (asteroids.length === 0 && !over) {
      won = true; over = true;
      score += Math.round(timeLeft * 5) + player.hp * 25;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Cibles: ${asteroids.length} • Coque: ${player.hp} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle starfield grid
  ctx.strokeStyle = "rgba(56, 214, 255, 0.06)";
  ctx.lineWidth = 1;
  for (let i = 64; i < 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Asteroids (wireframe circles + spin spoke from glide.as)
  for (const a of asteroids) {
    ctx.fillStyle = a.rad >= 30 ? "rgba(251, 146, 60, 0.16)" : (a.rad >= 14 ? "rgba(253, 224, 71, 0.18)" : "rgba(248, 113, 113, 0.22)");
    ctx.strokeStyle = a.rad >= 30 ? "#fb923c" : (a.rad >= 14 ? "#fde047" : "#f87171");
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a.cx, a.cy, a.rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(a.cx, a.cy);
    ctx.lineTo(a.cx + Math.cos(a.ang) * a.rad, a.cy + Math.sin(a.ang) * a.rad);
    ctx.stroke();
  }

  // Bullets
  ctx.fillStyle = "#4ade80";
  for (const b of bullets) {
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.rad, 0, Math.PI * 2); ctx.fill();
  }

  // Particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 0.4);
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player
  const blink = invuln > 0 && Math.floor(now / 80) % 2 === 0;
  if (!blink) {
    ctx.fillStyle = "rgba(56, 214, 255, 0.25)";
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(player.cx, player.cy, player.rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(player.cx, player.cy);
    ctx.lineTo(player.cx + Math.cos(player.ang) * 16, player.cy + Math.sin(player.ang) * 16);
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "SECTEUR DÉGAGÉ !" : (player.hp <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
