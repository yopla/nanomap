<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Quarantaine Virale (Invaiz)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "invaiz",
  "name": "Quarantaine Virale (Invaiz)",
  "family": "zooEcosys",
  "icon": "🦠",
  "controls": "Souris / Flèches/ZQSD pour déplacer l'anneau médical • Maintenir Clic / Espace pour purifier les particules infectées",
  "description": "Simulation de contagion particulaire : les porteurs rouges contaminent leur voisinage avant de guérir. Contenez la propagation et éradiquez le foyer.",
  "goal": "Ramener le nombre d'infectés à 0 avant la fin du chrono (et avant 60% de contagion).",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 },
    { "key": "particleCount", "label": "Particules", "type": "number", "default": 160 }
  ]
}
</script>
<div class="bar">
  <span>🦠 <b>Quarantaine Invaiz</b></span>
  <span id="stat">Infectés: 6 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "invaiz";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const FIELD_H = 446;

let dots = [], keys = {}, cursor = { x: 256, y: 220 }, active = false;
let timeLeft = 40, totalDots = 160, charge = 100, curedTotal = 0;
let score = 0, won = false, over = false, failReason = "", simAcc = 0, pulsePhase = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  totalDots = Math.max(80, Math.min(240, Number(custom.particleCount) || 160));
  dots = [];
  charge = 100; curedTotal = 0; score = 0; won = false; over = false; failReason = ""; simAcc = 0;

  const initInfected = 8;
  for (let i = 0; i < totalDots; i++) {
    const speed = 1.4 + Math.random() * 2.8;
    const theta = Math.random() * Math.PI * 2;
    const inf = i < initInfected;
    dots.push({
      x: 16 + Math.random() * 480,
      y: 16 + Math.random() * (FIELD_H - 32),
      vSize: speed,
      theta,
      state: inf ? 1 : 0, // 0 = healthy, 1 = infected, 2 = briefly immune
      timer: inf ? 110 + Math.floor(Math.random() * 60) : 0
    });
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (over) { sendResultAndExit(won, score); return; }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = getPos(e);
  cursor.x = pt.x; cursor.y = Math.min(FIELD_H - 10, pt.y);
  active = true;
});
cv.addEventListener("pointermove", (e) => {
  const pt = getPos(e);
  cursor.x = pt.x; cursor.y = Math.min(FIELD_H - 10, pt.y);
});
window.addEventListener("pointerup", () => { active = false; });

function stepParticles() {
  const infected = [];
  const healthy = [];
  const curing = (active || keys.Space) && charge > 4;
  const cureR = 54;

  for (const d of dots) {
    // Random angular drift + rigid wall bounce (faithful to invaiz.as)
    d.theta += (Math.random() * 45 - 22.5) * Math.PI / 180;
    const ux = Math.cos(d.theta) * d.vSize;
    const uy = Math.sin(d.theta) * d.vSize;
    d.x += ux;
    d.y += uy;

    if (d.x < 4) { d.x = 4; d.theta += Math.PI; }
    else if (d.x > 508) { d.x = 508; d.theta += Math.PI; }
    if (d.y < 4) { d.y = 4; d.theta += Math.PI; }
    else if (d.y > FIELD_H - 4) { d.y = FIELD_H - 4; d.theta += Math.PI; }

    // Player quarantine beam
    if (curing) {
      const dx = d.x - cursor.x, dy = d.y - cursor.y;
      const dist = Math.hypot(dx, dy);
      if (dist < cureR) {
        if (d.state === 1) {
          d.state = 2;
          d.timer = 95;
          curedTotal++;
        } else if (d.state === 0 && dist > 1) {
          // Gently push healthy particles clear of hot zones
          d.x = Math.max(4, Math.min(508, d.x + (dx / dist) * 1.4));
          d.y = Math.max(4, Math.min(FIELD_H - 4, d.y + (dy / dist) * 1.4));
        }
      }
    }

    if (d.state === 1) {
      d.timer--;
      if (d.timer <= 0) { d.state = 2; d.timer = 45; }
      else infected.push(d);
    } else if (d.state === 2) {
      d.timer--;
      if (d.timer <= 0) d.state = 0;
    } else {
      healthy.push(d);
    }
  }

  // Contagion check (radius ~14px, probability rate)
  for (let j = 0; j < infected.length; j++) {
    const inf = infected[j];
    for (let i = 0; i < healthy.length; i++) {
      const h = healthy[i];
      if (h.state !== 0) continue;
      const dx = h.x - inf.x, dy = h.y - inf.y;
      if (dx * dx + dy * dy < 196) {
        if (Math.random() < 0.35) {
          h.state = 1;
          h.timer = 135;
        }
      }
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pulsePhase += dt * 6;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    const kSpeed = 270;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) cursor.x = Math.max(16, cursor.x - kSpeed * dt);
    if (keys.ArrowRight || keys.KeyD) cursor.x = Math.min(496, cursor.x + kSpeed * dt);
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) cursor.y = Math.max(16, cursor.y - kSpeed * dt);
    if (keys.ArrowDown || keys.KeyS) cursor.y = Math.min(FIELD_H - 16, cursor.y + kSpeed * dt);

    const curing = (active || keys.Space) && charge > 4;
    if (curing) charge = Math.max(0, charge - dt * 36);
    else charge = Math.min(100, charge + dt * 26);

    simAcc += dt;
    while (simAcc >= 1 / 33) {
      simAcc -= 1 / 33;
      stepParticles();
    }

    const infCount = dots.filter(d => d.state === 1).length;
    const healthyCount = totalDots - infCount;
    const infRatio = infCount / totalDots;
    score = Math.round(curedTotal * 8 + healthyCount);

    if (infCount === 0) {
      won = true; over = true;
      score += Math.round(timeLeft * 8 + 80);
    } else if (infRatio >= 0.6) {
      won = false; over = true; failReason = "PANDÉMIE CRITIQUE (>60%)";
    } else if (timeLeft <= 0) {
      won = false; over = true; failReason = "CHRONO EXPIRÉ";
    }
  }

  const infCount = dots.filter(d => d.state === 1).length;
  const pct = Math.round((infCount / totalDots) * 100);
  document.getElementById("stat").textContent = `Infectés: ${infCount} (${pct}%) • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Subtle grid
  ctx.strokeStyle = "rgba(56, 214, 255, 0.05)";
  for (let x = 32; x < 512; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, FIELD_H); ctx.stroke(); }
  for (let y = 32; y < FIELD_H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke(); }

  // Draw particles
  for (const d of dots) {
    if (d.state === 1) {
      ctx.fillStyle = "rgba(248, 113, 113, 0.16)";
      ctx.beginPath(); ctx.arc(d.x, d.y, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff3b5c";
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.2, 0, Math.PI * 2); ctx.fill();
    } else if (d.state === 2) {
      ctx.fillStyle = "#4ade80";
      ctx.beginPath(); ctx.arc(d.x, d.y, 2.8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#38d6ff";
      ctx.beginPath(); ctx.arc(d.x, d.y, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Player quarantine reticle
  if (!over) {
    const curing = (active || keys.Space) && charge > 4;
    const r = curing ? 54 + Math.sin(pulsePhase) * 3 : 42;
    ctx.fillStyle = curing ? "rgba(74, 222, 128, 0.14)" : "rgba(56, 214, 255, 0.06)";
    ctx.strokeStyle = curing ? "#4ade80" : "#38d6ff";
    ctx.lineWidth = curing ? 2.5 : 1.5;
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cursor.x - 8, cursor.y); ctx.lineTo(cursor.x + 8, cursor.y);
    ctx.moveTo(cursor.x, cursor.y - 8); ctx.lineTo(cursor.x, cursor.y + 8); ctx.stroke();
  }

  // Bottom Telemetry Bar
  ctx.fillStyle = "#101828"; ctx.fillRect(0, FIELD_H, 512, 66);
  ctx.strokeStyle = "#2d5b7b"; ctx.beginPath(); ctx.moveTo(0, FIELD_H); ctx.lineTo(512, FIELD_H); ctx.stroke();

  ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillStyle = "#e6f4ff"; ctx.fillText(`Contagion (seuil 60%): ${pct}%`, 14, FIELD_H + 22);
  ctx.fillStyle = "#1e293b"; ctx.fillRect(14, FIELD_H + 30, 224, 12);
  ctx.fillStyle = pct > 40 ? "#f87171" : "#fb923c";
  ctx.fillRect(14, FIELD_H + 30, 224 * Math.min(1, (infCount / totalDots) / 0.6), 12);

  ctx.fillStyle = "#e6f4ff"; ctx.fillText(`Purificateur: ${Math.round(charge)}% • Guéris: ${curedTotal}`, 262, FIELD_H + 22);
  ctx.fillStyle = "#1e293b"; ctx.fillRect(262, FIELD_H + 30, 234, 12);
  ctx.fillStyle = "#4ade80"; ctx.fillRect(262, FIELD_H + 30, 234 * (charge / 100), 12);

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.86)"; ctx.fillRect(0, 160, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FOYER ÉRADIQUÉ !" : failReason, 256, 218);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} (${curedTotal} guérisons) — Cliquez pour revenir`, 256, 260);
  }

  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
