<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Nuée Blocs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "blocs",
  "name": "Nuée Blocs",
  "family": "topMouseMut",
  "icon": "🔴",
  "controls": "Déplacer la souris / doigt : le leurre rouge attire les drones qui évitent de se chevaucher",
  "description": "Guidage d'un essaim de drones à évitement mutuel strict attirés par un leurre à inertie douce.",
  "goal": "Guider 10 drones dans les zones vertes d'extraction en évitant les mines rouges !",
  "fields": [
    { "key": "droneCount", "label": "Drones initiaux", "type": "number", "default": 12 },
    { "key": "durationSec", "label": "Durée (sec)", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>🔴 <b>Nuée Blocs</b></span>
  <span id="stat">Extraits: 0/10 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "blocs";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 256, y: 256 };
let target = { x: 256, y: 256 };
let ais = [], mines = [], zone = { x: 430, y: 82, r: 34 };
let extracted = 0, goalCount = 10, timeLeft = 40, score = 0, won = false, over = false;
let zoneBatch = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
});

const ZONE_SPOTS = [
  { x: 436, y: 76 }, { x: 76, y: 436 }, { x: 436, y: 436 }, { x: 76, y: 76 }, { x: 256, y: 70 }
];
let spotIdx = 0;

function placeZone() {
  spotIdx = (spotIdx + 1) % ZONE_SPOTS.length;
  zone.x = ZONE_SPOTS[spotIdx].x;
  zone.y = ZONE_SPOTS[spotIdx].y;
  zoneBatch = 0;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const cnt = Math.max(6, Number(custom.droneCount) || 12);
  goalCount = Math.max(4, cnt - 2);
  timeLeft = Math.max(15, Number(custom.durationSec) || 40);
  extracted = 0; score = 0; won = false; over = false; zoneBatch = 0; spotIdx = 0;
  zone = { x: ZONE_SPOTS[0].x, y: ZONE_SPOTS[0].y, r: 36 };
  mouse = { x: 256, y: 256 };
  target = { x: 256, y: 256 };

  ais = [];
  for (let i = 0; i < cnt; i++) {
    let x, y, tries = 0;
    do {
      x = 60 + Math.random() * 260;
      y = 140 + Math.random() * 310;
      tries++;
    } while (tries < 40 && ais.some(a => Math.hypot(a.x - x, a.y - y) < 26));
    ais.push({ x, y, alive: true, docked: false });
  }

  mines = [
    { cx: 256, cy: 256, rx: 110, ry: 75, ang: 0, spd: 1.05, r: 14 },
    { cx: 256, cy: 256, rx: 110, ry: 75, ang: Math.PI, spd: 1.05, r: 14 },
    { cx: 256, cy: 256, rx: 170, ry: 170, ang: 1.2, spd: -0.75, r: 14 }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;

    // Smooth ease target toward cursor (like TweenMax Quad.easeOut in blocs.as)
    const ease = 1 - Math.exp(-5.5 * dt);
    target.x += (mouse.x - target.x) * ease;
    target.y += (mouse.y - target.y) * ease;

    // Update orbiting hazard mines
    for (const m of mines) {
      m.ang += m.spd * dt;
      m.x = m.cx + Math.cos(m.ang) * m.rx;
      m.y = m.cy + Math.sin(m.ang) * m.ry;
    }

    // Update AIs with strict non-overlapping separation (faithful to blocs.as)
    const step = 115 * dt;
    for (const ai of ais) {
      if (!ai.alive || ai.docked) continue;
      const dx = target.x - ai.x;
      const dy = target.y - ai.y;
      const dist = Math.hypot(dx, dy);
      let tx = ai.x, ty = ai.y;
      if (dist > step) {
        tx += (dx / dist) * step;
        ty += (dy / dist) * step;
      } else {
        tx = target.x;
        ty = target.y;
      }

      let tooClose = false;
      for (const ai2 of ais) {
        if (ai2 !== ai && ai2.alive && !ai2.docked) {
          if (Math.hypot(ai2.x - tx, ai2.y - ty) < 22) {
            tooClose = true;
            break;
          }
        }
      }
      if (!tooClose) {
        ai.x = Math.max(12, Math.min(500, tx));
        ai.y = Math.max(12, Math.min(500, ty));
      }

      // Check extraction zone
      if (Math.hypot(ai.x - zone.x, ai.y - zone.y) < zone.r) {
        ai.docked = true;
        extracted++;
        zoneBatch++;
        score += 35;
        if (zoneBatch >= 3 && extracted < goalCount) placeZone();
      }

      // Check mines
      for (const m of mines) {
        if (Math.hypot(ai.x - m.x, ai.y - m.y) < m.r + 10) {
          ai.alive = false;
          score = Math.max(0, score - 15);
          break;
        }
      }
    }

    const aliveLeft = ais.filter(a => a.alive && !a.docked).length;
    if (extracted >= goalCount) {
      won = true; over = true;
      score += Math.round(timeLeft * 6);
    } else if (extracted + aliveLeft < goalCount) {
      over = true;
    }
  }

  const aliveLeft = ais.filter(a => a.alive && !a.docked).length;
  document.getElementById("stat").textContent = `Extraits: ${extracted}/${goalCount} • Actifs: ${aliveLeft} • ${Math.ceil(timeLeft)}s • Score ${score}`;

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)"; ctx.lineWidth = 1;
  for (let i = 32; i < 512; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Extraction zone
  ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.18)"; ctx.fill();
  ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "#4ade80"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("SAS", zone.x, zone.y + 4);

  // Mines
  for (const m of mines) {
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(248,113,113,0.28)"; ctx.fill();
    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Tether line mouse -> target
  ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y); ctx.lineTo(target.x, target.y);
  ctx.strokeStyle = "rgba(248,113,113,0.35)"; ctx.lineWidth = 1.5; ctx.stroke();

  // AI drones
  for (const ai of ais) {
    if (!ai.alive || ai.docked) continue;
    ctx.beginPath(); ctx.arc(ai.x, ai.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(56,214,255,0.25)"; ctx.fill();
    ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Red lure target (from blocs.as)
  ctx.beginPath(); ctx.arc(target.x, target.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(248,113,113,0.3)"; ctx.fill();
  ctx.strokeStyle = "#f87171"; ctx.lineWidth = 2.5; ctx.stroke();

  // Cursor dot
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#e6f4ff"; ctx.fill();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "NUÉE EXTRAITE !" : (timeLeft <= 0 ? "TEMPS ÉCOULÉ" : "TROP DE PERTES"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
