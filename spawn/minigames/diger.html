<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Foreuse Autonome (Diger)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diger",
  "name": "Foreuse Autonome (Diger)",
  "family": "core",
  "icon": "💎",
  "controls": "Maintenir clic / glisser sur la roche pour tracer les galeries (ou Flèches/ZQSD + Espace)",
  "description": "Tracez des ordres d'excavation jaunes sur une grille 32×32 pour guider un robot foreur autonome vers les filons cristallins en évitant les poches instables.",
  "goal": "Extraire tous les cristaux lumineux avant la fin du chrono sans percer 3 poches instables.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "gemCount", "label": "Cristaux", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>💎 <b>Foreuse Diger</b></span>
  <span id="stat">Cristaux: 0/10 • Coque: 3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diger";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 32, MH = 32, CS = 16;
// map values: 0 = free/open, 1 = wall, 2 = visited, 3 = gem wall, 4 = hazard wall
let map = [], sel = [];
let cx = 16, cy = 16, vx = 0, vy = 0, wt = 0;
let curX = 16, curY = 16;
let mdown = false, paintMode = 0;
let keys = {}, keyCD = 0;
let gemTarget = 10, gemsFound = 0, hp = 3, timeLeft = 45, score = 0, won = false, over = false;
let stepAcc = 0, particles = [], flashT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getCell(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * (512 / r.width) / CS);
  const y = Math.floor((e.clientY - r.top) * (512 / r.height) / CS);
  return { x: Math.max(0, Math.min(MW - 1, x)), y: Math.max(0, Math.min(MH - 1, y)) };
}

function applyPaint(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  if (paintMode === 0) paintMode = sel[ay][ax] === 0 ? 1 : 2;
  if (isWall(ax, ay)) {
    sel[ay][ax] = paintMode === 1 ? 1 : 0;
  } else if (map[ay][ax] === 2) {
    map[ay][ax] = 0;
  }
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  mdown = true; paintMode = 0;
  const c = getCell(e); curX = c.x; curY = c.y;
  applyPaint(curX, curY);
});
cv.addEventListener("pointermove", (e) => {
  const c = getCell(e); curX = c.x; curY = c.y;
  if (mdown && !over) applyPaint(curX, curY);
});
window.addEventListener("pointerup", () => { mdown = false; paintMode = 0; });

function isWall(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return true;
  const v = map[ay][ax];
  return v === 1 || v === 3 || v === 4;
}
function isFree(ax, ay) {
  if (isWall(ax, ay)) return false;
  return map[ay][ax] === 0;
}
function isDig(ax, ay) {
  if (!isWall(ax, ay)) return false;
  return sel[ay][ax] > 0;
}
function spawnBurst(gx, gy, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 90;
    particles.push({ x: gx * CS + 8, y: gy * CS + 8, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, col });
  }
}
function digWall(ax, ay) {
  if (!isWall(ax, ay)) return;
  const prev = map[ay][ax];
  sel[ay][ax] = 0;
  map[ay][ax] = 0;
  if (prev === 3) {
    gemsFound++;
    score += 45;
    spawnBurst(ax, ay, "#4ade80", 14);
    if (gemsFound >= gemTarget) {
      won = true; over = true;
      score += Math.round(timeLeft * 5) + hp * 20;
    }
  } else if (prev === 4) {
    hp--;
    flashT = 0.35;
    spawnBurst(ax, ay, "#f87171", 16);
    if (hp <= 0) { won = false; over = true; }
  } else {
    score += 1;
    spawnBurst(ax, ay, "#fde047", 4);
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  gemTarget = Math.max(4, Math.min(20, Number(custom.gemCount) || 10));
  gemsFound = 0; hp = 3; score = 0; won = false; over = false;
  cx = 16; cy = 16; vx = 0; vy = 0; wt = 0; stepAcc = 0; particles = []; flashT = 0;
  curX = 16; curY = 11;

  map = Array.from({ length: MH }, () => Array(MW).fill(1));
  sel = Array.from({ length: MH }, () => Array(MW).fill(0));
  for (let y = 12; y < 20; y++) {
    for (let x = 12; x < 20; x++) map[y][x] = 0;
  }

  // Place crystal veins (3) and unstable gas pockets (4) inside rock
  let placed = 0, tries = 0;
  while (placed < gemTarget && tries < 600) {
    tries++;
    const x = 1 + Math.floor(Math.random() * (MW - 2));
    const y = 1 + Math.floor(Math.random() * (MH - 2));
    if (map[y][x] !== 1) continue;
    const dist = Math.hypot(x - 16, y - 16);
    if (dist < 5.2 || dist > 14.5) continue;
    map[y][x] = 3;
    placed++;
  }
  let haz = 0; tries = 0;
  while (haz < 7 && tries < 600) {
    tries++;
    const x = 2 + Math.floor(Math.random() * (MW - 4));
    const y = 2 + Math.floor(Math.random() * (MH - 4));
    if (map[y][x] !== 1) continue;
    const dist = Math.hypot(x - 16, y - 16);
    if (dist < 5.5 || dist > 13) continue;
    let nearGem = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (map[y + dy] && map[y + dy][x + dx] === 3) nearGem = true;
    }
    if (nearGem) continue;
    map[y][x] = 4;
    haz++;
  }
}

function stepBot() {
  map[cy][cx] = 2;

  if (isFree(cx, cy - 1)) { vy = -1; vx = 0; }
  else if (isFree(cx, cy + 1)) { vy = 1; vx = 0; }
  else if (isFree(cx - 1, cy)) { vx = -1; vy = 0; }
  else if (isFree(cx + 1, cy)) { vx = 1; vy = 0; }

  if (isDig(cx, cy - 1)) { vy = -1; vx = 0; digWall(cx, cy - 1); }
  else if (isDig(cx, cy + 1)) { vy = 1; vx = 0; digWall(cx, cy + 1); }
  else if (isDig(cx - 1, cy)) { vx = -1; vy = 0; digWall(cx - 1, cy); }
  else if (isDig(cx + 1, cy)) { vx = 1; vy = 0; digWall(cx + 1, cy); }

  if (over) return;

  if (map[cy][cx] === 2) wt += 1;
  if (wt >= 3) {
    vx = 0; vy = 0;
    const dirs = [[1,0],[-1,0],[0,-1],[0,1]];
    // First look along cardinal rays for marked walls or unvisited floor (faithful to diger.as)
    for (const [dkx, dky] of dirs) {
      for (let i = 1; i < 20; i++) {
        const tx = cx + dkx * i, ty = cy + dky * i;
        if (isWall(tx, ty)) {
          if (tx >= 0 && tx < MW && ty >= 0 && ty < MH && sel[ty][tx] > 0) { vx = dkx; vy = dky; break; }
          break;
        } else if (map[ty][tx] === 0) {
          vx = dkx; vy = dky; break;
        }
      }
      if (vx !== 0 || vy !== 0) break;
    }
    if (vx === 0 && vy === 0) {
      vx = 1; wt = 0;
      const turns = Math.floor(Math.random() * 4);
      for (let i = 0; i < turns; i++) { const t = vx; vx = -vy; vy = t; }
    }
  }

  const kx = cx + vx, ky = cy + vy;
  if (!isWall(kx, ky)) { cx = kx; cy = ky; }
  else { const t = vx; vx = -vy; vy = t; }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    // Optional keyboard reticle control
    keyCD -= dt;
    if (keyCD <= 0) {
      let moved = false;
      if (keys.ArrowUp || keys.KeyW || keys.KeyZ) { curY = Math.max(0, curY - 1); moved = true; }
      if (keys.ArrowDown || keys.KeyS) { curY = Math.min(MH - 1, curY + 1); moved = true; }
      if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) { curX = Math.max(0, curX - 1); moved = true; }
      if (keys.ArrowRight || keys.KeyD) { curX = Math.min(MW - 1, curX + 1); moved = true; }
      if (moved) keyCD = 0.07;
    }
    if (keys.Space) {
      if (isWall(curX, curY)) sel[curY][curX] = 1;
      else if (map[curY][curX] === 2) map[curY][curX] = 0;
    }

    stepAcc += dt;
    while (stepAcc >= 0.065 && !over) {
      stepAcc -= 0.065;
      stepBot();
    }
  }

  if (flashT > 0) flashT = Math.max(0, flashT - dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  document.getElementById("stat").textContent = `Cristaux: ${gemsFound}/${gemTarget} • Coque: ${hp} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  const pulse = 0.65 + 0.35 * Math.sin(now * 0.008);
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      const v = map[y][x];
      const px = x * CS, py = y * CS;
      if (v === 1) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(px, py, CS - 1, CS - 1);
      } else if (v === 2) {
        ctx.fillStyle = "#0c2240";
        ctx.fillRect(px, py, CS, CS);
      } else if (v === 3) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(px, py, CS - 1, CS - 1);
        ctx.fillStyle = `rgba(74, 222, 128, ${0.55 + 0.4 * pulse})`;
        ctx.beginPath();
        ctx.moveTo(px + 8, py + 2); ctx.lineTo(px + 14, py + 8);
        ctx.lineTo(px + 8, py + 14); ctx.lineTo(px + 2, py + 8);
        ctx.closePath(); ctx.fill();
      } else if (v === 4) {
        ctx.fillStyle = "#2b1622";
        ctx.fillRect(px, py, CS - 1, CS - 1);
        ctx.fillStyle = `rgba(248, 113, 113, ${0.5 + 0.4 * pulse})`;
        ctx.beginPath(); ctx.arc(px + 8, py + 8, 4.5, 0, Math.PI * 2); ctx.fill();
      }
      if (sel[y][x] > 0) {
        ctx.fillStyle = "rgba(253, 224, 71, 0.55)";
        ctx.fillRect(px + 1, py + 1, CS - 2, CS - 2);
      }
    }
  }

  // Bot
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(cx * CS + 8, cy * CS + 8, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx * CS + 8, cy * CS + 8, 6, 0, Math.PI * 2); ctx.stroke();

  // Cursor reticle
  ctx.strokeStyle = "#fde047"; ctx.lineWidth = 1.5;
  ctx.strokeRect(curX * CS + 0.5, curY * CS + 0.5, CS - 1, CS - 1);

  // Particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 0.45);
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (flashT > 0) {
    ctx.fillStyle = `rgba(248, 113, 113, ${flashT * 0.6})`;
    ctx.fillRect(0, 0, 512, 512);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FILONS EXTRAITS !" : (hp <= 0 ? "FOREUSE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
