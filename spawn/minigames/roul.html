<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sphère Roulante (Roul)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "roul",
  "name": "Sphère Roulante (Roul)",
  "family": "sideClavSimple",
  "icon": "🟢",
  "controls": "Gauche/Droite (Q/D) pour rouler, Haut/Espace (W/Z) pour sauter (ou maintenir clic/doigt pour diriger)",
  "description": "Parcours acrobatique à sphère roulante avec rebonds muraux, dômes circulaires et caméra fluide.",
  "goal": "Collecter les 6 noyaux dorés et franchir le portail final avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🟢 <b>Sphère Roulante</b></span>
  <span id="stat">Noyaux: 0/6 • ❤️3 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "roul";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let keys = {}, ptr = { down: false, x: 256, y: 256 };
let shapes = [], orbs = [], portal = {}, dude = {}, cam = { x: 0, y: 0 };
let timeLeft = 45, lives = 3, score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) * (512 / r.width);
  ptr.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  ptr.down = true; setPtr(e);
});
cv.addEventListener("pointermove", (e) => { if (ptr.down) setPtr(e); });
window.addEventListener("pointerup", () => { ptr.down = false; });

function hitGround(px, py) {
  for (const s of shapes) {
    if (s.type === "rect") {
      if (px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) return true;
    } else if (s.type === "circle") {
      if (Math.hypot(px - s.x, py - s.y) <= s.r) return true;
    }
  }
  return false;
}

function spawnDude() {
  dude = { x: 20, y: -40, r: 15, speed: 0, grav: 0, jumping: false, rot: 0 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  shapes = [
    // Starting deck + original AS3 wall & dome motif
    { type: "rect", color: "#334155", x: -60, y: 50, w: 460, h: 160 },
    { type: "rect", color: "#ef4444", x: 110, y: -35, w: 28, h: 85 },
    { type: "circle", color: "#22c55e", x: 230, y: 38, r: 34 },
    // Mid-course stepping domes & ledges
    { type: "circle", color: "#38d6ff", x: 465, y: 55, r: 42 },
    { type: "rect", color: "#334155", x: 560, y: 20, w: 230, h: 160 },
    { type: "rect", color: "#ef4444", x: 660, y: -60, w: 26, h: 80 },
    { type: "circle", color: "#22c55e", x: 865, y: 5, r: 38 },
    // Upper ridge & finale
    { type: "rect", color: "#334155", x: 960, y: -20, w: 210, h: 180 },
    { type: "circle", color: "#38d6ff", x: 1065, y: -22, r: 28 },
    { type: "rect", color: "#334155", x: 1240, y: -60, w: 240, h: 200 }
  ];
  orbs = [
    { x: 124, y: -66, got: false },
    { x: 230, y: -22, got: false },
    { x: 465, y: -15, got: false },
    { x: 673, y: -92, got: false },
    { x: 865, y: -60, got: false },
    { x: 1065, y: -78, got: false }
  ];
  portal = { x: 1390, y: -98, r: 24 };
  lives = 3; score = 0; won = false; over = false; animT = 0;
  spawnDude();
  cam.x = dude.x - 256;
  cam.y = dude.y - 256;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;
  animT += dt;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    const step = dt * 60;
    const kLeft = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ || (ptr.down && ptr.x < 210));
    const kRight = !!(keys.ArrowRight || keys.KeyD || (ptr.down && ptr.x > 302));
    const kJump = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space || (ptr.down && ptr.y < 220));

    // Ground collision & gravity (faithful to roul.as)
    if (hitGround(dude.x, dude.y + dude.r)) {
      dude.grav = 0;
      dude.jumping = false;
    } else {
      dude.grav = Math.min(14, dude.grav + 0.65 * step);
      dude.y += dude.grav * step;
    }

    let pushGuard = 0;
    while (hitGround(dude.x, dude.y + dude.r - 1) && pushGuard++ < 28) {
      dude.y -= 1;
      dude.grav = 0;
      dude.jumping = false;
    }

    if (kJump && !dude.jumping) {
      dude.grav = -11.8;
      dude.y += dude.grav * step;
      dude.jumping = true;
    }

    if (kLeft) dude.speed -= 0.55 * step;
    if (kRight) dude.speed += 0.55 * step;
    if (!kLeft && !kRight) {
      dude.speed *= Math.pow(0.86, step);
      if (Math.abs(dude.speed) < 0.15) dude.speed = 0;
    }
    dude.speed = Math.max(-6.5, Math.min(6.5, dude.speed));

    dude.x += dude.speed * step;
    dude.rot += dude.speed * 0.14 * step;

    // Wall bounces & ceiling check
    let wGuard = 0;
    while (hitGround(dude.x - dude.r + 1, dude.y) && wGuard++ < 20) {
      dude.x += 1;
      dude.speed = Math.abs(dude.speed) * 0.75;
    }
    wGuard = 0;
    while (hitGround(dude.x + dude.r - 1, dude.y) && wGuard++ < 20) {
      dude.x -= 1;
      dude.speed = -Math.abs(dude.speed) * 0.75;
    }
    wGuard = 0;
    while (hitGround(dude.x, dude.y - dude.r) && wGuard++ < 20) {
      dude.y += 1;
      dude.grav = 0;
    }

    // Fall into void
    if (dude.y > 260) {
      lives--;
      if (lives <= 0) { over = true; won = false; }
      else spawnDude();
    }

    // Orbs
    for (const o of orbs) {
      if (!o.got && Math.hypot(o.x - dude.x, o.y - dude.y) < dude.r + 13) {
        o.got = true;
        score += 40;
      }
    }

    // Portal
    const allOrbs = orbs.every(o => o.got);
    if (allOrbs && Math.hypot(portal.x - dude.x, portal.y - dude.y) < dude.r + portal.r) {
      won = true; over = true;
      score += 100 + lives * 25 + Math.round(timeLeft * 5);
    }

    // Smooth camera (roul.as)
    cam.x += (dude.x - 256 - cam.x) * Math.min(1, dt * 7);
    cam.y += (dude.y - 256 - cam.y) * Math.min(1, dt * 7);
  }

  const gotN = orbs.filter(o => o.got).length;
  document.getElementById("stat").textContent = `Noyaux: ${gotN}/${orbs.length} • ❤️${lives} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  const gxOff = -((cam.x % 40) + 40) % 40, gyOff = -((cam.y % 40) + 40) % 40;
  for (let x = gxOff; x < 512; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke(); }
  for (let y = gyOff; y < 512; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke(); }

  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  // Level shapes
  for (const s of shapes) {
    ctx.fillStyle = s.color;
    if (s.type === "rect") {
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.5;
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    } else if (s.type === "circle") {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // Orbs
  for (const o of orbs) {
    if (o.got) continue;
    const bob = Math.sin(animT * 5 + o.x * 0.02) * 4;
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(o.x, o.y + bob, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fef9c3"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Portal
  const ready = orbs.every(o => o.got);
  ctx.strokeStyle = ready ? "#4ade80" : "#64748b";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.r + Math.sin(animT * 6) * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = ready ? "rgba(74,222,128,0.28)" : "rgba(100,116,139,0.2)";
  ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.r - 4, 0, Math.PI * 2); ctx.fill();

  // Rolling sphere (dude)
  ctx.save();
  ctx.translate(dude.x, dude.y);
  ctx.rotate(dude.rot);
  ctx.fillStyle = "#22c55e";
  ctx.beginPath(); ctx.arc(0, 0, dude.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-dude.r, 0); ctx.lineTo(dude.r, 0);
  ctx.moveTo(0, -dude.r); ctx.lineTo(0, dude.r);
  ctx.stroke();
  ctx.restore();

  ctx.restore();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "PARCOURS BOUCLÉ !" : "CHUTE / EXPIRÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
