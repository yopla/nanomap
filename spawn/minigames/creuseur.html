<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Creuseur Radial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; gap: 8px; }
  .sub { width: min(512px, 96vw); font-size: 12px; color: #9fc4dc; text-align: center; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
  button:hover { background: #264a72; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "creuseur",
  "name": "Creuseur Radial",
  "family": "core",
  "icon": "⛏️",
  "controls": "Clic / Tactile pour poser une balise magnétique orientant les drones mineurs",
  "description": "Essaim de drones mineurs (xActor) partant du centre pour excaver des filons sombres sur une grille 25x25.",
  "goal": "Excaver tous les blocs de minerai avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 40 }
  ]
}
</script>
<div class="bar">
  <span>⛏️ <b>Creuseur Radial</b></span>
  <span id="stat">Minerai: 0 • 40s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<div class="sub">Cliquez sur la grille pour placer une balise directionnelle et guider vos drones !</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "creuseur";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const GRID = 25, CELL = 512 / GRID;
let grid = [], miners = [], beacon = null, score = 0, won = false, over = false, timeLeft = 40, oreLeft = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data);
});

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 40;
  score = 0; won = false; over = false; beacon = null;
  grid = Array.from({ length: GRID }, () => Array(GRID).fill(0));
  oreLeft = 0;
  for (let i = 0; i < 16; i++) {
    const gx = 2 + Math.floor(Math.random() * (GRID - 4));
    const gy = 2 + Math.floor(Math.random() * (GRID - 4));
    if (Math.hypot(gx - 12, gy - 12) < 3.5) continue;
    for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) {
      if (Math.random() < 0.72 && grid[gy + dy][gx + dx] === 0) {
        grid[gy + dy][gx + dx] = 3;
        oreLeft++;
      }
    }
  }
  miners = [];
  for (let i = 0; i < 20; i++) {
    miners.push({ x: 256, y: 256, a: Math.random() * Math.PI * 2, cargo: false });
  }
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const r = cv.getBoundingClientRect();
  beacon = { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    for (const m of miners) {
      if (m.cargo) {
        const a = Math.atan2(256 - m.y, 256 - m.x);
        m.x += Math.cos(a) * 190 * dt;
        m.y += Math.sin(a) * 190 * dt;
        if (Math.hypot(256 - m.x, 256 - m.y) < 12) {
          m.cargo = false;
          score += 10;
          m.a = beacon ? Math.atan2(beacon.y - 256, beacon.x - 256) + (Math.random() - 0.5) * 0.5 : Math.random() * Math.PI * 2;
        }
      } else {
        m.x += Math.cos(m.a) * 175 * dt;
        m.y += Math.sin(m.a) * 175 * dt;
        if (m.x < 6 || m.x > 506 || m.y < 6 || m.y > 506) {
          m.cargo = true;
        } else {
          const gx = Math.floor(m.x / CELL), gy = Math.floor(m.y / CELL);
          if (gx >= 0 && gx < GRID && gy >= 0 && gy < GRID && grid[gy][gx] > 0) {
            grid[gy][gx]--;
            if (grid[gy][gx] === 0) oreLeft--;
            m.cargo = true;
          }
        }
      }
    }
    if (oreLeft <= 0) { won = true; over = true; score += Math.round(timeLeft * 5); }
  }

  document.getElementById("stat").textContent = `Blocs: ${oreLeft} • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const hp = grid[y][x];
      if (hp > 0) {
        ctx.fillStyle = hp === 3 ? "#f59e0b" : (hp === 2 ? "#b45309" : "#6b3410");
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      }
    }
  }
  ctx.beginPath(); ctx.arc(256, 256, 15, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.28)"; ctx.fill();
  ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2; ctx.stroke();

  if (beacon) {
    ctx.beginPath(); ctx.arc(beacon.x, beacon.y, 16, 0, Math.PI * 2);
    ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const m of miners) {
    ctx.beginPath(); ctx.arc(m.x, m.y, 4.5, 0, Math.PI * 2);
    ctx.strokeStyle = m.cargo ? "#4ade80" : "#f87171"; ctx.lineWidth = 2; ctx.stroke();
    if (m.cargo) {
      ctx.fillStyle = "rgba(74,222,128,0.4)";
      ctx.fillRect(m.x - 5, m.y - 5, 10, 10);
    }
  }
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.84)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "FILON EXCAVÉ !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
