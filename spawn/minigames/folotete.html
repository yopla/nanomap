<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Duel Vectoriel (FoloTete)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "folotete",
  "name": "Duel Vectoriel (FoloTete)",
  "family": "clavDir",
  "icon": "🚀",
  "controls": "Flèches/ZQSD pour piloter + Espace/Clic gauche = tir rapide, Shift/Clic droit = missile guidé",
  "description": "Combat tournoyant face à des unités autonomes à distance d'engagement tactique.",
  "goal": "Détruire les 5 drones autonomes avant la fin du chrono.",
  "fields": [
    { "key": "unitCount", "label": "Drones ennemis", "type": "number", "default": 5 }
  ]
}
</script>
<div class="bar">
  <span>🚀 <b>Duel FoloTete</b></span>
  <span id="stat">HP: 5 • Ennemis: 5</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "folotete";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let keys = {}, hero = {}, units = [], bullets = [], eBullets = [], cd = 0, mcd = 0, timeLeft = 40, score = 0, won = false, over = false, mx = 256, my = 120, mDown = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("contextmenu", (e) => { e.preventDefault(); fireMissile(); });
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width); my = (e.clientY - r.top) * (512 / r.height);
});
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  if (e.button === 2) { fireMissile(); return; }
  mDown = true;
});
window.addEventListener("pointerup", () => { mDown = false; });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  const cnt = Number(custom.unitCount) || 5;
  timeLeft = Number(custom.durationSec) || 40;
  hero = { x: 256, y: 256, a: -Math.PI / 2, hp: 5 };
  bullets = []; eBullets = []; cd = 0; mcd = 0; score = 0; won = false; over = false;
  units = Array.from({ length: cnt }, (_, i) => ({
    x: 60 + ((i * 97) % 392), y: 60 + ((i * 71) % 160), a: Math.random() * Math.PI * 2, hp: 4, fireCd: 1 + Math.random() * 1.5
  }));
}

function fireMissile() {
  if (over || mcd > 0) return;
  mcd = 0.65;
  bullets.push({ x: hero.x, y: hero.y, a: hero.a, spd: 260, homing: true, dmg: 2, life: 2.5 });
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    cd = Math.max(0, cd - dt); mcd = Math.max(0, mcd - dt);
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) hero.a -= 4.2 * dt;
    if (keys.ArrowRight || keys.KeyD) hero.a += 4.2 * dt;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) { hero.x += Math.cos(hero.a) * 195 * dt; hero.y += Math.sin(hero.a) * 195 * dt; }
    else if (keys.ArrowDown || keys.KeyS) { hero.x -= Math.cos(hero.a) * 120 * dt; hero.y -= Math.sin(hero.a) * 120 * dt; }
    else if (mDown) {
      hero.a = Math.atan2(my - hero.y, mx - hero.x);
      if (Math.hypot(mx - hero.x, my - hero.y) > 40) { hero.x += Math.cos(hero.a) * 165 * dt; hero.y += Math.sin(hero.a) * 165 * dt; }
    }
    hero.x = Math.max(16, Math.min(496, hero.x)); hero.y = Math.max(16, Math.min(496, hero.y));
    if ((keys.Space || mDown) && cd <= 0) {
      cd = 0.14;
      bullets.push({ x: hero.x, y: hero.y, a: hero.a, spd: 370, homing: false, dmg: 1, life: 1.5 });
    }
    if (keys.ShiftLeft || keys.ShiftRight) fireMissile();

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.life -= dt;
      if (b.homing && units.length > 0) {
        let best = units[0], bd = 9999;
        for (const u of units) { const d = Math.hypot(u.x - b.x, u.y - b.y); if (d < bd) { bd = d; best = u; } }
        const targetA = Math.atan2(best.y - b.y, best.x - b.x);
        let diff = targetA - b.a; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
        b.a += Math.max(-6 * dt, Math.min(6 * dt, diff));
      }
      b.x += Math.cos(b.a) * b.spd * dt; b.y += Math.sin(b.a) * b.spd * dt;
      let hit = false;
      for (let j = units.length - 1; j >= 0; j--) {
        if (Math.hypot(units[j].x - b.x, units[j].y - b.y) < 16) {
          units[j].hp -= b.dmg; hit = true; score += 15;
          if (units[j].hp <= 0) { units.splice(j, 1); score += 50; }
          break;
        }
      }
      if (hit || b.life <= 0 || b.x < 0 || b.x > 512 || b.y < 0 || b.y > 512) bullets.splice(i, 1);
    }

    for (const u of units) {
      const targetA = Math.atan2(hero.y - u.y, hero.x - u.x);
      let diff = targetA - u.a; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
      u.a += Math.max(-3.2 * dt, Math.min(3.2 * dt, diff));
      const d = Math.hypot(hero.x - u.x, hero.y - u.y);
      const dir = d > 130 ? 1 : (d < 90 ? -1 : 0);
      u.x = Math.max(18, Math.min(494, u.x + Math.cos(u.a) * 115 * dir * dt));
      u.y = Math.max(18, Math.min(494, u.y + Math.sin(u.a) * 115 * dir * dt));
      u.fireCd -= dt;
      if (u.fireCd <= 0) {
        u.fireCd = 1.6 + Math.random();
        eBullets.push({ x: u.x, y: u.y, a: u.a, spd: 185, life: 2.5 });
      }
    }
    for (let i = eBullets.length - 1; i >= 0; i--) {
      const eb = eBullets[i]; eb.life -= dt;
      eb.x += Math.cos(eb.a) * eb.spd * dt; eb.y += Math.sin(eb.a) * eb.spd * dt;
      if (Math.hypot(eb.x - hero.x, eb.y - hero.y) < 14) {
        hero.hp--; eBullets.splice(i, 1);
        if (hero.hp <= 0) { over = true; won = false; }
      } else if (eb.life <= 0) eBullets.splice(i, 1);
    }
    if (units.length === 0) { won = true; over = true; score += Math.round(timeLeft * 5); }
  }
  document.getElementById("stat").textContent = `HP: ${hero.hp} • Ennemis: ${units.length} • ${Math.ceil(timeLeft)}s`;
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  for (const u of units) {
    ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(u.a);
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fillStyle = "#f87171"; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, 0); ctx.stroke();
    ctx.restore();
  }
  for (const b of bullets) { ctx.fillStyle = b.homing ? "#fde047" : "#38d6ff"; ctx.beginPath(); ctx.arc(b.x, b.y, b.homing ? 4 : 2.5, 0, Math.PI * 2); ctx.fill(); }
  for (const eb of eBullets) { ctx.fillStyle = "#fb7185"; ctx.beginPath(); ctx.arc(eb.x, eb.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.save(); ctx.translate(hero.x, hero.y); ctx.rotate(hero.a);
  ctx.fillStyle = "#38d6ff"; ctx.fillRect(-10, -10, 20, 20);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.stroke();
  ctx.restore();
  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "ESCARMOUCHE GAGNÉE !" : "COQUE DÉTRUITE", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
