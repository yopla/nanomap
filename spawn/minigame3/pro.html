<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Équilibre Trophique (Pro)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pro",
  "name": "Équilibre Trophique (Pro)",
  "family": "zooEcosys",
  "icon": "🌿",
  "controls": "Glisser les 3 curseurs en haut (ou 1/2/3 + Gauche/Droite) pour réguler les taux ; Cliquer dans l'arène pour semer",
  "description": "Simulation proies-prédateurs : plantes, herbivores et carnassiers cohabitent selon leurs taux de reproduction.",
  "goal": "Maintenir les 3 espèces en vie jusqu'à la fin du chrono sans extinction.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🌿 <b>Équilibre Pro</b></span>
  <span id="stat">🌿180 • 🔵42 • 🔺10 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pro";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const HUD_H = 66;
const PLANT_MAX = 360, HERB_MAX = 240, PRED_MAX = 140;
const PRED_FILL = 210, PRED_STARV = 120;
const HERB_FILL = 200, HERB_STARV = 150;

let plants = [], herbivores = [], predators = [];
let rates = [55, 50, 48]; // 0..100 slider values (plant, herb, pred)
let selSlider = 0, dragSlider = -1, seedCd = 0;
let keys = {}, timeLeft = 45, score = 0, won = false, over = false, endReason = "", tickAcc = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "Digit1") selSlider = 0;
  if (e.code === "Digit2") selSlider = 1;
  if (e.code === "Digit3") selSlider = 2;
  if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "KeyZ") selSlider = (selSlider + 2) % 3;
  if (e.code === "ArrowDown" || e.code === "KeyS") selSlider = (selSlider + 1) % 3;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
function updateSliderFromX(idx, x) {
  const v = Math.max(5, Math.min(98, ((x - 78) / 140) * 100));
  rates[idx] = Math.round(v);
}
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pos = getPos(e);
  if (pos.y < HUD_H) {
    const idx = Math.min(2, Math.floor((pos.y - 6) / 20));
    if (idx >= 0 && pos.x >= 68 && pos.x <= 228) {
      selSlider = idx; dragSlider = idx; updateSliderFromX(idx, pos.x);
    }
  } else if (seedCd <= 0 && plants.length < PLANT_MAX) {
    for (let i = 0; i < 4; i++) {
      plants.push(makePlant(pos.x + (Math.random() - 0.5) * 28, pos.y + (Math.random() - 0.5) * 28));
    }
    seedCd = 0.6;
  }
});
cv.addEventListener("pointermove", (e) => {
  if (dragSlider >= 0) { const pos = getPos(e); updateSliderFromX(dragSlider, pos.x); }
});
window.addEventListener("pointerup", () => { dragSlider = -1; });

function wrapX(x) { return ((x % 512) + 512) % 512; }
function wrapY(y) { const h = 512 - HUD_H; return HUD_H + ((((y - HUD_H) % h) + h) % h); }
function normAngle(r) {
  while (r > Math.PI) r -= Math.PI * 2;
  while (r < -Math.PI) r += Math.PI * 2;
  return r;
}
function toRate(v) { return v >= 50 ? (150 - v) / 100 : (100 - v) / 50; }

function makePlant(x, y) {
  return {
    x: wrapX(x), y: wrapY(y), count: 0, dead: false,
    countMax: 380 + Math.random() * 300,
    multInt: 180 + Math.random() * 180
  };
}
function makeHerb(x, y) {
  return {
    x: wrapX(x), y: wrapY(y),
    angle: Math.random() * Math.PI * 2,
    spd: 1.0 + Math.random() * 1.1,
    count: 0, dead: false, target: null,
    countMax: 420 + Math.random() * 380,
    fill: Math.random() * HERB_FILL,
    multInt: 190 + Math.random() * 150
  };
}
function makePred(x, y) {
  return {
    x: wrapX(x), y: wrapY(y),
    angle: Math.random() * Math.PI * 2,
    spd: 1.9 + Math.random() * 1.6,
    count: 0, target: null,
    countMax: 500 + Math.random() * 480,
    fill: 40 + Math.random() * PRED_FILL,
    multInt: 210 + Math.random() * 180
  };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  plants = []; herbivores = []; predators = [];
  rates = [55, 50, 48]; selSlider = 0; dragSlider = -1; seedCd = 0;
  score = 0; won = false; over = false; endReason = ""; tickAcc = 0;
  for (let i = 0; i < 180; i++) plants.push(makePlant(Math.random() * 512, HUD_H + Math.random() * (512 - HUD_H)));
  for (let i = 0; i < 42; i++) herbivores.push(makeHerb(Math.random() * 512, HUD_H + Math.random() * (512 - HUD_H)));
  for (let i = 0; i < 10; i++) predators.push(makePred(Math.random() * 512, HUD_H + Math.random() * (512 - HUD_H)));
}

function simTick() {
  // Plants
  for (let i = plants.length - 1; i >= 0; i--) {
    const p = plants[i];
    p.count++;
    if (p.count >= p.countMax) { p.dead = true; plants.splice(i, 1); }
  }
  // Herbivores
  for (let i = herbivores.length - 1; i >= 0; i--) {
    const h = herbivores[i];
    h.count++; h.fill--;
    if (!h.target) {
      for (let j = 0; j < plants.length; j++) {
        if (Math.hypot(h.x - plants[j].x, h.y - plants[j].y) < 58) { h.target = plants[j]; break; }
      }
    }
    if (h.target && h.target.dead) h.target = null;
    if (h.target && h.fill <= 0 && Math.hypot(h.x - h.target.x, h.y - h.target.y) <= 11) {
      h.target.dead = true;
      const idx = plants.indexOf(h.target);
      if (idx >= 0) plants.splice(idx, 1);
      h.target = null; h.fill = HERB_FILL;
    }
    if (h.target && Math.hypot(h.x - h.target.x, h.y - h.target.y) > 360) h.target = null;
    if (h.target) {
      const toT = Math.atan2(h.target.y - h.y, h.target.x - h.x);
      const r = normAngle(toT - h.angle);
      h.angle += Math.max(-0.12, Math.min(0.12, r));
    }
    h.x = wrapX(h.x + Math.cos(h.angle) * h.spd);
    h.y = wrapY(h.y + Math.sin(h.angle) * h.spd);
    if (h.count >= h.countMax || h.fill < -HERB_STARV) { h.dead = true; herbivores.splice(i, 1); }
  }
  // Predators
  for (let i = predators.length - 1; i >= 0; i--) {
    const pr = predators[i];
    pr.count++; pr.fill--;
    if (!pr.target && pr.fill <= 0) {
      for (let j = 0; j < herbivores.length; j++) {
        if (Math.hypot(pr.x - herbivores[j].x, pr.y - herbivores[j].y) < 68) { pr.target = herbivores[j]; break; }
      }
    }
    if (pr.target && pr.target.dead) pr.target = null;
    if (pr.target && Math.hypot(pr.x - pr.target.x, pr.y - pr.target.y) <= 11) {
      pr.target.dead = true;
      const idx = herbivores.indexOf(pr.target);
      if (idx >= 0) herbivores.splice(idx, 1);
      pr.target = null; pr.fill = PRED_FILL;
    }
    if (pr.target && Math.hypot(pr.x - pr.target.x, pr.y - pr.target.y) > 360) pr.target = null;
    if (pr.target) {
      const toT = Math.atan2(pr.target.y - pr.y, pr.target.x - pr.x);
      const r = normAngle(toT - pr.angle);
      pr.angle += Math.max(-0.12, Math.min(0.12, r));
    }
    pr.x = wrapX(pr.x + Math.cos(pr.angle) * pr.spd);
    pr.y = wrapY(pr.y + Math.sin(pr.angle) * pr.spd);
    if (pr.count >= pr.countMax || pr.fill < -PRED_STARV) predators.splice(i, 1);
  }

  // Multiply using toRate
  const rP = toRate(rates[0]), rH = toRate(rates[1]), rPr = toRate(rates[2]);
  if (plants.length < PLANT_MAX) {
    const add = [];
    for (const p of plants) {
      const t = Math.max(18, Math.floor(p.multInt * rP));
      if (p.count % t === 0 && plants.length + add.length < PLANT_MAX) {
        add.push(makePlant(p.x + Math.random() * 60 - 30, p.y + Math.random() * 60 - 30));
      }
    }
    for (const n of add) plants.push(n);
  }
  if (herbivores.length < HERB_MAX) {
    const add = [];
    for (const h of herbivores) {
      const t = Math.max(24, Math.floor(h.multInt * rH));
      if (h.fill > 0 && h.count % t === 0 && herbivores.length + add.length < HERB_MAX) {
        add.push(makeHerb(h.x + Math.random() * 20 - 10, h.y + Math.random() * 20 - 10));
      }
    }
    for (const n of add) herbivores.push(n);
  }
  if (predators.length < PRED_MAX) {
    const add = [];
    for (const pr of predators) {
      const t = Math.max(30, Math.floor(pr.multInt * rPr));
      if (pr.fill > 0 && pr.count % t === 0 && predators.length + add.length < PRED_MAX) {
        add.push(makePred(pr.x + Math.random() * 20 - 10, pr.y + Math.random() * 20 - 10));
      }
    }
    for (const n of add) predators.push(n);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (seedCd > 0) seedCd -= dt;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) rates[selSlider] = Math.max(5, rates[selSlider] - 55 * dt);
    if (keys.ArrowRight || keys.KeyD) rates[selSlider] = Math.min(98, rates[selSlider] + 55 * dt);

    tickAcc += dt * 60;
    while (tickAcc >= 1) { simTick(); tickAcc -= 1; }

    score += dt * (plants.length > 20 && herbivores.length > 8 && predators.length > 3 ? 12 : 5);

    if (plants.length === 0) { won = false; over = true; endReason = "EXTINCTION DES PLANTES"; }
    else if (herbivores.length === 0) { won = false; over = true; endReason = "EXTINCTION DES HERBIVORES"; }
    else if (predators.length === 0) { won = false; over = true; endReason = "EXTINCTION DES PRÉDATEURS"; }
    else if (timeLeft <= 0) {
      won = true; over = true;
      score += Math.round((plants.length + herbivores.length * 2 + predators.length * 4));
      endReason = "ÉCOSYSTÈME ÉQUILIBRÉ !";
    }
  }

  document.getElementById("stat").textContent = `🌿${plants.length} • 🔵${herbivores.length} • 🔺${predators.length} • ${Math.ceil(timeLeft)}s`;

  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Draw Plants
  ctx.fillStyle = "rgba(74,222,128,0.65)";
  for (const p of plants) ctx.fillRect(p.x - 3, p.y - 3, 6, 6);

  // Draw Herbivores
  ctx.fillStyle = "#38d6ff";
  for (const h of herbivores) {
    const r = 3.5 + (h.fill > 0 ? (h.fill / HERB_FILL) * 2.5 : 0);
    ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Draw Predators
  ctx.fillStyle = "#f87171";
  for (const pr of predators) {
    const sc = 1 + (pr.fill > 0 ? (pr.fill / PRED_FILL) * 0.65 : 0);
    ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.angle); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -4.5); ctx.lineTo(-5, 4.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Top HUD: 3 sliders + 3 live population bars (faithful to pro.as)
  ctx.fillStyle = "#101829"; ctx.fillRect(0, 0, 512, HUD_H);
  ctx.strokeStyle = "#2d5b7b"; ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(512, HUD_H); ctx.stroke();

  const meta = [
    { label: "🌿 Pl.", col: "#4ade80", val: plants.length, max: PLANT_MAX },
    { label: "🔵 He.", col: "#38d6ff", val: herbivores.length, max: HERB_MAX },
    { label: "🔺 Pr.", col: "#f87171", val: predators.length, max: PRED_MAX }
  ];
  ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  for (let i = 0; i < 3; i++) {
    const y = 8 + i * 20;
    ctx.fillStyle = selSlider === i ? "#ffffff" : "#94a3b8";
    ctx.fillText(meta[i].label, 8, y + 11);
    // Slider track
    ctx.fillStyle = "#1e293b"; ctx.fillRect(78, y + 4, 140, 6);
    const kx = 78 + (rates[i] / 100) * 140;
    ctx.fillStyle = meta[i].col; ctx.fillRect(78, y + 4, kx - 78, 6);
    ctx.fillStyle = selSlider === i ? "#ffffff" : meta[i].col;
    ctx.fillRect(kx - 4, y + 1, 8, 12);
    // Population bar
    ctx.fillStyle = "#1e293b"; ctx.fillRect(232, y + 2, 268, 11);
    ctx.fillStyle = meta[i].col;
    ctx.fillRect(232, y + 2, Math.min(268, (meta[i].val / meta[i].max) * 268), 11);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(endReason, 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${Math.round(score)} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
