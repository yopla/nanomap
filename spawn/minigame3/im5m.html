<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Champ de Perception (im5M)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "im5m",
  "name": "Champ de Perception (im5M)",
  "family": "income",
  "icon": "👁️",
  "controls": "Souris/doigt ou Flèches/ZQSD pour déplacer la sonde (clic/toucher ou survol pour capter)",
  "description": "Propagation directionnelle de perception sur grille 32×32 à travers un labyrinthe de piliers.",
  "goal": "Révéler et capter les 8 balises cachées avant la fin du temps, sans heurter les drones.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>👁️ <b>Perception im5M</b></span>
  <span id="stat">Balises: 0/8 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "im5m";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MW = 32, MH = 32, CW = 16, CH = 16;
const vecGrid = new Int32Array(MW * MH);
const vecTest = new Int32Array(MW * MH);
const vecNode = Array.from({ length: 4096 }, () => ({ tx: 0, ty: 0, prev: 0, d: 0 }));
let curTest = 1;

let keys = {}, probe = { x: 256, y: 256 }, beacons = [], drones = [], ripples = [];
let timeLeft = 45, score = 0, won = false, over = false, hurtFlash = 0, droneTimer = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function pointerToCanvas(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(511, (e.clientX - r.left) * (512 / r.width))),
    y: Math.max(0, Math.min(511, (e.clientY - r.top) * (512 / r.height)))
  };
}

cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const pt = pointerToCanvas(e);
  probe.x = pt.x; probe.y = pt.y;
  tryCaptureAt(Math.floor(pt.x / CW), Math.floor(pt.y / CH), true);
});
cv.addEventListener("pointermove", (e) => {
  if (over) return;
  const pt = pointerToCanvas(e);
  probe.x = pt.x; probe.y = pt.y;
});

function setTile(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  vecGrid[ay * MW + ax] = t;
}
function getTile(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return 1;
  return vecGrid[ay * MW + ax];
}
function setTest(ax, ay, t) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  vecTest[ay * MW + ax] = t;
}
function getTest(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return curTest;
  return vecTest[ay * MW + ax];
}

function randomFreeCell(minDistFromCenter = 0) {
  for (let tries = 0; tries < 500; tries++) {
    const x = 1 + Math.floor(Math.random() * (MW - 2));
    const y = 1 + Math.floor(Math.random() * (MH - 2));
    if (getTile(x, y) !== 0) continue;
    if (Math.hypot(x - 16, y - 16) < minDistFromCenter) continue;
    if (beacons.some(b => b.tx === x && b.ty === y)) continue;
    return { tx: x, ty: y };
  }
  return { tx: 2, ty: 2 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  score = 0; won = false; over = false; hurtFlash = 0; droneTimer = 0;
  probe = { x: 256, y: 256 };
  ripples = [];
  vecGrid.fill(0);
  vecTest.fill(0);
  curTest = 1;

  // Faithful 256 random obstacle tiles (leaving center spawn clear)
  for (let i = 0; i < 256; i++) {
    const rx = Math.floor(Math.random() * MW);
    const ry = Math.floor(Math.random() * MH);
    if (Math.abs(rx - 16) <= 1 && Math.abs(ry - 16) <= 1) continue;
    setTile(rx, ry, 1);
  }

  beacons = [];
  for (let i = 0; i < 8; i++) {
    const c = randomFreeCell(4);
    beacons.push({ tx: c.tx, ty: c.ty, done: false, seen: false });
  }

  drones = [];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let i = 0; i < 3; i++) {
    const c = randomFreeCell(8);
    const d = dirs[Math.floor(Math.random() * 4)];
    drones.push({ tx: c.tx, ty: c.ty, dx: d[0], dy: d[1], cd: 0 });
  }
}

// Faithful directional flood-fill perception from im5M.as
function floodZone(ax, ay) {
  const sx = Math.floor(ax / CW);
  const sy = Math.floor(ay / CH);
  if (getTile(sx, sy) > 0) return { sx, sy, blocked: true };

  let a = vecNode[0];
  a.tx = sx; a.ty = sy; a.d = 16; a.prev = 0;

  curTest += 1;
  if (curTest > 1000000) { vecTest.fill(0); curTest = 1; }
  setTest(sx, sy, curTest);
  let it = 1;

  while (it > 0) {
    it -= 1;
    a = vecNode[it];
    const tx = a.tx, ty = a.ty, prev = a.prev;
    const d = a.d - 1;
    if (d <= 0) continue;

    const alpha = 0.08 + (d / 16) * 0.28;
    ctx.fillStyle = `rgba(56, 214, 255, ${alpha.toFixed(3)})`;
    ctx.fillRect(tx * CW, ty * CH, CW, CH);

    if (it >= 4090) continue;

    if ((prev & 2) === 0 && getTile(tx + 1, ty) <= 0 && getTest(tx + 1, ty) !== curTest) {
      const b = vecNode[it++]; b.d = d; b.tx = tx + 1; b.ty = ty; b.prev = prev | 1; setTest(tx + 1, ty, curTest);
    }
    if ((prev & 1) === 0 && getTile(tx - 1, ty) <= 0 && getTest(tx - 1, ty) !== curTest) {
      const b = vecNode[it++]; b.d = d; b.tx = tx - 1; b.ty = ty; b.prev = prev | 2; setTest(tx - 1, ty, curTest);
    }
    if ((prev & 8) === 0 && getTile(tx, ty + 1) <= 0 && getTest(tx, ty + 1) !== curTest) {
      const b = vecNode[it++]; b.d = d; b.tx = tx; b.ty = ty + 1; b.prev = prev | 4; setTest(tx, ty + 1, curTest);
    }
    if ((prev & 4) === 0 && getTile(tx, ty - 1) <= 0 && getTest(tx, ty - 1) !== curTest) {
      const b = vecNode[it++]; b.d = d; b.tx = tx; b.ty = ty - 1; b.prev = prev | 8; setTest(tx, ty - 1, curTest);
    }
  }
  return { sx, sy, blocked: false };
}

function tryCaptureAt(tx, ty, clicked) {
  for (const b of beacons) {
    if (b.done) continue;
    const dist = Math.hypot(b.tx - tx, b.ty - ty);
    if ((clicked && dist <= 1.6 && getTest(b.tx, b.ty) === curTest) || dist <= 0.8) {
      b.done = true;
      score += 50;
      ripples.push({ x: (b.tx + 0.5) * CW, y: (b.ty + 0.5) * CH, r: 6, life: 1, col: "#4ade80" });
      if (beacons.every(x => x.done)) {
        won = true; over = true;
        score += Math.round(timeLeft * 6);
      }
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const spd = 230;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.5);

    let vx = 0, vy = 0;
    if (keys.ArrowLeft || keys.KeyA || keys.KeyQ) vx -= 1;
    if (keys.ArrowRight || keys.KeyD) vx += 1;
    if (keys.ArrowUp || keys.KeyW || keys.KeyZ) vy -= 1;
    if (keys.ArrowDown || keys.KeyS) vy += 1;
    if (vx || vy) {
      const len = Math.hypot(vx, vy);
      probe.x = Math.max(0, Math.min(511, probe.x + (vx / len) * spd * dt));
      probe.y = Math.max(0, Math.min(511, probe.y + (vy / len) * spd * dt));
    }

    droneTimer += dt;
    if (droneTimer >= 0.28) {
      droneTimer = 0;
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const dr of drones) {
        if (dr.cd > 0) dr.cd--;
        let nx = dr.tx + dr.dx, ny = dr.ty + dr.dy;
        if (getTile(nx, ny) > 0 || Math.random() < 0.25) {
          const valid = dirs.filter(d => getTile(dr.tx + d[0], dr.ty + d[1]) === 0);
          if (valid.length) {
            const pick = valid[Math.floor(Math.random() * valid.length)];
            dr.dx = pick[0]; dr.dy = pick[1];
            nx = dr.tx + dr.dx; ny = dr.ty + dr.dy;
          } else { nx = dr.tx; ny = dr.ty; }
        }
        dr.tx = nx; dr.ty = ny;
      }
    }
  }

  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle grid lines
  ctx.strokeStyle = "rgba(45, 91, 123, 0.16)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 512; i += CW) {
    ctx.moveTo(i, 0); ctx.lineTo(i, 512);
    ctx.moveTo(0, i); ctx.lineTo(512, i);
  }
  ctx.stroke();

  // Flood-fill perception cone
  const res = floodZone(probe.x, probe.y);

  // Check beacon capture & drone collision using current perception
  if (!over && !res.blocked) {
    tryCaptureAt(res.sx, res.sy, false);
    for (const dr of drones) {
      if (dr.cd <= 0 && dr.tx === res.sx && dr.ty === res.sy) {
        dr.cd = 6;
        timeLeft = Math.max(0, timeLeft - 4);
        hurtFlash = 1;
        ripples.push({ x: (dr.tx + 0.5) * CW, y: (dr.ty + 0.5) * CH, r: 8, life: 1, col: "#f87171" });
      }
    }
  }

  // Draw wall tiles
  for (let i = 0; i < MH; i++) {
    const yt = i * MW;
    for (let k = 0; k < MW; k++) {
      if (vecGrid[yt + k] <= 0) continue;
      const dx = k * CW, dy = i * CH;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(dx + 1, dy + 1, CW - 2, CH - 2);
      ctx.strokeStyle = "#334155";
      ctx.strokeRect(dx + 0.5, dy + 0.5, CW - 1, CH - 1);
    }
  }

  // Draw beacons (only clearly visible inside perception field; faint echo if previously seen)
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.008);
  for (const b of beacons) {
    if (b.done) continue;
    const inSight = !res.blocked && getTest(b.tx, b.ty) === curTest;
    if (inSight) b.seen = true;
    const cx = (b.tx + 0.5) * CW, cy = (b.ty + 0.5) * CH;
    if (inSight) {
      ctx.fillStyle = "rgba(253, 224, 71, 0.28)";
      ctx.beginPath(); ctx.arc(cx, cy, 8 + pulse * 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
    } else if (b.seen) {
      ctx.strokeStyle = "rgba(253, 224, 71, 0.35)";
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Draw patrolling interference drones (visible only in perception field)
  for (const dr of drones) {
    const inSight = !res.blocked && getTest(dr.tx, dr.ty) === curTest;
    if (!inSight) continue;
    const cx = (dr.tx + 0.5) * CW, cy = (dr.ty + 0.5) * CH;
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.moveTo(cx, cy - 6); ctx.lineTo(cx + 6, cy); ctx.lineTo(cx, cy + 6); ctx.lineTo(cx - 6, cy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fecdd3"; ctx.stroke();
  }

  // Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += dt * 75; rp.life -= dt * 2;
    if (rp.life <= 0) { ripples.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = rp.life;
    ctx.strokeStyle = rp.col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Cursor / probe tile highlight
  ctx.strokeStyle = res.blocked ? "#f87171" : "#38d6ff";
  ctx.lineWidth = 2.5;
  ctx.strokeRect(res.sx * CW + 1, res.sy * CH + 1, CW - 2, CH - 2);

  if (hurtFlash > 0) {
    ctx.fillStyle = `rgba(248, 113, 113, ${(hurtFlash * 0.28).toFixed(3)})`;
    ctx.fillRect(0, 0, 512, 512);
  }

  const doneN = beacons.filter(b => b.done).length;
  document.getElementById("stat").textContent = `Balises: ${doneN}/${beacons.length} • Score: ${score} • ${Math.ceil(timeLeft)}s`;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "TOUTES LES BALISES CAPTÉES !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
