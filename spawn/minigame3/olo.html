<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Berger Olo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "olo",
  "name": "Berger Olo",
  "family": "topMouseMut",
  "icon": "🧲",
  "controls": "Souris, doigt ou flèches/ZQSD pour attirer de loin (>140px) et repousser de près (<140px)",
  "description": "Un essaim de 16 drones carrés-cercles est attiré à distance par votre curseur mais fuit lorsqu'il s'approche, en se bloquant mutuellement.",
  "goal": "Rabattre 10 drones dans l'enclos vert avant la fin du temps !",
  "fields": [
    { "key": "targetCount", "label": "Drones à parquer", "type": "number", "default": 10 }
  ]
}
</script>
<div class="bar">
  <span>🧲 <b>Berger Olo</b></span>
  <span id="stat">Parqués: 0/10 • 42s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "olo";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const REPEL_R = 140;
const CORRAL = { x: 356, y: 24, w: 132, h: 132 };
let mouse = { x: 140, y: 360 };
let keys = {};
let rects = [], captured = 0, targetCount = 10, timeLeft = 42, score = 0, won = false, over = false, gt = 0, flash = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = Math.max(0, Math.min(512, (e.clientX - r.left) * (512 / r.width)));
  mouse.y = Math.max(0, Math.min(512, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } setM(e); });
window.addEventListener("keydown", (e) => { keys[e.code] = true; if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score); });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function isInside(ax, ay, b) {
  return !(ax < b.cx - b.xrad || ax > b.cx + b.xrad || ay < b.cy - b.xrad || ay > b.cy + b.xrad);
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Math.max(1, Math.min(16, Number(custom.targetCount) || 10));
  timeLeft = 42; score = 0; captured = 0; won = false; over = false; gt = 0; flash = 0;
  mouse = { x: 140, y: 360 };
  rects = [];
  for (let i = 0; i < 16; i++) {
    const t = i * 0.4;
    rects.push({
      cx: 230 + Math.cos(t) * 145,
      cy: 290 + Math.sin(t) * 145,
      xrad: 16,
      ang: Math.random() * Math.PI * 2,
      fleeing: false,
      done: false
    });
  }
}

let last = performance.now(), acc = 0;
function stepFixed() {
  const mx = mouse.x, my = mouse.y;
  const num = rects.length;
  for (let i = 0; i < num; i++) {
    const a = rects[i];
    if (a.done) continue;

    if ((gt + i) % 30 === 0) {
      const dist = Math.hypot(my - a.cy, mx - a.cx);
      if (dist > REPEL_R) {
        a.ang = Math.atan2(my - a.cy, mx - a.cx);
        a.fleeing = false;
      } else {
        a.ang = Math.atan2(my - a.cy, mx - a.cx) + Math.PI + (Math.random() - 0.5) * 0.9;
        a.fleeing = true;
      }
    }

    let vx = Math.cos(a.ang) * 3.4;
    let vy = Math.sin(a.ang) * 3.4;

    if (vx > 0 && a.cx > 512 - a.xrad) { vx *= -1; a.ang = Math.atan2(vy, vx); }
    else if (vx < 0 && a.cx < a.xrad) { vx *= -1; a.ang = Math.atan2(vy, vx); }
    if (vy > 0 && a.cy > 512 - a.xrad) { vy *= -1; a.ang = Math.atan2(vy, vx); }
    else if (vy < 0 && a.cy < a.xrad) { vy *= -1; a.ang = Math.atan2(vy, vx); }

    for (let k = 0; k < num; k++) {
      if (i === k || rects[k].done) continue;
      const b = rects[k];
      if (vx > 0 && isInside(a.cx + a.xrad, a.cy, b)) vx = 0;
      else if (vx < 0 && isInside(a.cx - a.xrad, a.cy, b)) vx = 0;
      if (vy > 0 && isInside(a.cx, a.cy + a.xrad, b)) vy = 0;
      else if (vy < 0 && isInside(a.cx, a.cy - a.xrad, b)) vy = 0;
    }

    a.cx = Math.max(a.xrad, Math.min(512 - a.xrad, a.cx + vx));
    a.cy = Math.max(a.xrad, Math.min(512 - a.xrad, a.cy + vy));

    if (a.cx > CORRAL.x + 12 && a.cx < CORRAL.x + CORRAL.w - 12 && a.cy > CORRAL.y + 12 && a.cy < CORRAL.y + CORRAL.h - 12) {
      a.done = true;
      captured++;
      score += 35;
      flash = 0.25;
      if (captured >= targetCount) {
        won = true;
        over = true;
        score += Math.round(timeLeft * 6);
      }
    }
  }
  gt++;
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    const spd = 290 * dt;
    if (keys.ArrowLeft || keys.KeyA) mouse.x = Math.max(0, mouse.x - spd);
    if (keys.ArrowRight || keys.KeyD) mouse.x = Math.min(512, mouse.x + spd);
    if (keys.ArrowUp || keys.KeyW) mouse.y = Math.max(0, mouse.y - spd);
    if (keys.ArrowDown || keys.KeyS) mouse.y = Math.min(512, mouse.y + spd);

    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    flash = Math.max(0, flash - dt);

    acc += dt;
    const step = 1 / 60;
    while (acc >= step && !over) {
      stepFixed();
      acc -= step;
    }
  }

  document.getElementById("stat").textContent = `Parqués: ${captured}/${targetCount} • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Corral zone
  ctx.fillStyle = flash > 0 ? "rgba(74,222,128,0.38)" : "rgba(74,222,128,0.14)";
  ctx.fillRect(CORRAL.x, CORRAL.y, CORRAL.w, CORRAL.h);
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.strokeRect(CORRAL.x, CORRAL.y, CORRAL.w, CORRAL.h);
  ctx.fillStyle = "#86efac";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("ENCLOS", CORRAL.x + CORRAL.w / 2, CORRAL.y + 18);

  // Repulsion / attraction threshold ring around cursor
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, REPEL_R, 0, Math.PI * 2);
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "rgba(56,214,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.setLineDash([]);

  // Drones (square + inscribed circle as in olo.as)
  for (const a of rects) {
    if (a.done) continue;
    const col = a.fleeing ? "#fb923c" : "#38d6ff";
    ctx.strokeStyle = col;
    ctx.fillStyle = a.fleeing ? "rgba(251,146,60,0.18)" : "rgba(56,214,255,0.16)";
    ctx.lineWidth = 2;
    ctx.fillRect(a.cx - a.xrad, a.cy - a.xrad, a.xrad * 2, a.xrad * 2);
    ctx.strokeRect(a.cx - a.xrad, a.cy - a.xrad, a.xrad * 2, a.xrad * 2);
    ctx.beginPath();
    ctx.arc(a.cx, a.cy, a.xrad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(a.cx, a.cy);
    ctx.lineTo(a.cx + Math.cos(a.ang) * 11, a.cy + Math.sin(a.ang) * 11);
    ctx.stroke();
  }

  // Cursor beacon
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(56,214,255,0.35)";
  ctx.fill();
  ctx.strokeStyle = "#e6f4ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ESSAIM PARQUÉ !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
