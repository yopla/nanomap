<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Bulldozer Pous</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "pous",
  "name": "Bulldozer Pous",
  "family": "topOrthoClav",
  "icon": "🚜",
  "controls": "Flèches / ZQSD (ou glisser au doigt/souris) pour pousser la masse de blocs",
  "description": "Résolution itérative de collisions en chaîne à travers une foule dense de petits blocs colorés.",
  "goal": "Pousser les 6 cubes dorés dans la baie verte en bas avant la fin du temps !",
  "fields": [
    { "key": "targetCount", "label": "Cubes dorés à livrer", "type": "number", "default": 6 }
  ]
}
</script>
<div class="bar">
  <span>🚜 <b>Bulldozer Pous</b></span>
  <span id="stat">Cubes: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "pous";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const BAY = { x: 156, y: 424, w: 200, h: 76 };
const COLORS = ["#38d6ff", "#818cf8", "#f472b6", "#34d399", "#fb923c", "#a78bfa", "#60a5fa"];

let agents = [], player = null, keys = {}, drag = null;
let delivered = 0, targetCount = 6, timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function getPt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointerdown", (e) => { if (over) { sendResultAndExit(won, score); return; } drag = getPt(e); });
cv.addEventListener("pointermove", (e) => { if (drag) drag = getPt(e); });
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (over && (e.code === "Space" || e.code === "Enter")) sendResultAndExit(won, score);
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetCount = Math.max(3, Math.min(10, Number(custom.targetCount) || 6));
  delivered = 0; timeLeft = 45; score = 0; won = false; over = false;
  agents = [];

  // Dense crowd of small 12x12 debris blocks (faithful to pous.as)
  for (let i = 0; i < 82; i++) {
    agents.push({
      x: 56 + Math.random() * 388,
      y: 72 + Math.random() * 255,
      w: 12, h: 12, vx: 0, vy: 0, mass: 1,
      col: COLORS[i % COLORS.length], kind: "debris", done: false
    });
  }

  // Golden cargo cubes embedded in the crowd
  for (let i = 0; i < targetCount; i++) {
    agents.push({
      x: 78 + (i / Math.max(1, targetCount - 1)) * 336 + (Math.random() - 0.5) * 18,
      y: 115 + (i % 2) * 95 + (Math.random() - 0.5) * 24,
      w: 18, h: 18, vx: 0, vy: 0, mass: 1.4,
      col: "#fde047", kind: "cargo", done: false
    });
  }

  // Two immovable infinite-mass guide rails (inspired by pous.as ground bar)
  agents.push({ x: 0, y: 410, w: 146, h: 18, vx: 0, vy: 0, mass: Infinity, col: "#334155", kind: "wall", done: false });
  agents.push({ x: 366, y: 410, w: 146, h: 18, vx: 0, vy: 0, mass: Infinity, col: "#334155", kind: "wall", done: false });

  // Player bulldozer (24x24)
  player = { x: 244, y: 24, w: 24, h: 24, vx: 0, vy: 0, mass: 3.5, col: "#38d6ff", kind: "player", done: false };
  agents.push(player);
}

function hitTest(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function pushPair(a, b) {
  if (!hitTest(a, b)) return;
  if (a.mass === Infinity && b.mass === Infinity) return;
  const acx = a.x + a.w * 0.5, acy = a.y + a.h * 0.5;
  const bcx = b.x + b.w * 0.5, bcy = b.y + b.h * 0.5;
  let dx = acx - bcx, dy = acy - bcy;
  let d = Math.hypot(dx, dy);
  if (d < 0.001) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy) || 1; }
  dx /= d; dy /= d;

  const ox = (a.w + b.w) * 0.5 - Math.abs(acx - bcx);
  const oy = (a.h + b.h) * 0.5 - Math.abs(acy - bcy);
  const sep = Math.min(ox, oy, 3.2);

  let aScale, bScale;
  if (a.mass === Infinity) { aScale = 0; bScale = 1; }
  else if (b.mass === Infinity) { aScale = 1; bScale = 0; }
  else {
    aScale = b.mass / (a.mass + b.mass);
    bScale = a.mass / (a.mass + b.mass);
  }
  a.x += dx * sep * aScale;
  a.y += dy * sep * aScale;
  b.x -= dx * sep * bScale;
  b.y -= dy * sep * bScale;
}

function stepFixed() {
  let vx = 0, vy = 0;
  if (keys.ArrowLeft || keys.KeyA) vx -= 4.6;
  if (keys.ArrowRight || keys.KeyD) vx += 4.6;
  if (keys.ArrowUp || keys.KeyW) vy -= 4.6;
  if (keys.ArrowDown || keys.KeyS) vy += 4.6;
  if (vx === 0 && vy === 0 && drag) {
    const dx = drag.x - (player.x + player.w * 0.5);
    const dy = drag.y - (player.y + player.h * 0.5);
    const d = Math.hypot(dx, dy);
    if (d > 6) { vx = (dx / d) * Math.min(4.6, d * 0.25); vy = (dy / d) * Math.min(4.6, d * 0.25); }
  }
  player.vx = vx; player.vy = vy;
  player.x += player.vx; player.y += player.vy;

  // Iterative constraint solver (8 iterations, faithful to pous.as)
  const n = agents.length;
  for (let iter = 0; iter < 8; iter++) {
    for (let i = 0; i < n; i++) {
      const a = agents[i];
      if (a.done) continue;
      for (let j = i + 1; j < n; j++) {
        const b = agents[j];
        if (b.done) continue;
        pushPair(a, b);
      }
      if (a.mass !== Infinity) {
        a.x = Math.max(4, Math.min(508 - a.w, a.x));
        a.y = Math.max(4, Math.min(508 - a.h, a.y));
      }
    }
  }

  for (const a of agents) {
    if (a.kind === "cargo" && !a.done) {
      const cx = a.x + a.w * 0.5, cy = a.y + a.h * 0.5;
      if (cx > BAY.x + 6 && cx < BAY.x + BAY.w - 6 && cy > BAY.y + 8 && cy < BAY.y + BAY.h) {
        a.done = true;
        delivered++;
        score += 45;
        if (delivered >= targetCount) {
          won = true; over = true; score += Math.round(timeLeft * 6);
        }
      }
    }
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    acc += dt;
    const step = 1 / 60;
    while (acc >= step && !over) {
      stepFixed();
      acc -= step;
    }
  }

  document.getElementById("stat").textContent = `Cubes: ${delivered}/${targetCount} • ${Math.ceil(timeLeft)}s • Score ${score}`;
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Extraction bay
  ctx.fillStyle = "rgba(74,222,128,0.16)";
  ctx.fillRect(BAY.x, BAY.y, BAY.w, BAY.h);
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.strokeRect(BAY.x, BAY.y, BAY.w, BAY.h);
  ctx.fillStyle = "#86efac";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("BAIE DE LIVRAISON", BAY.x + BAY.w / 2, BAY.y + BAY.h - 12);

  // Agents
  for (const a of agents) {
    if (a.done) continue;
    if (a.kind === "wall") {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.strokeRect(a.x, a.y, a.w, a.h);
    } else if (a.kind === "debris") {
      ctx.fillStyle = a.col + "aa";
      ctx.fillRect(a.x, a.y, a.w, a.h);
    } else if (a.kind === "cargo") {
      ctx.fillStyle = "#fde047";
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.strokeStyle = "#fef9c3";
      ctx.lineWidth = 2;
      ctx.strokeRect(a.x, a.y, a.w, a.h);
    } else if (a.kind === "player") {
      ctx.fillStyle = "rgba(56,214,255,0.35)";
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.strokeStyle = "#38d6ff";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(a.x, a.y, a.w, a.h);
    }
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "CARGAISON LIVRÉE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
