<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Fléau Élastique</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: crosshair; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diad",
  "name": "Fléau Élastique",
  "family": "topMouseHnS",
  "icon": "☄️",
  "controls": "Viser à la souris / doigt ; maintenir clic ou Espace pour avancer et projeter le fléau élastique",
  "description": "Portage du prototype AS3 diad : un fléau à ressort suit un point d'ancrage qui s'allonge de 32px à 128px lorsqu'on charge.",
  "goal": "Pulvérisez 18 drones hostiles avec le fléau avant la fin du chrono !",
  "fields": [
    { "key": "targetKills", "label": "Drones à détruire", "type": "number", "default": 18 }
  ]
}
</script>
<div class="bar">
  <span>☄️ <b>Fléau Élastique</b></span>
  <span id="stat">Drones: 0/18 • ❤️❤️❤️ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diad";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let mouse = { x: 320, y: 256 };
let mbutton = false, keyHold = false;
let cx = 256, cy = 256, ang = 0;
let gx = 288, gy = 256, vx = 0, vy = 0;
let trail = [], enemies = [], sparks = [];
let targetKills = 18, kills = 0, hp = 3, invuln = 0, spawnTimer = 0;
let timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (512 / r.width);
  mouse.y = (e.clientY - r.top) * (512 / r.height);
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
  mbutton = true;
});
window.addEventListener("pointerup", () => { mbutton = false; });
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); keyHold = true; } });
window.addEventListener("keyup", (e) => { if (e.code === "Space") keyHold = false; });

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x = 0, y = 0;
  if (side === 0) { x = Math.random() * 512; y = -16; }
  else if (side === 1) { x = 528; y = Math.random() * 512; }
  else if (side === 2) { x = Math.random() * 512; y = 528; }
  else { x = -16; y = Math.random() * 512; }
  const fast = Math.random() < 0.3;
  enemies.push({ x, y, r: fast ? 11 : 14, spd: fast ? 92 : 64, fast, hitFlash: 0 });
}

function addSparks(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 50 + Math.random() * 140;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.25, color });
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetKills = Math.max(5, Number(custom.targetKills) || 18);
  cx = 256; cy = 256; ang = 0;
  gx = 288; gy = 256; vx = 0; vy = 0;
  trail = []; enemies = []; sparks = [];
  kills = 0; hp = 3; invuln = 0; spawnTimer = 0.4;
  timeLeft = 45; score = 0; won = false; over = false;
  mbutton = false; keyHold = false;
  for (let i = 0; i < 3; i++) spawnEnemy();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    const active = mbutton || keyHold;
    ang = Math.atan2(mouse.y - cy, mouse.x - cx);
    if (active) {
      cx = Math.max(18, Math.min(494, cx + Math.cos(ang) * 3.1 * f));
      cy = Math.max(18, Math.min(494, cy + Math.sin(ang) * 3.1 * f));
    }

    // Faithful diad.as spring-flail physics: anchor extends 32px -> 128px on hold
    const ms = active ? 128 : 32;
    const ax = cx + Math.cos(ang) * ms;
    const ay = cy + Math.sin(ang) * ms;

    vx += (ax - gx) * 0.03 * f;
    vy += (ay - gy) * 0.03 * f;
    const damp = Math.pow(0.91, f);
    vx *= damp; vy *= damp;
    gx += vx * f + (ax - gx) * (1 - Math.pow(0.85, f));
    gy += vy * f + (ay - gy) * (1 - Math.pow(0.85, f));

    trail.push({ x: gx, y: gy });
    if (trail.length > 14) trail.shift();

    spawnTimer -= dt;
    if (spawnTimer <= 0 && enemies.length < 9) {
      spawnEnemy();
      spawnTimer = Math.max(0.55, 1.35 - kills * 0.03);
    }

    const flailSpd = Math.hypot(vx, vy);
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      const ea = Math.atan2(cy - en.y, cx - en.x);
      en.x += Math.cos(ea) * en.spd * dt;
      en.y += Math.sin(ea) * en.spd * dt;

      // Flail smash check
      if (Math.hypot(en.x - gx, en.y - gy) < en.r + 16) {
        kills++;
        const bonus = flailSpd > 6 ? 15 : 0;
        score += 30 + bonus;
        addSparks(en.x, en.y, bonus ? "#fde047" : "#38d6ff", 12);
        enemies.splice(i, 1);
        if (kills >= targetKills) {
          won = true; over = true;
          score += Math.round(timeLeft * 5) + hp * 40;
        }
        continue;
      }

      // Player core hit check
      if (invuln <= 0 && Math.hypot(en.x - cx, en.y - cy) < en.r + 11) {
        hp--;
        invuln = 1.1;
        addSparks(cx, cy, "#f87171", 16);
        enemies.splice(i, 1);
        if (hp <= 0) over = true;
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= 0.94; s.vy *= 0.94;
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  const hearts = "❤️".repeat(Math.max(0, hp)) + "🖤".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Drones: ${kills}/${targetKills} • ${hearts} • ${Math.ceil(timeLeft)}s • ${score} pts`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // Subtle grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)";
  ctx.lineWidth = 1;
  for (let g = 32; g < 512; g += 32) {
    ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
  }

  const active = mbutton || keyHold;
  const ms = active ? 128 : 32;
  const ax = cx + Math.cos(ang) * ms;
  const ay = cy + Math.sin(ang) * ms;

  // Tether line from player to flail
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(ax, ay, gx, gy);
  ctx.strokeStyle = active ? "rgba(253,224,71,0.55)" : "rgba(56,214,255,0.35)";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Anchor dot
  ctx.beginPath();
  ctx.arc(ax, ay, 4, 0, Math.PI * 2);
  ctx.fillStyle = active ? "#fde047" : "#38d6ff";
  ctx.fill();

  // Flail trail
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const ratio = (i + 1) / trail.length;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 4 + ratio * 9, 0, Math.PI * 2);
    ctx.fillStyle = active ? `rgba(253,224,71,${ratio * 0.28})` : `rgba(56,214,255,${ratio * 0.25})`;
    ctx.fill();
  }

  // Flail head (gx, gy)
  ctx.beginPath();
  ctx.arc(gx, gy, 14, 0, Math.PI * 2);
  ctx.fillStyle = active ? "#fde047" : "#38d6ff";
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Enemies
  for (const en of enemies) {
    ctx.beginPath();
    ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
    ctx.fillStyle = en.fast ? "#fb923c" : "#f43f5e";
    ctx.fill();
    ctx.strokeStyle = "#ffe4e6";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Sparks
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life * 2);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Player core (cx, cy)
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
    ctx.fillStyle = "#121a2b";
    ctx.fill();
    ctx.strokeStyle = "#38d6ff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * 14, cy + Math.sin(ang) * 14);
    ctx.strokeStyle = "#aef0ff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "ESSAIM PULVÉRISÉ !" : (hp <= 0 ? "COQUE DÉTRUITE" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
