<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Relais Vivant (Viv)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; cursor: crosshair; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "viv",
  "name": "Relais Vivant (Viv)",
  "family": "topMouseHnS",
  "icon": "📡",
  "controls": "Clic/Toucher pour déplacer l'éclaireur et activer les relais surlignés (ou Flèches/ZQSD + Espace)",
  "description": "Exploration vue de dessus point-and-click : approchez et cliquez sur chaque relais pour valider sa transmission.",
  "goal": "Décrypter les 5 relais d'équipage en évitant les drones patrouilleurs avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>📡 <b>Relais Viv</b></span>
  <span id="stat">Relais: 0/5 • ❤❤❤ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "viv";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const MESSAGES = [
  "RELAIS ALPHA : Bouclier secteur nord synchronisé.",
  "RELAIS BÊTA : Fréquence de secours verrouillée.",
  "RELAIS GAMMA : Télémétrie réacteur stabilisée.",
  "RELAIS DELTA : Balise orbitale calibrée.",
  "RELAIS OMÉGA : Canal principal rétabli !"
];

let keys = {}, cx = 256, cy = 256, gx = 256, gy = 256, mx = 256, my = 256;
let relays = [], drones = [], activePopup = null;
let timeLeft = 45, hp = 3, invuln = 0, score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if ((e.code === "Space" || e.code === "Enter") && !over) {
    if (activePopup) { closePopup(); }
    else { tryInteractNearest(); }
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (512 / r.width), y: (e.clientY - r.top) * (512 / r.height) };
}
cv.addEventListener("pointermove", (e) => {
  const p = getPos(e); mx = p.x; my = p.y;
});
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  const p = getPos(e); mx = p.x; my = p.y;
  // Faithful viv.as modal popup dismiss (state > 0 -> click closes)
  if (activePopup) {
    closePopup();
    return;
  }
  // Check if clicking a highlighted relay (dist to mouse < 32 and player within interaction reach 72px)
  for (const r of relays) {
    if (!r.done && Math.hypot(r.x - mx, r.y - my) < 32) {
      if (Math.hypot(r.x - cx, r.y - cy) < 76) {
        openPopup(r);
        return;
      } else {
        // Walk toward relay automatically
        gx = r.x; gy = r.y;
        return;
      }
    }
  }
  // Set waypoint (exact viv.as point-and-click movement)
  gx = Math.max(18, Math.min(494, mx));
  gy = Math.max(18, Math.min(494, my));
});

function tryInteractNearest() {
  for (const r of relays) {
    if (!r.done && Math.hypot(r.x - cx, r.y - cy) < 76) {
      openPopup(r);
      return;
    }
  }
}

function openPopup(relay) {
  relay.done = true;
  score += 60;
  activePopup = { title: `TRANSMISSION #${relay.id + 1}`, text: relay.msg };
}

function closePopup() {
  activePopup = null;
  if (relays.every(r => r.done)) {
    won = true; over = true;
    score += Math.round(timeLeft * 6) + hp * 30;
  }
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  cx = 256; cy = 256; gx = 256; gy = 256;
  hp = 3; invuln = 0; score = 0; won = false; over = false; activePopup = null;

  const coords = [
    [92, 92], [420, 96], [96, 420], [418, 416], [256, 78]
  ];
  relays = coords.map(([x, y], i) => ({
    id: i, x: x + (Math.random() * 24 - 12), y: y + (Math.random() * 24 - 12),
    done: false, msg: MESSAGES[i]
  }));

  drones = [
    { x: 160, y: 160, vx: 95, vy: 70, r: 11 },
    { x: 350, y: 170, vx: -85, vy: 90, r: 11 },
    { x: 256, y: 390, vx: 110, vy: -65, r: 11 }
  ];
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  animT += dt;

  // Faithful to viv.as: when dialogue/terminal overlay (state > 0) is open, world simulation pauses!
  if (!over && !activePopup) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Optional keyboard steering updates waypoint smoothly
    const kdx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || keys.KeyQ ? 1 : 0);
    const kdy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW || keys.KeyZ ? 1 : 0);
    if (kdx !== 0 || kdy !== 0) {
      const m = Math.hypot(kdx, kdy);
      cx = Math.max(16, Math.min(496, cx + (kdx / m) * 230 * dt));
      cy = Math.max(16, Math.min(496, cy + (kdy / m) * 230 * dt));
      gx = cx; gy = cy;
    } else {
      // Exact viv.as move-to-waypoint math
      const d = Math.hypot(gx - cx, gy - cy);
      const ms = Math.min(d, 235 * dt);
      if (d > 1) {
        const ta = Math.atan2(gy - cy, gx - cx);
        cx += Math.cos(ta) * ms;
        cy += Math.sin(ta) * ms;
      }
    }

    // Patrol drones
    for (const dr of drones) {
      dr.x += dr.vx * dt;
      dr.y += dr.vy * dt;
      if (dr.x < 24 || dr.x > 488) { dr.vx *= -1; dr.x = Math.max(24, Math.min(488, dr.x)); }
      if (dr.y < 24 || dr.y > 488) { dr.vy *= -1; dr.y = Math.max(24, Math.min(488, dr.y)); }
      if (invuln <= 0 && Math.hypot(cx - dr.x, cy - dr.y) < dr.r + 10) {
        hp--; invuln = 1.2;
        const a = Math.atan2(cy - dr.y, cx - dr.x);
        gx = cx = Math.max(20, Math.min(492, cx + Math.cos(a) * 28));
        gy = cy = Math.max(20, Math.min(492, cy + Math.sin(a) * 28));
        if (hp <= 0) { over = true; won = false; }
      }
    }
  }

  const doneN = relays.filter(r => r.done).length;
  document.getElementById("stat").textContent = `Relais: ${doneN}/${relays.length} • ${"❤".repeat(Math.max(0, hp))} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  // Tactical floor grid
  ctx.strokeStyle = "rgba(56,214,255,0.07)"; ctx.lineWidth = 1;
  for (let i = 32; i < 512; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }

  // Waypoint marker (from viv.as)
  const distGoal = Math.hypot(gx - cx, gy - cy);
  if (distGoal > 6 && !activePopup && !over) {
    ctx.strokeStyle = "rgba(56,214,255,0.5)"; ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(gx, gy, 5, 0, Math.PI * 2); ctx.stroke();
  }

  // Relays with viv.as hover & reach ring
  for (const r of relays) {
    const hovered = !r.done && Math.hypot(r.x - mx, r.y - my) < 32;
    const inReach = !r.done && Math.hypot(r.x - cx, r.y - cy) < 76;
    if (hovered || inReach) {
      ctx.strokeStyle = inReach ? "#4ade80" : "#fde047";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 18 + Math.sin(animT * 7) * 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = r.done ? "#4ade80" : "#fde047";
    ctx.beginPath(); ctx.arc(r.x, r.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
    if (inReach && !activePopup) {
      ctx.fillStyle = "#4ade80"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("CLIC / ESPACE", r.x, r.y - 24);
    }
  }

  // Patrol drones
  for (const dr of drones) {
    ctx.fillStyle = "rgba(239,68,68,0.2)";
    ctx.beginPath(); ctx.arc(dr.x, dr.y, dr.r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(dr.x, dr.y, dr.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Player
  if (invuln <= 0 || Math.floor(animT * 16) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Faithful viv.as modal transmission overlay (state > 0)
  if (activePopup && !over) {
    ctx.fillStyle = "rgba(6,10,20,0.65)"; ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = "#121a2b"; ctx.fillRect(64, 150, 384, 160);
    ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 2.5; ctx.strokeRect(64, 150, 384, 160);
    ctx.fillStyle = "#4ade80"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(activePopup.title, 256, 192);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "14px sans-serif";
    ctx.fillText(activePopup.text, 256, 234);
    ctx.fillStyle = "#38d6ff"; ctx.font = "bold 13px sans-serif";
    ctx.fillText("Cliquez (ou Espace) pour continuer", 256, 282);
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "TOUS LES RELAIS ACTIFS !" : "SIGNAL PERDU", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
