<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Sonde Caverne (Ast)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "ast",
  "name": "Sonde Caverne (Ast)",
  "family": "sideClavSimple",
  "icon": "☄️",
  "controls": "Flèches / ZQSD (Haut = propulseur, Gauche/Droite = dérive) ou maintenir clic/doigt pour diriger",
  "description": "Orbe à propulseur glissant sur une grille d'astéroïdes 16×16 avec collisions circulaires douces.",
  "goal": "Collecter les 8 cristaux d'énergie dans la caverne sans détruire vos 3 boucliers avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 },
    { "key": "crystals", "label": "Cristaux", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>☄️ <b>Sonde Ast</b></span>
  <span id="stat">Cristaux: 0/8 • ❤❤❤ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "ast";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const MW = 16, MH = 16, CW = 32, CH = 32;

let keys = {}, grid = [], p = {}, crystals = [], mines = [], sparks = [];
let down = false, mx = 256, my = 256;
let timeLeft = 45, targetCrystals = 8, hp = 3, invuln = 0;
let score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

function isWallTile(ax, ay) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return true;
  return grid[ay * MW + ax] > 0;
}
function setTile(ax, ay, v) {
  if (ax < 0 || ax >= MW || ay < 0 || ay >= MH) return;
  grid[ay * MW + ax] = v;
}

function generateCavern() {
  grid = new Array(MW * MH).fill(0);
  // Borders (exact 16x16 enclosed cavern)
  for (let i = 0; i < MW; i++) {
    setTile(i, 0, 1); setTile(i, MH - 1, 1);
    setTile(0, i, 1); setTile(MW - 1, i, 1);
  }
  // Random rock tiles like ast.as, keeping spawn (7,7) clear
  for (let i = 0; i < 42; i++) {
    const rx = 1 + Math.floor(Math.random() * (MW - 2));
    const ry = 1 + Math.floor(Math.random() * (MH - 2));
    if (Math.abs(rx - 7) <= 1 && Math.abs(ry - 7) <= 1) continue;
    setTile(rx, ry, 1);
  }
  // Flood-fill from spawn (7,7) so every crystal/mine is guaranteed reachable
  const vis = new Set();
  const q = [[7, 7]];
  vis.add("7,7");
  const openCells = [];
  while (q.length) {
    const [cx, cy] = q.shift();
    openCells.push([cx, cy]);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      const k = nx + "," + ny;
      if (!vis.has(k) && !isWallTile(nx, ny)) {
        vis.add(k); q.push([nx, ny]);
      }
    }
  }
  // Fill unreachable pockets so the map looks clean
  for (let y = 1; y < MH - 1; y++) {
    for (let x = 1; x < MW - 1; x++) {
      if (!vis.has(x + "," + y)) setTile(x, y, 1);
    }
  }
  return openCells;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  targetCrystals = Math.max(4, Math.min(14, Number(custom.crystals) || 8));
  let openCells = generateCavern();
  for (let tries = 0; tries < 8 && openCells.length < targetCrystals + 12; tries++) {
    openCells = generateCavern();
  }
  p = { cx: 7 * CW + 16, cy: 7 * CH + 16, vx: 0, vy: 0, rad: 13, thrust: false };
  hp = 3; invuln = 0; score = 0; won = false; over = false; sparks = [];

  // Place crystals far from spawn
  const candidates = openCells.filter(([x, y]) => Math.hypot(x - 7, y - 7) >= 2.2);
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  crystals = [];
  for (let i = 0; i < Math.min(targetCrystals, candidates.length); i++) {
    const [gx, gy] = candidates[i];
    crystals.push({ x: gx * CW + 16, y: gy * CH + 16, done: false, phase: Math.random() * 6.28 });
  }
  // Place 4 pulsing magma mines in remaining cells
  mines = [];
  for (let i = targetCrystals; i < Math.min(targetCrystals + 4, candidates.length); i++) {
    const [gx, gy] = candidates[i];
    mines.push({ x: gx * CW + 16, y: gy * CH + 16, r: 9, phase: Math.random() * 6.28 });
  }
}

// Faithful circle-vs-tile-grid sliding collision from ast.as
function gridTest(a) {
  const ax = Math.floor(a.cx / CW);
  const ay = Math.floor(a.cy / CH);
  for (let i = -1; i <= 1; i++) {
    for (let k = -1; k <= 1; k++) {
      if (!isWallTile(ax + k, ay + i)) continue;
      const bx = (ax + k) * CW, by = (ay + i) * CH;
      const ix = a.cx < bx ? bx : (a.cx > bx + CW ? bx + CW : a.cx);
      const iy = a.cy < by ? by : (a.cy > by + CH ? by + CH : a.cy);
      const dx = a.cx - ix, dy = a.cy - iy;
      const d = Math.hypot(dx, dy);
      if (d > a.rad || d < 0.0001) continue;
      const ta = Math.atan2(iy - a.cy, ix - a.cx);
      a.cx += Math.cos(ta) * (d - a.rad) * 0.55;
      a.cy += Math.sin(ta) * (d - a.rad) * 0.55;
      const nx = Math.cos(ta), ny = Math.sin(ta);
      const dot = a.vy * ny + a.vx * nx;
      if (dot > 0) {
        a.vx -= nx * dot;
        a.vy -= ny * dot;
      }
    }
  }
}

function addSparks(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 110;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  animT += dt;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Controls matching ast.as physics (scaled smoothly by 60fps step)
    const ms = 0.24 * step;
    const left = keys.ArrowLeft || keys.KeyA || keys.KeyQ;
    const right = keys.ArrowRight || keys.KeyD;
    const up = keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space;
    p.thrust = !!up;

    if (left) p.vx -= ms;
    if (right) p.vx += ms;
    if (up) p.vy -= 0.52 * step;

    if (down) {
      const dx = mx - p.cx, dy = my - p.cy;
      p.vx += Math.max(-0.28, Math.min(0.28, dx * 0.008)) * step;
      if (dy < 16) { p.vy -= 0.52 * step; p.thrust = true; }
    }

    p.vx *= Math.pow(0.95, step);
    p.vy += 0.2 * step;
    const maxS = 7.5;
    p.vx = Math.max(-maxS, Math.min(maxS, p.vx));
    p.vy = Math.max(-maxS, Math.min(maxS, p.vy));

    p.cx += p.vx * step;
    p.cy += p.vy * step;
    gridTest(p);
    gridTest(p);

    for (const c of crystals) {
      if (!c.done && Math.hypot(p.cx - c.x, p.cy - c.y) < p.rad + 10) {
        c.done = true;
        score += 50;
        addSparks(c.x, c.y, "#fde047", 12);
      }
    }
    if (invuln <= 0) {
      for (const m of mines) {
        if (Math.hypot(p.cx - m.x, p.cy - m.y) < p.rad + m.r - 2) {
          hp--;
          invuln = 1.2;
          const a = Math.atan2(p.cy - m.y, p.cx - m.x);
          p.vx = Math.cos(a) * 5.5;
          p.vy = Math.sin(a) * 5.5;
          addSparks(p.cx, p.cy, "#f87171", 16);
          if (hp <= 0) { over = true; won = false; }
          break;
        }
      }
    }
    if (crystals.every(c => c.done)) {
      won = true; over = true;
      score += Math.round(timeLeft * 6) + hp * 30;
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  const doneN = crystals.filter(c => c.done).length;
  document.getElementById("stat").textContent = `Cristaux: ${doneN}/${crystals.length} • ${"❤".repeat(Math.max(0, hp))} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);
  // Subtle grid
  ctx.strokeStyle = "rgba(56,214,255,0.06)"; ctx.lineWidth = 1;
  for (let i = 1; i < MW; i++) {
    ctx.beginPath(); ctx.moveTo(i * CW, 0); ctx.lineTo(i * CW, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CH); ctx.lineTo(512, i * CH); ctx.stroke();
  }
  // Walls
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (grid[y * MW + x] > 0) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(x * CW + 1, y * CH + 1, CW - 2, CH - 2);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(x * CW + 1.5, y * CH + 1.5, CW - 3, CH - 3);
      }
    }
  }
  // Mines
  for (const m of mines) {
    const pulse = 1 + Math.sin(animT * 6 + m.phase) * 0.2;
    ctx.fillStyle = "rgba(248,113,113,0.22)";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 1.5 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // Crystals
  for (const c of crystals) {
    if (c.done) continue;
    const bob = Math.sin(animT * 4 + c.phase) * 3;
    ctx.save(); ctx.translate(c.x, c.y + bob); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#fde047"; ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.strokeRect(-6, -6, 12, 12);
    ctx.restore();
  }
  // Thruster flame
  if (p.thrust && !over) {
    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.moveTo(p.cx - 6, p.cy + p.rad - 2);
    ctx.lineTo(p.cx + 6, p.cy + p.rad - 2);
    ctx.lineTo(p.cx, p.cy + p.rad + 12 + Math.random() * 7);
    ctx.fill();
  }
  // Player orb (blinks during invuln)
  if (invuln <= 0 || Math.floor(animT * 16) % 2 === 0) {
    ctx.fillStyle = "#38d6ff";
    ctx.beginPath(); ctx.arc(p.cx, p.cy, p.rad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e6f4ff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#0a0e18";
    ctx.beginPath(); ctx.arc(p.cx + p.vx * 0.8, p.cy + p.vy * 0.5, 4, 0, Math.PI * 2); ctx.fill();
  }
  // Sparks
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life * 2);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "CAVERNE EXPLORÉE !" : "SONDE PERDUE", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
