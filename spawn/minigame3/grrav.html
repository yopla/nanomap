<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Échasse & Tunnel (Grrav)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "grrav",
  "name": "Échasse & Tunnel (Grrav)",
  "family": "sideClavSimple",
  "icon": "🦿",
  "controls": "Flèches / ZQSD (Haut = léviter, Bas = rétracter l'échasse pour ramper dans les conduits) ou maintenir clic/doigt",
  "description": "Drone sur échasse télescopique : rétractez votre jambe pour passer sous les piliers et dans les conduits étroits.",
  "goal": "Récupérer les 6 puces d'accès et rejoindre le sas de sortie avant la fin du chrono.",
  "fields": [
    { "key": "durationSec", "label": "Durée (s)", "type": "number", "default": 45 }
  ]
}
</script>
<div class="bar">
  <span>🦿 <b>Échasse Grrav</b></span>
  <span id="stat">Puces: 0/6 • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "grrav";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// Obstacles directly modeled on grrav.as tight ducts & under-pillar crawl gaps
const WALLS = [
  { x: 0, y: 448, w: 512, h: 64 },      // Floor
  { x: 0, y: 0, w: 512, h: 20 },        // Ceiling
  { x: 0, y: 0, w: 16, h: 512 },        // Left wall
  { x: 496, y: 0, w: 16, h: 512 },      // Right wall
  // Left split pillar with narrow 22px tunnel at y=252..274
  { x: 112, y: 20, w: 68, h: 232 },
  { x: 112, y: 274, w: 68, h: 174 },
  // Right tall pillar leaving a 22px crawl gap above floor (y=426..448)
  { x: 320, y: 20, w: 84, h: 406 },
  // Mid shelf & upper overhang creating a second narrow duct
  { x: 204, y: 150, w: 92, h: 24 },
  { x: 204, y: 310, w: 92, h: 22 }
];

let keys = {}, cx = 248, cy = 240, vx = 0, vy = 0, legH = 32;
let chips = [], airlock = { x: 452, y: 92 }, sparks = [];
let down = false, mx = 256, my = 256;
let timeLeft = 45, score = 0, won = false, over = false, animT = 0;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  down = true; updatePtr(e);
});
cv.addEventListener("pointermove", (e) => { updatePtr(e); });
window.addEventListener("pointerup", () => { down = false; });
function updatePtr(e) {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (512 / r.width);
  my = (e.clientY - r.top) * (512 / r.height);
}

function inRect(ax, ay, r) {
  return !(ax < r.x || ay < r.y || ax > r.x + r.w || ay > r.y + r.h);
}
function isWall(ax, ay) {
  for (const w of WALLS) if (inRect(ax, ay, w)) return true;
  return false;
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  timeLeft = Number(custom.durationSec) || 45;
  cx = 248; cy = 240; vx = 0; vy = 0; legH = 32;
  score = 0; won = false; over = false; sparks = [];
  // 6 keycards requiring hovering, crouching under the right pillar, and crawling through the left duct
  chips = [
    { x: 250, y: 112, done: false },  // Above mid shelf
    { x: 146, y: 263, done: false },  // Inside left narrow tunnel
    { x: 56, y: 110, done: false },   // Upper-left chamber
    { x: 56, y: 405, done: false },   // Lower-left chamber
    { x: 362, y: 437, done: false },  // Under right pillar crawl gap
    { x: 452, y: 310, done: false }   // Right vertical shaft
  ];
}

function addSparks(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    sparks.push({ x, y, vx: Math.cos(a) * 80, vy: Math.sin(a) * 80, life: 0.35, color });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  animT += dt;
  const step = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) { over = true; won = false; }

    const left = !!(keys.ArrowLeft || keys.KeyA || keys.KeyQ || (down && mx < cx - 14));
    const right = !!(keys.ArrowRight || keys.KeyD || (down && mx > cx + 14));
    const up = !!(keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.Space || (down && my < cy - 22));
    const crouch = !!(keys.ArrowDown || keys.KeyS || (down && my > cy + 20));

    // Faithful grrav.as direct hover + telescoping leg physics
    const ms = 4.6;
    vx = 0;
    if (left) vx -= ms;
    if (right) vx += ms;
    if (up) vy -= 1.8 * step;
    if (crouch) vy += 1.2 * step;

    vy += 0.65 * step;
    vy = Math.max(-4.2, Math.min(4.2, vy));

    // Telescoping strut height h = 8 (crouched or inside tight duct) vs 32 (standing tall)
    let h = crouch ? 8 : 32;
    if (isWall(cx, cy - 11) && isWall(cx, cy + 11)) h = 8;
    legH = h;

    // Collisions matching grrav.as
    if (vy > 0 && isWall(cx, cy + h + vy * step)) vy = 0;
    if (vy < 0 && isWall(cx, cy - 10 + vy * step)) vy = 0;
    if (vx > 0 && (isWall(cx + 9 + vx * step, cy) || isWall(cx + 9 + vx * step, cy + Math.min(h - 4, 8)))) vx = 0;
    if (vx < 0 && (isWall(cx - 9 + vx * step, cy) || isWall(cx - 9 + vx * step, cy + Math.min(h - 4, 8)))) vx = 0;

    // Auto stand-up push when extending leg (faithful to grrav.as loop)
    for (let i = 0; i < 4; i++) {
      if (isWall(cx, cy - 10)) break;
      if (isWall(cx, cy + h)) cy -= 1;
    }

    cx += vx * step;
    cy += vy * step;

    for (const c of chips) {
      if (!c.done && Math.hypot(cx - c.x, cy - c.y) < 18) {
        c.done = true; score += 50;
        addSparks(c.x, c.y, "#fde047");
      }
    }
    const allDone = chips.every(c => c.done);
    if (allDone && Math.hypot(cx - airlock.x, cy - airlock.y) < 24) {
      won = true; over = true;
      score += 100 + Math.round(timeLeft * 6);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  const doneN = chips.filter(c => c.done).length;
  const allDone = doneN === chips.length;
  document.getElementById("stat").textContent = `Puces: ${doneN}/${chips.length} • ${legH === 8 ? "Mode Rampant" : "Échasse"} • ${Math.ceil(timeLeft)}s`;

  // Render
  ctx.fillStyle = "#0d1422"; ctx.fillRect(0, 0, 512, 512);

  // Subtle duct guide lines
  ctx.fillStyle = "rgba(56,214,255,0.06)";
  ctx.fillRect(112, 252, 68, 22);
  ctx.fillRect(320, 426, 84, 22);

  // Walls
  for (const w of WALLS) {
    ctx.fillStyle = "#1e293b"; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = "#38d6ff"; ctx.lineWidth = 1.5; ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
  }

  // Extraction airlock
  ctx.strokeStyle = allDone ? "#4ade80" : "#475569";
  ctx.lineWidth = 3;
  ctx.strokeRect(airlock.x - 16, airlock.y - 16, 32, 32);
  if (allDone) {
    ctx.fillStyle = "rgba(74,222,128,0.25)";
    ctx.fillRect(airlock.x - 16, airlock.y - 16, 32, 32);
  }
  ctx.fillStyle = allDone ? "#4ade80" : "#94a3b8";
  ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("SAS", airlock.x, airlock.y + 4);

  // Chips
  for (const c of chips) {
    if (c.done) continue;
    const pulse = Math.sin(animT * 6 + c.x) * 2;
    ctx.fillStyle = "#fde047";
    ctx.fillRect(c.x - 6, c.y - 6 + pulse * 0.5, 12, 12);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
    ctx.strokeRect(c.x - 6, c.y - 6 + pulse * 0.5, 12, 12);
  }

  // Telescoping hover-strut (signature visual from grrav.as)
  ctx.strokeStyle = legH === 8 ? "#f97316" : "#38d6ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx, cy + legH);
  ctx.stroke();
  // Foot pad
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy + legH);
  ctx.lineTo(cx + 6, cy + legH);
  ctx.stroke();

  // Drone head
  ctx.fillStyle = "#38d6ff";
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life * 3);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)"; ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(won ? "INFILTRATION RÉUSSIE !" : "TEMPS ÉCOULÉ", 256, 238);
    ctx.fillStyle = "#e6f4ff"; ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
