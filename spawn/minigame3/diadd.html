<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SPAWN — Laisse d'Aggro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0a0e18; color: #e6f4ff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 8px; padding: 8px; }
  .bar { width: min(512px, 96vw); display: flex; justify-content: space-between; align-items: center; background: #121a2b; border: 1px solid #2d5b7b; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  canvas { background: #0d1422; border: 2px solid #38d6ff; border-radius: 10px; width: min(512px, 96vw); height: min(512px, 96vw); cursor: none; touch-action: none; }
  button { background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
<script type="application/json" data-spawn-minigame>
{
  "id": "diadd",
  "name": "Laisse d'Aggro",
  "family": "topMouseHnS",
  "icon": "⛓️",
  "controls": "Déplacer la souris / doigt (ou flèches / ZQSD) pour attirer les sentinelles dans les pièges EMP",
  "description": "Portage du prototype AS3 diadd : une sentinelle vous poursuit tant que vous restez sous 200px, puis retourne à son poste si vous rompez la laisse.",
  "goal": "Attirez les sentinelles dans 8 pièges EMP verts sans vous faire toucher !",
  "fields": [
    { "key": "targetTraps", "label": "Pièges à déclencher", "type": "number", "default": 8 }
  ]
}
</script>
<div class="bar">
  <span>⛓️ <b>Laisse d'Aggro</b></span>
  <span id="stat">Pièges: 0/8 • ❤️❤️❤️ • 45s</span>
  <div>
    <button onclick="toggleSpawnHelp()" title="Explication du mini-jeu">?</button>
    <button onclick="resetGame()">🔄</button>
    <button onclick="sendResultAndExit(won, score)">✕ Retour</button>
  </div>
</div>
<canvas id="cv" width="512" height="512"></canvas>
<script>
const GAME_ID = "diadd";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const AGGRO_R = 200;
let player = { x: 100, y: 100 };
let keys = {};
let sentinels = [], trap = { x: 400, y: 400, r: 24, pulse: 0 }, blasts = [];
let targetTraps = 8, trapped = 0, hp = 3, invuln = 0;
let timeLeft = 45, score = 0, won = false, over = false;

function sendResultAndExit(didWin, finalScore) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "spawn_minigame_result", id: GAME_ID, won: !!didWin, score: Math.round(finalScore || 0), resource_deltas: {} }, "*");
  }
}
window.addEventListener("message", (e) => { if (e.data && e.data.type === "spawn_minigame_init") resetGame(e.data); });

function setM(e) {
  const r = cv.getBoundingClientRect();
  player.x = Math.max(12, Math.min(500, (e.clientX - r.left) * (512 / r.width)));
  player.y = Math.max(12, Math.min(500, (e.clientY - r.top) * (512 / r.height)));
}
cv.addEventListener("pointermove", setM);
cv.addEventListener("pointerdown", (e) => {
  if (over) { sendResultAndExit(won, score); return; }
  setM(e);
});
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function spawnTrap() {
  for (let tries = 0; tries < 25; tries++) {
    const x = 54 + Math.random() * 404;
    const y = 54 + Math.random() * 404;
    const farFromSent = sentinels.every(s => Math.hypot(s.x - x, s.y - y) > 105 && Math.hypot(s.hx - x, s.hy - y) > 75);
    if (farFromSent) {
      trap = { x, y, r: 24, pulse: 0 };
      return;
    }
  }
  trap = { x: 70 + Math.random() * 372, y: 70 + Math.random() * 372, r: 24, pulse: 0 };
}

function resetGame(initCtx) {
  const custom = (initCtx && initCtx.custom) || (window.__SPAWN_INIT_CTX && window.__SPAWN_INIT_CTX.custom) || {};
  targetTraps = Math.max(3, Number(custom.targetTraps) || 8);
  player = { x: 76, y: 76 };
  sentinels = [
    { x: 256, y: 256, hx: 256, hy: 256, tx: 256, ty: 256, spd: 1.85, aggro: false, stun: 0 },
    { x: 370, y: 150, hx: 370, hy: 150, tx: 370, ty: 150, spd: 1.55, aggro: false, stun: 0 }
  ];
  blasts = [];
  trapped = 0; hp = 3; invuln = 0;
  timeLeft = 45; score = 0; won = false; over = false;
  spawnTrap();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const f = dt * 60;

  if (!over) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0) over = true;
    if (invuln > 0) invuln = Math.max(0, invuln - dt);

    // Optional keyboard support
    let kx = 0, ky = 0;
    if (keys["ArrowLeft"] || keys["KeyA"] || keys["KeyQ"]) kx -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) kx += 1;
    if (keys["ArrowUp"] || keys["KeyW"] || keys["KeyZ"]) ky -= 1;
    if (keys["ArrowDown"] || keys["KeyS"]) ky += 1;
    if (kx || ky) {
      const m = Math.hypot(kx, ky);
      player.x = Math.max(12, Math.min(500, player.x + (kx / m) * 260 * dt));
      player.y = Math.max(12, Math.min(500, player.y + (ky / m) * 260 * dt));
    }

    trap.pulse += dt * 4;

    for (const s of sentinels) {
      if (s.stun > 0) {
        s.stun = Math.max(0, s.stun - dt);
        continue;
      }
      // Faithful diadd.as aggro-leash mechanic: chase player if within 200px, else return to home post
      let tx = player.x, ty = player.y;
      let dx = tx - s.x, dy = ty - s.y;
      if (dx * dx + dy * dy > AGGRO_R * AGGRO_R) {
        tx = s.hx; ty = s.hy;
        dx = tx - s.x; dy = ty - s.y;
        s.aggro = false;
      } else {
        s.aggro = true;
      }
      s.tx = tx; s.ty = ty;

      const dist = Math.hypot(dx, dy);
      if (dist > 2) {
        const ang = Math.atan2(dy, dx);
        const step = Math.min(dist, (s.aggro ? s.spd : s.spd * 0.85) * f);
        s.x += Math.cos(ang) * step;
        s.y += Math.sin(ang) * step;
      }

      // Check EMP trap trigger
      if (Math.hypot(s.x - trap.x, s.y - trap.y) < trap.r + 12) {
        trapped++;
        score += 55;
        blasts.push({ x: trap.x, y: trap.y, r: 10, maxR: 72, life: 0.45 });
        s.stun = 1.0;
        s.x = s.hx; s.y = s.hy;
        s.spd = Math.min(2.7, s.spd + 0.12);
        if (trapped >= targetTraps) {
          won = true; over = true;
          score += Math.round(timeLeft * 6) + hp * 40;
        } else {
          spawnTrap();
        }
        continue;
      }

      // Check player collision
      if (invuln <= 0 && Math.hypot(s.x - player.x, s.y - player.y) < 20) {
        hp--;
        invuln = 1.2;
        blasts.push({ x: player.x, y: player.y, r: 8, maxR: 48, life: 0.35, red: true });
        if (hp <= 0) over = true;
      }
    }

    for (let i = blasts.length - 1; i >= 0; i--) {
      blasts[i].life -= dt;
      if (blasts[i].life <= 0) blasts.splice(i, 1);
    }
  }

  const hearts = "❤️".repeat(Math.max(0, hp)) + "🖤".repeat(Math.max(0, 3 - hp));
  document.getElementById("stat").textContent = `Pièges: ${trapped}/${targetTraps} • ${hearts} • ${Math.ceil(timeLeft)}s • ${score} pts`;

  // Render
  ctx.fillStyle = "#0d1422";
  ctx.fillRect(0, 0, 512, 512);

  // EMP Trap
  const pr = trap.r + Math.sin(trap.pulse) * 3;
  ctx.beginPath();
  ctx.arc(trap.x, trap.y, pr, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(74,222,128,0.18)";
  ctx.fill();
  ctx.strokeStyle = "#4ade80";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = "#4ade80";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("EMP", trap.x, trap.y + 4);

  // Sentinels + aggro leash circles + target lines
  for (const s of sentinels) {
    // Home post
    ctx.beginPath();
    ctx.arc(s.hx, s.hy, 6, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(148,163,184,0.5)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 200px aggro radius around sentinel
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(s.x, s.y, AGGRO_R, 0, Math.PI * 2);
    ctx.strokeStyle = s.aggro ? "rgba(248,113,113,0.28)" : "rgba(56,214,255,0.14)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Targeting tether line (diadd.as signature visual)
    if (s.stun <= 0) {
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.tx, s.ty);
      ctx.strokeStyle = s.aggro ? "rgba(248,113,113,0.75)" : "rgba(56,214,255,0.45)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Sentinel square body (like AS3 drawRect(cx-8, cy-8, 16, 16))
    ctx.fillStyle = s.stun > 0 ? "#475569" : (s.aggro ? "#f43f5e" : "#38bdf8");
    ctx.fillRect(s.x - 12, s.y - 12, 24, 24);
    ctx.strokeStyle = "#e6f4ff";
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x - 12, s.y - 12, 24, 24);
  }

  // Shockwaves
  for (const b of blasts) {
    const t = 1 - b.life / 0.45;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + (b.maxR - b.r) * t, 0, Math.PI * 2);
    ctx.strokeStyle = b.red ? `rgba(248,113,113,${1 - t})` : `rgba(74,222,128,${1 - t})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Player lure circle
  if (invuln <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.beginPath();
    ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(253,224,71,0.25)";
    ctx.fill();
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  if (over) {
    ctx.fillStyle = "rgba(6,10,20,0.85)";
    ctx.fillRect(0, 180, 512, 150);
    ctx.fillStyle = won ? "#4ade80" : "#f87171";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(won ? "SENTINELLES PIÉGÉES !" : (hp <= 0 ? "CAPTURÉ !" : "TEMPS ÉCOULÉ"), 256, 238);
    ctx.fillStyle = "#e6f4ff";
    ctx.font = "15px sans-serif";
    ctx.fillText(`Score ${score} — Cliquez pour revenir au vaisseau`, 256, 282);
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
<!-- SPAWN_HELP_START -->
<style>
  #spawn-help-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.84); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 14px; }
  #spawn-help-overlay.open { display: flex; }
  #spawn-help-card { width: min(440px, 94vw); background: #121a2b; border: 1.5px solid #38d6ff; border-radius: 12px; padding: 16px 18px; color: #e6f4ff; box-shadow: 0 12px 32px rgba(0,0,0,0.65); font-family: system-ui, sans-serif; line-height: 1.45; }
  #spawn-help-card h3 { font-size: 16px; color: #38d6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #spawn-help-card .sh-tag { font-size: 11px; background: #1c3552; color: #aef0ff; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
  #spawn-help-card .sh-sec { margin-top: 8px; font-size: 13px; }
  #spawn-help-card .sh-sec b { color: #fde047; }
  #spawn-help-card .sh-close { margin-top: 14px; width: 100%; padding: 8px; background: #1c3552; color: #aef0ff; border: 1px solid #38d6ff; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
<div id="spawn-help-overlay" onclick="if(event.target===this)toggleSpawnHelp(false)">
  <div id="spawn-help-card">
    <h3 id="sh-title"></h3>
    <div class="sh-sec" id="sh-desc"></div>
    <div class="sh-sec" id="sh-goal"></div>
    <div class="sh-sec" id="sh-ctrl"></div>
    <button class="sh-close" onclick="toggleSpawnHelp(false)">Fermer</button>
  </div>
</div>
<script>
(function(){
  var populated = false;
  function fillHelp(){
    if (populated) return;
    populated = true;
    var el = document.querySelector("script[data-spawn-minigame]");
    var m = {};
    try { if (el) m = JSON.parse(el.textContent); } catch(e){}
    document.getElementById("sh-title").innerHTML = "<span>" + (m.icon || "🕹️") + " " + (m.name || document.title) + "</span><span class='sh-tag'>" + (m.family || "spawn") + "</span>";
    document.getElementById("sh-desc").innerHTML = m.description ? ("<b>Principe :</b> " + m.description) : "";
    document.getElementById("sh-goal").innerHTML = m.goal ? ("<b>Objectif :</b> " + m.goal) : "";
    document.getElementById("sh-ctrl").innerHTML = m.controls ? ("<b>Contrôles :</b> " + m.controls) : "";
  }
  window.toggleSpawnHelp = function(force){
    fillHelp();
    var ov = document.getElementById("spawn-help-overlay");
    if (!ov) return;
    var show = typeof force === "boolean" ? force : !ov.classList.contains("open");
    ov.classList.toggle("open", show);
  };
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape") window.toggleSpawnHelp(false);
  });
})();
</script>
<!-- SPAWN_HELP_END -->
</body>
</html>
