<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>SPAWN — Arcade Mini-Jeux</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    background: #070b14; color: #e6f4ff;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column;
    width: 100%; height: 100%; height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .topbar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: #0f1728;
    border-bottom: 2px solid #244a69;
    z-index: 20;
  }
  .sel-wrap {
    flex: 1 1 240px; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
  }
  select#gameSel {
    width: 100%; min-height: 50px;
    background: #16233b; color: #e6f4ff;
    border: 2px solid #38d6ff; border-radius: 12px;
    padding: 11px 12px; font-size: 16px; font-weight: 700;
    outline: none; cursor: pointer;
  }
  .file-badge {
    flex: 0 1 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; font-weight: 700; color: #7dd3fc;
    background: #0b1322; border: 1.5px solid #23415c;
    border-radius: 10px; padding: 9px 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 280px;
  }
  .counter {
    font-size: 14px; color: #cbd5e1; font-weight: 800; white-space: nowrap;
  }
  .btns {
    display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
  }
  button.ctrl {
    min-height: 52px;
    background: #18304d; color: #e8faff;
    border: 2px solid #38d6ff; border-radius: 12px;
    padding: 12px 18px; font-size: 17px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    transition: background 0.12s, transform 0.08s;
  }
  button.ctrl:active { transform: scale(0.95); background: #22466e; }
  button.ctrl.accent { background: #1e4670; border-color: #67e8f9; }
  button.ctrl.help-btn {
    min-width: 58px; min-height: 52px;
    padding: 0 18px;
    font-size: 28px; font-weight: 900; line-height: 1;
    background: #332509; color: #fde047;
    border: 2.5px solid #facc15;
    box-shadow: 0 0 14px rgba(250, 204, 21, 0.35);
  }
  button.ctrl.help-btn:active,
  button.ctrl.help-btn.open {
    background: #facc15; color: #0b1322;
  }
  .fs-pill.fs-help {
    min-width: 52px; padding: 6px 16px;
    font-size: 24px; font-weight: 900; line-height: 1;
    color: #fde047; border-color: #facc15;
    background: rgba(51, 37, 9, 0.92);
  }
  .fs-pill.fs-help.open { background: #facc15; color: #0b1322; }
  /* Objective modal (shows ONLY the game objective) */
  #goalBackdrop {
    position: fixed; inset: 0;
    display: none; align-items: flex-start; justify-content: center;
    padding-top: calc(78px + env(safe-area-inset-top));
    background: rgba(4, 8, 16, 0.55);
    backdrop-filter: blur(3px);
    z-index: 9600;
  }
  #goalBackdrop.show { display: flex; }
  #goalBox {
    max-width: min(640px, 92vw);
    background: rgba(12, 20, 36, 0.97);
    border: 2.5px solid #facc15;
    border-radius: 16px;
    padding: 20px 26px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
    color: #fef9c3;
    font-size: 20px; font-weight: 700; line-height: 1.45;
    text-align: center;
    cursor: pointer;
  }
  .stage {
    position: relative; flex: 1 1 auto; width: 100%; min-height: 0;
    background: #0a0e18;
  }
  iframe#gameFrame {
    width: 100%; height: 100%; border: 0; display: block;
    background: #0a0e18;
  }
  /* Fullscreen / Immersive mode */
  .app.immersive .topbar { display: none; }
  .fs-float {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    display: none; gap: 8px; z-index: 9000;
  }
  .app.immersive .fs-float { display: flex; }
  .fs-pill {
    min-height: 48px;
    background: rgba(15, 23, 40, 0.86);
    color: #e6f4ff; border: 2px solid rgba(56, 214, 255, 0.85);
    border-radius: 999px; padding: 10px 16px;
    font-size: 17px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
  }
  .fs-pill:active { transform: scale(0.95); }
  .fs-name-pill {
    position: fixed;
    bottom: calc(10px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    display: none;
    background: rgba(11, 19, 34, 0.78);
    color: #7dd3fc; border: 1.5px solid rgba(56, 214, 255, 0.45);
    border-radius: 999px; padding: 5px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; font-weight: 700; z-index: 8999; pointer-events: none;
  }
  .app.immersive .fs-name-pill { display: block; }
  /* Result toast */
  #resToast {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: rgba(12, 20, 36, 0.96);
    border: 2px solid #38d6ff; border-radius: 14px;
    padding: 12px 16px; z-index: 9500;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    max-width: 96vw; font-size: 15px; font-weight: 700;
  }
  #resToast.show { display: flex; }
  @media (max-width: 720px) {
    .topbar { padding: 8px 10px; gap: 8px; }
    .sel-wrap { flex: 1 1 100%; }
    .file-badge { max-width: 72vw; font-size: 13px; padding: 6px 10px; }
    .btns { width: 100%; gap: 8px; }
    .btns button.ctrl { flex: 1 1 0; padding: 13px 10px; font-size: 16px; min-height: 54px; }
    .btns button.ctrl.help-btn { flex: 0 0 60px; padding: 0; font-size: 28px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="sel-wrap">
      <select id="gameSel" aria-label="Choisir un mini-jeu"></select>
    </div>
    <span class="file-badge" id="fileLabel" title="Fichier HTML chargé">—</span>
    <span class="counter" id="counterLabel">0/0</span>
    <div class="btns">
      <button class="ctrl help-btn" id="btnHelp" title="Objectif du jeu" aria-label="Objectif du jeu" aria-expanded="false">?</button>
      <button class="ctrl accent" id="btnRandom" title="Mini-jeu aléatoire">🎲 Random</button>
      <button class="ctrl" id="btnNext" title="Mini-jeu suivant">⏭️ Suivant</button>
      <button class="ctrl" id="btnFs" title="Plein écran">⛶ Plein écran</button>
    </div>
  </header>

  <main class="stage">
    <iframe id="gameFrame" allow="fullscreen" allowfullscreen></iframe>
  </main>

  <div class="fs-float">
    <button class="fs-pill fs-help" id="fsHelp" title="Objectif du jeu" aria-label="Objectif du jeu" aria-expanded="false">?</button>
    <button class="fs-pill" id="fsRandom" title="Aléatoire">🎲</button>
    <button class="fs-pill" id="fsNext" title="Suivant">⏭️</button>
    <button class="fs-pill" id="fsExit" title="Quitter plein écran">✕ Barre</button>
  </div>
  <div class="fs-name-pill" id="fsNameLabel"></div>

  <div id="goalBackdrop" role="dialog" aria-modal="true" aria-label="Objectif du jeu">
    <div id="goalBox"><span id="goalText"></span></div>
  </div>

  <div id="resToast">
    <span id="resText"></span>
    <button class="ctrl" id="toastReplay">🔄</button>
    <button class="ctrl accent" id="toastRandom">🎲 Random</button>
    <button class="ctrl" id="toastNext">⏭️ Suivant</button>
    <button class="ctrl" id="toastClose">✕</button>
  </div>
</div>

const FOLDER_LABELS = /*JEUX_FOLDER_LABELS_JSON*/{"minigame2":"📁 minigame2 (45)","minigame3":"📁 minigame3 (23)","minigame4":"📁 minigame4 (1)","minigame5":"📁 minigame5 (5)","minigame6":"📁 minigame6 (11)","minigame7":"📁 minigame7 (9)","minigame8":"📁 minigame8 (15)","minigame9":"📁 minigame9 (17)","minigames":"📁 minigames (45)"}/*JEUX_FOLDER_LABELS_JSON_END*/;

const app = document.getElementById("app");
const sel = document.getElementById("gameSel");
const frame = document.getElementById("gameFrame");
const fileLabel = document.getElementById("fileLabel");
const counterLabel = document.getElementById("counterLabel");
const fsNameLabel = document.getElementById("fsNameLabel");
const resToast = document.getElementById("resToast");
const resText = document.getElementById("resText");
const btnHelp = document.getElementById("btnHelp");
const fsHelp = document.getElementById("fsHelp");
const goalBackdrop = document.getElementById("goalBackdrop");
const goalText = document.getElementById("goalText");

let curIdx = 0;
let randomBag = [];

// Build hierarchical <optgroup> dropdown by folder
const groups = {};
CATALOG.forEach((g, idx) => {
  if (!groups[g.folder]) {
    const og = document.createElement("optgroup");
    og.label = FOLDER_LABELS[g.folder] || ("📁 " + g.folder);
    sel.appendChild(og);
    groups[g.folder] = og;
  }
  const opt = document.createElement("option");
  opt.value = String(idx);
  opt.textContent = g.icon + " " + g.name + "  [" + g.file + "]";
  groups[g.folder].appendChild(opt);
});

function hideToast() {
  resToast.classList.remove("show");
}

function setGoalOpen(open) {
  const show = Boolean(open);
  goalBackdrop.classList.toggle("show", show);
  btnHelp.classList.toggle("open", show);
  fsHelp.classList.toggle("open", show);
  btnHelp.setAttribute("aria-expanded", String(show));
  fsHelp.setAttribute("aria-expanded", String(show));
}

function toggleGoal() {
  setGoalOpen(!goalBackdrop.classList.contains("show"));
}

function loadIndex(idx, updateHash = true) {
  curIdx = ((idx % CATALOG.length) + CATALOG.length) % CATALOG.length;
  const g = CATALOG[curIdx];
  sel.value = String(curIdx);
  fileLabel.textContent = g.path;
  fileLabel.title = g.path;
  counterLabel.textContent = (curIdx + 1) + "/" + CATALOG.length;
  fsNameLabel.textContent = g.path + " (" + (curIdx + 1) + "/" + CATALOG.length + ")";
  goalText.textContent = (g.goal && g.goal.trim()) ? g.goal.trim() : "Atteindre l'objectif du mini-jeu.";
  document.title = g.icon + " " + g.file + " — SPAWN Arcade";
  hideToast();
  setGoalOpen(false);
  frame.src = g.path;
  if (updateHash) {
    try { history.replaceState(null, "", "#" + g.path); } catch (e) {}
  }
}

function pickRandom() {
  if (randomBag.length === 0) {
    randomBag = CATALOG.map((_, i) => i).filter(i => i !== curIdx);
    for (let i = randomBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = randomBag[i]; randomBag[i] = randomBag[j]; randomBag[j] = tmp;
    }
  }
  const next = randomBag.pop();
  loadIndex(typeof next === "number" ? next : 0);
}

function nextGame() {
  loadIndex(curIdx + 1);
}

function setImmersive(on) {
  app.classList.toggle("immersive", on);
  if (on) {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el).catch(() => {}); } catch (e) {} }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { exit.call(document).catch(() => {}); } catch (e) {}
    }
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    app.classList.remove("immersive");
  }
});

sel.addEventListener("change", () => loadIndex(Number(sel.value)));
btnHelp.addEventListener("click", toggleGoal);
fsHelp.addEventListener("click", toggleGoal);
goalBackdrop.addEventListener("click", () => setGoalOpen(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && goalBackdrop.classList.contains("show")) {
    setGoalOpen(false);
  }
});
document.getElementById("btnRandom").addEventListener("click", pickRandom);
document.getElementById("btnNext").addEventListener("click", nextGame);
document.getElementById("btnFs").addEventListener("click", () => setImmersive(!app.classList.contains("immersive")));
document.getElementById("fsRandom").addEventListener("click", pickRandom);
document.getElementById("fsNext").addEventListener("click", nextGame);
document.getElementById("fsExit").addEventListener("click", () => setImmersive(false));

document.getElementById("toastReplay").addEventListener("click", () => loadIndex(curIdx, false));
document.getElementById("toastRandom").addEventListener("click", pickRandom);
document.getElementById("toastNext").addEventListener("click", nextGame);
document.getElementById("toastClose").addEventListener("click", hideToast);

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "spawn_minigame_result") {
    const icon = e.data.won ? "🏆 Victoire" : "🎮 Terminé";
    resText.textContent = icon + " (" + CATALOG[curIdx].file + ") • Score " + (e.data.score || 0);
    resToast.classList.add("show");
  }
});

// Init from URL hash if present
const hash = (location.hash || "").replace(/^#/, "");
const found = hash ? CATALOG.findIndex(g => g.path === hash || g.file === hash || g.id === hash) : -1;
loadIndex(found >= 0 ? found : 0, false);
</script>
