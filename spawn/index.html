<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>SPAWN — Dérive sur la Spirale</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Barre supérieure de ressources (révélation strictement progressive) -->
    <header class="hud-top">
      <div class="hud-brand">
        <button type="button" class="brand-title info-trigger info-trigger-plain" id="brand-title" data-info="brand">SPAWN</button>
        <button type="button" id="zone-badge" class="zone-badge zone-forgot info-trigger" data-info="zone">ForgotLands</button>
      </div>

      <div id="resource-bar" class="resource-bar">
        <button type="button" id="res-fuel" class="res-pill res-fuel info-trigger" data-info="res:fuel" style="display:none;">
          <span class="res-icon">◆</span>
          <span class="res-label" id="lbl-fuel">Fuel</span>
          <span class="res-value" id="val-fuel">40/96</span>
        </button>
        <button type="button" id="res-coque" class="res-pill res-coque info-trigger" data-info="res:coque" style="display:none;">
          <span class="res-icon">⬡</span>
          <span class="res-label" id="lbl-coque">Coque</span>
          <span class="res-value" id="val-coque">24/48</span>
        </button>
        <button type="button" id="res-scan" class="res-pill res-scan info-trigger" data-info="res:scan" style="display:none;">
          <span class="res-icon">◎</span>
          <span class="res-label" id="lbl-scan">Scan</span>
          <span class="res-value" id="val-scan">16/48</span>
        </button>
        <button type="button" id="res-hyper" class="res-pill res-hyper info-trigger" data-info="res:hyper" style="display:none;">
          <span class="res-icon">⟐</span>
          <span class="res-label" id="lbl-hyper">Hyper</span>
          <span class="res-value" id="val-hyper">3/12</span>
        </button>
        <button type="button" id="res-t2s" class="res-pill res-t2s info-trigger" data-info="res:t2s" style="display:none;">
          <span class="res-icon">◷</span>
          <span class="res-label" id="lbl-t2s">T2s</span>
          <span class="res-value" id="val-t2s">6/96</span>
        </button>
        <button type="button" id="res-lum" class="res-pill res-lum info-trigger" data-info="res:lum" style="display:none;">
          <span class="res-icon">✦</span>
          <span class="res-label" id="lbl-lum">Lum</span>
          <span class="res-value" id="val-lum">0</span>
        </button>
      </div>

      <div class="hud-meta">
        <button type="button" id="shield-badge" class="shield-badge info-trigger" data-info="shield" style="display:none;">✦ Bouclier Lum actif</button>
        <button type="button" id="btn-audio" class="icon-btn" title="Son activé / coupé" aria-label="Son">🔊</button>
        <button type="button" id="btn-journal" class="icon-btn" style="display:none;" title="Ouvrir le Journal (J)">Journal</button>
      </div>
    </header>

    <!-- Ligne d'objectif contextuel ("murmure") -->
    <div id="whisper-bar" class="whisper-bar">
      <button type="button" id="whisper-text" class="whisper-btn info-trigger info-trigger-plain" data-info="whisper"></button>
      <button type="button" id="coords-readout" class="coords-readout info-trigger info-trigger-plain" data-info="coords" style="display:none;"></button>
    </div>

    <!-- Fiche d'info contextuelle cliquable -->
    <section id="info-popover" class="info-popover" style="display:none;" role="dialog" aria-live="polite">
      <div class="info-pop-head">
        <div>
          <div class="info-pop-kicker" id="info-kicker"></div>
          <h3 class="info-pop-title" id="info-title"></h3>
        </div>
        <button type="button" id="btn-close-info" class="icon-btn">Fermer</button>
      </div>
      <p class="info-pop-body" id="info-body"></p>
      <div class="info-pop-tip" id="info-tip" style="display:none;"></div>
      <div class="info-pop-actions" id="info-actions" style="display:none;"></div>
    </section>

    <!-- Bannière narrative non bloquante -->
    <div id="story-toast" class="story-toast" style="display:none;">
      <div class="toast-kicker" id="toast-kicker"></div>
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-body" id="toast-body"></div>
      <div class="toast-unlock" id="toast-unlock"></div>
    </div>

    <!-- Zone centrale : Canvas carré + Panneau contextuel -->
    <main class="main-stage">
      <div class="viewport-wrap" id="viewport-wrap">
        <canvas id="game-canvas" width="576" height="576"></canvas>

        <!-- Croix directionnelle discrète (tactile / souris) -->
        <div id="dpad" class="dpad" style="display:none;">
          <button class="dpad-btn dpad-up" data-dir="up" title="Haut (Z / ↑)">▲</button>
          <button class="dpad-btn dpad-left" data-dir="left" title="Gauche (Q / ←)">◀</button>
          <button class="dpad-btn dpad-center" data-dir="interact" title="Inspecter (Espace)">◎</button>
          <button class="dpad-btn dpad-right" data-dir="right" title="Droite (D / →)">▶</button>
          <button class="dpad-btn dpad-down" data-dir="down" title="Bas (S / ↓)">▼</button>
        </div>

        <!-- Indicateur de mode visée HyperJump -->
        <div id="aim-banner" class="aim-banner" style="display:none;">
          <span id="aim-text"></span> · <button id="btn-cancel-aim" class="inline-link">Annuler</button>
        </div>
      </div>

      <!-- Panneau contextuel du lieu sélectionné / survolé par le vaisseau -->
      <aside id="context-panel" class="context-panel" style="display:none;">
        <div class="panel-header">
          <div>
            <div class="panel-kicker" id="ctx-kicker"></div>
            <h2 class="panel-title" id="ctx-title"></h2>
          </div>
          <button type="button" class="panel-id info-trigger" id="ctx-id" data-info="cellId"></button>
        </div>

        <p class="panel-text" id="ctx-text"></p>
        <div class="panel-meta" id="ctx-meta" style="display:none;"></div>
        <div class="panel-actions" id="ctx-actions"></div>
      </aside>
    </main>

    <!-- Barre d'outils progressive -->
    <footer id="toolbar" class="toolbar" style="display:none;">
      <button id="tool-hyper" class="tool-btn" style="display:none;" title="Activer la visée HyperJump (H)">
        <span class="tool-icon">⟐</span>
        <span class="tool-name" id="lbl-tool-hyper">HyperJump</span>
        <span class="tool-cost" id="cost-tool-hyper">-1 H</span>
      </button>

      <button id="tool-radar" class="tool-btn" style="display:none;" title="Orienter la boussole vers l'étoile la plus proche">
        <span class="tool-icon">⌖</span>
        <span class="tool-name" id="lbl-tool-radar">LocatStar</span>
        <span class="tool-cost" id="cost-tool-radar">Gratuit</span>
      </button>

      <div id="tool-compass-group" class="tool-group" style="display:none;">
        <button type="button" class="group-label info-trigger info-trigger-plain" id="lbl-compass-group" data-info="compassGroup">Boussole :</button>
        <button class="tool-chip" data-compass="0" id="cmp-0" style="display:none;">B·0</button>
        <button class="tool-chip" data-compass="500" id="cmp-500" style="display:none;">B·500</button>
        <button class="tool-chip" data-compass="400" id="cmp-400" style="display:none;">B·400</button>
        <button class="tool-chip" data-compass="256" id="cmp-256" style="display:none;">B·256</button>
        <button class="tool-chip" data-compass="3030" id="cmp-3030" style="display:none;">B·714</button>
        <button class="tool-chip" data-compass="clear" id="cmp-clear" style="display:none;">✕</button>
      </div>

      <div id="tool-go-group" class="tool-group" style="display:none;">
        <button type="button" class="group-label info-trigger info-trigger-plain" id="lbl-go-group" data-info="goGroup">Balises :</button>
        <button class="tool-chip accent-cyan" data-go="0" id="go-0" style="display:none;">Go·0 <small>1H</small></button>
        <button class="tool-chip accent-cyan" data-go="500" id="go-500" style="display:none;">Go·500 <small>1H</small></button>
        <button class="tool-chip accent-cyan" data-go="400" id="go-400" style="display:none;">Go·400 <small>1H</small></button>
        <button class="tool-chip accent-magenta" data-go="rnd" id="go-rnd" style="display:none;">Go·RND <small>1H</small></button>
      </div>

      <button id="tool-shield" class="tool-btn accent-gold" style="display:none;" title="Bloquer le prochain malus">
        <span class="tool-icon">✦</span>
        <span class="tool-name" id="lbl-tool-shield">Bouclier</span>
        <span class="tool-cost" id="cost-tool-shield">-2 L</span>
      </button>

      <button id="tool-convert" class="tool-btn" style="display:none;" title="Convertir le T2s en ressources">
        <span class="tool-icon">◷</span>
        <span class="tool-name" id="lbl-tool-convert">Recycler T2s</span>
        <span class="tool-cost" id="cost-tool-convert">T2s</span>
      </button>

      <button id="tool-refill" class="tool-btn accent-emerald" style="display:none;" title="Régénérer les planètes dans un rayon de 10 cases">
        <span class="tool-icon">↻</span>
        <span class="tool-name" id="lbl-tool-refill">REFILL16</span>
        <span class="tool-cost" id="cost-tool-refill">-12 S</span>
      </button>

      <button id="tool-reseed" class="tool-btn accent-magenta" style="display:none;" title="Générer une nouvelle spirale (RESEED)">
        <span class="tool-icon">∞</span>
        <span class="tool-name" id="lbl-tool-reseed">RESEED</span>
        <span class="tool-cost" id="cost-tool-reseed">Nouvel élan</span>
      </button>
    </footer>
  </div>

  <!-- Modale Journal / Convertisseur / Soute -->
  <div id="modal-journal" class="modal-backdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="journal-title">Journal de Bord &amp; Systèmes</h3>
        <button id="btn-close-journal" class="icon-btn">Fermer</button>
      </div>
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="story"><span id="lbl-tab-story">Récit</span></button>
        <button class="tab-btn" data-tab="stars"><span id="lbl-tab-stars">Étoiles</span> (<span id="tab-stars-count">0</span>)</button>
        <button class="tab-btn" data-tab="cargo" id="tab-btn-cargo" style="display:none;"><span id="lbl-tab-cargo">Soute</span> (<span id="tab-cargo-count">0</span>)</button>
        <button class="tab-btn" data-tab="convert" id="tab-btn-convert" style="display:none;"><span id="lbl-tab-convert">Recycleur T2s</span></button>
        <button class="tab-btn" data-tab="system"><span id="lbl-tab-system">Système</span></button>
      </div>
      <div class="modal-body" id="journal-body"></div>
    </div>
  </div>

  <!-- Overlay Intro -->
  <div id="overlay-intro" class="overlay-screen">
    <div class="overlay-card">
      <div class="intro-mood-row">
        <span id="intro-mood-badge" class="mood-badge"></span>
        <button type="button" id="btn-reroll-mood" class="secondary-btn mood-reroll-btn"></button>
      </div>
      <div class="overlay-kicker" id="intro-kicker"></div>
      <h1 class="overlay-title" id="intro-title">SPAWN</h1>
      <p class="overlay-lead" id="intro-lead"></p>
      <p class="overlay-sub" id="intro-sub"></p>
      <div class="overlay-actions">
        <button id="btn-start-new" class="primary-btn"></button>
        <button id="btn-resume-save" class="secondary-btn" style="display:none;"></button>
      </div>
    </div>
  </div>

  <!-- Overlay Épilogue / Chapitre majeur -->
  <div id="overlay-chapter" class="overlay-screen" style="display:none;">
    <div class="overlay-card chapter-card">
      <div class="overlay-kicker" id="chap-kicker"></div>
      <h2 class="overlay-title" id="chap-title"></h2>
      <p class="overlay-lead" id="chap-text"></p>
      <div class="chap-unlock" id="chap-unlock" style="display:none;"></div>
      <div class="overlay-actions">
        <button id="btn-chap-continue" class="primary-btn">Continuer</button>
        <button id="btn-chap-reseed" class="secondary-btn" style="display:none;"></button>
      </div>
    </div>
  </div>

  <!-- Modale de confirmation nouvelle partie -->
  <div id="modal-confirm" class="modal-backdrop" style="display:none;z-index:50;">
    <div class="modal-card confirm-card">
      <div class="modal-head">
        <h3 id="confirm-title">Confirmer une nouvelle partie</h3>
      </div>
      <p class="overlay-lead" id="confirm-text"></p>
      <div class="overlay-actions">
        <button type="button" id="btn-confirm-ok" class="danger-btn">Oui, nouvelle partie</button>
        <button type="button" id="btn-confirm-cancel" class="secondary-btn">Annuler</button>
      </div>
    </div>
  </div>

  <script src="textes.js?v=4"></script>
  <script src="scenarios.js?v=4"></script>
  <script src="js/spiral.js?v=4"></script>
  <script src="js/lore.js?v=4"></script>
  <script src="js/world.js?v=4"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/renderer.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
