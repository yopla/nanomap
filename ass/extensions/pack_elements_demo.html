<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Extension : Pack d'Éléments Démo</title>
</head>
<body>
<script>
// Extension Assemblage : pack_elements_demo.html
// Exemple d'extension ajoutant des éléments (base + recettes) avec support du remplacement à chaud.
(function () {
  const FILENAME = "pack_elements_demo.html";

  const EXTRA_ELEMENTS = [
    {
      id: "ext_eclat_comete",
      name: "Éclat de Comète",
      level: 1,
      biome: "plaine_astrale",
      icon: "☄️",
      color: "#7ae8ff",
      description: "Fragment glacé et lumineux apporté par l'extension Pack Démo. Récoltable dans les Plaines Astrales.",
      recipe: []
    },
    {
      id: "ext_lame_comete",
      name: "Lame Cométaire",
      level: 2,
      biome: "",
      icon: "🗡️",
      color: "#8ce0ff",
      description: "Alliage tranchant forgé en combinant un Éclat de Comète et du Minerai de Ferrite.",
      recipe: ["ext_eclat_comete", "ferrite"]
    },
    {
      id: "ext_coeur_comete",
      name: "Cœur de Comète",
      level: 2,
      biome: "",
      icon: "🌟",
      color: "#ffe47a",
      description: "Noyau énergétique stabilisé en associant un Éclat de Comète et un Cristal Luminescent.",
      recipe: ["ext_eclat_comete", "cristal"]
    }
  ];

  // Mode 1 : chargement direct par index.html (HTTP/HTTPS)
  window.AssemblageExtensions = window.AssemblageExtensions || {};
  window.AssemblageExtensions[FILENAME] = {
    onActivate(host, ext) {
      const count = host.game.registerElements(EXTRA_ELEMENTS);
      if (ext.isFreshUnlock) {
        host.ui.showToast(`☄️ Extension activée : +${count} nouveaux éléments ajoutés !`);
      }
    },
    onDeactivate(host) {
      // Le nettoyage automatique est déjà géré par l'hôte, mais on peut aussi appeler unregisterElements().
      if (host && host.game && typeof host.game.unregisterElements === "function") {
        host.game.unregisterElements();
      }
    },
  };

  // Mode 2 : fallback iframe + postMessage (si index.html est ouvert en file://)
  if (window.self !== window.top) {
    window.addEventListener("message", (ev) => {
      const msg = ev.data;
      if (!msg || msg.channel !== "assemblage_host") return;
      if (msg.event === "init") {
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "register_elements",
          elements: EXTRA_ELEMENTS,
        }, "*");
        if (msg.ext && msg.ext.isFreshUnlock) {
          window.parent.postMessage({
            channel: "assemblage_ext",
            filename: FILENAME,
            cmd: "toast",
            text: `☄️ Extension activée : +${EXTRA_ELEMENTS.length} nouveaux éléments ajoutés !`,
          }, "*");
        }
      }
    });
  }
})();
</script>
</body>
</html>
