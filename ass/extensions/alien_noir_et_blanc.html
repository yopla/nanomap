<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Extension : Filtre Alien Noir &amp; Blanc</title>
</head>
<body>
<script>
// Extension Assemblage : alien_noir_et_blanc.html
// Mode 1 : chargement direct par index.html (interception synchrone de drawAlien)
(function () {
  const FILENAME = "alien_noir_et_blanc.html";

  // Remappage couleur JS ultra-rapide (sans ctx.filter, évite les chutes de FPS sur Canvas2D)
  function createGrayscaleMapper(contrast) {
    const c = Number.isFinite(contrast) ? contrast : 1.08;
    const cache = new Map();
    const parseColor = (str) => {
      const s = str.trim();
      if (s.charCodeAt(0) === 35) {
        const hex = s.slice(1);
        if (hex.length === 3 || hex.length === 4) {
          return [
            parseInt(hex[0] + hex[0], 16),
            parseInt(hex[1] + hex[1], 16),
            parseInt(hex[2] + hex[2], 16),
            hex.length === 4 ? parseInt(hex[3] + hex[3], 16) / 255 : 1,
          ];
        }
        if (hex.length === 6 || hex.length === 8) {
          return [
            parseInt(hex.slice(0, 2), 16),
            parseInt(hex.slice(2, 4), 16),
            parseInt(hex.slice(4, 6), 16),
            hex.length === 8 ? parseInt(hex.slice(6, 8), 16) / 255 : 1,
          ];
        }
        return null;
      }
      const m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/i.exec(s);
      if (m) {
        return [Number(m[1]), Number(m[2]), Number(m[3]), m[4] !== undefined ? Number(m[4]) : 1];
      }
      return null;
    };
    return (value) => {
      if (typeof value !== "string") return value;
      const hit = cache.get(value);
      if (hit !== undefined) return hit;
      const rgba = parseColor(value);
      if (!rgba) {
        cache.set(value, value);
        return value;
      }
      let lum = 0.2126 * rgba[0] + 0.7152 * rgba[1] + 0.0722 * rgba[2];
      lum = Math.max(0, Math.min(255, Math.round((lum - 128) * c + 128)));
      const out = rgba[3] >= 0.999
        ? `rgb(${lum},${lum},${lum})`
        : `rgba(${lum},${lum},${lum},${rgba[3]})`;
      cache.set(value, out);
      return out;
    };
  }

  function ensureCtxColorHook(ctx) {
    if (!ctx || ctx.__assemblageColorHooked) return;
    const proto = Object.getPrototypeOf(ctx);
    const fillDesc = Object.getOwnPropertyDescriptor(proto, "fillStyle");
    const strokeDesc = Object.getOwnPropertyDescriptor(proto, "strokeStyle");
    if (!fillDesc || !fillDesc.set || !strokeDesc || !strokeDesc.set) return;

    ctx.__assemblageColorMapper = null;
    ctx.__assemblageColorHooked = true;

    Object.defineProperty(ctx, "fillStyle", {
      configurable: true,
      get() {
        return fillDesc.get.call(this);
      },
      set(val) {
        const mapper = this.__assemblageColorMapper;
        fillDesc.set.call(this, mapper ? mapper(val) : val);
      },
    });

    Object.defineProperty(ctx, "strokeStyle", {
      configurable: true,
      get() {
        return strokeDesc.get.call(this);
      },
      set(val) {
        const mapper = this.__assemblageColorMapper;
        strokeDesc.set.call(this, mapper ? mapper(val) : val);
      },
    });
  }

  window.AssemblageExtensions = window.AssemblageExtensions || {};
  window.AssemblageExtensions[FILENAME] = {
    onActivate(host, ext) {
      const savedState = host.state.get() || {};
      let bwEnabled = Boolean(savedState.bwEnabled);
      const toGray = createGrayscaleMapper(1.08);

      // Interception / déviation de la fonction drawAlien() du HTML de base
      host.hooks.wrap("drawAlien", (originalDrawAlien, timeSec) => {
        if (!bwEnabled) {
          return originalDrawAlien(timeSec);
        }
        const ctx = host.game.ctx;
        ensureCtxColorHook(ctx);
        const prevMapper = ctx.__assemblageColorMapper;
        ctx.__assemblageColorMapper = toGray;
        try {
          return originalDrawAlien(timeSec);
        } finally {
          ctx.__assemblageColorMapper = prevMapper;
        }
      });

      // Ajout du bouton / interrupteur dans le menu Paramètres du HTML de base
      host.ui.addSettingToggle({
        id: "alien_bw",
        label: "Passer l'alien en noir et blanc",
        desc: "Extension " + ext.filename + " — intercepte drawAlien() pour rendre l'alien monochrome.",
        checked: bwEnabled,
        onChange(checked) {
          bwEnabled = Boolean(checked);
          host.state.set({ bwEnabled }, true);
          host.ui.showToast(bwEnabled ? "🎞️ Alien en noir et blanc activé" : "🎨 Couleurs de l'alien restaurées");
        },
      });
    },
    onDeactivate() {
      // Les hooks et le bouton Paramètres sont nettoyés automatiquement par AssemblageHost
    },
  };

  // Mode 2 : fallback iframe + postMessage (si index.html est ouvert en file://)
  if (window.self !== window.top) {
    let bwEnabled = false;
    window.addEventListener("message", (ev) => {
      const msg = ev.data;
      if (!msg || msg.channel !== "assemblage_host") return;
      if (msg.event === "init") {
        bwEnabled = Boolean(msg.state && msg.state.bwEnabled);
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "add_setting_toggle",
          id: "alien_bw",
          label: "Passer l'alien en noir et blanc",
          desc: "Extension " + FILENAME + " — rend l'alien monochrome.",
          checked: bwEnabled,
        }, "*");
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "set_alien_filter",
          filter: bwEnabled ? "grayscale(100%) contrast(1.08)" : "none",
        }, "*");
      } else if (msg.event === "toggle_change" && msg.id === "alien_bw") {
        bwEnabled = Boolean(msg.value);
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "state_set",
          patch: { bwEnabled },
        }, "*");
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "set_alien_filter",
          filter: bwEnabled ? "grayscale(100%) contrast(1.08)" : "none",
        }, "*");
        window.parent.postMessage({
          channel: "assemblage_ext",
          filename: FILENAME,
          cmd: "toast",
          text: bwEnabled ? "🎞️ Alien en noir et blanc activé" : "🎨 Couleurs de l'alien restaurées",
        }, "*");
      }
    });
  }
})();
</script>
</body>
</html>
