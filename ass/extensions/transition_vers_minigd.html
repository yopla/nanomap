<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Extension : Transition vers MiniGD</title>
</head>
<body>
<script type="application/json" data-assemblage-ui-schema>
{
  "fields": [
    {
      "key": "anchorBindings",
      "label": "Associations dynamiques Ancres ↔ MiniGD",
      "type": "minigd_anchors",
      "default": [],
      "hint": "Ajoutez autant d'associations que voulu : chaque ancre déclenche son propre mini-jeu MiniGD à l'approche et se réarme à l'éloignement."
    },
    {
      "key": "minigamePath",
      "label": "Mini-jeu par défaut (bouton Paramètres)",
      "type": "minigd",
      "default": "core/g14a_dimcom_1d.html",
      "hint": "Mini-jeu lancé depuis le bouton Paramètres ou si aucune ancre spécifique n'est fournie (ou Aléatoire)."
    },
    {
      "key": "displayMode",
      "label": "Mode d'affichage",
      "type": "select",
      "default": "auto",
      "options": [
        { "id": "auto", "label": "Auto (selon le mini-jeu)" },
        { "id": "framed", "label": "Encadré (UI externe)" },
        { "id": "fullframe", "label": "Full Frame (plein écran)" }
      ],
      "hint": "En mode Auto, chaque mini-jeu décide s'il s'ouvre dans un cadre avec UI externe ou en plein écran (layout: \"fullframe\")."
    },
    {
      "key": "showSummaryOnStart",
      "label": "Afficher le résumé en pause à la fin de la transition",
      "type": "bool",
      "default": true,
      "hint": "Affiche le résumé du mini-jeu (titre, description, objectif, contrôles) dans un cadre en pause à la fin de la transition ; le jeu démarre ensuite."
    },
    {
      "key": "blurRadiusPx",
      "label": "Flou maximal (px)",
      "type": "number",
      "default": 14,
      "min": 4,
      "max": 32,
      "step": 1
    },
    {
      "key": "blurDurationMs",
      "label": "Durée floutage / mise au net (ms)",
      "type": "number",
      "default": 1000,
      "min": 200,
      "max": 3000,
      "step": 100
    },
    {
      "key": "fadeDurationMs",
      "label": "Durée fondu alpha (ms)",
      "type": "number",
      "default": 500,
      "min": 100,
      "max": 2000,
      "step": 50
    },
    {
      "key": "showInfoButton",
      "label": "Afficher le bouton d'infos (?)",
      "type": "bool",
      "default": true,
      "hint": "Permet de consulter le titre, la description, l'objectif et les contrôles du mini-jeu."
    },
    {
      "key": "settingButtonLabel",
      "label": "Bouton Paramètres",
      "type": "text",
      "default": "Lancer le mini-jeu"
    }
  ]
}
</script>
<style>
  body.minigd-transition-active #settings-btn,
  body.minigd-transition-active #fullscreen-btn,
  body.minigd-transition-active #hint {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #minigd-frozen-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 57;
    pointer-events: none;
    display: block;
    background: #14121f;
  }

  #minigd-transition-overlay {
    position: fixed;
    inset: 0;
    z-index: 58;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: max(14px, env(safe-area-inset-top, 14px)) max(14px, env(safe-area-inset-right, 14px)) max(14px, env(safe-area-inset-bottom, 14px)) max(14px, env(safe-area-inset-left, 14px));
    background: rgba(4, 8, 16, 0);
    touch-action: none;
  }

  #minigd-stage {
    --minigd-size: min(520px, calc(100vw - 28px), calc(100dvh - 230px));
    --minigd-accent: #38d6ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    will-change: opacity;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
  }

  #minigd-stage.has-minimap {
    --minigd-size: min(490px, calc(100vw - 24px), calc(100dvh - 265px));
  }

  #minigd-stage.has-minimap.has-ctrl-picker {
    --minigd-size: min(490px, calc(100vw - 24px), calc(100dvh - 275px));
  }

  #minigd-stage.has-minimap.has-ext-controls {
    --minigd-size: min(440px, calc(100vw - 24px), max(200px, calc(100dvh - 395px)));
  }

  #minigd-top-bar {
    width: var(--minigd-size);
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

  }

  #minigd-stage.has-top-extras #minigd-top-bar {
    gap: 6px;
  }

  #minigd-stage.has-top-extras .minigd-top-big-btn {
    width: 44px;
    height: 38px;
    font-size: 16px;
  }

  #minigd-stage.has-top-extras #minigd-info-btn {
    position: static;
    transform: none;
    margin-left: auto;
    flex-shrink: 0;
  }

  #minigd-stage.has-top-extras #minigd-info-btn:hover {
    transform: scale(1.05);
  }

  .minigd-select-icon-btn {
    position: relative;
    overflow: hidden;
  }

  .minigd-select-icon-btn select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    font-size: 16px;
  }

  .minigd-top-big-btn {
    appearance: none;
    -webkit-appearance: none;
    width: 50px;
    height: 42px;
    border-radius: 999px;
    border: 1.5px solid var(--minigd-accent, #38d6ff);

  .minigd-top-big-btn:hover {

  }

  .minigd-top-big-btn:active {

  }

  .minigd-top-big-btn[disabled] {

  }

  #minigd-header-row {
    width: var(--minigd-size);
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  #minigd-minimap-box {

  }

  #minigd-stage.has-minimap #minigd-minimap-box {
    display: block;
  }

  #minigd-minimap-canvas {
    width: 100%;
    height: 100%;

  }

  #minigd-minimap-badges {

  #minigd-stats-bar {

    align-items: center;
    justify-content: center;
    padding: 6px 12px;

    border: 1px solid rgba(56, 214, 255, 0.42);

    font-weight: 700;

  #minigd-bottom-area {

  #minigd-stage.has-ext-controls #minigd-ext-controls {

  }

  #minigd-stage.has-ext-controls #minigd-fire-btn {

  }

  @media (max-height: 760px) {
    #minigd-stage.has-ext-controls #minigd-hint {
      display: none;
    }
  }

  .minigd-ctrl-left {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
  }

  .minigd-ctrl-canvas {
    display: block;
    touch-action: none;
    border-radius: 12px;
  }

  .minigd-ctrl-pedals {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .minigd-ctrl-pedals-row {
    display: flex;
    gap: 6px;
    align-items: stretch;
  }

  .minigd-pedal-btn {
    appearance: none;
    -webkit-appearance: none;
    min-width: 68px;
    height: 46px;
    padding: 0 10px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;

  }

  .minigd-pedal-btn.gas { border-color: #4ade80; color: #dcfce7; }
  .minigd-pedal-btn.gas.active { background: rgba(34, 197, 94, 0.85); color: #050a12; transform: scale(0.96); }
  .minigd-pedal-btn.brake { border-color: #f87171; color: #fee2e2; }
  .minigd-pedal-btn.brake.active { background: rgba(239, 68, 68, 0.85); color: #050a12; transform: scale(0.96); }
  .minigd-pedal-btn.drift { border-color: #fde047; color: #fef08a; height: 32px; width: 100%; }
  .minigd-pedal-btn.drift.active { background: rgba(250, 204, 21, 0.92); color: #050a12; transform: scale(0.96); }

  .minigd-dpad-row {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }

  .minigd-dpad-btn {
    appearance: none;
    -webkit-appearance: none;
    width: 62px;
    height: 62px;
    border-radius: 12px;
    font-size: 22px;
    font-weight: 800;
    color: #e6f4ff;
    background: rgba(16, 28, 48, 0.92);
    border: 1.5px solid #38d6ff;

  }

  .minigd-dpad-btn.active {

  }

  .minigd-slider-track {

  .minigd-set-btn {

    padding: 5px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .minigd-set-btn:hover { background: #23466d; }

  .minigd-set-tabs {

  }

  .minigd-set-tab {

    border-radius: 7px;

  }

  .minigd-set-tab.active {

    border-color: #38d6ff;
    color: #e6f4ff;

  .minigd-set-body {

    flex-direction: column;

  .minigd-set-pane { display: none; flex-direction: column; gap: 10px; }
  .minigd-set-pane.active { display: flex; }

  .minigd-set-sec {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;

  .minigd-set-select {

    background: #0c1726;

    cursor: pointer;

  }

  .minigd-set-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .minigd-set-row .minigd-set-select { flex: 1; min-width: 0; }

  .minigd-set-param { display: flex; flex-direction: column; gap: 4px; }
  .minigd-set-param-head { display: flex; justify-content: space-between; font-size: 12px; color: #cbe0f5; }
  .minigd-set-param-head span:last-child { color: #fde047; font-weight: 700; font-variant-numeric: tabular-nums; }

  .minigd-set-color input[type=color] { width: 32px; height: 22px; border: none; background: none; padding: 0; cursor: pointer; }

  .minigd-set-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #d6e8f8; cursor: pointer; }

  #minigd-track-draw-canvas {

  .minigd-set-foot .minigd-set-btn { width: 100%; padding: 8px; font-size: 13px; }

  #minigd-bottom-actions {

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  #minigd-ctrl-quick-wrap {
    display: none;
    width: min(var(--minigd-size), 280px);
    position: relative;
  }

  #minigd-stage.has-ctrl-picker #minigd-ctrl-quick-wrap {
    display: flex;
  }

  #minigd-stage.has-ctrl-picker #minigd-hint {

  }

  #minigd-ctrl-quick-select {

    background-position: right 9px center;

  #minigd-ctrl-quick-select option {

  }

    width: min(var(--minigd-size), 280px);

    padding: 7px 16px;
    font-size: 13.5px;
  }

  #minigd-fire-btn {
    appearance: none;
    -webkit-appearance: none;
    width: min(var(--minigd-size), 280px);
    min-height: 46px;

    font-weight: 800;

    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65), 0 0 24px rgba(56, 214, 255, 0.36);
  }

  #minigd-fire-btn:active {
    transform: scale(0.96);
  }

  #minigd-fire-btn[disabled] {
    opacity: 0.45;
    cursor: default;
  }

  #minigd-hint {
    width: 100%;
    font-size: 11.5px;
    color: #9fc4e2;

  #minigd-info-btn {
    appearance: none;
    -webkit-appearance: none;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);

    height: 36px;

            el.style.transition = `filter ${durationMs}ms linear`;
            const r2 = requestAnimationFrame(() => {
              if (!session || session.aborted) { finish(); return; }
              el.style.filter = `blur(${toBlurPx}px)`;
            });
            session.rafIds.add(r2);
          });
          session.rafIds.add(r1);
        });
      }

      async function pickMiniGame(session, overridePath) {
        const rawOverride = typeof overridePath === "string" ? overridePath.trim() : "";
        const rawTarget = rawOverride || host.ui.getConfig("minigamePath", DEFAULT_MINIGAME);
        const hashIdx = String(rawTarget || "").indexOf("#");
        const rawBaseTarget = hashIdx >= 0 ? String(rawTarget).slice(0, hashIdx) : String(rawTarget || "");
        const presetId = hashIdx >= 0 ? String(rawTarget).slice(hashIdx + 1).trim() : "";
        const isTagRandom = rawBaseTarget.startsWith("__tag:");
        const randomTagId = isTagRandom ? rawBaseTarget.slice("__tag:".length).trim() : "";
        const configuredPath = isTagRandom ? "" : normalizeMiniGamePath(rawBaseTarget);
        let games = [];
        let sharedTexts = {};
        try {
          const assetBase = (host && host.ASSEMBLAGE_ASSET_BASE) || window.ASSEMBLAGE_ASSET_BASE || "";
          session.abortController = new AbortController();
          let resp = await fetch(`config/minigd_manifest.json?_ts=${Date.now()}`, {
            cache: "no-store",
            signal: session.abortController.signal,
          }).catch(() => null);
          if (!resp || !resp.ok) {
            resp = await fetch(`${assetBase}extensions/minigd/manifest.json?_ts=${Date.now()}`, {
              cache: "no-store",
              signal: session.abortController.signal,
            });
          }
          if (resp.ok) {
            const data = await resp.json();
            if (data && Array.isArray(data.games)) {
              games = data.games.filter((g) => g && normalizeMiniGamePath(g.path));
            }
            if (data && data.sharedTexts && typeof data.sharedTexts === "object") {
              sharedTexts = data.sharedTexts;
            }
          }
        } catch (_e) {
          if (session.aborted) return null;
        } finally {
          session.abortController = null;
        }

        if (games.length === 0 && window.AssemblageMiniGDManifest && Array.isArray(window.AssemblageMiniGDManifest.games)) {
          games = window.AssemblageMiniGDManifest.games.filter((g) => g && normalizeMiniGamePath(g.path));
          if (window.AssemblageMiniGDManifest.sharedTexts && typeof window.AssemblageMiniGDManifest.sharedTexts === "object") {
            sharedTexts = window.AssemblageMiniGDManifest.sharedTexts;
          }
        }

        function applyPresetToMeta(baseMeta, pId) {
          if (!baseMeta || !pId || !Array.isArray(baseMeta.presets)) return baseMeta;
          const preset = baseMeta.presets.find((p) => p && String(p.id) === pId);
          if (!preset) return baseMeta;
          return Object.assign({}, baseMeta, {
            name: preset.name ? `${baseMeta.name || baseMeta.id} — ${preset.name}` : baseMeta.name,
            icon: preset.icon || baseMeta.icon,
            description: preset.description || baseMeta.description,
            params: Object.assign({}, baseMeta.params || {}, preset.params || {}),
            texts: Object.assign({}, baseMeta.texts || {}, preset.texts || {}),
            rewards: Object.assign({}, baseMeta.rewards || {}, preset.rewards || {}),
            presetId: pId,
          });
        }

        if (configuredPath) {
          const matched = games.find((g) => normalizeMiniGamePath(g.path) === configuredPath) || null;
          const baseMeta = matched || {
            id: configuredPath,
            name: configuredPath.split("/").pop() || "Mini-jeu",
            icon: "🕹️",
            description: "",
            goal: "",
            controls: "",
            params: {},
            texts: {},
            rewards: {},
          };
          const mergedMeta = applyPresetToMeta(baseMeta, presetId);
          return {
            path: configuredPath,
            targetKey: presetId ? `${configuredPath}#${presetId}` : configuredPath,
            presetId,
            sharedTexts,
            meta: mergedMeta,
          };
        }

        let pool = games;
        if (isTagRandom && randomTagId && host.tags && typeof host.tags.matches === "function") {
          const tagged = games.filter((g) => host.tags.matches(g, randomTagId));
          if (tagged.length > 0) pool = tagged;
        }
        if (pool.length > 0) {
          // Privilégier les mini-jeux non encore gagnés s'il y en a
          const unwon = (host.progress && typeof host.progress.getMiniGDResult === "function")
            ? pool.filter((g) => !(host.progress.getMiniGDResult(normalizeMiniGamePath(g.path))?.wins > 0))
            : [];
          const candidates = unwon.length > 0 ? unwon : pool;
          const picked = candidates[Math.floor(Math.random() * candidates.length)];
          const pPath = normalizeMiniGamePath(picked.path) || DEFAULT_MINIGAME;
          return {
            path: pPath,
            targetKey: pPath,
            presetId: "",
            sharedTexts,
            meta: picked,
          };
        }

        return {
          path: DEFAULT_MINIGAME,
          targetKey: DEFAULT_MINIGAME,
          presetId: "",
          sharedTexts,
          meta: {
            id: "g14a_dimcom_1d",
            name: "Combat 1D Lumineux (DimCom 1D)",
            icon: "➖",
            description: "Combat sur une seule dimension lumineuse horizontale avec explosions en chaîne.",
            goal: "Atteindre 90 points en moins de 55 secondes sans perdre vos 3 boucliers.",
            controls: "Flèches Gauche/Droite ou Q/D (ou glisser) • Espace / Z / Clic : tirer puis détoner.",
            params: {},
            texts: {},
          },
        };
      }

      function animateInfoCardFadeBlur(session, el, show, durationMs) {
        return new Promise((resolve) => {
          if (!session || session.aborted || !el) {
            resolve();
            return;
          }
          const fromOpacity = show ? 0 : 1;
          const toOpacity = show ? 1 : 0;
          const fromBlur = show ? blurRadiusPx : 0;
          const toBlur = show ? 0 : blurRadiusPx;

          if (show) el.classList.add("open");

          if (durationMs <= 0) {
            el.style.transition = "";
            el.style.willChange = "";
            el.style.opacity = String(toOpacity);
            el.style.filter = toBlur > 0 ? `blur(${toBlur}px)` : "none";
            if (!show) el.classList.remove("open");
            resolve();
            return;
          }

          el.style.willChange = "opacity, filter";
          el.style.transition = "none";
          el.style.opacity = String(fromOpacity);
          el.style.filter = fromBlur > 0 ? `blur(${fromBlur}px)` : "none";
          void el.offsetWidth;

          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            el.style.transition = "";
            el.style.willChange = "";
            if (show) {
              el.style.opacity = "1";
              el.style.filter = "none";
            } else {
              el.classList.remove("open");
              el.style.opacity = "";
              el.style.filter = "";
            }
            resolve();
          };

          const tid = setTimeout(finish, durationMs + 50);
          session.timerIds.add(tid);

          const r1 = requestAnimationFrame(() => {
            if (!session || session.aborted) { finish(); return; }
            el.style.transition = `opacity ${durationMs}ms ease, filter ${durationMs}ms ease`;
            const r2 = requestAnimationFrame(() => {
              if (!session || session.aborted) { finish(); return; }
              el.style.opacity = String(toOpacity);
              el.style.filter = toBlur > 0 ? `blur(${toBlur}px)` : "none";
            });
            session.rafIds.add(r2);
          });
          session.rafIds.add(r1);
        });
      }

        const sendIframeMsg = (payload) => {
          try {

              iframe.contentWindow.postMessage(payload, "*");

          } catch (_e) {}
        };

        const drawMinimap = () => {
          if (!session.capabilities.minimap || !minimapCanvas) return;
          const mw = 118, mh = 66;
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          if (minimapCanvas.width !== Math.round(mw * dpr) || minimapCanvas.height !== Math.round(mh * dpr)) {
            minimapCanvas.width = Math.round(mw * dpr);
            minimapCanvas.height = Math.round(mh * dpr);
          }
          const mctx = minimapCanvas.getContext("2d");
          mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          mctx.clearRect(0, 0, mw, mh);

          const tr = session.minimapTrack;
          if (tr && Array.isArray(tr.points) && tr.points.length >= 2 && tr.bounds) {
            const b = tr.bounds;
            const bw = Math.max(1, (b.maxX ?? 2000) - (b.minX ?? 0));
            const bh = Math.max(1, (b.maxY ?? 1500) - (b.minY ?? 0));
            const pad = 7;
            const sc = Math.min((mw - pad * 2) / bw, (mh - pad * 2) / bh);
            const ox = (mw - bw * sc) * 0.5 - (b.minX ?? 0) * sc;
            const oy = (mh - bh * sc) * 0.5 - (b.minY ?? 0) * sc;

            mctx.strokeStyle = "rgba(148, 163, 184, 0.72)";
            mctx.lineWidth = 3;
            mctx.beginPath();
            for (let i = 0; i <= tr.points.length; i++) {
              const pt = tr.points[i % tr.points.length];
              const x = ox + pt[0] * sc, y = oy + pt[1] * sc;
              if (i === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);
            }
            mctx.stroke();

            const p0 = tr.points[0];
            mctx.fillStyle = "#4ade80";
            mctx.beginPath();
            mctx.arc(ox + p0[0] * sc, oy + p0[1] * sc, 2.8, 0, Math.PI * 2);
            mctx.fill();

            const st = session.minimapState;
            if (st) {
              if (typeof st.cpX === "number" && typeof st.cpY === "number") {
                mctx.fillStyle = "#fde047";
                mctx.beginPath();
                mctx.arc(ox + st.cpX * sc, oy + st.cpY * sc, 2.8, 0, Math.PI * 2);
                mctx.fill();
              }
              if (typeof st.carX === "number" && typeof st.carY === "number") {
                const cx = ox + st.carX * sc, cy = oy + st.carY * sc;
                mctx.fillStyle = "#38d6ff";
                mctx.beginPath();
                mctx.arc(cx, cy, 3.6, 0, Math.PI * 2);
                mctx.fill();
                mctx.strokeStyle = "#ffffff";
                mctx.lineWidth = 1;
                mctx.stroke();
                if (typeof st.carRot === "number") {
                  mctx.beginPath();
                  mctx.moveTo(cx, cy);
                  mctx.lineTo(cx + Math.cos(st.carRot) * 6.5, cy + Math.sin(st.carRot) * 6.5);
                  mctx.strokeStyle = "#fde047";
                  mctx.lineWidth = 1.6;
                  mctx.stroke();
                }
              }
              mmDriftBadge.style.display = st.drifting ? "inline-block" : "none";
              mmTurboBadge.style.display = st.boosting ? "inline-block" : "none";
            }
          }
        };

        const clearExtControlsListeners = () => {
          for (const fn of session.extControlCleanups) {
            try { fn(); } catch (_e) {}
          }
          session.extControlCleanups.clear();
        };

        const clearExternalInput = () => {
          sendIframeMsg({
            type: "minigd_external_input",
            steer: 0,
            throttle: 0,
            handbrake: false,
            targetHeadingAngle: null,
            active: false,
          });
        };

        const buildExternalControls = () => {
          clearExtControlsListeners();
          extControls.innerHTML = "";
          const cs = session.controlState;
          if (!cs || (cs.placement !== "external" && cs.placement !== "hybrid")) {
            stage.classList.remove("has-ext-controls");
            clearExternalInput();
            return;
          }
          stage.classList.add("has-ext-controls");

          let curSteer = 0, curThrottle = 0, curHandbrake = false, curTargetAng = null;
          const emitExt = () => {
            if (!session.interactive || session.infoOpen || session.settingsOpen) return;
            sendIframeMsg({
              type: "minigd_external_input",
              steer: curSteer,
              throttle: curThrottle,
              handbrake: curHandbrake,
              targetHeadingAngle: curTargetAng,
              active: Math.abs(curSteer) > 0.01 || Math.abs(curThrottle) > 0.01 || curHandbrake || curTargetAng !== null,
            });
          };

          const addTracked = (target, ev, fn, opts) => {
            target.addEventListener(ev, fn, opts);
            session.extControlCleanups.add(() => target.removeEventListener(ev, fn, opts));
          };

          const makePedals = () => {
            const wrap = document.createElement("div");
            wrap.className = "minigd-ctrl-pedals";
            const driftBtn = document.createElement("button");
            driftBtn.type = "button";
            driftBtn.className = "minigd-pedal-btn drift";
            driftBtn.textContent = "DRIFT";

            const row = document.createElement("div");
            row.className = "minigd-ctrl-pedals-row";
            const brakeBtn = document.createElement("button");
            brakeBtn.type = "button";
            brakeBtn.className = "minigd-pedal-btn brake";
            brakeBtn.textContent = "FREIN ⬇";
            const gasBtn = document.createElement("button");
            gasBtn.type = "button";
            gasBtn.className = "minigd-pedal-btn gas";
            gasBtn.textContent = "GAZ ⬆";

            const activeIds = { gas: null, brake: null, drift: null };
            const recompute = () => {
              curThrottle = activeIds.gas !== null ? 1.0 : (activeIds.brake !== null ? -1.0 : 0.0);
              curHandbrake = activeIds.drift !== null;
              gasBtn.classList.toggle("active", activeIds.gas !== null);
              brakeBtn.classList.toggle("active", activeIds.brake !== null);
              driftBtn.classList.toggle("active", activeIds.drift !== null);
              emitExt();
            };

            const bindHold = (btn, key) => {
              addTracked(btn, "pointerdown", (e) => {
                e.preventDefault();
                activeIds[key] = e.pointerId !== undefined ? e.pointerId : 1;
                recompute();
              });
              addTracked(btn, "touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
              addTracked(btn, "touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
              addTracked(btn, "contextmenu", (e) => e.preventDefault());
              const rel = (e) => {
                const pid = e.pointerId !== undefined ? e.pointerId : 1;
                if (activeIds[key] === pid) { activeIds[key] = null; recompute(); }
              };
              addTracked(window, "pointerup", rel);
              addTracked(window, "pointercancel", rel);
            };
            bindHold(gasBtn, "gas");
            bindHold(brakeBtn, "brake");
            bindHold(driftBtn, "drift");

            row.appendChild(brakeBtn);
            row.appendChild(gasBtn);
            wrap.appendChild(driftBtn);
            wrap.appendChild(row);
            return wrap;
          };

          const leftBox = document.createElement("div");
          leftBox.className = "minigd-ctrl-left";
          extControls.appendChild(leftBox);

          if (cs.type === "floating_n_way") {
            leftBox.style.fontSize = "11.5px";
            leftBox.style.color = "#9fc4e2";
            leftBox.style.textAlign = "center";
            leftBox.textContent = "Glissez dans le cadre pour orienter";
            extControls.appendChild(makePedals());
          } else if (cs.type === "buttons_dpad") {
            const row = document.createElement("div");
            row.className = "minigd-dpad-row";
            const bL = document.createElement("button");
            bL.type = "button"; bL.className = "minigd-dpad-btn"; bL.textContent = "◀";
            const bR = document.createElement("button");
            bR.type = "button"; bR.className = "minigd-dpad-btn"; bR.textContent = "▶";
            let lId = null, rId = null;
            const upd = () => {
              curSteer = (lId !== null ? -1 : 0) + (rId !== null ? 1 : 0);
              bL.classList.toggle("active", lId !== null);
              bR.classList.toggle("active", rId !== null);
              emitExt();
            };
            addTracked(bL, "pointerdown", (e) => { e.preventDefault(); lId = e.pointerId ?? 1; upd(); });
            addTracked(bR, "pointerdown", (e) => { e.preventDefault(); rId = e.pointerId ?? 2; upd(); });
            addTracked(bL, "touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(bR, "touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(bL, "touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(bR, "touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(bL, "contextmenu", (e) => e.preventDefault());
            addTracked(bR, "contextmenu", (e) => e.preventDefault());
            const endDp = (e) => {
              const pid = e.pointerId ?? 1;
              if (lId === pid) { lId = null; upd(); }
              if (rId === pid) { rId = null; upd(); }
            };
            addTracked(window, "pointerup", endDp);
            addTracked(window, "pointercancel", endDp);
            row.appendChild(bL);
            row.appendChild(bR);
            leftBox.appendChild(row);
            extControls.appendChild(makePedals());
          } else if (cs.type === "slider_tilt") {
            const track = document.createElement("div");
            track.className = "minigd-slider-track";
            const thumb = document.createElement("div");
            thumb.className = "minigd-slider-thumb";
            track.appendChild(thumb);
            let sId = null;
            const updateSl = (clientX) => {
              const r = track.getBoundingClientRect();
              const maxOff = Math.max(10, r.width * 0.5 - 20);
              const off = Math.max(-maxOff, Math.min(maxOff, clientX - (r.left + r.width * 0.5)));
              curSteer = off / maxOff;
              thumb.style.left = `calc(50% + ${off.toFixed(1)}px)`;
              emitExt();
            };
            addTracked(track, "pointerdown", (e) => { e.preventDefault(); sId = e.pointerId ?? 1; updateSl(e.clientX); });
            addTracked(track, "touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(track, "touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(track, "contextmenu", (e) => e.preventDefault());
            addTracked(window, "pointermove", (e) => { if (sId === (e.pointerId ?? 1)) updateSl(e.clientX); });
            const endSl = (e) => {
              if (sId === (e.pointerId ?? 1)) { sId = null; curSteer = 0; thumb.style.left = "50%"; emitExt(); }
            };
            addTracked(window, "pointerup", endSl);
            addTracked(window, "pointercancel", endSl);
            leftBox.appendChild(track);
            extControls.appendChild(makePedals());
          } else {
            const size = cs.type === "fixed_bottom_n_way" ? 118 : 100;
            const cv = document.createElement("canvas");
            cv.className = "minigd-ctrl-canvas";
            cv.width = size;
            cv.height = size;
            cv.style.width = size + "px";
            cv.style.height = size + "px";
            leftBox.appendChild(cv);
            if (cs.type !== "fixed_bottom_n_way") {
              extControls.appendChild(makePedals());
            }

            const cctx = cv.getContext("2d");
            let pid = null, hx = 0, hy = 0, wAng = 0, nSector = -1;
            const cx = size * 0.5, cy = size * 0.5, rad = size * 0.42;

            const drawW = () => {
              cctx.clearRect(0, 0, size, size);
              if (cs.type === "joystick") {
                cctx.fillStyle = "rgba(10, 18, 32, 0.9)";
                cctx.beginPath(); cctx.arc(cx, cy, rad, 0, Math.PI * 2); cctx.fill();
                cctx.strokeStyle = "rgba(56, 214, 255, 0.55)"; cctx.lineWidth = 2; cctx.stroke();
                cctx.fillStyle = "rgba(56, 214, 255, 0.9)";
                cctx.beginPath(); cctx.arc(cx + hx, cy + hy, rad * 0.42, 0, Math.PI * 2); cctx.fill();
                cctx.strokeStyle = "#e6f4ff"; cctx.lineWidth = 1.5; cctx.stroke();
              } else if (cs.type === "steering_wheel") {
                cctx.save();
                cctx.translate(cx, cy);
                cctx.rotate(wAng);
                cctx.strokeStyle = "rgba(56, 214, 255, 0.88)"; cctx.lineWidth = 10;
                cctx.beginPath(); cctx.arc(0, 0, rad - 4, 0, Math.PI * 2); cctx.stroke();
                cctx.lineWidth = 4;
                cctx.beginPath();
                cctx.moveTo(-(rad - 6), 0); cctx.lineTo(rad - 6, 0);
                cctx.moveTo(0, 0); cctx.lineTo(0, rad - 6);
                cctx.stroke();
                cctx.fillStyle = "#f87171";
                cctx.beginPath(); cctx.arc(0, -(rad - 4), 5, 0, Math.PI * 2); cctx.fill();
                cctx.restore();
              } else {
                const count = Math.max(2, cs.nWayDirections || 4);
                const stepAng = (Math.PI * 2) / count;
                const offsetAng = cs.nWayShiftedHalfStep ? (stepAng * 0.5) : 0.0;
                const dz = rad * 0.24;
                cctx.fillStyle = "rgba(10, 18, 32, 0.92)";
                cctx.beginPath(); cctx.arc(cx, cy, rad, 0, Math.PI * 2); cctx.fill();
                if (nSector !== -1) {
                  const midAng = nSector * stepAng + offsetAng;
                  cctx.fillStyle = "rgba(74, 222, 128, 0.45)";
                  cctx.beginPath(); cctx.moveTo(cx, cy);
                  cctx.arc(cx, cy, rad, midAng - stepAng * 0.5, midAng + stepAng * 0.5);
                  cctx.closePath(); cctx.fill();
                }
                cctx.strokeStyle = "rgba(255,255,255,0.28)"; cctx.lineWidth = 1.5;
                for (let i = 0; i < count; i++) {
                  const divAng = (i + 0.5) * stepAng + offsetAng;
                  cctx.beginPath();
                  cctx.moveTo(cx + Math.cos(divAng) * dz, cy + Math.sin(divAng) * dz);
                  cctx.lineTo(cx + Math.cos(divAng) * rad, cy + Math.sin(divAng) * rad);
                  cctx.stroke();
                }
                cctx.strokeStyle = "#38d6ff"; cctx.lineWidth = 2;
                cctx.beginPath(); cctx.arc(cx, cy, rad, 0, Math.PI * 2); cctx.stroke();
                cctx.fillStyle = "#38d6ff";
                cctx.beginPath(); cctx.arc(cx + hx, cy + hy, 12, 0, Math.PI * 2); cctx.fill();
                cctx.strokeStyle = "#e6f4ff"; cctx.lineWidth = 1.5; cctx.stroke();
              }
            };

            const applyPtr = (clientX, clientY) => {
              const r = cv.getBoundingClientRect();
              const px = (clientX - r.left) * (size / Math.max(1, r.width));
              const py = (clientY - r.top) * (size / Math.max(1, r.height));
              const dx = px - cx, dy = py - cy;
              const dist = Math.hypot(dx, dy);
              if (cs.type === "joystick") {
                if (dist > 0.001) {
                  const cl = Math.min(dist, rad);
                  hx = (dx / dist) * cl; hy = (dy / dist) * cl;
                  curSteer = hx / rad;
                  if (Math.abs(hy) > 10) curThrottle = -hy / rad;
                } else {
                  hx = 0; hy = 0; curSteer = 0;
                }
              } else if (cs.type === "steering_wheel") {
                let ang = Math.atan2(dy, dx) + Math.PI * 0.5;
                while (ang > Math.PI) ang -= Math.PI * 2;
                while (ang < -Math.PI) ang += Math.PI * 2;
                const maxWheelAng = Math.PI * 0.5; // Bloqué à 180° (-90° / +90°)
                wAng = Math.max(-maxWheelAng, Math.min(maxWheelAng, ang));
                curSteer = wAng / maxWheelAng;
              } else {
                const count = Math.max(2, cs.nWayDirections || 4);
                const stepAng = (Math.PI * 2) / count;
                const offsetAng = cs.nWayShiftedHalfStep ? (stepAng * 0.5) : 0.0;
                const dz = rad * 0.24;
                const cl = Math.min(dist, rad);
                hx = dist > 0.001 ? (dx / dist) * cl : 0;
                hy = dist > 0.001 ? (dy / dist) * cl : 0;
                if (dist >= dz) {
                  const rawAng = Math.atan2(dy, dx);
                  const k = Math.round((rawAng - offsetAng) / stepAng);
                  nSector = ((k % count) + count) % count;
                  curTargetAng = k * stepAng + offsetAng;
                  curThrottle = cs.nWayDistanceAffectsSpeed ? Math.max(0.2, Math.min(1.0, (dist - dz) / Math.max(1, rad - dz))) : 1.0;
                } else {
                  nSector = -1; curTargetAng = null; curThrottle = 0;
                }
              }
              drawW();
              emitExt();
            };

            drawW();
            addTracked(cv, "pointerdown", (e) => {
              e.preventDefault();
              pid = e.pointerId ?? 1;
              applyPtr(e.clientX, e.clientY);
            });
            addTracked(cv, "touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(cv, "touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            addTracked(cv, "contextmenu", (e) => e.preventDefault());
            addTracked(window, "pointermove", (e) => {
              if (pid === (e.pointerId ?? 1)) applyPtr(e.clientX, e.clientY);
            });
            const endW = (e) => {
              if (pid === (e.pointerId ?? 1)) {
                pid = null;
                hx = 0; hy = 0; wAng = 0; nSector = -1;
                curSteer = 0; curTargetAng = null;
                if (cs.type === "fixed_bottom_n_way") curThrottle = 0;
                drawW();
                emitExt();
              }
            };
            addTracked(window, "pointerup", endW);
            addTracked(window, "pointercancel", endW);
          }
        };

        let activeSetTab = "skin";
        let applyPresetPhysics = true;
        let drawnTrackPts = [];
        let isDrawingTrack = false;
        let pendingSettingsModalRebuild = false;
        let lastRenderedControlType = null;

        const renderSettingsModalContent = () => {
          const st = session.settingsState;
          if (!st) return;
          const prevBody = settingsOverlay.querySelector(".minigd-set-body");
          const prevScrollTop = prevBody ? prevBody.scrollTop : 0;
          lastRenderedControlType = st.controlType;
          pendingSettingsModalRebuild = false;
          settingsOverlay.innerHTML = "";

          const card = document.createElement("div");
          card.id = "minigd-settings-card";
          card.addEventListener("click", (e) => e.stopPropagation());

          const head = document.createElement("div");
          head.className = "minigd-set-head";
          head.innerHTML = `<h3>⚙️ Réglages ${escapeHtml(session.meta?.name || "Mini-jeu")}</h3>`;
          const closeTop = document.createElement("button");
          closeTop.type = "button";
          closeTop.className = "minigd-set-btn";
          closeTop.textContent = "✕";
          closeTop.addEventListener("click", () => closeSettingsModal());
          head.appendChild(closeTop);

          const tabs = document.createElement("div");
          tabs.className = "minigd-set-tabs";
          const tabDefs = [
            { id: "skin", label: "🎨 Skin" },
            { id: "physics", label: "⚙️ Physique" },
            { id: "track", label: "🛣️ Circuit" },
          ];
          if (!tabDefs.some((t) => t.id === activeSetTab)) activeSetTab = "skin";

          const body = document.createElement("div");
          body.className = "minigd-set-body";

          const panes = {};
          tabDefs.forEach((td) => {
            const tb = document.createElement("button");
            tb.type = "button";
            tb.className = "minigd-set-tab" + (activeSetTab === td.id ? " active" : "");
            tb.textContent = td.label;
            tb.addEventListener("click", () => {
              activeSetTab = td.id;
              tabs.querySelectorAll(".minigd-set-tab").forEach((b, idx) => {
                b.classList.toggle("active", tabDefs[idx].id === activeSetTab);
              });
              Object.keys(panes).forEach((k) => {
                panes[k].classList.toggle("active", k === activeSetTab);
              });
            });
            tabs.appendChild(tb);

            const pane = document.createElement("div");
            pane.className = "minigd-set-pane" + (activeSetTab === td.id ? " active" : "");
            panes[td.id] = pane;
            body.appendChild(pane);
          });

          const addRange = (parent, label, min, max, step, val, fmt, onChange) => {
            const wrap = document.createElement("div");
            wrap.className = "minigd-set-param";
            const h = document.createElement("div");
            h.className = "minigd-set-param-head";
            const l = document.createElement("span");
            l.textContent = label;
            const vEl = document.createElement("span");
            vEl.textContent = fmt(val);
            h.appendChild(l);
            h.appendChild(vEl);
            const inp = document.createElement("input");
            inp.type = "range";
            inp.min = String(min); inp.max = String(max); inp.step = String(step);
            inp.value = String(val);
            inp.addEventListener("input", () => {
              const num = parseFloat(inp.value);
              vEl.textContent = fmt(num);
              onChange(num);
            });
            wrap.appendChild(h);
            wrap.appendChild(inp);
            parent.appendChild(wrap);
            return wrap;
          };

          const addCheck = (parent, label, checked, onChange) => {
            const lbl = document.createElement("label");
            lbl.className = "minigd-set-check";
            const inp = document.createElement("input");
            inp.type = "checkbox";
            inp.checked = !!checked;
            inp.addEventListener("change", () => onChange(inp.checked));
            const sp = document.createElement("span");
            sp.textContent = label;
            lbl.appendChild(inp);
            lbl.appendChild(sp);
            parent.appendChild(lbl);
          };

          // Tab 1: Skin (tous les paramètres de skin)
          const pSkin = panes.skin;
          pSkin.innerHTML = `<div class="minigd-set-sec">Modèle de véhicule</div>`;
          const selPreset = document.createElement("select");
          selPreset.className = "minigd-set-select";
          (st.presets || []).forEach((pr) => {
            const o = document.createElement("option");
            o.value = pr.id; o.textContent = pr.name;
            selPreset.appendChild(o);
          });
          selPreset.value = st.car.id;
          selPreset.addEventListener("change", () => {
            pendingSettingsModalRebuild = true;
            sendIframeMsg({ type: "minigd_settings_action", action: "select_preset", id: selPreset.value, applyPhysics: applyPresetPhysics });
          });
          pSkin.appendChild(selPreset);
          addCheck(pSkin, "Appliquer aussi la physique du modèle", applyPresetPhysics, (v) => { applyPresetPhysics = v; });

          const secCol = document.createElement("div");
          secCol.className = "minigd-set-sec";
          secCol.textContent = "Couleurs personnalisées";
          pSkin.appendChild(secCol);

          const colRow = document.createElement("div");
          colRow.className = "minigd-set-row";
          const mkCol = (lblTxt, cur, key) => {
            const lb = document.createElement("label");
            lb.className = "minigd-set-color";
            const sp = document.createElement("span");
            sp.textContent = lblTxt;
            const inp = document.createElement("input");
            inp.type = "color";
            inp.value = cur;
            inp.addEventListener("input", () => {
              st.car[key] = inp.value;
              sendIframeMsg({ type: "minigd_settings_update", patch: { [key]: inp.value } });
            });
            lb.appendChild(sp);
            lb.appendChild(inp);
            return lb;
          };
          colRow.appendChild(mkCol("Carrosserie", st.car.color, "color"));
          colRow.appendChild(mkCol("Bordure / Accent", st.car.accent, "accent"));
          pSkin.appendChild(colRow);

          const secLiv = document.createElement("div");
          secLiv.className = "minigd-set-sec";
          secLiv.textContent = "Motif / Livrée";
          pSkin.appendChild(secLiv);
          const selLiv = document.createElement("select");
          selLiv.className = "minigd-set-select";
          (st.liveries || []).forEach((lv) => {
            const o = document.createElement("option");
            o.value = lv.id; o.textContent = lv.label;
            selLiv.appendChild(o);
          });
          selLiv.value = st.car.livery;
          selLiv.addEventListener("change", () => {
            st.car.livery = selLiv.value;
            sendIframeMsg({ type: "minigd_settings_update", patch: { livery: selLiv.value } });
          });
          pSkin.appendChild(selLiv);

          // Tab 3: Circuit
          const pTrack = panes.track;
          const secTr1 = document.createElement("div");
          secTr1.className = "minigd-set-sec";
          secTr1.textContent = "Générateur rapide";
          pTrack.appendChild(secTr1);

          const trRow = document.createElement("div");
          trRow.className = "minigd-set-row";
          const selTr = document.createElement("select");
          selTr.className = "minigd-set-select";
          [
            { id: "classic", lbl: "🏁 Classique" },
            { id: "oval", lbl: "🏎️ Ovale Rapide" },
            { id: "technical", lbl: "🌀 Sinueux" },
            { id: "random", lbl: "🎲 Aléatoire" },
          ].forEach((oDef) => {
            const o = document.createElement("option");
            o.value = oDef.id; o.textContent = oDef.lbl;
            selTr.appendChild(o);
          });
          const btnGenTr = document.createElement("button");
          btnGenTr.type = "button";
          btnGenTr.className = "minigd-set-btn";
          btnGenTr.textContent = "⚡ Charger";
          btnGenTr.addEventListener("click", () => {
            sendIframeMsg({ type: "minigd_settings_action", action: "generate_track", style: selTr.value });
            closeSettingsModal();
          });
          trRow.appendChild(selTr);
          trRow.appendChild(btnGenTr);
          pTrack.appendChild(trRow);

          const secTr2 = document.createElement("div");
          secTr2.className = "minigd-set-sec";
          secTr2.textContent = "Dessiner un circuit fermé à la main";
          pTrack.appendChild(secTr2);

          const pad = document.createElement("canvas");
          pad.id = "minigd-track-draw-canvas";
          pad.width = 360; pad.height = 190;
          const padCtx = pad.getContext("2d");
          const trHint = document.createElement("div");
          trHint.style.fontSize = "11px";
          trHint.style.color = "#8fb4d4";
          trHint.textContent = "Tracez une boucle continue puis validez.";

          const drawPad = () => {
            const w = pad.width, h = pad.height;
            padCtx.fillStyle = "#08121f";
            padCtx.fillRect(0, 0, w, h);
            padCtx.strokeStyle = "rgba(56, 214, 255, 0.12)";
            padCtx.lineWidth = 1;
            for (let x = 30; x < w; x += 30) { padCtx.beginPath(); padCtx.moveTo(x, 0); padCtx.lineTo(x, h); padCtx.stroke(); }
            for (let y = 30; y < h; y += 30) { padCtx.beginPath(); padCtx.moveTo(0, y); padCtx.lineTo(w, y); padCtx.stroke(); }
            if (drawnTrackPts.length > 1) {
              padCtx.strokeStyle = "#334155";
              padCtx.lineWidth = 16;
              padCtx.lineCap = "round";
              padCtx.lineJoin = "round";
              padCtx.beginPath();
              padCtx.moveTo(drawnTrackPts[0].x, drawnTrackPts[0].y);
              for (let i = 1; i < drawnTrackPts.length; i++) padCtx.lineTo(drawnTrackPts[i].x, drawnTrackPts[i].y);
              if (!isDrawingTrack && drawnTrackPts.length >= 6) padCtx.closePath();
              padCtx.stroke();
              padCtx.strokeStyle = "#38d6ff";
              padCtx.lineWidth = 2;
              padCtx.setLineDash([4, 4]);
              padCtx.stroke();
              padCtx.setLineDash([]);
              padCtx.fillStyle = "#4ade80";
              padCtx.beginPath(); padCtx.arc(drawnTrackPts[0].x, drawnTrackPts[0].y, 5, 0, Math.PI * 2); padCtx.fill();
            }

            const r = pad.getBoundingClientRect();
            return { x: (ev.clientX - r.left) * (pad.width / Math.max(1, r.width)), y: (ev.clientY - r.top) * (pad.height / Math.max(1, r.height)) };
          };

        const exitMiniGame = async () => {
          if (session.aborted || session.exiting) return;
          session.exiting = true;
          session.interactive = false;

          session.settingsOpen = false;
          infoCard.classList.remove("open");

          settingsOverlay.innerHTML = "";
          clearExternalInput();
          clearExtControlsListeners();

          exitBtn.disabled = true;
          exitBtn.style.pointerEvents = "none";
          resetBtn.disabled = true;
          resetBtn.style.pointerEvents = "none";
          audioBtn.disabled = true;

          settingsBtn.disabled = true;
          settingsBtn.style.pointerEvents = "none";
          setQuickPickersEnabled(false);
          fireBtn.disabled = true;
          fireBtn.style.pointerEvents = "none";
          extControls.style.pointerEvents = "none";
          if (infoBtn) infoBtn.style.pointerEvents = "none";
          iframe.style.pointerEvents = "none";

          // 1. Pause et floutage du mini-jeu en 1 seconde, puis fondu alpha et mise au net superposés
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage({ type: "minigd_pause" }, "*");

          const miniBlurPromise = animateFilterCss(session, iframe, 0, blurRadiusPx, blurDurationMs);

          const blurOverlapMs = Math.round(blurDurationMs * (2 / 3));
          await new Promise((resolve) => {
            const tid = setTimeout(resolve, blurOverlapMs);

          const fadeOutPromise = animateValue(session, fadeDurationMs, (e) => {
            if (session.stage) session.stage.style.opacity = String((1 - e).toFixed(4));

          const fadeOverlapMs = Math.round(fadeDurationMs * (2 / 3));
          await new Promise((resolve) => {
            const tid = setTimeout(resolve, fadeOverlapMs);
            session.timerIds.add(tid);
          });
          if (session.aborted) return;

          // 3. Mise au net du jeu principal en 1 seconde (fondu inverse sans saut ni CSS filter)
          if (canvas) canvas.style.visibility = "";
          if (session.frozenBg) {
            session.frozenBg.style.willChange = "opacity";
          } else if (canvas) {
            canvas.style.willChange = "filter";
          }
          const mainUnblurPromise = animateValue(session, blurDurationMs, (e) => {
            if (session.frozenBg) {
              session.frozenBg.style.opacity = String((1 - e).toFixed(4));
            } else if (canvas) {
              const blurVal = (1 - e) * blurRadiusPx;
              canvas.style.filter = `blur(${blurVal.toFixed(2)}px)`;
            }
            if (session.overlay) session.overlay.style.background = `rgba(4, 8, 16, ${(0.52 * (1 - e)).toFixed(3)})`;
          });

          await Promise.all([miniBlurPromise, fadeOutPromise]);
          if (session.aborted) return;

          // 4. Destruction propre de l'iframe du mini-jeu une fois le fondu terminé
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage({ type: "minigd_destroy" }, "*");
            }
          } catch (_e) {}
          try { iframe.src = "about:blank"; } catch (_e) {}
          if (session.iframe) {
            session.iframe.remove();
            session.iframe = null;
          }
          if (session.stage) {
            session.stage.remove();
            session.stage = null;
          }

          await mainUnblurPromise;
          if (session.aborted) return;

          // 5. Nettoyage complet & sortie de pause du jeu principal
          destroySession(session);
          try { window.focus(); } catch (_e) {}
        };

        exitBtn.addEventListener("click", () => {
          exitMiniGame();
        });

        resetBtn.addEventListener("click", () => {
          if (session.aborted || session.exiting || !session.interactive) return;
          clearExternalInput();
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                type: "minigd_reset",
                meta: session.meta,
                params: session.resolvedParams,
                texts: session.resolvedTexts,
                custom: Object.assign({}, session.resolvedParams, { texts: session.resolvedTexts }),
              }, "*");
              iframe.contentWindow.focus();
            }
          } catch (_e) {}
        });

        const triggerOuterFire = () => {
          if (session.aborted || session.exiting || !session.interactive || session.infoOpen || session.settingsOpen) return;
          try {
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage({ type: "minigd_action", action: "fire" }, "*");
              iframe.contentWindow.focus();
            }
          } catch (_e) {}
        };
        fireBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          triggerOuterFire();
        });
        fireBtn.addEventListener("touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
        fireBtn.addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
        fireBtn.addEventListener("contextmenu", (e) => e.preventDefault());
        stage.addEventListener("contextmenu", (e) => e.preventDefault());
        stage.addEventListener("selectstart", (e) => {
          const tag = e.target && e.target.tagName;
          if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") e.preventDefault();
        });
        fireBtn.addEventListener("click", (e) => {
          if (e.detail === 0) triggerOuterFire();
        });

        session.onMessage = (ev) => {
          if (session.aborted) return;
          if (ev && ev.source && iframe && iframe.contentWindow && ev.source !== iframe.contentWindow) return;
          const d = ev && ev.data;
          if (!d || typeof d !== "object") return;
          if (d.type === "minigd_ready") {
            session.iframeReady = true;
            const iframeMeta = (d.meta && typeof d.meta === "object") ? d.meta : {};
            const mergedMeta = Object.assign({}, iframeMeta, session.manifestMeta || {});
            session.meta = mergedMeta;
            session.resolvedParams = resolveMiniGameParams(iframeMeta, session.manifestMeta);
            session.resolvedTexts = resolveMiniGameTexts(iframeMeta, session.manifestMeta, session.sharedTexts);
            stage.style.setProperty("--minigd-accent", session.meta.accentColor || ext.accentColor || "#38d6ff");
            exitBtn.setAttribute("title", session.resolvedTexts.exitTooltip || "Revenir au jeu principal");
            resetBtn.setAttribute("title", session.resolvedTexts.resetTooltip || "Recommencer");
            if (infoBtn) infoBtn.setAttribute("title", session.resolvedTexts.infoTooltip || "Titre, description, objectif et contrôles");
            mmDriftBadge.textContent = session.resolvedTexts.driftBadgeText || "DRIFT";
            mmTurboBadge.textContent = session.resolvedTexts.turboBadgeText || "TURBO";
            if (session.hintBar && session.meta.controls) {
              session.hintBar.textContent = session.meta.controls;
              if (!session.hintBar.parentElement) bottomArea.appendChild(session.hintBar);
            }
            if (session.fireBtn) {
              const cfgAction = session.resolvedTexts.actionLabel || session.resolvedTexts.boostReadyLabel || session.resolvedTexts.fireButtonLabel;
              if (cfgAction && String(cfgAction).trim()) {
                session.fireBtn.textContent = String(cfgAction).trim();
              } else if (typeof d.actionLabel === "string" && d.actionLabel.trim()) {
                session.fireBtn.textContent = d.actionLabel.trim();
              }
            }
            if (d.capabilities && typeof d.capabilities === "object") {
              session.capabilities = d.capabilities;
              if (d.capabilities.audio) {
                audioBtn.style.display = "inline-flex";
                stage.classList.add("has-top-extras");
              }
              if (d.capabilities.settings) {
                settingsBtn.style.display = "inline-flex";
                stage.classList.add("has-top-extras");
              }
              if (d.capabilities.minimap) stage.classList.add("has-minimap");
            }
            const nextLayoutMode = resolveLayoutMode(session.displayMode, session.meta, session.capabilities);
            const nextFullFrame = nextLayoutMode === "fullframe";
            const nextOwnExit = resolveOwnExit(session.meta, session.capabilities);
            session.layoutMode = nextLayoutMode;
            session.isFullFrame = nextFullFrame;
            session.ownExit = nextOwnExit;
            if (session.overlay) {
              session.overlay.classList.toggle("is-fullframe", nextFullFrame);
              session.overlay.classList.toggle("layout-circle", nextLayoutMode === "circle");
              session.overlay.classList.toggle("layout-rectangle", nextLayoutMode === "rectangle");
              session.overlay.classList.toggle("has-own-exit", nextFullFrame && nextOwnExit);
            }
            if (d.minimapTrack) {
              session.minimapTrack = d.minimapTrack;
              drawMinimap();
            }
            if (d.controlState) {
              session.controlState = d.controlState;
              buildExternalControls();
            }
            if (d.settingsState) {
              session.settingsState = d.settingsState;
              syncQuickPickers();
            }
            try {
              if (iframe.contentWindow) {
                session.configSent = true;
                iframe.contentWindow.postMessage({
                  type: "minigd_config",
                  meta: session.meta,
                  params: session.resolvedParams,
                  texts: session.resolvedTexts,
                  custom: Object.assign({}, session.resolvedParams, { texts: session.resolvedTexts }),
                }, "*");
                if (session.hasStarted && !session.infoOpen && !session.settingsOpen && !session.exiting && !session.aborted) {
                  iframe.contentWindow.postMessage({ type: "minigd_start" }, "*");
                } else {
                  iframe.contentWindow.postMessage({ type: "minigd_pause" }, "*");
                }
              }
            } catch (_e) {}
            if (session.resolveReady) {
              const r = session.resolveReady;
              session.resolveReady = null;
              r();
            }
          } else if (d.type === "minigd_stats") {
            if (session.statsBar && typeof d.text === "string") {
              session.statsBar.textContent = d.text;
            }
            if (session.fireBtn) {
              if (typeof d.actionLabel === "string" && d.actionLabel.trim()) {
                session.fireBtn.textContent = d.actionLabel.trim();
              } else if (typeof d.shotActive === "boolean") {
                session.fireBtn.textContent = d.shotActive
                  ? (session.resolvedTexts.detonateButtonLabel || "💥 DÉTONER !")
                  : (session.resolvedTexts.fireButtonLabel || "💥 TIRER");
              }
            }
          } else if (d.type === "minigd_audio_state") {
            session.audioEnabled = Boolean(d.enabled);
            audioBtn.textContent = session.audioEnabled ? "🔊" : "🔇";
          } else if (d.type === "minigd_controls_state" && d.controlState) {
            session.controlState = d.controlState;
            buildExternalControls();
          } else if (d.type === "minigd_settings_state" && d.settingsState) {
            const nextCtrl = d.settingsState.controlType;
            session.settingsState = d.settingsState;
            syncQuickPickers();
            if (session.settingsOpen && (pendingSettingsModalRebuild || nextCtrl !== lastRenderedControlType)) {
              renderSettingsModalContent();
            }
          } else if (d.type === "minigd_minimap_track") {
            session.minimapTrack = { points: d.points || [], bounds: d.bounds || null };
            drawMinimap();
          } else if (d.type === "minigd_minimap_state") {
            session.minimapState = d;
            drawMinimap();
          } else if (d.type === "minigd_exit" || d.type === "spawn_minigame_result") {
            if (!session.resultRecorded && (d.type === "spawn_minigame_result" || d.won !== undefined || d.score !== undefined)) {
              session.resultRecorded = true;
              const won = Boolean(d.won);
              const score = Number.isFinite(Number(d.score)) ? Number(d.score) : 0;
              const targetKey = session.targetKey || (session.meta && session.meta.path) || "";
              if (host.progress && typeof host.progress.recordMiniGDResult === "function" && targetKey) {
                const outcome = host.progress.recordMiniGDResult(targetKey, { won, score, stats: d.stats || {} });
                if (won) {
                  const effRewards = Object.assign({}, (session.meta && session.meta.rewards) || {}, session.launchRewards || {});
                  if (Object.keys(effRewards).length > 0 && typeof host.progress.grantRewards === "function") {
                    host.progress.grantRewards(effRewards, { isFirstWin: Boolean(outcome && outcome.isFirstWin), score });
                  }
                }
              }
            }
            exitMiniGame();
          }
        };
        window.addEventListener("message", session.onMessage);

        session.onKeyDown = (e) => {
          if (session.aborted) return;
          if (session.awaitingStart && !session.settingsOpen && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            e.stopPropagation();
            startPausedMiniGame(true);
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            if (session.settingsOpen) {
              closeSettingsModal();
            } else if (session.infoOpen) {
              toggleInfo(false);
            } else if (session.interactive && !session.exiting) {
              exitMiniGame();
            }
          }
        };
        window.addEventListener("keydown", session.onKeyDown, true);

        // 2. Pré-calcul unique du fond flouté puis fondu enchaîné (0 -> 1) : fluide 60-120fps et zéro saut d'image !
        const frozenBg = createFrozenBlurredBg(session, canvas);
        if (!frozenBg && canvas) {
          canvas.style.willChange = "filter";
          canvas.style.filter = "blur(0px)";
        }
        const mainBlurPromise = animateValue(session, blurDurationMs, (e) => {
          if (frozenBg) {
            frozenBg.style.opacity = String(e.toFixed(4));
          } else if (canvas) {
            canvas.style.filter = `blur(${(e * blurRadiusPx).toFixed(2)}px)`;
          }
          overlay.style.background = `rgba(4, 8, 16, ${(0.52 * e).toFixed(3)})`;
        });

        const overlapDelayMs = Math.round(blurDurationMs * (2 / 3));
        const waitOverlapPromise = new Promise((resolve) => {
          const tid = setTimeout(resolve, overlapDelayMs);
          session.timerIds.add(tid);
        });

        await waitOverlapPromise;
        if (session.aborted) return;

        // S'assurer que le mini-jeu est prêt et en pause avant de l'afficher
        await session.readyPromise;
        if (session.aborted) return;
        try {
          if (iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: "minigd_pause" }, "*");
          }
        } catch (_e) {}

        // 3. Le mini-jeu apparaît en fondu alpha par-dessus, flou et en pause (chevauche la fin du floutage principal)
        const fadeInPromise = animateValue(session, fadeDurationMs, (e) => {
          stage.style.opacity = String(e.toFixed(4));
        });

        await Promise.all([mainBlurPromise, fadeInPromise]);
        if (session.aborted) return;

        // Une fois frozenBg 100% opaque, masquer le gros canvas principal (0 pixel de changement visuel !)
        if (frozenBg) {
          frozenBg.style.opacity = "1";
          frozenBg.style.willChange = "";
          if (canvas) canvas.style.visibility = "hidden";
        } else if (canvas) {
          canvas.style.willChange = "";
        }

        // 4. Le mini-jeu se dé-floute et devient net en 1 seconde
        await animateFilterCss(session, iframe, blurRadiusPx, 0, blurDurationMs);
        if (session.aborted) return;
        iframe.style.transition = "";
        iframe.style.filter = "none";
        iframe.style.willChange = "";
        stage.style.willChange = "";

        // 5. Initialisation du mini-jeu puis affichage optionnel du résumé en pause avant démarrage
        session.interactive = true;
        exitBtn.disabled = false;
        exitBtn.style.pointerEvents = "auto";
        resetBtn.disabled = false;
        resetBtn.style.pointerEvents = "auto";
        audioBtn.disabled = false;
        audioBtn.style.pointerEvents = "auto";
        settingsBtn.disabled = false;
        settingsBtn.style.pointerEvents = "auto";

        try {
          if (iframe.contentWindow && !session.configSent) {
            session.configSent = true;
            iframe.contentWindow.postMessage({
              type: "spawn_minigame_init",
              meta: session.meta,
              params: session.resolvedParams,
              texts: session.resolvedTexts,
              custom: Object.assign({}, session.resolvedParams, { texts: session.resolvedTexts }),
            }, "*");
            iframe.contentWindow.postMessage({ type: "minigd_pause" }, "*");
          }
        } catch (_e) {}

        const onHostReturnVisible = () => {
          if (document.hidden || session.aborted || session.exiting) return;
          if (session.hasStarted && !session.awaitingStart && !session.infoOpen && !session.settingsOpen) {
            sendIframeMsg({ type: "minigd_resume" });
          }
        };
        document.addEventListener("visibilitychange", onHostReturnVisible);
        window.addEventListener("focus", onHostReturnVisible);
        session.cleanupFns.add(() => {
          document.removeEventListener("visibilitychange", onHostReturnVisible);
          window.removeEventListener("focus", onHostReturnVisible);
        });

        if (effectiveShowSummary) {
          session.awaitingStart = true;
          session.infoOpen = true;
          setQuickPickersEnabled(false);
          iframe.style.pointerEvents = "none";
          extControls.style.pointerEvents = "none";
          fireBtn.disabled = true;
          fireBtn.style.pointerEvents = "none";
          renderInfoCard(infoCard, session.meta, () => startPausedMiniGame(true), { isStart: true, texts: session.resolvedTexts });
          infoAnimating = true;
          await animateInfoCardFadeBlur(session, infoCard, true, fadeDurationMs);
          infoAnimating = false;
        } else {
          startPausedMiniGame(false);
        }
      }

      // API dynamique pour associer / retirer des miniGD sur des ancres à tout moment
      window.AssemblageMiniGD = {
        _owner: FILENAME,
        registerAnchor: registerAnchorBinding,
        unregisterAnchor: unregisterAnchorBinding,
        getBindings: getAnchorBindings,
        launch: (minigamePath, opts) => launchMiniGame(Object.assign({}, opts || {}, { minigamePath: minigamePath || "" })),
      };
      if (host.services && typeof host.services.provide === "function") {
        host.services.provide("minigd", window.AssemblageMiniGD);
      }

      // Surveillance dynamique de proximité sur toutes les ancres associées
      host.hooks.after("update", () => {
        if (destroyedExt || activeSession || bindingsMap.size === 0) return;
        if (host.game.isAnyUIOpen()) return;
        for (const binding of bindingsMap.values()) {
          const dist = host.game.getAnchorDistance(binding.anchorId);
          if (dist === null || !Number.isFinite(dist)) continue;
          if (!binding.armed) {
            if (dist >= binding.resetRadiusM) {
              binding.armed = true;
            }
          } else if (dist <= binding.triggerRadiusM) {
            binding.armed = false;
            launchMiniGame({
              minigamePath: binding.minigamePath,
              anchorId: binding.anchorId,
              showSummaryOnStart: binding.showSummaryOnStart,
              displayMode: binding.displayMode || "",
            });
            break;
          }
        }
      });

      // Bouton dans Paramètres pour relancer le mini-jeu par défaut à tout moment
      host.ui.addSettingButton({
        id: "transition_minigd_launch",
        label: ext.name || "Transition vers MiniGD",
        desc: "Lance un mini-jeu depuis extensions/minigd/ avec transition floutée.",
        buttonText: settingButtonLabel,
        onClick: () => {
          launchMiniGame();
        },
      });

      // Déclenchement automatique lors de l'activation uniquement si l'extension n'est pas en mode persistant "always"
      const condType = (ext && ext.condition && ext.condition.type) ? String(ext.condition.type) : "";
      if (!ext.isSilentRestore && condType !== "always") {
        if (host.ui.isTitleCardPending(ext.filename || FILENAME)) {
          unsubTitleCard = host.ui.onTitleCardClosed(() => {
            const fn = unsubTitleCard;
            unsubTitleCard = null;
            if (fn) fn();
            if (!destroyedExt) launchMiniGame();
          }, { filename: ext.filename || FILENAME });
        } else {
          launchMiniGame();
        }
      }
    },
    onDeactivate() {},
  };
})();
</script>
</body>
</html>
